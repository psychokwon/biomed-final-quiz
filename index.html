ium; tunica media with endocardium; tunica adventitia with myocardium","Tunica intima with myocardium; tunica media with epicardium; tunica adventitia with endocardium","Tunica intima with pericardium; tunica media with endocardium; tunica adventitia with myocardium","Tunica intima with endocardium; tunica media with pericardium; tunica adventitia with myocardium"],"a":0,"qk":"혈관 벽 층과 심장 벽 층을 올바르게 짝지은 것은?","ok":["속막-심내막, 중간막-심근, 바깥막-심외막","속막-심외막, 중간막-심내막, 바깥막-심근","속막-심근, 중간막-심외막, 바깥막-심내막","속막-심막, 중간막-심내막, 바깥막-심근","속막-심내막, 중간막-심막, 바깥막-심근"],"exp":"혈관 벽과 심장 벽은 같은 세 층 논리로 대응합니다. **속막(tunica intima)**은 **심내막(endocardium)**, **중간막(tunica media)**은 **심근(myocardium)**, **바깥막(tunica adventitia)**은 **심외막(epicardium)**에 해당합니다.\n\n전체 순환 개요에서도 큰 정맥·탄성동맥·근성동맥·세동맥·세정맥·창모세혈관·연속모세혈관이 같은 층 구조의 변주로 그려집니다. 심장을 둘러싸는 **심막(pericardium)**은 섬유탄성 결합조직(fibroelastic CT)으로 되어 있으며, 심장이 너무 늘어나지 않도록 **팽창을 제한**합니다. 심막은 심장 벽 세 층의 대응 짝이 아니라, 그 바깥을 감싸는 주머니입니다.","why":{"1":"속막은 심외막이 아니라 심내막에, 중간막은 심근에, 바깥막은 심외막에 대응합니다.","2":"층 순서가 모두 뒤바뀌었습니다. 가장 안쪽이 속막-심내막입니다.","3":"심막은 심장 벽의 대응 층이 아니라 심장을 둘러싸 팽창을 제한하는 섬유탄성 주머니입니다.","4":"중간막의 짝은 심막이 아니라 심근입니다."},"one":"속막=심내막, 중간막=심근, 바깥막=심외막이며, 섬유탄성 심막이 심장 팽창을 제한합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 2, 3","img":[{"u":"img/w11_cv_histo/p02.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 2"},{"u":"img/w11_cv_histo/p03.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 3"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-2":{"q":"From the heart chamber outward, which sequence of layers is correct?","o":["Myocardium, endocardium, fibrous pericardium, pericardial cavity, epicardium, parietal pleura","Fibrous pericardium, visceral serous pericardium, myocardium, endocardium, parietal pleura","Endocardium, myocardium, epicardium, pericardial cavity, parietal serous layer, fibrous pericardium","Endocardium, pericardial cavity, myocardium, fibrous pericardium, epicardium, parietal pleura","Epicardium, myocardium, endocardium, pericardial cavity, fibrous pericardium, parietal pleura"],"a":2,"qk":"심장 방 안쪽에서 바깥쪽으로 층의 순서가 올바른 것은?","ok":["심근, 심내막, 섬유성 심막, 심막강, 심외막","섬유성 심막, 내장측 장액성 심막, 심근, 심내막","심내막, 심근, 심외막, 심막강, 벽측 장액층, 섬유성 심막","심내막, 심막강, 심근, 섬유성 심막, 심외막","심외막, 심근, 심내막, 심막강, 섬유성 심막"],"exp":"심장 방 안쪽부터 바깥으로 가면 **심내막(endocardium)** → **심근(myocardium)** → **심외막(epicardium)** 순서입니다. 심외막에는 지방조직이 있고, 그 표면이 **내장측 장액성 심막(visceral layer of serous pericardium)**입니다.\n\n그 바깥의 잠재공간이 **심막강(pericardial cavity)**이고, 이어서 **벽측 장액성 심막(parietal layer)**과 가장 바깥의 **섬유성 심막(fibrous pericardium)**이 옵니다. 심막강은 심근 안이 아니라 내장측층과 벽측층 사이에 있습니다.","why":{"0":"심내막이 가장 안쪽이어야 하며, 섬유성 심막은 가장 바깥입니다. 순서가 뒤섞였습니다.","1":"섬유성 심막은 가장 바깥이지 가장 안쪽이 아닙니다.","3":"심막강은 심내막과 심근 사이가 아니라, 내장측 장액층(심외막)과 벽측 장액층 사이입니다.","4":"심외막이 가장 안쪽일 수 없습니다. 방 내면은 심내막입니다."},"one":"안쪽부터 심내막–심근–심외막(내장측 장액층)–심막강–벽측 장액층–섬유성 심막 순서입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 4","img":[{"u":"img/w11_cv_histo/p04.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 4"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-3":{"q":"The free surface of the pericardium is lined by which tissue?","o":["Stratified squamous keratinized epithelium","Transitional epithelium","Ciliated pseudostratified columnar epithelium","Hyaline cartilage","Mesothelium"],"a":4,"qk":"심막의 자유면을 덮는 조직은?","ok":["각질화된 중층편평상피","이행상피","섬모가 있는 거짓중층원주상피","유리연골","중피(mesothelium)"],"exp":"심막의 자유면은 **중피(mesothelium)**로 덮여 있습니다. 중피는 장막을 덮는 단층편평상피로, 조직 표본에서 결합조직 표면의 얇고 진한 세포 줄로 보입니다.\n\n이 중피가 장액을 분비하여 내장측층과 벽측층이 심장 박동 때 부드럽게 미끄러지게 합니다. 피부처럼 각질화된 중층편평상피나, 기도의 섬모 상피, 방광의 이행상피와는 다릅니다.","why":{"0":"각질화된 중층편평상피는 피부 표피의 특징이며 심막을 덮지 않습니다.","1":"이행상피는 요로(신우·방광 등)의 상피입니다.","2":"섬모 거짓중층원주상피는 호흡기도의 전형적인 상피입니다.","3":"유리연골은 기관·관절면 등에 있으며 심막 표면을 덮지 않습니다."},"one":"심막의 자유면은 장액을 분비하는 중피(mesothelium)로 덮여 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 5","img":[{"u":"img/w11_cv_histo/p05.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 5"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-4":{"q":"Coronary arteries are embedded in which layer of the heart wall?","o":["Endocardium","Epicardium","The subendocardial Purkinje layer only","The fibrous pericardium exclusive of fat","The parietal pleura"],"a":1,"qk":"관상동맥이 묻혀 있는 심장 벽의 층은?","ok":["심내막(endocardium)","심외막(epicardium)","심내막밑 푸르키네층만","지방이 없는 섬유성 심막만","벽측 가슴막"],"exp":"**심외막(epicardium)**은 **중피(mesothelium)**로 덮여 장액을 분비하고, 심근에 유착되어 있습니다. 이 층에는 정맥, 신경, 지방이 있는 **성긴 결합조직**이 포함되며, **관상동맥은 이 층에 묻혀** 있습니다.\n\n표본에서는 표면의 중피, 그 아래 결합조직과 신경, 지방, 그리고 심근이 차례로 보입니다. 관상동맥이 심내막이나 섬유성 심막이 아니라 심외막 지방 속에 있다는 점이 임상적으로도 중요합니다.","why":{"0":"심내막은 방 내면의 층이며 관상동맥이 묻히는 곳이 아닙니다.","2":"푸르키네 섬유는 심실 심내막 바로 밑(심내막밑)에 있으며, 관상동맥 위치는 심외막입니다.","3":"섬유성 심막은 가장 바깥 주머니이고, 관상동맥은 심장 표면의 심외막에 있습니다.","4":"벽측 가슴막은 흉강을 덮으며 심장 벽의 층이 아닙니다."},"one":"관상동맥은 중피와 성긴결합조직·지방·신경을 포함하는 심외막에 묻혀 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 6","img":[{"u":"img/w11_cv_histo/p06.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 6"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-5":{"q":"Atrial myocardium is relatively thin and is the source of which hormone?","o":["Antidiuretic hormone","Erythropoietin","Thyroxine","Atrial natriuretic peptide","Parathyroid hormone"],"a":3,"qk":"비교적 얇은 심방 심근이 분비하는 호르몬은?","ok":["항이뇨호르몬(ADH)","에리트로포이에틴(erythropoietin)","티록신(thyroxine)","심방나트륨이뇨펩타이드(atrial natriuretic peptide)","부갑상선호르몬(PTH)"],"exp":"심방 심근은 심실보다 **비교적 얇고**, 심외막 근처에 **지방 침윤**이 있으며, **심방나트륨이뇨펩타이드(atrial natriuretic peptide, ANP)**를 만듭니다.\n\n심방이 늘어나면 ANP가 나와 나트륨과 수분의 배설을 늘리고 혈관을 이완시켜 혈액량을 줄입니다. 반면 심실 심근은 더 두껍고(특히 왼심실), 근육 섬유가 나선형으로 배열되며, 심장골격에 붙고, 혈관 분포가 풍부합니다.","why":{"0":"항이뇨호르몬은 시상하부에서 만들어져 후엽에서 분비됩니다.","1":"에리트로포이에틴은 주로 콩팥에서 분비됩니다.","2":"티록신은 갑상선 호르몬입니다.","4":"부갑상선호르몬은 부갑상선에서 나옵니다."},"one":"심방 심근은 얇고 ANP를 분비하며, 심실은 더 두껍고 나선형으로 배열됩니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7","img":[{"u":"img/w11_cv_histo/p07.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-6":{"q":"Ventricular muscle fibers are attached to the cardiac skeleton and are arranged:","o":["Spirally","As a single straight longitudinal band only","In concentric bony rings like osteons","As a random unattached mesh with no skeleton insertion","Exclusively as circular fibers around the atria"],"a":0,"qk":"심실 근섬유는 심장골격에 부착되며, 배열 방식은?","ok":["나선형(spirally)","하나의 곧은 세로 다발만","뼈단위처럼 동심원 골륜","골격에 붙지 않는 무작위 그물","심방만을 도는 고리 섬유만"],"exp":"심실 심근은 특히 왼심실에서 두껍고, 근섬유가 **나선형(spirally)**으로 배열됩니다. 이 섬유들은 **심장골격(cardiac skeleton)**에 부착되며, 혈관 공급이 풍부합니다.\n\n나선형 배열 덕분에 심실은 단순히 조여지기만 하는 것이 아니라 비틀며 짜내듯 수축하여 혈액을 효과적으로 내보냅니다. 그림에서도 심실 벽의 근육이 심장 주위를 감아 내려가는 모습으로 나타납니다.","why":{"1":"심실 근섬유는 하나의 곧은 세로 다발이 아니라 나선형으로 감깁니다.","2":"동심원 골륜은 뼈의 뼈단위(osteon) 구조이며 심근이 아닙니다.","3":"심실 섬유는 심장골격에 부착됩니다.","4":"나선형 배열은 심실의 특징입니다. 심방 주위 고리만 있는 것이 아닙니다."},"one":"심실 근섬유는 나선형으로 배열되어 심장골격에 붙으며, 특히 왼심실이 두껍습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7, 8","img":[{"u":"img/w11_cv_histo/p07.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 7"},{"u":"img/w11_cv_histo/p08.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 8"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-7":{"q":"Compared with ventricular endocardium, atrial endocardium is:","o":["Thinner and irregular, and distant from any conducting fibers of the wall","Absent, because atria are lined only by myocardium","Thicker and smoother, with fibroelastic tissue and few smooth muscle cells","Composed of hyaline cartilage and osteoid","Identical in thickness, but lined by mesothelium rather than endothelium"],"a":2,"qk":"심실 심내막과 비교할 때 심방 심내막의 특징은?","ok":["더 얇고 불규칙하며 전도 섬유와 멀리 떨어져 있다","없고, 심방은 심근만으로 덮인다","더 두껍고 매끈하며, 섬유탄성 결합조직과 소수의 민무늬근세포를 포함한다","유리연골과 골양조직으로 되어 있다","두께는 같으나 내피가 아니라 중피로 덮인다"],"exp":"**심방 심내막**은 심실보다 **두껍고**, 모습이 **매끈**하며, **섬유탄성 결합조직**을 포함하고 **민무늬근세포가 소수** 있습니다.\n\n반면 **심실 심내막**은 **더 얇고 불규칙**하며, **푸르키네 섬유(Purkinje fibers)**에 인접합니다. 표본에서 심실 쪽에는 심내막 바로 아래 크고 옅게 염색되는 푸르키네 세포가 보입니다.","why":{"0":"더 얇고 불규칙한 것은 심실 심내막의 특징입니다.","1":"심방에도 심내막이 있으며, 오히려 심실보다 두껍습니다.","3":"심내막은 연골이나 골양조직이 아닙니다.","4":"심내막 표면은 내피(endothelium)입니다. 중피는 심외막·심막 표면입니다. 두께도 같지 않습니다."},"one":"심방 심내막은 더 두껍고 매끈하며, 심실 심내막은 얇고 불규칙하고 푸르키네 섬유에 인접합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 9","img":[{"u":"img/w11_cv_histo/p09.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 9"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-8":{"q":"Purkinje fibers lie in the subendocardium of the inner ventricular walls and, compared with cardiomyocytes, are:","o":["Smaller, with more myofibrils and fewer mitochondria","Identical in size, with no difference in conduction speed","Larger, with more myofibrils and no mitochondria","Confined to the epicardial fat around coronary arteries","Larger, with fewer myofibrils, many mitochondria, and faster conduction"],"a":4,"qk":"푸르키네 섬유는 심실 내벽의 심내막밑(subendocardium)에 있으며, 심근세포와 비교하면?","ok":["더 작고, 근원섬유는 더 많으며 미토콘드리아는 적다","크기가 같고 전도 속도도 차이가 없다","더 크지만 근원섬유가 더 많고 미토콘드리아가 없다","관상동맥 주위 심외막 지방에만 국한된다","더 크고, 근원섬유는 적으며 미토콘드리아가 많아 더 빨리 전도한다"],"exp":"**푸르키네 섬유(Purkinje fibers)**는 심실 내벽에서 **심내막 바로 밑의 심내막밑(subendocardium)**에 있습니다. 표본에서도 내강 쪽 심내막과 깊은 쪽 심근 사이에 크고 옅은 세포로 보입니다.\n\n이 세포는 일반 심근세포보다 **크고**, **근원섬유(myofibrils)는 적으며**, **미토콘드리아는 많습니다**. 활동전위를 다른 심장 세포보다 **더 빠르고 효율적으로** 전하여 좌우 심실이 동기화되어 수축하게 합니다.","why":{"0":"반대로, 푸르키네 세포는 더 크고 근원섬유는 적으며 미토콘드리아가 많습니다.","1":"크기와 전도 속도 모두 일반 심근세포와 다릅니다. 푸르키네 섬유가 더 빠릅니다.","2":"큰 것은 맞지만, 근원섬유는 더 많지 않고 적습니다. 미토콘드리아도 없습니다가 아니라 많습니다.","3":"관상동맥이 묻힌 심외막이 아니라, 심실 심내막 밑입니다."},"one":"푸르키네 섬유는 심내막밑에 있는 큰 전도세포로, 근원섬유는 적고 미토콘드리아가 많아 빠르게 전도합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 10, 11","img":[{"u":"img/w11_cv_histo/p10.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 10"},{"u":"img/w11_cv_histo/p11.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 11"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-9":{"q":"The cardiac skeleton consists of dense connective tissue that separates atria from ventricles and includes valves made of fibrous connective tissue lined by:","o":["Mesothelium","Endothelium","Keratinized epidermis","Hyaline cartilage","Osteoblasts"],"a":1,"qk":"심장골격은 심방과 심실을 가르는 치밀결합조직이며, 여기에 포함된 판막은 섬유성 결합조직으로 되어 있고 무엇으로 덮이는가?","ok":["중피(mesothelium)","내피(endothelium)","각질화된 표피","유리연골","골모세포"],"exp":"**심장골격(cardiac skeleton)**은 **치밀결합조직(dense connective tissue)**으로 되어 있습니다. **심방과 심실을 분리**하고, **심근의 부착점**이 되며, **심장판막**을 포함합니다.\n\n판막은 **섬유성 결합조직**으로 만들어지고 표면은 **내피(endothelium)**로 덮입니다. 내피가 연속되어야 혈전과 난류를 줄일 수 있습니다. 중피는 심외막·심막 표면의 덮개입니다.","why":{"0":"중피는 심외막과 심막의 자유면을 덮습니다. 판막 표면은 내피입니다.","2":"각질화된 표피는 피부이며 판막에 없습니다.","3":"정상 심장판막은 유리연골이 아니라 섬유성 결합조직입니다.","4":"골모세포는 뼈를 만드는 세포이며 판막 덮개가 아닙니다."},"one":"심장골격은 치밀결합조직으로 방실을 가르고 심근 부착점이 되며, 판막은 섬유성 결합조직을 내피가 덮습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 12","img":[{"u":"img/w11_cv_histo/p12.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 12"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-10":{"q":"In a histologic section of an atrioventricular valve stained so that dense collagen appears blue, the thin strands extending from the cusp (labeled CT) are:","o":["Purkinje fibers of the subendocardium","Coronary arteries in epicardial fat","Pectinate muscles of the atrial wall","Chordae tendineae","Fenestrated elastic laminae of the aorta"],"a":3,"qk":"방실판 조직 표본에서 치밀 교원이 푸르게 보일 때, 첨판에서 뻗어 나온 가는 줄(CT)은 무엇인가?","ok":["심내막밑의 푸르키네 섬유","심외막 지방의 관상동맥","심방 벽의 빗살근","힘줄끈(chordae tendineae)","대동맥의 창탄성판"],"exp":"방실판 표본에서 푸르게 진하게 염색된 부분은 판막 첨판의 **치밀 결합조직(심장골격의 일부)**입니다. 첨판에서 심실 쪽으로 늘어지는 가는 줄(CT)은 **힘줄끈(chordae tendineae)**입니다.\n\n힘줄끈은 첨판을 유두근에 연결하여 수축기 때 판막이 심방 쪽으로 뒤집히지 않게 합니다. 첨판 표면의 얇은 덮개는 내피이고, 아래쪽의 붉은 조직은 심근입니다.","why":{"0":"푸르키네 섬유는 심실 심내막 밑의 큰 전도세포이며, 판막 첨판에서 늘어지는 힘줄끈이 아닙니다.","1":"관상동맥은 심외막 지방에 묻혀 있으며 이 판막 단면의 가는 줄이 아닙니다.","2":"빗살근은 심방(특히 심방귀) 내면의 근육능선입니다.","4":"창탄성판은 탄성동맥 중간막의 구조입니다."},"one":"방실판 첨판의 치밀결합조직에서 뻗는 가는 줄은 힘줄끈(chordae tendineae)입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 13","img":[{"u":"img/w11_cv_histo/p13.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 13"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-11":{"q":"The sinoatrial node is called the pacemaker of the heart because its cells have a “leaky” plasma membrane that allows generation of action potentials. These cells are:","o":["Small muscle cells in the right atrial wall, with sympathetic and parasympathetic innervation","Large Purkinje cells confined to the left ventricular apex, without autonomic nerves","Smooth muscle cells of the aortic tunica media, without a pacemaker role","Fibroblasts of the fibrous pericardium, forming only the outer sac","Mesothelial cells of the parietal pleura, lining the thoracic cavity wall"],"a":0,"qk":"굴심방결절이 심장의 페이스메이커로 불리는 이유는 ‘새는’ 세포막으로 활동전위를 만들기 때문이다. 이 세포는?","ok":["오른심방 벽의 작은 근세포이며, 교감·부교감 지배를 받는다","왼심실 심첨에만 있는 큰 푸르키네 세포","대동맥 중간막의 민무늬근세포","섬유성 심막의 섬유모세포","벽측 가슴막의 중피세포"],"exp":"조직학적으로 **굴심방결절**은 **오른심방 벽**에 있으며 **작은 근세포**로 이루어집니다. 동맥과 신경 공급을 받고, **교감과 부교감 지배를 모두** 받습니다.\n\n세포막이 **‘새는(leaky)’** 성질을 가져 자발적으로 활동전위를 만들 수 있어 **페이스메이커**라고 합니다. 푸르키네 섬유처럼 큰 세포가 아니라, 결절에서는 오히려 작은 근세포가 특징입니다.","why":{"1":"큰 푸르키네 세포는 심실 심내막밑에 있으며, 굴심방결절 세포는 오른심방 벽의 작은 근세포입니다.","2":"대동맥 중간막의 민무늬근은 혈관 조절을 하며 페이스메이커가 아닙니다.","3":"섬유성 심막의 섬유모세포는 자극을 시작하지 않습니다.","4":"벽측 가슴막 중피는 흉강을 덮는 장막 세포입니다."},"one":"굴심방결절은 오른심방 벽의 작은 근세포로, 이중 지배를 받으며 새는 막으로 자발 발화하는 페이스메이커입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 14","img":[{"u":"img/w11_cv_histo/p14.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 14"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-12":{"q":"In a histologic section of the sinoatrial node region, the artery that supplies the node is identified as the:","o":["Anterior interventricular artery","Musculophrenic artery","SA nodal artery","Posterior interventricular artery","Left marginal artery"],"a":2,"qk":"굴심방결절 부위의 조직 표본에서, 결절에 혈액을 공급하는 동맥은 무엇으로 표시되는가?","ok":["앞심실사이동맥","근횡격막동맥","굴심방결절동맥(SA nodal artery)","뒤심실사이동맥","왼모서리동맥"],"exp":"굴심방결절 조직 표본의 한가운데에는 뚜렷한 혈관 단면이 있고, 이것이 **굴심방결절동맥(SA nodal artery)**입니다. 결절 조직(작은 근세포 무리)이 이 동맥 옆에 타원으로 표시되어 있습니다.\n\n주변에 지방이 많은 것은 이 부위가 오른심방 벽, 상대정맥 입구 근처의 심장외막밑이기 때문입니다. 결절은 이 동맥과 신경의 공급을 받습니다.","why":{"0":"앞심실사이동맥은 왼관상동맥의 가지로 앞심실사이고랑을 달립니다.","1":"근횡격막동맥은 심막 아래쪽을 공급하는 속가슴동맥 가지입니다.","3":"뒤심실사이동맥은 주로 오른관상동맥의 가지로 뒤심실사이고랑을 달립니다.","4":"왼모서리동맥은 왼관상동맥의 가지로 왼심실 가장자리를 공급합니다."},"one":"굴심방결절 표본에서는 결절 옆에 굴심방결절동맥(SA nodal artery)이 보입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 15","img":[{"u":"img/w11_cv_histo/p15.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 15"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-13":{"q":"The atrioventricular bundle (of His) is formed of small cardiac muscle cells that penetrate the cardiac skeleton, then show a gradual increase in cell size and terminate in:","o":["Pectinate muscles of the right auricle","Mesothelium of the fibrous pericardium","Smooth muscle of the tunica media","Chordae tendineae of the mitral valve only","Purkinje fibers"],"a":4,"qk":"방실다발(His 다발)은 심장골격을 뚫는 작은 심근세포로 이루어지고, 세포 크기가 점차 커진 뒤 어디에서 끝나는가?","ok":["오른심방귀의 빗살근","섬유성 심막의 중피","중간막의 민무늬근","승모판의 힘줄끈만","푸르키네 섬유(Purkinje fibers)"],"exp":"**방실결절(A-V node)**은 심방에서 온 활동전위를 받습니다. **방실다발(A-V bundle of His)**은 **작은 심근세포**로 되어 있으며 **심장골격을 뚫고** 지나가 심실 쪽으로 유일한 전기 통로가 됩니다.\n\n이후 **오른·왼다발가지**로 나뉘고, 세포 크기가 **점차 커지며**, 전도 섬유는 결국 **푸르키네 섬유**에서 끝납니다. 심장골격이 심방과 심실을 절연하므로, 이 다발이 없다면 자극이 심실로 넘어가지 못합니다.","why":{"0":"빗살근은 심방(귀)의 수축성 근육이며 방실다발의 종착점이 아닙니다.","1":"섬유성 심막 중피는 전도계가 아닙니다.","2":"혈관 중간막의 민무늬근은 방실다발의 종착점이 아닙니다.","3":"힘줄끈은 판막을 유두근에 연결하는 구조이며 전도 섬유의 끝이 아닙니다."},"one":"방실다발은 심장골격을 뚫는 작은 심근세포로, 다발가지로 나뉜 뒤 크기가 커져 푸르키네 섬유에서 끝납니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 16","img":[{"u":"img/w11_cv_histo/p16.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 16"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-14":{"q":"Purkinje fibers are large impulse-conducting cells deep to the ventricular endocardium. They stain lightly primarily because their cytoplasm contains abundant:","o":["Myelin","Glycogen","Keratin","Osteoid","Hemosiderin"],"a":1,"qk":"푸르키네 섬유는 심실 심내막 깊은 쪽의 큰 전도세포이다. 세포질이 옅게 염색되는 주된 이유는 무엇이 풍부하기 때문인가?","ok":["수초(myelin)","글리코젠(glycogen)","케라틴(keratin)","골양조직(osteoid)","혈철소(hemosiderin)"],"exp":"푸르키네 섬유는 **큰 자극전도세포**로, **심실 심내막의 깊은 쪽**에 있고 방실다발 가지의 끝에 있습니다. 세포질에 **글리코젠(glycogen)이 풍부**하여 일반 심근보다 **옅게 염색**됩니다.\n\n고배율에서는 근원섬유(MF)가 세포 주변부에 적게 남아 있고, 중심부는 글리코젠(G) 때문에 밝게 비어 보입니다. 이 형태를 보면 수축보다 전도에 특화된 세포임을 알 수 있습니다.","why":{"0":"수초는 많은 말초신경 축삭을 감싸는 지질막이며, 푸르키네 세포의 옅은 염색 이유가 아닙니다.","2":"케라틴은 상피의 중간섬유이며 푸르키네 세포질의 주된 성분이 아닙니다.","3":"골양조직은 뼈기질입니다.","4":"혈철소는 철 저장 색소로, 푸르키네 섬유의 정상 옅은 염색을 설명하지 않습니다."},"one":"푸르키네 섬유는 심실 심내막 깊은 쪽의 큰 전도세포로, 풍부한 글리코젠 때문에 옅게 염색됩니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 18","img":[{"u":"img/w11_cv_histo/p18.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 18"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-15":{"q":"The tunica intima always contains endothelium with an underlying basal lamina. The internal elastic lamina is present only in larger arteries, and pericytes are stem cells that can:","o":["Form the outer fibrous pericardium","Secret atrial natriuretic peptide","Myelinate Purkinje fibers","Replace damaged endothelial cells","Synthesize the enamel of developing teeth"],"a":3,"qk":"속막은 항상 내피와 그 밑의 기저판을 포함한다. 속탄성판은 큰 동맥에만 있고, 혈관주위세포(pericytes)는 줄기세포로서 무엇을 할 수 있는가?","ok":["바깥 섬유성 심막을 형성한다","심방나트륨이뇨펩타이드를 분비한다","푸르키네 섬유에 수초를 만든다","손상된 내피세포를 대체한다","발생 중인 치아의 법랑질을 합성한다"],"exp":"혈관의 **속막(tunica intima)**은 항상 **내피(endothelium)**와 그 밑의 **기저판(basal lamina)**을 가집니다. 그 아래에 얇은 결합조직인 **내피밑층(subendothelium)**이 있습니다. **속탄성판(internal elastic lamina)**은 **큰 동맥에만** 있습니다.\n\n**혈관주위세포(pericytes)**는 손상된 내피세포를 대체할 수 있는 **줄기세포**로 기술됩니다. 내피가 모든 혈관에 있는 공통 요소이고, 속탄성판은 큰 동맥의 추가 구조라는 점을 구분해야 합니다.","why":{"0":"섬유성 심막은 치밀 결합조직 주머니이며 혈관주위세포가 만드는 구조가 아닙니다.","1":"ANP는 심방 심근이 만듭니다.","2":"푸르키네 섬유는 수초가 있는 말초신경이 아닙니다.","4":"법랑질은 법랑모세포가 만듭니다."},"one":"속막은 항상 내피와 기저판을 갖고, 속탄성판은 큰 동맥에만 있으며, 혈관주위세포는 손상 내피를 대체할 수 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 19","img":[{"u":"img/w11_cv_histo/p19.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 19"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-16":{"q":"The tunica media typically contains smooth muscle plus elastic and reticular fibers, while the tunica adventitia contains type I collagen and elastic fibers and is supplied by:","o":["Vasa vasorum and innervated by sympathetic nerves","Purkinje fibers and the sinoatrial node","Lymph only, with no vessels or nerves in the wall","Fenestrated capillaries of the renal glomerulus alone","The atrioventricular bundle of His"],"a":0,"qk":"중간막에는 민무늬근과 탄성·그물섬유가 있고, 바깥막에는 I형 교원과 탄성섬유가 있다. 바깥막을 공급하는 것은?","ok":["혈관의 혈관(vasa vasorum)이며, 교감신경의 지배를 받는다","푸르키네 섬유와 굴심방결절","림프뿐이며 벽에는 혈관과 신경이 없다","콩팥 토리의 창모세혈관만","히스 방실다발"],"exp":"**중간막(tunica media)**은 보통 **민무늬근**을 담고, 흔히 **탄성섬유와 그물섬유**를 포함합니다. 큰 동맥에서는 **바깥탄성판(external elastic lamina)**이 중간막의 경계가 됩니다.\n\n**바깥막(tunica adventitia)**은 **I형 교원**과 **탄성섬유**로 되어 있고, 큰 혈관 벽 자체를 먹이는 작은 혈관인 **혈관의 혈관(vasa vasorum)**이 있으며, **교감신경**이 분포합니다. 주사전자현미경 사진에서는 내강, 내피, 속막·중간막·바깥막이 차례로 보입니다.","why":{"1":"푸르키네 섬유와 굴심방결절은 심장 전도계이지 혈관 바깥막의 영양·신경 공급이 아닙니다.","2":"바깥막에는 혈관의 혈관과 교감신경이 있습니다.","3":"콩팥 토리의 창모세혈관은 여과 특화 모세혈관이며 일반 혈관 바깥막을 공급하지 않습니다.","4":"방실다발은 심장 전도로입니다."},"one":"중간막은 민무늬근·탄성·그물섬유, 바깥막은 I형 교원·탄성섬유와 혈관의 혈관·교감신경을 가집니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 20, 21","img":[{"u":"img/w11_cv_histo/p20.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 20"},{"u":"img/w11_cv_histo/p21.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 21"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-17":{"q":"In a comparison of a small artery and a small vein, which feature is characteristic of the vein?","o":["A much thicker tunica media than the companion artery","A prominent internal and external elastic lamina, with no valves","Valves in the lumen and a relatively thinner wall","Fenestrated elastic laminae filling the media, as in the aorta","Absence of an endothelium and of any adventitia"],"a":2,"qk":"작은 동맥과 작은 정맥을 비교할 때, 정맥의 특징은?","ok":["동반 동맥보다 훨씬 두꺼운 중간막","뚜렷한 속·바깥탄성판이 있고 판막이 없다","내강에 판막이 있고 벽이 상대적으로 얇다","대동맥처럼 중간막을 채우는 창탄성판","내피와 바깥막이 없다"],"exp":"작은 동맥과 작은 정맥을 나란히 보면, 둘 다 속막·중간막·바깥막을 갖지만 비율이 다릅니다. 동맥은 중간막이 두껍고 **속탄성판**과 **바깥탄성판**이 뚜렷합니다.\n\n정맥은 벽이 상대적으로 얇고 내강이 넓으며, 내강에 **판막(valves)**이 있습니다. 바깥막의 **혈관의 혈관(vasa vasorum)**은 양쪽에서 볼 수 있습니다. 판막은 혈액의 역류를 막습니다.","why":{"0":"중간막이 더 두꺼운 것은 동맥의 특징입니다.","1":"뚜렷한 속·바깥탄성판은 동맥 쪽에 잘 보이며, 판막이 없는 것도 동맥입니다.","3":"창탄성판으로 중간막이 채워지는 것은 탄성동맥(대동맥 등)의 특징입니다.","4":"정맥에도 내피와 바깥막이 있습니다."},"one":"작은 정맥은 동맥보다 벽이 얇고 내강이 넓으며 판막을 가지고, 동맥은 중간막과 탄성판이 뚜렷합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 22","img":[{"u":"img/w11_cv_histo/p22.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 22"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-18":{"q":"The media of elastic arteries is characterized by fenestrated elastic laminae, smooth muscle cells, vasa vasorum, and which type of collagen?","o":["Type I collagen only, with no type III","Type II collagen of hyaline cartilage","Type IV collagen limited to bone osteoid","Type VII collagen of anchoring fibrils only","Type III collagen"],"a":4,"qk":"탄성동맥 중간막의 특징은 창탄성판, 민무늬근, 혈관의 혈관, 그리고 어느 형 교원인가?","ok":["I형 교원만 있고 III형은 없다","유리연골의 II형 교원","뼈 골양조직에 국한된 IV형 교원","고정잔섬유의 VII형 교원만","III형 교원(type III collagen)"],"exp":"**탄성동맥(elastic arteries)**의 중간막에는 **창탄성판(fenestrated elastic laminae)**이 겹겹이 있고, **민무늬근세포**, **III형 교원**, **혈관의 혈관**이 있습니다. 속막에는 내피, 내피밑 결합조직, 민무늬근, 속탄성판이 있습니다.\n\n창탄성판은 수축기와 이완기 사이 혈압을 고르게 하는 바람막이 역할을 합니다. 특수 염색에서 중간막의 물결치는 탄성판이 뚜렷이 보입니다. I형 교원은 바깥막 쪽에 더 강조됩니다.","why":{"0":"중간막에 제시된 교원은 III형입니다. I형 교원은 바깥막의 주요 교원입니다.","1":"II형 교원은 유리연골의 특징입니다.","2":"IV형 교원은 주로 기저막에 있으며, 뼈 골양조직의 전유물이 아닙니다. 탄성동맥 중간막의 교원으로 제시된 것은 III형입니다.","3":"VII형 교원은 표피-진피 접합의 고정잔섬유에 관련됩니다."},"one":"탄성동맥 중간막에는 창탄성판, 민무늬근, III형 교원, 혈관의 혈관이 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 23","img":[{"u":"img/w11_cv_histo/p23.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 23"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-19":{"q":"Elastic arteries such as the aorta, subclavians, and iliacs have an adventitia that limits vessel expansion. An aneurysm is:","o":["A fatty plaque that collects on the intima but never changes vessel diameter","An abnormal widening or ballooning of a portion of an artery due to wall weakness","A competent venous valve that prevents retrograde flow in a muscular vein","A normal, uniform tapering of an arteriole as it becomes a capillary","A blind-ended lymphatic capillary that begins in loose connective tissue"],"a":1,"qk":"대동맥·빗장밑동맥·엉덩동맥과 같은 탄성동맥의 바깥막은 혈관 팽창을 제한한다. 동맥류(aneurysm)는?","ok":["지름을 절대 바꾸지 않는 지방 플라크","혈관 벽의 약화로 동맥 일부가 비정상적으로 넓어지거나 부풀어 오른 것","역류를 막는 정상적인 정맥 판막","세동맥이 모세혈관으로 고르게 가늘어지는 정상 이행","결합조직 속의 막힌 끝 림프 모세혈관"],"exp":"탄성동맥의 바깥막에는 **I형 교원**, 탄성섬유, 혈관의 혈관, 신경이 있으며 **혈관 팽창을 제한**합니다. 보기 예는 **대동맥, 빗장밑동맥, 엉덩동맥**입니다.\n\n**동맥류(aneurysm)**는 혈관 벽이 약해져 동맥의 일부가 **비정상적으로 넓어지거나 부풀어 오르는** 것입니다. 배대동맥류는 콩팥동맥과의 관계에 따라 콩팥동맥위(suprarenal), 콩팥동맥옆(pararenal), 콩팥동맥옆바로(juxtarenal), 콩팥동맥아래(infrarenal)로 분류합니다.","why":{"0":"지방 플라크는 죽상경화의 소견이며, 동맥류의 정의(벽 약화에 의한 확장)와 같지 않습니다.","2":"정상적인 정맥 판막은 동맥류가 아닙니다.","3":"세동맥이 모세혈관으로 가늘어지는 것은 정상적인 이행입니다.","4":"막힌 끝 림프 모세혈관은 림프관계의 시작이지 동맥류가 아닙니다."},"one":"탄성동맥(대동맥·빗장밑·엉덩)의 바깥막은 팽창을 제한하며, 동맥류는 벽 약화로 동맥이 비정상적으로 부푸는 것입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 24, 25","img":[{"u":"img/w11_cv_histo/p24.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 24"},{"u":"img/w11_cv_histo/p25.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 25"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-20":{"q":"Muscular arteries such as the femoral and brachial arteries are distinguished by a prominent internal elastic lamina and a media of smooth muscle cells that:","o":["Secret atrial natriuretic peptide","Form fenestrated elastic laminae like those of the aorta","Are absent, leaving only an endothelium and adventitia","Control blood flow","Conduct action potentials faster than Purkinje fibers"],"a":3,"qk":"넙다리동맥·위팔동맥과 같은 근성동맥은 뚜렷한 속탄성판과, 무엇을 하는 민무늬근 중간막을 가지는가?","ok":["심방나트륨이뇨펩타이드를 분비한다","대동맥처럼 창탄성판을 만든다","없고, 내피와 바깥막만 남는다","혈류를 조절한다(control blood flow)","푸르키네 섬유보다 빠르게 활동전위를 전도한다"],"exp":"**근성동맥(muscular arteries)**의 속막은 내피, 드문 내피밑 결합조직, **뚜렷한 속탄성판**으로 되어 있습니다. 중간막은 **혈류를 조절하는 민무늬근**, I형 교원과 탄성섬유, **바깥탄성판**을 가집니다.\n\n바깥막은 I형 교원과 탄성섬유, 혈관의 혈관, 교감신경을 포함하며 팽창을 제한합니다. 보기 예는 **넙다리동맥(femoral)**과 **위팔동맥(brachial)**입니다. 탄성동맥처럼 창탄성판이 중간막을 가득 채우지는 않고, 민무늬근이 주성분입니다.","why":{"0":"ANP는 심방 심근의 산물입니다.","1":"창탄성판이 중간막의 주된 구조인 것은 탄성동맥입니다. 근성동맥 중간막의 주된 세포는 민무늬근입니다.","2":"근성동맥에는 두꺼운 민무늬근 중간막이 있습니다.","4":"빠른 전도를 하는 것은 푸르키네 섬유이며 혈관 민무늬근이 아닙니다."},"one":"근성동맥(넙다리·위팔)은 뚜렷한 속탄성판과 혈류를 조절하는 민무늬근 중간막을 가집니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 26, 27","img":[{"u":"img/w11_cv_histo/p26.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 26"},{"u":"img/w11_cv_histo/p27.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 27"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-21":{"q":"Arterioles have a few layers of smooth muscle in the media, a thin adventitia, and a diameter:","o":["Less than 0.5 mm","Always greater than 10 mm","Fixed at 30 to 40 µm with a discontinuous endothelium","Equal to that of the ascending aorta","Measured in centimeters, like large elastic arteries"],"a":0,"qk":"세동맥(arterioles)은 중간막에 민무늬근이 몇 층 있고 바깥막이 얇다. 지름은?","ok":["0.5 mm 미만","항상 10 mm보다 크다","내피가 불연속이며 항상 30–40 µm로 고정된다","오름대동맥과 같다","큰 탄성동맥처럼 센티미터 단위이다"],"exp":"**세동맥(arterioles)**의 속막은 내피, 기저판, 그리고 있을 수도 있는 속탄성판으로 되어 있습니다. 중간막에는 **민무늬근이 몇 층** 있고, 바깥막은 **얇은 결합조직**입니다. 지름은 **0.5 mm 미만**입니다.\n\n세동맥은 말초 저항을 만들어 조직으로 가는 혈류를 조절합니다. 30–40 µm의 불연속 내피는 굴모세혈관의 특징이고, 센티미터 단위는 대동맥과 같은 큰 탄성동맥에 가깝습니다.","why":{"1":"10 mm를 넘는 것은 큰 동맥에 가깝고, 세동맥의 기준은 0.5 mm 미만입니다.","2":"지름 30–40 µm에 불연속 내피는 굴모세혈관의 특징입니다.","3":"오름대동맥은 탄성동맥이며 세동맥보다 훨씬 큽니다.","4":"센티미터 단위의 지름은 큰 탄성동맥에 해당하며 세동맥이 아닙니다."},"one":"세동맥은 지름 0.5 mm 미만이며, 중간막에 민무늬근이 몇 층, 바깥막은 얇습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28","img":[{"u":"img/w11_cv_histo/p28.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-22":{"q":"Atherosclerosis is a condition in which fatty material collects along the walls of arteries, then thickens, hardens by forming calcium deposits, and may:","o":["Convert the vessel into a lymphatic capillary","Produce competent venous valves in the same artery","Eventually block the arteries","Replace all elastic laminae with hyaline cartilage","Transform arterioles into fenestrated capillaries"],"a":2,"qk":"죽상경화(atherosclerosis)는 지방 물질이 동맥 벽을 따라 쌓인 뒤 두꺼워지고 칼슘 침착으로 단단해지는 상태이다. 이 과정이 진행되면?","ok":["그 혈관을 림프 모세혈관으로 바꾼다","같은 동맥에 정상적인 정맥 판막을 만든다","결국 동맥을 막을 수 있다","모든 탄성판을 유리연골로 대체한다","세동맥을 창모세혈관으로 바꾼다"],"exp":"**죽상경화(atherosclerosis)**는 **지방 물질이 동맥 벽을 따라 쌓이는** 상태입니다. 이 물질이 **두꺼워지고**, **칼슘이 침착되어 단단해지며**, 결국 **동맥을 막을 수** 있습니다.\n\n육안 표본에서는 내강이 좁아지고 노란 죽상반과 궤양, 석회가 섞인 거친 내막이 보입니다. 막히면 그 동맥이 먹이던 조직에 허혈이 생깁니다.","why":{"0":"죽상경화는 동맥을 림프 모세혈관으로 바꾸지 않습니다.","1":"정맥 판막은 정맥의 구조이며, 죽상경화가 동맥에 판막을 만들지 않습니다.","3":"탄성판이 유리연골로 바뀐다는 정의가 아닙니다. 핵심은 지방 축적, 비후, 석회, 폐쇄입니다.","4":"세동맥이 창모세혈관으로 바뀌는 것이 죽상경화가 아닙니다."},"one":"죽상경화는 동맥 벽에 지방이 쌓여 두꺼워지고 석회화되며, 결국 동맥을 막을 수 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28, 29","img":[{"u":"img/w11_cv_histo/p28.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 28"},{"u":"img/w11_cv_histo/p29.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 29"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-23":{"q":"Capillaries lack a tunica media, have an intima of endothelium, basal lamina, and pericytes, and function as exchange vessels that also perform:","o":["Pacemaker impulse initiation for the ventricles","Formation of the cardiac skeleton","Conduction faster than Purkinje fibers","Production of atrial natriuretic peptide","Metabolic and antithrombogenic functions"],"a":4,"qk":"모세혈관은 중간막이 없고 속막은 내피·기저판·혈관주위세포로 되어 있다. 교환 혈관으로서 추가로 수행하는 기능은?","ok":["심실의 페이스메이커 자극 시작","심장골격의 형성","푸르키네 섬유보다 빠른 전도","심방나트륨이뇨펩타이드의 생산","대사 및 항혈전 기능"],"exp":"**모세혈관(capillaries)**의 속막은 **내피와 기저판**, 그리고 **혈관주위세포(pericytes)**로 되어 있습니다. **중간막은 없고**, 바깥막에는 그물섬유가 조금만 있습니다.\n\n모세혈관은 **교환 혈관**이며, 동시에 **대사 기능**과 **항혈전 기능(antithrombogenic functions)**도 수행합니다. 내피가 물질을 주고받고, 혈전이 쉽게 생기지 않도록 막는 것입니다.","why":{"0":"페이스메이커는 굴심방결절의 역할입니다.","1":"심장골격은 치밀결합조직으로, 모세혈관이 형성하지 않습니다.","2":"가장 빠른 심장 전도는 푸르키네 섬유의 특징입니다.","3":"ANP는 심방 심근이 만듭니다."},"one":"모세혈관은 중간막이 없는 교환 혈관이며, 대사 기능과 항혈전 기능도 수행합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 30","img":[{"u":"img/w11_cv_histo/p30.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 30"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-24":{"q":"Continuous capillaries have tight junctions, no fenestrations, and frequent pinocytic vesicles. They are found in the:","o":["Kidney glomeruli, where fenestrations lack diaphragms","CNS, muscle, lung, bone, skin, and thymus","Liver sinusoids with a discontinuous endothelium","Splenic cords only, among all organs","Bone marrow sinusoids exclusively"],"a":1,"qk":"연속모세혈관은 치밀이음과 세포섭취 소포가 있고 창(fenestration)이 없다. 분포하는 곳은?","ok":["창에 가로막이 없는 콩팥 토리","중추신경계, 근육, 허파, 뼈, 피부, 가슴샘","내피가 불연속인 간 굴모세혈관","모든 장기 중 지라 끈만","골수 굴모세혈관만"],"exp":"**연속모세혈관(continuous capillaries)**은 내피세포 사이에 **치밀이음(tight junctions)**이 있고, 벽에 **창(fenestrations)이 없으며**, 흔히 **세포섭취 소포(pinocytic vesicles)**를 보입니다.\n\n분포는 **중추신경계, 근육, 허파, 뼈, 피부, 가슴샘(thymus)**입니다. 혈액-뇌장벽처럼 물질 이동을 엄격히 통제해야 하는 곳에 적합합니다. 그림에는 폐쇄이음, 세포섭취, 경세포 수송, 가스 교환이 표시됩니다.","why":{"0":"콩팥 토리는 창모세혈관이며, 그 창에는 가로막이 없습니다.","2":"간 굴모세혈관은 불연속 내피의 굴모세혈관입니다.","3":"지라 끈은 굴모세혈관이 있는 곳이며, 연속모세혈관의 분포 목록이 아닙니다.","4":"골수 굴모세혈관도 굴모세혈관에 속합니다."},"one":"연속모세혈관은 치밀이음이 있고 창이 없으며, CNS·근육·허파·뼈·피부·가슴샘에 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 31","img":[{"u":"img/w11_cv_histo/p31.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 31"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-25":{"q":"Fenestrated capillaries contain pores with diaphragms in organs such as the pancreas, endocrine glands, and intestines. An exception is the kidney, where the fenestrations:","o":["Are replaced by tight junctions without any pores","Are found only in the tunica adventitia of elastic arteries","Always have thicker diaphragms than those of the intestine","Lack diaphragms","Are confined to the epicardium of the heart"],"a":3,"qk":"창모세혈관은 이자를 비롯한 내분비 기관과 창자에서 가로막이 있는 구멍을 가진다. 예외인 콩팥에서 창은?","ok":["구멍이 전혀 없이 치밀이음으로만 바뀐다","탄성동맥 바깥막에만 있다","창자보다 항상 더 두꺼운 가로막을 가진다","가로막(diaphragms)이 없다","심장 심외막에만 국한된다"],"exp":"**창모세혈관(fenestrated capillaries)**은 내피에 **가로막(diaphragms)이 있는 구멍(pores)**을 가집니다. **이자, 내분비 기관, 창자**에서 볼 수 있습니다.\n\n예외가 **콩팥**입니다. 콩팥의 창은 **가로막이 없습니다**. 그래서 혈장 여과가 더 자유롭습니다. 그림에도 ‘가로막이 있는 창’과 ‘가로막이 없는 창’이 따로 표시됩니다.","why":{"0":"콩팥 토리 모세혈관은 치밀이음만 있는 연속형이 아니라, 가로막이 없는 창을 가집니다.","1":"창은 창모세혈관 내피의 특징이지 탄성동맥 바깥막의 구조가 아닙니다.","2":"콩팥 창의 특징은 가로막이 더 두꺼운 것이 아니라 가로막이 없는 것입니다.","4":"창모세혈관의 예외 장기는 콩팥이며, 심외막에 국한되지 않습니다."},"one":"창모세혈관은 가로막이 있는 구멍을 가지나, 콩팥의 창에는 가로막이 없습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 32","img":[{"u":"img/w11_cv_histo/p32.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 32"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-26":{"q":"Sinusoidal capillaries, found in bone marrow, spleen, liver, lymphoid organs, and some endocrine organs, have a large lumen of 30 to 40 µm and:","o":["A discontinuous endothelium and an incomplete basal lamina","Tight junctions and no fenestrations, as in the CNS","A thick tunica media of many smooth muscle layers","Pores with diaphragms identical to those of intestinal capillaries","A complete, continuous basal lamina and no gaps"],"a":0,"qk":"골수·지라·간·림프기관·일부 내분비 기관의 굴모세혈관은 내강이 30–40 µm로 크고, 그 구조적 특징은?","ok":["내피가 불연속이고 기저판이 불완전하다","중추신경계처럼 치밀이음이 있고 창이 없다","민무늬근이 여러 층인 두꺼운 중간막을 가진다","창자 모세혈관과 같은 가로막이 있는 구멍만 가진다","완전하고 연속적인 기저판이 있고 틈이 없다"],"exp":"**굴모세혈관(sinusoidal capillaries)**은 **골수, 지라, 간, 림프기관, 일부 내분비 기관**에 있습니다. 내강이 **30–40 µm**로 크고, **내피가 불연속**이며 **기저판이 불완전**합니다.\n\n이 구조 덕분에 큰 분자가 드나들 수 있습니다. 지라에서는 적혈구가 틈을 지나갈 수 있다고 그림에 표시되어 있습니다. 연속모세혈관의 치밀이음·무창, 창모세혈관의 가로막 구멍과 구별해야 합니다.","why":{"1":"치밀이음과 무창은 연속모세혈관(CNS 등)의 특징입니다.","2":"모세혈관에는 중간막이 없습니다. 두꺼운 민무늬근 중간막은 동맥의 특징입니다.","3":"가로막이 있는 구멍은 일반적인 창모세혈관의 특징이며, 굴모세혈관은 불연속 내피와 불완전 기저판입니다.","4":"굴모세혈관의 기저판은 불완전하고 틈이 있습니다."},"one":"굴모세혈관은 내강이 30–40 µm로 크고, 내피가 불연속이며 기저판이 불완전합니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 33","img":[{"u":"img/w11_cv_histo/p33.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 33"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-27":{"q":"Small and medium veins have no internal elastic lamina, a thick adventitia described as fascia, and valves. Varicose veins have become dilated and tortuous, often due to:","o":["Hyperactive precapillary sphincters alone","Excess type III collagen in elastic-artery media","Incompetent valves","A missing tunica intima in all capillaries","Fusion of the fibrous pericardium to the sternum"],"a":2,"qk":"중소 정맥은 속탄성판이 없고 바깥막이 근막처럼 두꺼우며 판막이 있다. 정맥류는 늘어나고 구불구불해지는데, 흔한 이유는?","ok":["모세혈관앞조임근의 과활성만","탄성동맥 중간막의 III형 교원 과다","판막 기능 부전(incompetent valves)","모든 모세혈관에서 속막이 없는 것","섬유성 심막이 복장뼈에 유착된 것"],"exp":"세정맥(venules)은 세동맥보다 **내강이 넓고 벽이 얇으며** 혈관주위세포와 중간막의 고리 민무늬근을 가집니다. 중소 정맥은 내피가 있고 **속탄성판이 없으며**, 중간막에 민무늬근과 교원이 있고, **바깥막이 근막처럼 두껍고(fascia!)**, 혈관의 혈관과 **판막**이 있습니다.\n\n**정맥류(varicose veins)**는 정맥이 **늘어나고 구불구불**해진 것으로, 흔히 **판막이 제 역할을 못하기(incompetent valves)** 때문입니다. 판막이 닫히지 않으면 혈액이 역류·정체되어 정맥이 늘어납니다.","why":{"0":"모세혈관앞조임근은 모세혈관 혈류 조절 장치이며, 정맥류의 흔한 원인으로 제시된 것은 판막 부전입니다.","1":"탄성동맥 중간막의 III형 교원은 정맥류와 무관합니다.","3":"모세혈관에는 내피 속막이 있습니다. 이것이 정맥류의 원인이 아닙니다.","4":"섬유성 심막의 복장뼈 유착은 정상적인 부착이며 정맥류의 원인이 아닙니다."},"one":"중소 정맥은 속탄성판이 없고 바깥막이 두꺼우며 판막이 있고, 정맥류는 흔히 판막 부전으로 생깁니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 34, 35","img":[{"u":"img/w11_cv_histo/p34.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 34"},{"u":"img/w11_cv_histo/p35.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 35"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-28":{"q":"Large veins are characterized by a well-developed tunica intima, a thin tunica media, and a thick tunica adventitia that contains:","o":["Fenestrated elastic laminae as in the aortic media","Purkinje fibers and the atrioventricular node","Only endothelium, with no connective tissue or muscle","A prominent internal elastic lamina and no vasa vasorum","Smooth muscle, collagenous connective tissue, and vasa vasorum"],"a":4,"qk":"큰 정맥의 특징은 잘 발달한 속막, 얇은 중간막, 그리고 무엇을 담은 두꺼운 바깥막인가?","ok":["대동맥 중간막과 같은 창탄성판","푸르키네 섬유와 방실결절","결합조직과 근육 없이 내피만","뚜렷한 속탄성판과 혈관의 혈관 없음","민무늬근, 교원성 결합조직, 혈관의 혈관"],"exp":"**큰 정맥(large veins)**은 **속막이 잘 발달**하고, **중간막은 얇으며**(민무늬근과 교원), **바깥막이 두껍습니다**. 이 두꺼운 바깥막에는 **민무늬근**, **교원성 결합조직**, **혈관의 혈관**이 있습니다.\n\n동맥과 달리 큰 정맥에서는 민무늬근이 중간막보다 바깥막에 더 두드러질 수 있습니다. 표본에서도 얇은 중간막(TM) 바깥에 두꺼운 바깥막(TA)이 확인됩니다.","why":{"0":"창탄성판이 중간막을 채우는 것은 탄성동맥의 특징입니다.","1":"푸르키네 섬유와 방실결절은 심장 전도계입니다.","2":"큰 정맥의 바깥막에는 민무늬근과 교원성 결합조직이 풍부합니다.","3":"뚜렷한 속탄성판은 동맥의 특징에 가깝고, 큰 정맥 바깥막에는 혈관의 혈관이 있습니다."},"one":"큰 정맥은 속막이 잘 발달하고 중간막은 얇으며, 두꺼운 바깥막에 민무늬근·교원·혈관의 혈관이 있습니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 36","img":[{"u":"img/w11_cv_histo/p36.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 36"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-29":{"q":"Lymphatic capillaries begin as blind-ended tubes that return tissue fluid unidirectionally to the blood. Their endothelial cells lack tight junctions and have an incomplete basal lamina. Edema is:","o":["A normal, transient emptying of all lymphatic trunks","Swelling caused by an abnormal accumulation of fluid in body tissues","Fusion of a lymphatic vessel with an elastic artery media","A competent venous valve in a large vein","Calcified plaque that occludes a coronary artery"],"a":1,"qk":"림프 모세혈관은 막힌 관으로 시작해 조직액을 한 방향으로 혈액에 되돌린다. 내피는 치밀이음이 없고 기저판이 불완전하다. 부종(edema)은?","ok":["모든 림프줄기가 정상적으로 잠시 비는 현상","몸 조직에 액체가 비정상적으로 쌓여 생기는 부음","림프관이 탄성동맥 중간막과 유착되는 것","큰 정맥의 정상적인 판막","관상동맥을 막는 석회 플라크"],"exp":"림프관은 조직액을 **한 방향(unidirectional)**으로 혈액에 되돌립니다. 림프 모세혈관은 **막힌 관(blind-ended tubes)**으로 시작하고, 내피세포는 **치밀이음이 없으며 기저판이 불완전**합니다. 큰 림프관은 정맥과 비슷합니다.\n\n**부종(edema)**은 몸 조직에 액체가 **비정상적으로 쌓여** 붓는 것입니다. 모세혈관에서 나온 액 중 정맥으로 돌아가지 못한 나머지를 림프 모세혈관이 받아가는데, 이 과정이 깨지면 부종이 생깁니다. 그림에서는 세동맥 쪽 정수압과 세정맥 쪽 삼투압, 그리고 남는 액을 받아가는 림프 모세혈관이 표시됩니다.","why":{"0":"부종은 림프줄기가 정상적으로 비는 현상이 아니라, 조직에 액이 비정상적으로 쌓이는 것입니다.","2":"림프관이 탄성동맥 중간막과 유착되는 것이 부종의 정의가 아닙니다.","3":"정상적인 정맥 판막은 부종이 아닙니다.","4":"석회 플라크는 죽상경화의 소견입니다."},"one":"림프 모세혈관은 막힌 관으로 시작해 치밀이음 없이 조직액을 되돌리며, 부종은 조직에 액이 비정상적으로 쌓여 붓는 것입니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 37, 38","img":[{"u":"img/w11_cv_histo/p37.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 37"},{"u":"img/w11_cv_histo/p38.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 38"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_cv_histo-30":{"q":"When precapillary sphincters contract, blood in the microcirculation:","o":["Fills true capillaries so the bed is well perfused","Flows backward from venules into arterioles through the heart","Is forced into the lymphatic capillaries exclusively","Bypasses the capillary bed, as through a thoroughfare channel","Stops in the aorta and cannot enter muscular arteries"],"a":3,"qk":"모세혈관앞조임근(precapillary sphincters)이 수축하면 미세순환의 혈액은?","ok":["참모세혈관을 채워 모세혈관상이 잘 관류된다","심장을 통해 세정맥에서 세동맥으로 역류한다","오직 림프 모세혈관으로만 밀려 들어간다","통과채널 등을 통해 모세혈관상을 우회한다","대동맥에서 멈추고 근성동맥으로 들어가지 못한다"],"exp":"미세순환의 특수 구조에는 **모세혈관앞조임근(precapillary sphincter)**, **모세혈관뒤세정맥(postcapillary venule)**, **선호채널(preferred channels)**, **동정맥문합(arteriovenous anastomoses)**, **혈관의 혈관(vasa vasorum)**이 있습니다.\n\n조임근이 **이완**되면 참모세혈관이 잘 관류됩니다. 조임근이 **수축**하면 혈액은 모세혈관상을 **우회**하고, **통과채널(thoroughfare channel)**이나 동정맥문합을 통해 세정맥 쪽으로 빠집니다. 중간세동맥(metarteriole)이 이 지름길의 시작이 됩니다.","why":{"0":"참모세혈관이 잘 관류되는 것은 조임근이 이완되었을 때입니다.","1":"혈액이 심장을 통해 세정맥에서 세동맥으로 역류하지 않습니다.","2":"우회 경로는 통과채널이나 동정맥문합이지, 모든 혈액이 림프 모세혈관으로만 가지는 것이 아닙니다.","4":"조임근 수축은 대동맥 혈류를 멈추지 않으며, 국소 모세혈관상의 관류만 바꿉니다."},"one":"모세혈관앞조임근이 수축하면 혈액은 통과채널 등으로 모세혈관상을 우회하고, 이완되면 모세혈관상이 잘 관류됩니다.","src":"16 - Cardiovascular Histology 2024-2025.pdf, slide 39","img":[{"u":"img/w11_cv_histo/p39.webp","cap":"16 - Cardiovascular Histology 2024-2025.pdf, slide 39"}],"ch":"w11_cv_histo","chn":"Cardiovascular Histology","week":11},"w11_resp_inf-1":{"q":"Why are lower respiratory tract infections generally more serious than upper respiratory tract infections?","o":["They more often produce a bull neck and airway obstruction.","They are caused only by toxin-producing (toxigenic) bacterial strains.","Gas exchange in the lungs is compromised.","They remain confined to the nasal cavity and the pharynx.","They cannot be spread by respiratory droplets at all."],"a":2,"qk":"하기도(Lower Respiratory Tract) 감염이 상기도 감염보다 일반적으로 더 심각한 이유는 무엇입니까?","ok":["황소목(bull neck)과 기도 폐쇄를 더 자주 일으키기 때문이다.","독소를 만드는(독소 생성) 균주만 하기도 감염을 일으키기 때문이다.","폐의 가스교환(gas exchange)이 손상되기 때문이다.","비강과 인두에만 국한되어 퍼지지 않기 때문이다.","호흡기 비말로는 전혀 전파되지 않기 때문이다."],"exp":"상기도(Upper Respiratory Tract) 감염은 비강·인두·후두 등에서 일어나 부비동염, 인두염, 중이염, 편도염, 후두염, 감기처럼 상대적으로 덜 심합니다.\n\n하기도(Lower Respiratory Tract)는 기관·기관지·폐를 포함합니다. 폐에서 **가스교환(gas exchange)이 손상**되기 때문에 기관지염이나 폐렴 같은 하기도 감염이 더 심각합니다. 중증도(Severity)에서 상기도는 Less, 하기도는 More로 대비됩니다.","why":{"0":"황소목(bull neck)과 기도 폐쇄는 디프테리아의 상기도 소견입니다. 하기도 감염이 더 심각한 이유로 적힌 내용은 아닙니다.","1":"독소 생성 균주만 병을 일으킨다는 필기는 디프테리아에 대한 것입니다. 하기도 감염이 더 심한 이유가 아닙니다.","3":"하기도는 기관·기관지·폐를 포함하므로 비강과 인두에 국한되지 않습니다.","4":"많은 하기도 감염도 호흡기 비말로 퍼집니다. 전파 불능이 중증도의 이유가 아닙니다."},"one":"하기도 감염이 더 심각한 이유는 폐의 가스교환이 손상되기 때문이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 2","img":[{"u":"img/w11_resp_inf/p02.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 2"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-2":{"q":"Which Corynebacterium diphtheriae strains cause diphtheria?","o":["Only toxigenic strains that actually possess the toxin.","All strains, whether or not they produce any toxin.","Only nontoxigenic strains that colonize intact skin.","Only strains that lack metachromatic granules.","Only strains spread by contaminated water mist."],"a":0,"qk":"디프테리아(diphtheria)를 일으키는 디프테리아균(Corynebacterium diphtheriae)은 어떤 균주입니까?","ok":["실제로 독소를 가진 독소 생성 균주(toxigenic strains)만 일으킨다.","독소 생성 여부와 관계없이 모든 균주가 일으킨다.","온전한 피부를 집락화하는 비독소 생성 균주만 일으킨다.","이염 과립(metachromatic granules)이 없는 균주만 일으킨다.","오염된 물안개로만 퍼지는 균주만 일으킨다."],"exp":"디프테리아균의 일반 특성에서 **“독소 생성 균주가 디프테리아를 일으킨다(Toxigenic strains cause DIPHTHERIA)”**가 강조되고, 손글씨로 **“독소가 있는 균주만(only ones that have toxins)”**이라고 적혀 있습니다.\n\n독소 유전자가 없는 균주는 집락화할 수는 있어도 디프테리아를 일으키지 않습니다. 독소는 박테리오파지에서 얻은 유전자로 만들어집니다.","why":{"1":"모든 균주가 디프테리아를 일으키는 것이 아닙니다. 독소가 있는 균주만 병을 일으킵니다.","2":"비독소 생성 균주는 디프테리아를 일으키지 않습니다. 피부 디프테리아도 독소와 관련됩니다.","3":"이염 과립은 디프테리아균의 염색 특성이며, 독소 유무를 가르는 조건이 아닙니다.","4":"물안개 전파는 레지오넬라의 경로입니다. 디프테리아는 주로 호흡기 비말로 퍼집니다."},"one":"디프테리아는 독소를 가진 독소 생성 균주만 일으킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 4","img":[{"u":"img/w11_resp_inf/p04.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 4"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-3":{"q":"Diphtheria toxin causes disease primarily by which mechanism?","o":["Forming pores that lyse alveolar macrophages in the lung.","Inhibiting protein synthesis by inactivating EF2 (elongation factor 2).","Paralyzing ciliated airway cells so mucus cannot be cleared.","Degrading secretory IgA on mucosal surfaces of the airway.","Inhibiting lysosome-phagosome fusion inside macrophages."],"a":1,"qk":"디프테리아 독소(diphtheria toxin)가 병을 일으키는 주된 기전은 무엇입니까?","ok":["폐포 대식세포에 구멍을 내어 세포를 용해시킨다.","신장인자 2(EF2)를 불활성화해 단백질 합성을 억제한다.","섬모 세포를 마비시켜 점액을 밖으로 내보내지 못하게 한다.","기도 점막의 분비형 IgA를 분해한다.","대식세포 안에서 리소좀-식포 융합을 억제한다."],"exp":"디프테리아 독소는 진핵세포의 **단백질 합성(protein synthesis, 번역)**을 억제합니다. 구체적으로 **신장인자 2(Elongation Factor 2, EF2)를 불활성화**하여 번역을 막습니다. 그림의 ‘Protein Synthesis’가 이 독소로 억제된다고 표시되어 있습니다.\n\n국소 조직 파괴가 일어나고, 독소는 빠르게 퍼져 모든 조직에 영향을 줄 수 있습니다(심근염, 말초신경병증 등).","why":{"0":"대식세포 용해는 디프테리아 독소의 기전이 아닙니다.","2":"섬모 세포 마비는 백일해(B. pertussis) 독소의 기전입니다.","3":"분비형 IgA 분해는 H. influenzae의 IgA 단백분해효소 작용입니다.","4":"리소좀-식포 융합 억제는 레지오넬라의 기전입니다."},"one":"디프테리아 독소는 EF2를 불활성화해 단백질 합성(번역)을 억제한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 7","img":[{"u":"img/w11_resp_inf/p07.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 7"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-4":{"q":"Enlarged cervical lymph nodes and neck swelling in diphtheria are classically described as which finding?","o":["A claw-hand deformity from peripheral nerve injury.","Rusty or blood-tinged sputum from alveolar exudate.","Dark-red “currant jelly” sputum from a pneumonia.","A bull neck (cervical lymphadenitis with neck swelling).","A wrist-drop deformity from radial nerve damage."],"a":3,"qk":"디프테리아에서 목의 림프절 종대와 목 부종은 고전적으로 어떤 소견으로 불립니까?","ok":["말초신경 손상으로 생기는 갈퀴손(claw hand) 변형이다.","폐포 삼출로 생기는 녹슨색 또는 혈성 가래이다.","폐렴에서 나오는 검붉은 건포도 젤리 가래이다.","황소목(bull neck: 경부 림프절염과 목 부종)이다.","요골신경 손상으로 생기는 손목 처짐(wrist-drop)이다."],"exp":"디프테리아의 징후 중 **목 부종(neck swelling)**과 커진 림프절, 기도 폐쇄가 강조됩니다. 이 모습이 **황소목(bull neck)**, 즉 경부 림프절염(cervical lymphadenitis)입니다.\n\n황소목은 디프테리아를 사진과 용어로 연결해 두어야 하는 고전적 소견입니다. 갈퀴손이나 손목 처짐은 나병의 말초신경 손상 소견입니다.","why":{"0":"갈퀴손(claw hand)은 나병의 말초신경 손상 소견입니다.","1":"녹슨색 가래는 폐렴구균 폐렴의 소견입니다.","2":"건포도 젤리 가래는 클렙시엘라 폐렴의 단골 소견입니다.","4":"손목 처짐(wrist-drop)은 나병의 말초신경 손상 소견입니다."},"one":"디프테리아의 목 부종과 경부 림프절염은 황소목(bull neck)으로 불린다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 8, 9","img":[{"u":"img/w11_resp_inf/p08.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 8"},{"u":"img/w11_resp_inf/p09.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 9"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-5":{"q":"Pharyngitis with a thick grayish, adherent pseudomembrane is labeled “diphtheria of the oral cavity.” The same organism may also produce which other starred clinical image?","o":["Painful genital ulcers of chancroid (H. ducreyi).","A leonine (lion-like) facial appearance of leprosy.","Cool, anesthetic skin patches of tuberculoid leprosy.","Erythema overlying a positive tuberculin (PPD) test.","A chronic nonhealing skin ulcer (cutaneous diphtheria)."],"a":4,"qk":"두꺼운 회백색 부착성 가성막을 동반한 인두염은 “구강의 디프테리아”로 표시됩니다. 같은 균이 일으킬 수 있고, 시험 문제로 표시된(Q’s) 다른 임상 영상은 무엇입니까?","ok":["연성하감(H. ducreyi)의 통증성 생식기 궤양이다.","나병의 사자 얼굴(leonine face) 모양이다.","결핵양 나병의 차갑고 감각이 없는 피부 반점이다.","양성 투베르쿨린(PPD) 검사 위의 홍반이다.","잘 낫지 않는 만성 피부 궤양(피부 디프테리아)이다."],"exp":"인두염 사진에는 두꺼운 회백색의 부착성 삼출물(**가성막, pseudo-membrane**)이 있고, 그 위에 **“구강의 디프테리아(diphtheria of oral cavity)”**라고 적혀 있습니다. 가성막은 점막 세포 잔해와 염증 산물로 이루어집니다.\n\n같은 슬라이드의 피부 궤양 사진 옆에는 별표와 함께 **“Q’s”**(시험 문제)가 적혀 있습니다. 디프테리아균은 상기도뿐 아니라 **피부**도 감염시키며, 회색 막을 동반한 잘 낫지 않는 만성 피부 궤양(피부 디프테리아)을 만듭니다. 두 영상을 모두 알아볼 수 있어야 합니다.","why":{"0":"통증성 생식기 궤양은 H. ducreyi(연성하감)의 소견입니다.","1":"사자 얼굴은 나병의 얼굴 변형 소견입니다.","2":"감각이 없는 피부 반점은 결핵양 나병 쪽 소견이지, 디프테리아 피부 궤양이 아닙니다.","3":"PPD 양성의 경결·홍반은 결핵 피부 반응이지 디프테리아 궤양이 아닙니다."},"one":"구강 디프테리아는 가성막 인두염이고, 같은 균의 피부형은 잘 낫지 않는 피부 궤양이다(Q’s).","src":"6b. Respiratory Infections (handwritten).pdf, slides 10, 6","img":[{"u":"img/w11_resp_inf/p10.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 10"},{"u":"img/w11_resp_inf/p06.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 6"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-6":{"q":"Haemophilus ducreyi is noted as the cause of which disease?","o":["An STI with painful genital ulcers (chancroid).","Community-acquired pneumonia with rusty sputum.","Whooping cough in children younger than 2 years.","Atypical pneumonia after inhaling dried bird feces.","Cavitary pulmonary tuberculosis with hemoptysis."],"a":0,"qk":"헤모필루스 듀크레이(Haemophilus ducreyi)는 어떤 병을 일으킨다고 적혀 있습니까?","ok":["통증성 생식기 궤양을 동반한 성병(연성하감, chancroid)이다.","녹슨색 가래를 동반한 지역사회 획득 폐렴이다.","2세 미만 소아의 백일해(whooping cough)이다.","마른 새 배설물 흡입 후 생기는 비정형 폐렴이다.","객혈을 동반한 공동성 폐결핵이다."],"exp":"H. ducreyi는 **통증성 생식기 궤양을 동반한 성병(STI)**, 즉 **연성하감(chancroid)**의 원인입니다.\n\n같은 속에서 H. influenzae(특히 Hib)는 5세 미만 소아에서 수막염, 중이염·부비동염, 폐렴을 일으킵니다. 수막염과 폐렴에는 별표, 소아에는 밑줄이 있습니다. 두 균을 혼동하지 마십시오.","why":{"1":"녹슨색 가래의 지역사회 폐렴은 폐렴구균(S. pneumoniae)의 소견입니다.","2":"2세 미만 소아의 백일해는 B. pertussis입니다.","3":"마른 새 배설물 흡입에 의한 비정형 폐렴은 C. psittaci(앵무병)입니다.","4":"공동성 폐결핵은 M. tuberculosis입니다."},"one":"H. ducreyi는 통증성 생식기 궤양을 동반한 성병(연성하감)을 일으킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 14","img":[{"u":"img/w11_resp_inf/p14.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 14"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-7":{"q":"The major virulence factor of Haemophilus influenzae type b (Hib), boxed and starred, is which structure?","o":["An IgA protease that degrades circulating serum IgM.","A polyribophosphate (PRP) capsule that is antiphagocytic.","Pneumolysin that directly damages respiratory epithelium.","Cord factor (trehalose dimycolate) in a waxy cell wall.","A large capsule that produces “currant jelly” sputum."],"a":1,"qk":"인플루엔자균 b형(Hib)의 주된 독성인자로 박스와 별표가 쳐진 구조는 무엇입니까?","ok":["순환하는 혈청 IgM을 분해하는 IgA 단백분해효소이다.","식세포 작용을 막는 폴리리보포스페이트(PRP) 피막이다.","호흡 상피를 직접 손상시키는 뉴몰리신(pneumolysin)이다.","왁스 세포벽에 있는 코드 인자(트레할로스 디미콜레이트)이다.","건포도 젤리 가래를 만드는 큰 다당 피막이다."],"exp":"Hib의 주된 독성인자는 **폴리리보포스페이트(polyribophosphate, PRP) 피막**입니다. 이 피막은 **식세포 작용을 억제(antiphagocytic)**합니다. Hib 백신은 바로 이 피막을 표적으로 합니다.\n\n균은 그람 음성 막대균이고, 초콜릿 한천에서 자라며 인자 X(헤민)와 인자 V(NAD⁺)를 필요로 합니다. IgA 단백분해효소도 있지만, 박스·별표가 쳐진 주된 독성인자는 PRP 피막입니다.","why":{"0":"IgA 단백분해효소는 분비형 IgA를 분해하는 또 다른 인자이지, 박스·별표가 쳐진 주된 독성인자(PRP 피막)가 아닙니다. 게다가 분해 대상은 혈청 IgM이 아닙니다.","2":"뉴몰리신(용혈소)은 폐렴구균의 독성인자입니다.","3":"코드 인자(트레할로스 디미콜레이트)는 결핵균의 독성인자입니다.","4":"건포도 젤리 가래를 만드는 큰 다당 피막은 클렙시엘라의 독성인자입니다."},"one":"Hib의 주된 독성인자는 식세포 작용을 막는 폴리리보포스페이트(PRP) 피막이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 15","img":[{"u":"img/w11_resp_inf/p15.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 15"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-8":{"q":"Streptococcus pneumoniae is best described morphologically as which organism?","o":["A slender, slightly bent acid-fast rod.","A motile gram-negative bacillus.","A gram-positive diplococcus.","A gram-negative coccobacillus.","A wall-less pleomorphic bacterium."],"a":2,"qk":"폐렴사슬알균(Streptococcus pneumoniae)의 형태를 가장 잘 말한 것은 무엇입니까?","ok":["가늘고 약간 휜 항산성 막대균이다.","운동성이 있는 그람 음성 간균이다.","그람 양성 쌍구균(diplococcus)이다.","그람 음성 구간균(coccobacillus)이다.","세포벽이 없는 다형성 세균이다."],"exp":"폐렴구균은 **그람 양성 쌍구균(Gram-positive diplococcus)**으로, 이 형태 기술에 박스와 별표가 있습니다. 또한 알파 용혈성(alpha hemolytic)입니다.\n\n형태 감별의 기본이므로, 항산성 막대(결핵균), 그람 음성 간균(레지오넬라 등), 구간균(백일해균), 세포벽 없는 균(마이코플라스마)과 구별하십시오.","why":{"0":"가늘고 약간 휜 항산성 막대는 결핵균(M. tuberculosis)입니다.","1":"운동성 그람 음성 간균은 레지오넬라 등에 가깝습니다. 폐렴구균은 그람 양성입니다.","3":"그람 음성 구간균은 B. pertussis의 형태입니다.","4":"세포벽이 없고 다형성인 균은 마이코플라스마입니다."},"one":"폐렴구균은 그람 양성 쌍구균이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 18","img":[{"u":"img/w11_resp_inf/p18.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 18"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-9":{"q":"Streptococcus pneumoniae is starred as the most common cause of which infections?","o":["Whooping cough in infants and young children.","Walking pneumonia in otherwise healthy adults.","Legionnaires’ disease acquired from shower mist.","Community-acquired pneumonia and adult bacterial meningitis.","Chancroid with painful genital ulcers."],"a":3,"qk":"폐렴사슬알균이 별표와 함께 “가장 흔한 원인”으로 적힌 감염은 무엇입니까?","ok":["영유아의 백일해이다.","건강한 성인의 걷는 폐렴(walking pneumonia)이다.","샤워 물안개로 얻는 레지오넬라병이다.","지역사회 획득 폐렴과 성인 세균성 수막염이다.","통증성 생식기 궤양을 동반한 연성하감이다."],"exp":"폐렴구균은 많은 건강한 사람의 **비인두(nasopharynx)**에도 사는 사람만의 절대 기생균입니다. 별표가 있는 핵심은 **지역사회 획득 폐렴(community-acquired pneumonia)의 가장 흔한 원인**이며, **성인 세균성 수막염**의 가장 흔한 원인이기도 하다는 점입니다.\n\n중이염, 부비동염, 유양돌기염, 균혈증의 중요한 원인이기도 합니다.","why":{"0":"영유아 백일해의 원인균은 B. pertussis입니다.","1":"걷는 폐렴은 마이코플라스마 폐렴의 별명입니다.","2":"샤워 물안개의 레지오넬라병은 L. pneumophila입니다.","4":"연성하감은 H. ducreyi입니다."},"one":"폐렴구균은 지역사회 획득 폐렴과 성인 세균성 수막염의 가장 흔한 원인이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 19","img":[{"u":"img/w11_resp_inf/p19.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 19"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-10":{"q":"In pneumococcal pathogenesis, which two starred factors drive the infection?","o":["A PRP capsule plus an IgA protease and nothing else.","An exotoxin that destroys cilia, producing walking pneumonia.","Inhibition of lysosome-phagosome fusion plus secreted proteases.","Cord factor and sulfolipids (sulfatides) in a waxy cell wall.","An antiphagocytic capsule and release of hemolysin (pneumolysin)."],"a":4,"qk":"폐렴구균 병인에서 별표가 쳐진 두 인자는 무엇입니까?","ok":["PRP 피막과 IgA 단백분해효소뿐이다.","섬모를 파괴하는 외독소로 걷는 폐렴을 만든다.","리소좀-식포 융합 억제와 단백분해효소 분비이다.","왁스 세포벽의 코드 인자와 황지질(설파타이드)이다.","식세포를 막는 피막과 용혈소(뉴몰리신) 방출이다."],"exp":"폐렴구균의 병인에서 별표·밑줄이 있는 두 인자는 **피막(capsule)**과 **용혈소(hemolysin, pneumolysin)**입니다.\n\n독성은 다당 피막에 직접 의존하며, 피막은 식세포 작용을 막습니다. 방출된 뉴몰리신은 호흡 상피를 손상시킵니다. 그 결과 폐포에서 액체·적혈구·백혈구가 스며나와 **가래 기침(productive cough)**이 생기고, 균은 림프관과 혈액으로 퍼집니다.","why":{"0":"PRP 피막과 IgA 단백분해효소는 H. influenzae의 인자입니다.","1":"섬모 파괴 외독소와 걷는 폐렴은 마이코플라스마의 특징입니다.","2":"리소좀-식포 융합 억제와 단백분해효소는 레지오넬라의 기전입니다.","3":"코드 인자와 황지질은 결핵균의 세포벽 독성인자입니다."},"one":"폐렴구균은 항식세포 피막과 뉴몰리신(용혈소) 방출로 호흡 상피를 손상시킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 20","img":[{"u":"img/w11_resp_inf/p20.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 20"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-11":{"q":"The sputum character starred in pneumococcal pneumonia is which of the following?","o":["Blood-tinged, pink or rusty sputum.","Thick, dark-red “currant jelly” sputum.","A purely nonproductive, dry cough only.","Foul-smelling sputum from a primary liver abscess.","Copious watery sputum that never contains blood."],"a":0,"qk":"폐렴구균 폐렴에서 별표가 쳐진 가래의 성상은 무엇입니까?","ok":["피가 섞인 분홍색 또는 녹슨색 가래이다.","진하고 검붉은 건포도 젤리 가래이다.","가래가 전혀 없는 마른기침뿐이다.","원발성 간농양에서 나오는 악취 가래이다.","피가 전혀 섞이지 않은 묽은 다량 가래이다."],"exp":"폐렴구균 폐렴의 증상으로 열, 오한, 가래 기침과 함께 **피가 섞인 분홍색 또는 녹슨색 가래(blood-tinged, pink or rusty sputum)**가 밑줄·별표로 강조됩니다. 호흡곤란(dyspnea)은 “숨이 참(shortness of breath)”으로 적혀 있습니다.\n\n이 녹슨색 가래를 클렙시엘라의 **건포도 젤리(currant jelly) 가래**와 구별하는 것이 전형적인 감별 포인트입니다.","why":{"1":"건포도 젤리 가래는 클렙시엘라 폐렴의 단골 소견입니다.","2":"가래 없는 마른기침은 레지오넬라처럼 세포내 균에서 더 강조되는 소견입니다. 폐렴구균은 가래 기침입니다.","3":"간농양은 클렙시엘라 농양의 1순위 부위이지, 폐렴구균 가래의 성상이 아닙니다.","4":"피가 섞이지 않은 묽은 가래는 별표가 쳐진 녹슨색 가래가 아닙니다."},"one":"폐렴구균 폐렴의 전형적인 가래는 피가 섞인 분홍색 또는 녹슨색(rusty) 가래이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 23","img":[{"u":"img/w11_resp_inf/p23.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 23"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-12":{"q":"Who is most affected by Bordetella pertussis, and what does its toxin do to airway epithelium?","o":["Adults with COPD; it lyses alveolar walls and raises diffusing capacity.","Children under 2 years; it paralyzes ciliated cells so bacteria cannot be cleared.","Alcoholics; it produces currant-jelly sputum and lung abscesses.","Patients with AIDS; it causes disseminated MAC infection.","Bird handlers; it causes an influenza-like atypical pneumonia."],"a":1,"qk":"백일해균(Bordetella pertussis)이 주로 누구를 침범하며, 독소는 기도 상피에 무엇을 합니까?","ok":["COPD 성인에서 폐포 벽을 용해하고 확산능을 올린다.","2세 미만 소아에서 섬모 세포를 마비시켜 균을 밖으로 내보내지 못하게 한다.","알코올 의존 환자에서 건포도 젤리 가래와 폐농양을 만든다.","AIDS 환자에서 파종성 MAC 감염을 일으킨다.","조류 취급자에서 독감 같은 비정형 폐렴을 일으킨다."],"exp":"백일해는 주로 **2세 미만 소아**를 침범합니다(밑줄·별표). 균은 상기도의 섬모 세포에 붙고, 백일해 독소가 기관·기관지의 섬모 세포로 퍼집니다.\n\n독소는 이 세포들을 **마비**시켜, 섬모가 **세균을 밖으로 밀어내지 못하게** 합니다. 독소는 식세포도 억제합니다. 그 결과 점액과 균이 쌓입니다.","why":{"0":"폐포 벽 용해와 확산능 변화는 백일해 독소의 기전이 아닙니다.","2":"건포도 젤리 가래와 폐농양은 클렙시엘라, 특히 알코올 의존 환자에서 강조됩니다.","3":"AIDS에서 기회감염을 일으키는 것은 MAC(비결핵성 마이코박테리아)입니다.","4":"조류 배설물 흡입에 의한 비정형 폐렴은 C. psittaci입니다."},"one":"백일해는 2세 미만 소아에서 심하고, 독소가 섬모 세포를 마비시켜 균을 배출하지 못하게 한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 29","img":[{"u":"img/w11_resp_inf/p29.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 29"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-13":{"q":"The starred explanation of the whooping sound in pertussis is which sequence?","o":["Alveoli exude rusty sputum that then blocks the glottis.","A pharyngeal pseudomembrane obstructs the larynx and trachea.","Mucus builds up, and the cough that tries to clear it results in whooping cough.","Bronchospasm from a type I hypersensitivity produces the whoop.","Vocal-cord paralysis from diphtheria toxin produces the whoop."],"a":2,"qk":"백일해의 ‘흡기성 헐떡임(whoop)’에 대해 별표와 함께 적힌 설명은 어떤 순서입니까?","ok":["폐포에서 나온 녹슨색 가래가 성문을 막는다.","인두의 가성막이 후두와 기관을 막는다.","점액이 쌓이고, 그것을 빼내려는 기침이 백일해 기침(whooping cough)을 만든다.","제1형 과민반응에 의한 기관지 경련이 헐떡임을 만든다.","디프테리아 독소의 성대 마비가 헐떡임을 만든다."],"exp":"백일해의 기전이 한 줄로 적혀 있습니다. **점액이 쌓이고(Mucus builds up)**, 그 점액을 **기침으로 없애려 해서** **백일해 기침(whooping cough)**이 생긴다는 것입니다(별표·밑줄).\n\n앞 장의 섬모 마비와 이어집니다. 섬모가 균과 점액을 밀어내지 못하니 점액이 쌓이고, 그것을 빼내려는 특징적이고 오래가는 기침이 나옵니다.","why":{"0":"녹슨색 가래는 폐렴구균 폐렴의 소견이지, 백일해 기침의 기전이 아닙니다.","1":"가성막에 의한 기도 폐쇄는 디프테리아의 소견입니다.","3":"백일해 기침은 제1형 과민반응 천식의 기전으로 적혀 있지 않습니다.","4":"디프테리아 독소는 단백질 합성을 억제하며, 백일해의 whoop을 설명하지 않습니다."},"one":"섬모 마비로 점액이 쌓이고, 그것을 기침으로 빼내려 해서 백일해 기침이 생긴다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 31","img":[{"u":"img/w11_resp_inf/p31.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 31"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-14":{"q":"Legionella is an aquatic organism that lives inside other organisms and is transmitted by which route?","o":["Person-to-person respiratory droplets only.","Ingestion of raw infected cow’s milk.","Inhalation of dust that contains dried bird feces.","Water in a fine mist (for example, shower mist).","Prolonged close skin contact over many months."],"a":3,"qk":"레지오넬라는 다른 생물 안에서 사는 수생 생물입니다. 전파 경로는 무엇입니까?","ok":["사람 사이 호흡기 비말로만 전파된다.","감염된 생우유를 마셔서 전파된다.","마른 새 배설물이 섞인 먼지를 흡입해서 전파된다.","미세한 물안개(예: 샤워 물안개)로 전파된다.","여러 달에 걸친 밀접한 피부 접촉으로 전파된다."],"exp":"레지오넬라는 **수생 생물**이며 아메바와 폐포 대식세포 같은 **다른 생물 안에서 사는** 조건 병원성 세포내 기생균입니다(박스·별표).\n\n전파는 **미세한 물안개(water in fine mist)**이며, 예로 **샤워 물안개**가 적혀 있습니다. 냉각탑, 온수기, 정수기, 스파, 샤워 등 **물이 있거나 분무가 일어나는 곳 어디든** 오염원이 될 수 있습니다. 사람 간 전파가 아닙니다.","why":{"0":"레지오넬라는 사람 간 비말 전파가 아닙니다. 물안개로 전파됩니다.","1":"생우유 섭취는 M. bovis가 소에서 사람으로 넘어가는 경로입니다.","2":"마른 새 배설물 먼지 흡입은 C. psittaci(앵무병)의 경로입니다.","4":"여러 달의 밀접 접촉은 나병의 전파 설명입니다."},"one":"레지오넬라는 물속 생물 안에서 살며, 샤워 같은 미세한 물안개로 전파된다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 33, 38","img":[{"u":"img/w11_resp_inf/p33.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 33"},{"u":"img/w11_resp_inf/p38.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 38"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-15":{"q":"The starred incubation period of Chlamydia psittaci (after inhalation of dried bird feces) is which interval?","o":["2 to 5 days","1 to 3 days","2 to 12 weeks","1 to 20 years","5 to 14 days"],"a":4,"qk":"마른 새 배설물 흡입 후 생기는 앵무병균(Chlamydia psittaci)의, 별표가 쳐진 잠복기는 얼마입니까?","ok":["2–5일","1–3일","2–12주","1–20년","5–14일"],"exp":"앵무병(C. psittaci)은 **말라붙은 새 배설물이 섞인 먼지**를 흡입해 걸리고 **비정형 폐렴**을 일으킵니다. 정리 표에서 **잠복기 5–14일**에 동그라미와 별표가 있습니다.\n\n이 기간을 디프테리아(2–5일), 폐렴구균(1–3일), 결핵(2–12주), 나병(1–20년)의 잠복기와 혼동하지 마십시오.","why":{"0":"2–5일은 디프테리아의 잠복기입니다.","1":"1–3일은 폐렴구균의 잠복기입니다.","2":"2–12주는 결핵의 잠복기입니다.","3":"1–20년은 나병의 잠복기입니다."},"one":"앵무병(C. psittaci)의 잠복기는 5–14일이다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 41, 40","img":[{"u":"img/w11_resp_inf/p41.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 41"},{"u":"img/w11_resp_inf/p40.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 40"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-16":{"q":"Mycoplasma is starred for which two structural features?","o":["It lacks a rigid cell wall and is very small.","It has a lipid-rich, acid-fast cell wall.","It is a gram-positive encapsulated diplococcus.","It grows as serpentine cords in liquid medium.","It is an aquatic organism that lives inside amoebae."],"a":0,"qk":"마이코플라스마에서 별표가 쳐진 두 가지 구조적 특징은 무엇입니까?","ok":["단단한 세포벽이 없고 크기가 매우 작다.","지질이 풍부한 항산성 세포벽을 가진다.","피막이 있는 그람 양성 쌍구균이다.","액체 배지에서 사행성 코드(serpentine cords)로 자란다.","아메바 안에서 사는 수생 생물이다."],"exp":"마이코플라스마의 두 특징, 즉 **단단한 세포벽이 없음(lack rigid cell wall)**과 **크기가 작음(small)**에 동그라미와 별표가 있습니다. 다형성(pleomorphic)이고 성장에 콜레스테롤이 필요합니다.\n\n세포벽이 없으므로 **페니실린 같은 β-락탐은 듣지 않고**, 테트라사이클린에는 억제됩니다. 외독소가 섬모와 섬모 세포를 파괴하며, 증상이 가벼워 **걷는 폐렴(walking pneumonia)**이라고 불립니다.","why":{"1":"지질이 풍부한 항산성 세포벽은 마이코박테리아의 특징입니다.","2":"그람 양성 피막 쌍구균은 폐렴구균입니다.","3":"사행성 코드 성장은 결핵균(코드 인자)의 소견입니다.","4":"아메바 안의 수생 생물은 레지오넬라입니다."},"one":"마이코플라스마는 단단한 세포벽이 없고 작아서, 페니실린 같은 세포벽 항생제가 듣지 않는다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 43","img":[{"u":"img/w11_resp_inf/p43.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 43"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-17":{"q":"The “classic question” finding of Klebsiella pneumonia, and the usual rank of its abscesses, are which of the following?","o":["Rusty sputum; abscesses primarily in bone, secondarily in skin.","Dark-red bloody “currant jelly” sputum; abscesses 1° in the liver and 2° in the lungs.","A prolonged whooping cough; abscesses confined to the nasopharynx.","A nonproductive cough; abscesses limited to the kidney only.","Bull-neck swelling; abscesses 1° in the spleen and 2° in the brain."],"a":1,"qk":"클렙시엘라 폐렴의 “단골 문제(classic question)” 소견과, 농양이 잘 생기는 순위는 무엇입니까?","ok":["녹슨색 가래이며, 농양은 1순위 뼈, 2순위 피부이다.","검붉은 피 섞인 건포도 젤리 가래이며, 농양은 1순위 간, 2순위 폐이다.","오래가는 백일해 기침이며, 농양은 비인두에만 있다.","마른기침이며, 농양은 신장에만 있다.","황소목 부종이며, 농양은 1순위 비장, 2순위 뇌이다."],"exp":"클렙시엘라 폐렴에서 가장 강하게 표시된 필기는 **검붉은 피 섞인 가래, 이른바 건포도 젤리(currant jelly) 가래 = 단골 문제(classic question)**입니다.\n\n농양을 동반한 폐렴을 잘 일으키며, 농양의 위치는 **1순위 간(liver), 2순위 폐(lungs)**입니다. 큰 다당 피막이 주된 독성인자이고, 기저 질환·알코올 중독·폐 기능 저하 환자에서 잘 생기며, 요로감염(UTI)도 일으킬 수 있습니다. 정형 폐렴(typical pneumonia)입니다.","why":{"0":"녹슨색 가래는 폐렴구균의 소견입니다. 클렙시엘라 농양의 1순위는 뼈가 아니라 간입니다.","2":"백일해 기침은 B. pertussis입니다.","3":"마른기침은 세포내 균(레지오넬라 등)에서 강조됩니다. 농양의 1순위는 신장이 아닙니다.","4":"황소목은 디프테리아 소견입니다. 농양 순위(비장·뇌)도 적혀 있지 않습니다."},"one":"클렙시엘라의 단골 소견은 건포도 젤리 가래이고, 농양은 1순위 간, 2순위 폐이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 47","img":[{"u":"img/w11_resp_inf/p47.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 47"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-18":{"q":"Mycobacterium avium and Mycobacterium intracellulare are identified as which group?","o":["The two organisms used to manufacture the BCG vaccine.","Obligate human parasites that never exist in the environment.","Nontuberculous (atypical) mycobacteria.","The only mycobacteria that grow on Lowenstein-Jensen medium.","The causative agents of tuberculoid and lepromatous leprosy."],"a":2,"qk":"Mycobacterium avium과 Mycobacterium intracellulare는 어떤 군으로 연결됩니까?","ok":["BCG 백신을 만드는 데 쓰이는 두 균이다.","환경에는 전혀 없고 사람에게만 기생하는 절대 기생균이다.","비결핵성(비정형) 마이코박테리아이다.","Lowenstein-Jensen 배지에서 자라는 유일한 마이코박테리아이다.","결핵양 나병과 나종 나병의 원인균이다."],"exp":"마이코박테리아 가운데 **결핵균과 나병균**이 가장 중요한 두 질환의 원인으로 별표되어 있습니다. 그와 구별하여 **M. avium**과 **M. intracellulare**는 밑줄과 화살표로 **비결핵성(nontuberculous) 마이코박테리아**, 즉 비정형 마이코박테리아로 연결되어 있습니다.\n\n이 둘을 묶어 Mycobacterium avium complex(MAC)라고 하며, 환경에 널리 있고 AIDS에서 기회감염을 일으킵니다.","why":{"0":"BCG 백신은 M. bovis로 만듭니다. M. avium·M. intracellulare가 아닙니다.","1":"이 균들은 오히려 환경(공기·흙·물)에 널리 분포하는 기회감염균입니다.","3":"Lowenstein-Jensen(또는 Middlebrook) 배지는 결핵균 배양에 별표가 쳐진 배지입니다. 이 두 균만 자란다는 뜻이 아닙니다.","4":"나병의 원인균은 M. leprae 하나입니다."},"one":"M. avium과 M. intracellulare는 비결핵성(비정형) 마이코박테리아(MAC)이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 51","img":[{"u":"img/w11_resp_inf/p51.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 51"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-19":{"q":"Mycobacterium tuberculosis is boxed and starred as having which morphologic and physiologic properties?","o":["A gram-positive diplococcus that is a facultative anaerobe.","A wall-less organism that requires cholesterol for growth.","A gram-negative intracellular pathogen found in bird feces.","A slender, slightly bent rod that is an obligate aerobe (needs O2).","A motile aquatic bacillus that lives inside amoebae."],"a":3,"qk":"결핵균(Mycobacterium tuberculosis)에 박스와 별표가 쳐진 형태·생리 특성은 무엇입니까?","ok":["통성 혐기성인 그람 양성 쌍구균이다.","성장에 콜레스테롤이 필요한, 세포벽이 없는 균이다.","새 배설물에서 나오는 그람 음성 세포내 병원체이다.","가늘고 약간 휜 막대균이며 절대 호기성균(산소가 필요)이다.","아메바 안에서 사는 운동성 수생 간균이다."],"exp":"결핵균은 **가늘고 막대 모양이며 약간 휘어 있고(slender, rod-shaped, slightly bent)**, **절대 호기성균(obligate aerobes, needs O₂)**입니다. 이 두 가지에 박스와 별표가 있습니다. 운동성이 없고 아포를 만들지 않으며, 덩어리·사행성 코드로 자랍니다.\n\n지질이 풍부한 세포벽 때문에 그람 염색이 잘 안 되고, 한 번 염색되면 산성 용매로 잘 탈색되지 않아 **항산성균(acid-fast bacilli, Ziehl-Neelsen)**입니다. 산소가 많은 폐 상엽을 잘 침범하는 이유와 연결됩니다.","why":{"0":"그람 양성 쌍구균·통성 혐기성은 폐렴구균의 특성입니다.","1":"세포벽이 없고 콜레스테롤이 필요한 균은 마이코플라스마입니다.","2":"새 배설물의 그람 음성 세포내 병원체는 C. psittaci입니다.","4":"아메바 안의 운동성 수생 간균은 레지오넬라입니다."},"one":"결핵균은 가늘고 약간 휜 막대균이며, 산소가 필요한 절대 호기성균이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 53","img":[{"u":"img/w11_resp_inf/p53.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 53"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-20":{"q":"Which sequence matches the acid-fast stain figure, and how do the organisms appear afterward?","o":["Heat-fix first, then methylene blue, acid alcohol, and carbolfuchsin; both appear blue.","Methylene blue for 30 s, then heat-fix, then carbolfuchsin; both remain colorless.","Acid alcohol first, then carbolfuchsin, heat-fix, and crystal violet; both appear purple.","Gram’s iodine, alcohol decolorization, then safranin; acid-fast organisms appear pink.","Carbolfuchsin for 30 s, heat-fix with flame, acid-alcohol for 15–20 s, then methylene blue for 30 s; acid-fast organisms stay red and non-acid-fast organisms stain blue."],"a":4,"qk":"항산성 염색 그림의 순서와, 염색 후 균의 색깔로 옳은 것은 무엇입니까?","ok":["먼저 열고정한 뒤 메틸렌블루, 산성 알코올, 카르볼푸크신을 쓰며, 둘 다 파랗게 보인다.","메틸렌블루 30초 후 열고정을 하고 카르볼푸크신을 쓰며, 둘 다 무색으로 남는다.","먼저 산성 알코올을 쓴 뒤 카르볼푸크신, 열고정, 크리스탈 바이올렛을 쓰며, 둘 다 보라색이다.","그람 요오드, 알코올 탈색, 사프라닌 순이며, 항산성균만 분홍색이다.","카르볼푸크신 30초, 불꽃으로 열고정, 산성 알코올 15–20초, 메틸렌블루 30초이며, 항산성균은 빨강, 비항산성균은 파랑이다."],"exp":"항산성 염색 그림에 적힌 순서는 다음과 같습니다.\n\n1. 일차 염색으로 **카르볼푸크신(carbolfuchsin; 슬라이드 철자 carbolfuschin)을 30초** 바른다.\n2. **불꽃으로 슬라이드의 세포를 열고정(heat fix)**한다.\n3. **산성 알코올(acid alcohol)로 15–20초 탈색**한다.\n4. 대조 염색으로 **메틸렌블루를 30초** 바른 뒤 여분의 염색액을 헹군다.\n\n항산성균(Acid Fast Organism)은 카르볼푸크신을 간직해 **빨강/분홍**으로 남고, 비항산성균(Non Acid Fast Organism)은 탈색된 뒤 메틸렌블루로 **파랑**이 됩니다. 지질이 풍부한 세포벽 때문에 한 번 염색되면 산성 용매로 잘 탈색되지 않습니다.","why":{"0":"순서가 그림과 다르고, 항산성균은 파랑이 아니라 빨강으로 남습니다.","1":"메틸렌블루가 일차 염색이 아니며, 둘 다 무색으로 남지 않습니다.","2":"산성 알코올이 첫 단계가 아니고, 크리스탈 바이올렛은 이 그림의 시약이 아닙니다.","3":"그람 염색(요오드·알코올·사프라닌) 순서입니다. 항산성 염색이 아닙니다."},"one":"항산성 염색은 카르볼푸크신 → 열고정 → 산성 알코올 탈색 → 메틸렌블루이며, 항산성균은 빨강, 비항산성균은 파랑이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 55","img":[{"u":"img/w11_resp_inf/p55.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 55"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-21":{"q":"Cord factor, boxed with the instruction “know both terms,” is which molecule?","o":["Trehalose dimycolate","Polyribophosphate (PRP) capsule","Sulfatides that induce delayed-type hypersensitivity","Mycolic acid–arabinogalactan only, formerly called Wax D","Pneumolysin released into the alveolar space"],"a":0,"qk":"“두 용어 모두 알아 둘 것”이라고 박스 쳐진 코드 인자(cord factor)는 어떤 분자입니까?","ok":["트레할로스 디미콜레이트(trehalose dimycolate)","폴리리보포스페이트(PRP) 피막","지연형 과민반응을 유도하는 설파타이드","예전에 Wax D로 불리던 미콜산-아라비노갈락탄뿐인 구조","폐포 공간으로 방출되는 뉴몰리신"],"exp":"결핵균 독성인자 표에서 **코드 인자(cord factor)**가 박스 쳐져 있고, 바로 옆에 **트레할로스 디미콜레이트(trehalose dimycolate)**라는 다른 이름이 있습니다. **“두 용어 모두 알아 둘 것(know both terms)”**이라고 적혀 있습니다.\n\n코드 인자는 미토콘드리아 호흡을 억제하고, 호중구 이동을 억제하며, 액체 배지에서 균이 사행성 코드(serpentine cords)로 자라게 합니다. 따로 박스가 있는 인자로 세포벽 골격(MAPc, 예전 이름 Wax D)과 황지질(설파타이드; 식포-리소좀 융합 억제)도 있습니다.","why":{"1":"PRP 피막은 Hib의 주된 독성인자입니다.","2":"설파타이드(황지질)는 식포-리소좀 융합을 억제하는 별개의 박스 친 인자입니다. 지연형 과민반응을 유도하는 것은 세포벽 골격(MAPc/Wax D)입니다.","3":"세포벽 골격(MAPc, 예전 Wax D)은 따로 박스 쳐진 인자이지, 코드 인자의 다른 이름이 아닙니다.","4":"뉴몰리신은 폐렴구균의 용혈소입니다."},"one":"코드 인자의 다른 이름은 트레할로스 디미콜레이트이며, 두 용어를 모두 알아야 한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-22":{"q":"M. tuberculosis is starred as growing on which media, and which clinical form is underlined as the most severe?","o":["Chocolate agar only; pulmonary TB is the most severe form.","Lowenstein-Jensen or Middlebrook media; miliary TB is the most severe.","Mouse footpad or armadillo only; lepromatous leprosy is most severe.","Ordinary nutrient broth; extrapulmonary TB is always most severe.","Thayer-Martin agar; latent infection is the most severe form."],"a":1,"qk":"결핵균이 별표와 함께 자란다고 적힌 배지와, 가장 심하다고 밑줄 쳐진 임상형은 무엇입니까?","ok":["초콜릿 한천만이며, 가장 심한 형은 폐결핵이다.","Lowenstein-Jensen 또는 Middlebrook 배지이며, 가장 심한 형은 속립 결핵이다.","쥐 발바닥이나 아르마딜로만이며, 가장 심한 형은 나종 나병이다.","일반 영양 배지이며, 가장 심한 형은 항상 폐외 결핵이다.","Thayer-Martin 한천이며, 가장 심한 형은 잠복 감염이다."],"exp":"결핵의 임상형은 **폐결핵(대부분의 증례)**, **폐외 결핵(소수)**, **속립 결핵(miliary TB, 가장 심함)**으로 밑줄 쳐져 있습니다. 속립 결핵은 혈류를 통한 광범위 전파로 여러 장기에 작은 병변이 동시에 생깁니다. 진행된 폐결핵에서는 객혈(spitting blood)이 있습니다.\n\n실험실 동정에서 **Lowenstein-Jensen 또는 Middlebrook 배지에서 자란다**는 항목에 별표가 있습니다. 나이아신(niacin)을 생성하는 점도 다른 마이코박테리아와 구별됩니다.","why":{"0":"초콜릿 한천은 Hib 같은 균의 배지입니다. 또한 가장 심한 형은 폐결핵이 아니라 속립 결핵입니다.","2":"쥐 발바닥·아르마딜로는 나병균을 키우는 방법입니다. 나종 나병은 나병의 심한 형입니다.","3":"일반 영양 배지가 별표된 배지가 아니며, 폐외 결핵은 소수이지 가장 심한 형이 아닙니다.","4":"Thayer-Martin은 임균 등에서 쓰는 배지입니다. 잠복 감염은 가장 심한 임상형이 아닙니다."},"one":"결핵균은 Lowenstein-Jensen 또는 Middlebrook 배지에서 자라고, 가장 심한 임상형은 속립 결핵이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 59","img":[{"u":"img/w11_resp_inf/p59.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 59"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-23":{"q":"A positive tuberculin (PPD) skin test means which of the following?","o":["The patient definitely has active, contagious tuberculosis now.","Acid-fast bacilli have already been proven in the sputum.","Past cured infection, vaccination, or latent infection — not necessarily active disease.","The patient has certainly never encountered any mycobacteria.","Miliary tuberculosis with bloodstream dissemination is present."],"a":2,"qk":"투베르쿨린(PPD) 피부 검사가 양성이라는 것은 무엇을 뜻합니까?","ok":["지금 활동성·전염성 결핵이 확실히 있다는 뜻이다.","가래에서 항산성균이 이미 증명되었다는 뜻이다.","과거에 치료된 감염, 예방접종, 또는 잠복 감염을 뜻하며, 반드시 활동성 질환은 아니다.","마이코박테리아를 한 번도 만난 적이 없다는 뜻이다.","혈류 전파를 동반한 속립 결핵이 있다는 뜻이다."],"exp":"양성 PPD는 **활동성 질환을 뜻하지 않습니다.** 손글씨로 문장이 이렇게 보완되어 있습니다. 양성이면 **과거에 치료된(cured) 감염, 예방접종, 또는 잠복 감염(latent infection)**을 뜻할 수 있습니다.\n\n경결(induration)이 기억 세포나 1형 보조 T세포에서 생긴다는 내용은 “퀴즈에 내지 않는다”고 적혀 있으므로, 시험에서는 양성의 의미와 아래 컷오프가 중요합니다.","why":{"0":"양성은 활동성 질환을 뜻하지 않습니다. 과거 치료된 감염, 예방접종, 잠복 감염일 수 있습니다.","1":"PPD 양성만으로 가래에서 균이 증명된 것은 아닙니다. 활동성 질환의 확진이 아닙니다.","3":"양성이면 과거에 균을 만났거나 예방접종을 받았을 수 있습니다. “만난 적 없음”의 뜻이 아닙니다.","4":"속립 결핵은 가장 심한 임상형이며, PPD 양성만으로 진단되지 않습니다."},"one":"PPD 양성은 활동성 질환이 아니라, 치료된 과거 감염·예방접종·잠복 감염을 뜻할 수 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 60","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-24":{"q":"For PPD (Mantoux) interpretation, the boxed and circled induration cutoffs are which of the following?","o":["≥2 mm in every person, regardless of risk factors.","≥20 mm in high-risk persons and ≥25 mm in low-risk persons.","≥15 mm in high-risk persons and ≥5 mm in low-risk persons.","≥5 mm in high-risk persons, ≥10 mm in moderate-risk persons, and ≥15 mm in low-risk persons.","Any visible erythema, even without palpable induration, is a positive test."],"a":3,"qk":"PPD(Mantoux) 판정에서 박스·동그라미가 쳐진 경결 기준은 무엇입니까?","ok":["위험인자와 관계없이 모든 사람에서 2 mm 이상이다.","고위험군은 20 mm 이상, 저위험군은 25 mm 이상이다.","고위험군은 15 mm 이상, 저위험군은 5 mm 이상이다.","고위험군은 5 mm 이상, 중등도 위험군은 10 mm 이상, 저위험군은 15 mm 이상이다.","만져지는 경결이 없어도 보이는 홍반만으로 양성이다."],"exp":"중등도·증가된 위험군 슬라이드에서는 **경결 ≥10 mm**가 동그라미 쳐져 있습니다. 같은 줄의 기준은 손글씨로 **≥5 mm = 고위험(high risk)**, **≥15 mm = 저위험(low risk)**으로 박스 쳐져 있습니다.\n\nCDC Mantoux 포스터도 같은 세 컷오프를 씁니다. **≥5 mm**: HIV, 전염성 결핵 최근 접촉자, 섬유화성 흉부 방사선 소견, 장기이식, 면역억제(예: 프레드니손 15 mg/일 이상 또는 TNF-α 억제제). **≥10 mm**: 결핵 유행 국가 출신, 집단시설, 5세 미만 소아 등. **≥15 mm**: 알려진 위험인자가 없는 사람.\n\n읽는 것은 48–72시간 뒤이며, **홍반이 아니라 경결**을 밀리미터로 잽니다.","why":{"0":"2 mm는 양성 컷오프가 아닙니다. 위험도에 따라 5, 10, 15 mm를 씁니다.","1":"20 mm와 25 mm는 이 자료의 컷오프가 아닙니다.","2":"고위험과 저위험의 숫자가 반대로 되어 있습니다. 고위험은 5 mm, 저위험은 15 mm입니다.","4":"홍반만으로는 양성이 아닙니다. 경결(induration)을 촉진해 측정합니다."},"one":"PPD 양성 컷오프는 고위험 ≥5 mm, 중등도 위험 ≥10 mm, 저위험 ≥15 mm이며, 홍반이 아니라 경결을 잰다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 60, 61","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60"},{"u":"img/w11_resp_inf/p61.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 61"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-25":{"q":"The BCG vaccine, circled and starred, is which of the following?","o":["A killed M. tuberculosis filtrate used routinely only in the United States.","A toxoid identical to the D component of the DTaP vaccine.","A live vaccine prepared from Mycobacterium avium-intracellulare.","An RNA vaccine directed against cord factor (trehalose dimycolate).","A live, attenuated M. bovis vaccine and one of the most widely used vaccines in the world."],"a":4,"qk":"동그라미와 별표가 쳐진 BCG 백신은 무엇입니까?","ok":["미국에서만 일상적으로 쓰는, 죽인 결핵균 여과액이다.","DTaP 백신의 D 성분과 같은 톡소이드이다.","M. avium-intracellulare로 만든 생백신이다.","코드 인자(트레할로스 디미콜레이트)를 표적으로 한 RNA 백신이다.","약독화 생 M. bovis 백신이며, 세계에서 가장 널리 쓰이는 백신 중 하나이다."],"exp":"결핵 예방은 **BCG(Bacillus Calmette-Guérin) 백신**입니다(동그라미·별표). 이 백신은 **약독화 생 M. bovis**로 만들고, **세계에서 가장 널리 쓰이는 백신 중 하나**입니다. 미국에서는 결핵이 드물어 일상적으로 쓰지 않으며, 선별 검사에서 **투베르쿨린 피부 검사 위양성을 일으킬 수** 있습니다.\n\nM. bovis는 소의 결핵균이며, BCG가 이 균으로 만들어진다는 점이 따로 표시되어 있습니다.","why":{"0":"BCG는 죽인 여과액이 아니라 약독화 생 M. bovis 백신입니다. 미국에서는 오히려 일상적으로 쓰지 않습니다.","1":"DTaP의 D는 디프테리아 톡소이드입니다. BCG가 아닙니다.","2":"MAC(M. avium-intracellulare)은 BCG의 원료가 아닙니다. 원료는 M. bovis입니다.","3":"BCG는 코드 인자 RNA 백신이 아닙니다."},"one":"BCG는 약독화 생 M. bovis 백신이며, 세계에서 가장 널리 쓰이는 백신 중 하나이다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 66, 81","img":[{"u":"img/w11_resp_inf/p66.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 66"},{"u":"img/w11_resp_inf/p81.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 81"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-26":{"q":"Compared with leprosy, the incubation period of tuberculosis is which of the following?","o":["Shorter: 2–12 weeks for TB versus 1–20 years for leprosy.","Identical: both infections always incubate for 5–14 days.","Longer: 1–20 years for TB versus 2–12 weeks for leprosy.","Shorter: 48–72 hours for TB versus 2–5 days for leprosy.","Longer: the 1–2 years of MDT is the incubation period of TB."],"a":0,"qk":"나병과 비교할 때 결핵의 잠복기는 어떻습니까?","ok":["더 짧다. 결핵은 2–12주, 나병은 1–20년이다.","같다. 두 감염의 잠복기는 항상 5–14일이다.","더 길다. 결핵은 1–20년, 나병은 2–12주이다.","더 짧다. 결핵은 48–72시간, 나병은 2–5일이다.","더 길다. 1–2년의 다제요법이 결핵의 잠복기이다."],"exp":"결핵의 잠복기 **2–12주**에 동그라미가 있고, **나병보다 짧다(shorter than leprosy)**고 적혀 있습니다. 나병(M. leprae)의 잠복기 **1–20년**에는 동그라미와 함께 **결핵보다 길다(longer vs. Tuberculosis)**고 적혀 있습니다.\n\n두 슬라이드의 필기가 짝을 이룹니다. 5–14일은 앵무병, 48–72시간은 PPD를 읽는 시간, 1–2년은 나병 다제요법 기간입니다.","why":{"1":"5–14일은 앵무병(C. psittaci)의 잠복기입니다. 결핵과 나병의 잠복기는 서로 다릅니다.","2":"숫자가 반대로 되어 있습니다. 긴 쪽은 나병(1–20년)이고, 짧은 쪽은 결핵(2–12주)입니다.","3":"48–72시간은 PPD를 읽는 시간이고, 2–5일은 디프테리아 잠복기입니다.","4":"1–2년은 나병 다제요법(MDT) 기간이지 결핵의 잠복기가 아닙니다."},"one":"결핵 잠복기는 2–12주로 나병(1–20년)보다 짧다.","src":"6b. Respiratory Infections (handwritten).pdf, slides 68, 79","img":[{"u":"img/w11_resp_inf/p68.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 68"},{"u":"img/w11_resp_inf/p79.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 79"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-27":{"q":"Mycobacterium leprae is starred as temperature-sensitive and therefore prefers which sites?","o":["Deep, warm viscera such as the liver and the spleen.","Cooler body parts, especially the skin and the nerves.","Only alveolar macrophages at core body temperature.","The highly oxygenated lung apices exclusively.","Aquatic amoebae and shower-mist droplets."],"a":1,"qk":"나병균(Mycobacterium leprae)은 온도에 민감하다고 별표되어 있습니다. 따라서 어느 부위를 선호합니까?","ok":["간과 비장처럼 깊고 따뜻한 내장이다.","몸의 차가운 부위, 특히 피부와 신경이다.","중심 체온의 폐포 대식세포뿐이다.","산소가 많은 폐 꼭대기만이다.","수생 아메바와 샤워 물안개이다."],"exp":"나병균은 **온도에 민감(temp. sensitive)**해서 **몸의 차가운 부위, 특히 피부와 신경(cooler body parts: SKIN, NERVES)**을 침범합니다(동그라미·별표). 코, 바깥귀, 고환, 표재 신경 말단이 예시로 적혀 있습니다. 천천히 만성으로 진행하며 **말초 신경염(peripheral neuritis)**을 일으킵니다.\n\n전파는 치료받지 않은 환자와의 **여러 달에 걸친 밀접 접촉**, 주로 **흡입**이며, **소아**가 성인보다 더 잘 걸립니다.","why":{"0":"따뜻하고 깊은 내장(간·비장)은 온도 민감성 나병균이 선호하는 부위로 적혀 있지 않습니다.","2":"폐포 대식세포는 결핵균이 처음에 감염하는 세포입니다. 나병균의 주된 표적은 피부와 신경입니다.","3":"산소가 많은 폐 상엽은 절대 호기성인 결핵균과 연결되는 설명입니다.","4":"아메바와 샤워 물안개는 레지오넬라의 생태·전파입니다."},"one":"나병균은 온도에 민감해서 몸의 차가운 부위, 특히 피부와 신경을 침범한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 71","img":[{"u":"img/w11_resp_inf/p71.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 71"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-28":{"q":"Leprosy multidrug therapy (the starred drugs), given for 1–2 years (longer than TB because nerves may be damaged), consists of which agents?","o":["RIPE only: rifampin, isoniazid, pyrazinamide, and ethambutol.","Penicillin plus erythromycin given for 10 days.","Dapsone, rifampin, and clofazimine.","Doxycycline or azithromycin alone for 5 days.","Isoniazid monotherapy continued for 2 months."],"a":2,"qk":"나병의 다제요법(별표가 쳐진 약들)은 1–2년(신경 손상 때문에 결핵보다 김) 쓰이며, 구성은 무엇입니까?","ok":["RIPE뿐이다. 리팜핀, 이소니아지드, 피라진아마이드, 에탐부톨이다.","페니실린과 에리트로마이신을 10일 쓴다.","답손, 리팜핀, 클로파지민이다.","독시사이클린 또는 아지트로마이신 단독을 5일 쓴다.","이소니아지드 단독을 2개월 계속한다."],"exp":"나병의 다제요법(MDT)은 **1–2년**으로 박스 쳐져 있고, **신경이 손상될 수 있어서 결핵보다 길다**고 적혀 있습니다. 별표와 밑줄이 쳐진 세 약은 **답손(dapsone), 리팜핀(rifampin), 클로파지민(clofazimine)**입니다.\n\n치료는 균을 없앨 수 있지만, 이미 생긴 손상은 되돌리지 못합니다. 예방의 핵심은 돌이킬 수 없는 신체·신경 손상을 막기 위한 **조기 발견**입니다.","why":{"0":"RIPE(리팜핀·이소니아지드·피라진아마이드·에탐부톨)는 결핵 치료입니다.","1":"페니실린 또는 에리트로마이신은 디프테리아 치료·보균자 제거에 쓰입니다.","3":"독시사이클린·아지트로마이신은 앵무병 등에 쓰이며, 나병 MDT가 아닙니다.","4":"이소니아지드 단독 2개월은 나병 MDT가 아닙니다."},"one":"나병 MDT는 답손·리팜핀·클로파지민이며, 신경 손상 때문에 1–2년으로 결핵보다 길다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 77","img":[{"u":"img/w11_resp_inf/p77.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 77"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-29":{"q":"Dr. McLean boxed the species jump of Mycobacterium bovis as which pair of routes?","o":["Cattle to animals by ingestion; cattle to humans by skin contact.","Cattle to animals by fomites; cattle to humans by arthropod bite.","Cattle to animals by water mist; cattle to humans by PPD injection.","Cattle to animals by inhalation; cattle to humans by ingestion (raw infected cow’s milk).","Cattle to both animals and humans only by prolonged nerve contact."],"a":3,"qk":"소결핵균(Mycobacterium bovis)이 종을 넘어가는 경로로 박스에 적힌 짝은 무엇입니까?","ok":["소→동물은 섭취, 소→사람은 피부 접촉이다.","소→동물은 매개물, 소→사람은 절지동물 침이다.","소→동물은 물안개, 소→사람은 PPD 주사이다.","소→동물은 흡입, 소→사람은 섭취(감염된 생우유)이다.","소→동물과 사람 모두 오랜 신경 접촉으로만 전파된다."],"exp":"M. bovis는 소에서 결핵을 일으키고, 종을 넘어 사람에게도 병을 일으킬 수 있습니다. 박스 메모는 경로를 이렇게 구별합니다. **소 → 동물: 흡입(inhalation) / 소 → 사람: 섭취(ingestion)**.\n\n사람으로의 전파는 주로 **감염된 생우유를 마시는 것**이며, 병변은 림프절에 생기고 뼈와 관절로 퍼질 수 있습니다. 흡입으로도 퍼질 수는 있습니다. 이 균으로 BCG 백신을 만듭니다.","why":{"0":"소→동물의 주된 경로는 섭취가 아니라 흡입이고, 소→사람은 피부 접촉이 아니라 섭취입니다.","1":"매개물이나 절지동물 침은 이 박스에 적힌 경로가 아닙니다.","2":"물안개는 레지오넬라, PPD 주사는 피부 검사이지 감염 경로가 아닙니다.","4":"오랜 신경 접촉은 나병 전파의 맥락입니다. M. bovis의 박스 경로가 아닙니다."},"one":"M. bovis는 소→동물은 흡입, 소→사람은 감염된 생우유 섭취로 전파된다.","src":"6b. Respirato
