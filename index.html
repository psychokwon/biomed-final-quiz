 냅니다. 반면 **허파세정맥은 세동맥·세기관지와 따로** 주행합니다.\n\n그림에서도 허파동맥은 기관지 나무를 따라가고, 허파정맥은 별도로 좌심방으로 모입니다. 대동맥에서 나와 기관지 벽을 영양하는 것은 기관지동맥입니다.","why":{"0":"허파세정맥은 세동맥·세기관지와 따로 주행합니다.","1":"대동맥에서 나오는 가는 가지는 기관지동맥이며, 허파동맥은 허파동맥줄기에서 옵니다.","2":"촘촘한 모세혈관그물은 폐포관 수준에서 폐포를 둘러싸며, 종말세기관지에서 처음 생긴다고 하지 않습니다.","3":"기관지동맥은 기관지 나무의 분지를 따라가며 기관지 벽을 공급합니다."},"one":"허파동맥은 기관지를 따라 분지하고, 허파세정맥은 이와 따로 주행한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_resp_histo/p33.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33"},{"u":"img/w11_resp_histo/p34.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 34"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-27":{"q":"Lymphatic drainage of the lungs is organized as:","o":["A single set of lymphatic vessels that begins in the alveolar air space itself","Drainage only along the pulmonary veins into the thoracic duct","A bronchial-tree path to hilar nodes and a second path along visceral pleura","Direct emptying into the pleural cavity, without any nodal stations","Lymphatics that begin in the nasal mucosa and skip the pulmonary hilum"],"a":2,"qk":"폐의 림프 배액 경로는 어떻게 구성되는가?","ok":["폐포 공기 공간에서 시작하는 단일한 림프관 세트","허파정맥만을 따라 가슴관으로 배액","기관지 나무를 따라 폐문 림프절로 가는 경로와 내장가슴막을 따르는 경로","림프절을 거치지 않고 가슴막공간으로 직접 배출","비점막에서 시작해 폐문을 건너뛰는 림프관"],"exp":"폐의 림프 배액은 **두 세트**입니다. 한 세트는 **세기관지 결합조직에서 시작**하여 기관지 나무를 거꾸로 따라 **폐문(hilum)**의 림프절로 갑니다. 다른 세트는 폐 **표면 부위를 배액**하며 **내장가슴막(visceral pleura)**을 따릅니다.\n\n그림에는 가슴막밑 림프총, 소엽사이 림프관, 폐내(폐) 림프절, **기관지폐(폐문) 림프절**, 아래·위 **기관지정맥주위(기관분기하, carinal 포함) 림프절**, **기관주위 림프절**, 아래깊은목(사각근) 림프절, 가슴관 등이 표시됩니다. 배액은 기관지·동맥·정맥을 따릅니다.","why":{"0":"림프관은 폐포 공기 공간이 아니라 세기관지 결합조직 등에서 시작하며, 세트가 하나가 아닙니다.","1":"배액은 기관지 나무를 따라 폐문 림프절로 가는 경로와 내장가슴막을 따르는 경로가 있습니다.","3":"림프는 폐문 등의 림프절을 거치며, 가슴막공간으로 직접 비운다고 하지 않습니다.","4":"폐 림프는 폐 안에서 시작해 폐문 쪽으로 모이며, 비점막에서 폐문을 건너뛰지 않습니다."},"one":"폐 림프는 기관지 나무를 따라 폐문 림프절로 가는 경로와 내장가슴막을 따르는 경로가 있다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35, 36","img":[{"u":"img/w11_resp_histo/p35.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35"},{"u":"img/w11_resp_histo/p36.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 36"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-28":{"q":"Innervation that controls the diameter of pulmonary airways and blood vessels is provided by:","o":["Somatic motor fibers that arise from the intercostal nerves","Sympathetic and parasympathetic fibers that follow the bronchial tree","Special visceral afferent fibers that originate in the olfactory bulb","Parasympathetic fibers of the phrenic nerve acting alone","Sympathetic fibers that terminate only in the vocalis muscle"],"a":1,"qk":"폐 기도와 혈관의 지름을 조절하는 신경지배는?","ok":["갈비사이신경의 몸운동섬유","기관지 나무를 따라가는 교감·부교감신경섬유","후각망울에서 오는 특수 내장들섬유","가로막신경의 부교감신경섬유만","성대근에서만 끝나는 교감신경섬유"],"exp":"폐의 신경지배에서 **교감신경과 부교감신경**은 평활근과 샘에 분포하여 **기도와 혈관의 지름**을 조절합니다. **일반내장들섬유(general visceral afferent fibers)**는 통증 감각을 전합니다. 이 신경들은 기관지 나무를 따르고 **폐문에서 나갑니다**.\n\n그림에는 미주신경(X), 앞·뒤 폐신경총, 교감신경줄기, 제6가슴 교감신경절이 표시됩니다. 갈비사이신경은 흉벽, 가로막신경은 가로막, 후각들섬유는 후각과 관련되며 폐 기도 지름 조절의 주된 경로가 아닙니다.","why":{"0":"갈비사이신경의 몸운동섬유는 갈비사이근 등을 지배하며, 폐 기도 평활근의 자율 조절이 아닙니다.","2":"후각망울의 특수 내장들섬유는 후각 경로이며 폐 기도 지름 조절이 아닙니다.","3":"가로막신경은 주로 가로막을 지배하며, 폐 신경총의 부교감 공급원은 미주신경입니다.","4":"성대근은 후두의 골격근이며, 폐 기도와 혈관 지름을 조절하는 자율신경의 종착이 아닙니다."},"one":"폐의 기도·혈관 지름은 기관지 나무를 따라 폐문으로 드나드는 교감·부교감신경이 조절한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35, 36","img":[{"u":"img/w11_resp_histo/p35.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 35"},{"u":"img/w11_resp_histo/p36.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 36"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-29":{"q":"Pleurisy is best defined as:","o":["Excess serous fluid in the pleural space from oversecretion by pleural cells","Fusion of the visceral and parietal pleura only at the lung apex","Keratinization of the pleural mesothelium after chronic irritation","Inflammation of the pleura, a very painful condition","Alveolar collapse caused by a deficiency of pulmonary surfactant"],"a":3,"qk":"가슴막염(pleurisy)의 정의로 가장 적절한 것은?","ok":["가슴막 세포의 과분비로 가슴막공간에 장액이 과잉으로 고인 상태","폐 꼭대기에서만 내장가슴막과 벽쪽가슴막이 유착된 상태","만성 자극 후 가슴막 중피가 각질화된 상태","가슴막의 염증으로, 매우 통증이 심한 상태","폐표면활성제 부족으로 폐포가 허탈된 상태"],"exp":"**가슴막(pleura)**은 **중피(mesothelium, 단층편평상피)**로, 흉강의 안쪽 벽(**벽쪽가슴막, parietal pleura**)과 폐의 바깥 면(**내장가슴막, visceral pleura**)을 덮습니다. 두 층은 **폐문에서 이어집니다**. 그 사이가 **가슴막공간(pleural cavity)**입니다.\n\n가슴막은 **장막(serous membrane)**으로, 두 층이 미끄러지도록 윤활 장액을 분비합니다. **가슴막의 염증**은 매우 아픈 상태이며 **가슴막염(pleurisy)**이라고 합니다. 병적 상태에서 가슴막 세포가 액을 과다 분비하면 **가슴막삼출(pleural effusion)**이 됩니다.\n\n따라서 염증(pleurisy)과 과잉 액(effusion)을 구별해야 합니다.\n\n벽쪽가슴막은 위치에 따라 **갈비가슴막(costal pleura)**, **가로막가슴막(diaphragmatic pleura)**, **세로칸가슴막(mediastinal pleura)** 등으로 나누며, 갈비가슴막을 젖히면 반전 부위와 함께 이 구역들이 드러납니다.","why":{"0":"장액 과잉은 가슴막삼출(pleural effusion)이며, 가슴막염의 정의가 아닙니다.","1":"두 층은 폐문에서 연속될 뿐, 꼭대기 유착이 가슴막염의 정의가 아닙니다.","2":"가슴막 중피의 각질화는 가슴막염의 정의로 제시되지 않았습니다.","4":"표면활성제 부족에 따른 폐포 허탈은 신생아 호흡곤란 등과 관련되며, 가슴막염이 아닙니다."},"one":"가슴막염은 매우 아픈 가슴막 염증이고, 장액 과잉은 가슴막삼출이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 37, 38, 39","img":[{"u":"img/w11_resp_histo/p37.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 37"},{"u":"img/w11_resp_histo/p38.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 38"},{"u":"img/w11_resp_histo/p39.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 39"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-30":{"q":"During quiet breathing, expiration occurs primarily because of:","o":["Passive recoil of the lungs and rib cage","Contraction of the sternocleidomastoid and scalene muscles","Contraction of the external intercostal muscles","Active descent of the domes of the diaphragm","Contraction of the interchondral part of the internal intercostals"],"a":0,"qk":"안정 호흡(quiet breathing)에서 날숨이 주로 일어나는 이유는?","ok":["폐와 흉곽의 수동적 반동","복장빗장꼭지근과 사각근의 수축","바깥갈비사이근의 수축","가로막 돔의 능동적 하강","속갈비사이근 중 연골사이 부분의 수축"],"exp":"호흡의 **으뜸근은 가로막(diaphragm)**입니다. 가로막이 수축하면 아래로 내려가 흉강 부피가 늘고 음압이 생겨 공기가 들어오며, 이완하면 흉강 부피가 줄어 양압으로 공기가 나갑니다.\n\n**안정 호흡의 날숨**은 **폐와 흉곽의 수동적 반동(passive recoil)**으로 일어납니다. 들숨의 으뜸근은 가로막, 바깥갈비사이근, 속갈비사이근의 연골사이 부분입니다.\n\n강제 들숨의 보조근은 **복장빗장꼭지근(sternocleidomastoid)**과 **사각근(scalenes)**입니다. 강제 날숨에는 속갈비사이근(연골사이 부분 제외)과 배곧은근·배바깥빗근·배속빗근·배가로근이 동원됩니다.","why":{"1":"복장빗장꼭지근과 사각근은 강제 들숨의 보조근입니다.","2":"바깥갈비사이근은 갈비를 올려 들숨 때 흉강 가로 지름을 늘립니다.","3":"가로막 돔의 하강은 들숨에서 수직 지름을 늘리는 작용입니다.","4":"속갈비사이근의 연골사이 부분은 갈비를 올리는 들숨 으뜸근입니다."},"one":"안정 날숨은 폐와 흉곽의 수동적 반동이며, 가로막은 들숨의 으뜸근이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 40, 41","img":[{"u":"img/w11_resp_histo/p40.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 40"},{"u":"img/w11_resp_histo/p41.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 41"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_thorax-1":{"q":"A distinctive feature of thoracic vertebrae, compared with typical cervical or lumbar vertebrae, is the presence of:","o":["A bifid spinous process and transverse foramina","Articular facets for ribs","Massive kidney-shaped bodies without costal facets","A dens (odontoid process) on the vertebral body","Absence of a vertebral foramen"],"a":1,"qk":"전형적인 목뼈나 허리뼈와 구별되는 등뼈(thoracic vertebrae)의 특징은?","ok":["갈라진 가시돌기와 가로돌기구멍","갈비와 관절하는 관절면(articular facets)","갈비 관절면이 없는 크고 콩팥형 몸통","척추뼈 몸통의 치아돌기(dens)","척추구멍의 부재"],"exp":"가슴우리의 뼈대에는 **등뼈 12개(T1–T12)**가 포함됩니다. 등뼈를 목뼈·허리뼈와 구별하는 핵심 특징은 **갈비와 관절하는 관절면(articular facets for ribs)**입니다.\n\n등뼈에는 가로돌기, 가시돌기, 갈비용 관절면이 강조됩니다. 가시돌기는 흔히 아래쪽으로 길고, 가로돌기에도 갈비 결절과 관절하는 면이 있습니다. 표지된 표본에서는 몸통, 다리(pedicle), 고리판(lamina), 가시돌기, 척추구멍, 아래·위척추패임이 보이며, **위척추패임은 척추사이구멍의 아래 가장자리**를 이룹니다.","why":{"0":"갈라진 가시돌기와 가로돌기구멍은 전형적인 목뼈의 특징입니다.","2":"크고 콩팥형이며 갈비 관절면이 없는 몸통은 허리뼈에 가깝습니다.","3":"치아돌기(dens)는 중쇠뼈(C2)의 특징입니다.","4":"등뼈에도 척수가 지나는 척추구멍이 있습니다."},"one":"등뼈(T1–T12)의 구별점은 갈비와 관절하는 관절면이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_thorax/p02.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 2"},{"u":"img/w11_thorax/p03.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 3"},{"u":"img/w11_thorax/p04.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 4"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-2":{"q":"A typical rib articulates with the vertebral column at which sites?","o":["Only the vertebral body of the same-numbered thoracic vertebra itself","The xiphoid process together with the manubrium of the sternum","A single transverse process of a lumbar vertebra","Two thoracic vertebrae (head) and a transverse process (tubercle)","The spinous processes of two adjacent thoracic vertebrae"],"a":3,"qk":"전형적 갈비는 척주와 어느 부위에서 관절하는가?","ok":["같은 번호 등뼈의 몸통만","칼돌기와 복장뼈자루","하나의 허리뼈 가로돌기","두 등뼈(갈빗대머리)와 하나의 가로돌기(결절)","이웃한 두 척추뼈의 가시돌기"],"exp":"전형적 갈비는 **두 등뼈**와 관절합니다. **갈빗대머리(head)**는 인접한 두 등뼈 몸통의 반관절면(위·아래 관절면)과 관절하고, **결절(tubercle)**의 관절면은 가로돌기와 **갈비가로돌기관절(costotransverse joint)**을 이룹니다.\n\n옆모습과 약간 비스듬한 그림에서 머리 쪽 두 화살표와 가로돌기 쪽 한 화살표가 이 세 관절점을 가리킵니다. 전형적 갈비의 머리에는 등뼈 몸통을 위한 위·아래 관절면, 목, 가로돌기용 관절면, 각, 갈비고랑이 표지됩니다.","why":{"0":"전형적 갈빗대머리는 같은 번호 등뼈만이 아니라 인접한 두 등뼈 몸통과 관절합니다.","1":"칼돌기와 복장뼈자루는 복장뼈의 부분이며, 갈비의 척추 관절이 아닙니다.","2":"전형적 갈비는 허리뼈가 아니라 등뼈의 가로돌기와 관절합니다.","4":"갈비는 가시돌기와 관절하지 않습니다."},"one":"전형적 갈빗대머리는 두 등뼈와, 결절은 가로돌기와 관절한다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 5, 6","img":[{"u":"img/w11_thorax/p05.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 5"},{"u":"img/w11_thorax/p06.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 6"},{"u":"img/w11_thorax/p09.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-3":{"q":"Ribs 8–10 are classified as:","o":["False ribs","True ribs","Floating ribs","Cervical ribs","Atypical first ribs"],"a":0,"qk":"8–10번 갈비의 분류는?","ok":["거짓갈비(false ribs)","참갈비(true ribs)","떠갈비(floating ribs)","목갈비(cervical ribs)","비전형적 첫째 갈비"],"exp":"갈비는 **12쌍**입니다. **1–7번**은 **참갈비(true ribs)**로, 각자의 갈비연골로 복장뼈에 붙습니다. **8–10번**은 **거짓갈비(false ribs)**로, 연골이 바로 위 갈비연골에 붙어 간접적으로 복장뼈와 연결됩니다. **11, 12번**은 **떠갈비(floating ribs)**로, 앞쪽에서 복장뼈와 연결되지 않습니다.\n\n그림에서 갈비연골(costal cartilages)이 참갈비와 거짓갈비를 복장뼈 쪽으로 잇고, 11·12번은 앞 연결 없이 가리켜집니다. 첫째·둘째 갈비는 따로 **비전형적 갈비(atypical ribs)**로 불립니다.","why":{"1":"참갈비는 1–7번입니다.","2":"떠갈비는 11, 12번입니다.","3":"목갈비는 약 0.2%에서 나타나는 기형이지 8–10번의 정상 분류가 아닙니다.","4":"비전형적 첫째(및 둘째) 갈비는 1번(및 2번)을 가리킵니다."},"one":"1–7번은 참갈비, 8–10번은 거짓갈비, 11–12번은 떠갈비이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w11_thorax/p07.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 7"},{"u":"img/w11_thorax/p11.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 11"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-4":{"q":"The manubriosternal joint is classified as a:","o":["Synovial plane joint","Synchondrosis","Syndesmosis","Gomphosis","Symphysis"],"a":4,"qk":"복장뼈자루–몸통 관절(manubriosternal joint)의 분류는?","ok":["윤활 평면관절","연골결합(synchondrosis)","인대결합(syndesmosis)","못박이관절(gomphosis)","심피시스(symphysis)"],"exp":"가슴우리 앞쪽의 갈비·복장 관절은 종류가 다릅니다. 그림에서 **심피시스(symphysis)**는 복장뼈자루와 몸통 사이, 즉 **복장뼈자루–몸통 관절(manubriosternal joint, 복장뼈각)**을 가리킵니다.\n\n**연골결합(synchondroses)**은 첫째 갈비–복장뼈 이음과 칼돌기–몸통(검상복장) 이음 쪽으로 표시됩니다. 아래쪽 복장갈비 이음 등은 **윤활관절(synovial joints)**로 표시됩니다.\n\n따라서 복장뼈각은 윤활관절이나 일차연골결합이 아니라 심피시스입니다.","why":{"0":"그림에서 윤활관절은 아래쪽 복장갈비 이음 등을 가리키며, 복장뼈자루–몸통 관절은 심피시스입니다.","1":"연골결합은 첫째 복장갈비 이음과 검상복장 이음 쪽에 해당합니다.","2":"인대결합은 복장뼈자루–몸통 관절의 분류가 아닙니다.","3":"못박이관절은 치아와 치조골 사이의 관절 유형입니다."},"one":"복장뼈자루–몸통 관절은 심피시스이고, 첫째 복장갈비·검상복장 이음은 연골결합이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 8","img":[{"u":"img/w11_thorax/p08.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 8"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-5":{"q":"On a typical rib, the costal groove is located along the:","o":["Superior border of the neck","Articular facet of the tubercle","Inferior aspect of the shaft","Head, between the two articular facets","Sternal end of the costal cartilage"],"a":2,"qk":"전형적 갈비에서 갈비고랑(costal groove)의 위치는?","ok":["목의 위모서리","결절의 관절면","몸통(shaft)의 아래쪽","머리의 두 관절면 사이","갈비연골의 복장뼈 쪽 끝"],"exp":"전형적 갈비에는 **머리(head)**와 등뼈 몸통을 위한 **위·아래 관절면**, **목(neck)**, 가로돌기와 관절하는 **결절의 관절면**, **각(angle)**, 그리고 **갈비고랑(costal groove)**이 있습니다.\n\n갈비고랑은 **몸통(shaft)의 아래쪽(안쪽 아랫모서리)**에 있으며, 이곳으로 **갈비사이 정맥·동맥·신경(VAN)**이 지납니다. 따라서 흉강 천자 때는 갈비의 위모서리를 스치듯 지나 고랑의 신경혈관 다발을 피합니다.","why":{"0":"목의 위모서리에는 갈비고랑이 있지 않습니다. 고랑은 몸통 아래쪽에 있습니다.","1":"결절의 관절면은 등뼈 가로돌기와 관절하는 부위입니다.","3":"머리의 두 관절면은 인접 등뼈 몸통과의 관절면입니다.","4":"복장뼈 쪽 연골 끝은 갈비고랑의 위치가 아닙니다."},"one":"갈비고랑은 갈비 몸통 아래쪽에 있으며, 이곳으로 VAN이 지난다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w11_thorax/p09.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 9"},{"u":"img/w11_thorax/p25.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-6":{"q":"A cervical rib is an anatomic anomaly present in about:","o":["20% of all people","2% of people","10% of people","50% of people","0.2% of people"],"a":4,"qk":"목갈비(cervical rib)는 대략 몇 퍼센트의 사람에서 나타나는 기형인가?","ok":["약 20%","약 2%","약 10%","약 50%","약 0.2%"],"exp":"**목갈비(cervical rib)**는 목뼈(보통 C7)에서 나오는 덧갈비로, 약 **0.2%**의 사람에서 나타나는 기형입니다.\n\n그림에서 화살표는 제7목뼈 쪽에서 나온 덧갈비 위를 지나가는 팔신경얼기 줄기를 가리킵니다. 빈도는 드물지만, 존재하는 경우 위쪽 가슴우리 출구에서 신경·혈관을 압박할 수 있는 해부학 변이로 중요합니다.\n\n20%, 10%, 2%, 50%는 이 기형의 빈도로 제시된 수치가 아닙니다.","why":{"0":"20%는 제시된 빈도보다 훨씬 높습니다. 이 기형의 빈도는 약 0.2%입니다.","1":"2% 또한 제시된 0.2%보다 큽니다.","2":"10%는 제시된 빈도가 아닙니다.","3":"절반에 해당하는 50%는 이 기형의 빈도가 아닙니다."},"one":"목갈비는 약 0.2%에서 나타나는 기형으로, 팔신경얼기와 인접할 수 있다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_thorax/p10.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 10"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-7":{"q":"The three parts of the sternum are the:","o":["Manubrium, body, and xiphoid","Manubrium, sternal angle, and costal margin","Body, sternal angle, and clavicle","Xiphoid, costal cartilage, and pedicle","Manubrium, lamina, and spinous process"],"a":0,"qk":"복장뼈(sternum)를 이루는 세 부분은?","ok":["복장뼈자루, 몸통, 칼돌기","복장뼈자루, 복장뼈각, 갈비연골활","몸통, 복장뼈각, 빗장뼈","칼돌기, 갈비연골, 척추뼈다리","복장뼈자루, 고리판, 가시돌기"],"exp":"**복장뼈(sternum)**는 **복장뼈자루(manubrium)**, **몸통(body)**, **칼돌기(xiphoid)**의 세 부분으로 이루어집니다.\n\n자루는 위쪽(빗장뼈·첫째 갈비와 연결), 몸통은 가운데, 칼돌기는 아래 끝입니다. 자루와 몸통 사이가 복장뼈각이며, 앞서 본 대로 이 이음은 심피시스입니다.\n\n첫째·둘째 갈비는 같은 뼈대 단원에서 **비전형적 갈비(atypical ribs)**로 따로 제시됩니다. 복장뼈각, 갈비연골활, 빗장뼈, 척추뼈 구조는 복장뼈의 세 부분이 아닙니다.","why":{"1":"복장뼈각과 갈비연골활은 표지점·경계이지, 복장뼈 자체 세 부분이 아닙니다.","2":"복장뼈각과 빗장뼈는 복장뼈를 구성하는 세 부분이 아닙니다.","3":"갈비연골과 척추뼈다리는 복장뼈의 구성 부분이 아닙니다.","4":"고리판과 가시돌기는 척추뼈의 부분입니다."},"one":"복장뼈는 복장뼈자루, 몸통, 칼돌기의 세 부분으로 이루어진다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 12","img":[{"u":"img/w11_thorax/p11.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 11"},{"u":"img/w11_thorax/p12.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 12"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-8":{"q":"The muscles of the thoracic wall consist of which three layers of intercostal muscles?","o":["External oblique, internal oblique, and transversus abdominis","Scalenes, sternocleidomastoid, and transversus thoracis","External, internal, and innermost intercostals","External intercostals, diaphragm, and rectus abdominis","Subcostals, vocalis, and trachealis"],"a":2,"qk":"흉벽 근육을 이루는 세 층의 갈비사이근은?","ok":["배바깥빗근, 배속빗근, 배가로근","사각근, 복장빗장꼭지근, 가슴가로근","바깥·속·가장속갈비사이근","바깥갈비사이근, 가로막, 배곧은근","갈비아래근, 성대근, 기관근"],"exp":"흉벽 근육은 세 층의 **갈비사이근(intercostal muscles)**으로 구성됩니다. 바깥에서 안으로 **바깥갈비사이근(external intercostals)**, **속갈비사이근(internal intercostals)**, **가장속갈비사이근(innermost intercostals)**입니다.\n\n가로단면에서는 각 층과 함께, 바깥갈비사이근 깊은 쪽의 속갈비사이막, 앞쪽의 바깥갈비사이막, 그리고 가장속층에 속하는 **가슴가로근(transversus thoracis)**이 보입니다. 갈비사이 신경혈관 다발은 속층과 가장속층 사이를 지납니다.\n\n배근육 세 층은 복벽의 대응 층이며, 가로막·목 보조호흡근은 갈비사이 세 층이 아닙니다.","why":{"0":"이들은 복벽의 세 층이지 흉벽 갈비사이근 세 층이 아닙니다.","1":"사각근과 복장빗장꼭지근은 들숨 보조근이고, 가슴가로근은 가장속층의 일부일 뿐입니다.","3":"가로막과 배곧은근은 중요 호흡근이지만 갈비사이 세 층이 아닙니다.","4":"갈비아래근은 가장속층의 일부이지만, 성대근과 기관근은 갈비사이층이 아닙니다."},"one":"흉벽은 바깥·속·가장속갈비사이근의 세 층으로 이루어진다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_thorax/p13.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 13"},{"u":"img/w11_thorax/p14.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-9":{"q":"Transversus thoracis muscles, seen on the interior of the anterior thoracic wall, are part of the:","o":["External intercostal layer","Innermost intercostals","Diaphragm","Pectoralis minor","External intercostal membrane only"],"a":1,"qk":"앞가슴벽 안쪽에서 보이는 가슴가로근(transversus thoracis)은 어느 층의 일부인가?","ok":["바깥갈비사이근 층","가장속갈비사이근","가로막","작은가슴근","바깥갈비사이막만"],"exp":"**가슴가로근(transversus thoracis)**은 **가장속갈비사이근(innermost intercostals)**의 일부입니다. 앞가슴벽의 **안쪽(interior: anterior thoracic wall)**에서 보이며, 복장뼈와 갈비연골 안쪽에서 가쪽·위쪽으로 비스듬히 달리는 근속으로 표시됩니다.\n\n같은 가장속층에는 뒤쪽에서 **갈비아래근(subcostal muscles)**도 포함됩니다. 가슴가로근은 가로막(아래)이나 작은가슴근(바깥 앞가슴)과 혼동하면 안 됩니다.","why":{"0":"바깥갈비사이근은 가장 얕은 층이며 가슴가로근이 속하지 않습니다.","2":"가로막은 아래가슴문을 덮는 근육이지 가슴가로근이 아닙니다.","3":"작은가슴근은 앞가슴 바깥의 가슴대이음 근육입니다.","4":"바깥갈비사이막은 바깥층의 막성 연속이지 가슴가로근이 아닙니다."},"one":"가슴가로근은 앞가슴벽 안쪽의 가장속갈비사이근 일부이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w11_thorax/p15.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 15"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-10":{"q":"Subcostal muscles, also part of the innermost intercostals, are distinguished because they:","o":["Attach only to the sternum and costal cartilages","Occupy a single intercostal space on the anterior wall","Are found exclusively in the cervical region","Cross 2 or 3 intercostal spaces","Insert on the clavicle and the first rib"],"a":3,"qk":"가장속갈비사이근의 일부인 갈비아래근(subcostal muscles)의 구별점은?","ok":["복장뼈와 갈비연골에만 붙는다","앞벽의 한 갈비사이만 차지한다","목 부위에만 있다","갈비사이 2 또는 3칸을 가로지른다","빗장뼈와 첫째 갈비에 닿는다"],"exp":"**갈비아래근(subcostal muscles)**은 **가장속갈비사이근**의 일부이며, **갈비사이 2 또는 3칸을 가로지르는(cross 2 or 3 intercostal spaces)** 점이 구별점입니다.\n\n이들은 등뼈 근처의 뒤가슴벽 안쪽에 있으며, 한 칸만 건너는 일반적인 갈비사이근보다 더 긴 경로를 갖습니다. 복장뼈에 붙는 것은 가슴가로근에 가깝고, 빗장뼈·첫째 갈비는 사각근 등의 부착입니다.","why":{"0":"복장뼈·갈비연골 안쪽에 있는 것은 가슴가로근에 해당합니다.","1":"갈비아래근은 한 칸이 아니라 2–3칸을 건너며, 주로 뒤쪽에 있습니다.","2":"갈비아래근은 목 부위가 아니라 등뼈 근처 가슴벽에 있습니다.","4":"빗장뼈와 첫째 갈비 부착은 사각근 등의 특징입니다."},"one":"갈비아래근은 가장속층의 일부로, 갈비사이 2–3칸을 가로지른다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w11_thorax/p16.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 16"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-11":{"q":"A preganglionic sympathetic fiber that passes through the sympathetic chain without synapsing, then synapses outside the chain, travels in a:","o":["White ramus that ends in the same-level ganglion only","Gray ramus communicans to a spinal nerve","Splanchnic nerve that synapses outside the chain","Phrenic nerve supplying the diaphragm","Recurrent laryngeal branch of the vagus"],"a":2,"qk":"교감신경줄기를 연접 없이 통과한 뒤 줄기 밖에서 연접하는 절전 교감신경섬유가 지나는 것은?","ok":["같은 높이 신경절에서만 끝나는 흰교통가지","척수신경으로 가는 회색교통가지","줄기 밖에서 연접하는 내장신경(splanchnic nerve)","가로막신경","되돌이후두신경"],"exp":"절전·절후 교감신경의 경로에는 **네 가지** 가능성이 있습니다. ① 같은 높이에서 연접, ② 줄기를 올라가 더 높은 높이에서 연접, ③ 줄기를 내려가 더 낮은 높이에서 연접, ④ **줄기에서 연접하지 않고 통과(내장신경, splanchnic nerve)**한 뒤 **교감신경줄기 밖에서 연접**합니다.\n\n그림에는 흰교통가지, 회색교통가지, 배골반내장신경 등이 표시됩니다. 갈비사이신경은 앞가지이고, 교통가지(rami communicantes; 단수 ramus communicans)가 교감신경줄기와 연결됩니다.","why":{"0":"같은 높이 신경절에서 연접하는 것은 네 경로 중 첫 번째이며, 줄기를 통과해 밖에서 연접하는 내장신경 경로가 아닙니다.","1":"회색교통가지는 대개 절후섬유가 척수신경으로 돌아가는 경로입니다.","3":"가로막신경은 주로 가로막의 몸운동·감각을 담당합니다.","4":"되돌이후두신경은 미주신경의 가지로, 이 교감신경 네 경로의 이름이 아닙니다."},"one":"교감신경줄기를 연접 없이 지나 밖에서 연접하는 절전섬유는 내장신경으로 간다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w11_thorax/p18.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 18"},{"u":"img/w11_thorax/p19.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 19"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-12":{"q":"A potential collateral pathway in the thoracic wall is the anastomosis between the:","o":["Pulmonary trunk and the bronchial arterial branches","Azygos vein and the thoracic duct","Phrenic and vagus nerves","Left and right pulmonary veins only","Posterior and anterior intercostal arteries"],"a":4,"qk":"흉벽에서 잠재적 곁순환 경로가 되는 문합은?","ok":["허파동맥줄기와 기관지동맥","홀정맥과 가슴관","가로막신경과 미주신경","좌우 허파정맥만","뒤갈비사이동맥과 앞갈비사이동맥"],"exp":"흉벽 가로단면에는 **뒤갈비사이동맥과 앞갈비사이동맥의 문합 부위(site of anastomosis / potential collateral pathway)**가 명시되어 있습니다.\n\n뒤갈비사이동맥은 주로 가슴대동맥에서, 앞갈비사이동맥은 **속가슴동맥(internal thoracic artery)**에서 옵니다. 두 동맥이 갈비사이에서 이어지므로, 한쪽 근위부가 좁아지거나 막혀도 흉벽으로 혈액이 우회할 수 있습니다.\n\n앞갈비사이동맥, 가로막신경동맥(musculophrenic), 위배벽동맥(superior epigastric)은 속가슴동맥의 가지·종말입니다.","why":{"0":"허파동맥줄기와 기관지동맥의 관계는 폐 순환이며, 흉벽 곁순환으로 표시된 문합이 아닙니다.","1":"홀정맥은 정맥 배액, 가슴관은 림프 통로로, 이 동맥 문합이 아닙니다.","2":"가로막신경과 미주신경은 신경이며 동맥 곁순환이 아닙니다.","3":"허파정맥은 폐에서 좌심방으로 가는 혈류이며 흉벽 갈비사이동맥 문합이 아닙니다."},"one":"뒤·앞갈비사이동맥의 문합은 흉벽의 잠재적 곁순환 경로이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14, 17, 21, 23","img":[{"u":"img/w11_thorax/p14.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 14"},{"u":"img/w11_thorax/p17.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 17"},{"u":"img/w11_thorax/p21.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 21"},{"u":"img/w11_thorax/p23.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-13":{"q":"The internal thoracic artery terminates by dividing into the:","o":["Posterior intercostal arteries and the subclavian artery","Musculophrenic and superior epigastric arteries","Azygos and hemiazygos veins","Bronchial and pulmonary arteries","Lateral and anterior cutaneous nerves"],"a":1,"qk":"속가슴동맥(internal thoracic artery)의 종말 분지는?","ok":["뒤갈비사이동맥과 빗장밑동맥","가로막신경동맥과 위배벽동맥","홀정맥과 반홀정맥","기관지동맥과 허파동맥","가쪽 및 앞쪽 피부신경"],"exp":"**속가슴동맥(internal thoracic a.)**은 빗장밑동맥에서 내려와 복장뼈 가장자리를 따라 주행하며 **앞갈비사이동맥(anterior intercostal aa.)**을 냅니다. 아래쪽에서는 **가로막신경동맥(musculophrenic a.)**과 **위배벽동맥(superior epigastric a.)**으로 갈라져 끝납니다.\n\n가로막신경동맥은 갈비연골활을 따라가고, 위배벽동맥은 배로 계속 내려갑니다. 뒤갈비사이동맥은 주로 대동맥 기원이므로 속가슴동맥의 종말 분지가 아닙니다.","why":{"0":"빗장밑동맥은 속가슴동맥의 기원이 되고, 뒤갈비사이동맥은 대개 대동맥에서 옵니다.","2":"홀정맥과 반홀정맥은 정맥이며 속가슴동맥의 종말이 아닙니다.","3":"기관지동맥과 허파동맥은 폐의 혈류이며 속가슴동맥의 종말이 아닙니다.","4":"앞·가쪽 피부신경은 갈비사이신경의 가지이지 동맥 분지가 아닙니다."},"one":"속가슴동맥은 앞갈비사이가지를 낸 뒤 가로막신경동맥과 위배벽동맥으로 끝난다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23","img":[{"u":"img/w11_thorax/p23.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 23"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-14":{"q":"Posterior intercostal veins drain to the:","o":["Azygos venous system","Internal thoracic veins only","Pulmonary veins","Portal vein","Inferior vena cava at T8 only"],"a":0,"qk":"뒤갈비사이정맥은 어디로 배액되는가?","ok":["홀정맥계통(azygos venous system)","속가슴정맥만","허파정맥","문맥","T8 높이의 아래대정맥만"],"exp":"**뒤갈비사이정맥(posterior intercostal veins)**은 **홀정맥계통(azygos venous system)**으로 배액됩니다. 그림에는 오른쪽에 **홀정맥(azygos vein)**이 위대정맥으로 들어가고, 왼쪽에 **덧반홀정맥(accessory hemiazygos)**과 **반홀정맥(hemiazygos vein)**이 표시됩니다.\n\n홀정맥계통은 뒤가슴벽과 일부 후복막 구조를 위대정맥으로 연결하는 중요 측부 경로입니다. 허파정맥·문맥·속가슴정맥만으로의 배액과는 구분해야 합니다.","why":{"1":"속가슴정맥은 앞쪽 가슴벽 배액에 관여하며, 뒤갈비사이정맥의 주 경로로 제시된 것은 홀정맥계통입니다.","2":"허파정맥은 폐의 가스교환 혈액을 좌심방으로 돌립니다.","3":"문맥은 소화관 혈류를 간으로 보내는 계통입니다.","4":"아래대정맥이 T8에서 가로막을 지나는 것은 사실이지만, 뒤갈비사이정맥의 배액처로 제시된 것은 홀정맥계통입니다."},"one":"뒤갈비사이정맥은 홀정맥·반홀정맥·덧반홀정맥으로 이루어진 홀정맥계통으로 배액된다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w11_thorax/p24.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 24"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-15":{"q":"In the costal groove, the intercostal neurovascular structures are arranged from superior to inferior as:","o":["Nerve, artery, vein","Artery, nerve, vein","Vein, nerve, artery","Vein, artery, nerve","Artery, vein, nerve"],"a":3,"qk":"갈비고랑에서 갈비사이 신경혈관 구조의 위→아래 배열은?","ok":["신경, 동맥, 정맥","동맥, 신경, 정맥","정맥, 신경, 동맥","정맥, 동맥, 신경","동맥, 정맥, 신경"],"exp":"갈비고랑의 신경혈관 다발은 위에서 아래로 **정맥–동맥–신경(Vein, Artery, Nerve; VAN)** 순입니다. 그림에서 파란 정맥, 붉은 동맥, 노란 신경이 이 순서로 표시됩니다.\n\n신경이 가장 아래에 있어 갈비 아래 모서리에서 가장 노출됩니다. 그래서 흉강 천자 바늘은 아래쪽 갈비의 **위모서리**로 넣어 고랑의 VAN을 피합니다. 갈비사이신경은 등뼈척수신경의 **앞가지(anterior ramus)**입니다.\n\n갈비사이신경의 가지로 **앞쪽·가쪽 피부신경(anterior and lateral cutaneous nerves)**이 나와 흉벽 피부를 지배합니다.","why":{"0":"신경이 가장 위가 아닙니다. 올바른 순서는 정맥–동맥–신경입니다.","1":"동맥이 가장 위가 아니며, 신경이 가운데도 아닙니다.","2":"정맥이 위인 것은 맞지만, 가운데는 동맥이고 신경이 가장 아래입니다.","4":"동맥–정맥–신경은 올바른 VAN 순서가 아닙니다."},"one":"갈비고랑의 배열은 위부터 정맥–동맥–신경(VAN)이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25, 18, 20, 22","img":[{"u":"img/w11_thorax/p25.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 25"},{"u":"img/w11_thorax/p18.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 18"},{"u":"img/w11_thorax/p20.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 20"},{"u":"img/w11_thorax/p22.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 22"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-16":{"q":"The boundaries of the superior thoracic aperture include the:","o":["Sternum, first rib, and first thoracic vertebra","Xiphisternal joint, the twelfth ribs, and vertebra T12","Sternal angle, second rib, and T4","Costal margin, xiphoid, and T10","Clavicle, scapula, and C7 vertebra"],"a":0,"qk":"위가슴문(superior thoracic aperture)의 경계는?","ok":["복장뼈, 첫째 갈비, 첫째 등뼈","검상복장관절, 열두째 갈비, T12","복장뼈각, 둘째 갈비, T4","갈비연골활, 칼돌기, T10","빗장뼈, 어깨뼈, C7 척추뼈"],"exp":"**위가슴문(superior thoracic aperture)**의 경계는 **복장뼈(sternum)**, **첫째 갈비(1st rib)**, **첫째 등뼈(T1)**입니다. 그림의 화살표가 이 뼈 경계를 가리킵니다.\n\n검상복장관절, 열두째 갈비, T12는 **아래가슴문(inferior thoracic aperture)**의 경계에 해당합니다. 복장뼈각·T4는 중요한 표지점일 수 있으나 위가슴문의 뼈 경계로 제시되지는 않았습니다.","why":{"1":"이들은 아래가슴문의 경계입니다.","2":"복장뼈각, 둘째 갈비, T4는 위가슴문의 경계로 제시되지 않았습니다.","3":"갈비연골활과 칼돌기는 아래가슴문 쪽 경계에 가깝습니다.","4":"빗장뼈와 어깨뼈, C7은 위가슴문의 세 경계로 열거되지 않았습니다."},"one":"위가슴문의 경계는 복장뼈, 첫째 갈비, T1이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w11_thorax/p26.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 26"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-17":{"q":"Structures that pass through the superior thoracic aperture include the:","o":["Inferior vena cava at T8, abdominal aorta at T12, both kidneys, adrenal glands, lumbar trunks, and spleen","Thoracic aorta behind the diaphragm at T12, the cisterna chyli, both kidneys, and ureters","Kidneys, adrenal glands, lumbar plexus, and the lower rectum only","Trachea, esophagus, aortic branches, brachiocephalic veins, phrenic and vagus nerves, and thoracic duct","Esophagus at the T10 hiatus, the IVC at T8, the aorta at T12, and the spleen"],"a":3,"qk":"위가슴문을 지나는 구조로 옳은 것은?","ok":["T8의 아래대정맥, T12의 배대동맥, 양쪽 콩팥, 부신 및 허리줄기판","T12에서 가로막 뒤의 가슴대동맥, 유미조, 양쪽 콩팥 및 요관","콩팥, 부신, 허리신경얼기 및 아래곧창자만","기관, 식도, 대동맥 가지, 팔머리정맥, 가로막신경과 미주신경, 가슴관","T10 식도구멍의 식도, T8 아래대정맥, T12 대동맥 및 지라"],"exp":"위가슴문의 **내용물**은 **기관(trachea)**, **식도(esophagus)**, **대동맥에서 가는 가지(branches from aorta)**, **팔머리정맥(brachiocephalic veins)**, **가로막신경과 미주신경(phrenic and vagus nn.)**, **가슴관(thoracic duct)**입니다.\n\n그림에서 점선이 위가슴문 평면 주위를 표시합니다. 아래대정맥(T8), 식도구멍(T10), 대동맥이 가로막 뒤를 지나는 T12는 아래가슴문·가로막 통과 높이입니다.","why":{"0":"아래대정맥이 T8에서 가로막을 지나는 것은 아래가슴문 내용입니다.","1":"대동맥이 T12에서 가로막 뒤를 지나는 것 역시 아래쪽 통과입니다.","2":"콩팥과 부신은 후복막 구조로 위가슴문의 내용이 아닙니다.","4":"식도는 위가슴문도 지나지만, T10 식도구멍만으로 위가슴문 내용을 설명할 수 없습니다."},"one":"위가슴문으로는 기관, 식도, 대동맥 가지, 팔머리정맥, 가로막·미주신경, 가슴관이 지난다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 27","img":[{"u":"img/w11_thorax/p27.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 27"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-18":{"q":"Boundaries of the inferior thoracic aperture include the:","o":["Sternum, first rib, and the first thoracic vertebra","Clavicles, the manubrium, and also the seventh cervical vertebra","Sternal angle together with the second ribs only","T12, twelfth ribs, costal cartilages, and xiphisternal joint","Scapulae, clavicles, and the first ribs only"],"a":3,"qk":"아래가슴문(inferior thoracic aperture)의 경계는?","ok":["복장뼈, 첫째 갈비, T1","빗장뼈, 복장뼈자루, C7","복장뼈각과 둘째 갈비만","T12, 열두째 갈비, 갈비연골, 검상복장관절","어깨뼈, 빗장뼈, 첫째 갈비만"],"exp":"**아래가슴문**의 경계는 **T12 척추뼈**, **열두째 갈비(12th ribs)**, **갈비연골(costal cartilages)**, **검상복장관절(xiphisternal joint)**입니다. 그림에서 상자·화살표가 이 아래쪽 경계를 가리킵니다.\n\n복장뼈·첫째 갈비·T1은 위가슴문의 경계입니다. 아래가슴문은 **가로막이 덮고** 있으며, 주요 구조는 특정 높이로 지나갑니다.","why":{"0":"복장뼈, 첫째 갈비, T1은 위가슴문의 경계입니다.","1":"빗장뼈와 C7은 아래가슴문 경계로 제시되지 않았습니다.","2":"복장뼈각과 둘째 갈비는 아래가슴문의 전체 경계가 아닙니다.","4":"어깨뼈와 빗장뼈는 아래가슴문 경계가 아닙니다."},"one":"아래가슴문의 경계는 T12, 열두째 갈비, 갈비연골, 검상복장관절이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_thorax/p28.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 28"},{"u":"img/w11_thorax/p29.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 29"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-19":{"q":"The inferior vena cava passes through the diaphragm at which vertebral level?","o":["T6","T10","T12","C7","T8"],"a":4,"qk":"아래대정맥이 가로막을 지나는 척추 높이는?","ok":["T6","T10","T12","C7","T8"],"exp":"아래가슴문은 **가로막이 덮습니다**. 주요 통과 높이는 다음과 같습니다. **아래대정맥(IVC)**은 **T8**에서 가로막을 지나고, **식도**는 **T10**에서 지나며, **대동맥은 T12에서 가로막 뒤(passes behind)**를 지납니다.\n\n흔히 I-8, E-10, A-12로 외웁니다. 'passes behind'라는 표현은 대동맥구멍이 가로막 각 사이·뒤에 있음을 강조합니다. 위쪽에서 본 그림에 이 통과 구조가 화살표로 표시됩니다.","why":{"0":"T6은 아래대정맥의 가로막 통과 높이로 제시되지 않았습니다.","1":"T10은 식도가 가로막을 지나는 높이입니다.","2":"T12는 대동맥이 가로막 뒤를 지나는 높이입니다.","3":"C7은 아래가슴문 통과 높이가 아닙니다."},"one":"가로막 통과는 아래대정맥 T8, 식도 T10, 대동맥은 T12에서 뒤쪽으로 지난다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w11_thorax/p30.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 30"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-20":{"q":"“Bucket-handle” movements of the ribs during inspiration primarily increase the thorax’s:","o":["Vertical diameter only","Tracheal length","Transverse diameter","Peritoneal volume","Tension in the vocal ligaments"],"a":2,"qk":"들숨 때 갈비의 “바구니 손잡이(bucket-handle)” 운동이 주로 늘리는 것은?","ok":["수직 지름만","기관의 길이","가로 지름(transverse diameter)","복막강의 부피","성대인대의 긴장"],"exp":"들숨에서는 가로막이 내려가 **수직 지름**이 늘고, 갈비사이근의 작용으로 **가로 지름**과 **앞뒤 지름**이 늘어 흉강 부피가 증가합니다.\n\n갈비의 **바구니 손잡이(bucket-handle)** 운동은 주로 **가로 지름**을 늘리고, 복장갈비 이음에서의 **펌프 손잡이(pump-handle)** 운동은 **앞뒤 지름**을 늘립니다.\n\n날숨에서는 가로막·갈비사이근 등이 이완하여 흉강 부피가 줄고 흉강 내압이 오르며, 폐의 탄력 반동이 더해집니다.","why":{"0":"수직 지름의 증가는 주로 가로막이 내려가기 때문입니다.","1":"바구니 손잡이 운동의 주된 효과는 기관 길이가 아니라 흉곽 가로 지름입니다.","3":"복막강 부피는 이 흉곽 운동의 일차 목표가 아닙니다.","4":"성대인대 긴장은 발성과 관련되며 바구니 손잡이 운동의 효과가 아닙니다."},"one":"바구니 손잡이 운동은 흉곽 가로 지름을, 펌프 손잡이 운동은 앞뒤 지름을 늘린다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w11_thorax/p31.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 31"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-21":{"q":"Which of the following is a named region of parietal pleura?","o":["Visceral pleura over the oblique fissure","Cervical pleura","Mesothelium of the pulmonary ligament at the hilum of the liver","Endothoracic fascia of the abdomen","Adventitia of the trachea"],"a":1,"qk":"벽쪽가슴막(parietal pleura)의 구역으로 이름이 붙은 것은?","ok":["빗열 위의 내장가슴막","목가슴막(cervical pleura)","간문 폐인대의 중피","배의 가슴속근막","기관의 외막"],"exp":"가슴막은 흉강을 만들고 폐를 덮습니다. **벽쪽가슴막(parietal pleura)**은 흉벽 쪽, **내장가슴막(visceral pleura)**은 폐 표면이며, 그 사이가 **가슴막공간(pleural cavity)**입니다. 내장가슴막은 폐 표면의 얇은 중피로 보입니다.\n\n벽쪽가슴막의 구역은 **갈비가슴막(costal)**, **가로막가슴막(diaphragmatic)**, **목가슴막(cervical)**, **세로칸가슴막(mediastinal)**입니다. 그림에서 위쪽 화살표는 폐꼭대기 위의 목가슴막, 가쪽은 갈비가슴막, 아래는 가로막가슴막, 안쪽은 세로칸가슴막을 가리킵니다.","why":{"0":"빗열을 덮는 것은 내장가슴막이며, 벽쪽가슴막의 구역 이름이 아닙니다.","2":"폐인대는 폐문 주위 가슴막 주름과 관련되며, 간문의 구조가 아닙니다.","3":"가슴속근막은 벽쪽가슴막 구역의 이름이 아닙니다.","4":"기관 외막은 기도의 바깥층이며 벽쪽가슴막 구역이 아닙니다."},"one":"벽쪽가슴막 구역은 갈비·가로막·목·세로칸가슴막이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 34","img":[{"u":"img/w11_thorax/p32.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 32"},{"u":"img/w11_thorax/p33.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 33"},{"u":"img/w11_thorax/p34.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 34"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-22":{"q":"Pleural recesses, seen where pleural reflections extend beyond the lungs, represent:","o":["Fused visceral pleura lying between the lobes of each lung surface","The pericardial cavity that surrounds the heart","Air-filled extensions continuous with the nasal cavity","Pleural-cavity regions the lungs do not fill, especially below","Direct openings of bronchi into the pleural space"],"a":3,"qk":"폐 윤곽을 넘어 연장된 가슴막 반전에서 보이는 가슴막오목(pleural recesses)은 무엇을 나타내는가?","ok":["폐엽 사이에서 유착된 내장가슴막","심장을 둘러싼 심장막공간","비강의 공기 확장","폐가 완전히 채우지 않는 가슴막공간, 특히 아래쪽","기관지가 가슴막공간으로 직접 열리는 구멍"],"exp":"**가슴막 반전과 오목(pleural reflections and recesses)** 그림에서는 폐의 아래 가장자리보다 **가슴막 윤곽이 더 아래로 연장**되어 있습니다. 이 빈 공간은 폐가 완전히 채우지 않는 **가슴막공간의 오목(recesses)**으로, 특히 아래쪽에서 두드러집니다.\n\n들숨 때 폐 가장자리가 이 오목으로 더 내려올 수 있고, 가슴막삼출 액이 고이기 쉬운 곳이기도 합니다. 이는 엽 사이 내장가슴막, 심장막공간, 비강, 기관지 개구와는 다른 개념입니다.","why":{"0":"엽 사이는 내장가슴막이 열을 따라 들어갈 수 있으나, 오목은 폐가 채우지 않는 벽쪽 가슴막공간입니다.","1":"심장막공간은 심장을 둘러싸며 가슴막오목과 다릅니다.","2":"비강·부비동은 머리의 공기 공간입니다.","4":"기관지는 폐 안으로 열리며 가슴막공간으로 직접 열리지 않습니다."},"one":"가슴막오목은 폐가 완전히 채우지 않는 가슴막공간으로, 특히 폐 아래쪽으로 연장된다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 35","img":[{"u":"img/w11_thorax/p35.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 35"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-23":{"q":"Which statement about the lungs is correct?","o":["A middle lobe and a lingula present in both lungs","Middle lobe right only; lingula and cardiac notch left only","A transverse fissure present only in the left lung","Oblique fissures present only in the right lung","Three lobes on the left lung and only two lobes on the right lung"],"a":1,"qk":"폐의 엽·열·구조에 대한 설명으로 옳은 것은?","ok":["양쪽 폐 모두 중간엽과 혀부위를 가진다","중간엽은 오른쪽만, 혀부위와 심장패임은 왼쪽만","가로열은 왼쪽 폐에만 있다","빗열은 오른쪽 폐에만 있다","왼쪽 폐는 3엽, 오른쪽 폐는 2엽이다"],"exp":"폐에는 **꼭대기(apices, 단수 apex)**, **위엽(upper lobes)**, **아래엽(lower lobes)**이 있습니다. **중간엽(middle lobe)**은 **오른쪽 폐에만**, **혀부위(lingula)**는 **왼쪽 폐에만** 있습니다. **빗열(oblique fissures)**은 양쪽에 있고, **가로열(transverse fissure)**은 오른쪽(중간엽을 위엽과 나눔)에 있습니다. **심장패임(cardiac notch)**은 왼쪽입니다.\n\n정리하면 우폐는 3엽(위·중간·아래)과 빗열·가로열, 좌폐는 2엽(위·아래)과 빗열, 혀부위, 심장패임을 갖습니다.","why":{"0":"중간엽은 오른쪽에만, 혀부위는 왼쪽에만 있습니다.","2":"가로열은 오른쪽 폐에 있습니다.","3":"빗열은 양쪽 폐에 모두 있습니다.","4":"엽 수가 반대입니다. 오른쪽이 3엽, 왼쪽이 2엽입니다."},"one":"중간엽과 가로열은 오른쪽만, 혀부위와 심장패임은 왼쪽만 있으며, 빗열은 양쪽 모두에 있다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 36","img":[{"u":"img/w11_thorax/p36.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 36"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-24":{"q":"Mediastinal relations listed for the left lung, but not for the right lung, include the:","o":["Superior vena cava and azygos vein","Right brachiocephalic vein only","Inferior vena cava on the diaphragmatic surface only","Middle-lobe pulmonary veins","Aorta and left subclavian artery"],"a":4,"qk":"오른쪽이 아니라 왼쪽 폐의 세로칸 관계로 제시된 구조는?","ok":["위대정맥과 홀정맥","오른쪽 팔머리정맥만","가로막면에서만의 아래대정맥","중간엽 허파정맥","대동맥과 왼쪽 빗장밑동맥"],"exp":"우폐의 세로칸 관계는 **위대정맥**, **홀정맥**, **심장**, **기관과 식도**입니다. 좌폐의 관계는 **대동맥**, **기관과 식도**, **왼쪽 빗장밑동맥**, **심장**입니다.\n\n양쪽 공통은 심장과 기관·식도입니다. **대동맥과 왼쪽 빗장밑동맥**은 좌폐에만, **위대정맥과 홀정맥**은 우폐에만 열거됩니다. 내장면에서 좌폐에는 대동맥 자국, 우폐에는 홀정맥·위대정맥 자국이 있습니다.","why":{"0":"위대정맥과 홀정맥은 우폐의 관계입니다.","1":"오른쪽 팔머리정맥은 좌폐 관계로 열거되지 않았습니다.","2":"아래대정맥은 좌폐 관계 목록에 없습니다.","3":"중간엽은 우폐에만 있어, 중간엽 정맥은 좌폐 관계가 아닙니다."},"one":"좌폐 세로칸 관계는 대동맥과 왼쪽 빗장밑동맥이 특징이고, 우폐는 위대정맥과 홀정맥이 특징이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 37, 38","img":[{"u":"img/w11_thorax/p37.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 37"},{"u":"img/w11_thorax/p38.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 38"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-25":{"q":"Compared with the left primary bronchus, the right primary bronchus is:","o":["More vertical, larger in diameter, and shorter","More horizontal, smaller in diameter, and longer","More vertical, smaller in diameter, and longer","More horizontal, larger in diameter, and shorter","Identical in orientation, caliber, and length"],"a":0,"qk":"왼쪽 일차기관지와 비교할 때 오른쪽 일차기관지의 특징은?","ok":["더 수직이고, 지름이 더 크며, 더 짧다","더 수평이고, 지름이 더 작으며, 더 길다","더 수직이고, 지름이 더 작으며, 더 길다","더 수평이고, 지름이 더 크며, 더 짧다","방향, 굵기, 길이가 동일하다"],"exp":"기관기관지나무에서 **오른쪽 일차기관지**는 왼쪽보다 **더 수직(more vertical)**이고, **지름이 더 크며(larger diameter)**, **더 짧습니다(shorter)**. 그림에서 오른쪽 주기관지가 왼쪽보다 가파르고 짧은 것이 강조됩니다.\n\n이 해부학 때문에 흡인된 이물이 오른쪽 주기관지로 들어가기 쉽습니다. 후두(방패연골, 반지방패인대, 반지연골)에서 기관 연골을 지나 좌우 주기관지로 이어집니다.","why":{"1":"오른쪽이 더 수평·가늘고 길다는 것은 반대입니다.","2":"더 수직인 것은 맞지만, 오른쪽은 더 가늘고 긴 것이 아니라 더 굵고 짧습니다.","3":"오른쪽은 더 수평이 아니라 더 수직입니다.","4":"좌우 주기관지는 방향, 굵기, 길이가 같지 않습니다."},"one":"오른쪽 일차기관지는 더 수직이고, 더 굵고, 더 짧다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 40","img":[{"u":"img/w11_thorax/p39.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 39"},{"u":"img/w11_thorax/p40.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 40"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-26":{"q":"Lobar bronchi are _____ bronchi, and segmental bronchi are _____ bronchi.","o":["primary; secondary","tertiary; primary","secondary (2°); tertiary (3°)","tertiary (3°); secondary (2°)","primary; tertiary"],"a":2,"qk":"엽기관지와 구역기관지는 각각 몇 차 기관지인가?","ok":["일차; 이차","삼차; 일차","이차(2°); 삼차(3°)","삼차(3°); 이차(2°)","일차; 삼차"],"exp":"기관기관지나무에서 **엽기관지(lobar bronchi)는 이차(2°) 기관지**이고, **구역기관지(segmental bronchi)는 삼차(3°) 기관지**입니다. 일차기관지는 좌우 주기관지입니다.\n\n그림의 화살표는 색이 칠해진 구역기관지 가지를 가리키며, 이어지는 폐 구역(lung segments) 그림은 각 구역기관지가 공급하는 구역을 색으로 보여 줍니다. 이 구역들이 외과적으로 나누어 제거할 수 있는 폐의 단위입니다.","why":{"0":"엽기관지는 일차가 아니라 이차이고, 구역기관지는 이차가 아니라 삼차입니다.","1":"구역기관지는 삼차가 맞지만, 엽기관지를 일차라고 한 것이 틀립니다.","3":"엽과 구역의 차수가 바뀌었습니다.","4":"일차는 주기관지이고, 엽기관지는 삼차가 아니라 이차입니다."},"one":"엽기관지는 이차(2°), 구역기관지는 삼차(3°) 기관지이다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 41","img":[{"u":"img/w11_thorax/p41.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 41"},{"u":"img/w11_thorax/p42.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 42"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-27":{"q":"The pulmonary trunk divides into pulmonary arteries that:","o":["Oxygenated blood from the left ventricle out to the alveoli","Carry blood from the right heart to the lungs for gas exchange","Provide the sole nutrient supply to the bronchial walls","Drain lymph from hilar nodes into the thoracic duct","Bronchial arterial blood returned directly into the right atrium itself"],"a":1,"qk":"허파동맥줄기가 나누어져 만드는 허파동맥의 역할은?","ok":["좌심실의 산소화된 혈액을 폐포로 운반한다","오른심장의 혈액을 가스 교환을 위해 폐로 운반한다","기관지 벽에 유일한 영양혈을 공급한다","폐문 림프절의 림프를 가슴관으로 보낸다","기관지동맥 혈액을 우심방으로 직접 되돌린다"],"exp":"폐의 **폐순환 혈관**은 **허파동맥줄기(pulmonary trunk)**, **허파동맥(pulmonary arteries)**, **허파정맥(pulmonary veins)**입니다. 허파동맥줄기는 우심실에서 나와 좌우 허파동맥으로 갈라져, 가스 교환을 위해 오른심장의 혈액을 폐로 보냅니다. 허파정맥은 폐를 떠나 좌심방으로 돌아갑니다.\n\n넷터 그림에서도 동맥은 줄기에서, 정맥은 좌심방 쪽으로 표시됩니다. 기관지 벽의 영양 공급은 주로 대동맥에서 오는 기관지동맥의 역할입니다.","why":{"0":"좌심실의 산소화된 혈액은 대동맥으로 나가며, 허파동맥의 혈류가 아닙니다.","2":"기관지 벽의 영양혈은 주로 기관지동맥이 담당합니다.","3":"허파동맥은 혈액 혈관이지 림프 통로가 아닙니다.","4":"허파정맥은 좌심방으로 돌아가며, 기관지동맥 혈액을 우심방으로 직접 보내지 않습니다."},"one":"허파동맥줄기는 우심실 혈액을 허파동맥으로 보내 폐에서 가스 교환하게 한다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 43","img":[{"u":"img/w11_thorax/p43.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 43"},{"u":"img/w11_thorax/p45.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 45"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-28":{"q":"Bronchial arteries, shown arising from the descending aorta near the bronchi, provide:","o":["The entire venous drainage of the alveolar capillary bed","Outflow of the right ventricle through the pulmonary trunk itself","Lymphatic drainage from the visceral pleura to the hilum","The only arterial blood supply of the entire diaphragm","Systemic arterial blood to the airways and supporting lung tissue"],"a":4,"qk":"기관지 근처에서 내림대동맥으로부터 일어나는 기관지동맥이 공급하는 것은?","ok":["폐포 모세혈관그물의 모든 정맥 배액","허파동맥줄기를 통한 우심실 유출","내장가슴막의 림프 배액","가로막의 유일한 동맥 공급","기도와 폐 지지 조직에 대한 전신 동맥혈"],"exp":"**기관지동맥(bronchial arteries)**은 그림에서 **내림가슴대동맥** 근처에서 일어나 기관지 쪽으로 가는 작은 가지로 표시됩니다. 이들은 **전신 동맥혈**을 가져와 기도 벽과 폐의 지지 조직을 영양합니다.\n\n가스 교환을 위한 대량의 혈류는 허파동맥이 담당하고, 기관지동맥은 이와 구별되는 영양 순환입니다. 폐포 모세혈관의 정맥 배액은 허파정맥, 가로막 동맥 공급은 주로 다른 전신 가지(예: 아래가로막동맥, 가로막신경동맥)입니다.","why":{"0":"폐포 모세혈관의 정맥 배액은 허파정맥이 담당합니다.","1":"우심실 유출은 허파동맥줄기·허파동맥입니다.","2":"기관지동맥은 동맥혈 공급이며 림프 배액로가 아닙니다.","3":"가로막의 유일한 동맥 공급원이라고 제시되지 않았으며, 그림의 가지는 기관지 쪽입니다."},"one":"기관지동맥은 대동맥에서 나와 폐의 기도와 지지 조직에 전신 동맥혈을 공급한다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 44","img":[{"u":"img/w11_thorax/p44.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 44"},{"u":"img/w11_thorax/p45.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 45"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-29":{"q":"From the pulmonary hilum toward the trachea, the lymph node groups include:","o":["Deep cervical (scalene) nodes only","Cisterna chyli together with the lumbar nodes and the celiac nodes","Bronchopulmonary, tracheobronchial, and paratracheal nodes","Axillary, parasternal, and inguinal nodes","Intramammary and intercostal nodes only"],"a":2,"qk":"폐문에서 기관 쪽으로의 폐 림프절 무리는?","ok":["깊은목(사각근) 림프절만","유미조, 허리 림프절, 복강 림프절","기관지폐 림프절, 기관기관지 림프절, 기관주위 림프절","겨드랑, 복장옆, 샅 림프절","유방안 림프절과 갈비사이 림프절만"],"exp":"폐의 림프절은 **기관지폐 림프절(bronchopulmonary nodes)**, **기관기관지 림프절(tracheobronchial nodes)**, **기관주위 림프절(paratracheal nodes)**로 제시됩니다. 그림의 상자는 기관 옆(기관주위), 기관 분기부(기관기관지), 폐문(기관지폐)을 차례로 강조합니다.\n\n림프는 일반적으로 폐문 쪽에서 기관 분기하·기관주위 절로 올라갑니다. 겨드랑·샅·복강 림프절은 이 폐 경로의 주요 정거장이 아닙니다.","why":{"0":"깊은목(사각근) 림프절은 더 위쪽 연관 절일 수 있으나, 폐문에서 기관으로의 세 무리로 제시된 것은 아닙니다.","1":"유미조·허리·복강 림프절은 배·뒷벽 림프 경로입니다.","3":"겨드랑·복장옆·샅 림프절은 이 폐 림프 경로의 주된 정거장이 아닙니다.","4":"유방안·갈비사이 림프절만으로 폐의 세 림프절 무리를 설명할 수 없습니다."},"one":"폐 림프절은 기관지폐(폐문), 기관기관지, 기관주위 절로 이어진다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 46","img":[{"u":"img/w11_thorax/p46.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 46"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_thorax-30":{"q":"Pulmonary plexuses receive parasympathetic fibers from the _____ and sympathetic fibers from the _____.","o":["Vagus; sympathetic trunk","Phrenic nerve; vagus","Intercostal nerves; phrenic nerve","Sympathetic trunk; vagus","Recurrent laryngeal nerve; ansa cervicalis"],"a":0,"qk":"폐신경총(pulmonary plexuses)은 부교감신경을 _____에서, 교감신경을 _____에서 받는다.","ok":["미주신경; 교감신경줄기","가로막신경; 미주신경","갈비사이신경; 가로막신경","교감신경줄기; 미주신경","되돌이후두신경; 목신경고리"],"exp":"폐의 신경지배는 **폐신경총(pulmonary plexuses)**을 통해 이루어집니다. **부교감신경은 미주신경(vagus)**에서, **교감신경은 교감신경줄기(trunk)**에서 옵니다. 그림의 상자와 화살표는 기관 분기부 주위 신경총을 가리킵니다.\n\n보기 D는 부교감과 교감의 출처가 바뀐 함정입니다. 가로막신경은 주로 가로막, 갈비사이신경은 흉벽입니다.","why":{"1":"가로막신경은 주로 가로막을 지배하며 폐신경총의 부교감 공급원이 아니고, 교감신경은 미주에서 오지 않습니다.","2":"갈비사이신경과 가로막신경은 흉벽·가로막 지배이며 폐신경총의 자율 공급으로 제시되지 않았습니다.","3":"출처가 바뀌었습니다. 부교감은 미주, 교감은 교감신경줄기입니다.","4":"되돌이후두신경과 목신경고리는 폐신경총의 부교감·교감 공급원으로 제시되지 않았습니다."},"one":"폐신경총의 부교감은 미주신경, 교감은 교감신경줄기에서 온다.","src":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 47","img":[{"u":"img/w11_thorax/p47.webp","cap":"14 - Thoracic wall and lungs 2024-2025 CANVAS.pdf, slide 47"}],"ch":"w11_thorax","chn":"Thoracic Wall and Lungs","week":11},"w11_heart-1":{"q":"The pericardium is best described as which of the following?","o":["A double-walled fibroserous sac around the heart and great vessels","A single fibrous membrane limited to the ventricular chambers","A mucous membrane confined to the middle mediastinum only","A synovial capsule surrounding only the great arteries","A serous sac that excludes the venae cavae and the aorta"],"a":0,"qk":"심막(pericardium)을 가장 잘 설명하는 것은?","ok":["심장과 대혈관을 둘러싸는 이중벽의 섬유장액성 주머니","심실에만 국한된 단일 섬유막","중간세로칸에만 국한된 점막","대동맥만 둘러싸는 활액막성 피막","상대정맥·대동맥을 제외한 장액성 주머니"],"exp":"심막(pericardium)은 **이중벽의 섬유장액성 주머니(double-walled fibroserous sac)**입니다. 심장 자체뿐 아니라 심장에서 나가고 들어오는 **대혈관(great vessels)**까지 함께 감쌉니다.\n\n이 주머니가 감싸는 대혈관은 **대동맥(aorta)**, **폐동맥과 폐정맥(pulmonary arteries and veins)**, **상대·하대정맥(venae cavae)**입니다. 즉 동맥과 정맥을 모두 포함합니다.\n\n안쪽은 장액성 심막(serous pericardium), 바깥은 질긴 섬유성 심막(fibrous pericardium)으로 이루어져 심장이 흉강 안에서 안정적으로 박동하도록 돕습니다.","why":{"1":"섬유성 심막만 있는 단일막이 아니며, 심실에만 국한되지도 않습니다. 심방과 대혈관 기시부까지 감쌉니다.","2":"심막은 점막(mucous membrane)이 아니라 섬유성·장액성 막입니다.","3":"활액막성 피막(synovial capsule)은 관절을 둘러싸는 구조입니다. 심막과는 다릅니다.","4":"상대·하대정맥과 대동맥도 심막이 감싸는 대혈관에 포함됩니다."},"one":"심막은 심장과 대혈관(대동맥, 폐동·정맥, 대정맥)을 감싸는 이중벽 섬유장액성 주머니입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w11_heart/p02.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 2"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-2":{"q":"Which statement correctly locates the pericardium in the thorax?","o":["Anterior to the manubrium and first costal cartilages, at T1–T4","Posterior to the sternal body and 2nd–6th costal cartilages, at T5–T8","Posterior to the xiphoid and 7th–10th costal cartilages, at T9–T12","Lateral to the scapulae and third to fifth ribs, at C7–T3","Anterior to the lumbar vertebral bodies, at the level of L1–L3"],"a":1,"qk":"가슴우리에서 심막의 위치를 올바르게 기술한 것은?","ok":["복장뼈자루와 제1 갈비연골의 앞, T1–T4 높이","복장뼈 몸통과 제2–6 갈비연골의 뒤, T5–T8 높이","칼돌기와 제7–10 갈비연골의 뒤, T9–T12 높이","어깨뼈와 제3–5 갈비뼈의 가쪽, C7–T3 높이","허리뼈 몸통의 앞, L1–L3 높이"],"exp":"심막은 **복장뼈 몸통(body of the sternum)**과 **제2–6 갈비연골(2nd–6th costal cartilages)**의 **뒤쪽(posterior)**에 있습니다. 척추 높이로는 **T5–T8**에 해당합니다.\n\n이 범위를 기억하면 심장 청진 위치, 심막 천자, 정중 흉골 절개를 이해할 때 기준이 됩니다. 너무 위(T1–T4)나 너무 아래(T9 이하)로 잡으면 심장이 아닌 다른 세로칸 구조에 해당합니다.","why":{"0":"복장뼈자루 앞과 T1–T4는 심장보다 위쪽(위세로칸 쪽)에 해당합니다. 심막은 복장뼈 몸통의 뒤입니다.","2":"제7–10 갈비연골과 T9–T12는 심막보다 아래입니다.","3":"어깨뼈 가쪽은 흉강의 뒤가쪽이며 심막 위치가 아닙니다.","4":"심막은 가슴우리 안의 구조이며 허리뼈 높이에 있지 않습니다."},"one":"심막은 복장뼈 몸통과 제2–6 갈비연골의 뒤에 있으며, 척추 높이는 T5–T8입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_heart/p03.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 3"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-3":{"q":"A principal function of the fibrous pericardium is to:","o":["Secrete the serous fluid that fills the pleural cavity","Conduct impulses from the sinoatrial node to the ventricles","Protect the heart against overfilling","Form the muscular walls of the left ventricle","Drain lymph from the myocardium to axillary nodes"],"a":2,"qk":"섬유성 심막(fibrous pericardium)의 주요 기능은?","ok":["가슴막강을 채우는 장액을 분비한다","굴심방결절의 자극을 심실로 전한다","심장이 과충전되지 않도록 보호한다","왼심실의 근육벽을 형성한다","심근 림프를 겨드랑림프절로 보낸다"],"exp":"섬유성 심막(fibrous pericardium)은 잘 늘어나지 않는 질긴 결합조직 주머니입니다. 가장 중요한 기능은 심장이 한꺼번에 너무 많은 혈액을 받아 **과충전(overfilling)**되지 않도록 막는 것입니다.\n\n이 막은 **대동맥(aorta)**, **폐동맥줄기(pulmonary trunk)**, **상대정맥(superior vena cava)**이 지나며 뚫고 나가고, **대혈관의 바깥막(tunica adventitia)**, **복장뼈 뒤면**, **가로막의 중심힘줄(central tendon of the diaphragm)**에 유착되어 심장을 제자리에 고정합니다.","why":{"0":"장액은 장액성 심막의 중피가 심막강으로 분비합니다. 가슴막강(pleural cavity)의 액이 아닙니다.","1":"자극 전도는 굴심방결절·방실결절·방실다발의 역할이며 섬유성 심막의 기능이 아닙니다.","3":"왼심실 벽은 심근(myocardium)이 만듭니다.","4":"심장 림프는 기관기관지림프절(tracheobronchial nodes)로 가며, 섬유성 심막의 기능이 아닙니다."},"one":"섬유성 심막은 잘 늘어나지 않아 심장의 과충전을 막고, 대혈관 바깥막·복장뼈·가로막 중심힘줄에 붙습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w11_heart/p04.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 4"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-4":{"q":"The visceral layer of serous pericardium is also known as the:","o":["Fibrous pericardium","Endocardium","Myocardium","Epicardium","Parietal pleura"],"a":3,"qk":"장액성 심막의 내장측층(visceral layer)을 다른 이름으로 부르면?","ok":["섬유성 심막(fibrous pericardium)","심내막(endocardium)","심근(myocardium)","심외막(epicardium)","벽측 가슴막(parietal pleura)"],"exp":"장액성 심막(serous pericardium)은 두 층입니다. **벽측층(parietal layer)**은 섬유성 심막의 안쪽 면을 덮고, **내장측층(visceral layer)**은 심장 표면을 직접 덮습니다. 이 내장측층이 바로 **심외막(epicardium)**입니다.\n\n두 장액층 사이의 잠재공간(potential space)이 **심막강(pericardial cavity)**입니다. 이곳에 소량의 장액이 있어 박동 때 마찰을 줄입니다. 액이 급격히 늘면 심장눌림증(cardiac tamponade)의 배경이 됩니다.","why":{"0":"섬유성 심막은 가장 바깥의 질긴 주머니이며, 장액성 내장측층이 아닙니다.","1":"심내막은 심장 방의 가장 안쪽 내피층입니다.","2":"심근은 심장의 두꺼운 근육층입니다.","4":"벽측 가슴막은 흉강을 덮는 막으로, 심막의 내장측층이 아닙니다."},"one":"장액성 심막의 내장측층이 심외막이며, 벽측층과의 사이가 심막강입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 5","img":[{"u":"img/w11_heart/p05.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 5"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-5":{"q":"The pericardial sinuses are spaces within the pericardial sac located:","o":["Between the fibrous pericardium and the sternum","Inside the left ventricular chamber","Along the interventricular septum","Within the pleural cavities beside each lung","Behind the heart, as the transverse and oblique sinuses"],"a":4,"qk":"심막굴(pericardial sinuses)은 심막낭 안에서 어디에 있는 공간인가?","ok":["섬유성 심막과 복장뼈 사이","왼심실 방 안","심실중격을 따라","양쪽 허파 옆의 가슴막강 안","심장 뒤쪽의 가로굴과 빗굴"],"exp":"심막굴(pericardial sinuses)은 심막낭 안, **심장의 뒤쪽**에 있는 공간입니다. 두 가지가 있습니다. **가로굴(transverse sinus)**과 **빗굴(oblique sinus)**입니다.\n\n가로굴은 대동맥·폐동맥줄기 뒤, 상대정맥 앞을 가로지르는 통로로, 심장 수술에서 이 공간을 통해 대혈관을 묶을 수 있습니다. 빗굴은 왼심방 뒤에서 폐정맥과 하대정맥에 둘러싸인 막힌 오목입니다. 심장을 들어내면 이 두 굴의 입구가 드러납니다.","why":{"0":"섬유성 심막과 복장뼈 사이는 심막굴이 아닙니다. 섬유성 심막은 복장뼈 뒤면에 유착됩니다.","1":"심막굴은 심장 방 안이 아니라 심막강 안의 공간입니다.","2":"심실중격은 심장 내부 구조이며 심막굴과 무관합니다.","3":"가슴막강은 허파를 둘러싸는 공간으로, 심막굴과 별개입니다."},"one":"심막굴은 심장 뒤 심막낭 안의 가로굴(transverse sinus)과 빗굴(oblique sinus)입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_heart/p06.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 6"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-6":{"q":"The pericardiacophrenic arteries travel with which nerve?","o":["Vagus nerve","Phrenic nerve","Recurrent laryngeal nerve","Sympathetic chain","Intercostal nerves"],"a":1,"qk":"심막횡격막동맥(pericardiacophrenic arteries)은 어느 신경과 함께 주행하는가?","ok":["미주신경(vagus nerve)","횡격신경(phrenic nerve)","되돌이후두신경(recurrent laryngeal nerve)","교감신경줄기(sympathetic chain)","갈비사이신경(intercostal nerves)"],"exp":"심막의 주요 동맥 중 하나가 **심막횡격막동맥(pericardiacophrenic arteries)**입니다. 이 동맥은 **횡격신경(phrenic nerve)**과 함께 주행합니다.\n\n가슴우리의 가쪽(right lateral view)에서 보면, 이 동맥·신경 다발이 심막낭의 가쪽을 따라 가로막을 향해 내려갑니다. 횡격신경은 가로막 운동뿐 아니라 심막의 감각도 담당하므로, 심막 염증 때 같은 분절(C3–C5)로 통증이 퍼질 수 있습니다.","why":{"0":"미주신경은 심장의 부교감 섬유를 가져오지만, 심막횡격막동맥과 한 다발로 주행하지는 않습니다.","2":"되돌이후두신경은 후두로 가며 심막횡격막동맥의 동반 신경이 아닙니다.","3":"교감신경줄기는 심장신경의 교감 기원이지만, 이 동맥과 함께 심막 가쪽을 내려가지 않습니다.","4":"갈비사이신경은 갈비사이공간을 달리며 이 동맥의 동반 신경이 아닙니다."},"one":"심막횡격막동맥은 횡격신경과 함께 심막낭 가쪽을 따라 주행합니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w11_heart/p07.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 7"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-7":{"q":"Besides the pericardiacophrenic arteries, arterial supply to the pericardium includes:","o":["Only the internal thoracic arteries, with no aortic twigs","Renal and superior mesenteric arterial branches","The musculophrenic artery and bronchial and esophageal aortic branches","The inferior epigastric and lumbar arteries alone","The anterior and posterior intercostal arteries exclusively"],"a":2,"qk":"심막횡격막동맥 외에 심막에 혈액을 공급하는 동맥은?","ok":["속가슴동맥뿐이며 대동맥 가지는 없다","콩팥동맥과 위창자간막동맥 가지","근횡격막동맥과 대동맥의 기관지·식도 가지","아래배벽동맥과 허리동맥만","앞·뒤 갈비사이동맥만"],"exp":"심막의 동맥 공급은 여러 갈래입니다. 심막횡격막동맥 외에 **근횡격막동맥(musculophrenic artery)**이 아래쪽에서 심막에 가지를 보냅니다. 근횡격막동맥은 속가슴동맥(internal thoracic artery)의 끝가지 중 하나입니다.\n\n뒤쪽에서는 **가슴대동맥(thoracic aorta)**의 **기관지동맥(bronchial arteries)**과 **식도동맥(esophageal arteries)**이 심막에 기여합니다. 여기에 관상동맥 가지까지 더해져 심막은 앞·아래·뒤에서 모두 혈액을 받습니다.","why":{"0":"속가슴동맥의 가지(심막횡격막·근횡격막)뿐 아니라 가슴대동맥의 기관지·식도 가지도 심막에 갑니다.","1":"콩팥동맥과 위창자간막동맥은 배강의 동맥이며 심막 공급원이 아닙니다.","3":"아래배벽동맥과 허리동맥은 배벽 공급 동맥입니다.","4":"갈비사이동맥이 일부 기여할 수는 있어도, 심막 공급원으로 제시된 것은 근횡격막동맥과 기관지·식도 가지입니다."},"one":"심막은 심막횡격막동맥 외에 근횡격막동맥과 가슴대동맥의 기관지·식도 가지에서도 혈액을 받습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 8, 9","img":[{"u":"img/w11_heart/p08.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 8"},{"u":"img/w11_heart/p09.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 9"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-8":{"q":"Which coronary vessels contribute to the blood supply of the pericardium?","o":["The circumflex branch of the left coronary artery only","The posterior interventricular artery of the right side only","The great cardiac vein together with the coronary sinus","The right coronary artery and a left coronary branch","The left marginal artery as the sole pericardial source"],"a":3,"qk":"심막의 혈액 공급에 기여하는 관상혈관은?","ok":["왼관상동맥의 휘돌이가지만","오른쪽 뒤심실사이동맥만","큰심장정맥과 관상정맥굴","오른관상동맥과 왼관상동맥 가지","왼모서리동맥만이 유일한 심막 공급원"],"exp":"심막의 동맥 공급원에는 **관상동맥(coronary arteries)**도 포함됩니다. 구체적으로는 **오른관상동맥(right coronary artery)**과 **왼관상동맥에서 나온 가지(a branch from the left coronary artery)**입니다.\n\n관상동맥은 주로 심근을 먹이지만, 심장 표면(심외막)과 맞닿은 장액성 내장측 심막에도 잔가지를 줍니다. 따라서 심막은 심막횡격막·근횡격막·대동맥 가지와 관상동맥이 함께 공급하는 구조입니다.","why":{"0":"휘돌이동맥만으로 심막 공급을 설명하지 않습니다. 오른관상동맥과 왼관상동맥 가지가 제시됩니다.","1":"뒤심실사이동맥만 지목되지 않았습니다.","2":"큰심장정맥과 관상정맥굴은 심장의 정맥 환류로, 심막의 동맥 공급이 아닙니다.","4":"왼모서리동맥만 심막을 공급한다고 되어 있지 않습니다."},"one":"심막에는 오른관상동맥과 왼관상동맥에서 나온 가지도 혈액을 공급합니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_heart/p10.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 10"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-9":{"q":"The heart is located in which of the following regions?","o":["The anterior mediastinum, outside the pericardial sac","The posterior mediastinum, mostly on the right side","The superior mediastinum, lying only in front of the trachea","The abdominal cavity, immediately below the diaphragm","The middle mediastinum, in the pericardial sac, mostly left"],"a":4,"qk":"심장은 다음 중 어디에 위치하는가?","ok":["앞세로칸, 심막낭 바깥","뒤세로칸, 주로 오른쪽","위세로칸, 기관의 앞쪽만","배강, 가로막 바로 아래","중간세로칸의 심막낭 안, 주로 왼쪽"],"exp":"심장은 **중간세로칸(middle mediastinum)**에 있으며, **심막낭(pericardial sac)** 안에 들어 있습니다. 복장뼈의 뒤쪽에 놓이고, 전체적으로는 **왼쪽**에 더 많이 치우칩니다. 크기는 쥔 주먹 정도입니다.\n\n그래서 심첨(apex)이 왼쪽 제5 갈비사이공간에 오고, 왼쪽 허파에는 심장패임(cardiac notch)이 생깁니다. 앞·뒤·위세로칸이 아니라 ‘중간’ 세로칸이라는 점을 구별해야 합니다.","why":{"0":"심장은 앞세로칸이 아니라 중간세로칸에 있고, 심막낭 안에 있습니다.","1":"뒤세로칸에는 가슴대동맥·식도 등이 있으며, 심장은 주로 왼쪽의 중간세로칸에 있습니다.","2":"위세로칸에는 대동맥활·기관 등이 있습니다. 심장 본체는 중간세로칸입니다.","3":"심장은 가슴우리 안에 있으며 배강 구조가 아닙니다."},"one":"심장은 중간세로칸의 심막낭 안, 복장뼈 뒤, 주로 왼쪽에 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 11, 12","img":[{"u":"img/w11_heart/p11.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 11"},{"u":"img/w11_heart/p12.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 12"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-10":{"q":"The apex of the heart is formed by the left ventricle and is the site of the maximum heartbeat in the:","o":["5th intercostal space","2nd intercostal space","3rd intercostal space at the right sternal border","7th intercostal space in the midaxillary line","1st intercostal space at the sternal angle"],"a":0,"qk":"심장의 심첨(apex)은 왼심실이 만들며, 최대 박동이 만져지는 위치는?","ok":["제5 갈비사이공간","제2 갈비사이공간","오른쪽 복장뼈 가장자리의 제3 갈비사이공간","중간겨드랑선의 제7 갈비사이공간","복장뼈각의 제1 갈비사이공간"],"exp":"심첨(apex)은 **왼심실(left ventricle)**이 만듭니다. 가슴벽에서는 **제5 갈비사이공간(5th intercostal space)**에 해당하며, 그 뒤쪽(posterior to the 5th intercostal space)에서 **최대 박동점(site of maximum heartbeat, PMI)**이 만져집니다.\n\n심첨이 왼쪽 아래를 향하므로 심장의 앞면 그림에서도 심첨은 왼쪽 아래로 돌출합니다. 제2 갈비사이공간은 대동맥·폐동맥 청진 부위에 가깝고, 심첨 위치는 아닙니다.","why":{"1":"제2 갈비사이공간은 대동맥·폐동맥 영역(기저 쪽)에 가깝고 심첨이 아닙니다.","2":"오른쪽 복장뼈 가장자리는 오른심방이 이루는 오른쪽 경계 쪽이며 심첨이 아닙니다.","3":"제7 갈비사이공간 중간겨드랑선은 심첨보다 훨씬 아래·가쪽입니다.","4":"복장뼈각(제2 갈비연골 높이)과 제1 갈비사이공간은 심첨보다 훨씬 위입니다."},"one":"심첨은 왼심실이 이루며, 제5 갈비사이공간에서 최대 박동점이 만져집니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_heart/p13.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 13"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-11":{"q":"The sternocostal (anterior) surface of the heart is formed mainly by the:","o":["Left atrium","Left ventricle","Right ventricle","Right auricle alone","Ascending aorta"],"a":2,"qk":"심장의 복장갈비면(sternocostal surface, 앞면)을 주로 이루는 것은?","ok":["왼심방(left atrium)","왼심실(left ventricle)","오른심실(right ventricle)","오른심방귀만","오름대동맥"],"exp":"심장의 **복장갈비면(sternocostal surface)**은 **앞면(anterior surface)**과 같은 말입니다. 이 면의 대부분은 **오른심실(right ventricle)**이 차지합니다.\n\n앞에서 심장을 보면 오른심실이 복장뼈와 갈비연골을 향해 가장 가까이 놓입니다. 왼심실은 왼쪽 경계와 심첨을, 왼심방은 뒤쪽 기저를 이루므로 앞면의 주인공이 아닙니다.","why":{"0":"왼심방은 주로 심장의 기저(뒤면)를 이룹니다.","1":"왼심실은 왼쪽 경계와 심첨을 이루며, 앞면의 주된 구성은 오른심실입니다.","3":"오른심방귀는 위쪽 경계의 일부일 뿐, 복장갈비면 전체를 이루지 않습니다.","4":"오름대동맥은 기저에서 일어나는 대혈관이며 앞면 자체는 아닙니다."},"one":"복장갈비면(=앞면)의 대부분은 오른심실이 이룹니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w11_heart/p14.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 14"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-12":{"q":"The base of the heart is the posterior surface and is formed mainly by the:","o":["Right ventricle","Left ventricle","Right auricle","Left atrium","Pulmonary valve"],"a":3,"qk":"심장의 기저(base)는 뒤면이며, 주로 어느 구조가 이루는가?","ok":["오른심실","왼심실","오른심방귀","왼심방","폐동맥판막"],"exp":"심장의 **기저(base)**는 **뒤면(posterior surface)**이며, 대부분은 **왼심방(left atrium)**이 이룹니다. 여기에서는 **오름대동맥(ascending aorta)**과 **폐동맥줄기(pulmonary trunk)**가 일어나고, **상대정맥(superior vena cava)**이 들어갑니다.\n\n일상 언어의 ‘밑바닥’과 달리, 해부학에서 심장의 기저는 위·뒤쪽입니다. 심첨이 왼쪽 아래를 향하므로 기저는 그 반대편, 즉 뒤쪽의 왼심방 쪽이 됩니다.","why":{"0":"오른심실은 앞면(복장갈비면)과 아래 경계를 주로 이룹니다.","1":"왼심실은 심첨과 왼쪽 경계를 이룹니다.","2":"오른심방귀는 위쪽 경계의 일부이며 기저의 주된 구성이 아닙니다.","4":"폐동맥판막은 오른심실 유출로에 있는 판막이며 기저를 이루지 않습니다."},"one":"기저는 심장의 뒤면이며 주로 왼심방이 이루고, 이곳에서 오름대동맥·폐동맥줄기가 일어납니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w11_heart/p15.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 15"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-13":{"q":"The pulmonary surface of the heart occupies the:","o":["Costodiaphragmatic recess of the right pleura","Hilum of the right lung","Cupola of the right pleural cavity","Oblique fissure of the right lung","Cardiac notch of the left lung"],"a":4,"qk":"심장의 허파면(pulmonary surface)이 차지하는 곳은?","ok":["오른쪽 가슴막의 갈비가로막오목","오른허파문","오른쪽 가슴막강의 꼭대기","오른허파의 빗열","왼허파의 심장패임"],"exp":"심장의 **허파면(pulmonary surface)**은 **왼허파의 심장패임(cardiac notch of the left lung)**을 차지합니다. 심장이 왼쪽으로 치우쳐 있기 때문에 왼허파 앞가장자리가 밀려 들어가 패임이 생깁니다.\n\n같은 표면 단원에서 **가로막면(diaphragmatic surface)**은 뒤쪽에서 본 모습으로 제시되며, 이 보기에는 왼심방 뒤의 **빗심막굴(oblique pericardial sinus)**이 함께 표시됩니다. 허파면은 왼쪽 허파와 맞닿는 면이고, 가로막면은 가로막 위에 놓인 면입니다.","why":{"0":"갈비가로막오목은 허파가 완전히 채우지 않는 가슴막 아래가쪽 공간으로, 심장 허파면이 아닙니다.","1":"오른허파문은 기관지와 허파혈관이 드나드는 곳이며 심장 허파면이 아닙니다.","2":"가슴막 꼭대기는 목 밑의 흉막 천장으로 심장과 떨어져 있습니다.","3":"오른허파 빗열은 허파 엽을 나누는 틈이며 심장 허파면이 아닙니다."},"one":"심장의 허파면은 왼허파의 심장패임(cardiac notch)을 차지합니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 16, 17","img":[{"u":"img/w11_heart/p16.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 16"},{"u":"img/w11_heart/p17.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 17"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-14":{"q":"Which set correctly matches the borders of the heart with the chambers that form them?","o":["Right border: right atrium; inferior: right ventricle; left: left ventricle; superior: auricles and great vessels","Right border: left atrium; inferior: left ventricle; left: right ventricle; superior: the apex of the heart only","Right border: right ventricle; inferior: left atrium; left: right atrium; superior: the coronary sinus only","Right border: left ventricle; inferior: right atrium; left: pulmonary trunk; superior: the fossa ovalis only","Right border: the apex; inferior: left atrium; left: right atrium; superior: the right ventricle only"],"a":0,"qk":"심장의 경계와 그것을 이루는 방을 올바르게 짝지은 것은?","ok":["오른쪽: 오른심방; 아래: 오른심실; 왼쪽: 왼심실; 위: 심방귀와 대혈관 부착부","오른쪽: 왼심방; 아래: 왼심실; 왼쪽: 오른심실; 위: 심첨만","오른쪽: 오른심실; 아래: 왼심방; 왼쪽: 오른심방; 위: 관상정맥굴만","오른쪽: 왼심실; 아래: 오른심방; 왼쪽: 폐동맥줄기; 위: 타원오목만","오른쪽: 심첨; 아래: 왼심방; 왼쪽: 오른심방; 위: 오른심실만"],"exp":"심장의 네 경계는 다음과 같습니다.\n\n**오른쪽 경계(right border)**는 **오른심방(right atrium)**, **아래 경계(inferior border)**는 **오른심실(right ventricle)**, **왼쪽 경계(left border)**는 **왼심실(left ventricle)**, **위 경계(superior border)**는 **심방귀(auricles)**와 **대혈관이 붙는 부위**입니다.\n\n앞에서 심장을 볼 때 오른쪽은 오른심방, 아래는 오른심실, 왼쪽·심첨 쪽은 왼심실이 윤곽을 그립니다.","why":{"1":"오른쪽 경계는 왼심방이 아니라 오른심방이고, 위 경계는 심첨이 아닙니다.","2":"오른쪽 경계는 오른심실이 아니라 오른심방입니다. 관상정맥굴은 위 경계가 아닙니다.","3":"왼쪽 경계는 폐동맥줄기가 아니라 왼심실입니다. 타원오목은 오른심방 안의 구조입니다.","4":"심첨은 왼쪽 아래이지 오른쪽 경계가 아닙니다."},"one":"오른쪽 경계=오른심방, 아래=오른심실, 왼쪽=왼심실, 위=심방귀와 대혈관 부착부입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 18","img":[{"u":"img/w11_heart/p18.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 18"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-15":{"q":"Which of the following is a characteristic feature of the right atrium?","o":["A mitral (bicuspid) valve at its outflow","The fossa ovalis and the opening of the coronary sinus","A thick myocardium that forms the cardiac apex","The septomarginal trabecula and the pulmonary valve","Openings of the four pulmonary veins only"],"a":1,"qk":"오른심방의 특징적 구조는?","ok":["유출로의 승모판(이첨판)","타원오목과 관상정맥굴의 입구","심첨을 이루는 두꺼운 심근","중격가장자리잔기둥과 폐동맥판막","네 폐정맥의 입구만"],"exp":"오른심방(right atrium)의 주요 구조는 **빗살근(pectinate muscles)**, **말단능선(crista terminalis)**, **정맥굴(sinus venarum)**, **타원오목(fossa ovalis)**, 그리고 **관상정맥굴·상대정맥·하대정맥의 입구**입니다.\n\n말단능선은 거친 빗살근 부위와 매끈한 정맥굴을 나눕니다. 타원오목은 태아 때 타원구멍(foramen ovale)이 닫힌 자국입니다. 관상정맥굴은 심장 정맥혈이 오른심방으로 들어오는 주된 입구입니다.","why":{"0":"승모판(이첨판)은 왼심실의 왼방실구에 있습니다.","2":"두꺼운 심근으로 심첨을 만드는 것은 왼심실입니다.","3":"중격가장자리잔기둥과 폐동맥판막은 오른심실의 구조입니다.","4":"폐정맥 입구는 왼심방의 특징입니다."},"one":"오른심방에는 빗살근, 말단능선, 정맥굴, 타원오목, 관상정맥굴·상·하대정맥 입구가 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w11_heart/p19.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 19"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-16":{"q":"Which structure is a distinctive feature of the right ventricle?","o":["The fossa ovalis","Openings of the pulmonary veins","The septomarginal trabecula","The mitral (bicuspid) valve","The sinus venarum"],"a":2,"qk":"오른심실의 특징적 구조는?","ok":["타원오목(fossa ovalis)","폐정맥의 입구","중격가장자리잔기둥(septomarginal trabecula)","승모판(이첨판)","정맥굴(sinus venarum)"],"exp":"오른심실의 특징에는 오른방실구와 **삼첨판(tricuspid valve)**, **유두근(papillary muscles)**, **힘줄끈(chordae tendineae)**, **중격가장자리잔기둥(septomarginal trabecula)**, **육주(trabeculae carneae)**, **심실위능선(supraventricular crest)**, **폐동맥(반달)판막**이 있습니다.\n\n중격가장자리잔기둥(조절띠, moderator band)은 심실중격에서 앞유두근으로 가로지르며, 오른다발가지(right bundle branch)를 실어 수축 타이밍을 맞춥니다.","why":{"0":"타원오목은 오른심방 중간중격의 구조입니다.","1":"폐정맥 입구는 왼심방에 있습니다.","3":"승모판은 왼심실의 왼방실구에 있습니다. 오른심실은 삼첨판입니다.","4":"정맥굴은 오른심방의 매끈한 부분입니다."},"one":"오른심실에는 삼첨판, 유두근, 힘줄끈, 중격가장자리잔기둥, 육주, 폐동맥판막이 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w11_heart/p20.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 20"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-17":{"q":"Compared with the right atrium, the left atrium is characterized by:","o":["A thinner wall because it handles lower pressure","Pectinate muscles lining the entire chamber wall","Inflow of deoxygenated blood from the venae cavae","A thicker wall from higher pressure; pectinate muscles only in the auricle","A tricuspid valve at the left atrioventricular orifice"],"a":3,"qk":"오른심방과 비교할 때 왼심방의 특징은?","ok":["압력이 낮아 벽이 더 얇다","방 벽 전체가 빗살근으로 덮인다","대정맥으로부터 산소가 적은 피가 들어온다","압력이 높아 벽이 더 두껍고, 빗살근은 심방귀에만 있다","왼방실구에 삼첨판이 있다"],"exp":"왼심방(left atrium)의 안쪽은 대체로 **매끈**하며, **빗살근(musculi pectinati)**은 **심방귀(auricle)**에만 있습니다. 허파에서 산소가 많은 피가 **폐정맥(pulmonary veins)**을 통해 들어오고, 왼방실구로 이어집니다.\n\n폐순환을 마친 혈액이 들어오는 방이므로 오른심방보다 **압력이 높고**, 그 때문에 **벽이 더 두껍습니다**.","why":{"0":"반대로, 왼심방은 압력이 더 높아 벽이 더 두껍습니다.","1":"빗살근은 방 전체가 아니라 심방귀에만 있습니다. 나머지 내면은 매끈합니다.","2":"대정맥의 정맥혈은 오른심방으로 들어갑니다. 왼심방은 폐정맥의 동맥혈을 받습니다.","4":"왼방실구의 판막은 승모판(이첨판)입니다. 삼첨판은 오른방실구에 있습니다."},"one":"왼심방은 벽이 더 두껍고 내면이 매끈하며, 빗살근은 심방귀에만 있고 폐정맥의 동맥혈을 받습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 21","img":[{"u":"img/w11_heart/p21.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 21"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-18":{"q":"The left atrioventricular orifice of the left ventricle is guarded by the:","o":["Tricuspid valve","Pulmonary semilunar valve","Aortic valve only, with no atrioventricular valve","Thebesian valve of the coronary sinus","Mitral (bicuspid) valve"],"a":4,"qk":"왼심실의 왼방실구를 지키는 판막은?","ok":["삼첨판(tricuspid valve)","폐동맥 반달판막","대동맥판막만 있고 방실판막은 없다","관상정맥굴의 테베시우스판막","승모판(이첨판, mitral/bicuspid valve)"],"exp":"왼심실(left ventricle)은 **두꺼운 심근**, **육주(trabeculae carneae)**, 왼방실구의 **승모판(이첨판, mitral/bicuspid valve)**, **힘줄끈(chordae tendineae)**, **유두근**, 그리고 **대동맥판막(aortic valve)**을 가집니다.\n\n승모판은 두 첨판으로 되어 있어 bicuspid라고도 부릅니다. 수축기에는 닫혀 혈액이 왼심방으로 역류하지 않고 대동맥판막 쪽으로만 나가게 합니다. 오른심실의 삼첨판과 구별해야 합니다.","why":{"0":"삼첨판은 오른방실구의 판막입니다.","1":"폐동맥 반달판막은 오른심실 유출로에 있습니다.","2":"왼심실에는 방실판막(승모판)과 대동맥판막이 모두 있습니다.","3":"테베시우스판막은 관상정맥굴이 오른심방으로 열리는 입구의 작은 판막입니다."},"one":"왼심실의 왼방실구에는 승모판(이첨판)이 있고, 유출로에는 대동맥판막이 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 22","img":[{"u":"img/w11_heart/p22.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 22"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-19":{"q":"The right coronary artery arises from the:","o":["Left aortic sinus","Right aortic sinus","Pulmonary trunk just above the pulmonary valve","Coronary sinus in the atrioventricular groove","Descending thoracic aorta"],"a":1,"qk":"오른관상동맥(right coronary artery)은 어디에서 기시하는가?","ok":["왼대동맥굴(left aortic sinus)","오른대동맥굴(right aortic sinus)","폐동맥판막 바로 위의 폐동맥줄기","방실고랑의 관상정맥굴","내림가슴대동맥"],"exp":"오른관상동맥은 **오른대동맥굴(right aortic sinus)**에서 일어납니다. 대동맥판막 첨판의 뒤쪽에 있는 이 굴(sinus)에서 동맥이 출발합니다.\n\n반달판막 첨판에는 **소절(nodule)**과 **반달연(lunule)**이 있고, 첨판 뒤의 공간이 **굴(sinus)**입니다. 오른관상동맥의 기시부가 바로 이 오른대동맥굴입니다.","why":{"0":"왼대동맥굴에서는 왼관상동맥이 기시합니다.","2":"폐동맥줄기는 관상동맥의 기시부가 아닙니다.","3":"관상정맥굴은 정맥혈이 오른심방으로 모이는 구조이며 동맥 기시부가 아닙니다.","4":"내림가슴대동맥은 기관지·식도동맥 등을 내지만 관상동맥의 기시부는 오름대동맥의 대동맥굴입니다."},"one":"오른관상동맥은 오른대동맥굴에서 기시합니다. 판막 첨판에는 소절과 반달연이 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 23, 24","img":[{"u":"img/w11_heart/p23.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 23"},{"u":"img/w11_heart/p24.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 24"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-20":{"q":"After arising from the right aortic sinus, the right coronary artery runs in the:","o":["Anterior interventricular groove","Posterior interventricular groove only, with no atrioventricular course","Atrioventricular groove","Sulcus terminalis of the right atrium","Oblique pericardial sinus"],"a":2,"qk":"오른대동맥굴에서 나온 오른관상동맥은 어느 고랑을 달리는가?","ok":["앞심실사이고랑","뒤심실사이고랑만 달리며 방실고랑은 지나지 않는다","방실고랑(atrioventricular groove)","오른심방의 고랑말단","빗심막굴"],"exp":"오른관상동맥은 기시한 뒤 **방실고랑(atrioventricular groove, 관상고랑)**을 따라 달립니다. 앞에서 보면 오른심방과 오른심실 사이의 고랑을 오른쪽으로 돌아 심장의 뒤쪽으로 향합니다.\n\n이 경로에서 굴심방결절가지, 오른모서리가지를 내고, 뒤쪽으로 가서 뒤심실사이동맥이 됩니다. 앞심실사이고랑을 달리는 것은 왼관상동맥의 앞심실사이가지입니다.","why":{"0":"앞심실사이고랑을 달리는 것은 왼관상동맥의 앞심실사이가지(anterior interventricular a.)입니다.","1":"오른관상동맥은 먼저 방실고랑을 달리고, 가지로 뒤심실사이동맥을 냅니다. 처음부터 뒤심실사이고랑만 달리지는 않습니다.","3":"고랑말단(sulcus terminalis)은 오른심방 겉면의 얕은 고랑으로, 관상동맥의 주된 경로가 아닙니다.","4":"빗심막굴은 왼심방 뒤의 심막 공간이며 동맥 경로가 아닙니다."},"one":"오른관상동맥은 방실고랑(관상고랑)을 따라 주행합니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 25","img":[{"u":"img/w11_heart/p25.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 25"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-21":{"q":"Branches of the right coronary artery include the:","o":["SA nodal branch, right marginal branch, and posterior interventricular artery","Anterior interventricular artery, circumflex branch, and left marginal branch","Great, middle, and small cardiac veins","Bronchial and esophageal arteries from the thoracic aorta","Musculophrenic and pericardiacophrenic arteries"],"a":0,"qk":"오른관상동맥의 가지에 해당하는 것은?","ok":["굴심방결절가지, 오른모서리가가지, 뒤심실사이동맥","앞심실사이동맥, 휘돌이가지, 왼모서리가가지","큰·중간·작은심장정맥","가슴대동맥의 기관지동맥과 식도동맥","근횡격막동맥과 심막횡격막동맥"],"exp":"방실고랑을 달리는 오른관상동맥의 가지에는 **굴심방결절가지(SA nodal branch)**, **오른모서리가가지(right marginal branch)**, **뒤심실사이동맥(posterior interventricular artery)**이 있습니다.\n\n굴심방결절가지는 심장의 페이스메이커에 혈액을 보내고, 오른모서리가가지는 오른심실 아래 가장자리를 공급하며, 뒤심실사이동맥은 심실중격의 뒤쪽과 인접 심실벽을 공급합니다. 앞심실사이가지·휘돌이가지·왼모서리가가지는 왼관상동맥의 가지입니다.","why":{"1":"앞심실사이동맥, 휘돌이가지, 왼모서리가가지는 왼관상동맥의 가지입니다.","2":"큰·중간·작은심장정맥은 관상정맥굴로 모이는 정맥 가지입니다.","3":"기관지·식도동맥은 심막에 가는 가슴대동맥 가지이며 관상동맥 가지가 아닙니다.","4":"근횡격막동맥과 심막횡격막동맥은 심막 공급 동맥이며 오른관상동맥의 가지가 아닙니다."},"one":"오른관상동맥의 가지에는 굴심방결절가지, 오른모서리가가지, 뒤심실사이동맥이 있습니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w11_heart/p26.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 26"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-22":{"q":"The left coronary artery is found between the left auricle and the pulmonary trunk and gives off the:","o":["SA nodal branch, right marginal branch, and posterior interventricular artery","Great, middle, and small cardiac veins only","Bronchial and esophageal arteries","Anterior interventricular artery, circumflex branch, and left marginal branch","Pericardiacophrenic and musculophrenic arteries"],"a":3,"qk":"왼관상동맥은 왼심방귀와 폐동맥줄기 사이에서 찾을 수 있으며, 내는 가지는?","ok":["굴심방결절가지, 오른모서리가가지, 뒤심실사이동맥","큰·중간·작은심장정맥만","기관지동맥과 식도동맥","앞심실사이동맥, 휘돌이가지, 왼모서리가가지","심막횡격막동맥과 근횡격막동맥"],"exp":"왼관상동맥(left coronary artery)은 **왼심방귀(left auricle)**와 **폐동맥줄기(pulmonary trunk)** 사이에서 찾습니다. 가지는 **앞심실사이동맥(anterior interventricular a.)**, **휘돌이가지(circumflex branch)**, **왼모서리가가지(left marginal branch)**입니다.\n\n앞심실사이동맥은 앞심실사이고랑을 내려가 왼심실 앞벽과 중격을 공급하고, 휘돌이가지는 방실고랑을 왼쪽으로 돕니다. 왼모서리가가지는 왼심실의 왼쪽 가장자리를 공급합니다.","why":{"0":"이 세 가지는 오른관상동맥의 가지입니다.","1":"큰·중간·작은심장정맥은 정맥 환류로, 왼관상동맥의 동맥 가지가 아닙니다.","2":"기관지·식도동맥은 가슴대동맥에서 나와 심막 등에 가는 가지입니다.","4":"심막횡격막동맥과 근횡격막동맥은 심막 공급 동맥입니다."},"one":"왼관상동맥은 왼심방귀와 폐동맥줄기 사이에 있으며, 앞심실사이·휘돌이·왼모서리가지를 냅니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 27, 28","img":[{"u":"img/w11_heart/p27.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 27"},{"u":"img/w11_heart/p28.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 28"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-23":{"q":"The coronary sinus, the main vein of the heart, empties into the:","o":["Left atrium","Right atrium","Left ventricle","Superior vena cava","Pulmonary trunk"],"a":1,"qk":"심장의 주된 정맥인 관상정맥굴(coronary sinus)이 열리는 곳은?","ok":["왼심방","오른심방","왼심실","상대정맥","폐동맥줄기"],"exp":"**관상정맥굴(coronary sinus)**은 심장의 **주된 정맥**이며, **오른심방(right atrium)**으로 열립니다. 뒤쪽에서 보면 방실고랑을 가로지르는 굵은 정맥으로 보이며, 오른심방 쪽 입구가 ‘…here’로 표시됩니다.\n\n지류에는 **큰심장정맥(great cardiac vein)**, **중간심장정맥(middle cardiac vein)**, **작은심장정맥(small cardiac vein)**이 있고, 그림에는 **왼모서리정맥(left marginal v.)**도 표시됩니다. 큰심장정맥은 앞심실사이동맥을, 중간심장정맥은 뒤심실사이동맥을 따라갑니다.","why":{"0":"관상정맥굴은 왼심방이 아니라 오른심방으로 열립니다. 왼심방에는 폐정맥이 들어갑니다.","2":"심실로 직접 열리지 않습니다. 목적지는 오른심방입니다.","3":"상대정맥은 전신 정맥혈을 오른심방으로 가져오지만, 관상정맥굴의 도착 지점은 아닙니다.","4":"폐동맥줄기는 오른심실의 동맥 유출로입니다."},"one":"관상정맥굴은 심장의 주된 정맥으로 오른심방에 열리며, 큰·중간·작은심장정맥이 모입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_heart/p29.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 29"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-24":{"q":"Lymphatics of the heart follow the coronary arteries and drain to the:","o":["Axillary lymph nodes","Superficial inguinal nodes","Celiac lymph nodes","Deep cervical nodes only","Tracheobronchial nodes"],"a":4,"qk":"심장의 림프관은 관상동맥을 따르며, 어느 림프절로 배수되는가?","ok":["겨드랑림프절","얕은샅림프절","복강림프절","깊은목림프절만","기관기관지림프절(tracheobronchial nodes)"],"exp":"심장의 림프는 **심장외막밑얼기(subepicardial plexus)**에서 모이며, 이 얼기가 **심근(myocardium)**과 **심내막밑(subendocardium)**을 배수합니다. 림프관은 **관상동맥을 따라** 주행합니다.\n\n최종적으로 심장 림프는 **기관기관지림프절(tracheobronchial nodes)**로 갑니다. 이 림프절은 기관 가름과 주기관지 주위에 있어, 심장과 허파의 림프가 모이는 중요한 거점입니다.","why":{"0":"겨드랑림프절은 주로 윗팔과 유방의 림프를 받습니다.","1":"얕은샅림프절은 아랫다리·회음 쪽 림프를 받습니다.","2":"복강림프절은 앞창자 계통의 배강 장기 림프를 받습니다.","3":"깊은목림프절이 최종 경로에 일부 이어질 수는 있으나, 심장이 직접 배수되는 곳은 기관기관지림프절입니다."},"one":"심장 림프는 심장외막밑얼기에서 관상동맥을 따라 기관기관지림프절로 배수됩니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w11_heart/p30.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 30"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-25":{"q":"The sinoatrial node initiates and regulates impulses, firing about 70 times per minute, and is located at the junction of the:","o":["Superior vena cava, right atrium, and crista terminalis","Inferior vena cava, left atrium, and pulmonary veins","Aortic valve, left ventricle, and interventricular septum","Coronary sinus, left auricle, and pulmonary trunk","Apex, left ventricle, and anterior interventricular groove"],"a":0,"qk":"굴심방결절(SA node)은 분당 약 70회 발화하며 자극을 시작하고 조절한다. 위치는?","ok":["상대정맥, 오른심방, 말단능선이 만나는 곳","하대정맥, 왼심방, 폐정맥이 만나는 곳","대동맥판막, 왼심실, 심실중격이 만나는 곳","관상정맥굴, 왼심방귀, 폐동맥줄기가 만나는 곳","심첨, 왼심실, 앞심실사이고랑이 만나는 곳"],"exp":"**굴심방결절(sinoatrial node)**은 **상대정맥(SVC)**, **오른심방**, **말단능선(crista terminalis)**이 만나는 곳에 있습니다. 심장 박동의 자극을 **시작·조절**하며, 약 **분당 70회** 발화합니다.\n\n이 위치는 오른심방의 위·뒤쪽, 상대정맥이 들어오는 입구 근처입니다. 방실결절이 중간중격에 있는 것과 구별해야 합니다.","why":{"1":"하대정맥·왼심방·폐정맥 접합은 굴심방결절 위치가 아닙니다. 폐정맥은 왼심방으로 들어갑니다.","2":"대동맥판막·왼심실·심실중격 일대는 굴심방결절이 아니라 방실다발 가지가 지나는 쪽에 가깝습니다.","3":"관상정맥굴은 오른심방으로 열리고, 왼심방귀·폐동맥줄기 사이는 왼관상동맥을 찾는 위치입니다.","4":"심첨과 앞심실사이고랑은 굴심방결절과 멀리 떨어져 있습니다."},"one":"굴심방결절은 상대정맥·오른심방·말단능선 접합에 있으며, 분당 약 70회 발화하는 페이스메이커입니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w11_heart/p31.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 31"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-26":{"q":"The atrioventricular node is located in the interatrial septum and is specialized to:","o":["Initiate impulses at about 70 times per minute as the primary pacemaker","Drain lymph from the myocardium to tracheobronchial nodes","Pass SA-node impulses to the ventricles after a built-in delay","Form the anterior papillary muscle of the left ventricle","Arise from the right aortic sinus and run in the atrioventricular groove"],"a":2,"qk":"방실결절(AV node)은 중간중격에 있으며, 그 역할은?","ok":["분당 약 70회로 발화하여 일차 페이스메이커로 작용한다","심근 림프를 기관기관지림프절로 보낸다","굴심방결절 자극을 내장된 지연 뒤에 심실로 전달한다","왼심실의 앞유두근을 형성한다","오른대동맥굴에서 나와 방실고랑을 달린다"],"exp":"**방실결절(atrioventricular node)**은 **중간중격(interatrial septum)**에 있습니다. 굴심방결절에서 온 자극을 받아, **내장된 지연(built-in delay)**을 두고 심실로 보냅니다.\n\n이 지연 덕분에 심방이 먼저 수축해 심실을 채운 뒤 심실이 수축합니다. 지연이 없으면 심방과 심실이 거의 동시에 수축하여 효과적인 혈액을 내보내지 못합니다.","why":{"0":"분당 약 70회 발화하는 일차 페이스메이커는 굴심방결절입니다.","1":"림프 배수는 심장외막밑얼기와 기관기관지림프절의 이야기입니다.","3":"유두근은 심실의 수축성 근육이며 방실결절이 아닙니다.","4":"오른대동맥굴에서 나와 방실고랑을 달리는 것은 오른관상동맥입니다."},"one":"방실결절은 중간중격에 있으며, 굴심방결절 자극을 지연시킨 뒤 심실로 전달합니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 32","img":[{"u":"img/w11_heart/p32.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 32"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-27":{"q":"The atrioventricular bundle divides into right and left bundle branches that carry impulses to the ventricular muscle. A right-sided conduction path travels in the:","o":["Crista terminalis of the right atrium","Coronary sinus along the posterior atrioventricular groove","Oblique pericardial sinus behind the left atrium","Septomarginal trabecula","Sinus venarum of the right atrium"],"a":3,"qk":"방실다발은 오른·왼다발가지로 나뉘어 심실 근육으로 자극을 전한다. 오른쪽 전도로가 지나는 구조는?","ok":["오른심방의 말단능선","뒤 방실고랑의 관상정맥굴","왼심방 뒤의 빗심막굴","중격가장자리잔기둥(septomarginal trabecula)","오른심방의 정맥굴"],"exp":"**방실다발(atrioventricular bundle)**은 **오른다발가지와 왼다발가지**로 나뉘어 심실 근육으로 자극을 전합니다. 오른쪽에서는 전도로가 **중격가장자리잔기둥(septomarginal trabecula)**을 지납니다.\n\n이 잔기둥은 심실중격에서 오른심실 앞유두근으로 가로지르는 근육다리입니다. 오른다발가지가 이 다리를 통해 빨리 앞유두근에 도달하므로, 삼첨판이 닫히는 타이밍이 맞습니다.","why":{"0":"말단능선은 굴심방결절 위치의 기준이지, 방실다발 가지의 경로가 아닙니다.","1":"관상정맥굴은 정맥 환류 경로입니다.","2":"빗심막굴은 심막 공간이며 전도계가 아닙니다.","4":"정맥굴은 오른심방의 매끈한 부분입니다."},"one":"방실다발은 좌우 다발가지로 나뉘고, 오른다발가지는 중격가장자리잔기둥을 지납니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_heart/p33.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 33"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-28":{"q":"Cardiac nerves that form the cardiac plexus originate from the:","o":["Phrenic nerves together with the intercostal nerves only","Vagus nerve (parasympathetic) and the sympathetic chain","Recurrent laryngeal nerves as the sole cardiac source","Hypoglossal and accessory nerves of the hindbrain","Greater splanchnic nerves from the abdominal chain only"],"a":1,"qk":"심장신경총(cardiac plexus)을 이루는 심장신경의 기원은?","ok":["횡격신경과 갈비사이신경만","미주신경(부교감)과 교감신경줄기","되돌이후두신경만이 유일한 기원","뒷뇌의 혀밑신경과 더부신경","배쪽 줄기의 큰내장신경만"],"exp":"심장신경(cardiac nerves)은 **미주신경(vagus nerve, 부교감)**과 **교감신경줄기(sympathetic chain)**에서 나옵니다. 이 섬유들이 대동맥활과 허파동맥 주위에서 **심장신경총(cardiac plexus)**을 이룹니다.\n\n그림에서 노란 신경 다발이 오름대동맥과 폐동맥 쪽으로 내려오는 모습이 심장신경이고, 기관 가름·오른허파동맥 주위를 노란 원으로 표시한 부분이 심장신경총입니다.","why":{"0":"횡격신경은 심막 감각과 가로막 운동을 담당하지만, 심장신경총의 제시된 기원은 미주신경과 교감신경줄기입니다.","2":"되돌이후두신경은 미주의 가지로 후두에 가며, 심장신경총의 유일한 기원이 아닙니다.","3":"혀밑신경과 더부신경은 뇌신경으로 혀·목빗근·등세모근을 지배하며 심장신경이 아닙니다.","4":"큰내장신경은 배강의 앞창자 교감신경입니다."},"one":"심장신경은 미주신경(부교감)과 교감신경줄기에서 나와 심장신경총을 이룹니다.","src":"15 - Heart 2024-2025 CANVAS.pdf, slide 34, 35","img":[{"u":"img/w11_heart/p34.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 34"},{"u":"img/w11_heart/p35.webp","cap":"15 - Heart 2024-2025 CANVAS.pdf, slide 35"}],"ch":"w11_heart","chn":"Heart","week":11},"w11_heart-29":{"q":"Sympathetic fibers to the heart produce which combination of effects?","o":["Slow the heart rate, reduce force of beat, and constrict vessels","Slow the heart rate, increase force of beat, and constrict vessels","Increase the heart rate, reduce force of beat, and constrict vessels","Increase the heart rate, increase force of beat, and constrict vessels","Increase the heart rate, increase force of beat, and dilate coronary vessels"],"a":4,"qk":"심장에 대한 교감신경 섬유의 효과 조합은?","ok":["심박수 감소, 수축력 감소, 혈관 수축","심박수 감소, 수축력 증가, 혈관 수축","심박수 증가, 수축력 감소, 혈관 수축","심박수 증가, 수축력 증가, 혈관 수축","심박수 증가, 수축력 증가, 관상혈관 확장"],"exp":"**교감신경 섬유**는 심장을 ‘싸우거나 도망가는’ 상태에 맞게 조절합니다. **심박수(heart rate)를 올리고**, **박출 힘(force of beat)을 키우며**, **관상혈관을 확장(dilate)**합니다.\n\n관상혈관이 열려야 빨라지고 세진 심근에 산소와 영양을 더 공급할 수 있습니다. 이 섬유는 교감신경줄기에서 심장신경총을 거쳐 심장에 도달합니다.","why":{"0":"심박수 감소, 수축력 감소, 혈관 수축은 부교감신경의 효과입니다.","1":"교감신경은 심박수를 줄이지 않고 올립니다. 혈관도 수축이 아니라 관상혈관을 확장합니다.","2":"수축력을 줄이고 혈관을 수축시키는 것은 교감신경이 아닙니다.","3":"심박수와 수축력 증가는 맞지만, 교감신경은 관상혈관을 수축시키지 않고 확장합니다."},"one":"교감신경은 심박수와 수축력을 올리고 관상혈관을 확장합니다.","src":"15 - Heart 2024-2025
