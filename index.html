logy Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-20":{"q":"Which mechanism in the regulation of blood pressure has the potential to be the most effective over time?","o":["Stress relaxation.","Vasomotor changes.","Altered cardiac output.","Renal handling of salt and water.","Autonomic responses."],"a":3,"qk":"혈압 조절 기전 중 시간이 지남에 따라 가장 효과적일 수 있는 것은 무엇입니까?","ok":["응력 이완(stress relaxation)","혈관운동 변화(vasomotor changes)","심박출량 변화","신장의 염분과 수분 처리(renal handling of salt and water)","자율신경 반응"],"exp":"**정답 이유**\n\n\"평균 동맥압의 **장기 조절**은 소변으로 나가는 물과 Na⁺의 손실을 조절하는 것으로 이루어집니다. 이는 RAA계, 아르기닌 바소프레신(arginine vasopressin), 심방나트륨이뇨펩타이드(atrial natriuretic peptide)의 작용을 통해 일어납니다\". 신장은 혈압이 정상으로 돌아올 때까지 염분과 수분 배설을 계속 조절합니다. 그래서 시간이 충분하면 혈압을 정상으로 되돌릴 수 있는 사실상 무한한 능력을 가집니다.","why":{"0":"응력 이완은 혈관이 늘어난 뒤 서서히 긴장을 풀어 압력을 줄이는 현상입니다. 효과가 제한적이고 일시적입니다.","1":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다.","2":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다.","4":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다."},"one":"시간이 지남에 따라 가장 효과적인 혈압 조절은 신장의 염분과 수분 처리이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q20) / 9b. Cardiovascular Physiology 2026.pdf, slide 65","img":[{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-21":{"q":"Cardiac glycosides inhibit Na+- K+ ATPase in cardiac myocytes. How does this affect cardiac function?","o":["It decreases cardiac contractility.","It increases cardiac contractility.","It slows spontaneous depolarization of the S-A node.","It reduces blood flow through coronary arteries.","It increases blood flow through coronary arteries."],"a":1,"qk":"강심배당체(cardiac glycosides)는 심근세포의 Na⁺-K⁺ ATPase를 억제합니다. 이것이 심장 기능에 어떤 영향을 줍니까?","ok":["심장 수축력(contractility)을 감소시킨다.","심장 수축력을 증가시킨다.","동방결절의 자발적 탈분극을 늦춘다.","관상동맥 혈류를 감소시킨다.","관상동맥 혈류를 증가시킨다."],"exp":"**정답 이유**\n\n연쇄 반응으로 이해하시면 쉽습니다.\n\n① 디곡신(digoxin) 같은 강심배당체가 Na⁺-K⁺ ATPase를 억제합니다.\n\n② 세포 안 Na⁺가 쌓입니다.\n\n③ 세포 안팎의 Na⁺ 농도 차이가 줄어 Na⁺-Ca²⁺ 교환체(exchanger)가 Ca²⁺를 잘 내보내지 못합니다(\"indirectly inhibiting Na⁺-Ca²⁺ exchange\").\n\n④ 세포 안 Ca²⁺가 늘고 근소포체(SR)에 더 많이 저장됩니다.\n\n⑤ 다음 수축 때 Ca²⁺가 더 많이 방출되어 **수축력이 증가**합니다.","why":{"0":"정반대입니다. 강심배당체는 심부전 치료에 쓰는 수축력 강화제입니다.","2":"디곡신은 미주신경 작용을 통해 방실결절 전도를 늦추는 부가 효과가 있습니다(일반 약리 지식). 하지만 질문이 묻는 Na⁺-K⁺ ATPase 억제의 핵심 효과는 수축력 증가입니다.","3":"관상동맥 혈류를 직접 조절하는 약이 아닙니다. 관상동맥 확장제(coronary vessel dilators)는 따로 있습니다.","4":"관상동맥 혈류를 직접 조절하는 약이 아닙니다. 관상동맥 확장제(coronary vessel dilators)는 따로 있습니다."},"one":"강심배당체의 Na⁺-K⁺ ATPase 억제는 세포 안 Ca²⁺를 늘려 심장 수축력을 증가시킨다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q21) / 9b. Cardiovascular Physiology 2026.pdf, slide 48","img":[{"u":"img/w11_cv_phys/p48.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 48","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-22":{"q":"What receptor is stimulated by adrenergic agents in the heart?","o":["α1","α2","β1","β2","M1."],"a":2,"qk":"심장에서 아드레날린성 약물(adrenergic agents)에 의해 자극되는 수용체는 무엇입니까?","ok":["α₁","α₂","β₁","β₂","M₁"],"exp":"**정답 이유**\n\n\"교감신경 작용은 **심장의 β₁ 수용체**와 혈관의 α₁, β₂ 수용체 자극에 의해 일어납니다\". 심장의 β₁ 자극은 심박수 증가(4기 기울기 ↑), 수축력 증가(L형 Ca²⁺ 채널 인산화), 전도 속도 증가를 일으킵니다. 외우는 법: \"심장은 하나(1)라서 β**1**, 폐는 둘(2)이라서 β**2**\"라고 기억하시면 됩니다.","why":{"0":"α₁: 주로 **혈관** 평활근 수축(피부·신장 혈관 수축)에 작용합니다.","1":"α₂: 주로 신경 말단의 시냅스전 억제 수용체입니다.","3":"β₂: **혈관**(골격근 세동맥 확장)과 기관지 평활근 이완에 작용합니다.","4":"M 수용체는 아드레날린성이 아니라 **콜린성(ACh)** 수용체입니다. 심장에 있는 것도 M₁이 아니라 M₂입니다."},"one":"심장에서 아드레날린성 약물이 자극하는 수용체는 β₁이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q22) / 9b. Cardiovascular Physiology 2026.pdf, slides 56, 64","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900},{"u":"img/w11_cv_phys/p64.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 64","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-23":{"q":"Which of the following events in the cardiac cycle correctly corresponds to time points in the pressure tracing shown below?","o":["Isovolumetric contraction occurs between B and C.","Aortic valve closes at C.","Isovolumetric relaxation occurs between B and C.","Aortic valve closes at B.","Mitral valve closes at E."],"a":0,"qk":"아래 압력 곡선의 시점들과 심장주기의 사건이 올바르게 대응하는 것은 무엇입니까?","ok":["등용적 수축(isovolumetric contraction)은 B와 C 사이에 일어난다.","대동맥판(aortic valve)은 C에서 닫힌다.","등용적 이완(isovolumetric relaxation)은 B와 C 사이에 일어난다.","대동맥판은 B에서 닫힌다.","승모판(mitral valve)은 E에서 닫힌다."],"exp":"**그림 읽기 **\n\n· A: 심방 수축으로 생긴 작은 언덕(a파)\n\n· **B**: 심실압이 심방압보다 높아지는 지점 → **방실판(승모판) 닫힘**, S1\n\n· **C**: 심실압이 대동맥압보다 높아지는 지점 → **대동맥판 열림**, 박출 시작\n\n· D: 심실압 최고점\n\n· **E**: 심실압이 대동맥압보다 낮아지는 지점 → **대동맥판 닫힘**, S2(대동맥 곡선의 작은 패임 dicrotic notch)\n\n· **F**: 심실압이 심방압보다 낮아지는 지점 → **승모판 열림**, 충만 시작\n\n**정답 이유**\n\nB(승모판 닫힘)부터 C(대동맥판 열림)까지는 **모든 판막이 닫힌 채** 심실압만 급격히 오릅니다. 이것이 등용적 수축(isovolumetric contraction)입니다.","why":{"1":"대동맥판은 C에서 **열립니다**.","2":"등용적 이완은 E(대동맥판 닫힘)부터 F(승모판 열림) 사이입니다.","3":"B에서 닫히는 것은 대동맥판이 아니라 승모판입니다.","4":"E에서 닫히는 것은 대동맥판입니다. 승모판은 B에서 닫히고 F에서 열립니다."},"one":"등용적 수축은 승모판이 닫히는 B와 대동맥판이 열리는 C 사이에서 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q23) / 9b. Cardiovascular Physiology 2026.pdf, slides 49, 51","img":[{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49","w":1200,"h":900},{"u":"img/w11_cv_phys/p51.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 51","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pressure.webp","cap":"Cardiac cycle pressure tracing (9a Study Q23)"}},"w11_cv_phys-24":{"q":"Which of the following has the greatest effect on blood flow through arterioles?","o":["The pressure gradient between the right and left ventricles.","The contractility of the ventricles.","Venous return.","The viscosity of the blood.","The diameter of the arterioles."],"a":4,"qk":"세동맥(arterioles)을 통과하는 혈류에 가장 큰 영향을 주는 것은 무엇입니까?","ok":["좌·우 심실 사이의 압력 차이","심실의 수축력","정맥 환류(venous return)","혈액의 점도(viscosity)","세동맥의 지름(diameter)"],"exp":"**정답 이유**\n\n혈류 = 압력 차이(ΔP) / 저항(R)이고, 저항은 혈관 길이와 점도에 비례하며 **반지름의 4제곱에 반비례**합니다. 지름이 절반이 되면 저항은 2⁴ = 16배가 되어 혈류가 1/16로 줄어듭니다. 지름이 아주 조금만 변해도 혈류가 엄청나게 변하므로, 세동맥의 지름(평활근 수축·이완)이 혈류를 가장 크게 좌우합니다. 그래서 세동맥을 \"저항 혈관\"이라고 부릅니다.","why":{"0":"좌·우 심실 사이의 압력 차이는 세동맥 양 끝의 압력 차이(구동압 driving pressure)가 아닙니다. 혈류와 무관합니다.","1":"수축력과 정맥 환류는 전체 심박출량에 영향을 줍니다. 하지만 개별 세동맥의 혈류 분배는 그 세동맥의 지름이 결정합니다.","2":"수축력과 정맥 환류는 전체 심박출량에 영향을 줍니다. 하지만 개별 세동맥의 혈류 분배는 그 세동맥의 지름이 결정합니다.","3":"점도도 저항에 영향을 주지만 1제곱(비례)의 영향입니다. 반지름의 4제곱보다 훨씬 작고, 정상에서는 거의 변하지 않습니다."},"one":"세동맥 혈류에 가장 큰 영향을 주는 것은 반지름의 4제곱에 반비례하는 세동맥의 지름이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q24) / 9b. Cardiovascular Physiology 2026.pdf, slides 5, 8","img":[{"u":"img/w11_cv_phys/p05.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 5","w":1200,"h":900},{"u":"img/w11_cv_phys/p08.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 8","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-25":{"q":"Isovolumic contraction occurs between which points on the loop?","o":["1 and 2","4 and 1","2 and 3","3 and 4"],"a":0,"qk":"루프(loop)의 어느 점들 사이에서 등용적 수축(isovolumic contraction)이 일어납니까?","ok":["1과 2","4와 1","2와 3","3과 4"],"exp":"**압력-용적 고리 읽기 – Q25–27 공통**\n\n고리는 반시계 방향으로 돕니다(화살표 방향).\n\n· **점 1**(약 140 mL, 낮은 압력): 이완기말(EDV). **승모판 닫힘**\n\n· **1 → 2**: 부피는 140 mL 그대로, 압력만 급상승 → **등용적 수축**\n\n· **점 2**(약 80 mmHg): **대동맥판 열림**\n\n· **2 → 3**: 부피가 140 → 70 mL로 감소, 압력은 최고점을 지남 → **박출(ejection)**\n\n· **점 3**: 수축기말(ESV). **대동맥판 닫힘**\n\n· **3 → 4**: 부피는 70 mL 그대로, 압력만 급하강 → **등용적 이완**\n\n· **점 4**: **승모판 열림**\n\n· **4 → 1**: 압력은 낮은 채 부피가 증가 → **충만(filling)**\n\n일회박출량 = EDV − ESV = 140 − 70 = 약 70 mL입니다.\n\n**정답 이유**\n\n등용적 수축은 \"부피 변화 없이 압력만 오르는\" 구간, 즉 그래프에서 **수직으로 올라가는 오른쪽 선(1 → 2)**입니다.","why":{"1":"4 → 1: 충만기입니다.","2":"2 → 3: 박출기입니다.","3":"3 → 4: 수직으로 내려가는 선으로, 등용적 **이완**입니다."},"one":"압력-용적 고리에서 등용적 수축은 점 1과 점 2 사이(부피 없이 압력만 상승)에서 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q25) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-26":{"q":"Which of the following normally occurs between points 2 and 3?","o":["Developed afterload","Energy transfer to the wall of the aorta.","A decrease in left ventricular volume.","Ejection of blood into the aorta.","Each of the above."],"a":4,"qk":"정상적으로 점 2와 3 사이에서 일어나는 것은 무엇입니까?","ok":["발생된 후부하(developed afterload)","대동맥 벽으로의 에너지 전달","좌심실 용적의 감소","대동맥으로의 혈액 박출","위의 각각(each of the above)"],"exp":"**정답 이유**\n\n2 → 3은 대동맥판이 열려 있는 **박출기**입니다 (Q25 그림 설명 참조). 이 구간에서는 네 가지가 모두 일어납니다.\n\n· A 심실은 대동맥압이라는 **후부하(afterload)**를 이기며 혈액을 밀어냅니다.\n\n· B 박출된 혈액이 탄력 있는 대동맥 벽을 늘려 에너지를 저장시킵니다. 이 에너지가 이완기 동안 혈류를 계속 밀어줍니다.\n\n· C 혈액이 빠져나가므로 좌심실 부피가 140 → 70 mL로 **감소**합니다(그래프에서 왼쪽으로 이동).\n\n· D 대동맥으로 혈액이 **박출**됩니다.\n\n따라서 정답은 **E (위의 각각)**입니다.","why":{"0":"점 2와 3 사이는 박출기이므로, 심실은 대동맥압이라는 후부하(afterload)를 이기며 혈액을 밀어냅니다. 이것만 일어난 것이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","1":"박출된 혈액이 탄력 있는 대동맥 벽을 늘려 에너지를 저장합니다. 이것만의 사건이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","2":"혈액이 빠져나가 좌심실 용적이 감소합니다(그래프에서 왼쪽 이동). 이것만이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","3":"대동맥으로 혈액이 박출됩니다. 이것만이 아니라 A–D가 모두 일어나므로 정답은 E입니다."},"one":"점 2와 3 사이는 박출기로, 후부하·대동맥 벽 에너지 전달·좌심실 용적 감소·대동맥 박출이 모두 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q26) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-27":{"q":"The aortic valve normally closes at which point on the loop?","o":["1","2","3","4"],"a":2,"qk":"대동맥판은 정상적으로 루프의 어느 점에서 닫힙니까?","ok":["1","2","3","4"],"exp":"**정답 이유**\n\n박출(2 → 3)이 끝나는 **점 3**에서 심실압이 대동맥압 아래로 떨어지며 대동맥판이 닫힙니다(S2). 이후 3 → 4의 등용적 이완이 시작됩니다. 점 3의 부피가 수축기말 용적(ESV)입니다.","why":{"0":"점 1: 승모판이 **닫히는** 점입니다(S1, 등용적 수축 시작).","1":"점 2: 대동맥판이 **열리는** 점입니다.","3":"점 4: 승모판이 **열리는** 점입니다(충만 시작). 외우는 법: 고리의 네 모서리는 판막 사건 4개(1 승모판 닫힘 → 2 대동맥판 열림 → 3 대동맥판 닫힘 → 4 승모판 열림)입니다."},"one":"대동맥판은 박출이 끝나는 점 3에서 닫힌다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q27) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53","w":1200,"h":900},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-28":{"q":"What is the effect of increased filling time on ventricular function?","o":["A decrease in cardiac output.","A decrease in end-diastolic volume.","A decrease in end-systolic volume.","An increase in end-diastolic volume.","An increase in end-systolic volume."],"a":3,"qk":"충만 시간(filling time)이 증가하면 심실 기능에 어떤 영향이 있습니까?","ok":["심박출량 감소","이완기말 용적(EDV) 감소","수축기말 용적(ESV) 감소","이완기말 용적(EDV) 증가","수축기말 용적(ESV) 증가"],"exp":"**정답 이유**\n\n\"충만 압력, **충만 시간**, 심실 순응도가 증가하면 EDV가 증가합니다\". 심실이 혈액을 받을 시간이 길어지면 더 많이 채워지는 것은 당연합니다. 심박수가 느려질 때가 대표적인 예입니다. 그리고 프랭크-스탈링 법칙에 따라 EDV가 늘면 일회박출량도 늡니다.","why":{"0":"EDV가 늘면 일회박출량이 늘어납니다. 따라서 충만 시간 증가 자체가 심박출량 감소를 일으킨다고 할 수 없습니다.","1":"EDV는 감소가 아니라 증가합니다.","2":"ESV는 전부하, 후부하, 심박수, 수축력이 함께 결정합니다. 충만 시간의 직접적이고 대표적인 효과는 EDV 증가입니다.","4":"ESV는 전부하, 후부하, 심박수, 수축력이 함께 결정합니다. 충만 시간의 직접적이고 대표적인 효과는 EDV 증가입니다."},"one":"충만 시간이 증가하면 이완기말 용적(EDV)이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q28) / 9b. Cardiovascular Physiology 2026.pdf, slide 57","img":[{"u":"img/w11_cv_phys/p57.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 57","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-29":{"q":"A patient with long-standing coronary artery disease also has advanced CHF. What physical findings are most likely to be present in this patient?","o":["Exercise intolerance.","Swelling of the ankles.","A shift in the location of the apical beat toward the left on the chest.","An enlarged heart.","Each of the above"],"a":4,"qk":"오래된 관상동맥질환이 있는 환자가 진행된 울혈성 심부전(CHF)도 가지고 있습니다. 이 환자에서 나타날 가능성이 가장 높은 신체 소견은 무엇입니까?","ok":["운동 불내성(exercise intolerance)","발목 부종(swelling of the ankles)","심첨 박동(apical beat) 위치가 가슴에서 왼쪽으로 이동","심장 비대(enlarged heart)","위의 각각"],"exp":"**정답 이유**\n\n· A 운동 불내성: 손상된 심장은 운동 때 심박출량을 충분히 늘리지 못합니다. 심기능곡선이 아래로 내려가 있기 때문입니다.\n\n· B 발목 부종: 우심부전에서는 정맥압이 올라 전신 모세혈관 여과가 늘어 **부종(edema)**이 생깁니다. 중력 때문에 발목에 잘 생깁니다.\n\n· C·D 심장 비대와 심첨 박동 이동: 만성 심부전에서는 혈액량이 늘고 심실이 늘어나 **심장이 커집니다**. 커진 좌심실 때문에 심첨 박동(가장 강하게 뛰는 곳)이 정상 위치(왼쪽 5번째 늑간, 쇄골중앙선)보다 더 왼쪽 아래로 이동합니다.\n\n네 가지 모두 진행된 CHF에서 볼 수 있으므로 정답은 **E**입니다.","why":{"0":"운동 불내성은 손상된 심장이 운동 때 심박출량을 충분히 늘리지 못해 나타납니다. 진행된 CHF에서는 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","1":"우심부전에서 정맥압이 올라 전신 모세혈관 여과가 늘어 발목 부종이 잘 생깁니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","2":"커진 좌심실 때문에 심첨 박동이 정상보다 왼쪽 아래로 이동합니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","3":"만성 심부전에서는 혈액량이 늘고 심실이 늘어나 심장이 커집니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다."},"one":"진행된 울혈성 심부전에서는 운동 불내성, 발목 부종, 심첨 박동 좌측 이동, 심장 비대가 모두 나타날 수 있다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q29) / 9b. Cardiovascular Physiology 2026.pdf, slide 79","img":[{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-30":{"q":"Stroke volume of the heart is defined as","o":["cardiac output plus end-systolic volume.","cardiac output minus end-diastolic volume.","end-diastolic volume minus end-systolic volume.","end-systolic volume minus end-diastolic volume.","heart rate times mean arterial pressure."],"a":2,"qk":"심장의 일회박출량(stroke volume)의 정의는 무엇입니까?","ok":["심박출량 더하기 수축기말 용적","심박출량 빼기 이완기말 용적","이완기말 용적 빼기 수축기말 용적","수축기말 용적 빼기 이완기말 용적","심박수 곱하기 평균 동맥압"],"exp":"**정답 이유**\n\n\"일회박출량은 **이완기말 용적(EDV)과 수축기말 용적(ESV)의 차이**입니다\". 심실이 가득 찼을 때의 양(EDV)에서 수축 후 남은 양(ESV)을 빼면 한 번에 뿜어낸 양이 됩니다. Q25 고리 예시로 계산하면 140 − 70 = 70 mL입니다. 관련 공식은 다음과 같습니다.\n\n· 심박출량(CO) = 심박수 × 일회박출량 (약 5 L/min)\n\n· 박출률(ejection fraction) = 일회박출량 / EDV","why":{"0":"심박출량(L/min)과 용적(mL)은 단위부터 다르므로 더하거나 뺄 수 없습니다.","1":"심박출량(L/min)과 용적(mL)은 단위부터 다르므로 더하거나 뺄 수 없습니다.","3":"순서가 반대라 음수가 나옵니다.","4":"의미 없는 조합입니다. 평균 동맥압 ≈ 심박출량 × 총말초저항이라는 공식과 헷갈리게 만든 보기입니다."},"one":"일회박출량(stroke volume)은 이완기말 용적에서 수축기말 용적을 뺀 값이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q30) / 9b. Cardiovascular Physiology 2026.pdf, slide 52","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-31":{"q":"The initial effect of a significant loss of blood prior to any compensatory action.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":0,"qk":"보상 작용이 일어나기 전, 상당한 출혈(significant loss of blood)의 초기 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n출혈로 혈액량이 줄면 평균 체충만압이 낮아집니다. 그래서 혈관기능곡선이 **평행하게 왼쪽**으로 이동합니다. 아직 보상(교감신경 활성) 전이므로 심장 자체는 그대로이고, 심기능곡선은 **정상 곡선**을 유지합니다. 정상 심기능곡선과 왼쪽으로 많이 이동한 혈관곡선의 교차점이 **a**입니다. 이 점에서 우심방압은 내려가고(약 1.5 → 0.5 mmHg) 심박출량도 감소합니다(약 5.4 → 4 L/min). 즉 \"정맥 환류가 줄어 → 전부하가 줄고 → 심박출량이 감소\"한 상태입니다.","why":{"1":"점 b는 출혈에 대한 보상 반응입니다. 심기능곡선이 위로 올라가고 혈관곡선이 a보다 조금 오른쪽으로 돌아오며 심박출량이 거의 정상으로 회복된 교차점입니다.","2":"점 c는 격렬한 운동의 효과입니다. 심기능곡선이 위로, 혈관기능곡선이 오른쪽으로 이동해 심박출량이 가장 높습니다.","3":"점 d는 보상 전 심근경색의 효과로, 오른쪽 그래프에서 심기능곡선이 아래로 이동하고 혈관곡선은 정상인 교차점입니다.","4":"점 e는 울혈성 심부전에 대한 수분 저류 보상으로, 혈관곡선이 오른쪽으로 이동한 오른쪽 그래프의 교차점입니다."},"one":"보상 전 출혈의 초기 효과는 혈관기능곡선이 왼쪽으로 이동한 교차점 a이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q31) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-32":{"q":"Compensatory response to blood loss.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":1,"qk":"출혈에 대한 보상 반응(compensatory response).","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n10% 이상 출혈하면 압수용체 발화가 줄어 **교감신경 활동이 증가**하고 부교감신경 활동은 감소합니다. 그 결과 두 가지가 일어납니다.\n\n① 심장 수축력과 심박수가 늘어 심기능곡선이 **위로** 올라갑니다(회색 곡선).\n\n② 정맥 수축(venoconstriction)으로 저장 혈액이 동원되어 정맥 환류가 늘어납니다. 그래서 평균 체충만압이 일부 회복되고, 혈관곡선이 a의 곡선보다 **조금 오른쪽**(왼쪽 두 번째 점선)으로 돌아옵니다.\n\n이 두 곡선의 교차점이 **b**입니다. 우심방압은 여전히 낮지만(약 0.2 mmHg) 심박출량은 정상에 가깝게(약 5.4 L/min) 회복되었습니다. 보상 반응으로 심박출량이 다시 올라온 모습입니다.","why":{"0":"점 a는 보상 전 출혈의 초기 효과입니다. 심기능곡선은 정상이고 혈관기능곡선만 왼쪽으로 많이 이동해 심박출량이 감소한 상태입니다.","2":"점 c는 격렬한 운동의 효과입니다. 심박출량이 그림에서 가장 높은 교차점입니다.","3":"점 d는 보상 전 심근경색의 효과입니다(오른쪽 그래프, 심기능곡선 하향).","4":"점 e는 CHF에 대한 수분 저류 보상입니다(오른쪽 그래프, 혈관곡선 우측 이동)."},"one":"출혈에 대한 보상 반응은 심기능곡선이 위로 올라가고 혈관곡선이 일부 회복된 교차점 b이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q32) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-33":{"q":"Effect of strenuous exercise.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":2,"qk":"격렬한 운동(strenuous exercise)의 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n운동하면 심박출량이 크게 늘고, 심기능곡선은 **위로(반시계 방향) 이동**합니다. 교감신경이 심장 수축력과 심박수를 높이기 때문입니다. 동시에 수축하는 근육이 정맥을 쥐어짜고(근육 펌프 muscle pump) 정맥 수축으로 혈액이 동원되어 정맥 환류가 늘어납니다. 그래서 혈관곡선이 **오른쪽**으로 이동합니다. 위로 올라간 회색 심기능곡선과 오른쪽 점선 혈관곡선의 교차점 **c**에서 심박출량이 가장 높습니다(약 7.3 L/min). 그림 속 다섯 점 중 심박출량이 최대인 점이므로 운동에 해당합니다.","why":{"0":"점 a는 보상 전 출혈의 초기 효과로, 심박출량이 감소합니다. 운동처럼 심박출량이 최대가 아닙니다.","1":"점 b는 출혈에 대한 보상으로 심박출량이 정상에 가깝게 회복된 점이지, 운동으로 최대 심박출량이 된 점이 아닙니다.","3":"점 d는 보상 전 심근경색으로 심박출량이 떨어진 점입니다.","4":"점 e는 CHF 수분 저류 보상으로, 심박출량이 정상보다 낮고 우심방압이 높은 점입니다."},"one":"격렬한 운동은 심기능곡선이 위로, 혈관기능곡선이 오른쪽으로 이동한 교차점 c(최고 심박출량)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q33) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 73, 75","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p73.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 73","w":1200,"h":900},{"u":"img/w11_cv_phys/p75.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 75","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-34":{"q":"Effect of myocardial infarction before any compensatory response.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":3,"qk":"보상 반응이 일어나기 전, 심근경색(myocardial infarction)의 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n\"심근이 손상되면 심장 수행능력이 감소하고 심기능곡선이 **아래로(시계 방향) 이동**합니다\". 보상 전이므로 혈액량과 혈관 상태는 그대로이고, 혈관기능곡선은 **정상**입니다. 가장 아래 심기능곡선과 정상 혈관곡선의 교차점이 **d**입니다. 이 점에서 심박출량은 떨어지고(약 5.4 → 3.2 L/min) 우심방압은 올라갑니다(약 1.5 → 3.7 mmHg). 심장이 혈액을 다 퍼내지 못해 심장 앞에 혈액이 쌓이기(울혈 congestion) 때문입니다.","why":{"0":"점 a는 출혈의 초기 효과입니다. 혈관곡선이 왼쪽으로 이동하고 심장은 아직 정상입니다. 심근경색은 심기능곡선이 아래로 이동합니다.","1":"점 b는 출혈에 대한 교감 보상이지, 심근 손상의 초기 효과가 아닙니다.","2":"점 c는 격렬한 운동으로 심박출량이 가장 높은 점입니다.","4":"점 e는 심근 손상 이후 수분 저류 보상이 일어난 점으로, 보상 전 교차점이 아닙니다."},"one":"보상 전 심근경색은 심기능곡선이 아래로 이동하고 혈관곡선은 정상인 교차점 d이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q34) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-35":{"q":"Increased fluid retention as a compensatory response to CHF.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":4,"qk":"CHF(울혈성 심부전)에 대한 보상 반응으로서의 수분 저류(fluid retention) 증가.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n심박출량이 정상으로 돌아오지 못하는 만성 울혈성 심부전에서는 신장이 RAAS 등을 통해 물과 Na⁺를 저류합니다. 그래서 **혈액량이 증가**합니다. 혈액량이 늘면 평균 체충만압이 올라 혈관곡선이 **오른쪽**으로 이동합니다. 동시에 교감신경 보상으로 심기능곡선이 d의 곡선보다 **조금 위**(중간 점선 곡선)로 올라갑니다. 이 두 곡선의 교차점이 **e**입니다. 심박출량은 d보다 회복되었지만(약 4.7 L/min) 정상보다는 낮고, 우심방압은 높은 상태(약 3.5 mmHg)로 남습니다. 높은 정맥압은 모세혈관 여과를 늘려 부종(edema)을 일으킵니다.\n\n참고: 오른쪽 그래프의 중간 점선 심기능곡선이 \"교감 보상으로 일부 회복된 심장\"을 나타낸다고 해석했습니다. 그림에 표시가 없어 이 부분은 해석에 의존합니다. 다만 수분 저류에 따른 혈관곡선의 오른쪽 이동은","why":{"0":"점 a는 출혈의 초기 효과(혈액량 감소, 혈관곡선 좌측 이동)이지, 혈액량이 늘어난 수분 저류 보상이 아닙니다.","1":"점 b는 출혈에 대한 급성 교감 보상입니다. 만성 CHF의 수분 저류가 아닙니다.","2":"점 c는 격렬한 운동의 효과로 심박출량이 최대인 점입니다.","3":"점 d는 보상 전 심근경색의 효과입니다. 수분 저류로 혈관곡선이 오른쪽으로 이동하기 전의 교차점입니다."},"one":"CHF에 대한 수분 저류 보상은 혈관곡선이 오른쪽으로 이동한 교차점 e이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q35) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}}}};
/*DATA*/
const LS='biomed_final_';let S=null,set=null;
function load(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}}
function save(){if(set)localStorage.setItem(LS+set.key,JSON.stringify(S));localStorage.setItem(LS+'last',set?set.key:'')}
function fresh(){return{mode:'study',ans:{},chk:{},cur:0,submitted:false,score:null,retry:null}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
const th=localStorage.getItem(LS+'theme');if(th==='dark')document.body.classList.add('dark');
function setThemeBtn(){theme.textContent=document.body.classList.contains('dark')?'Light':'Dark'}setThemeBtn();
theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(LS+'theme',document.body.classList.contains('dark')?'dark':'light');setThemeBtn()};
document.getElementById('home').onclick=home;
function packs(){return D.chapters}
function weekGroups(){
  const map=new Map();
  D.chapters.forEach(c=>{
    const id=c.week, name=c.weekName||('Week '+id);
    if(!map.has(id)) map.set(id,{id,name,chapters:[]});
    map.get(id).chapters.push(c);
  });
  return [...map.values()].sort((a,b)=>a.id-b.id);
}
function backLabel(){return '← Chapters'}
function qCount(s){return (s.ids&&s.ids.length)?s.ids.length:(s.nq||30)}
function hasQuestions(s){return !!(s.ids && s.ids.length)}
function ready(s){return s.status!=='pending' && hasQuestions(s)}
function progressLabel(s){
  const st=load(s.key), n=qCount(s);
  if(!st) return 'Not started';
  if(st.score) return 'Submitted: '+st.score.c+'/'+st.score.t;
  return 'In progress: '+Object.keys(st.ans).length+'/'+n;
}
function home(){set=null;localStorage.setItem(LS+'last','');
  const groups=weekGroups();
  const readyCh=D.chapters.filter(ready);
  const tot=readyCh.reduce((a,c)=>a+qCount(c),0);
  const nCh=D.chapters.length;
  const intro='<b>'+tot+' questions · '+readyCh.length+' chapters ready</b>'
    +'<div class="mu">Chapters are grouped by week. New weeks can be added to this same site — existing progress stays on this device, under the same chapter keys.</div>'
    +'<div class="mu" style="margin-top:6px">Pick an answer (you can change it), then press <b>Check</b> to see the Korean translation, the answer, a detailed explanation, the source, and the original slide. Progress is saved on this device automatically, per chapter.</div>';
  let h='<div class="card">'+intro+'</div>';
  groups.forEach(g=>{
    const nq=g.chapters.reduce((a,c)=>a+(ready(c)?qCount(c):0),0);
    h+='<div class="week-h"><h2>'+esc(g.name)+'</h2><span class="mu">'+g.chapters.length+' chapter'+(g.chapters.length>1?'s':'')+(nq?(' · '+nq+' questions'):'')+'</span></div><div class="grid">';
    g.chapters.forEach(s=>{
      const live=s.status!=='pending';
      const go=hasQuestions(s);
      const st=live?load(s.key):null;
      const info=live?progressLabel(s):(s.pendingReason||'Questions coming soon');
      h+='<div class="card">'
        +'<div><span class="badge">'+esc(g.name)+'</span>'+(live?'':'<span class="badge pend">Pending</span>')+'</div>'
        +'<b>'+esc(s.name)+'</b>'
        +'<div class="prof">'+esc(s.prof||'')+'</div>'
        +'<div class="mu">'+qCount(s)+' questions · '+esc(info)+'</div>'
        +'<div class="row" style="margin-top:10px">';
      if(go){
        h+='<button class="pri" data-k="'+esc(s.key)+'">'+(st?'Resume':'Start')+'</button>';
        if(st) h+='<button data-r="'+esc(s.key)+'">Reset</button>';
      }else{
        h+='<button disabled>Start</button>';
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  app.innerHTML=h;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open_(b.dataset.k));
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const s=D.chapters.find(c=>c.key===b.dataset.r);
    if(confirm('Reset progress for '+s.name+' only?')){localStorage.removeItem(LS+s.key);home()}
  });
}
function open_(key){
  set=D.chapters.find(c=>c.key===key);
  if(!set||!ready(set))return;
  S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render();scrollTo(0,0);
}
function ctx(){return S.retry?S.retry:S}
function ids(){return S.retry?S.retry.ids:set.ids}
function expl(q,my){const L='ABCDE';let h='';
  h+='<h4>문제 번역</h4><p>'+esc(q.qk)+'</p>';
  h+='<h4>보기 번역</h4><p>'+q.ok.map((o,k)=>L[k]+'. '+esc(o)).join('<br>')+'</p>';
  h+='<h4>정답</h4><p><b>'+L[q.a]+'. '+esc(q.o[q.a])+'</b></p>';
  h+='<h4>해설</h4>'+md(q.exp);
  const w=Object.keys(q.why||{}).map(Number).filter(k=>k!==q.a).sort();
  if(w.length) h+='<h4>오답 해설</h4><p>'+w.map(k=>'<b>'+L[k]+'. '+esc(q.o[k])+'</b> — '+esc(q.why[k])).join('<br>')+'</p>';
  if(q.one) h+='<h4>한 줄 정리</h4><p>'+esc(q.one)+'</p>';
  h+='<h4>출처</h4><p class="mu">'+esc(q.src)+'</p>';
  h+=(q.img||[]).map(m=>'<figure class="slide"><img src="'+m.u+'" alt="'+esc(m.cap)+'" loading="lazy" decoding="async"'
    +(m.w?(' width="'+m.w+'"'):'')+(m.h?(' height="'+m.h+'"'):'')
    +' data-z="'+m.u+'" data-c="'+esc(m.cap)+'"><figcaption>'+esc(m.cap)+' <span class="mu">· tap to enlarge</span></figcaption></figure>').join('');
  return h;
}
function zoom(u,c){const z=document.createElement('div');z.id='zoom';z.innerHTML='<img src="'+u+'" alt="'+esc(c)+'"><div class="zc">'+esc(c)+' · tap to close</div>';z.onclick=()=>z.remove();document.body.appendChild(z)}
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('img[data-z]');if(i)zoom(i.dataset.z,i.dataset.c)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const z=document.getElementById('zoom');if(z)z.remove()}});
function render(){const A=ctx(),L=ids(),id=L[A.cur],q=D.q[id],my=A.ans[id];if(!A.chk)A.chk={};
  const reveal=(A.mode==='study'&&A.chk[id])||A.submitted;
  let h='<div class="row" style="justify-content:space-between"><button id="back">'+backLabel()+'</button><span class="mu">'+esc(set.name)+(S.retry?' · Retry':'')+'</span></div>';
  h+='<div class="row" style="margin-top:10px"><span class="mu">Mode:</span><button id="ms" '+(A.mode==='study'?'class="pri"':'')+' '+(A.submitted?'disabled':'')+'>Study (check each)</button><button id="me" '+(A.mode==='exam'?'class="pri"':'')+' '+(A.submitted?'disabled':'')+'>Exam (submit at end)</button></div>';
  h+='<div class="nav">'+L.map((x,j)=>{let c=[];if(A.ans[x]!==undefined)c.push('ans');if(j===A.cur)c.push('cur');if(A.submitted||(A.mode==='study'&&A.chk[x])){if(A.ans[x]!==undefined)c.push(A.ans[x]===D.q[x].a?'r':'w')}return '<button class="'+c.join(' ')+'" data-j="'+j+'">'+(j+1)+'</button>'}).join('')+'</div>';
  h+='<div class="card"><div class="mu"><span class="tag">'+esc(set.weekName||('Week '+set.week))+' · '+esc(set.name)+'</span>Question '+(A.cur+1)+' of '+L.length+'</div><p style="font-size:1.05rem"><b>'+esc(q.q)+'</b></p>';
  if(q.fig){h+='<figure class="slide"><img src="'+q.fig.u+'" alt="'+esc(q.fig.cap||'Figure')+'" data-z="'+q.fig.u+'" data-c="'+esc(q.fig.cap||'Figure')+'"><figcaption class="mu">'+esc(q.fig.cap||'Question figure · tap to enlarge')+'</figcaption></figure>'}
  q.o.forEach((o,k)=>{let c='opt';if(my===k)c+=' sel';if(reveal){if(k===q.a)c+=' ok';else if(my===k)c+=' bad'}
    h+='<button class="'+c+'" data-k="'+k+'" '+(reveal?'disabled':'')+'>'+'ABCDE'[k]+'. '+esc(o)+'</button>'});
  if(!reveal&&A.mode==='study')h+='<button id="chk" class="pri" '+(my===undefined?'disabled':'')+'>Check</button><div class="hint">'+(my===undefined?'Choose an answer first. ':'')+'You can change your choice until you press Check.</div>';
  if(!reveal&&A.mode==='exam')h+='<div class="hint">Exam mode: answers are shown after you submit the chapter.</div>';
  if(reveal)h+='<div class="exp"><p><b>'+(my===q.a?'<span class="ok">Correct</span>':my===undefined?'<span class="mu">Unanswered</span>':'<span class="bad">Incorrect</span>')+'</b> — Answer: '+'ABCDE'[q.a]+'</p>'+expl(q,my)+'</div>';
  h+='</div><div class="row" style="justify-content:space-between"><button id="prev" '+(A.cur?'':'disabled')+'>← Prev</button>';
  h+=A.submitted?'<button id="res" class="pri">Results</button>':'<button id="sub">Submit</button>';
  h+='<button id="next" '+(A.cur<L.length-1?'':'disabled')+'>Next →</button></div>';
  app.innerHTML=h;
  back.onclick=home;prev.onclick=()=>{A.cur--;save();render()};next.onclick=()=>{A.cur++;save();render();scrollTo(0,0)};
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{A.cur=+b.dataset.j;save();render()});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{A.ans[id]=+b.dataset.k;save();render()});
  if(window.chk&&chk.tagName==='BUTTON')chk.onclick=()=>{if(A.ans[id]===undefined)return;A.chk[id]=true;save();render()};
  ms.onclick=()=>{A.mode='study';save();render()};me.onclick=()=>{A.mode='exam';save();render()};
  if(window.sub)sub.onclick=()=>{const un=L.filter(x=>A.ans[x]===undefined).length;if(un&&!confirm(un+' unanswered. Submit anyway?'))return;A.submitted=true;
    const c=L.filter(x=>A.ans[x]===D.q[x].a).length;A.result={c,t:L.length};if(!S.retry){S.score={c,t:L.length}}save();results()};
  if(window.res)res.onclick=results}
function results(){const A=ctx(),L=ids();const r=L.filter(x=>A.ans[x]===D.q[x].a),w=L.filter(x=>A.ans[x]!==undefined&&A.ans[x]!==D.q[x].a),u=L.filter(x=>A.ans[x]===undefined);
  const list=a=>a.map(x=>'<li>Q'+(L.indexOf(x)+1)+': '+esc(D.q[x].q)+'</li>').join('');
  let h='<button id="back">'+backLabel()+'</button><div class="card"><h2>'+(S.retry?'Retry results':'Results')+' — '+esc(set.name)+'</h2><p><b>'+r.length+'/'+L.length+'</b> correct ('+Math.round(100*r.length/L.length)+'%)</p>'
    +(S.retry&&S.score?'<p class="mu">Original score kept: '+S.score.c+'/'+S.score.t+'</p>':'')
    +'<p class="bad"><b>Wrong: '+w.length+'</b></p><ol>'+list(w)+'</ol><p class="mu"><b>Unanswered: '+u.length+'</b></p><ol>'+list(u)+'</ol>'
    +'<div class="row"><button id="rev">Review answers</button>'+(w.length+u.length?'<button id="rt" class="pri">Retry wrong &amp; unanswered</button>':'')+(S.retry?'<button id="ex">End retry</button>':'')+'</div></div>';
  app.innerHTML=h;back.onclick=home;rev.onclick=()=>{A.cur=0;save();render()};
  if(window.rt)rt.onclick=()=>{S.retry={ids:w.concat(u),mode:'study',ans:{},chk:{},cur:0,submitted:false};save();render()};
  if(window.ex)ex.onclick=()=>{S.retry=null;save();results()}}
const last=localStorage.getItem(LS+'last');
const all=D.chapters;
const li=all.findIndex(s=>s.key===last);
if(li>=0 && ready(all[li])){const pack=all[li];set=pack;S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render()}
else home();
</script></body></html>
