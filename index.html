*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--tx);line-height:1.5}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card)}
h1{font-size:1.05rem;margin:0}main{max-width:880px;margin:auto;padding:16px}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:8px 12px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:12px}.opt.sel{background:var(--sel);border-color:var(--ac)}
.opt.ok{border-color:var(--ok);box-shadow:inset 4px 0 var(--ok)}.opt.bad{border-color:var(--bad);box-shadow:inset 4px 0 var(--bad)}
.nav{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.nav button{width:38px;padding:6px 0}

.exp{border-left:4px solid var(--ac);padding:10px 12px;margin-top:12px;background:var(--bg);border-radius:6px}
.exp h4{margin:12px 0 4px;font-size:.92rem;color:var(--ac)}.exp h4:first-child{margin-top:0}.exp p{margin:4px 0}
.tag{display:inline-block;font-size:.75rem;border:1px solid var(--bd);border-radius:20px;padding:1px 8px;margin-right:6px;color:var(--mu)}
.badge{display:inline-block;font-size:.72rem;font-weight:600;background:var(--ac);color:#fff;border-radius:20px;padding:2px 8px;margin-right:6px}

.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu);font-size:.9rem}.ok{color:var(--ok)}.bad{color:var(--bad)}

.slide{margin:10px 0 14px}.slide img{width:100%;height:auto;border:1px solid var(--bd);border-radius:8px;cursor:zoom-in;display:block;background:#fff}.slide figcaption{font-size:.85rem;margin-top:4px;word-break:break-word}

m_phys-19","w11_pulm_phys-20","w11_pulm_phys-21","w11_pulm_phys-22","w11_pulm_phys-23","w11_pulm_phys-24","w11_pulm_phys-25","w11_pulm_phys-26","w11_pulm_phys-27","w11_pulm_phys-28","w11_pulm_phys-29","w11_pulm_phys-30"],"status":"ready"},{"key":"w11_cv_phys","week":11,"weekName":"Week 11","name":"Cardiovascular Physiology","prof":"Lancelot McLean, PhD","file":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf","nq":35,"ids":["w11_cv_phys-1","w11_cv_phys-2","w11_cv_phys-3","w11_cv_phys-4","w11_cv_phys-5","w11_cv_phys-6","w11_cv_phys-7","w11_cv_phys-8","w11_cv_phys-9","w11_cv_phys-10","w11_cv_phys-11","w11_cv_phys-12","w11_cv_phys-13","w11_cv_phys-14","w11_cv_phys-15","w11_cv_phys-16","w11_cv_phys-17","w11_cv_phys-18","w11_cv_phys-19","w11_cv_phys-20","w11_cv_phys-21","w11_cv_phys-22","w11_cv_phys-23","w11_cv_phys-24","w11_cv_phys-25","w11_cv_phys-26","w11_cv_phys-27","w11_cv_phys-28","w11_cv_phys-29","w11_cv_phys-30","w11_cv_phys-31","w11_cv_phys-32","w11_cv_phys-33","w11_cv_phys-34","w11_cv_phys-35"],"status":"ready"}],"q":{"w10_arm-1":{"q":"The superior lateral brachial cutaneous nerve, which supplies the upper lateral skin of the arm, is a branch of which nerve?","o":["Axillary nerve","Radial nerve","Medial cord of the brachial plexus","Musculocutaneous nerve","Ulnar nerve"],"a":0,"qk":"위팔 위가쪽 피부를 지배하는 위가쪽위팔피부신경(superior lateral brachial cutaneous nerve)은 어느 신경의 가지인가?","ok":["겨드랑신경(axillary nerve)","요골신경(radial nerve)","팔신경얼기 안쪽다발(medial cord)","근피신경(musculocutaneous nerve)","척골신경(ulnar nerve)"],"exp":"팔(arm, brachium)의 피부감각은 네 구역으로 나뉩니다.\n\n**위가쪽위팔피부신경(superior lateral brachial cutaneous nerve)**은 **겨드랑신경(axillary nerve)**의 가지로, 삼각근 부근을 포함한 위팔 위가쪽 피부를 지배합니다.\n\n아래가쪽은 아래가쪽위팔피부신경(inferior lateral brachial cutaneous nerve), 뒤쪽은 뒤위팔피부신경(posterior brachial cutaneous nerve)으로 둘 다 **요골신경(radial nerve)** 가지입니다. 안쪽은 팔신경얼기 **안쪽다발(medial cord)**에서 직접 나오는 안쪽위팔피부신경(medial brachial cutaneous nerve)이 담당합니다.\n\n겨드랑신경은 삼각근과 작은원근(teres minor)의 운동신경이기도 하므로, 어깨 탈구나 외과목 골절에서 위가쪽 피부감각 소실이 함께 나타날 수 있습니다.","why":{"1":"요골신경은 아래가쪽위팔피부신경과 뒤위팔피부신경을 내지만, 위가쪽 피부신경의 기시가 아닙니다.","2":"안쪽다발에서 직접 나오는 것은 안쪽위팔피부신경으로, 위팔의 안쪽 피부를 지배합니다.","3":"근피신경은 앞칸 세 굽힘근을 지배한 뒤 가쪽아래팔피부신경으로 끝나며, 위가쪽 위팔 피부를 지배하지 않습니다.","4":"척골신경은 위팔에서 피부가지를 내지 않으며, 위가쪽 위팔 피부와 무관합니다."},"one":"위가쪽 위팔 피부 = 겨드랑신경; 아래가쪽·뒤쪽 = 요골신경; 안쪽 = 안쪽다발.","src":"Arm and Forearm.pdf, slide 4","img":[{"u":"img/w10_arm/p04.webp","cap":"Arm and Forearm.pdf, slide 4"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-2":{"q":"The cephalic vein originates on the lateral dorsum of the hand, ascends in the deltopectoral groove, and typically terminates in the:","o":["Brachial vein","Axillary vein","Basilic vein","Subclavian vein","Internal jugular vein"],"a":1,"qk":"머리정맥(cephalic vein)은 손등 가쪽에서 시작하여 삼각근가슴홈(deltopectoral groove)을 지난 뒤, 대개 어디로 유입되는가?","ok":["위팔정맥(brachial vein)","겨드랑정맥(axillary vein)","바탕정맥(basilic vein)","빗장밑정맥(subclavian vein)","속목정맥(internal jugular vein)"],"exp":"얕은정맥(superficial vein)의 주행을 가쪽과 안쪽으로 나누어 기억합니다.\n\n**머리정맥(cephalic vein)**은 손등 가쪽 정맥그물에서 시작하여 아래팔·위팔의 가쪽을 올라가고, **삼각근가슴홈(deltopectoral groove)** 안에서 깊이 들어가 **겨드랑정맥(axillary vein)**으로 유입됩니다. 해부 표본에서도 이 홈 속의 머리정맥이 뚜렷이 확인됩니다.\n\n반면 **바탕정맥(basilic vein)**은 손등 안쪽에서 시작하여 위팔 아래·안쪽을 오른 뒤, 대개 위팔정맥(brachial vein, venae comitantes)과 합쳐져 겨드랑정맥을 만듭니다. 두 정맥은 팔꿉에서 정중팔꿉정맥(median cubital vein)으로 연결됩니다.","why":{"0":"위팔정맥은 바탕정맥이 합류하는 깊은정맥이며, 머리정맥의 종착지가 아닙니다.","2":"바탕정맥은 안쪽 얕은정맥으로, 머리정맥과 팔꿉에서 연결될 뿐 그 종착지가 아닙니다.","3":"빗장밑정맥은 겨드랑정맥의 근위 연속이지, 머리정맥이 직접 열리는 곳이 아닙니다.","4":"속목정맥은 목의 깊은정맥으로, 팔의 얕은정맥 경로와 무관합니다."},"one":"머리정맥은 삼각근가슴홈을 지나 겨드랑정맥으로 들어간다.","src":"Arm and Forearm.pdf, slide 5, 6","img":[{"u":"img/w10_arm/p05.webp","cap":"Arm and Forearm.pdf, slide 5"},{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-3":{"q":"When the usual pattern of superficial veins is present, the preferred site for venipuncture in the cubital fossa is the:","o":["Cephalic vein in the arm","Basilic vein in the arm","Median cubital vein","Deep brachial veins","Axillary vein"],"a":2,"qk":"흔한 얕은정맥 주행이 있을 때, 팔꿉오목(cubital fossa)에서 정맥천자(venipuncture)에 가장 흔히 선택되는 혈관은?","ok":["위팔의 머리정맥(cephalic vein)","위팔의 바탕정맥(basilic vein)","정중팔꿉정맥(median cubital vein)","깊은위팔정맥(deep brachial veins)","겨드랑정맥(axillary vein)"],"exp":"팔꿉오목은 혈관이 크고 피부 가까이 있어 **채혈, 수혈, 정맥주사**의 표준 부위입니다.\n\n가장 흔한 얕은정맥 배열에서는 가쪽의 머리정맥(cephalic vein)과 안쪽의 바탕정맥(basilic vein)을 잇는 **정중팔꿉정맥(median cubital vein)**이 선택됩니다. 이 정맥은 두드러지고 접근이 쉬우며, 해부 표본에서도 팔꿉 앞을 가로지르는 모습으로 확인됩니다.\n\n지붕을 이루는 두갈래근널힘줄(bicipital aponeurosis)이 그 아래의 위팔동맥(brachial artery)과 정중신경(median nerve)을 어느 정도 보호해 주므로, 표재 천자가 비교적 안전합니다. 다만 해부 변이가 있으므로 촉진과 시진으로 실제 주행을 확인해야 합니다.","why":{"0":"머리정맥도 쓰일 수 있으나, 흔한 배열에서 일차 선택 부위는 팔꿉의 정중팔꿉정맥입니다.","1":"바탕정맥은 안쪽에 있고 위팔동맥·정중신경에 더 가까워, 일차 선택 부위가 아닙니다.","3":"깊은위팔정맥은 동맥을 동행하는 깊은정맥으로, 피부 천자의 대상이 아닙니다.","4":"겨드랑정맥은 겨드랑이에 있어 일상 채혈 부위로 쓰지 않습니다."},"one":"팔꿉 채혈의 일차 선택 정맥은 정중팔꿉정맥이다.","src":"Arm and Forearm.pdf, slide 5, 6","img":[{"u":"img/w10_arm/p05.webp","cap":"Arm and Forearm.pdf, slide 5"},{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-4":{"q":"On a lateral dissection of the shoulder and arm, the cephalic vein is seen traveling within which interval?","o":["Quadrangular space","Triangular interval","Radial groove of the humerus","Deltopectoral groove","Cubital tunnel"],"a":3,"qk":"어깨·위팔의 가쪽 해부 표본에서, 머리정맥(cephalic vein)이 지나가는 간격은?","ok":["네모공간(quadrangular space)","세모간격(triangular interval)","위팔뼈의 요골고랑(radial groove)","삼각근가슴홈(deltopectoral groove)","팔꿉굴(cubital tunnel)"],"exp":"가쪽 어깨·위팔 해부 표본에서 **머리정맥(cephalic vein)**은 삼각근(deltoid)과 큰가슴근(pectoralis major) 사이, 즉 **삼각근가슴홈(deltopectoral groove)** 안에 명확히 놓여 있습니다. 이 홈의 위쪽 확대부를 삼각근가슴삼각(deltopectoral triangle)이라고 부르기도 합니다.\n\n같은 시야에서는 위가쪽·뒤위팔피부신경, 위팔세갈래근 가쪽갈래(lateral head of triceps), 위팔근(brachialis), 위팔두갈래근(biceps brachii), 요골신경(radial nerve), 그리고 팔꿉의 정중팔꿉정맥(median cubital vein)도 함께 표시됩니다.\n\n머리정맥의 ‘삼각근가슴홈 → 겨드랑정맥’ 경로를 표본 위치와 함께 기억하면, 중심정맥로 삽입이나 어깨 앞접근 수술에서 이 정맥을 이정표로 쓸 수 있습니다.","why":{"0":"네모공간은 겨드랑신경과 뒤쪽휘돌이동맥이 지나는 깊은 공간으로, 머리정맥의 경로가 아닙니다.","1":"세모간격은 요골신경과 깊은위팔동맥이 지나는, 뒤로 열린 간격입니다.","2":"요골고랑은 위팔뼈 뒤의 골성 고랑으로, 요골신경과 깊은위팔동맥이 지납니다.","4":"팔꿉굴은 안쪽위관절융기 뒤의 척골신경 통로이며, 가쪽 얕은정맥과 무관합니다."},"one":"표본에서 머리정맥은 삼각근과 큰가슴근 사이 홈을 지난다.","src":"Arm and Forearm.pdf, slide 6","img":[{"u":"img/w10_arm/p06.webp","cap":"Arm and Forearm.pdf, slide 6"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-5":{"q":"Which landmark of the distal humerus articulates with the head of the radius at the humeroradial joint?","o":["Trochlea","Olecranon fossa","Coronoid fossa","Medial epicondyle","Capitulum"],"a":4,"qk":"먼쪽 위팔뼈에서 위팔노관절(humeroradial joint)로 노뼈머리와 관절하는 구조는?","ok":["도르래(trochlea)","팔꿈치머리오목(olecranon fossa)","부리돌기오목(coronoid fossa)","안쪽위관절융기(medial epicondyle)","작은머리(capitulum)"],"exp":"먼쪽 위팔뼈의 관절융기는 안쪽과 가쪽으로 역할이 나뉩니다.\n\n**작은머리(capitulum)**는 **가쪽 관절융기**로, 노뼈머리(head of radius)와 만나 **위팔노관절(humeroradial joint)**을 이룹니다. 그 바로 위에는 굽힘 때 노뼈머리가 들어가는 노오목(radial fossa)이 있습니다.\n\n안쪽의 **도르래(trochlea)**는 자뼈의 도르래패임(trochlear notch)과 위팔자관절(humeroulnar joint)을 이루고, 그 위앞쪽에는 부리돌기오목(coronoid fossa), 뒤쪽에는 삼각형의 팔꿈치머리오목(olecranon fossa)이 있습니다. 안쪽위관절융기 뒤에는 척골신경이 지나는 자신경고랑(ulnar groove)이 있습니다.","why":{"0":"도르래는 안쪽 관절융기로, 자뼈의 도르래패임과 관절합니다.","1":"팔꿈치머리오목은 뒤쪽의 오목으로, 폄 때 팔꿈치머리(olecranon)가 들어갑니다.","2":"부리돌기오목은 도르래 위에 있으며, 굽힘 때 자뼈 부리돌기가 들어갑니다.","3":"안쪽위관절융기는 얕은앞칸 굽힘근의 이는곳이지, 노뼈머리와 관절하지 않습니다."},"one":"작은머리(가쪽)↔노뼈머리, 도르래(안쪽)↔자뼈 도르래패임.","src":"Arm and Forearm.pdf, slide 7","img":[{"u":"img/w10_arm/p07.webp","cap":"Arm and Forearm.pdf, slide 7"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-6":{"q":"Fractures of the humeral shaft and distal humerus are frequently associated with injury to which nerve?","o":["Radial nerve","Median nerve","Ulnar nerve","Axillary nerve","Musculocutaneous nerve"],"a":0,"qk":"위팔뼈 몸통 및 먼쪽 위팔뼈 골절에서 흔히 손상되는 신경은?","ok":["요골신경(radial nerve)","정중신경(median nerve)","척골신경(ulnar nerve)","겨드랑신경(axillary nerve)","근피신경(musculocutaneous nerve)"],"exp":"위팔뼈 골절의 신경 위험은 부위에 따라 다릅니다.\n\n**몸통과 먼쪽 위팔뼈 골절**은 **요골신경(radial nerve)** 손상과 자주 동반됩니다. 요골신경은 위팔뼈 뒤의 **요골고랑(radial groove)**을 깊은위팔동맥(deep brachial artery)과 함께 지나가므로, 몸통 골절이나 이 부위 압박에 취약합니다. 손상되면 손목처짐(wrist drop)과 손등 감각 이상이 나타날 수 있습니다.\n\n몸쪽 위팔뼈 골절은 나이 든 환자에서 팔을 뻗은 채 넘어지거나 어깨를 직접 부딪힌 뒤 흔하며, 관절외(extra-articular), 관절내(intra-articular), 분쇄(comminuted)로 나뉩니다. 관절외·관절내 골절은 위팔뼈머리를 공급하는 앞·뒤위팔휘돌이동맥(anterior and posterior circumflex humeral arteries) 손상으로 **무혈성괴사(avascular necrosis)**의 위험이 있습니다.","why":{"1":"정중신경은 위팔에서 가지를 내지 않고 안쪽으로 내려가며, 몸통 골절의 전형적 동반 손상이 아닙니다.","2":"척골신경은 안쪽위관절융기 뒤 자신경고랑에서 위험하나, 몸통·먼쪽 골절의 대표 신경은 요골신경입니다.","3":"겨드랑신경은 외과목(surgical neck) 주위 몸쪽 골절에서 위험합니다.","4":"근피신경은 부리위팔근을 뚫고 앞칸을 지나며, 몸통 골절의 전형적 손상 신경이 아닙니다."},"one":"위팔뼈 몸통·먼쪽 골절 → 요골신경; 외과목은 겨드랑신경, 근위 관절 골절은 무혈성괴사 위험.","src":"Arm and Forearm.pdf, slide 8","img":[{"u":"img/w10_arm/p08.webp","cap":"Arm and Forearm.pdf, slide 8"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-7":{"q":"Extra-articular and intra-articular fractures of the proximal humerus may lead to osteonecrosis of the humeral head by injuring the:","o":["Deep brachial and radial collateral arteries","Anterior and posterior circumflex humeral arteries","Thoracoacromial and lateral thoracic arteries","Superior and inferior ulnar collateral arteries","Radial and ulnar recurrent arteries"],"a":1,"qk":"몸쪽 위팔뼈의 관절외·관절내 골절이 위팔뼈머리 무혈성괴사(avascular necrosis)를 일으킬 수 있는 이유는, 어느 혈관 손상 때문인가?","ok":["깊은위팔동맥과 노측부동맥","앞·뒤위팔휘돌이동맥(anterior and posterior circumflex humeral arteries)","가슴봉우리동맥과 가쪽가슴동맥","위·아래자쪽측부동맥","노·자쪽되돌이동맥"],"exp":"몸쪽 위팔뼈 골절은 나이 든 환자에서 매우 흔하며, 팔을 뻗은 채 넘어지거나 어깨를 직접 부딪혀 발생합니다. 앞모습에서 **관절외(extra-articular)**, **관절내(intra-articular)**, **분쇄(comminuted)**의 세 유형으로 나눕니다.\n\n관절외·관절내 골절은 위팔뼈머리를 공급하는 **앞위팔휘돌이동맥(anterior circumflex humeral artery)**과 **뒤위팔휘돌이동맥(posterior circumflex humeral artery)** 손상을 자주 동반합니다. 이 혈관이 끊기면 뼈머리로 가는 혈류가 소실되어 **외상 후 무혈성괴사(post-traumatic avascular necrosis)**가 생길 수 있습니다.\n\n외과목(surgical neck)은 결절 아래의 흔한 골절 부위이고, 해부목(anatomical neck)은 뼈머리 가장자리에 있습니다. 관절내 골절은 해부목 쪽으로 골절선이 관절면을 침범합니다.","why":{"0":"깊은위팔동맥은 위팔 몸통에서 요골신경을 동행하며, 뼈머리의 주된 영양혈관이 아닙니다.","2":"가슴봉우리동맥과 가쪽가슴동맥은 겨드랑동맥의 가슴 쪽 가지로, 위팔뼈머리 혈류의 핵심이 아닙니다.","3":"위·아래자쪽측부동맥은 위팔동맥의 팔꿉 측부순환 가지입니다.","4":"노·자쪽되돌이동맥은 아래팔에서 올라와 팔꿉 그물을 이루는 혈관입니다."},"one":"근위 위팔뼈 관절외·관절내 골절은 앞·뒤위팔휘돌이동맥 손상으로 뼈머리 괴사 위험이 있다.","src":"Arm and Forearm.pdf, slide 8","img":[{"u":"img/w10_arm/p08.webp","cap":"Arm and Forearm.pdf, slide 8"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-8":{"q":"The medial and lateral intermuscular septa of the arm connect brachial fascia to the humerus and thereby divide the arm into:","o":["Superficial and deep fascial planes only","Medial and lateral neurovascular compartments","Anterior (flexor) and posterior (extensor) compartments","Proximal and distal muscular compartments","Cutaneous and subfascial compartments"],"a":2,"qk":"위팔의 안쪽·가쪽 근육사이막(intermuscular septa)이 위팔근막(brachial fascia)을 위팔뼈에 연결하여 만드는 구획은?","ok":["얕은층과 깊은층 근막면만이","안쪽·가쪽 혈관신경 구획","앞칸(굽힘칸)과 뒤칸(폄칸)","몸쪽·먼쪽 근육 구획","피부칸과 근막밑칸"],"exp":"**위팔근막(brachial fascia)**은 위팔 근육을 감싸는 깊은근막 ‘소매’로, 겨드랑근막·가슴근막과 연속되고 아래로는 위관절융기와 팔꿈치머리에 붙습니다.\n\n이 근막에서 위팔뼈로 이어지는 **안쪽·가쪽 근육사이막(medial and lateral intermuscular septa)**이 위팔을 **앞칸(anterior, flexor compartment)**과 **뒤칸(posterior, extensor compartment)**으로 나눕니다.\n\n앞칸에는 세 굽힘근과 근피신경이, 뒤칸에는 위팔세갈래근(과 주근)과 요골신경이 들어갑니다. 구획을 가르는 이 막은 근막공간증후군(compartment syndrome)이나 수술적 노출의 해부학적 경계이기도 합니다.","why":{"0":"위팔근막 자체는 근육을 감싸는 소매이지만, 앞·뒤칸을 나누는 것은 근육사이막입니다.","1":"혈관신경다발은 안쪽으로 주행하나, 근육사이막의 일차 역할은 앞·뒤칸 구분입니다.","3":"몸쪽·먼쪽은 해부 구역의 세로 구분일 뿐, 근육사이막이 만드는 구획이 아닙니다.","4":"피부감각 구역과 근막밑 공간을 나누는 구조가 아닙니다."},"one":"안쪽·가쪽 근육사이막이 위팔을 앞(굽힘)칸과 뒤(폄)칸으로 나눈다.","src":"Arm and Forearm.pdf, slide 9","img":[{"u":"img/w10_arm/p09.webp","cap":"Arm and Forearm.pdf, slide 9"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-9":{"q":"Which anterior compartment muscle of the arm is penetrated by the musculocutaneous nerve?","o":["Biceps brachii","Brachialis","Brachioradialis","Coracobrachialis","Anconeus"],"a":3,"qk":"위팔 앞칸에서 근피신경(musculocutaneous nerve)이 관통하고 지나가는 근육은?","ok":["위팔두갈래근(biceps brachii)","위팔근(brachialis)","위팔노근(brachioradialis)","부리위팔근(coracobrachialis)","주근(anconeus)"],"exp":"위팔 앞칸의 세 굽힘근은 모두 **근피신경(musculocutaneous nerve)**의 지배를 받습니다.\n\n이 신경은 가쪽다발에서 나온 뒤 **부리위팔근(coracobrachialis)**을 **관통**하고, 이후 위팔두갈래근(biceps brachii)과 위팔근(brachialis) 사이를 내려갑니다. 관통 여부는 수술 시야와 해부 표본에서 근피신경을 확인하는 핵심 이정표입니다.\n\n위팔두갈래근은 긴갈래·짧은갈래로 노뼈거친면(radial tuberosity)에 닿고, 위팔근은 아래팔의 주된 굽힘근으로 자뼈거친면(ulnar tuberosity)에 닿습니다. 부리위팔근은 주로 팔을 굽히고 모읍니다.","why":{"0":"위팔두갈래근은 근피신경이 그 깊은면에서 위팔근과의 사이를 지나지만, 관통 대상은 부리위팔근입니다.","1":"위팔근은 근피신경이 그 표면을 지나 운동가지를 줄 뿐, 관통되지 않습니다.","2":"위팔노근은 아래팔 뒤칸 얕은층 근육으로 요골신경 지배를 받습니다.","4":"주근은 뒤칸(또는 뒤아래팔)의 작은 폄근으로 요골신경 지배입니다."},"one":"근피신경은 부리위팔근을 뚫고, 두갈래근과 위팔근 사이로 내려간다.","src":"Arm and Forearm.pdf, slide 10, 15","img":[{"u":"img/w10_arm/p10.webp","cap":"Arm and Forearm.pdf, slide 10"},{"u":"img/w10_arm/p15.webp","cap":"Arm and Forearm.pdf, slide 15"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-10":{"q":"The primary flexor of the forearm, which inserts on the ulnar tuberosity, is the:","o":["Biceps brachii","Coracobrachialis","Brachioradialis","Pronator teres","Brachialis"],"a":4,"qk":"자뼈거친면(ulnar tuberosity)에 닿으며 아래팔을 굽히는 주된 근육은?","ok":["위팔두갈래근(biceps brachii)","부리위팔근(coracobrachialis)","위팔노근(brachioradialis)","원엎침근(pronator teres)","위팔근(brachialis)"],"exp":"아래팔 굽힘의 주동근을 구별하는 것이 중요합니다.\n\n**위팔근(brachialis)**이 **아래팔의 일차 굽힘근(primary flexor of the forearm)**이며, 닿는곳은 **자뼈거친면(tuberosity of the ulna)**입니다. 앞팔꿉의 바닥을 이루기도 합니다.\n\n위팔두갈래근은 노뼈거친면에 닿아 굽힘과 함께 **뒤침(supination)**에 강력히 기여하지만, 순수 굽힘의 주동근은 위팔근입니다. 부리위팔근은 주로 위팔(arm)을 굽히고, 위팔노근은 뒤칸 근육이면서 팔꿉 굽힘에 보조적으로 작용합니다.","why":{"0":"위팔두갈래근은 노뼈거친면에 닿고, 굽힘뿐 아니라 뒤침의 강력한 근육입니다.","1":"부리위팔근은 부리돌기에서 위팔뼈로 가서 팔(위팔)을 굽히고 모으며, 아래팔 굽힘의 주동근이 아닙니다.","2":"위팔노근은 뒤칸 근육으로 팔꿉 굽힘에 관여하지만, 일차 굽힘근이 아니고 자뼈거친면에 닿지 않습니다.","3":"원엎침근은 아래팔 앞칸 얕은층으로 엎침과 보조 굽힘을 하며, 일차 굽힘근이 아닙니다."},"one":"아래팔 굽힘의 주동근은 위팔근이며, 자뼈거친면에 닿는다.","src":"Arm and Forearm.pdf, slide 10","img":[{"u":"img/w10_arm/p10.webp","cap":"Arm and Forearm.pdf, slide 10"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-11":{"q":"After innervating the three anterior brachial flexors, the musculocutaneous nerve terminates as the:","o":["Lateral antebrachial cutaneous nerve","Posterior antebrachial cutaneous nerve","Medial antebrachial cutaneous nerve","Superficial branch of the radial nerve","Palmar cutaneous branch of the median nerve"],"a":0,"qk":"앞칸의 세 굽힘근을 지배한 뒤, 근피신경(musculocutaneous nerve)이 끝나는 가지는?","ok":["가쪽아래팔피부신경(lateral antebrachial cutaneous nerve)","뒤아래팔피부신경(posterior antebrachial cutaneous nerve)","안쪽아래팔피부신경(medial antebrachial cutaneous nerve)","요골신경 얕은가지(superficial branch of the radial nerve)","정중신경 손바닥피부가지"],"exp":"근피신경은 위팔 앞칸의 **유일한 운동신경**으로, 부리위팔근·위팔두갈래근·위팔근만을 지배합니다.\n\n이후 가쪽 아래팔로 나와 **가쪽아래팔피부신경(lateral antebrachial cutaneous nerve)**으로 끝납니다. 오른 아래팔 가쪽 표본에서 이 종말가지를 확인할 수 있습니다.\n\n아래팔 피부감각을 함께 정리하면, 가쪽은 근피신경의 이 종말가지, 안쪽은 팔신경얼기 **안쪽다발(medial cord)**에서 오는 안쪽아래팔피부신경(medial antebrachial cutaneous nerve), 뒤쪽은 **요골신경**의 뒤아래팔피부신경(posterior antebrachial cutaneous nerve)이 담당합니다.","why":{"1":"뒤아래팔피부신경은 요골신경의 가지로, 아래팔 뒤쪽 피부를 지배합니다.","2":"안쪽아래팔피부신경은 안쪽다발에서 나오며, 근피신경의 종말가지가 아닙니다.","3":"요골신경 얕은가지는 위팔노근 깊은곳으로 내려가 손등 가쪽 감각을 담당합니다.","4":"정중신경 손바닥피부가지는 손목굴 근위부에서 나와 손바닥 가쪽 피부를 지배합니다."},"one":"근피신경은 앞칸 세 근육만 지배한 뒤 가쪽아래팔피부신경으로 끝난다.","src":"Arm and Forearm.pdf, slide 11, 34","img":[{"u":"img/w10_arm/p11.webp","cap":"Arm and Forearm.pdf, slide 11"},{"u":"img/w10_arm/p34.webp","cap":"Arm and Forearm.pdf, slide 34"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-12":{"q":"The single dominant extensor of the posterior arm compartment, composed of long, lateral, and medial heads, is innervated by the:","o":["Axillary nerve","Radial nerve","Median nerve","Ulnar nerve","Musculocutaneous nerve"],"a":1,"qk":"긴갈래·가쪽갈래·안쪽갈래를 가진, 위팔 뒤칸의 주된 폄근을 지배하는 신경은?","ok":["겨드랑신경(axillary nerve)","요골신경(radial nerve)","정중신경(median nerve)","척골신경(ulnar nerve)","근피신경(musculocutaneous nerve)"],"exp":"위팔 근육은 ‘앞칸 굽힘근 셋, 뒤칸 주된 폄근 하나’로 정리합니다.\n\n뒤칸의 주된 폄근은 **위팔세갈래근(triceps brachii)**으로 긴갈래·가쪽갈래·안쪽갈래를 가지며, **요골신경(radial nerve)**의 지배를 받아 주로 아래팔을 폅니다. 일부 저자는 **주근(anconeus)**을 세갈래근의 일부로 보거나 뒤아래팔 근육과 함께 다루기도 합니다.\n\n요골신경은 위팔동맥의 뒤에서 팔로 들어가 요골고랑에서 깊은위팔동맥과 함께 주행하고, 아래팔로는 위팔근과 위팔노근 사이로 나갑니다.","why":{"0":"겨드랑신경은 삼각근과 작은원근을 지배하며, 세갈래근의 신경이 아닙니다.","2":"정중신경은 위팔에서 가지를 내지 않고, 뒤칸 폄근을 지배하지 않습니다.","3":"척골신경 역시 위팔에서 가지가 없으며, 세갈래근을 지배하지 않습니다.","4":"근피신경은 앞칸 세 굽힘근만 지배합니다."},"one":"위팔 뒤칸의 주된 폄근(세갈래근)은 요골신경 지배이다.","src":"Arm and Forearm.pdf, slide 12","img":[{"u":"img/w10_arm/p12.webp","cap":"Arm and Forearm.pdf, slide 12"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-13":{"q":"The brachial artery, a continuation of the axillary artery, begins at the lower border of which muscle?","o":["Pectoralis minor","Latissimus dorsi","Teres major","Teres minor","Subscapularis"],"a":2,"qk":"겨드랑동맥의 연속인 위팔동맥(brachial artery)이 시작되는 지점은 어느 근육의 아래 모서리인가?","ok":["작은가슴근(pectoralis minor)","넓은등근(latissimus dorsi)","큰원근(teres major)","작은원근(teres minor)","어깨밑근(subscapularis)"],"exp":"팔의 동맥 이름을 바꾸는 경계를 정확히 기억해야 합니다.\n\n**위팔동맥(brachial artery)**은 겨드랑동맥(axillary artery)의 연속으로, **큰원근(teres major)의 아래 모서리**에서 시작됩니다. 이후 팔꿉오목에서 **노뼈목(neck of the radius)** 높이로 내려가 노동맥과 자동맥으로 갈라지며 끝납니다.\n\n주요 가지는 깊은위팔동맥(deep brachial artery), 위자쪽측부동맥(superior ulnar collateral artery), 아래자쪽측부동맥(inferior ulnar collateral artery)입니다. 위팔정맥은 대개 두 개의 동행정맥(venae comitantes)이며, 바탕정맥과 합쳐져 겨드랑정맥을 이룹니다.","why":{"0":"작은가슴근은 겨드랑동맥을 1·2·3부로 나누는 이정표이지, 위팔동맥의 시작 경계가 아닙니다.","1":"넓은등근은 뒤겨드랑벽의 근육으로, 동맥 이름 변경의 표준 경계가 아닙니다.","3":"작은원근은 가쪽돌기의 가쪽회전근이며, 위팔동맥 기시와 무관합니다.","4":"어깨밑근은 겨드랑 앞을 지나지만, 위팔동맥의 시작 경계가 아닙니다."},"one":"위팔동맥은 큰원근 아래 모서리에서 시작되어 노뼈목 높이에서 갈라진다.","src":"Arm and Forearm.pdf, slide 13","img":[{"u":"img/w10_arm/p13.webp","cap":"Arm and Forearm.pdf, slide 13"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-14":{"q":"The brachial artery typically ends by bifurcating into the radial and ulnar arteries at the level of the:","o":["Surgical neck of the humerus","Medial epicondyle of the humerus","Olecranon fossa","Neck of the radius","Ulnar tuberosity alone"],"a":3,"qk":"위팔동맥이 노동맥과 자동맥으로 갈라지며 끝나는 높이는?","ok":["위팔뼈 외과목","위팔뼈 안쪽위관절융기","팔꿈치머리오목","노뼈목(neck of the radius)","자뼈거친면만"],"exp":"위팔동맥의 끝은 팔꿉오목 안에서 **노뼈목(neck of the radius)** 높이입니다. 이곳에서 **노동맥(radial artery)**과 **자동맥(ulnar artery)**으로 분지합니다.\n\n시작은 큰원근 아래 모서리, 끝은 노뼈목으로 짝지어 기억하면 동맥 전체를 한 줄로 그을 수 있습니다. 노동맥은 아래팔 가쪽을 달려 깊은손바닥활(deep palmar arch)로 끝나고, 자동맥은 안쪽으로 가며 온뼈사이동맥(common interosseous artery)을 내고 얕은손바닥활(superficial palmar arch)로 끝납니다.","why":{"0":"외과목은 겨드랑동맥·겨드랑신경과 관련된 몸쪽 위팔뼈 부위입니다.","1":"안쪽위관절융기는 척골신경이 뒤로 돌아가는 이정표이지, 위팔동맥 분지 높이가 아닙니다.","2":"팔꿈치머리오목은 위팔뼈 뒤의 골성 오목으로, 동맥 분지 기준으로 쓰이지 않습니다.","4":"자뼈거친면은 위팔근의 닿는곳이며, 분지의 표준 높이가 아닙니다."},"one":"위팔동맥은 팔꿉오목의 노뼈목 높이에서 노·자동맥으로 갈라진다.","src":"Arm and Forearm.pdf, slide 13, 32","img":[{"u":"img/w10_arm/p13.webp","cap":"Arm and Forearm.pdf, slide 13"},{"u":"img/w10_arm/p32.webp","cap":"Arm and Forearm.pdf, slide 32"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-15":{"q":"Which statement best describes the median and ulnar nerves as they descend through the arm?","o":["Both give motor branches to brachialis","Only the median nerve has motor branches in the arm","Only the ulnar nerve has motor branches in the arm","Both travel with the deep brachial artery","Neither nerve gives branches in the arm"],"a":4,"qk":"위팔을 내려가는 정중신경과 척골신경에 대한 설명으로 옳은 것은?","ok":["둘 다 위팔근에 운동가지를 낸다","위팔에서 운동가지를 내는 것은 정중신경뿐이다","위팔에서 운동가지를 내는 것은 척골신경뿐이다","둘 다 깊은위팔동맥과 함께 주행한다","두 신경 모두 위팔에서 가지를 내지 않는다"],"exp":"팔신경얼기의 다섯 종말가지 가운데 위팔에는 넷(근피, 요골, 정중, 척골)이 들어갑니다.\n\n**정중신경(median nerve)**과 **척골신경(ulnar nerve)**은 위팔에서 **가지를 내지 않습니다.** 둘 다 위팔혈관의 안쪽으로 나란히 내려가며, 운동가지와 피부가지는 팔꿉 이하에서 시작됩니다.\n\n반면 근피신경은 부리위팔근을 뚫고 앞칸 근육을 지배하고, 요골신경은 위팔동맥 뒤로 들어가 요골고랑에서 깊은위팔동맥과 함께 가며 세갈래근 등에 가지를 줍니다. 안쪽 위팔 표본에서 정중·척골신경이 가지 없이 혈관 안쪽으로 내려가는 모습을 확인할 수 있습니다.","why":{"0":"위팔근의 운동신경은 근피신경이며, 정중·척골신경은 위팔에서 가지가 없습니다.","1":"정중신경은 위팔에서 운동가지를 내지 않습니다.","2":"척골신경 역시 위팔에서 가지를 내지 않습니다.","3":"깊은위팔동맥과 함께 요골고랑을 지나는 것은 요골신경입니다."},"one":"정중신경과 척골신경은 위팔에서 가지가 없다.","src":"Arm and Forearm.pdf, slide 14, 15","img":[{"u":"img/w10_arm/p14.webp","cap":"Arm and Forearm.pdf, slide 14"},{"u":"img/w10_arm/p15.webp","cap":"Arm and Forearm.pdf, slide 15"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-16":{"q":"From lateral to medial, the contents of the cubital fossa are the:","o":["Biceps tendon, brachial artery, and median nerve","Median nerve, brachial artery, and biceps tendon","Brachial artery, biceps tendon, and median nerve","Radial nerve, brachial artery, and ulnar nerve","Biceps tendon, median nerve, and brachial artery"],"a":0,"qk":"팔꿉오목(cubital fossa)의 내용물을 가쪽에서 안쪽으로 나열하면?","ok":["두갈래근힘줄, 위팔동맥, 정중신경","정중신경, 위팔동맥, 두갈래근힘줄","위팔동맥, 두갈래근힘줄, 정중신경","요골신경, 위팔동맥, 척골신경","두갈래근힘줄, 정중신경, 위팔동맥"],"exp":"팔꿉오목은 두 아래팔뼈 사이 앞쪽의 삼각 함몰입니다. 내용물은 **가쪽 → 안쪽** 순서로 **두갈래근힘줄(tendon of biceps brachii) – 위팔동맥(brachial artery) – 정중신경(median nerve)**입니다. 영어 머리글자를 따 **TAN**(Tendon, Artery, Nerve)으로 외웁니다.\n\n경계는 밑변(base)이 두 위관절융기를 잇는 가상 수평선, 가쪽이 위팔노근(brachioradialis), 안쪽이 원엎침근(pronator teres), 지붕이 두갈래근널힘줄(bicipital aponeurosis)과 정중팔꿉정맥, 바닥이 위팔근과 뒤침근(supinator)입니다.\n\n척골신경은 안쪽위관절융기 뒤로 지나가 이 오목의 내용물이 아닙니다.","why":{"1":"순서가 완전히 반대입니다. 가쪽이 힘줄, 안쪽이 정중신경입니다.","2":"동맥이 가장 가쪽이 아닙니다. 가장 가쪽은 두갈래근힘줄입니다.","3":"척골신경은 안쪽위관절융기 뒤에 있고, 요골신경은 오목의 가쪽 가장자리를 스칠 수 있으나 TAN 세 구조가 표준 내용물입니다.","4":"정중신경과 위팔동맥의 안쪽·가쪽 관계가 뒤바뀌었습니다."},"one":"팔꿉오목 내용물(가쪽→안쪽): 힘줄–동맥–신경(TAN).","src":"Arm and Forearm.pdf, slide 16","img":[{"u":"img/w10_arm/p16.webp","cap":"Arm and Forearm.pdf, slide 16"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-17":{"q":"The lateral boundary of the cubital fossa is formed by which muscle?","o":["Pronator teres","Brachioradialis","Brachialis","Biceps brachii","Flexor carpi radialis"],"a":1,"qk":"팔꿉오목의 가쪽 경계를 이루는 근육은?","ok":["원엎침근(pronator teres)","위팔노근(brachioradialis)","위팔근(brachialis)","위팔두갈래근(biceps brachii)","노쪽손목굽힘근(flexor carpi radialis)"],"exp":"팔꿉오목의 경계를 내용물과 짝지어 기억합니다.\n\n**가쪽 경계**는 **위팔노근(brachioradialis)**이고, **안쪽 경계**는 **원엎침근(pronator teres)**입니다. 밑변은 두 위관절융기를 잇는 가상선, 지붕은 두갈래근널힘줄과 정중팔꿉정맥, 바닥은 위팔근과 뒤침근입니다.\n\n위팔노근은 뒤칸 얕은층에 속하면서 팔꿉 굽힘에 작용하고, 요골신경이 위팔근과 위팔노근 사이로 아래팔에 들어갑니다. 원엎침근의 두 갈래 사이로는 정중신경이 지나갑니다.","why":{"0":"원엎침근은 팔꿉오목의 안쪽 경계입니다.","2":"위팔근은 오목의 바닥을 이루는 근육 중 하나입니다.","3":"두갈래근의 힘줄은 오목의 내용물이지, 가쪽 벽 자체가 아닙니다.","4":"노쪽손목굽힘근은 아래팔 앞칸 얕은층으로, 오목의 가쪽 경계가 아닙니다."},"one":"팔꿉오목: 가쪽 위팔노근, 안쪽 원엎침근, 바닥 위팔근·뒤침근.","src":"Arm and Forearm.pdf, slide 16","img":[{"u":"img/w10_arm/p16.webp","cap":"Arm and Forearm.pdf, slide 16"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-18":{"q":"The proximal radioulnar joint is stabilized by which structure that cuffs the head of the radius?","o":["Ulnar collateral ligament","Radial collateral ligament","Anular ligament","Interosseous membrane alone","Bicipital aponeurosis"],"a":2,"qk":"몸쪽 노자관절(proximal radioulnar joint)에서 노뼈머리를 고리처럼 감싸 안정시키는 구조는?","ok":["척골측부인대(ulnar collateral ligament)","요골측부인대(radial collateral ligament)","윤상인대(anular ligament)","뼈사이막만(interosseous membrane)","두갈래근널힘줄(bicipital aponeurosis)"],"exp":"팔꿉복합체(elbow complex)는 복합 경첩관절로 세 관절이 한 피막 안에 있습니다.\n\n**몸쪽 노자관절**은 노뼈머리가 자뼈의 노패임(radial notch)에 들어가는 관절이며, **윤상인대(anular ligament)**가 노뼈머리를 **고리처럼 감싸(cuff)** 회전(엎침·뒤침) 중에도 머리가 빠지지 않게 합니다. 가쪽 팔꿉 표본에서 요골측부인대와 함께 윤상인대를 볼 수 있습니다.\n\n위팔자관절은 도르래와 도르래패임으로, 안쪽에서 **척골측부인대(UCL)**가 보강합니다. 위팔노관절은 작은머리와 노뼈머리로, 가쪽에서 **요골측부인대(RCL)**가 보강합니다.","why":{"0":"척골측부인대는 팔꿉 안쪽에서 위팔자관절을 보강합니다.","1":"요골측부인대는 팔꿉 가쪽에서 위팔노관절을 보강하지만, 노뼈머리를 고리로 감싸는 구조는 윤상인대입니다.","3":"뼈사이막은 노·자뼈 몸통을 이어 힘을 전달하지만, 노뼈머리를 감싸지는 않습니다.","4":"두갈래근널힘줄은 팔꿉오목의 지붕을 이루며, 몸쪽 노자관절의 안정 구조가 아닙니다."},"one":"노뼈머리는 윤상인대가 고리처럼 감싸 몸쪽 노자관절을 안정시킨다.","src":"Arm and Forearm.pdf, slide 17, 20","img":[{"u":"img/w10_arm/p17.webp","cap":"Arm and Forearm.pdf, slide 17"},{"u":"img/w10_arm/p20.webp","cap":"Arm and Forearm.pdf, slide 20"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-19":{"q":"Reconstruction of a torn elbow ulnar collateral ligament (the “Tommy John” procedure) most commonly uses an autologous graft of the:","o":["Flexor carpi radialis tendon","Extensor indicis tendon","Palmaris brevis muscle","Palmaris longus tendon","Flexor carpi ulnaris tendon"],"a":3,"qk":"파열된 팔꿉 척골측부인대(UCL)를 재건하는 이른바 “Tommy John” 술식에서 가장 흔히 쓰는 자가 이식건은?","ok":["노쪽손목굽힘근 힘줄","집게폄근 힘줄","짧은손바닥근","긴손바닥근 힘줄(palmaris longus tendon)","자쪽손목굽힘근 힘줄"],"exp":"척골측부인대(ulnar collateral ligament, UCL)는 팔꿉 **안쪽**을 보강합니다. 야구 투구를 비롯한 던지기 동작(미식축구 패스, 창던지기, 수구)에서 파열·신연이 늘어나고 있습니다.\n\n재건술, 흔히 **Tommy John 술식**은 반대쪽 아래팔이나 다리에서 얻은 **자가 건(autologous tendon)**을 씁니다. 대표적인 공여건은 **긴손바닥근(palmaris longus)** 또는 발바닥근(plantaris) 힘줄입니다. 10–15 cm 길이의 건을 안쪽위관절융기와 자뼈 부리돌기 가쪽에 뚫은 구멍으로 통과시켜 인대를 재건합니다.\n\n긴손바닥근은 약 13%에서 없을 수 있으므로, 수술 전 그 존재 여부를 확인합니다.","why":{"0":"노쪽손목굽힘근 힘줄은 표준 Tommy John 공여건이 아닙니다.","1":"집게폄근은 아래팔 뒤칸 깊은층 근육으로, 이 술식의 전형적 공여건이 아닙니다.","2":"짧은손바닥근은 새끼두덩을 덮는 얇은 손 자체근으로, 이식건으로 쓰지 않습니다.","4":"자쪽손목굽힘근은 척골신경을 두 갈래 사이로 통과시키는 근육이며, 표준 공여건이 아닙니다."},"one":"팔꿉 UCL 재건(Tommy John)의 대표 공여건은 긴손바닥근(또는 발바닥근) 힘줄이다.","src":"Arm and Forearm.pdf, slide 18, 19","img":[{"u":"img/w10_arm/p18.webp","cap":"Arm and Forearm.pdf, slide 18"},{"u":"img/w10_arm/p19.webp","cap":"Arm and Forearm.pdf, slide 19"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-20":{"q":"The humeroradial joint, between the capitulum and the radial head, is strengthened on its lateral side by the:","o":["Ulnar collateral ligament","Anular ligament alone","Quadrate ligament","Interosseous membrane","Radial collateral ligament"],"a":4,"qk":"작은머리와 노뼈머리 사이의 위팔노관절을 가쪽에서 보강하는 인대는?","ok":["척골측부인대","윤상인대만","네모인대(quadrate ligament)","뼈사이막","요골측부인대(radial collateral ligament)"],"exp":"팔꿉 가쪽을 보강하는 인대를 안쪽 UCL과 구별해야 합니다.\n\n**위팔노관절(humeroradial joint)**은 작은머리(capitulum)와 노뼈머리의 관절이며, **가쪽**에서 **요골측부인대(radial collateral ligament, RCL)**가 보강합니다. 같은 가쪽 시야에서 노뼈머리를 고리처럼 감싸는 **윤상인대(anular ligament)**도 함께 보입니다. 윤상인대는 몸쪽 노자관절의 안정 구조이고, RCL은 위팔노관절의 가쪽 보강 인대입니다.\n\n안쪽은 척골측부인대(UCL)가 위팔자관절을 보강하며, 이 인대의 파열이 Tommy John 재건의 대상입니다.","why":{"0":"척골측부인대는 팔꿉 안쪽에서 위팔자관절을 보강합니다.","1":"윤상인대는 노뼈머리를 감싸 몸쪽 노자관절을 안정시키지만, 위팔노관절의 가쪽 보강 인대는 RCL입니다.","2":"네모인대는 몸쪽 노자관절 주위의 작은 인대로, 위팔노관절의 주된 가쪽 보강 구조로 제시되지 않습니다.","3":"뼈사이막은 아래팔 두 뼈 몸통을 잇는 막입니다."},"one":"위팔노관절의 가쪽 보강은 요골측부인대, 노뼈머리의 고리는 윤상인대이다.","src":"Arm and Forearm.pdf, slide 17, 20","img":[{"u":"img/w10_arm/p17.webp","cap":"Arm and Forearm.pdf, slide 17"},{"u":"img/w10_arm/p20.webp","cap":"Arm and Forearm.pdf, slide 20"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-21":{"q":"Compared with the ulna, the radius of the forearm is:","o":["The shorter, lateral bone","The longer, medial bone","The shorter, medial bone","The longer, lateral bone","Equal in length and medial in position"],"a":0,"qk":"자뼈(ulna)와 비교할 때, 아래팔의 노뼈(radius)는 어떤 뼈인가?","ok":["더 짧고 가쪽에 있는 뼈","더 길고 안쪽에 있는 뼈","더 짧고 안쪽에 있는 뼈","더 길고 가쪽에 있는 뼈","길이가 같고 안쪽에 있는 뼈"],"exp":"아래팔(antebrachium)은 **노뼈(radius)**와 **자뼈(ulna)** 두 뼈로 구성됩니다.\n\n**노뼈는 더 짧고 가쪽**의 뼈입니다. 몸쪽에는 오목(fovea)이 있는 머리, 목, 노뼈거친면(radial tuberosity)이 있고, 몸통에는 뼈사이모서리(interosseous border), 먼쪽에는 붓돌기(styloid process), 자패임(ulnar notch), 등쪽결절(dorsal tubercle, Lister's tubercle)이 있습니다.\n\n**자뼈는 더 길고 안쪽**의 뼈입니다. 몸쪽에는 팔꿈치머리(olecranon), 도르래패임, 부리돌기, 자뼈거친면, 노패임, 뒤침근능선·오목이 있고, 먼쪽에는 머리와 붓돌기가 있습니다. 손목에서는 노뼈가 주된 관절면을 이루므로, 손에서 전달된 힘은 노뼈로 들어온 뒤 뼈사이막을 통해 자뼈로 넘어갑니다.","why":{"1":"더 길고 안쪽인 뼈는 자뼈입니다.","2":"노뼈는 짧지만 가쪽에 있으며, 안쪽은 자뼈입니다.","3":"노뼈는 가쪽이 맞으나 자뼈보다 깁지 않습니다.","4":"두 뼈의 길이는 같지 않고, 안쪽은 자뼈입니다."},"one":"노뼈는 짧고 가쪽, 자뼈는 길고 안쪽이다.","src":"Arm and Forearm.pdf, slide 22","img":[{"u":"img/w10_arm/p22.webp","cap":"Arm and Forearm.pdf, slide 22"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-22":{"q":"A principal function of the interosseous membrane of the forearm is that it:","o":["Allows independent rotation of the humerus","Transmits forces from the radius to the ulna","Transmits forces from the ulna to the radius","Separates the flexor and extensor retinacula","Forms the floor of the cubital fossa"],"a":1,"qk":"아래팔 뼈사이막(interosseous membrane)의 핵심 기능은?","ok":["위팔뼈의 독립적 회전을 허용한다","노뼈에서 자뼈로 힘을 전달한다","자뼈에서 노뼈로 힘을 전달한다","굽힘근지지띠와 폄근지지띠를 분리한다","팔꿉오목의 바닥을 이룬다"],"exp":"**뼈사이막(interosseous membrane)**은 노뼈와 자뼈의 뼈사이모서리를 잇는 섬유막입니다.\n\n기능은 두 뼈 사이의 **강도와 안정**을 주고, 근육의 이는곳이 되며, 특히 손에서 올라온 힘을 **노뼈에서 자뼈로 전달**하는 것입니다. 손목 관절면은 주로 노뼈이므로, 이 전달이 없으면 노뼈에만 과도한 부하가 걸립니다.\n\n막에는 두 개의 틈이 있습니다. **몸쪽 틈**으로는 뒤뼈사이혈관(posterior interosseous vessels)이, **먼쪽 구멍**으로는 앞뼈사이혈관(anterior interosseous vessels)의 종말부가 지나갑니다. 아래팔의 안쪽·가쪽 근육사이막과 함께 앞·뒤칸을 나누는 데에도 기여합니다.","why":{"0":"위팔뼈 회전은 어깨관절의 움직임이며, 뼈사이막의 기능이 아닙니다.","2":"힘의 주된 전달 방향은 노뼈 → 자뼈입니다. 반대 방향으로 기술하면 틀린 설명입니다.","3":"굽힘근·폄근지지띠는 손목의 두꺼운 근막이며, 뼈사이막이 둘을 가르지 않습니다.","4":"팔꿉오목의 바닥은 위팔근과 뒤침근입니다."},"one":"뼈사이막은 손에서 온 힘을 노뼈에서 자뼈로 전달하고, 안정과 근 이는곳을 제공한다.","src":"Arm and Forearm.pdf, slide 23","img":[{"u":"img/w10_arm/p23.webp","cap":"Arm and Forearm.pdf, slide 23"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-23":{"q":"The tendon of flexor carpi radialis is a useful surface guide to which artery in the distal forearm?","o":["Ulnar artery","Anterior interosseous artery","Radial artery","Common interosseous artery","Deep brachial artery"],"a":2,"qk":"먼쪽 아래팔에서 노쪽손목굽힘근(flexor carpi radialis) 힘줄이 이정표가 되는 동맥은?","ok":["자동맥(ulnar artery)","앞뼈사이동맥(anterior interosseous artery)","노동맥(radial artery)","온뼈사이동맥(common interosseous artery)","깊은위팔동맥(deep brachial artery)"],"exp":"아래팔 앞칸은 8개 근육으로, 대체로 손목·손가락 굽힘과 엎침을 하며, **8개 중 6½개**가 정중신경 지배입니다. 얕은층은 안쪽위관절융기 부위의 온굽힘근힘줄(common flexor tendon, CFT)에서 일어납니다.\n\n가쪽→안쪽 얕은층은 원엎침근(PT), **노쪽손목굽힘근(FCR)**, 긴손바닥근(PL), 자쪽손목굽힘근(FCU)입니다. FCR은 손허리뼈 2·3의 바닥에 닿고, 그 **힘줄은 노동맥(radial artery)을 찾는 이정표**로 쓰입니다. 손목 가쪽에서 FCR 힘줄의 바로 가쪽에 노동맥이 촉진됩니다.\n\n참고로 긴손바닥근은 약 13%에서 없을 수 있고, 척골신경은 FCU의 두 갈래 사이로 지나갑니다.","why":{"0":"자동맥은 아래팔 안쪽으로, 자쪽손목굽힘근 쪽에서 찾습니다.","1":"앞뼈사이동맥은 온뼈사이동맥의 가지로 뼈사이막 앞을 지나가며, FCR 힘줄로 표재 촉진하지 않습니다.","3":"온뼈사이동맥은 자동맥의 몸쪽 가지로, 깊은곳에 있습니다.","4":"깊은위팔동맥은 위팔에서 요골신경을 동행하는 혈관입니다."},"one":"FCR 힘줄은 먼쪽 아래팔에서 노동맥을 찾는 이정표이다.","src":"Arm and Forearm.pdf, slide 24","img":[{"u":"img/w10_arm/p24.webp","cap":"Arm and Forearm.pdf, slide 24"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-24":{"q":"After passing behind the medial epicondyle, the ulnar nerve enters the forearm by traveling between the two heads of:","o":["Pronator teres","Flexor digitorum superficialis","Flexor carpi radialis","Flexor carpi ulnaris","Palmaris longus"],"a":3,"qk":"안쪽위관절융기 뒤를 지난 척골신경이, 아래팔로 들어갈 때 두 갈래 사이로 지나가는 근육은?","ok":["원엎침근","얕은손가락굽힘근","노쪽손목굽힘근","자쪽손목굽힘근(flexor carpi ulnaris)","긴손바닥근"],"exp":"앞칸 얕은층 근육 가운데 **자쪽손목굽힘근(flexor carpi ulnaris, FCU)**은 위팔갈래가 온굽힘근힘줄에서 일어나고, **척골신경이 두 갈래 사이**를 지나 아래팔로 들어갑니다. FCU는 손허리뼈 5의 바닥에 닿습니다.\n\n이와 짝을 이뤄, **정중신경**은 **원엎침근(pronator teres)**의 두 갈래 사이로 들어갑니다. 두 ‘두 갈래 사이’ 통로를 혼동하지 않도록 신경과 근육을 고정해 두어야 합니다.\n\n척골신경은 아래팔에서 FCU와 깊은손가락굽힘근의 안쪽 ½만 지배하고(1½개), 나머지는 정중신경 영역입니다.","why":{"0":"원엎침근의 두 갈래 사이로 들어가는 것은 정중신경입니다.","1":"얕은손가락굽힘근도 위팔자갈래와 노갈래가 있으나, 척골신경이 아래팔로 들어가는 표준 통로는 FCU의 두 갈래 사이입니다.","2":"노쪽손목굽힘근은 노동맥의 이정표이며, 척골신경 통로가 아닙니다.","4":"긴손바닥근은 손바닥널힘줄로 이어지는 얕은층 근육으로, 척골신경을 통과시키지 않습니다."},"one":"척골신경은 FCU 두 갈래 사이, 정중신경은 원엎침근 두 갈래 사이로 들어간다.","src":"Arm and Forearm.pdf, slide 24, 33","img":[{"u":"img/w10_arm/p24.webp","cap":"Arm and Forearm.pdf, slide 24"},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-25":{"q":"Flexor digitorum profundus is innervated by the:","o":["Median nerve to both halves of the muscle","Ulnar nerve to both halves of the muscle","Radial nerve to both halves of the muscle","Anterior interosseous nerve alone","Median nerve radially and ulnar nerve ulnarly"],"a":4,"qk":"깊은손가락굽힘근(flexor digitorum profundus)의 신경지배는?","ok":["정중신경이 근육 전체를 지배한다","척골신경이 근육 전체를 지배한다","요골신경이 근육 전체를 지배한다","앞뼈사이신경만 지배한다","노쪽 ½는 정중신경, 자쪽 ½는 척골신경"],"exp":"앞칸 깊은층은 세 근육입니다. **깊은손가락굽힘근(FDP)**은 먼쪽손가락뼈 2–5의 바닥에 닿아 원위지절(DIP)을 굽히고, **긴엄지굽힘근(FPL)**은 먼쪽손가락뼈 1의 바닥에, **네모엎침근(pronator quadratus)**은 자뼈에서 노뼈로 가로 주행합니다.\n\nFDP의 신경은 이례적으로 **이중 지배**입니다. **노쪽 ½(집게·가운데)**는 **정중신경**, **자쪽 ½(약지·새끼)**는 **척골신경**입니다. 이 때문에 앞칸 8개 중 정중신경이 6½, 척골신경이 1½(FCU + FDP 안쪽 ½)가 됩니다.\n\n정중신경의 깊은가지인 앞뼈사이신경(AIN)은 긴엄지굽힘근과 네모엎침근을 지배합니다. FDS는 갈라진 힘줄로 중간손가락뼈 2–5에 닿아 PIP를 굽힙니다.","why":{"0":"정중신경은 FDP의 노쪽 ½만 지배합니다. 자쪽 ½는 척골신경입니다.","1":"척골신경은 FDP의 자쪽 ½와 FCU만 지배합니다.","2":"요골신경은 뒤칸 근육을 지배하며, FDP와 무관합니다.","3":"앞뼈사이신경은 긴엄지굽힘근과 네모엎침근을 지배하며, FDP 전체의 유일한 신경이 아닙니다."},"one":"FDP는 노쪽 ½ 정중신경, 자쪽 ½ 척골신경의 이중 지배이다.","src":"Arm and Forearm.pdf, slide 26, 33","img":[{"u":"img/w10_arm/p26.webp","cap":"Arm and Forearm.pdf, slide 26"},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-26":{"q":"All 11 muscles of the posterior compartment of the forearm are innervated by the:","o":["Radial nerve","Median nerve","Ulnar nerve","Musculocutaneous nerve","Axillary nerve"],"a":0,"qk":"아래팔 뒤칸의 근육 11개를 모두 지배하는 신경은?","ok":["요골신경(radial nerve)","정중신경(median nerve)","척골신경(ulnar nerve)","근피신경(musculocutaneous nerve)","겨드랑신경(axillary nerve)"],"exp":"아래팔 뒤칸은 **11개 근육**으로, 대체로 손목·손가락 폄과 뒤침을 하며 **전부가 요골신경(radial nerve)** 지배입니다. 얕은층은 가쪽위관절융기 부위의 온폄근힘줄(common extensor tendon, CET)에서 일어납니다.\n\n얕은층 여섯은 위팔노근(BR), 긴노쪽손목폄근(ECRL), 짧은노쪽손목폄근(ECRB, CET 기시 시작), 손가락폄근(ED, 폄근확장으로 닿음), 새끼폄근(EDM), 자쪽손목폄근(ECU, 자쪽 치우침)입니다. 위팔노근만은 손목 폄이 아니라 **팔꿉 굽힘**에 작용합니다.\n\n요골신경은 가쪽위관절융기 앞에서 근육가지를 BR과 ECRL에 주고, 얕은가지는 위팔노근 깊은곳으로, 깊은가지는 나머지 얕은 네 근육과 깊은 다섯 근육을 지배합니다.","why":{"1":"정중신경은 앞칸 6½개 근육을 지배하며, 뒤칸 전체가 아닙니다.","2":"척골신경은 앞칸의 FCU와 FDP 안쪽 ½만 지배합니다.","3":"근피신경은 위팔 앞칸 세 근육과 가쪽아래팔 피부만 담당합니다.","4":"겨드랑신경은 삼각근과 작은원근을 지배합니다."},"one":"아래팔 뒤칸 11개 근육은 모두 요골신경 지배이다.","src":"Arm and Forearm.pdf, slide 29, 33","img":[{"u":"img/w10_arm/p29.webp","cap":"Arm and Forearm.pdf, slide 29"},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-27":{"q":"Which muscle of the posterior forearm compartment functions primarily in elbow flexion rather than in wrist or digital extension?","o":["Extensor carpi radialis longus","Brachioradialis","Supinator","Extensor carpi ulnaris","Anconeus"],"a":1,"qk":"아래팔 뒤칸에 속하면서, 손목·손가락 폄이 아니라 주로 팔꿉 굽힘을 하는 근육은?","ok":["긴노쪽손목폄근","위팔노근(brachioradialis)","뒤침근","자쪽손목폄근","주근"],"exp":"뒤칸은 ‘폄과 뒤침’이 원칙이지만 예외가 있습니다.\n\n**위팔노근(brachioradialis)**은 뒤칸 얕은층의 첫 근육이지만, 기능은 **팔꿉 굽힘**입니다. 요골신경이 가쪽위관절융기 앞에서 이 근육과 ECRL에 근육가지를 줍니다. 위팔노근은 팔꿉오목의 가쪽 경계이기도 합니다.\n\n나머지 얕은층은 손목·손가락 폄(ED, EDM)이나 손목 폄·자쪽 치우침(ECU)을 하고, 뒤침근은 노뼈를 감싸며 뒤칩니다. ‘뒤칸 = 폄’이라는 도식에 위팔노근을 예외로 꼭 넣어야 합니다.","why":{"0":"긴노쪽손목폄근은 손목을 펴고 노쪽으로 치우치게 합니다.","2":"뒤침근은 노뼈를 감싸 아래팔을 뒤치는 깊은층 근육입니다.","3":"자쪽손목폄근은 손목을 펴고 자쪽 치우침(ulnar deviation)을 합니다.","4":"주근은 팔꿉 폄을 돕는 작은 근육으로, 굽힘근이 아닙니다."},"one":"위팔노근은 뒤칸 근육이지만 팔꿉을 굽힌다.","src":"Arm and Forearm.pdf, slide 29, 33","img":[{"u":"img/w10_arm/p29.webp","cap":"Arm and Forearm.pdf, slide 29"},{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-28":{"q":"Extensor pollicis longus inserts on the:","o":["Radial base of metacarpal 1","Base of proximal phalanx 1","Base of distal phalanx 1","Ulnar side of the extensor digitorum tendon to the index","Pisiform and hook of the hamate"],"a":2,"qk":"긴엄지폄근(extensor pollicis longus)의 닿는곳은?","ok":["첫째 손허리뼈의 노쪽 바닥","첫째 몸쪽손가락뼈의 바닥","첫째 먼쪽손가락뼈의 바닥","집게로 가는 손가락폄근 힘줄의 자쪽","콩알뼈와 갈고리뼈 갈고리"],"exp":"뒤칸 깊은층 다섯 근육의 닿는곳을 엄지 뼈마다 짝지으면 헷갈리지 않습니다.\n\n**긴엄지벌림근(APL)**은 첫째 손허리뼈의 노쪽 바닥, **짧은엄지폄근(EPB)**은 첫째 **몸쪽**손가락뼈의 바닥, **긴엄지폄근(EPL)**은 첫째 **먼쪽**손가락뼈의 바닥에 닿습니다. **집게폄근(EI)**은 둘째 손가락으로 가는 손가락폄근 힘줄의 자쪽에 합류하고, **뒤침근(supinator)**은 노뼈를 감쌉니다.\n\nEPL은 노뼈의 등쪽결절(Lister's tubercle)을 도르래로 꺾여 해부학 코담배갑(anatomical snuffbox)의 안쪽 경계를 이룹니다. 뒤칸을 자쪽손목폄근과 손가락폄근을 젖히고 보면 이 다섯 깊은근육과 뒤뼈사이신경(PIN)의 관계를 볼 수 있습니다.","why":{"0":"첫째 손허리뼈 노쪽 바닥에 닿는 것은 긴엄지벌림근(APL)입니다.","1":"첫째 몸쪽손가락뼈 바닥에 닿는 것은 짧은엄지폄근(EPB)입니다.","3":"손가락폄근 힘줄의 자쪽에 합류하는 것은 집게폄근(EI)입니다.","4":"콩알뼈와 갈고리뼈 갈고리는 굽힘근지지띠의 안쪽 붙음곳입니다."},"one":"엄지 깊은폄근: APL→MC1, EPB→PP1, EPL→DP1.","src":"Arm and Forearm.pdf, slide 30, 31","img":[{"u":"img/w10_arm/p30.webp","cap":"Arm and Forearm.pdf, slide 30"},{"u":"img/w10_arm/p31.webp","cap":"Arm and Forearm.pdf, slide 31"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-29":{"q":"In the forearm, the ulnar artery typically terminates by forming the:","o":["Deep palmar arch","Princeps pollicis artery","Radial recurrent artery","Superficial palmar arch","Posterior interosseous artery"],"a":3,"qk":"아래팔에서 자동맥(ulnar artery)이 끝나며 이루는 구조는?","ok":["깊은손바닥활(deep palmar arch)","엄지주요동맥(princeps pollicis artery)","노되돌이동맥(radial recurrent artery)","얕은손바닥활(superficial palmar arch)","뒤뼈사이동맥(posterior interosseous artery)"],"exp":"위팔동맥은 팔꿉오목의 노뼈목 높이에서 자동맥과 노동맥으로 갈라집니다.\n\n**자동맥**은 아래팔의 **안쪽** 동맥입니다. 몸쪽 가지로 앞·뒤자쪽되돌이동맥과 **온뼈사이동맥(common interosseous artery)**(앞·뒤뼈사이동맥으로 갈라짐)을 내고, 손에서는 **얕은손바닥활(superficial palmar arch)**로 끝납니다.\n\n**노동맥**은 아래팔의 **가쪽** 동맥으로, 노되돌이동맥과 엄지주요동맥(princeps pollicis) 등을 내고 **깊은손바닥활(deep palmar arch)**로 끝납니다. ‘자 = 얕은활, 노 = 깊은활’로 짝지으면 손목·손 혈류를 이어서 기억할 수 있습니다.","why":{"0":"깊은손바닥활은 노동맥이 끝나는 구조입니다.","1":"엄지주요동맥은 노동맥 계통의 가지입니다.","2":"노되돌이동맥은 노동맥의 몸쪽 가지입니다.","4":"뒤뼈사이동맥은 온뼈사이동맥(자동맥의 가지)에서 나오며, 자동맥의 종말이 아닙니다."},"one":"자동맥은 얕은손바닥활, 노동맥은 깊은손바닥활로 끝난다.","src":"Arm and Forearm.pdf, slide 32","img":[{"u":"img/w10_arm/p32.webp","cap":"Arm and Forearm.pdf, slide 32"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_arm-30":{"q":"Once the deep branch of the radial nerve has finished piercing the supinator muscle, it is often referred to as the:","o":["Anterior interosseous nerve","Superficial radial nerve","Recurrent branch of the median nerve","Lateral antebrachial cutaneous nerve","Posterior interosseous nerve"],"a":4,"qk":"요골신경 깊은가지가 뒤침근(supinator)을 완전히 뚫고 나온 뒤, 흔히 부르는 이름은?","ok":["앞뼈사이신경(AIN)","얕은요골신경","정중신경 되돌이가지","가쪽아래팔피부신경","뒤뼈사이신경(posterior interosseous nerve, PIN)"],"exp":"요골신경은 가쪽위관절융기 앞에서 갈라집니다. 근육가지는 위팔노근과 ECRL에 가고, **얕은가지**는 위팔노근 깊은곳으로 내려가 손목·손등을 지배합니다. **깊은가지**는 나머지 얕은 네 근육과 깊은 다섯 근육을 지배합니다(뒤칸 11개).\n\n깊은가지가 **뒤침근을 완전히 뚫고 나오면**, 일부에서 이를 **뒤뼈사이신경(posterior interosseous nerve, PIN)**이라고 부릅니다. 뒤칸 깊은 표본에서 PIN과 다섯 깊은근육의 관계를 볼 수 있습니다.\n\n이와 구별하여, 정중신경이 원엎침근 두 갈래 사이로 들어간 뒤 내는 깊은가지는 **앞뼈사이신경(AIN)**으로, 긴엄지굽힘근과 네모엎침근을 지배합니다.","why":{"0":"앞뼈사이신경(AIN)은 정중신경의 깊은가지입니다.","1":"얕은요골신경은 위팔노근 깊은곳으로 가는 감각가지로, 뒤침근을 뚫지 않습니다.","2":"정중신경 되돌이가지는 엄지두덩 근육을 지배하는 손의 가지입니다.","3":"가쪽아래팔피부신경은 근피신경의 종말가지입니다."},"one":"요골신경 깊은가지가 뒤침근을 뚫고 나오면 뒤뼈사이신경(PIN)이라고 부른다.","src":"Arm and Forearm.pdf, slide 33","img":[{"u":"img/w10_arm/p33.webp","cap":"Arm and Forearm.pdf, slide 33"}],"ch":"w10_arm","chn":"Arm and Forearm","week":10},"w10_wrist-1":{"q":"From lateral to medial, the four bones of the proximal carpal row are the:","o":["Scaphoid, lunate, triquetrum, and pisiform","Scaphoid, lunate, pisiform, and triquetrum","Trapezium, trapezoid, capitate, and hamate","Lunate, scaphoid, triquetrum, and pisiform","Scaphoid, capitate, lunate, and hamate"],"a":0,"qk":"몸쪽 손목뼈 줄(proximal carpal row)을 가쪽에서 안쪽으로 나열하면?","ok":["손배뼈, 반달뼈, 세모뼈, 콩알뼈","손배뼈, 반달뼈, 콩알뼈, 세모뼈","큰마름뼈, 작은마름뼈, 머리뼈, 갈고리뼈","반달뼈, 손배뼈, 세모뼈, 콩알뼈","손배뼈, 머리뼈, 반달뼈, 갈고리뼈"],"exp":"손목뼈(carpal bones)는 **두 줄, 각 네 개**로 배열됩니다.\n\n**몸쪽 줄**을 가쪽→안쪽으로 하면 **손배뼈(scaphoid, 결절 있음) – 반달뼈(lunate) – 세모뼈(triquetrum, triangular) – 콩알뼈(pisiform)**입니다. 먼쪽 줄은 **큰마름뼈(trapezium, 결절 있음) – 작은마름뼈(trapezoid) – 머리뼈(capitate) – 갈고리뼈(hamate, 갈고리 있음)**입니다.\n\n손배뼈와 큰마름뼈의 결절, 갈고리뼈의 갈고리는 굽힘근지지띠가 붙는 기둥(pillar)이 됩니다. 콩알뼈는 세모뼈 앞의 종자뼈로, 몸쪽 줄의 가장 안쪽·앞쪽에 있습니다.","why":{"1":"콩알뼈와 세모뼈의 순서가 바뀌었습니다. 세모뼈가 먼저이고, 콩알뼈가 가장 안쪽입니다.","2":"이 순서는 먼쪽 줄(가쪽→안쪽)입니다.","3":"손배뼈가 가장 가쪽이며, 반달뼈가 먼저 오지 않습니다.","4":"머리뼈는 먼쪽 줄의 뼈이며, 몸쪽 줄에 들어가지 않습니다."},"one":"몸쪽 줄(가쪽→안쪽): 손배–반달–세모–콩알뼈.","src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-2":{"q":"Which carpal bone is characterized by a hook on its palmar surface?","o":["Pisiform","Hamate","Capitate","Trapezium","Scaphoid"],"a":1,"qk":"손바닥면에 갈고리(hook)가 있는 손목뼈는?","ok":["콩알뼈(pisiform)","갈고리뼈(hamate)","머리뼈(capitate)","큰마름뼈(trapezium)","손배뼈(scaphoid)"],"exp":"손목뼈의 돌출 구조를 이름과 함께 구별합니다.\n\n**갈고리뼈(hamate)**는 손바닥쪽에 **갈고리(hook of hamate)**가 있습니다. 이 갈고리와 콩알뼈(pisiform)가 손목굴의 **안쪽 기둥(medial pillars)**이 됩니다.\n\n손배뼈와 큰마름뼈에는 각각 **결절(tubercle)**이 있어 손목굴의 **가쪽 기둥(lateral pillars)**을 이룹니다. 머리뼈는 먼쪽 줄에서 가장 큰 뼈이지만 갈고리는 없습니다. 갈고리뼈 갈고리 주위로는 자동맥이 휘어 얕은손바닥활을 만들고, 척골신경 깊은가지도 가까이 지나므로 갈고리 골절(또는 갈고리 주위 타격)에서 이 구조들이 위험합니다.","why":{"0":"콩알뼈는 종자뼈로 안쪽 기둥의 일부가 되지만, 갈고리를 가진 뼈는 아닙니다.","2":"머리뼈는 먼쪽 줄의 큰 뼈이며, 갈고리가 없습니다.","3":"큰마름뼈에는 결절이 있으며, 첫째 손허리뼈와 안장관절을 이룹니다.","4":"손배뼈에는 결절이 있고, 허리 골절 때 무혈성괴사 위험이 있습니다."},"one":"갈고리뼈의 갈고리와 콩알뼈가 손목굴의 안쪽 기둥이다.","src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-3":{"q":"The phalanges of one hand number 14 because the thumb lacks a:","o":["Proximal phalanx","Distal phalanx","Middle phalanx","Sesamoid bone at the MCP joint","Metacarpal bone"],"a":2,"qk":"한쪽 손의 손가락뼈(phalanges)가 14개인 이유는, 엄지에 없는 뼈가 무엇이기 때문인가?","ok":["몸쪽손가락뼈","먼쪽손가락뼈","중간손가락뼈(middle phalanx)","손허리손가락관절의 종자뼈","손허리뼈"],"exp":"한 손의 뼈는 손목뼈 8개, 손허리뼈 5개, **손가락뼈 14개**로 잡습니다.\n\n둘째–다섯째 손가락은 각각 **몸쪽·중간·먼쪽손가락뼈(PP, MP, DP)**를 가져 12개이고, **엄지(pollex)**는 **중간손가락뼈가 없어** 몸쪽·먼쪽만 있으므로 2개, 합쳐 14개입니다. 손허리뼈는 가쪽→안쪽 MC1–MC5이며, 손가락뼈와 별도로 셉니다.\n\n임상에서 DIP·PIP를 말할 때 엄지에는 PIP가 없고 하나의 지절간관절(IP)만 있다는 점이 바로 이 뼈 수와 대응합니다.","why":{"0":"엄지도 몸쪽손가락뼈를 가지고 있습니다.","1":"엄지도 먼쪽손가락뼈를 가지고 있습니다.","3":"종자뼈는 손가락뼈 14개의 계산에 들어가지 않으며, 엄지 MCP 앞에 흔히 있습니다.","4":"엄지에도 첫째 손허리뼈가 있으며, 손허리뼈는 5개로 따로 셉니다."},"one":"한 손 손가락뼈는 14개이며, 엄지에는 중간손가락뼈가 없다.","src":"Wrist & Hand 2.pdf, slide 5","img":[{"u":"img/w10_wrist/p05.webp","cap":"Wrist & Hand 2.pdf, slide 5"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-4":{"q":"The radiocarpal joint is formed by the distal radius and articular disc articulating with the:","o":["Scaphoid and lunate only","Distal row of carpal bones","Ulna, scaphoid, and capitate","Scaphoid, lunate, and triquetrum","Lunate, triquetrum, and pisiform"],"a":3,"qk":"노손목관절(radiocarpal joint)은 먼쪽 노뼈와 관절원반이 어느 뼈들과 만나 이루어지는가?","ok":["손배뼈와 반달뼈만","먼쪽 손목뼈 줄","자뼈, 손배뼈, 머리뼈","손배뼈, 반달뼈, 세모뼈","반달뼈, 세모뼈, 콩알뼈"],"exp":"손목복합체에서 먼쪽 노자관절은 자뼈머리와 노뼈의 자패임이 만나 이룹니다.\n\n**노손목관절(radiocarpal joint)**은 **먼쪽 노뼈와 관절원반(disc)**이 **손배뼈, 반달뼈, 세모뼈**와 관절하는 구조입니다. 콩알뼈는 이 관절에 직접 참여하지 않습니다. 이 관절에서 벌림·모음과 굽힘·폄이 일어납니다.\n\n관절주머니는 손바닥쪽 노손목·자손목인대, 등쪽 노손목인대, 노·자측부인대로 보강됩니다. 자뼈 자체는 원반을 사이에 두고 간접적으로만 관여하므로, ‘자뼈가 손목뼈와 직접 넓은 관절면을 이룬다’고 하면 틀린 설명이 됩니다.","why":{"0":"손배뼈와 반달뼈뿐 아니라 세모뼈도 관절원반을 매개로 이 관절에 참여합니다.","1":"먼쪽 줄은 주로 손목뼈사이·손목손허리관절에 관여합니다.","2":"자뼈는 원반을 사이에 두며, 머리뼈는 먼쪽 줄의 뼈입니다.","4":"콩알뼈는 세모뼈 앞의 종자뼈로, 노손목관절면에 들지 않습니다."},"one":"노손목관절 = 먼쪽 노뼈·원반 + 손배뼈·반달뼈·세모뼈.","src":"Wrist & Hand 2.pdf, slide 6","img":[{"u":"img/w10_wrist/p06.webp","cap":"Wrist & Hand 2.pdf, slide 6"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-5":{"q":"The highly mobile first carpometacarpal joint, which permits flexion, extension, abduction, adduction, and rotation or circumduction, is between:","o":["Metacarpal 1 and the scaphoid","Metacarpal 1 and the trapezoid","Metacarpal 1 and the capitate","Metacarpal 2 and the trapezium","Metacarpal 1 and the trapezium"],"a":4,"qk":"굽힘·폄, 벌림·모음, 회전·휘돌림이 가능한 가동성 큰 첫째 손목손허리관절(CMC I)은 어느 뼈 사이인가?","ok":["첫째 손허리뼈와 손배뼈","첫째 손허리뼈와 작은마름뼈","첫째 손허리뼈와 머리뼈","둘째 손허리뼈와 큰마름뼈","첫째 손허리뼈와 큰마름뼈(trapezium)"],"exp":"손목손허리관절(CMC)의 가동성은 손가락마다 크게 다릅니다.\n\n**CMC I**은 **첫째 손허리뼈와 큰마름뼈(trapezium)** 사이의 **안장관절**로, 굽힘·폄, 벌림·모음, 회전·휘돌림이 가능하여 엄지 마주섬(opposition)의 핵심입니다. 이와 달리 **CMC II–V**는 가동성이 훨씬 작습니다.\n\n손허리손가락관절(MCP)은 손바닥인대와 안쪽·가쪽 측부인대로 보강되고, 세 개의 깊은손허리가로인대(deep transverse metacarpal ligaments)가 손바닥인대를 서로 잇습니다. 지절간관절(PIP, DIP)은 굽힘·폄만 가능한 경첩관절이며 안쪽·가쪽 측부인대로 보강됩니다.","why":{"0":"손배뼈는 몸쪽 줄의 가쪽 뼈로, 첫째 손허리뼈와 직접 CMC를 이루지 않습니다.","1":"작은마름뼈는 주로 둘째 손허리뼈와 관련됩니다.","2":"머리뼈는 주로 셋째 손허리뼈와 관련됩니다.","3":"큰마름뼈와 관절하는 것은 첫째 손허리뼈이며, 둘째가 아닙니다."},"one":"CMC I은 첫째 손허리뼈와 큰마름뼈 사이의 가동성 큰 안장관절이다.","src":"Wrist & Hand 2.pdf, slide 7","img":[{"u":"img/w10_wrist/p07.webp","cap":"Wrist & Hand 2.pdf, slide 7"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-6":{"q":"The interphalangeal joints of the fingers are best classified as:","o":["Hinge joints that permit flexion and extension","Ball-and-socket joints that permit circumduction","Plane joints with essentially no motion","Pivot joints specializing in rotation","Saddle joints like the first CMC joint"],"a":0,"qk":"손가락 지절간관절(interphalangeal joints)의 분류로 가장 알맞은 것은?","ok":["굽힘·폄이 가능한 경첩관절","휘돌림이 가능한 구관절","움직임이 거의 없는 평면관절","회전에 특화된 중쇠관절","첫째 CMC와 같은 안장관절"],"exp":"손가락 관절의 형태와 허용 운동을 구별합니다.\n\n**지절간관절(PIP와 DIP)**은 **경첩관절(hinge joints)**로, 운동은 **굽힘과 폄**입니다. 안쪽·가쪽 **측부인대(collateral ligaments)**가 보강하여 곁으로 흔들리지 않게 합니다. 엄지는 중간손가락뼈가 없으므로 하나의 IP 관절만 있습니다.\n\nMCP는 손바닥인대와 측부인대로 보강되고, 세 개의 깊은손허리가로인대가 손바닥인대를 연결합니다. CMC I만 안장관절로 다양한 운동이 가능하고, CMC II–V는 가동성이 작습니다.","why":{"1":"구관절은 어깨처럼 여러 축의 운동이 가능하며, IP 관절의 형태가 아닙니다.","2":"평면관절은 손목뼈 사이 일부에 가깝고, IP는 분명한 굽힘·폄이 있습니다.","3":"중쇠관절의 예는 몸쪽 노자관절이며, IP의 주된 운동은 회전이 아닙니다.","4":"안장관절은 첫째 CMC(큰마름뼈–MC1)입니다."},"one":"PIP·DIP는 굽힘·폄만 하는 경첩관절이고, 측부인대가 보강한다.","src":"Wrist & Hand 2.pdf, slide 7","img":[{"u":"img/w10_wrist/p07.webp","cap":"Wrist & Hand 2.pdf, slide 7"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-7":{"q":"Medially, the flexor retinaculum of the wrist attaches to the:","o":["Scaphoid and trapezium","Pisiform and hook of the hamate","Radial styloid and dorsal tubercle","Ulnar styloid and triquetrum only","Capitate and lunate"],"a":1,"qk":"손목 굽힘근지지띠(flexor retinaculum)의 안쪽 붙음곳은?","ok":["손배뼈와 큰마름뼈","콩알뼈와 갈고리뼈의 갈고리","노뼈 붓돌기와 등쪽결절","자뼈 붓돌기와 세모뼈만","머리뼈와 반달뼈"],"exp":"**굽힘근지지띠(flexor retinaculum)**는 아래팔근막과 연속되지만 더 두꺼운 띠입니다.\n\n**안쪽**으로는 **콩알뼈와 갈고리뼈의 갈고리**, **가쪽**으로는 **손배뼈와 큰마름뼈**(각각의 결절)에 붙습니다. 이 붙음곳이 곧 손목굴의 안쪽·가쪽 기둥입니다. 지지띠는 굽힘근 힘줄이 활줄처럼 뜨는 것(bow-stringing)을 막습니다.\n\n**폄근지지띠(extensor retinaculum)**도 아래팔근막의 연속이며, 노뼈 먼쪽 앞모서리와 자뼈 붓돌기에 붙어 등쪽 폄근 힘줄을 눌러 줍니다.","why":{"0":"손배뼈와 큰마름뼈는 굽힘근지지띠의 가쪽 붙음곳입니다.","2":"노뼈 먼쪽 앞모서리와 자뼈 붓돌기는 폄근지지띠의 붙음곳입니다.","3":"자뼈 붓돌기는 폄근지지띠 쪽에 가깝고, 굽힘근지지띠의 안쪽 붙음곳은 콩알뼈와 갈고리입니다.","4":"머리뼈와 반달뼈는 지지띠의 내·외측 기둥이 아닙니다."},"one":"굽힘근지지띠: 안쪽 콩알뼈·갈고리, 가쪽 손배뼈·큰마름뼈 결절.","src":"Wrist & Hand 2.pdf, slide 8, 10","img":[{"u":"img/w10_wrist/p08.webp","cap":"Wrist & Hand 2.pdf, slide 8"},{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-8":{"q":"The extensor retinaculum attaches to the distal anterior border of the radius and to the:","o":["Pisiform and hook of the hamate","Tubercles of the scaphoid and trapezium","Styloid process of the ulna","Hook of the hamate and palmar aponeurosis","Common flexor tendon at the medial epicondyle"],"a":2,"qk":"폄근지지띠(extensor retinaculum)는 노뼈 먼쪽 앞모서리와 어디에 붙는가?","ok":["콩알뼈와 갈고리뼈 갈고리","손배뼈와 큰마름뼈의 결절","자뼈의 붓돌기(styloid process of the ulna)","갈고리뼈 갈고리와 손바닥널힘줄","안쪽위관절융기의 온굽힘근힘줄"],"exp":"손목 등쪽의 힘줄을 붙잡아 주는 것은 **폄근지지띠(extensor retinaculum)**입니다. 아래팔근막과 연속되며, **노뼈 먼쪽 앞모서리**와 **자뼈 붓돌기**에 붙습니다.\n\n이 띠 깊은곳에는 가쪽에서 안쪽으로 여섯 개의 폄근 힘줄 구획이 있습니다. 첫째 구획(가장 가쪽)에는 긴엄지벌림근(APL)과 짧은엄지폄근(EPB)이 있어, 이 부위의 협착이 De Quervain병의 해부학적 바탕입니다.\n\n굽힘근지지띠와 붙음곳을 혼동하지 않도록, 등쪽·자뼈 붓돌기 = 폄근지지띠, 손바닥·콩알뼈·갈고리 = 굽힘근지지띠로 구별합니다.","why":{"0":"콩알뼈와 갈고리는 굽힘근지지띠의 안쪽 붙음곳입니다.","1":"손배뼈·큰마름뼈 결절은 굽힘근지지띠의 가쪽 붙음곳입니다.","3":"갈고리와 손바닥널힘줄은 폄근지지띠의 붙음곳이 아닙니다.","4":"온굽힘근힘줄은 아래팔 앞칸 얕은층이 일어나는 팔꿉 구조입니다."},"one":"폄근지지띠는 노뼈 먼쪽 앞모서리와 자뼈 붓돌기에 붙는다.","src":"Wrist & Hand 2.pdf, slide 8","img":[{"u":"img/w10_wrist/p08.webp","cap":"Wrist & Hand 2.pdf, slide 8"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-9":{"q":"The first (most lateral) extensor compartment deep to the extensor retinaculum contains the tendons of:","o":["Extensor pollicis longus alone","Extensor carpi radialis longus and brevis","Extensor digitorum and extensor indicis","Abductor pollicis longus and extensor pollicis brevis","Extensor carpi ulnaris alone"],"a":3,"qk":"폄근지지띠 깊은곳의 첫째(가장 가쪽) 폄근 구획에 들어 있는 힘줄은?","ok":["긴엄지폄근만","긴·짧은노쪽손목폄근","손가락폄근과 집게폄근","긴엄지벌림근과 짧은엄지폄근(APL and EPB)","자쪽손목폄근만"],"exp":"폄근 힘줄은 폄근지지띠 아래에서 가쪽→안쪽 **여섯 구획**으로 나뉩니다. 가로단면 그림에서 가장 가쪽(L)이 1번입니다.\n\n**첫째 구획**에는 **긴엄지벌림근(APL)**과 **짧은엄지폄근(EPB)**이 있습니다. 이 두 힘줄이 노뼈 붓돌기 위를 지나가며, 이 구획의 협착이 요골 쪽 손목 통증의 흔한 원인입니다.\n\n넷째 구획에는 손가락폄근과 집게폄근, 다섯째에는 새끼폄근, 여섯째(가장 안쪽)에는 자쪽손목폄근이 있습니다. 둘째·셋째 구획은 노쪽손목폄근들과 긴엄지폄근이 차지하며, 그림의 번호와 힘줄 이름을 기준으로 구별합니다.","why":{"0":"긴엄지폄근은 첫째 구획이 아니라, 등쪽결절을 감아 돌아가는 더 안쪽 구획의 힘줄입니다.","1":"긴·짧은노쪽손목폄근은 첫째보다 안쪽의 구획에 있습니다.","2":"손가락폄근과 집게폄근은 넷째 구획의 내용입니다.","4":"자쪽손목폄근은 가장 안쪽인 여섯째 구획의 힘줄입니다."},"one":"가장 가쪽 첫째 폄근 구획 = APL + EPB.","src":"Wrist & Hand 2.pdf, slide 9","img":[{"u":"img/w10_wrist/p09.webp","cap":"Wrist & Hand 2.pdf, slide 9"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-10":{"q":"Carpal tunnel syndrome is usually produced by compression of the median nerve secondary to:","o":["Thrombosis of the ulnar artery in Guyon’s canal","Fracture of the ulnar styloid process","Tightness of the extensor retinaculum","Impingement of the radial nerve at the wrist","Inflammation of the synovial sheaths of the flexor tendons"],"a":4,"qk":"손목굴 증후군(carpal tunnel syndrome)에서 정중신경 압박의 흔한 선행 기전은?","ok":["기용 굴에서 자동맥 혈전","자뼈 붓돌기 골절","폄근지지띠의 조임","손목에서 요골신경의 끼임","굽힘근 힘줄 윤활막의 염증"],"exp":"**손목굴 증후군**은 손목굴 안에서 **정중신경**이 압박되어 생깁니다. 흔한 원인은 굽힘근 힘줄을 둘러싼 **윤활막(synovial sheath)의 염증**으로 굴 내부 압력이 오르는 것입니다. 과사용, 힘줄·윤활막 부종, 류마티스관절염, 손목관절에서 생긴 낭종 등도 압력을 높일 수 있습니다.\n\n높아진 압력은 정중신경 자체 모세혈관 내피의 정맥울혈과 무산소 손상을 일으킨다고 설명됩니다. 환자는 정중신경 영역의 통증과 저림을 호소하고, 엄지두덩 근력 저하·위축이 올 수 있습니다. 굽힘근지지띠 부위를 가볍게 두드리면 증상이 재현되는 것이 티넬 징후(Tinel's sign)입니다.\n\n초기 치료는 염증과 반복 자극을 줄이는 것이고, 호전이 없으면 신경전도검사 후 굽힘근지지띠를 열어 주는 감압술이 필요할 수 있습니다.","why":{"0":"기용 굴(Guyon’s canal)의 자동맥 병변은 척골신경·혈관 문제이며, 손목굴 안의 정중신경 압박이 아닙니다.","1":"자뼈 붓돌기 골절은 손목굴 증후군의 전형적 기전이 아닙니다.","2":"정중신경을 덮는 지붕은 굽힘근지지띠이며, 폄근지지띠가 아닙니다.","3":"요골신경 얕은가지는 손목 가쪽 등쪽을 지나며, 손목굴 안의 구조가 아닙니다."},"one":"손목굴 증후군은 대개 굽힘근 윤활막 염증으로 정중신경이 압박되어 생긴다.","src":"Wrist & Hand 2.pdf, slide 9, 11","img":[{"u":"img/w10_wrist/p09.webp","cap":"Wrist & Hand 2.pdf, slide 9"},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-11":{"q":"The lateral pillars of the carpal tunnel are the tubercles of the:","o":["Scaphoid and trapezium","Pisiform and hamate","Lunate and capitate","Trapezoid and capitate","Scaphoid and lunate"],"a":0,"qk":"손목굴(carpal tunnel)의 가쪽 기둥(lateral pillars)을 이루는 것은?","ok":["손배뼈와 큰마름뼈의 결절","콩알뼈와 갈고리뼈","반달뼈와 머리뼈","작은마름뼈와 머리뼈","손배뼈와 반달뼈"],"exp":"손목굴은 굽힘근지지띠 아래의 통로입니다.\n\n**가쪽 기둥**은 **손배뼈와 큰마름뼈의 결절**, **안쪽 기둥**은 **콩알뼈와 갈고리뼈의 갈고리**입니다. 몸쪽 단면에서는 콩알뼈·세모뼈·갈고리뼈·머리뼈·손배뼈가, 먼쪽 단면에서는 갈고리·머리뼈·작은마름뼈·큰마름뼈가 바닥을 이룹니다.\n\n내용물로 제시되는 것은 **정중신경**(가장 예민한 구조), **FPL·FDS·FDP 힘줄**, 그리고 **FCR 힘줄**입니다. FCR은 굽힘근지지띠의 따로 나뉜 통로(passage)를 지나며 ‘손목굴의 일부로 간주’됩니다. 척골신경과 자동맥은 안쪽에서 손목굴 밖(자쪽 굴, ulnar tunnel)에 있습니다.","why":{"1":"콩알뼈와 갈고리뼈는 안쪽 기둥입니다.","2":"반달뼈와 머리뼈는 굴의 바닥 일부를 이룰 수 있으나, 가쪽 기둥이 아닙니다.","3":"작은마름뼈와 머리뼈는 먼쪽 단면의 바닥이지, 가쪽 기둥이 아닙니다.","4":"반달뼈는 가쪽 기둥에 포함되지 않습니다."},"one":"손목굴 가쪽 기둥 = 손배뼈·큰마름뼈 결절, 안쪽 = 콩알뼈·갈고리.","src":"Wrist & Hand 2.pdf, slide 10","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-12":{"q":"The palmar aponeurosis is a thickening of the superficial layer of deep fascia of the hand and is continuous with the flexor retinaculum and the tendon of:","o":["Flexor carpi radialis","Palmaris longus","Flexor carpi ulnaris","Flexor digitorum superficialis","Abductor digiti minimi"],"a":1,"qk":"손바닥널힘줄(palmar aponeurosis)은 손 깊은근막 얕은층의 비후이며, 굽힘근지지띠와 어느 힘줄에 연속되는가?","ok":["노쪽손목굽힘근","긴손바닥근(palmaris longus)","자쪽손목굽힘근","얕은손가락굽힘근","새끼벌림근"],"exp":"**손바닥널힘줄(palmar aponeurosis)**은 손 깊은근막 얕은층이 두꺼워진 구조로, **긴손바닥근(palmaris longus) 힘줄** 및 **굽힘근지지띠**와 연속됩니다. 세로섬유가 넷째·다섯째 손가락 쪽으로 내려가고, 가로섬유가 이를 연결합니다. 짧은손바닥근(palmaris brevis)이 그 안쪽을 덮듯이 놓입니다.\n\n이 널힘줄의 세로띠가 두꺼워지고 짧아지며 피부에 유착되면 넷째·다섯째 손가락이 MCP와 PIP에서 부분 굽힘되는 **뒤퓌트랑 구축(Dupuytren contracture)**이 됩니다.\n\n긴손바닥근은 약 13%에서 없을 수 있으나, 없더라도 널힘줄 자체는 존재합니다.","why":{"0":"노쪽손목굽힘근 힘줄은 손목굴의 가쪽 통로로 지나가며, 널힘줄의 연속 구조가 아닙니다.","2":"자쪽손목굽힘근은 콩알뼈 쪽으로 닿고, 널힘줄의 근위 연속이 아닙니다.","3":"얕은손가락굽힘근 힘줄은 손목굴을 통과해 중간손가락뼈에 닿습니다.","4":"새끼벌림근은 새끼두덩 근육이며, 널힘줄의 연속 힘줄이 아닙니다."},"one":"손바닥널힘줄은 긴손바닥근 힘줄·굽힘근지지띠와 연속된다.","src":"Wrist & Hand 2.pdf, slide 10","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-13":{"q":"In a transverse section at the distal carpal row, which neurovascular pair lies outside the carpal tunnel on its ulnar side?","o":["Median nerve and flexor pollicis longus","Radial artery and flexor carpi radialis","Ulnar nerve and ulnar artery","Anterior interosseous nerve and artery","Superficial radial nerve and cephalic vein"],"a":2,"qk":"먼쪽 손목뼈 줄 높이의 가로단면에서, 손목굴 바깥 자쪽에 놓인 신경·혈관 쌍은?","ok":["정중신경과 긴엄지굽힘근","노동맥과 노쪽손목굽힘근","척골신경과 자동맥","앞뼈사이신경과 동맥","얕은요골신경과 머리정맥"],"exp":"손목 가로단면과 MRI에서 지붕인 굽힘근지지띠 아래로 정중신경과 긴 굽힘근 힘줄이 지나가고, 그 **자쪽 바깥**에는 **척골신경과 자동맥**이 따로 놓입니다. 이 통로가 자쪽 굴(ulnar tunnel, Guyon's canal)입니다.\n\n같은 단면에서 노동맥은 가쪽에, 긴손바닥근은 지지띠보다 얕은층에 있습니다. 따라서 손목굴 감압술은 정중신경을 풀기 위해 굽힘근지지띠를 열 뿐, 척골신경·자동맥은 원래 굴 밖에 있습니다.\n\n정중신경은 굴 안에서 가장 예민한 구조로, 압박 때 저림과 함께 엄지 마주섬 장애, 심한 경우 엄지두덩 위축과 엄지가 모이고 펴진 **원숭이손(simian hand)**이 나타날 수 있습니다.","why":{"0":"정중신경과 긴엄지굽힘근은 손목굴 안의 내용물입니다.","1":"노동맥과 FCR은 가쪽 구조이며, FCR은 따로 나뉜 통로를 지납니다. 자쪽 바깥 쌍이 아닙니다.","3":"앞뼈사이신경·동맥은 아래팔 깊은곳에서 뼈사이막 앞을 달립니다.","4":"얕은요골신경과 머리정맥은 손목 가쪽 등쪽에 가깝습니다."},"one":"척골신경과 자동맥은 손목굴 밖 자쪽(자쪽 굴)에 있다.","src":"Wrist & Hand 2.pdf, slide 10, 11","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10"},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-14":{"q":"Advanced median-nerve compression at the wrist may produce a simian hand, characterized by thenar wasting and a thumb that is:","o":["Abducted and opposed","Flexed at the interphalangeal joint only","Hyperextended at the MCP joint of the little finger","Adducted and extended","Clawed at the ring and little fingers only"],"a":3,"qk":"손목에서 정중신경이 심하게 압박되면 나타날 수 있는 원숭이손(simian hand)의 특징으로, 엄지두덩 위축과 함께 엄지가 취하는 자세는?","ok":["벌림·마주섬 자세","지절간관절만 굽힌 자세","새끼 MCP가 과신전된 자세","모음·폄 자세","약지·새끼만 갈퀴가 된 자세"],"exp":"정중신경이 손목굴에서 오래 압박되면 엄지두덩 근육이 약해지고 위축됩니다. 진행하면 엄지를 마주섬(opposition)하지 못하고, 엄지두덩이 야위며 엄지가 **모이고 펴진(adducted and extended)** 자세를 취하는 **원숭이손(simian hand)**이 됩니다.\n\n마주섬은 첫째 CMC에서 일어나므로, 이 운동의 소실은 엄지두덩 기능 저하를 바로 반영합니다. 굽힘근지지띠 위의 정중신경을 두드리면 티넬 징후가 양성일 수 있습니다.\n\n약지·새끼의 갈퀴손(claw)은 척골신경 손상의 전형이며, 원숭이손과 구별해야 합니다.","why":{"0":"벌림·마주섬은 정상 엄지두덩 기능이며, 원숭이손에서는 소실됩니다.","1":"엄지 IP만 굽힌 모습은 긴엄지굽힘근 작용에 가깝고, 원숭이손의 기술이 아닙니다.","2":"새끼 MCP 과신전은 척골신경 갈퀴손 양상에 가깝습니다.","4":"약지·새끼 갈퀴손은 척골신경 손상의 특징입니다."},"one":"원숭이손: 엄지두덩 위축 + 엄지가 모이고 펴지며 마주섬을 못한다.","src":"Wrist & Hand 2.pdf, slide 11","img":[{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-15":{"q":"Which muscle does not contribute to the thenar eminence and is innervated by the deep branch of the ulnar nerve?","o":["Abductor pollicis brevis","Superficial head of flexor pollicis brevis","Opponens pollicis","Abductor pollicis longus","Adductor pollicis"],"a":4,"qk":"엄지두덩(thenar eminence)을 이루지 않으며, 척골신경 깊은가지 지배를 받는 근육은?","ok":["짧은엄지벌림근","짧은엄지굽힘근의 얕은갈래","엄지맞섬근","긴엄지벌림근","엄지모음근(adductor pollicis)"],"exp":"손자체근(intrinsic muscles)은 19개로, 5개는 정중신경, 14개는 척골신경 지배입니다.\n\n엄지 운동 근육 중 두덩을 만드는 것은 짧은엄지벌림근, 짧은엄지굽힘근, 엄지맞섬근이며, **정중신경 되돌이가지(recurrent branch)**가 지배합니다. **엄지모음근(adductor pollicis)**은 두덩에 **기여하지 않고**, **척골신경 깊은가지** 지배를 받습니다. 가로갈래는 셋째 손허리뼈 앞면, 빗갈래는 머리뼈와 둘째·셋째 손허리뼈 바닥에서 일어납니다.\n\n긴엄지벌림근은 아래팔 뒤칸 근육으로, 손자체근이 아닙니다.","why":{"0":"짧은엄지벌림근은 엄지두덩을 이루며 정중신경 되돌이가지 지배입니다.","1":"기능적으로 중요한 얕은갈래는 정중신경(가쪽 종말가지) 지배이며 두덩을 이룹니다.","2":"엄지맞섬근은 두덩을 이루며 정중신경 되돌이가지 지배입니다.","3":"긴엄지벌림근은 아래팔 뒤칸 근육으로 요골신경 계통 지배이며, 손자체근이 아닙니다."},"one":"엄지모음근은 두덩을 만들지 않으며 척골신경 깊은가지 지배이다.","src":"Wrist & Hand 2.pdf, slide 13","img":[{"u":"img/w10_wrist/p13.webp","cap":"Wrist & Hand 2.pdf, slide 13"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-16":{"q":"The larger, functionally significant superficial head of flexor pollicis brevis is innervated by the:","o":["Recurrent branch of the median nerve","Deep branch of the ulnar nerve","Superficial branch of the radial nerve","Anterior interosseous nerve","Posterior interosseous nerve"],"a":0,"qk":"짧은엄지굽힘근(flexor pollicis brevis)에서 기능적으로 중요한 큰 얕은갈래를 지배하는 신경은?","ok":["정중신경의 가쪽 종말가지(되돌이가지)","척골신경 깊은가지","요골신경 얕은가지","앞뼈사이신경","뒤뼈사이신경"],"exp":"짧은엄지굽힘근에는 얕은갈래와 깊은갈래가 기술됩니다. 많은 현대 해부학 저자는 작은 깊은갈래의 의의를 낮게 보지만, Gray's Anatomy는 두 갈래와 이중 지배를 인정합니다.\n\n**핵심은 얕은갈래**입니다. 크고 기능적으로 의미 있는 **얕은갈래**는 **정중신경의 가쪽 종말가지(되돌이가지)**가 지배합니다. 거의 없거나 기능이 미미한 **깊은갈래**가 있을 때는 척골신경 깊은가지의 잔가지를 받을 수 있습니다.\n\n시험에서는 ‘두덩의 짧은엄지굽힘근 = 정중신경’을 기본으로 두고, 깊은갈래만 예외적으로 척골신경일 수 있다고 기억하면 됩니다.","why":{"1":"척골신경 깊은가지는 있을 수도 있는 작고 비기능적인 깊은갈래에 가는 가지이며, 얕은갈래의 신경이 아닙니다.","2":"요골신경 얕은가지는 손등 가쪽의 감각신경입니다.","3":"앞뼈사이신경은 긴엄지굽힘근과 네모엎침근을 지배하는 아래팔 가지입니다.","4":"뒤뼈사이신경은 뒤칸 깊은 폄근을 지배합니다."},"one":"짧은엄지굽힘근의 기능적 얕은갈래는 정중신경 되돌이가지 지배이다.","src":"Wrist & Hand 2.pdf, slide 14","img":[{"u":"img/w10_wrist/p14.webp","cap":"Wrist & Hand 2.pdf, slide 14"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-17":{"q":"Palmaris brevis, the thin wispy muscle that overlies the hypothenar eminence, is innervated by the:","o":["Deep branch of the ulnar nerve","Superficial branch of the ulnar nerve","Recurrent branch of the median nerve","Palmar cutaneous branch of the median nerve","Deep branch of the radial nerve"],"a":1,"qk":"새끼두덩을 덮는 얇은 짧은손바닥근(palmaris brevis)을 지배하는 신경은?","ok":["척골신경 깊은가지","척골신경 얕은가지","정중신경 되돌이가지","정중신경 손바닥피부가지","요골신경 깊은가지"],"exp":"새끼두덩(hypothenar eminence)을 만드는 근육은 새끼벌림근, 짧은새끼굽힘근, 새끼맞섬근이며, 이들은 **척골신경 깊은가지** 지배를 받습니다.\n\n그 위를 덮는 얇고 성긴 **짧은손바닥근(palmaris brevis)**은 두덩 형성 근육과 달리 **척골신경 얕은가지** 지배를 받습니다. 이 근육은 새끼두덩 피부에 붙어 손바닥 컵 모양을 약간 깊게 하고 척골신경·자동맥을 덮어 줍니다.\n\n‘새끼두덩 근육 = 척골 깊은가지’라는 규칙에서 짧은손바닥근만 얕은가지로 빼 두어야 합니다.","why":{"0":"척골신경 깊은가지는 새끼벌림근·짧은새끼굽힘근·새끼맞섬근과 뼈사이근 등을 지배합니다.","2":"정중신경 되돌이가지는 엄지두덩의 세 근육을 지배합니다.","3":"정중신경 손바닥피부가지는 손바닥 가쪽 감각가지이며, 짧은손바닥근의 운동신경이 아닙니다.","4":"요골신경 깊은가지(PIN)는 아래팔 뒤칸 근육을 지배합니다."},"one":"짧은손바닥근만 척골신경 얕은가지, 나머지 새끼두덩 근육은 깊은가지 지배이다.","src":"Wrist & Hand 2.pdf, slide 15","img":[{"u":"img/w10_wrist/p15.webp","cap":"Wrist & Hand 2.pdf, slide 15"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-18":{"q":"Lumbricals I and II, the lateral two worm-like muscles arising from the flexor digitorum profundus tendons, are:","o":["Bipennate and ulnar-innervated","Unipennate and ulnar-innervated","Unipennate and median-innervated","Bipennate and median-innervated","Unipennate and radial-innervated"],"a":2,"qk":"깊은손가락굽힘근 힘줄에서 일어나는 벌레 모양의 가쪽 두 충양근(lumbricals I, II)의 형태와 신경지배는?","ok":["두갈래새김이고 척골신경 지배","한갈래새김이고 척골신경 지배","한갈래새김이고 정중신경 손가락가지 지배","두갈래새김이고 정중신경 지배","한갈래새김이고 요골신경 지배"],"exp":"충양근(lumbricals)은 손바닥널힘줄 바로 깊은곳의 네 ‘벌레 모양’ 근육으로, **깊은손가락굽힘근(FDP) 힘줄**에서 일어납니다.\n\n**가쪽 둘(I, II)**은 FDP 힘줄 1·2의 노쪽에서 일어나는 **한갈래새김(unipennate)**이며, **정중신경의 손가락가지** 지배입니다. **안쪽 둘(III, IV)**은 FDP 힘줄 2·3·4의 인접면에서 일어나는 **두갈래새김(bipennate)**이며, **척골신경 깊은가지** 지배입니다.\n\n정중신경이 지배하는 손자체근 다섯은 엄지두덩 세 근육과 충양근 I·II입니다.","why":{"0":"두갈래새김·척골신경은 안쪽 충양근 III·IV의 특징입니다.","1":"한갈래새김은 I·II가 맞지만, 척골신경이 아니라 정중신경 지배입니다.","3":"정중신경 지배는 I·II가 맞지만, 이들은 한갈래새김입니다.","4":"요골신경은 손자체근 충양근을 지배하지 않습니다."},"one":"충양근 I·II: 한갈래새김·정중신경; III·IV: 두갈래새김·척골 깊은가지.","src":"Wrist & Hand 2.pdf, slide 16","img":[{"u":"img/w10_wrist/p16.webp","cap":"Wrist & Hand 2.pdf, slide 16"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-19":{"q":"The five intrinsic hand muscles innervated by the median nerve are the:","o":["Four lumbricals and palmaris brevis","Three hypothenar muscles and lumbricals III–IV","Adductor pollicis and all seven interossei","Three thenar-eminence muscles and lumbricals I–II","Four dorsal interossei and opponens pollicis"],"a":3,"qk":"정중신경이 지배하는 손자체근 다섯 개는?","ok":["충양근 넷과 짧은손바닥근","새끼두덩 세 근육과 충양근 III–IV","엄지모음근과 뼈사이근 일곱","엄지두덩 세 근육과 충양근 I–II","등쪽뼈사이근 넷과 엄지맞섬근"],"exp":"손자체근 19개 가운데 **정중신경은 5개**, **척골신경은 14개**를 지배합니다.\n\n정중신경 다섯은 **엄지두덩을 이루는 세 근육**(짧은엄지벌림근, 짧은엄지굽힘근 얕은갈래, 엄지맞섬근)과 **충양근 I·II**입니다. 나머지 새끼두덩 근육, 짧은손바닥근, 엄지모음근, 뼈사이근 전부, 충양근 III·IV는 척골신경 영역입니다.\n\n이 배분은 손목굴 증후군에서 엄지 마주섬·벌림 약화와 집게·가운데 충양근 약화가 함께 올 수 있는 이유를 설명합니다.","why":{"0":"충양근 넷 중 안쪽 둘과 짧은손바닥근은 척골신경 지배입니다.","1":"새끼두덩 근육과 충양근 III–IV는 척골신경 지배입니다.","2":"엄지모음근과 뼈사이근 일곱은 모두 척골신경 깊은가지 지배입니다.","4":"등쪽뼈사이근은 척골신경 깊은가지 지배이며, 엄지맞섬근만 정중신경입니다."},"one":"정중신경 손자체근 5개 = 엄지두덩 3 + 충양근 I·II.","src":"Wrist & Hand 2.pdf, slide 16","img":[{"u":"img/w10_wrist/p16.webp","cap":"Wrist & Hand 2.pdf, slide 16"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-20":{"q":"The palmar interossei adduct the fingers (“PAD”), and they are:","o":["Bipennate, like the dorsal interossei","Four in number and median-innervated","Responsible for abduction of the digits","Absent on every finger except the index","Unipennate and deep-ulnar innervated"],"a":4,"qk":"손바닥뼈사이근(palmar interossei)은 손가락을 모으고(PAD), 그 형태와 신경지배는?","ok":["등쪽뼈사이근처럼 두갈래새김이다","네 개이며 정중신경 지배이다","손가락을 벌리는 역할을 한다","집게를 제외한 모든 손가락에 없다","한갈래새김이며 척골신경 깊은가지 지배이다"],"exp":"손허리 구획의 뼈사이근은 모두 **척골신경 깊은가지** 지배이며 일곱 개입니다.\n\n**손바닥뼈사이근(PI)**은 **모음(adduction, PAD)**을 하고 **한갈래새김(unipennate)**입니다. 첫째는 둘째 손허리뼈 안쪽→둘째 몸쪽손가락뼈 안쪽, 둘째는 넷째 손허리뼈 가쪽→넷째 몸쪽손가락뼈 가쪽, 셋째는 다섯째 손허리뼈 가쪽→다섯째 몸쪽손가락뼈 가쪽입니다. 가운데손가락에는 손바닥뼈사이근이 없습니다.\n\n**등쪽뼈사이근(DI)**은 **벌림(abduction, DAB)**을 하고 **두갈래새김(bipennate)**입니다. 손의 축은 가운데손가락(셋째)입니다.","why":{"0":"두갈래새김은 등쪽뼈사이근의 형태입니다.","1":"손바닥뼈사이근은 세 개이며, 정중신경이 아니라 척골 깊은가지 지배입니다.","2":"벌림(DAB)은 등쪽뼈사이근의 기능입니다.","3":"손바닥뼈사이근은 둘째·넷째·다섯째에 있으며, ‘집게만 있다’는 기술이 아닙니다."},"one":"PAD: 손바닥뼈사이근(한갈래새김, 모음). DAB: 등쪽뼈사이근(두갈래새김, 벌림). 모두 척골 깊은가지.","src":"Wrist & Hand 2.pdf, slide 17","img":[{"u":"img/w10_wrist/p17.webp","cap":"Wrist & Hand 2.pdf, slide 17"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-21":{"q":"Abduction and adduction of the fingers are defined with respect to the axis of the hand, which is the:","o":["Middle finger (digit 3)","Index finger (digit 2)","Ring finger (digit 4)","Thumb (digit 1)","Little finger (digit 5)"],"a":0,"qk":"손가락의 벌림·모음을 정의하는 손의 축(axis of the hand)은 어느 손가락인가?","ok":["가운데손가락(셋째)","집게손가락(둘째)","약지(넷째)","엄지(첫째)","새끼손가락(다섯째)"],"exp":"뼈사이근의 벌림·모음은 **손의 축**을 기준으로 정의됩니다. 그 축은 **가운데손가락(셋째 손가락)**입니다.\n\n가운데손가락에서 멀어지면 벌림(등쪽뼈사이근), 축으로 가까워지면 모음(손바닥뼈사이근)입니다. 가운데손가락 자체는 축의 양옆으로 벌릴 수 있어 둘째·셋째 등쪽뼈사이근이 가쪽·안쪽 몸쪽손가락뼈에 닿습니다. 엄지의 벌림·모음은 손바닥 면에 대해 다른 면으로 정의되므로, 손가락 뼈사이근의 축과 혼동하지 않습니다.","why":{"1":"집게는 축이 아니며, 첫째 등쪽뼈사이근이 집게를 가쪽으로 벌립니다.","2":"약지는 축이 아니며, 넷째 등쪽뼈사이근이 약지를 안쪽으로 벌립니다.","3":"엄지는 손의 축이 아니며, 벌림·모음의 면이 다릅니다.","4":"새끼는 축이 아니며, 새끼벌림근과 셋째 손바닥뼈사이근이 벌림·모음에 관여합니다."},"one":"손가락 벌림·모음의 축은 가운데손가락(셋째)이다.","src":"Wrist & Hand 2.pdf, slide 17","img":[{"u":"img/w10_wrist/p17.webp","cap":"Wrist & Hand 2.pdf, slide 17"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-22":{"q":"In Dupuytren contracture, fibrous shortening of the palmar aponeurosis typically pulls the ring and little fingers into partial flexion at the:","o":["DIP joints only","MCP and PIP joints","Carpometacarpal joints only","Wrist and DIP joints","Interphalangeal joint of the thumb"],"a":1,"qk":"뒤퓌트랑 구축(Dupuytren contracture)에서 손바닥널힘줄의 섬유성 단축이 약지와 새끼를 부분 굽힘시키는 관절은?","ok":["원위지절관절만","손허리손가락관절과 근위지절관절","손목손허리관절만","손목과 원위지절관절","엄지 지절간관절"],"exp":"**뒤퓌트랑 구축**은 손바닥근막·널힘줄이 두꺼워지고 짧아지며 섬유화되는 병입니다. 안쪽(자쪽) 손바닥널힘줄의 세로띠가 퇴행하면서 **넷째·다섯째 손가락**이 **손허리손가락관절(MCP)과 근위지절관절(PIP)**에서 부분 굽힘됩니다. 원위지절관절(DIP)은 전형적으로 덜 침범됩니다.\n\n처음에는 피부에 유착되는 통증 없는 결절(nodule)로 시작하고, 점차 손바닥에서 넷째·다섯째 기저부까지 융기된 능선이 생깁니다. 치료는 보통 섬유화된 손바닥근막을 수술적으로 절제하여 손가락을 풀어 주는 것입니다.","why":{"0":"DIP는 이 병의 전형적인 주된 굽힘 부위가 아닙니다. 주로 MCP와 PIP가 굽혀집니다.","2":"CMC는 뒤퓌트랑 구축의 주된 변형 관절이 아닙니다.","3":"손목과 DIP가 주된 변형 부위가 아닙니다.","4":"엄지 IP는 전형적인 침범 부위가 아니며, 병변은 넷째·다섯째에 편중됩니다."},"one":"뒤퓌트랑 구축은 널힘줄 세로띠가 약지·새끼를 MCP·PIP에서 굽힌다.","src":"Wrist & Hand 2.pdf, slide 18","img":[{"u":"img/w10_wrist/p18.webp","cap":"Wrist & Hand 2.pdf, slide 18"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-23":{"q":"Dupuytren contracture of the palmar fascia is frequently bilateral and is typically seen in:","o":["Young women after acute trauma","Children with trigger digits","Some men older than 50 years","Patients with acute median-nerve entrapment","Athletes immediately after a skier’s fall"],"a":2,"qk":"손바닥근막의 뒤퓌트랑 구축은 흔히 양쪽성이며, 전형적으로 어떤 군에서 보이는가?","ok":["급성 외상 후의 젊은 여성","방아쇠손가락이 있는 소아","50세 이상의 일부 남성","급성 정중신경 포착 환자","스키 외상 직후의 운동선수"],"exp":"뒤퓌트랑 구축은 **자주 양쪽성**이며, **50세 이상의 일부 남성**에서 잘 보입니다. 원인은 완전히 밝혀지지 않았으나 **유전적 소인**을 시사하는 근거가 있습니다.\n\n병은 손바닥널힘줄의 통증 없는 결절로 시작해 피부에 유착되고, 세로띠의 진행성 구축으로 넷째·다섯째가 MCP·PIP에서 굽혀집니다. 급성 염증, 신경 포착, 외상성 인대 파열과는 경과가 다릅니다. 치료는 보통 섬유화된 손바닥근막을 절제하여 손가락을 풀어 주는 것입니다.","why":{"0":"전형적인 환자는 젊은 여성이 아니라 중년 이후 남성이며, 급성 외상 질환이 아닙니다.","1":"소아 방아쇠손가락은 A1 도르래의 협착이며, 널힘줄 섬유화와 다릅니다.","3":"정중신경 포착(손목굴 증후군)은 저림·야간통이 특징이며, 널힘줄 구축이 아닙니다.","4":"스키 외상은 엄지 척골측부인대 손상과 관련되며, 뒤퓌트랑과 무관합니다."},"one":"뒤퓌트랑은 50세 이상 남성에서 흔하고 자주 양쪽성이며, 유전 소인이 시사된다.","src":"Wrist & Hand 2.pdf, slide 18","img":[{"u":"img/w10_wrist/p18.webp","cap":"Wrist & Hand 2.pdf, slide 18"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-24":{"q":"The superficial palmar arch is formed primarily by the:","o":["Radial artery","Princeps pollicis artery","Anterior interosseous artery","Ulnar artery","Deep palmar branch of the radial artery alone"],"a":3,"qk":"얕은손바닥활(superficial palmar arch)을 주로 형성하는 동맥은?","ok":["노동맥","엄지주요동맥","앞뼈사이동맥","자동맥(ulnar artery)","노동맥의 깊은손바닥가지만"],"exp":"손의 동맥은 두 활로 고리를 이룹니다.\n\n**얕은손바닥활**은 주로 **자동맥(ulnar artery)**이 만들고, 가지는 깊은손바닥가지, 온손바닥손가락동맥, 고유손바닥손가락동맥입니다. **깊은손바닥활**은 주로 **노동맥(radial artery)**이 만들며, 얕은손바닥가지, 엄지주요동맥(princeps pollicis), 집게노동맥(radialis indicis), 등쪽손목동맥과 등쪽손허리동맥을 냅니다.\n\n아래팔에서 이미 ‘자동맥 → 얕은활, 노동맥 → 깊은활’로 외운 내용을 손에서 그대로 이으면 됩니다.","why":{"0":"노동맥은 주로 깊은손바닥활을 형성합니다.","1":"엄지주요동맥은 노동맥(깊은활) 계통의 가지입니다.","2":"앞뼈사이동맥은 아래팔 깊은곳의 혈관이며, 얕은활의 주된 형성 동맥이 아닙니다.","4":"노동맥의 깊은손바닥가지는 깊은활 쪽에 가깝고, 얕은활의 주된 형성 혈관이 아닙니다."},"one":"얕은손바닥활은 자동맥, 깊은손바닥활은 노동맥이 주로 이룬다.","src":"Wrist & Hand 2.pdf, slide 19","img":[{"u":"img/w10_wrist/p19.webp","cap":"Wrist & Hand 2.pdf, slide 19"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-25":{"q":"The princeps pollicis and radialis indicis arteries typically arise from the:","o":["Superficial palmar arch","Ulnar artery in Guyon’s canal","Common palmar digital arteries","Anterior interosseous artery","Radial artery (deep palmar system)"],"a":4,"qk":"엄지주요동맥(princeps pollicis)과 집게노동맥(radialis indicis)은 대개 어디에서 분지하는가?","ok":["얕은손바닥활","기용 굴의 자동맥","온손바닥손가락동맥","앞뼈사이동맥","노동맥(깊은손바닥 계통)"],"exp":"노동맥은 손에서 **깊은손바닥활**을 이루며, 그 가지로 **엄지주요동맥(princeps pollicis artery)**과 **집게노동맥(radialis indicis artery)**을 냅니다. 등쪽손목동맥과 등쪽손허리동맥도 이 가쪽 계통에 속합니다.\n\n자동맥은 얕은손바닥활을 이루고 온손바닥손가락동맥과 고유손바닥손가락동맥을 내어 손가락으로 갑니다. 청소년 손의 동맥조영에서는 손가락 긴뼈의 열린 뼈끝선(epiphyseal growth plates)과 함께 이 활·가지들을 볼 수 있습니다.","why":{"0":"얕은손바닥활은 주로 자동맥이 만들며, 이 두 동맥의 전형적 기시가 아닙니다.","1":"기용 굴의 자동맥은 척골 쪽 활·가지로 이어지며, 엄지주요동맥의 표준 기시가 아닙니다.","2":"온손바닥손가락동맥은 얕은활에서 나와 고유동맥으로 갈라지는 가지입니다.","3":"앞뼈사이동맥은 아래팔 깊은곳의 혈관입니다."},"one":"엄지주요동맥과 집게노동맥은 노동맥(깊은손바닥 계통)의 가지이다.","src":"Wrist & Hand 2.pdf, slide 19, 20","img":[{"u":"img/w10_wrist/p19.webp","cap":"Wrist & Hand 2.pdf, slide 19"},{"u":"img/w10_wrist/p20.webp","cap":"Wrist & Hand 2.pdf, slide 20"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-26":{"q":"Cutaneous innervation of the thenar eminence and the lateral palm is provided by the:","o":["Median nerve","Ulnar nerve","Radial nerve","Musculocutaneous nerve","Medial antebrachial cutaneous nerve"],"a":0,"qk":"엄지두덩과 가쪽 손바닥의 피부감각을 담당하는 신경은?","ok":["정중신경(median nerve)","척골신경(ulnar nerve)","요골신경(radial nerve)","근피신경(musculocutaneous nerve)","안쪽아래팔피부신경"],"exp":"손의 피부신경은 세 신경이 나눕니다.\n\n**정중신경**은 **엄지두덩과 가쪽 손바닥**을 덮고, 손바닥가지와 손가락신경을 냅니다. 손바닥에서는 엄지, 집게, 가운데, 약지의 노쪽 절반이 정중신경 영역이며, 집게·가운데 손끝의 고유영역이 특히 뚜렷합니다.\n\n척골신경은 새끼두덩·안쪽 손바닥과 안쪽 손등을, 요골신경 얕은가지는 가쪽 손등을 담당합니다. 정중신경의 손바닥피부가지는 손목굴보다 근위에서 갈라지므로, 손목굴 증후군에서도 손바닥 근위부 감각은 비교적 보전될 수 있습니다.","why":{"1":"척골신경은 새끼두덩, 안쪽 손바닥, 안쪽 손등을 지배합니다.","2":"요골신경은 가쪽 손등(얕은가지)을 지배합니다.","3":"근피신경은 가쪽 아래팔 피부에서 끝나며, 손바닥을 지배하지 않습니다.","4":"안쪽아래팔피부신경은 아래팔 안쪽 피부를 지배합니다."},"one":"정중신경: 엄지두덩·가쪽 손바닥. 척골신경: 안쪽 손바닥·안쪽 손등. 요골신경: 가쪽 손등.","src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-27":{"q":"The lateral dorsum of the hand is supplied by the:","o":["Ulnar nerve","Superficial branch of the radial nerve","Palmar digital branches of the median nerve only","Posterior antebrachial cutaneous nerve alone","Deep branch of the ulnar nerve"],"a":1,"qk":"손의 가쪽 등쪽 피부를 지배하는 신경은?","ok":["척골신경","요골신경의 얕은가지","정중신경 손바닥손가락가지만","뒤아래팔피부신경만","척골신경 깊은가지"],"exp":"손등 감각은 가쪽과 안쪽이 다릅니다.\n\n**가쪽 손등**은 **요골신경 얕은가지**가 담당하며, 등쪽 손가락가지를 냅니다. **안쪽 손등**은 척골신경(등쪽가지)이 담당합니다. 집게·가운데 손끝의 등쪽 일부는 정중신경 손바닥손가락가지가 손끝을 감고 올라가 고유영역을 만듭니다.\n\n요골신경 깊은가지(PIN)는 운동신경에 가깝고 손등 피부를 넓게 지배하지 않으므로, ‘손등 가쪽 감각 = 얕은가지’로 고정합니다.","why":{"0":"척골신경은 안쪽 손등(약지 자쪽과 새끼)을 지배합니다.","2":"정중신경 손바닥손가락가지는 손끝 등쪽의 고유영역만 일부 덮으며, 가쪽 손등 전체의 신경이 아닙니다.","3":"뒤아래팔피부신경은 아래팔 뒤쪽 피부이며, 손등 가쪽의 주된 신경이 아닙니다.","4":"척골신경 깊은가지는 주로 손자체근의 운동가지입니다."},"one":"가쪽 손등 감각은 요골신경 얕은가지, 안쪽 손등은 척골신경이다.","src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-28":{"q":"Besides the hypothenar and medial palmar skin, the ulnar nerve also supplies the:","o":["Entire dorsum of the hand","Lateral 3½ digits on the palmar surface","Medial dorsum of the hand","Skin of the anatomical snuffbox only","Posterior skin of the arm exclusively"],"a":2,"qk":"척골신경은 새끼두덩과 안쪽 손바닥 외에, 어느 부위의 피부감각도 담당하는가?","ok":["손등 전체","손바닥면 가쪽 3½ 손가락","손의 안쪽 등쪽","해부학 코담배갑 피부만","위팔 뒤쪽 피부만"],"exp":"척골신경의 피부영역은 손바닥과 손등에 걸쳐 있습니다.\n\n손바닥에서는 **새끼두덩과 안쪽 손바닥**(새끼와 약지의 자쪽)을 덮고 얕은가지를 냅니다. 여기에 더해 **안쪽 손등**도 척골신경이 지배합니다. 이 등쪽 피부가지는 손목보다 근위(아래팔 먼쪽)에서 갈라지므로, 손목의 자쪽 굴만 압박되면 안쪽 손등 감각이 보전되고, 팔꿉(팔꿉굴)에서 압박되면 안쪽 손등 감각도 떨어질 수 있습니다.\n\n가쪽 3½ 손가락 손바닥은 정중신경, 가쪽 손등은 요골신경 얕은가지입니다.","why":{"0":"손등 가쪽은 요골신경 영역이므로, 척골신경이 손등 전체를 지배하지 않습니다.","1":"손바닥 가쪽 3½ 손가락은 정중신경 영역입니다.","3":"해부학 코담배갑 피부는 요골신경 얕은가지 영역에 가깝습니다.","4":"위팔 뒤쪽 피부는 요골신경의 뒤위팔피부신경 영역입니다."},"one":"척골신경은 안쪽 손바닥뿐 아니라 안쪽 손등 감각도 담당한다.","src":"Wrist & Hand 2.pdf, slide 21","img":[{"u":"img/w10_wrist/p21.webp","cap":"Wrist & Hand 2.pdf, slide 21"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-29":{"q":"Within the carpal tunnel, the structure described as the sensitive structure most vulnerable to compression is the:","o":["Tendon of flexor carpi radialis","Tendon of flexor pollicis longus","Superficial palmar arch","Median nerve","Ulnar nerve"],"a":3,"qk":"손목굴 안에서 압박에 가장 취약하다고 기술되는 예민한 구조는?","ok":["노쪽손목굽힘근 힘줄","긴엄지굽힘근 힘줄","얕은손바닥활","정중신경(median nerve)","척골신경(ulnar nerve)"],"exp":"손목굴의 내용물 가운데 **정중신경**이 **가장 예민한 구조(sensitive structure)**로 강조됩니다. 힘줄(FPL, FDS, FDP, 그리고 따로 나뉜 통로의 FCR)은 윤활막 염증으로 부피가 늘어나 굴 내 압력을 올릴 수 있으나, 증상은 주로 정중신경 압박으로 나타납니다.\n\n척골신경은 굴 밖 자쪽 통로에 있고, 얕은손바닥활은 손바닥의 더 먼쪽 평면(굽힘근 힘줄보다 손바닥쪽, 손바닥근막 바로 아래)에 있습니다. 따라서 ‘손목굴 내용물의 취약 구조 = 정중신경’으로 정리합니다.","why":{"0":"FCR 힘줄은 따로 나뉜 통로를 지나며, 가장 예민한 구조로 지목되지 않습니다.","1":"FPL 힘줄은 굴 안의 내용물이지만, 예민한 압박 대상은 정중신경입니다.","2":"얕은손바닥활은 손목굴 안의 구조가 아닙니다.","4":"척골신경은 손목굴 밖 자쪽에 있습니다."},"one":"손목굴에서 가장 예민한 압박 대상은 정중신경이다.","src":"Wrist & Hand 2.pdf, slide 10, 11","img":[{"u":"img/w10_wrist/p10.webp","cap":"Wrist & Hand 2.pdf, slide 10"},{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_wrist-30":{"q":"Tinel’s sign at the wrist is elicited by gently tapping over the median nerve in the region of the:","o":["Extensor retinaculum","Anatomical snuffbox","Medial epicondyle","Hook of the hamate only","Flexor retinaculum"],"a":4,"qk":"손목에서 티넬 징후(Tinel's sign)는 정중신경의 어느 부위 위를 가볍게 두드려 유발하는가?","ok":["폄근지지띠","해부학 코담배갑","안쪽위관절융기","갈고리뼈의 갈고리만","굽힘근지지띠(flexor retinaculum)"],"exp":"손목굴 증후군에서 **티넬 징후**는 **굽힘근지지띠** 부위의 정중신경 위를 가볍게 두드릴 때, 정중신경 영역으로 퍼지는 저림·통증이 재현되는 소견입니다.\n\n같은 부위의 압박이 정중신경을 자극하는 이유이기도 합니다. 두드리는 위치가 팔꿉의 안쪽위관절융기라면 척골신경의 티넬이고, 갈고리뼈 갈고리 부근은 자쪽 굴의 척골신경을 자극할 수 있습니다. 폄근지지띠나 코담배갑은 정중신경 경로가 아닙니다.","why":{"0":"폄근지지띠는 등쪽 폄근 힘줄을 누르는 띠로, 정중신경 타진 부위가 아닙니다.","1":"해부학 코담배갑은 노동맥과 요골신경 얕은가지가 가까운 가쪽 등쪽 함몰입니다.","2":"안쪽위관절융기 뒤는 척골신경의 티넬 검사 부위입니다.","3":"갈고리 부근 타진은 자쪽 굴의 척골신경을 자극할 수 있습니다."},"one":"손목 티넬 징후는 굽힘근지지띠 위의 정중신경을 두드려 유발한다.","src":"Wrist & Hand 2.pdf, slide 11","img":[{"u":"img/w10_wrist/p11.webp","cap":"Wrist & Hand 2.pdf, slide 11"}],"ch":"w10_wrist","chn":"Wrist & Hand 2","week":10},"w10_riedel-1":{"q":"Unrelieved peripheral-nerve compression may produce irreversible change through which sequence of events?","o":["Distal axonal degeneration, fibrosis, and muscle denervation","Isolated myelin edema without axonal injury","Hypertrophy of the denervated muscle belly","Proximal muscle hyperplasia with preserved axons","Venous congestion of the nerve sheath alone"],"a":0,"qk":"말초신경 압박이 지속되면, 어느 과정을 거쳐 되돌리기 어려운 변화가 생길 수 있는가?","ok":["먼쪽 축삭변성, 섬유화, 근육 탈신경","축삭 손상 없는 수초 부종만","탈신경된 근복의 비대","축삭이 보전된 몸쪽 근육 증식","신경초의 정맥울혈만"],"exp":"말초신경이 오래 압박되면 구조적 변화가 쌓입니다.\n\n**먼쪽 축삭변성(distal axonal degeneration)**, 몸쪽으로 축삭 물질이 모이는 현상, **섬유화(fibrosis)**, 그리고 **근육의 탈신경(denervation of muscle)**이 이어지면, 일부 변화는 이미 **되돌릴 수 없습니다.** 따라서 압박을 늦게 풀어 주더라도 감각 소실이나 근위축이 완전히 회복되지 않을 수 있습니다.\n\n이 병태생리는 손목굴·팔꿉굴 증후군에서 늦게 수술하는 경우, ‘진행은 멈추더라도 증상이 남을 수 있다’는 설명의 바탕이 됩니다. 단순한 울혈이나 가역적 부종 단계에서 감압하는 것이 예후에 유리합니다.","why":{"1":"압박이 지속되면 수초 부종을 넘어 축삭변성과 섬유화가 따라옵니다.","2":"탈신경된 근육은 비대가 아니라 위축됩니다.","3":"몸쪽 근육이 증식하며 축삭이 보전되는 과정이 아닙니다.","4":"정맥울혈은 초기 기전의 한 부분이 될 수 있으나, 비가역 변화의 전체 과정이 아닙니다."},"one":"지속 압박은 축삭변성·섬유화·근육 탈신경을 일으켜 일부 변화를 비가역적으로 만든다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 5","img":[{"u":"img/w10_riedel/p05.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 5"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-2":{"q":"The most common compression neuropathy of the upper extremity is:","o":["Cubital tunnel syndrome","Carpal tunnel syndrome","Radial tunnel syndrome","Anterior interosseous syndrome","Ulnar tunnel (Guyon’s canal) syndrome"],"a":1,"qk":"윗팔에서 가장 흔한 압박성 신경병증은?","ok":["팔꿉굴 증후군","손목굴 증후군(carpal tunnel syndrome)","요골굴 증후군","앞뼈사이신경 증후군","자쪽 굴(기용 굴) 증후군"],"exp":"윗팔의 포착성 신경병증 가운데 **가장 흔한 것은 손목굴 증후군(carpal tunnel syndrome)**으로, 손목굴에서 정중신경이 압박됩니다. 통증과 정중신경 영역의 감각이상(paresthesias)이 나타나고, 증상은 **밤과 손목의 극단 자세**에서 더 나빠지며, 약화나 감각 변화 때문에 물건을 떨어뜨리기도 합니다.\n\n**두 번째로 흔한** 것은 팔꿉에서 척골신경이 압박되는 **팔꿉굴 증후군(cubital tunnel syndrome)**입니다. 그 밖에 자쪽 굴 증후군, 요골굴 증후군, 앞뼈사이신경 증후군 등이 감별 목록에 오릅니다.\n\n진단에서 가장 중요한 도구는 **문진과 신체검사(H&P)**입니다. X선, CT, MRI는 유용하지 않고, 근전도·신경전도검사(EMG/NCS)는 진단을 확인하거나 이중압박(double crush), 당뇨신경병증, 검사가 어려운 경우에 도움이 됩니다.","why":{"0":"팔꿉굴 증후군은 두 번째로 흔한 윗팔 압박성 신경병증입니다.","2":"요골굴 증후군은 감별 목록에 있으나, 가장 흔하지 않습니다.","3":"앞뼈사이신경 증후군은 정중신경 깊은가지의 운동 마비로, 가장 흔하지 않습니다.","4":"자쪽 굴 증후군은 손목에서 척골신경이 압박되는 덜 흔한 포착입니다."},"one":"윗팔에서 가장 흔한 압박성 신경병증은 손목굴 증후군이고, 두 번째는 팔꿉굴 증후군이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 6, 10, 11, 21","img":[{"u":"img/w10_riedel/p06.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 6"},{"u":"img/w10_riedel/p10.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 10"},{"u":"img/w10_riedel/p11.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 11"},{"u":"img/w10_riedel/p21.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 21"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-3":{"q":"Symptoms of carpal tunnel syndrome are characteristically worse:","o":["Only after acute elbow trauma","During mid-day meals","At night and in extreme wrist positions","Exclusively with shoulder abduction","Only after a positive thumb grind test"],"a":2,"qk":"손목굴 증후군의 증상은 전형적으로 언제 더 심해지는가?","ok":["급성 팔꿉 외상 후에만","한낮 식사 중에","밤과 손목의 극단 자세에서","어깨 벌림 때만","엄지 연마 검사 양성에만"],"exp":"손목굴 증후군의 전형적인 병력은 정중신경 영역의 **통증과 감각이상**이며, 증상은 **밤**과 **손목을 극단적으로 굽히거나 펴는 자세**에서 더 나빠집니다. 근력 저하나 감각 변화로 물건을 떨어뜨리기도 합니다.\n\n밤에는 무의식적으로 손목을 굽힌 채 자는 경우가 많고, 굴 내 압력이 높아져 저림으로 잠에서 깨는 일이 흔합니다. 이 병력만으로도 임상 진단에 크게 기여하며, 영상 검사보다 문진·신체검사가 더 중요합니다.","why":{"0":"급성 팔꿉 외상은 척골신경 손상의 병력에 가깝습니다.","1":"한낮 식사와 특이적으로 관련되지 않습니다.","3":"어깨 벌림은 팔신경얼기 아래 줄기 증상과 더 관련됩니다.","4":"엄지 연마 검사(grind test)는 엄지 CMC 관절염의 검사입니다."},"one":"손목굴 증후군은 밤과 극단적 손목 자세에서 저림·통증이 심해진다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 10","img":[{"u":"img/w10_riedel/p10.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 10"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-4":{"q":"In the evaluation of suspected carpal tunnel syndrome, the most important diagnostic tool is:","o":["Plain radiographs of the wrist","CT of the carpal tunnel","MRI of the median nerve","History and physical examination","Routine bone scintigraphy"],"a":3,"qk":"손목굴 증후군이 의심될 때, 가장 중요한 진단 도구는?","ok":["손목 단순 방사선 촬영","손목굴 CT","정중신경 MRI","문진과 신체검사(H&P)","일상적 뼈스캔"],"exp":"손목굴 증후군의 진단에는 여러 검사가 있으나, **가장 중요한 도구는 문진과 신체검사(H&P)**입니다.\n\n**X선, CT, MRI는 유용하지 않습니다.** 근전도·신경전도검사(EMG/NCS)는 진단을 확인하거나, 이중압박(double crush), 당뇨신경병증, 신체검사가 어려운 상황에서 도움이 됩니다.\n\n즉, 전형적인 야간 저림과 정중신경 영역 증상, 팔렌·티넬·직접압박 검사 등 임상 소견이 중심이고, 영상으로 먼저 ‘확인’하려 해서는 안 됩니다.","why":{"0":"단순 방사선 촬영은 이 진단에 유용하지 않습니다.","1":"CT 역시 유용하지 않은 영상 검사로 제시됩니다.","2":"MRI도 일차 진단에 유용하지 않습니다.","4":"뼈스캔은 손목굴 증후군의 진단 도구가 아닙니다."},"one":"손목굴 증후군 진단의 핵심은 문진·신체검사이다. X선·CT·MRI는 유용하지 않다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 11","img":[{"u":"img/w10_riedel/p11.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 11"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-5":{"q":"A Phal
