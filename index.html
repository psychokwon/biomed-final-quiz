다."},"one":"림프구는 감별계산 25–33%이며 수명이 수 시간에서 수년이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21","img":[{"u":"img/w12_blood/p21.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-26":{"q":"Which describes platelets (thrombocytes)?","o":["Non-nucleated fragments of megakaryocytes, 2–4 µm in diameter, 150,000–400,000 per µl, living about 10 days","Nucleated cells about 7.5 µm in diameter","Agranulocytes that mature in the thymus","Granulocytes with a bilobed nucleus","Cells that live about 120 days"],"a":0,"qk":"혈소판(platelets, thrombocytes)을 설명하는 것은?","ok":["거대핵세포의 핵 없는 조각으로, 지름 2–4 µm, 혈액 µl당 150,000–400,000개, 수명 약 10일","지름 약 7.5 µm의 유핵 세포","가슴샘에서 성숙하는 무과립백혈구","두 엽 핵을 가진 과립백혈구","약 120일 사는 세포"],"exp":"**혈소판(platelets, thrombocytes)**은 **거대핵세포(megakaryocytes)**, 즉 골수의 거대한 다배수체(polyploid) 세포에서 떨어져 나온 **핵 없는 막성 조각**입니다.\n\n- 지름 **2–4 µm**\n- **혈액 µl당 150,000–400,000개**\n- 수명 **약 10일**\n- 역할: **혈액 응고 촉진**, 혈관 벽의 작은 찢어짐이나 누출 수리","why":{"1":"지름 7.5 µm는 적혈구이며, 적혈구도 핵이 없습니다.","2":"가슴샘에서 성숙하는 것은 T 림프구입니다.","3":"두 엽 핵은 호산구·호염기구의 특징입니다.","4":"120일은 적혈구의 수명입니다."},"one":"혈소판은 거대핵세포의 핵 없는 조각(2–4 µm)으로, µl당 15–40만 개, 수명 약 10일이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 22, 23","img":[{"u":"img/w12_blood/p22.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 22"},{"u":"img/w12_blood/p23.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 23"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-27":{"q":"In platelet structure, what is the granulomere?","o":["The pale peripheral zone","A marginal bundle of microtubules that maintains shape","A canalicular system connected to plasmalemma invaginations","An ER-derived tubular system that stores calcium","The darker staining central zone containing granules"],"a":4,"qk":"혈소판 구조에서 과립질(granulomere)이란 무엇인가?","ok":["옅은 주변부 구역","모양을 유지하는 미세관의 가장자리 다발","세포막 함입부와 연결된 소관계","칼슘을 저장하는 ER 유래 세관계","과립을 담은, 진하게 염색되는 중심 구역"],"exp":"혈소판(platelets)은 형태상 두 부분으로 나뉩니다.\n\n- **유리질(hyalomere)**: **옅은 주변부 구역(pale peripheral zone)**\n- **과립질(granulomere)**: **과립을 담은 진한 중심 구역(darker staining central zone)**\n\n그 외 구조:\n- **가장자리 다발(marginal bundle)**: 미세관(microtubules)과 미세섬유(microfilaments)로 모양 유지\n- **소관계(canalicular system)**: 세포막 함입부와 연결되어 물질 흡수를 도움\n- **세관계(tubular system)**: ER에서 유래, **칼슘 이온 저장**","why":{"0":"옅은 주변부 구역은 유리질(hyalomere)입니다.","1":"미세관 가장자리 다발(marginal bundle)은 모양을 유지하는 구조로, 과립질이 아닙니다.","2":"소관계(canalicular system)는 물질 흡수를 돕는 구조입니다.","3":"ER 유래 세관계(tubular system)는 칼슘을 저장하는 구조입니다."},"one":"혈소판 중심의 진한 과립 구역이 과립질(granulomere), 옅은 주변부가 유리질(hyalomere)이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w12_blood/p24.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-28":{"q":"Platelet delta (δ) granules contain which substances?","o":["Myeloperoxidase and lysozyme","ADP, ATP and serotonin","Major basic protein and peroxidase","PDGF and platelet factor 4","Heparin and histamine"],"a":1,"qk":"혈소판의 델타과립(δ granules)에 들어 있는 물질은?","ok":["골수세포과산화효소와 리소자임","ADP, ATP, 세로토닌(serotonin)","주염기성단백질과 과산화효소","PDGF와 혈소판 인자 4","헤파린과 히스타민"],"exp":"혈소판(platelets)의 과립질(granulomere)에는 두 종류의 과립이 있습니다.\n\n- **델타과립(δ granules)**: **ADP, ATP, 세로토닌(serotonin)**\n- **알파과립(α granules)**: **PDGF(혈소판유래성장인자)**, **혈소판 인자 4(platelet factor 4)** 등\n\n델타는 작은 분자, 알파는 단백질 성장인자로 묶어 기억하면 편합니다.","why":{"0":"골수세포과산화효소와 리소자임은 호중구 아주르친화과립의 내용물입니다.","2":"주염기성단백질과 과산화효소는 호산구 과립의 내용물입니다.","3":"PDGF와 혈소판 인자 4는 알파과립(α granules)의 내용물입니다.","4":"헤파린과 히스타민은 호염기구 과립의 내용물입니다."},"one":"혈소판 델타과립에는 ADP·ATP·세로토닌, 알파과립에는 PDGF·혈소판 인자 4가 있다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w12_blood/p24.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 24"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-29":{"q":"Where does hemopoiesis occur during the second trimester?","o":["Yolk sac","Lymph nodes only","Liver and spleen","Bone marrow only","Thymus only"],"a":2,"qk":"임신 2분기(second trimester)에 조혈(hemopoiesis)은 어디에서 일어나는가?","ok":["난황주머니(yolk sac)","림프절(lymph nodes)만","간(liver)과 지라(spleen)","골수(bone marrow)만","가슴샘(thymus)만"],"exp":"혈구는 수명이 비교적 짧아 계속 새로 만들어져야 하며, 이 분화·발달 과정을 **조혈(hemopoiesis, hematopoiesis)**이라고 합니다.\n\n조혈 장소의 이동:\n1. **초기 배아**: **난황주머니(yolk sac)**\n2. **임신 2분기**: **간(liver)과 지라(spleen)**\n3. **임신 3분기**: **골수(bone marrow)**로 옮겨가 평생 그곳에서 계속됨","why":{"0":"난황주머니는 초기 배아의 조혈 장소입니다.","1":"림프절은 2분기 조혈 장소로 제시되지 않습니다.","3":"골수로 옮겨가는 것은 임신 3분기입니다.","4":"가슴샘은 T 림프구가 성숙하는 곳이며 2분기 조혈 장소가 아닙니다."},"one":"조혈은 난황주머니 → (2분기) 간·지라 → (3분기 이후) 골수 순으로 옮겨간다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 25","img":[{"u":"img/w12_blood/p25.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 25"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-30":{"q":"Granulopoiesis is the development of which cells?","o":["Monocytes","Platelets","Lymphocytes","Neutrophils, eosinophils and basophils","Erythrocytes"],"a":3,"qk":"과립구생성(granulopoiesis)은 어떤 세포의 발달인가?","ok":["단핵구(monocytes)","혈소판(platelets)","림프구(lymphocytes)","호중구·호산구·호염기구(neutrophils, eosinophils, basophils)","적혈구(erythrocytes)"],"exp":"각 혈구는 고유한 계열(lineage)을 따라 발달합니다.\n\n- **적혈구생성(erythropoiesis)**: 적혈구\n- **과립구생성(granulopoiesis)**: **호중구·호산구·호염기구**\n- **단핵구생성(monocytopoiesis)**: 단핵구\n- **혈소판생성(thrombocytopoiesis)**: 혈소판\n- **림프구생성(lymphopoiesis)**: 림프구","why":{"0":"단핵구의 발달은 단핵구생성(monocytopoiesis)입니다.","1":"혈소판의 발달은 혈소판생성(thrombocytopoiesis)입니다.","2":"림프구의 발달은 림프구생성(lymphopoiesis)입니다.","4":"적혈구의 발달은 적혈구생성(erythropoiesis)입니다."},"one":"과립구생성(granulopoiesis)은 호중구·호산구·호염기구의 발달이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 26","img":[{"u":"img/w12_blood/p26.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 26"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-31":{"q":"The pluripotent hemopoietic stem cell produces which two cell lines?","o":["Erythroid and thrombocytic","Granulocytic and monocytic","B-cell and T-cell","Lymphoid and myeloid","Endothelial and mesenchymal"],"a":3,"qk":"다능성 조혈줄기세포(hemopoietic stem cell)가 만드는 두 세포 계열은?","ok":["적혈구계와 혈소판계","과립구계와 단핵구계","B세포계와 T세포계","림프계(lymphoid)와 골수계(myeloid)","내피계와 간엽계"],"exp":"모든 혈구는 궁극적으로 **공통 줄기세포(common stem cell)**에서 나옵니다. 줄기세포는 여러 종류의 세포를 만들 수 있는 **다능성(pluripotent)** 세포입니다.\n\n**조혈줄기세포(hemopoietic stem cell)**는 자주 분열하여 다른 줄기세포를 만들 뿐 아니라, **두 세포 계열**을 만듭니다.\n- **림프계(lymphoid) 세포** → 결국 **림프구(lymphocytes)**\n- **골수계(myeloid) 세포** → 결국 **나머지 모든 혈구**","why":{"0":"적혈구계와 혈소판계는 모두 골수계(myeloid)에 속하는 하위 계열입니다.","1":"과립구계와 단핵구계는 골수계 안의 CFU-GM 계열입니다.","2":"B세포와 T세포는 모두 림프계에서 나옵니다.","4":"내피계와 간엽계는 조혈줄기세포의 두 계열이 아닙니다."},"one":"조혈줄기세포는 림프계(→림프구)와 골수계(→나머지 혈구) 두 계열을 만든다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 27","img":[{"u":"img/w12_blood/p27.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 27"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-32":{"q":"Hemopoietic progenitor cells are called colony-forming units (CFUs). Why?","o":["They are found only in the thymus.","They are bacterial colonies in the bone marrow.","They are fully differentiated cells that form colonies in blood.","They form colonies of many different cell types in culture.","When cultured, each cell produces a colony of a single cell type."],"a":4,"qk":"조혈 전구세포(progenitor cells)를 집락형성단위(CFU, colony-forming units)라고 부르는 이유는?","ok":["가슴샘에만 존재하기 때문이다.","골수 속의 세균 집락이기 때문이다.","완전히 분화된 세포로서 혈액에서 집락을 만들기 때문이다.","배양하면 여러 종류의 세포로 된 집락을 만들기 때문이다.","배양하면 각 세포가 한 종류의 세포로 된 집락을 만들기 때문이다."],"exp":"**전구세포(progenitor cells)**는 아직 다능성이지만 몇 가지 계열 중 하나로 **운명이 정해진(committed)** 세포로, 줄기세포보다 더 분화되어 있습니다.\n\n조혈세포에서는 이들을 **집락형성단위(CFUs)**라고 부르는데, **배양하면 각 세포가 한 종류의 세포로 된 집락(colony)을 만들기** 때문입니다.","why":{"0":"이 전구세포 집단은 골수(bone marrow)에 있습니다.","1":"CFU는 세균 집락이 아니라 조혈 전구세포입니다.","2":"전구세포는 줄기세포보다 분화했지만 완전히 분화된 세포가 아닙니다.","3":"각 CFU는 여러 종류가 아니라 한 종류의 세포로 된 집락을 만듭니다."},"one":"CFU는 배양하면 한 종류 세포의 집락을 만드는 조혈 전구세포이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w12_blood/p28.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-33":{"q":"Which progenitor population gives rise to the granulocyte-monocyte lineage?","o":["CFU-Meg","CFU-GM","CFU-E","CFU-L","Proerythroblast"],"a":1,"qk":"과립구-단핵구 계열(granulocyte-monocyte lineage)을 만드는 전구세포 집단은?","ok":["CFU-Meg","CFU-GM","CFU-E","CFU-L","전적혈모구(proerythroblast)"],"exp":"골수의 네 가지 주요 **전구세포(progenitor cell)** 집단은 이름에 계열이 드러나 있습니다.\n\n- **CFU-E** (Erythroid): 적혈구 계열\n- **CFU-Meg** (Megakaryocyte): 혈소판 계열\n- **CFU-GM** (Granulocyte-Monocyte): **과립구와 단핵구** 계열\n- **CFU-L** (Lymphoid): 림프 계열","why":{"0":"CFU-Meg는 거대핵세포·혈소판 계열입니다.","2":"CFU-E는 적혈구 계열입니다.","3":"CFU-L은 림프 계열입니다.","4":"전적혈모구(proerythroblast)는 적혈구 계열의 첫 형태학적 단계입니다."},"one":"골수의 4대 전구세포는 CFU-E·CFU-Meg·CFU-GM·CFU-L이고, 과립구-단핵구 계열은 CFU-GM이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w12_blood/p28.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 28"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-34":{"q":"What are colony-stimulating factors (CSFs)?","o":["Anticoagulants used to prepare plasma","Granule proteins that destroy bacteria","Hemopoietic growth factors that promote growth and further differentiation of precursor cells","Plasma proteins that maintain osmotic pressure","Enzymes that convert CO2 to bicarbonate"],"a":2,"qk":"집락자극인자(CSFs, colony-stimulating factors)란 무엇인가?","ok":["혈장을 얻을 때 쓰는 항응고제","세균을 파괴하는 과립 단백질","전구세포(precursor cells)의 성장과 추가 분화를 촉진하는 조혈 성장인자","삼투압을 유지하는 혈장 단백질","CO2를 중탄산으로 바꾸는 효소"],"exp":"각 전구세포(progenitor) 집단은 **precursor 세포(모세포 blasts)**를 만들고, 이들이 더 분화·성숙하여 특정 세포가 됩니다. precursor 세포의 각 발달 단계는 **형태(morphology)**로 구별할 수 있습니다.\n\n**집락자극인자(colony-stimulating factors, CSFs)**는 이 **precursor 세포의 성장과 추가 분화를 촉진하는 조혈 성장인자(hemopoietic growth factors)**입니다.","why":{"0":"항응고제는 혈액 응고를 막는 물질로 CSF와 관계없습니다.","1":"세균 파괴 과립 단백질은 호중구 과립의 골수세포과산화효소 등입니다.","3":"삼투압 유지는 알부민(albumin)의 역할입니다.","4":"CO2를 중탄산으로 바꾸는 효소는 탄산탈수효소(carbonic anhydrase)입니다."},"one":"집락자극인자(CSFs)는 precursor 세포의 성장과 분화를 촉진하는 조혈 성장인자이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w12_blood/p29.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 29"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-35":{"q":"During erythropoiesis, which change occurs, and what does erythropoietin stimulate?","o":["Cell and nuclear volumes decrease, chromatin density increases; erythropoietin stimulates globin production","Chromatin becomes less dense; erythropoietin stimulates platelet release","Cell volume increases; erythropoietin stimulates DNA replication","Polyribosomes increase; erythropoietin stimulates nucleus formation","Mitochondria multiply; erythropoietin stimulates granule formation"],"a":0,"qk":"적혈구생성(erythropoiesis) 중 일어나는 변화와, 적혈구생성인자(erythropoietin)가 자극하는 것은?","ok":["세포·핵 부피 감소, 염색질 밀도 증가; 적혈구생성인자는 글로빈(globin) 생산을 자극","염색질 밀도 감소; 적혈구생성인자는 혈소판 방출을 자극","세포 부피 증가; 적혈구생성인자는 DNA 복제를 자극","폴리리보솜 증가; 적혈구생성인자는 핵 형성을 자극","미토콘드리아 증가; 적혈구생성인자는 과립 형성을 자극"],"exp":"**적혈구생성(erythropoiesis)** 동안의 변화:\n- **세포와 핵의 부피가 점차 줄어듦**\n- **염색질 밀도(chromatin density) 증가**\n- **폴리리보솜(polyribosomes) 수 감소**, 미토콘드리아와 다른 세포소기관이 점차 사라짐\n\n**적혈구생성인자(erythropoietin)**는 헤모글로빈(hemoglobin)을 이루는 단백질인 **글로빈(globin)의 생산을 자극**합니다.","why":{"1":"염색질 밀도는 증가하며, 혈소판 방출은 거대핵세포의 일입니다.","2":"세포 부피는 증가하지 않고 감소합니다.","3":"폴리리보솜은 감소하며, 성숙 과정에서 세포는 결국 핵을 내보냅니다.","4":"미토콘드리아는 점차 사라지며, 적혈구에는 특수과립이 생기지 않습니다."},"one":"적혈구생성 중 세포·핵은 작아지고 염색질은 진해지며, 적혈구생성인자는 글로빈 생산을 자극한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 30","img":[{"u":"img/w12_blood/p30.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 30"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-36":{"q":"At which stage of erythropoiesis does the cell become acidophilic and eject its nucleus?","o":["Polychromatophilic erythroblast","Basophilic erythroblast","Orthochromatophilic erythroblast (normoblast)","Proerythroblast","Reticulocyte"],"a":2,"qk":"적혈구생성에서 세포가 호산성(acidophilic)이 되고 핵을 내보내는 단계는?","ok":["다염성적혈모구(polychromatophilic erythroblast)","호염기적혈모구(basophilic erythroblast)","정염성적혈모구(orthochromatophilic erythroblast, 정상적혈모구 normoblast)","전적혈모구(proerythroblast)","그물적혈구(reticulocyte)"],"exp":"적혈구 계열의 발달 단계 순서:\n\n1. **전적혈모구(proerythroblast)**: 큰 세포, 느슨한 염색질, 뚜렷한 핵소체, 호염기성 세포질\n2. **호염기적혈모구(basophilic erythroblast)**: 세포질이 더 호염기성, 핵이 더 응축, 핵소체 안 보임\n3. **다염성적혈모구(polychromatophilic erythroblast)**: 폴리리보솜 감소·헤모글로빈 증가로 호염기성과 호산성 부분이 섞임, 세포 크기 감소\n4. **정염성적혈모구(orthochromatophilic erythroblast, normoblast)**: **세포가 호산성이 되고 핵을 내보냄**\n5. **그물적혈구(reticulocyte)**: 남은 폴리리보솜 때문에 특정 염색에서 그물 모양, 혈류로 나가 며칠 뒤 성숙 적혈구가 됨","why":{"0":"다염성적혈모구는 호염기성과 호산성이 섞이는 단계입니다.","1":"호염기적혈모구는 세포질이 더 호염기성이고 핵이 응축되는 단계입니다.","3":"전적혈모구는 핵소체가 뚜렷한 첫 단계로, 아직 핵을 내보내지 않습니다.","4":"그물적혈구는 이미 핵을 내보낸 뒤의 단계입니다."},"one":"핵을 내보내는 단계는 정염성적혈모구(normoblast)이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w12_blood/p31.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-37":{"q":"Reticulocytes make up about what percentage of circulating red blood cells, and why do they look reticular with certain stains?","o":["About 1%, because of a Barr body","About 45%, because they contain hemoglobin","About 10%, because they still have a nucleus","About 25%, because of specific granules","About 1%, because of the continued presence of polyribosomes"],"a":4,"qk":"그물적혈구(reticulocytes)는 순환 적혈구의 약 몇 %이며, 특정 염색에서 그물 모양으로 보이는 이유는?","ok":["약 1%, 바소체 때문에","약 45%, 헤모글로빈이 있어서","약 10%, 아직 핵이 있어서","약 25%, 특수과립 때문에","약 1%, 폴리리보솜(polyribosomes)이 계속 남아 있어서"],"exp":"**그물적혈구(reticulocytes)**는 핵을 내보낸 뒤의 단계입니다. **폴리리보솜(polyribosomes)이 계속 남아 있기 때문에** 특정 염색에서 세포질이 **그물(reticular) 모양**으로 보입니다.\n\n그물적혈구는 혈류로 들어가 **며칠 안에 성숙 적혈구**가 되며, **순환 적혈구의 약 1%**를 차지합니다.","why":{"0":"1%는 맞지만, 바소체(Barr body)는 여성 호중구 핵의 부속물입니다.","1":"45%는 적혈구용적률(hematocrit)이고, 그물 모양은 헤모글로빈 때문이 아닙니다.","2":"그물적혈구는 이미 핵을 내보낸 상태입니다.","3":"적혈구 계열에는 특수과립이 없습니다."},"one":"그물적혈구는 순환 적혈구의 약 1%이며, 남은 폴리리보솜 때문에 그물 모양으로 보인다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31","img":[{"u":"img/w12_blood/p31.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 31"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-38":{"q":"In granulopoiesis, at which stage do specific granules first appear?","o":["Myelocyte","Myeloblast","Metamyelocyte","Band cell","Promyelocyte"],"a":0,"qk":"과립구생성(granulopoiesis)에서 특수과립(specific granules)이 처음 나타나는 단계는?","ok":["골수세포(myelocyte)","골수모세포(myeloblast)","후골수세포(metamyelocyte)","띠세포(band cell)","전골수세포(promyelocyte)"],"exp":"**과립구생성(granulopoiesis)**은 세 종류 과립백혈구 모두에서 **아주르친화과립(azurophilic granules)이 먼저 생기고**, 그다음 각 세포에 고유한 **특수과립(specific granules)**이 생기는 것이 특징입니다.\n\n단계:\n1. **골수모세포(myeloblast)**: 고르게 퍼진 염색질, 희미한 핵소체\n2. **전골수세포(promyelocyte)**: 호염기성 세포질, **아주르친화과립**\n3. **골수세포(myelocyte)**: **특수과립이 나타남**\n4. **후골수세포(metamyelocyte)**: 특수과립이 세포질 대부분을 채움\n5. **띠세포(band cell)**: 핵이 길고 휘어진 상태, 엽으로 나뉘기 전(호중구에서 가장 뚜렷)","why":{"1":"골수모세포는 염색질이 고르게 퍼진 첫 단계로 아직 과립이 없습니다.","2":"후골수세포에서는 이미 생긴 특수과립이 세포질 대부분을 채웁니다.","3":"띠세포는 핵이 엽으로 나뉘기 직전 단계입니다.","4":"전골수세포에서는 아주르친화과립이 생기고, 특수과립은 아직입니다."},"one":"과립구생성에서 아주르친화과립은 전골수세포, 특수과립은 골수세포 단계에서 처음 나타난다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 32, 33","img":[{"u":"img/w12_blood/p32.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 32"},{"u":"img/w12_blood/p33.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 33"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-39":{"q":"In monocytopoiesis, which statement is correct?","o":["Monocytes lack azurophilic granules and RER.","The monoblast is virtually identical morphologically to the myeloblast.","Monocytes eject their nucleus before entering the blood.","The promonocyte is a small acidophilic cell with no nucleolus.","Monocytes mature in the thymus into T cells."],"a":1,"qk":"단핵구생성(monocytopoiesis)에 대해 옳은 것은?","ok":["단핵구에는 아주르친화과립과 RER이 없다.","단핵모세포(monoblast)는 형태상 골수모세포(myeloblast)와 거의 같다.","단핵구는 혈액에 들어가기 전에 핵을 내보낸다.","전단핵구(promonocyte)는 핵소체가 없는 작은 호산성 세포이다.","단핵구는 가슴샘에서 T세포로 성숙한다."],"exp":"**단핵구생성(monocytopoiesis)**의 단계:\n\n1. **단핵모세포(monoblast)**: 형태상 **골수모세포(myeloblast)와 거의 같음**\n2. **전단핵구(promonocyte)**: 크고 호염기성인 세포, 약간 움푹한 핵, 레이스 같은 염색질, 보이는 핵소체\n3. **단핵구(monocytes)**: 아주르친화과립, 발달한 RER과 골지체(Golgi). **조직에서 대식세포(macrophages)로 성숙**","why":{"0":"단핵구에는 아주르친화과립과 발달한 RER·골지체가 있습니다.","2":"핵을 내보내는 것은 적혈구 계열이며, 단핵구는 핵을 가집니다.","3":"전단핵구는 크고 호염기성이며 핵소체가 보입니다.","4":"단핵구는 조직에서 대식세포로 성숙하며, T세포는 림프 계열입니다."},"one":"단핵모세포는 골수모세포와 형태가 거의 같고, 단핵구는 조직에서 대식세포로 성숙한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 34","img":[{"u":"img/w12_blood/p34.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 34"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-40":{"q":"Where do T lymphocytes mature?","o":["They mature entirely in the bone marrow.","They mature in the spleen from monocytes.","They mature in the yolk sac.","They come from bone marrow but must go to the thymus to mature.","They mature in the liver during adult life."],"a":3,"qk":"T 림프구는 어디에서 성숙하는가?","ok":["전적으로 골수에서 성숙한다.","지라에서 단핵구로부터 성숙한다.","난황주머니에서 성숙한다.","골수에서 나오지만 가슴샘(thymus)으로 가야 성숙한다.","성인기에 간에서 성숙한다."],"exp":"**림프구생성(lymphopoiesis)**: **모든 림프구는 골수(bone marrow)에서 나오지만, T 림프구는 가슴샘(thymus)으로 가야 성숙합니다.**\n\n성숙하면서 **핵이 작아지고 핵소체가 덜 보이며**, 세포 전체 크기도 줄어듭니다. **림프모세포(lymphoblast)**는 여러 번 유사분열하며 점점 작아지고, 성숙 림프구인 T세포, B세포(그리고 NK세포)가 됩니다.","why":{"0":"골수에서 나오는 것은 맞지만, T 림프구는 가슴샘에서 성숙해야 합니다.","1":"림프구는 단핵구에서 나오지 않으며, 림프 계열은 골수계와 다릅니다.","2":"난황주머니는 초기 배아의 조혈 장소입니다.","4":"성인의 조혈은 골수에서 일어나며, T세포 성숙은 가슴샘에서 일어납니다."},"one":"모든 림프구는 골수에서 나오지만 T 림프구는 가슴샘에서 성숙한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 35","img":[{"u":"img/w12_blood/p35.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 35"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-41":{"q":"In thrombopoiesis, how are platelets released?","o":["Proplatelet extensions of megakaryocytes pinch off to release platelets into the sinusoids of bone marrow.","Platelets form by mitotic division of mature platelets in blood.","Megakaryoblasts eject their nuclei to become platelets.","Platelets bud from the surface of reticulocytes.","Monocytes fragment in the spleen to form platelets."],"a":0,"qk":"혈소판생성(thrombopoiesis)에서 혈소판은 어떻게 방출되는가?","ok":["거대핵세포의 돌기인 전혈소판(proplatelets)이 떨어져 나가 골수 굴모세혈관(sinusoids)으로 혈소판을 방출한다.","혈액 속 성숙 혈소판이 유사분열하여 생긴다.","거대핵모세포가 핵을 내보내고 혈소판이 된다.","그물적혈구 표면에서 혈소판이 싹튼다.","단핵구가 지라에서 조각나 혈소판이 된다."],"exp":"**혈소판생성(thrombopoiesis)**: 거대핵세포(megakaryocytes)는 **거대핵모세포(megakaryoblasts)**라는 precursor에서 발달하며, 이들은 **다배수체 핵(polyploid nuclei)**을 가진 매우 큰 세포입니다.\n\n거대핵세포의 돌기인 **전혈소판(proplatelets)**이 **떨어져 나가며(pinch off)** **골수의 굴모세혈관(sinusoids)**으로 혈소판을 방출합니다. 그래서 혈소판은 핵이 없는 세포 조각입니다.","why":{"1":"혈소판은 핵이 없어 분열하지 않습니다.","2":"혈소판은 핵을 내보낸 세포가 아니라 거대핵세포의 세포질 조각입니다.","3":"그물적혈구는 적혈구 계열이며 혈소판을 만들지 않습니다.","4":"단핵구는 대식세포로 성숙하며 혈소판을 만들지 않습니다."},"one":"거대핵세포의 전혈소판이 떨어져 나가 골수 굴모세혈관으로 혈소판을 방출한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 36, 37","img":[{"u":"img/w12_blood/p36.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 36"},{"u":"img/w12_blood/p37.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 37"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_sleep_apnea-1":{"q":"In which stage of sleep does the brain begin to produce sleep spindles, with body temperature dropping and heart rate slowing?","o":["NREM stage 3","Wakefulness","NREM stage 1","REM sleep","NREM stage 2"],"a":4,"qk":"뇌가 수면방추(sleep spindles)를 만들기 시작하고, 체온이 떨어지며 심박수가 느려지는 수면 단계는?","ok":["비렘수면 3단계(NREM stage 3)","깨어 있는 상태","비렘수면 1단계(NREM stage 1)","렘수면(REM sleep)","비렘수면 2단계(NREM stage 2)"],"exp":"수면의 네 단계를 정리합니다.\n\n- **비렘수면 1단계(NREM stage 1)**: 깨어 있음과 수면 사이의 전환기, 약 5–10분\n- **비렘수면 2단계(NREM stage 2)**: **체온이 떨어지고 심박수가 느려지며**, 뇌가 **수면방추(sleep spindles)**를 만들기 시작함, 약 20분\n- **비렘수면 3단계(NREM stage 3)**: 근육 이완, 혈압과 호흡수 감소, **가장 깊은 수면**\n- **렘수면(REM sleep)**: 뇌 활동 증가, 몸은 이완·부동, 꿈, 빠른 눈 움직임\n\n2단계의 수면방추는 기억이 단기에서 장기 기억으로 처리되는 과정, 즉 학습에 중요할 수 있다고 여겨집니다.","why":{"0":"3단계는 근육이 이완되고 혈압·호흡수가 떨어지는 가장 깊은 수면입니다.","1":"수면방추는 수면 중, 특히 비렘수면 2단계의 특징입니다.","2":"1단계는 깨어 있음과 수면 사이의 짧은 전환기(5–10분)입니다.","3":"렘수면은 꿈과 빠른 눈 움직임이 특징이며, 수면방추가 시작되는 단계가 아닙니다."},"one":"수면방추(sleep spindles)는 비렘수면 2단계에서 나타나며 학습·기억에 중요할 수 있다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4","img":[{"u":"img/w12_sleep_apnea/p04.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-2":{"q":"Which stage of sleep is described as the deepest sleep, with relaxed muscles and dropping blood pressure and breathing rate?","o":["The transition period","NREM stage 2","NREM stage 1","NREM stage 3","REM sleep"],"a":3,"qk":"근육이 이완되고 혈압과 호흡수가 떨어지는 가장 깊은 수면으로 설명되는 단계는?","ok":["전환기","비렘수면 2단계","비렘수면 1단계","비렘수면 3단계","렘수면"],"exp":"**비렘수면 3단계(NREM stage 3)**는 **가장 깊은 수면(deepest sleep)**입니다. **근육이 이완되고, 혈압과 호흡수가 떨어집니다.** 몸이 조직을 치유하고 새 세포를 만드는 시기로도 설명됩니다.\n\n반면 **렘수면(REM sleep)**은 꿈을 꾸는 시기이자 학습과 기억 능력과 연결된 단계입니다. 렘수면 동안 뇌는 중요한 정보와 중요하지 않은 정보를 가려 **장기 기억**으로 정리하며, 이 단계가 부족하면 집중력과 예민함이 떨어지고 짜증이 늘 수 있습니다.","why":{"0":"전환기는 1단계를 말하며 가장 얕은 단계입니다.","1":"2단계는 체온·심박수가 떨어지고 수면방추가 시작되는 단계입니다.","2":"1단계는 깨어 있음과 수면 사이의 전환기입니다.","4":"렘수면은 뇌가 더 활발하고 꿈을 꾸는 단계로, 가장 깊은 수면으로 제시되지 않습니다."},"one":"가장 깊은 수면은 비렘수면 3단계이고, 렘수면은 꿈과 장기 기억 정리의 단계이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4, 5","img":[{"u":"img/w12_sleep_apnea/p04.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 4"},{"u":"img/w12_sleep_apnea/p05.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 5"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-3":{"q":"How is sleep apnea defined?","o":["Snoring louder than talking, with no change in oxygen","Breathing cessation or airflow reduction lasting ≥10 s, occurring >5 times per hour of sleep, associated with cortical arousals and/or oxygen desaturation","Any awakening during the night for more than 5 minutes","Airflow reduction lasting ≥2 s, occurring >30 times per hour","Breathing cessation lasting ≥60 s, occurring once per night"],"a":1,"qk":"수면무호흡(sleep apnea)은 어떻게 정의되는가?","ok":["말소리보다 큰 코골이가 있고 산소 변화는 없는 것","10초 이상 지속되는 호흡 정지 또는 기류 감소가 수면 1시간당 5회 넘게 일어나며, 피질 각성 및/또는 산소포화도 저하를 동반하는 것","밤중에 5분 이상 깨는 모든 경우","2초 이상의 기류 감소가 시간당 30회 넘게 일어나는 것","60초 이상 호흡이 멈추는 일이 하룻밤에 한 번 있는 것"],"exp":"**수면무호흡(sleep apnea)**의 정의:\n\n- **호흡 정지(무호흡, apnea)** 또는 **기류 감소(저호흡, hypopnea)**가\n- **10초 이상** 지속되고\n- **수면 1시간당 5회 넘게** 일어나며\n- 호흡을 회복하기 위한 **피질 수면 각성(cortical sleep arousals)** 및/또는 **산소포화도 저하(oxygen desaturation)**를 동반하는 것\n\n숫자 \"10초, 시간당 5회\"를 꼭 기억하세요.","why":{"0":"코골이는 증상일 뿐이며, 정의에는 호흡 정지·감소와 각성 또는 산소포화도 저하가 들어갑니다.","2":"단순히 깨어나는 것은 수면무호흡의 정의가 아닙니다.","3":"지속 시간 기준은 2초가 아니라 10초 이상입니다.","4":"지속 시간 기준은 10초 이상이며, 빈도는 시간당 5회 초과입니다."},"one":"수면무호흡은 10초 이상의 무호흡·저호흡이 시간당 5회 넘게, 각성 또는 산소포화도 저하와 함께 일어나는 것이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 6","img":[{"u":"img/w12_sleep_apnea/p06.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 6"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-4":{"q":"In the definitions of sleep-related breathing disorders, what is a hypopnea?","o":["Reduction of airflow with resultant oxygen desaturation of ≥4%","The average number of apnea and hypopnea events per hour","An AHI of 30 or more","Cessation of airflow for at least 10 seconds","Respiratory events without inspiratory effort"],"a":0,"qk":"수면 관련 호흡장애의 정의에서 저호흡(hypopnea)이란 무엇인가?","ok":["기류 감소와 그로 인한 4% 이상의 산소포화도 저하","시간당 무호흡과 저호흡 사건의 평균 횟수","AHI 30 이상","10초 이상의 기류 정지","흡기 노력 없이 일어나는 호흡 사건"],"exp":"수면 관련 호흡장애(sleep-related breathing disorders)의 정의 표입니다.\n\n- **무호흡(apnea)**: **10초 이상 기류 정지(cessation of airflow)**\n- **저호흡(hypopnea)**: **기류 감소(reduction of airflow)와 그로 인한 4% 이상의 산소포화도 저하**\n- **무호흡-저호흡 지수(apnea-hypopnea index, AHI)**: 수면 1시간당 무호흡과 저호흡 사건의 평균 횟수\n- **폐쇄성 수면무호흡(OSA)**: AHI 15 이상, 또는 AHI 5 이상과 관련 증상(낮 졸림, 인지 저하, 기분장애, 불면, 고혈압, 심장병, 뇌졸중 병력)\n- **중추성 수면무호흡(CSA)**: AHI 5 이상, 또는 호흡 사건의 50% 이상이 흡기 노력 없이 일어남","why":{"1":"시간당 무호흡·저호흡 평균 횟수는 AHI입니다.","2":"AHI 30 이상은 중증(severe) 기준입니다.","3":"10초 이상의 기류 정지는 무호흡(apnea)의 정의입니다.","4":"흡기 노력이 없는 호흡 사건은 중추성 수면무호흡(CSA)의 특징입니다."},"one":"저호흡(hypopnea)은 기류 감소와 그로 인한 4% 이상의 산소포화도 저하이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7","img":[{"u":"img/w12_sleep_apnea/p07.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-5":{"q":"What distinguishes predominantly obstructive sleep apnea from central sleep apnea?","o":["The patient's body mass index","The duration of each apnea","The presence of inspiratory (respiratory) effort during apneas and hypopneas","The loudness of snoring alone","The total sleep time"],"a":2,"qk":"주로 폐쇄성인 수면무호흡(OSA)과 중추성 수면무호흡(CSA)을 구별하는 것은?","ok":["환자의 체질량지수","각 무호흡의 지속 시간","무호흡·저호흡 동안 흡기(호흡) 노력이 있는지 여부","코골이 소리의 크기만","총 수면 시간"],"exp":"정의 표 아래 주석의 핵심: **무호흡과 저호흡 동안 흡기 노력(inspiratory effort)이 있느냐**가 주로 폐쇄성인 수면무호흡과 중추성 수면무호흡을 구별합니다.\n\n- **폐쇄성(OSA)**: 기도가 막혀 공기가 못 들어가지만 **숨을 쉬려는 노력은 계속**됩니다.\n- **중추성(CSA)**: 뇌가 호흡근을 활성화하지 못해 **노력 자체가 없습니다**.\n\n그래서 수면다원검사(polysomnography)에서 **호흡 노력(respiratory effort), 즉 가슴과 배의 움직임**을 측정하는 것이 CSA와 OSA를 구별하는 열쇠입니다.","why":{"0":"비만은 OSA의 위험인자이지만 두 유형을 구별하는 기준이 아닙니다.","1":"두 유형 모두 정의상 10초 이상의 사건이므로 지속 시간으로 구별하지 않습니다.","3":"코골이 크기만으로는 두 유형을 구별할 수 없습니다.","4":"총 수면 시간은 두 유형을 구별하지 못합니다."},"one":"OSA와 CSA는 사건 동안 흡기 노력(가슴·배 움직임)이 있는지로 구별한다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7, 37","img":[{"u":"img/w12_sleep_apnea/p07.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 7"},{"u":"img/w12_sleep_apnea/p37.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 37"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-6":{"q":"A 48-year-old adult has an apnea-hypopnea index (AHI) of 22 events per hour of sleep. How is the severity classified?","o":["Moderate","Mild","Normal","Cannot be classified by AHI","Severe"],"a":0,"qk":"48세 성인의 무호흡-저호흡 지수(AHI)가 수면 1시간당 22회이다. 중증도는 어떻게 분류되는가?","ok":["중등도(moderate)","경증(mild)","정상(normal)","AHI로는 분류할 수 없다","중증(severe)"],"exp":"성인의 **AHI(수면 1시간당 사건 수)**에 따른 중증도 분류:\n\n- **정상(normal)**: AHI < 5\n- **경증(mild)**: 5 ≤ AHI < 15\n- **중등도(moderate)**: **15 ≤ AHI < 30**\n- **중증(severe)**: AHI ≥ 30\n\nAHI 22는 15 이상 30 미만이므로 **중등도(moderate)**입니다. 경계값 5, 15, 30을 기억하세요.","why":{"1":"경증은 AHI 5 이상 15 미만입니다.","2":"정상은 AHI 5 미만입니다.","3":"성인의 수면무호흡 중증도는 AHI로 분류합니다.","4":"중증은 AHI 30 이상입니다."},"one":"성인 AHI: 5 미만 정상, 5–15 경증, 15–30 중등도, 30 이상 중증이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 8","img":[{"u":"img/w12_sleep_apnea/p08.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 8"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-7":{"q":"Apneas and hypopneas lead to sleep fragmentation, hypoxemia, and negative intrathoracic pressure. Which consequence is listed under endocrinopathy?","o":["Pulmonary hypertension","Crashes","Arrhythmia","Diabetes mellitus and insulin resistance","Cognitive dysfunction"],"a":3,"qk":"무호흡·저호흡은 수면 분절, 저산소혈증, 음성 흉곽내압을 일으킨다. 내분비병증(endocrinopathy)으로 분류된 결과는?","ok":["폐고혈압(pulmonary hypertension)","사고(crashes)","부정맥(arrhythmia)","당뇨병(DM)과 인슐린 저항성(insulin resistance)","인지 기능 장애"],"exp":"무호흡/저호흡(apnea/hypopnea)은 **수면 분절(sleep fragmentation)**, **저산소혈증(hypoxemia)**, **음성 흉곽내압(negative intrathoracic pressure)**을 일으킵니다.\n\n이것이 교감신경 급증(sympathetic surge), 심혈관계에 대한 혈역학적 영향, 산화 스트레스(oxidative stress), 염증, 내피 기능장애(endothelial dysfunction), 과응고성(hypercoagulability), 내분비 조절장애(endocrine dysregulation)로 이어지고, 결과는 네 묶음입니다.\n\n- **졸림(sleepiness)**: 사고(crashes), 삶의 질 저하\n- **신경인지 영향(neurocognitive effects)**: 인지 기능, 실행 기능 저하\n- **심혈관 질환(cardiovascular disease)**: 고혈압, 관상동맥질환(CAD), 심부전(CHF), 부정맥, 뇌졸중(CVA), 폐고혈압\n- **내분비병증(endocrinopathy)**: **당뇨병(DM), 인슐린 저항성**","why":{"0":"폐고혈압은 심혈관 질환에 속합니다.","1":"사고(crashes)는 졸림(sleepiness)의 결과입니다.","2":"부정맥은 심혈관 질환에 속합니다.","4":"인지 기능 장애는 신경인지 영향에 속합니다."},"one":"수면무호흡의 내분비병증 결과는 당뇨병과 인슐린 저항성이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 9","img":[{"u":"img/w12_sleep_apnea/p09.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 9"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-8":{"q":"Which is listed among the symptoms of sleep apnea, and what fraction of people with sleep apnea don't know they have it?","o":["Nocturia; about 10%","Nocturia; about 90%","Fever; about 10%","Weight loss; about 50%","Increased appetite; about 25%"],"a":1,"qk":"수면무호흡의 증상으로 제시된 것과, 수면무호흡 환자 중 자신이 병을 가진 줄 모르는 비율은?","ok":["야간뇨; 약 10%","야간뇨(nocturia); 약 90%","발열; 약 10%","체중 감소; 약 50%","식욕 증가; 약 25%"],"exp":"수면무호흡 증상(sleep apnea symptoms)은 고리 모양으로 이어집니다: **불면(insomnia), 코골이(snoring), 입·목 마름(dry mouth/throat), 아침 두통(morning headache), 기억력 저하(memory loss), 주의력 결핍(attention deficit), 우울·기분 변화(depression/moody), 피로(fatigue), 야간뇨(nocturia), 발기부전(impotence)**.\n\n그리고 **수면무호흡 환자의 90%는 자신이 그 병을 가진 줄 모릅니다.** 그래서 치과의사의 선별(screening)이 중요합니다.","why":{"0":"야간뇨는 맞지만, 모르는 사람의 비율은 10%가 아니라 90%입니다.","2":"발열은 수면무호흡 증상으로 제시되지 않고, 비율도 90%입니다.","3":"체중 감소는 증상으로 제시되지 않으며, 오히려 비만이 위험인자입니다.","4":"식욕 증가는 증상 목록에 없고, 비율은 90%입니다."},"one":"수면무호흡 증상에는 야간뇨·아침 두통·입마름 등이 있고, 환자의 90%는 자신이 병을 가진 줄 모른다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 10, 11","img":[{"u":"img/w12_sleep_apnea/p10.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 10"},{"u":"img/w12_sleep_apnea/p11.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 11"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-9":{"q":"What are the three types of sleep apnea?","o":["Acute, chronic, and recurrent","Central, peripheral, and spinal","Obstructive, restrictive, and reactive","Mild, moderate, and severe","Obstructive, central, and mixed/complex"],"a":4,"qk":"수면무호흡의 세 가지 유형은?","ok":["급성, 만성, 재발성","중추성, 말초성, 척수성","폐쇄성, 제한성, 반응성","경증, 중등도, 중증","폐쇄성(obstructive), 중추성(central), 혼합성/복합성(mixed/complex)"],"exp":"수면무호흡의 **세 가지 유형**(별표 항목)은 다음과 같습니다.\n\n- **폐쇄성 수면무호흡(obstructive sleep apnea, OSA)**: 수면 중 **기도가 허탈(collapse)**되어 생김\n- **중추성 수면무호흡(central sleep apnea, CSA)**: 수면 중 **뇌가 호흡근을 활성화하지 못해** 생김\n- **혼합성/복합성 수면무호흡(mixed/complex sleep apnea)**: 두 가지가 함께 있음\n\n경증·중등도·중증은 유형이 아니라 AHI에 따른 **중증도** 분류입니다.","why":{"0":"급성·만성·재발성은 수면무호흡 유형 분류가 아닙니다.","1":"말초성·척수성 수면무호흡이라는 유형은 제시되지 않습니다.","2":"제한성·반응성은 수면무호흡의 유형이 아닙니다.","3":"경증·중등도·중증은 AHI에 따른 중증도 분류입니다."},"one":"수면무호흡의 세 유형은 폐쇄성(OSA), 중추성(CSA), 혼합성/복합성이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 12, 51","img":[{"u":"img/w12_sleep_apnea/p12.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 12"},{"u":"img/w12_sleep_apnea/p51.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-10":{"q":"In central sleep apnea with a chronic increase in blood CO2, what breathing pattern results?","o":["Wheezing with prolonged expiration","A single long apnea each night","Repetitive cycles of fast breathing followed by slow breathing and apnea (Cheyne-Stokes breathing)","Continuous rapid shallow breathing without pauses","Breathing that stops only when the airway collapses"],"a":2,"qk":"혈중 CO2가 만성적으로 높은 중추성 수면무호흡에서는 어떤 호흡 양상이 나타나는가?","ok":["호기가 길어진 쌕쌕거림","매일 밤 한 번의 긴 무호흡","빠른 호흡 뒤 느린 호흡과 무호흡이 반복되는 주기(체인-스토크스 호흡, Cheyne-Stokes breathing)","멈춤 없이 빠르고 얕은 호흡이 계속된다","기도가 허탈될 때만 멈추는 호흡"],"exp":"혈중 CO2가 **만성적으로(chronic)** 높아지면 뇌는 결국 산소 수치를 무시하고 **혈중 CO2 수치를 감시하여 다음 호흡을 결정**합니다. CO2에 대한 내성(tolerance)이 커진 상태입니다.\n\n그래서 다음과 같은 고리가 생깁니다.\n1. 호흡이 느려지거나 멈춤 → 2. CO2가 혈액에 쌓임 → 3. 호흡수가 증가 → 4. CO2가 너무 떨어짐 → 5. 호흡 욕구와 호흡수가 감소 → 다시 1로\n\n결과적으로 **빠른 호흡 뒤 느린 호흡과 무호흡이 반복되는 주기**가 나타나며, 이것이 **체인-스토크스 호흡(Cheyne-Stokes breathing)**입니다.","why":{"0":"호기가 긴 쌕쌕거림은 천식(asthma)의 소견입니다.","1":"한 번의 긴 무호흡이 아니라 빠름-느림-무호흡의 반복 주기입니다.","3":"이 양상은 멈춤이 끼어 있는 주기적 호흡입니다.","4":"기도 허탈로 호흡이 멈추는 것은 폐쇄성 수면무호흡(OSA)입니다."},"one":"만성 고CO2 상태의 중추성 수면무호흡에서는 빠름-느림-무호흡이 반복되는 체인-스토크스 호흡이 나타난다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 13, 14","img":[{"u":"img/w12_sleep_apnea/p13.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 13"},{"u":"img/w12_sleep_apnea/p14.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 14"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-11":{"q":"How is central sleep apnea treated?","o":["In infants by tracheostomy in all cases","In adults by uvulopalatopharyngoplasty","In adults by oral appliance therapy only","It is never treated because all patients outgrow it","In adults by treating the underlying heart disease, medication interaction, high altitude or other primary problem; in infants with an apnea alarm"],"a":4,"qk":"중추성 수면무호흡(CSA)은 어떻게 치료하는가?","ok":["영아는 모든 경우 기관절개술로","성인은 목젖입천장인두성형술(UPPP)로","성인은 구강장치 치료만으로","모든 환자가 자라면서 좋아지므로 치료하지 않는다","성인은 원인이 되는 심장병, 약물 상호작용, 고지대, 기타 일차 문제를 치료하고, 영아는 무호흡 경보기(apnea alarm)로"],"exp":"**중추성 수면무호흡(CSA)의 치료**(별표 항목):\n\n- **성인**: **원인이 되는 심장병(heart disease), 약물 상호작용(medication interaction), 고지대(high altitude), 기타 일차 문제**를 치료합니다. 뇌의 호흡 신호 문제이므로 원인을 다루는 것이 핵심입니다.\n- **영아**(대개 미숙아나 기타 선천 질환): **무호흡 경보기(apnea alarm)**로 관리합니다. 대부분의 영아는 선천 문제가 없는 한 CSA 발작에서 **자라면서 벗어납니다(outgrow)**.","why":{"0":"영아는 무호흡 경보기로 관리하며, 대부분 자라면서 좋아집니다.","1":"UPPP는 OSA의 수술적 치료입니다.","2":"구강장치는 주로 기도의 해부학적 문제를 다루는 OSA 치료입니다.","3":"대부분의 영아가 자라면서 좋아지는 것이지, 성인을 포함한 모든 환자가 그런 것은 아닙니다."},"one":"CSA는 성인에서는 원인 질환을, 영아에서는 무호흡 경보기로 다루며 영아는 대개 자라면서 좋아진다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 15","img":[{"u":"img/w12_sleep_apnea/p15.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 15"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-12":{"q":"What is the sequence of events in obstructive sleep apnea?","o":["The brain stops sending signals → no breathing effort → CO2 builds up","Bronchial smooth muscle spasms → wheezing → mucus plugs","The airway collapses or becomes obstructed → unsuccessful effort to breathe → blood oxygen drops → the brain awakens to a shallower sleep level and signals a gasp of air","The tongue moves forward → the airway widens → snoring stops","Blood oxygen drops first → the airway then collapses → the patient sleeps more deeply"],"a":2,"qk":"폐쇄성 수면무호흡(OSA)에서 일어나는 사건의 순서는?","ok":["뇌가 신호를 보내지 않음 → 호흡 노력 없음 → CO2 축적","기관지 평활근 연축 → 쌕쌕거림 → 점액 마개","기도가 허탈되거나 막힘 → 숨쉬려는 노력이 실패 → 혈중 산소 저하 → 뇌가 얕은 수면으로 깨어나 숨(헐떡임)을 쉬라고 신호","혀가 앞으로 움직임 → 기도가 넓어짐 → 코골이가 멈춤","혈중 산소가 먼저 떨어짐 → 그다음 기도가 허탈 → 더 깊이 잠듦"],"exp":"**폐쇄성 수면무호흡(OSA)**이 무엇이고 왜 생기는지(별표 항목):\n\n1. **기도가 허탈되거나 막힘(airway collapses or becomes obstructed)**\n2. **숨을 쉬려는 노력이 실패(unsuccessful effort to take a breath)**\n3. **혈중 산소 저하(blood oxygen levels drop)**\n4. **뇌가 더 얕은 수면 단계로 깨어나**, 몸에 깨어나 숨을 쉬라는 신호를 보냄(헐떡임, gasp of air)\n\n이 과정이 밤새 반복되어 수면이 조각나고 낮 졸림이 생깁니다.","why":{"0":"뇌가 신호를 보내지 않아 노력이 없는 것은 중추성 수면무호흡(CSA)입니다.","1":"평활근 연축과 점액 마개는 천식(asthma)의 병태생리입니다.","3":"혀가 앞으로 나와 기도가 넓어지는 것은 구강장치가 노리는 효과이지 OSA의 과정이 아닙니다.","4":"기도 폐쇄가 먼저이고 산소 저하는 그 결과이며, 환자는 더 얕은 수면으로 깨어납니다."},"one":"OSA: 기도 허탈 → 호흡 노력 실패 → 산소 저하 → 얕은 수면으로 각성해 헐떡이며 숨쉼.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 16","img":[{"u":"img/w12_sleep_apnea/p16.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 16"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-13":{"q":"Which is part of the dentist's role in obstructive sleep apnea?","o":["Treating central sleep apnea with oral appliances","Screening for OSA risk factors, referring to an appropriate health professional, and providing oral appliance therapy with regular dental and sleep medical follow-up","Diagnosing OSA independently without a sleep physician","Prescribing CPAP pressures without a sleep study","Performing tracheostomy in the dental office"],"a":1,"qk":"폐쇄성 수면무호흡(OSA)에서 치과의사의 역할에 해당하는 것은?","ok":["중추성 수면무호흡을 구강장치로 치료한다","OSA 위험인자를 선별하고, 적절한 의료인에게 의뢰하며, 정기적인 치과·수면의학 추적과 함께 구강장치 치료를 제공한다","수면 전문의 없이 단독으로 OSA를 진단한다","수면검사 없이 CPAP 압력을 처방한다","치과에서 기관절개술을 시행한다"],"exp":"**치과의사의 역할(the dentist role)**:\n- **OSA 위험인자 선별(screening)**\n- 필요하면 **적절한 의료인에게 의뢰(referring)**\n- **구강장치 치료(oral appliance therapy)**를 제공하고, 이후 **정기적인 치과 및 수면의학 추적(follow-up)**\n\n수면의학 치과의사의 주요 역할을 더 자세히 보면: 위험인자 선별, 예방을 위한 수면 위생·건강 조언, 권고될 때 구강장치 치료, **적정(titration)이 성공했는지 객관적으로 평가받도록 수면 전문의에게 의뢰**, 그리고 수면 이갈이·턱관절장애를 다룰 때 불면·두통·위식도역류 등 OSA와 동반되는 다른 질환을 배제하는 것입니다.","why":{"0":"구강장치는 주로 해부학적 기도 문제, 즉 OSA를 다룹니다.","2":"진단과 객관적 평가는 수면 전문의에게 의뢰하는 것이 치과의사의 역할입니다.","3":"CPAP는 의료적 치료이며, 치과의사의 역할은 선별·의뢰·구강장치입니다.","4":"기관절개술은 치과의사의 역할로 제시되지 않습니다."},"one":"치과의사의 OSA 역할은 선별, 의뢰, 그리고 추적 관리가 동반된 구강장치 치료이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 17, 27, 3","img":[{"u":"img/w12_sleep_apnea/p17.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 17"},{"u":"img/w12_sleep_apnea/p27.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 27"},{"u":"img/w12_sleep_apnea/p03.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 3"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-14":{"q":"When a dentist screens for OSA risk factors, which group lists oral/craniofacial findings?","o":["Gingival recession, attrition only on incisors, fluorosis","Low Mallampati score, prognathism, small tongue","Clubbing, cyanosis, pedal edema","Retrognathia, high arched palate, enlarged tonsils or tongue, enlarged tori, high Mallampati score","Short face, wide nasal passages, small tonsils"],"a":3,"qk":"치과의사가 OSA 위험인자를 선별할 때, 구강·두개안면 소견으로 묶인 것은?","ok":["잇몸 퇴축, 앞니만의 교모, 반상치","낮은 말람파티 점수, 하악전돌, 작은 혀","곤봉지, 청색증, 발 부종","하악후퇴(retrognathia), 높은 아치형 입천장, 커진 편도나 혀, 커진 골융기(tori), 높은 말람파티 점수","짧은 얼굴, 넓은 비강, 작은 편도"],"exp":"치과의사의 **OSA 위험인자 선별(screening OSA risk factors)** 항목은 두 묶음입니다.\n\n- **구강·두개안면 소견**: **하악후퇴(retrognathia)**, **높은 아치형 입천장(high arched palate)**, **커진 편도나 혀(enlarged tonsils or tongue)**, **커진 골융기(enlarged tori)**, **높은 말람파티 점수(high Mallampati score)**\n- **병력·전신 요인**: 수면 불량, 바로 누운 수면 자세(supine sleep position), 비만(obesity), 고혈압(hypertension), 아침 두통이나 구강안면 통증, 이갈이(bruxism)\n\n공통점은 모두 **상기도를 좁게 만드는 요인**이라는 것입니다.","why":{"0":"잇몸 퇴축·반상치는 OSA 위험인자 목록에 없습니다.","1":"위험인자는 높은 말람파티 점수와 하악후퇴, 커진 혀입니다.","2":"곤봉지·청색증·발 부종은 OSA 선별 항목으로 제시되지 않습니다.","4":"위험인자는 긴 얼굴, 좁은 비강, 커진 편도입니다."},"one":"OSA 구강 선별 소견은 하악후퇴·높은 입천장·큰 편도/혀·큰 골융기·높은 말람파티 점수이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 18","img":[{"u":"img/w12_sleep_apnea/p18.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 18"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-15":{"q":"In the Mallampati airway classification, which class means the soft palate is not visible?","o":["Class IV","Class I","Class III","Class II","Class 0"],"a":0,"qk":"말람파티 기도 분류(Mallampati airway classification)에서 연구개(soft palate)가 보이지 않는 등급은?","ok":["4등급(Class IV)","1등급(Class I)","3등급(Class III)","2등급(Class II)","0등급(Class 0)"],"exp":"**말람파티 분류(Mallampati classification)**:\n- **Class I**: 연구개와 **목젖 전체(entire uvula)**가 보임\n- **Class II**: 연구개와 목젖 일부가 보임\n- **Class III**: 연구개와 목젖 기저부(base of uvula)만 보임\n- **Class IV**: **연구개가 보이지 않음(soft palate not visible)**\n\n**말람파티 검사(Mallampati maneuver)**에서는 환자에게 소리를 내지 말고 입을 최대한 크게 벌리고 **혀를 최대한 내밀게** 합니다. **변형 말람파티(modified Mallampati)**에서는 소리를 내지 않고 입만 최대한 크게 벌리게 합니다. 등급이 높을수록 기도가 좁아 OSA 위험이 큽니다.","why":{"1":"Class I은 연구개와 목젖 전체가 보입니다.","2":"Class III는 연구개와 목젖 기저부가 보입니다.","3":"Class II는 연구개와 목젖 일부가 보입니다.","4":"0등급은 이 분류에 제시되지 않습니다."},"one":"말람파티 Class IV는 연구개가 보이지 않는 등급이며, 등급이 높을수록 OSA 위험이 크다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 19","img":[{"u":"img/w12_sleep_apnea/p19.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 19"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-16":{"q":"Which is listed as an extraoral feature associated with OSA?","o":["Edentulism","Macroglossia","Evidence of bruxism","Neck circumference >17 inches in males or >16 inches in females","Elongated soft palate"],"a":3,"qk":"OSA와 관련된 구강외 소견(extraoral feature)으로 제시된 것은?","ok":["무치악(edentulism)","거대혀(macroglossia)","이갈이의 흔적","목둘레가 남성 17인치, 여성 16인치 초과","길어진 연구개(elongated soft palate)"],"exp":"OSA 관련 소견은 구강외와 구강내로 나뉩니다.\n\n- **구강외(extraoral)**: **목둘레(neck circumference) 남성 >17인치, 여성 >16인치**, 하악후퇴 옆모습(retrognathic profile), **2급 부정교합(Class II malocclusion)**, 긴 얼굴(long face), 작은 비강(small nasal passage)\n- **구강내(intraoral)**: 거대혀(macroglossia), 좁고 높은 경구개(narrow, high-vaulted hard palate), 길어진 연구개, 커지고 낮게 처진 목젖, 커진 편도·아데노이드, 이갈이 흔적(evidence of bruxism), 수평피개(overjet), 위식도역류와 관련된 침식(erosion), 무치악(edentulism)","why":{"0":"무치악은 구강내 소견입니다.","1":"거대혀는 구강내 소견입니다.","2":"이갈이 흔적은 구강내 소견입니다.","4":"길어진 연구개는 구강내 소견입니다."},"one":"OSA의 구강외 소견: 목둘레(남 >17인치, 여 >16인치), 하악후퇴 옆모습, 2급 부정교합, 긴 얼굴, 작은 비강.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 20","img":[{"u":"img/w12_sleep_apnea/p20.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 20"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-17":{"q":"In the STOP-BANG questionnaire, what do \"B,\" \"A,\" and \"N\" stand for?","o":["Bruxism; Asthma; Nocturia","BMI greater than 30; Age over 50; Neck circumference greater than 40 cm","BMI greater than 25; Age over 65; Neck circumference greater than 35 cm","Breathing pauses; Alcohol use; Napping","Blood pressure; Apnea observed; Nasal obstruction"],"a":1,"qk":"STOP-BANG 설문에서 B, A, N은 무엇을 뜻하는가?","ok":["이갈이; 천식; 야간뇨","BMI 30 초과; 나이 50세 초과; 목둘레 40 cm 초과","BMI 25 초과; 나이 65세 초과; 목둘레 35 cm 초과","호흡 멈춤; 음주; 낮잠","혈압; 관찰된 무호흡; 코막힘"],"exp":"고위험 선별 도구인 **STOP-BANG 설문**:\n\n- **S**noring: 크게 코를 고는가(말소리보다 크거나 닫힌 문 너머로 들릴 정도)\n- **T**ired: 낮에 자주 피곤하거나 졸린가\n- **O**bserved apnea: 자는 동안 숨이 멈추는 것을 누가 본 적이 있는가\n- **P**ressure: 고혈압이 있는가\n- **B**MI: **30 초과**\n- **A**ge: **50세 초과**\n- **N**eck circumference: **40 cm 초과**\n- **G**ender: 남성\n\n앞의 STOP은 증상·병력, 뒤의 BANG은 신체 특성입니다.","why":{"0":"이갈이·천식·야간뇨는 STOP-BANG 항목이 아닙니다.","2":"기준값이 틀립니다. BMI 30, 나이 50세, 목둘레 40 cm입니다.","3":"호흡 멈춤·음주·낮잠은 BANG의 의미가 아닙니다.","4":"혈압(P)과 관찰된 무호흡(O)은 STOP 쪽 항목이고, N은 코막힘이 아니라 목둘레입니다."},"one":"STOP-BANG의 B·A·N은 BMI >30, 나이 >50세, 목둘레 >40 cm이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 21","img":[{"u":"img/w12_sleep_apnea/p21.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 21"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-18":{"q":"OSA treatment should be tailored to each patient. Which is one of the four phenotype traits used to tailor therapy?","o":["Low hematocrit","Strong airway dilator muscle response","High loop gain (big breathing response at O2 return)","High arousal threshold only","Normal anatomy in every patient"],"a":2,"qk":"OSA 치료는 환자마다 맞춤이어야 한다. 치료를 맞추는 데 쓰는 네 가지 표현형 특성 중 하나는?","ok":["낮은 적혈구용적률","강한 기도확장근 반응","높은 루프 이득(high loop gain, O2 회복 때 큰 호흡 반응)","높은 각성 역치만","모든 환자의 정상 해부학"],"exp":"**OSA 치료는 환자마다 맞춤(tailored)**이어야 합니다. 네 가지 특성(phenotype)에 따라 치료를 고릅니다.\n\n1. **해부학/유전(anatomy, genetic)**: 장치(CPAP, 구강장치, 자세 교정, 비강 확장기 등), 수술(코, 편도/아데노이드, 설골, 비만수술, 상하악 수술 등), 기타(교정, 체중 감량, 운동 등)\n2. **약한 기도확장근 반응(weak response of airway dilator muscles)**: 근육 반응성을 높이는 약물, 설하신경 자극(hypoglossal nerve stimulation), 구인두 운동, 호르몬 치료, TMS\n3. **높은 루프 이득(high loop gain, O2 회복 시 큰 호흡 반응)**: 산소 보충, 산소+CPAP, 침술 등\n4. **높은 수면 각성 가능성(high probability of sleep arousal)**: 인지행동치료(CBT), 운동, 수면 불안정을 줄이는 약물(예: trazodone)\n\n주변 요인으로 폐경, 수면 자세, 생활 습관, 체액 저류가 함께 고려됩니다.","why":{"0":"적혈구용적률은 OSA 표현형 특성에 포함되지 않습니다.","1":"표현형은 강한 반응이 아니라 약한(weak) 기도확장근 반응입니다.","3":"표현형은 각성 역치가 아니라 높은 수면 각성 가능성이며, 네 가지 중 하나일 뿐입니다.","4":"해부학적 문제가 대표적인 표현형이며, 모든 환자가 정상 해부학인 것은 아닙니다."},"one":"OSA 맞춤 치료의 네 표현형: 해부학, 약한 기도확장근 반응, 높은 루프 이득, 높은 각성 가능성.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 22","img":[{"u":"img/w12_sleep_apnea/p22.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 22"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-19":{"q":"How common is OSA, and how many people with OSA are receiving treatment?","o":["0.1% of all ages; all are receiving treatment","Prevalence is decreasing because the population is less obese","15% of children, 2% of older adults; 50% are receiving treatment","20% of children, 50% of adults; 90% are receiving treatment","2–3% of children, 5–7% of middle-aged adults, >15% of older adults; only 10% are receiving treatment"],"a":4,"qk":"OSA는 얼마나 흔하며, OSA 환자 중 치료받는 비율은?","ok":["전 연령 0.1%; 모두 치료받음","인구가 덜 비만해져 유병률이 줄고 있다","소아 15%, 노인 2%; 50%가 치료받음","소아 20%, 성인 50%; 90%가 치료받음","소아(2–8세) 2–3%, 중년 성인 5–7%, 노인(65세 이상) 15% 초과; 치료받는 사람은 10%뿐"],"exp":"**OSA는 얼마나 흔한가**:\n- **소아(2–8세)**: **2–3%**\n- **중년 성인**: **5–7%**\n- **노인(65세 이상)**: **15% 초과**\n- 인구가 **더 비만해지면서 증가** 중\n- **OSA 환자 중 현재 치료받는 사람은 10%뿐**\n\n나이가 들수록 흔해지고, 대부분 치료받지 못하고 있다는 점이 핵심입니다.","why":{"0":"유병률이 훨씬 높고, 치료받는 사람은 10%뿐입니다.","1":"인구가 더 비만해지면서 유병률은 증가하고 있습니다.","2":"소아가 노인보다 흔한 것이 아니라 노인에서 가장 흔합니다.","3":"수치가 지나치게 높고, 실제 치료율은 10%뿐입니다."},"one":"OSA는 소아 2–3%, 중년 5–7%, 노인 15% 초과이며 치료받는 사람은 10%뿐이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 23","img":[{"u":"img/w12_sleep_apnea/p23.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 23"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-20":{"q":"Who is at risk for sleep apnea?","o":["Males more than females before 50, and males equal to females after menopause; about 70% of obese people have OSA","African-Americans have half the risk of Caucasians","Only people over 65","Females more than males before age 50","Neck size ≥14 inches in men"],"a":0,"qk":"누가 수면무호흡의 위험이 큰가?","ok":["50세 이전에는 남성이 여성보다 많고, 폐경 후에는 남녀가 같다; 비만인의 약 70%가 OSA를 가진다","아프리카계 미국인은 백인의 절반 위험이다","65세 이상만","50세 이전에는 여성이 남성보다 많다","남성 목둘레 14인치 이상"],"exp":"**수면무호흡의 위험군**(별표 항목):\n\n- **50세 이전 남성 > 여성**, **폐경 후 남성 = 여성**\n- OSA를 가진 비율: **비만인 70%**, 심장병 환자 30–50%, **뇌졸중 환자 60%**, NFL 선수 14%와 NFL 라인맨 34%\n- **아프리카계 미국인은 백인보다 2.5배**\n\n기타 요인:\n- 큰 목둘레(**남성 ≥17인치, 여성 ≥16인치**)\n- 수면무호흡 가족력\n- 위식도역류(GERD)\n- 비중격 만곡, 알레르기, 부비동 문제로 인한 코막힘","why":{"1":"아프리카계 미국인은 백인보다 2.5배 위험합니다.","2":"노인에서 더 흔하지만 65세 이상만 위험한 것은 아닙니다.","3":"50세 이전에는 남성이 여성보다 많습니다.","4":"기준은 남성 17인치 이상, 여성 16인치 이상입니다."},"one":"50세 전 남>여, 폐경 후 남=여; 비만인 70%, 뇌졸중 환자 60%가 OSA를 가지며 아프리카계 미국인은 2.5배다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 24","img":[{"u":"img/w12_sleep_apnea/p24.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 24"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-21":{"q":"In the interprofessional management approach to OSA, which statement is correct?","o":["Oral appliances have moderate evidence and acceptable compliance, used for most of the sleep duration, but some patients with mild OSA may be nonresponders.","Cognitive behavioral therapy must always be done in person and cannot be offered online.","Sleep-positioning devices can be used without any medical collaboration.","Acupuncture is the first-line treatment with strong evidence.","Collaborative dental and medical follow-up is optional."],"a":0,"qk":"OSA의 다학제 관리 접근(interprofessional management approach)에 대해 옳은 것은?","ok":["구강장치와 교정 치료는 중간 수준의 근거와 수용 가능한 순응도를 가지며 수면 시간 대부분에 쓰이지만, 경증 OSA 환자 일부는 반응하지 않을 수 있다.","인지행동치료는 반드시 대면으로만 해야 하며 온라인으로는 할 수 없다.","수면 자세 교정 장치는 의과 협력 없이 써도 된다.","침술은 근거가 강한 1차 치료이다.","치과·의과 공동 추적 관리는 선택 사항이다."],"exp":"**다학제 관리 접근(interprofessional management approach)**의 다섯 항목:\n\n1. **행동 접근**: 식이·수면 위생 조언, 잘못된 수면 습관·믿음 교정, 수면 환경 개선. 경도~중등도 근거. 인지행동치료(CBT)는 인정된 방법이며 **온라인으로도** 1차 치료로 쓸 수 있음\n2. 의학적 권고에 따라 **수면 자세 장치**(바로 눕는 습관 교정)나 다리 체액 저류를 줄이는 압박 양말: 중간 수준 근거, **의과 협력 필요**\n3. **구강장치와 교정 치료**: **중간 수준 근거, 수용 가능한 순응도**, 수면 시간 대부분에 사용. **경증 OSA 환자 일부는 반응하지 않을 수 있음(nonresponders)**\n4. 훈련받은 임상의라면 **침술**: 중간 수준 근거, 반응자·믿음과 관련\n5. **치과와 의과의 공동 추적 관리는 필수(mandatory)**\n\n임상 알고리즘도 같은 흐름입니다. OSA 위험 확인(치과 선별 + 수면의학 진단·검사) → 환자 자가관리 → 의료진 중재(비침습/가역적, 침습/수술).","why":{"1":"인지행동치료는 온라인으로도 1차 치료로 쓸 수 있습니다.","2":"수면 자세 장치는 의과 협력이 필요합니다.","3":"침술은 훈련받은 경우의 선택지일 뿐이며 근거는 중간 수준입니다.","4":"치과·의과 공동 추적 관리는 필수(mandatory)입니다."},"one":"구강장치는 중간 수준 근거·수용 가능한 순응도를 가지며, 치과·의과 공동 추적은 필수이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 25, 26","img":[{"u":"img/w12_sleep_apnea/p25.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 25"},{"u":"img/w12_sleep_apnea/p26.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 26"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-22":{"q":"According to a 2013 study, men and women with 2 or more signs or symptoms of OSA had what risk of first-onset TMD?","o":["10% greater incidence","4 times greater incidence","34.1% lower incidence","No change in risk","73% greater incidence"],"a":4,"qk":"2013년 연구에 따르면, OSA 징후·증상이 2개 이상인 남녀의 첫 발병 턱관절장애(TMD) 위험은?","ok":["발생률 10% 증가","발생률 4배 증가","발생률 34.1% 감소","위험 변화 없음","발생률 73% 증가"],"exp":"**수면무호흡과 구강 건강**은 양방향입니다. 수면무호흡이 구강 문제에 기여하고, 치과 문제도 수면무호흡을 일으킬 수 있습니다.\n\n- **턱관절(TMJ)**: 2013년 연구에서 OSA 징후·증상이 **2개 이상**인 남녀는 **첫 발병 턱관절장애(TMD) 발생률이 73% 더 높았습니다**.\n- **수면 이갈이(sleep bruxism)**: 이갈이·TMD·두통이 있던 환자를 수면장애용 구강장치로 치료하자, 두통이 2개월 만에 줄고 10개월 후 완전히 사라진 사례가 있습니다.\n- **구강 호흡(mouth breathing)**: 충치, 치태, 구내염, 치은염(34.1%), 치주질환(62.3%)으로 이어집니다.","why":{"0":"증가 폭은 10%가 아니라 73%입니다.","1":"4배는 수면무호흡과 관련된 뇌졸중 위험 수치입니다.","2":"34.1%는 구강 호흡과 관련된 치은염 수치입니다.","3":"위험이 73% 증가했습니다."},"one":"OSA 징후·증상이 2개 이상이면 첫 발병 TMD 발생률이 73% 높다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28","img":[{"u":"img/w12_sleep_apnea/p28.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-23":{"q":"Mouth breathing associated with sleep apnea leads to which oral problems, and which dental factor is listed as increasing OSA?","o":["Enamel hypoplasia; fluorosis","Gingivitis (34.1%) and periodontal disease (62.3%); edentulism","Hypercementosis; ankylosis","Increased salivary flow; macrodontia","Only dental fluorosis; supernumerary teeth"],"a":1,"qk":"수면무호흡과 관련된 구강 호흡이 일으키는 구강 문제와, OSA를 증가시키는 치과 요인으로 제시된 것은?","ok":["법랑질 형성저하; 반상치","치은염(34.1%)과 치주질환(62.3%); 무치악(edentulism)","백악질 과형성; 유착","침 분비 증가; 거대치","반상치만; 과잉치"],"exp":"**구강 호흡(mouth breathing)**은 **충치(tooth decay), 치태(plaque), 구내염(mouth sores), 치은염(gingivitis, 34.1%), 치주질환(periodontal disease, 62.3%)**으로 이어집니다.\n\n또한 **OSA를 증가시키는 다른 요인**으로 **무치악(edentulism)**이 있습니다. 치아가 없으면 턱과 혀의 위치가 바뀌어 기도가 좁아지기 쉽습니다. **치과 구강 평가로 이런 다른 요인을 찾아낼 수 있습니다.**","why":{"0":"법랑질 형성저하·반상치는 수면무호흡 관련 구강 문제로 제시되지 않습니다.","2":"백악질 과형성·유착은 제시되지 않습니다.","3":"구강 호흡은 침 분비 증가가 아니라 입마름과 관련되며, 거대치는 제시되지 않습니다.","4":"반상치·과잉치는 제시되지 않습니다."},"one":"구강 호흡은 치은염(34.1%)·치주질환(62.3%)을 일으키고, 무치악은 OSA를 증가시킨다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28, 29","img":[{"u":"img/w12_sleep_apnea/p28.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 28"},{"u":"img/w12_sleep_apnea/p29.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 29"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-24":{"q":"Which is listed as a predisposing factor for upper airway obstruction in OSA?","o":["Pulmonary fibrosis","Excess surfactant production","Increased alveolar compliance","Anatomic narrowing, abnormal mechanical linkage between airway dilating muscles and airway wall, muscle weakness, and abnormal neural regulation","Bronchial smooth muscle hyperresponsiveness"],"a":3,"qk":"OSA에서 상기도 폐쇄의 소인(predisposing factor)으로 제시된 것은?","ok":["폐섬유증","표면활성제 과잉 생산","폐포 순응도 증가","해부학적 협착, 기도확장근과 기도벽 사이의 비정상적 기계적 연결, 근육 약화, 비정상적 신경 조절","기관지 평활근 과민반응"],"exp":"공기는 한 번 숨쉴 때 **비강(비중격·비갑개) → 연구개(목젖) → 혀 기저부 → 인두 근육·조직 → 후두 → 기관 → 폐**로 이동합니다. OSA는 이 경로 중 **상기도**가 막히는 문제입니다.\n\n**상기도 폐쇄의 소인(predisposing factors)** 네 가지:\n1. **해부학적 협착(anatomic narrowing)**\n2. **기도확장근과 기도벽 사이의 비정상적 기계적 연결(abnormal mechanical linkage)**\n3. **근육 약화(muscle weakness)**\n4. **비정상적 신경 조절(abnormal neural regulation)**","why":{"0":"폐섬유증은 상기도 폐쇄 소인이 아닙니다.","1":"표면활성제는 OSA 소인으로 제시되지 않습니다.","2":"폐포 순응도는 상기도 폐쇄 소인으로 제시되지 않습니다.","4":"기관지 평활근 과민반응은 천식(asthma)의 특징입니다."},"one":"상기도 폐쇄의 네 소인: 해부학적 협착, 비정상적 기계적 연결, 근육 약화, 비정상적 신경 조절.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 30","img":[{"u":"img/w12_sleep_apnea/p30.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 30"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-25":{"q":"Oral appliances (OA) appear to work mainly on which OSA traits, and in which patients are they more effective?","o":["Central traits; patients with Cheyne-Stokes breathing","Low arousal threshold only; patients with insomnia","Anatomic traits, by mechanically opening the airway; individuals with a low loop gain of the ventilatory control reflex","Nonanatomic traits; patients with high loop gain","Impaired ventilatory control; patients with high loop gain"],"a":2,"qk":"구강장치(OA)는 주로 어떤 OSA 특성에 작용하며, 어떤 환자에서 더 효과적인가?","ok":["중추성 특성; 체인-스토크스 호흡 환자","낮은 각성 역치만; 불면증 환자","기도를 기계적으로 열어 해부학적 특성에 작용; 환기 조절 반사의 루프 이득이 낮은 사람","비해부학적 특성; 루프 이득이 높은 환자","손상된 환기 조절; 루프 이득이 높은 환자"],"exp":"**OSA에 기여하는 특성(traits)**:\n- **해부학적(anatomic)**: 상기도 개방성(upper airway patency)\n- **비해부학적(nonanatomic)**: 근육 반응성 저하(impaired muscle responsiveness), **낮은 각성 역치(low arousal threshold)**, 환기 조절 장애(impaired ventilatory control)\n\n**구강장치의 효과(effectiveness of OA)**: 주로 **해부학적 특성**에 작용하여 **기도를 기계적으로 열고 닫힘을 막으며**, 아마도 하악과 혀를 잡아주는 장치로 작동합니다. 일부 환자에서는 수면 각성도 줄일 수 있고, **환기 조절 반사의 루프 이득(loop gain)이 낮은 사람**에서 더 효과적입니다.","why":{"0":"구강장치는 기도를 여는 장치로, 중추성 호흡 문제를 위한 것이 아닙니다.","1":"각성을 줄일 수는 있지만 주 작용은 해부학적 특성입니다.","3":"구강장치는 주로 해부학적 특성에 작용하며, 루프 이득이 낮은 사람에서 더 효과적입니다.","4":"루프 이득이 높은 사람이 아니라 낮은 사람에서 더 효과적입니다."},"one":"구강장치는 주로 해부학적 특성(기도 개방)에 작용하며 루프 이득이 낮은 사람에서 더 효과적이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 31, 32","img":[{"u":"img/w12_sleep_apnea/p31.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 31"},{"u":"img/w12_sleep_apnea/p32.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 32"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-26":{"q":"Regarding comorbidities of sleep apnea, which statement is correct?","o":["Only 5% of patients with severe OSA have hypertension.","Hypertension and sleep apnea are unrelated.","Coronary artery disease has the highest prevalence of sleep apnea among comorbidities.","Sleep apnea is rare in obesity (under 10%).","Sleep apnea is found in about 83% of patients with drug-resistant hypertension."],"a":4,"qk":"수면무호흡의 동반질환(comorbidities)에 대해 옳은 것은?","ok":["중증 OSA 환자 중 고혈압은 5%뿐이다.","고혈압과 수면무호흡은 관계가 없다.","동반질환 중 관상동맥질환에서 수면무호흡 유병률이 가장 높다.","비만에서 수면무호흡은 드물다(10% 미만).","약물저항성 고혈압 환자의 약 83%가 수면무호흡을 가진다."],"exp":"**동반질환에서의 수면무호흡 유병률**(높은 순):\n- **약물저항성 고혈압(drug-resistant hypertension) 83%**\n- 비만(obesity) 77%\n- 울혈성 심부전(congestive heart failure) 76%\n- 심박조율기(pacemakers) 59%\n- 심방세동(atrial fibrillation) 49%\n- 당뇨병(diabetes) 48%\n- 전체 고혈압 37%\n- 관상동맥질환(coronary artery disease) 30%\n\n**고혈압과의 연결(hypertension links)**: 고혈압 환자의 **30–83%**가 수면무호흡을 가지고, **경증 OSA 환자의 43%, 중증 OSA 환자의 69%**가 고혈압을 가집니다.","why":{"0":"중증 OSA 환자의 69%가 고혈압을 가집니다.","1":"고혈압 환자의 30–83%가 수면무호흡을 가질 정도로 관계가 깊습니다.","2":"관상동맥질환은 30%로 목록에서 가장 낮습니다.","3":"비만에서의 유병률은 77%로 매우 높습니다."},"one":"약물저항성 고혈압 환자의 83%가 수면무호흡을 가지며, 중증 OSA 환자의 69%가 고혈압을 가진다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 33, 34","img":[{"u":"img/w12_sleep_apnea/p33.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 33"},{"u":"img/w12_sleep_apnea/p34.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 34"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-27":{"q":"How is OSA diagnosed and evaluated? Which is a subjective method?","o":["Pulse oximetry during a sleep study","Polysomnography","The Epworth Sleepiness Scale","Multiple Sleep Latency Test","Maintenance of Wakefulness Test"],"a":2,"qk":"OSA는 어떻게 진단·평가하는가? 주관적 방법(subjective method)에 해당하는 것은?","ok":["수면검사 중 맥박산소측정","수면다원검사(polysomnography)","엡워스 졸음 척도(Epworth Sleepiness Scale)","다중수면잠복기검사(Multiple Sleep Latency Test)","각성유지검사(Maintenance of Wakefulness Test)"],"exp":"**OSA 진단·평가 방법**:\n\n- **주관적 방법(subjective)**: **엡워스 졸음 척도(Epworth Sleepiness Scale)**, 중증도를 정하는 자가 보고 검사, 병력(medical history)\n- **객관적 방법(objective)**: **수면다원검사(polysomnography, 수면검사)**(가장 강조됨), 다중수면잠복기검사(MSLT), 각성유지검사(MWT)\n\n엡워스 척도는 환자가 스스로 낮 졸림을 점수 매기는 설문이라 주관적입니다.","why":{"0":"맥박산소측정은 수면다원검사의 측정 항목으로 객관적입니다.","1":"수면다원검사는 대표적인 객관적 방법입니다.","3":"다중수면잠복기검사는 객관적 방법입니다.","4":"각성유지검사는 객관적 방법입니다."},"one":"엡워스 졸음 척도는 주관적 방법이고, 수면다원검사·MSLT·MWT는 객관적 방법이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 35","img":[{"u":"img/w12_sleep_apnea/p35.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 35"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-28":{"q":"In polysomnography, which recording measures eye movements?","o":["EEG","Pulse oximetry","EMG","EOG","ECG of the chest wall"],"a":3,"qk":"수면다원검사(polysomnography)에서 눈 움직임을 측정하는 기록은?","ok":["뇌파(EEG)","맥박산소측정","근전도(EMG)","안전도(EOG)","흉벽 심전도"],"exp":"**수면다원검사(polysomnography)**(별표 항목)는 수면검사 동안 뇌파, 혈중 산소, 심박수와 호흡, 근육 움직임(눈, 다리)을 기록해 **호흡 중단이 기도 폐쇄 때문인지 뇌의 비정상 신호 때문인지**를 가립니다.\n\n측정 항목:\n1. 뇌파 – **EEG**(electroencephalogram)\n2. 눈 움직임 – **EOG**(electro-oculogram)\n3. 근육 활동 – **EMG**(electromyogram)\n4. 입·코 기류\n5. 호흡 노력: 가슴과 배의 움직임\n6. 코골이 크기 녹음\n7. 혈중 산소 – 맥박산소측정(pulse oximetry)\n8. 검사 중 비디오 감시","why":{"0":"EEG는 뇌파를 기록합니다.","1":"맥박산소측정은 혈중 산소를 측정합니다.","2":"EMG는 근육 활동을 기록합니다.","4":"눈 움직임은 심전도로 측정하지 않으며, 측정 항목은 EOG입니다."},"one":"수면다원검사에서 EEG는 뇌파, EOG는 눈 움직임, EMG는 근육 활동을 기록한다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 36, 37","img":[{"u":"img/w12_sleep_apnea/p36.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 36"},{"u":"img/w12_sleep_apnea/p37.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 37"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-29":{"q":"Which are the non-surgical treatments for OSA?","o":["Behavioral changes, medication, CPAP, and oral/dental appliances","Palate implants and hyoid suspension","Uvulopalatopharyngoplasty and genioglossus advancement","Maxillomandibular advancement only","Tracheostomy and bariatric surgery"],"a":0,"qk":"OSA의 비수술적 치료(non-surgical treatment)는?","ok":["행동 변화, 약물, CPAP, 구강/치과 장치","입천장 임플란트와 설골 거상술","목젖입천장인두성형술과 이끝혀근 전진술","상하악 전진술만","기관절개술과 비만수술"],"exp":"**OSA의 비수술적 치료**:\n1. **행동 변화(behavioral changes)**: 수면 자세 변경, 체중 감량, 운동, 잠들기와 수면의 질을 높이는 일반적인 습관\n2. **약물(medication)**\n3. **CPAP(지속기도양압, continuous positive airway pressure)**: 마스크와 호스로 압력을 넣어 기도를 열어 둠\n4. **구강/치과 장치(oral/dental appliance)**\n\n나머지 보기들은 모두 수술적 치료입니다.","why":{"1":"입천장 임플란트와 설골 거상술은 수술적 치료입니다.","2":"목젖입천장인두성형술과 이끝혀근 전진술은 수술적 치료입니다.","3":"상하악 전진술은 수술적 치료입니다.","4":"기관절개술과 비만수술은 수술적 치료입니다."},"one":"OSA 비수술 치료는 행동 변화, 약물, CPAP, 구강장치이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 38, 39, 40","img":[{"u":"img/w12_sleep_apnea/p38.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 38"},{"u":"img/w12_sleep_apnea/p39.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 39"},{"u":"img/w12_sleep_apnea/p40.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 40"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-30":{"q":"How does an oral/dental appliance such as a tongue retaining device (TRD) treat OSA?","o":["It pushes the tongue backward to seal the oropharynx.","It holds the jaw and tongue forward and the palate up, preventing closure of the airway.","It stimulates the hypoglossal nerve electrically.","It delivers positive air pressure through the nose.","It removes the uvula."],"a":1,"qk":"혀 고정 장치(TRD) 같은 구강/치과 장치는 OSA를 어떻게 치료하는가?","ok":["혀를 뒤로 밀어 구인두를 막는다.","턱과 혀를 앞으로, 입천장을 위로 붙잡아 기도가 닫히는 것을 막는다.","설하신경을 전기로 자극한다.","코로 양압을 넣는다.","목젖을 제거한다."],"exp":"**OSA용 구강/치과 장치(oral/dental appliances)**, 예를 들어 **혀 고정 장치(tongue retaining device, TRD)**는 **턱과 혀를 앞으로, 입천장을 위로 붙잡아 기도가 닫히는 것을 막습니다**(별표 항목).\n\n좁아진 기도(compromised airway)가 장치를 끼우면 열린 기도(oral appliance solution)로 바뀌는 원리입니다. 이것이 구강장치가 해부학적 특성에 작용한다는 말의 실체입니다.","why":{"0":"혀를 뒤로 밀면 오히려 기도가 막힙니다. 장치는 혀를 앞으로 잡아 둡니다.","2":"설하신경 자극은 기도확장근 반응이 약한 표현형의 치료이며 구강장치가 아닙니다.","3":"양압을 넣는 것은 CPAP입니다.","4":"목젖 제거는 목젖입천장인두성형술(UPPP) 같은 수술입니다."},"one":"구강장치(TRD)는 턱과 혀를 앞으로, 입천장을 위로 붙잡아 기도 닫힘을 막는다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 41","img":[{"u":"img/w12_sleep_apnea/p41.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 41"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-31":{"q":"Which of the following is a surgical option for OSA, and when should surgery be considered?","o":["Epworth Sleepiness Scale; at every visit","CPAP; as the first step before any other therapy","Tongue retaining device; only after tracheostomy","Behavioral therapy; only in children","Uvulopalatopharyngoplasty; only after all the risks, benefits, and alternatives are understood"],"a":4,"qk":"다음 중 OSA의 수술적 선택지는 무엇이며, 수술은 언제 고려해야 하는가?","ok":["엡워스 졸음 척도; 매 방문마다","CPAP; 다른 어떤 치료보다 먼저","혀 고정 장치; 기관절개술 뒤에만","행동 치료; 소아에서만","목젖입천장인두성형술(UPPP); 모든 위험·이득·대안을 이해한 뒤에만"],"exp":"**OSA의 수술적 선택지**(별표 항목): **비강 기도 수술(nasal airway)**, **입천장 임플란트(palate implants)***, **목젖입천장인두성형술(uvulopalatopharyngoplasty, UPPP)***, **혀 축소술(tongue reduction)**, **이끝혀근 전진술(genioglossus advancement)***, **설골 거상술(hyoid suspension)**, **상하악 수술(maxillomandibular procedures)***, **기관절개술(tracheostomy)**, **비만수술(bariatric surgery)**, 그리고 이들의 조합.\n\n**수술은 모든 위험, 이득, 대안을 이해한 뒤에만 고려해야 합니다.**","why":{"0":"엡워스 졸음 척도는 주관적 평가 도구입니다.","1":"CPAP는 비수술적 치료입니다.","2":"혀 고정 장치는 비수술적 구강장치입니다.","3":"행동 치료는 비수술적 치료이며 소아에 한정되지 않습니다."},"one":"OSA 수술(UPPP, 이끝혀근 전진술, 상하악 수술, 입천장 임플란트 등)은 위험·이득·대안을 모두 이해한 뒤에만 고려한다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 43, 52","img":[{"u":"img/w12_sleep_apnea/p43.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 43"},{"u":"img/w12_sleep_apnea/p52.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 52"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-32":{"q":"The Pillar procedure is which surgical option for OSA?","o":["Uvulopalatal flap","Tracheostomy","Maxillo-mandibular advancement","Palate implants placed in the soft palate","Genioglossus advancement"],"a":3,"qk":"필러 시술(Pillar procedure)은 OSA의 어떤 수술적 선택지인가?","ok":["목젖입천장 피판(uvulopalatal flap)","기관절개술(tracheostomy)","상하악 전진술(maxillo-mandibular advancement)","연구개에 넣는 입천장 임플란트(palate implants)","이끝혀근 전진술(genioglossus advancement)"],"exp":"**필러 시술(Pillar procedure)**은 **입천장 임플란트(palate implants)***입니다. 가는 막대 모양의 **필러 임플란트(pillar implant)**를 **연구개(soft palate)**에 넣는 시술입니다.\n\n함께 나오는 다른 OSA 수술도 이름과 부위로 구분해 두세요.\n- **목젖입천장인두성형술(uvulopalatopharyngoplasty, UPPP)***: 목젖(uvula)·연구개·편도(tonsil) 부위의 수술\n- **상하악 전진술(maxillo-mandibular advancement)***: 위턱과 아래턱의 수술\n- **이끝혀근 전진술(genioglossus advancement)**: 혀를 움직이는 이끝혀근(genioglossus) 부위의 수술\n- **목젖입천장 피판(uvulopalatal flap)**","why":{"0":"목젖입천장 피판은 별도의 수술입니다.","1":"기관절개술은 입천장 임플란트가 아닙니다.","2":"상하악 전진술은 위아래 턱의 수술입니다.","4":"이끝혀근 전진술은 이끝혀근 부위의 수술로, 입천장 임플란트가 아닙니다."},"one":"필러 시술은 연구개에 넣는 입천장 임플란트이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 49, 45, 46, 47, 48","img":[{"u":"img/w12_sleep_apnea/p49.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 49"},{"u":"img/w12_sleep_apnea/p45.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 45"},{"u":"img/w12_sleep_apnea/p46.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 46"},{"u":"img/w12_sleep_apnea/p47.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 47"},{"u":"img/w12_sleep_apnea/p48.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 48"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-33":{"q":"Which fact about sleep apnea is correct?","o":["OSA is far rarer than asthma or diabetes in the US.","All severe cases are diagnosed.","About 1 in every 15 Americans (6.62%) has moderate to severe OSA, and 75% of severe sleep-disordered breathing cases remain undiagnosed.","Sleep apnea halves the risk of stroke.","The average OSA individual has about 5 apneas per night."],"a":2,"qk":"수면무호흡에 관한 사실로 옳은 것은?","ok":["미국에서 OSA는 천식이나 당뇨병보다 훨씬 드물다.","중증 환자는 모두 진단된다.","미국인 약 15명 중 1명(6.62%)이 중등도~중증 OSA를 가지며, 중증 수면호흡장애의 75%는 진단되지 않은 채 남아 있다.","수면무호흡은 뇌졸중 위험을 절반으로 줄인다.","평균적인 OSA 환자는 하룻밤에 약 5회의 무호흡을 겪는다."],"exp":"**더 중요한 사실들(more important facts)**:\n- 미국인 **15명 중 1명(6.62%)**이 중등도~중증 OSA\n- 50명 중 1명(2–4%)은 진단되지 않은 수면무호흡. **중증 수면호흡장애(SDB) 사례의 75%가 진단되지 않음**\n- **뇌졸중 위험 4배**\n- 유병률이 미국 인구의 **천식(2천만)·당뇨병(2,360만)**과 비슷함\n- 평균적인 OSA 환자는 **시간당 60회(하룻밤 400회)**의 무호흡을 겪음","why":{"0":"유병률은 천식·당뇨병과 비슷한 수준입니다.","1":"중증 사례의 75%가 진단되지 않습니다.","3":"수면무호흡은 뇌졸중 위험을 4배로 높입니다.","4":"평균은 하룻밤 5회가 아니라 시간당 60회, 하룻밤 400회입니다."},"one":"미국인 15명 중 1명이 중등도~중증 OSA, 중증의 75%는 미진단, 뇌졸중 위험 4배, 평균 시간당 60회 무호흡.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 50","img":[{"u":"img/w12_sleep_apnea/p50.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 50"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-34":{"q":"In the summary, which are listed as complications of OSA?","o":["Fever and lymphadenopathy","High blood pressure, strokes, heart disease, automobile accidents, daytime sleepiness, and difficulty concentrating, thinking and remembering","Asthma attacks and Curschmann spirals","Only snoring","Increased salivary flow and gingival hyperplasia"],"a":1,"qk":"요약에서 OSA의 합병증으로 제시된 것은?","ok":["발열과 림프절병증","고혈압, 뇌졸중, 심장병, 자동차 사고, 낮 졸림, 집중·사고·기억의 어려움","천식 발작과 쿠르슈만 나선","코골이만","침 분비 증가와 잇몸 과형성"],"exp":"**요약(summary)**(별표 항목):\n- **수면무호흡**: 수면 중 호흡이 **감소하거나 멈추는 것**\n- **세 유형**: CSA, OSA, 또는 둘 다\n- **CSA**: 수면 중 **뇌가 호흡근을 활성화하지 못해** 생김\n- **OSA**: 수면 중 **기도가 허탈**되어 생김\n- **OSA 합병증**: **고혈압(HBP), 뇌졸중, 심장병, 자동차 사고, 낮 졸림, 집중·사고·기억의 어려움**\n- **OSA 진단**: 병력, 신체검사, **수면다원검사(polysomnography)**","why":{"0":"발열과 림프절병증은 OSA 합병증으로 제시되지 않습니다.","2":"천식 발작과 쿠르슈만 나선은 천식(asthma)의 소견입니다.","3":"코골이는 증상이며, 합병증 목록은 훨씬 넓습니다.","4":"침 분비 증가와 잇몸 과형성은 OSA 합병증으로 제시되지 않습니다."},"one":"OSA 합병증은 고혈압·뇌졸중·심장병·자동차 사고·낮 졸림·인지 저하이고, 진단은 병력·신체검사·수면다원검사이다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51","img":[{"u":"img/w12_sleep_apnea/p51.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 51"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-35":{"q":"What does dental sleep medicine focus on?","o":["Management of sleep-related breathing disorders, including snoring and OSA, through oral appliance therapy and upper airway surgery","Treatment of insomnia with sedatives only","Management of central sleep apnea in infants","Orthodontic treatment for esthetics only","Diagnosis of narcolepsy by EEG"],"a":0,"qk":"치과수면의학(dental sleep medicine)은 무엇에 초점을 두는가?","ok":["구강장치 치료와 상기도 수술로 코골이와 OSA를 포함한 수면 관련 호흡장애를 관리하는 것","진정제만으로 불면증을 치료하는 것","영아의 중추성 수면무호흡을 관리하는 것","심미만을 위한 교정 치료","뇌파로 기면증을 진단하는 것"],"exp":"**치과수면의학(dental sleep medicine)**은 **구강장치 치료(oral appliance therapy)와 상기도 수술(upper airway surgery)**을 통해 **코골이(snoring)와 폐쇄성 수면무호흡(OSA)을 포함한 수면 관련 호흡장애**를 관리하는 데 초점을 둡니다.\n\n**성인의 OSA와 코골이를 구강장치로 치료하는 방법은 치과의사가 개척했습니다(pioneered).**","why":{"1":"진정제를 이용한 불면증 치료는 치과수면의학의 초점이 아닙니다.","2":"영아 CSA는 무호흡 경보기로 관리하며 치과수면의학의 초점이 아닙니다.","3":"심미 교정은 치과수면의학의 초점이 아닙니다.","4":"기면증 진단은 제시되지 않습니다."},"one":"치과수면의학은 구강장치와 상기도 수술로 코골이·OSA를 관리하며, 구강장치 치료는 치과의사가 개척했다.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 54","img":[{"u":"img/w12_sleep_apnea/p54.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 54"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_sleep_apnea-36":{"q":"Which qualifies a dentist in dental sleep medicine?","o":["Certification by a non-profit organization such as the American Board of Dental Sleep Medicine (ABDSM)","Owning a CPAP machine","Prescribing sedatives for sleep","Completing a general dentistry residency only","Any continuing education course taken more than 10 years ago"],"a":0,"qk":"치과수면의학에서 자격을 갖춘 치과의사(qualified dentist)의 조건에 해당하는 것은?","ok":["미국치과수면의학위원회(ABDSM) 같은 비영리 단체의 치과수면의학 인증","CPAP 장비 보유","수면용 진정제 처방","일반치과 수련만 마침","10년도 더 전에 들은 아무 보수교육"],"exp":"**치과수면의학의 자격을 갖춘 치과의사**의 조건(셋 중 하나):\n1. **미국치과수면의학위원회(ABDSM)** 같은 **비영리 단체의 치과수면의학 인증(certification)**\n2. **미국치과수면의학회(AADSM)** 같은 비영리 단체가 인증한 치과수면의학 시설의 **치과 책임자(dental director)**\n3. 치과수면의학 중심 비영리 단체나 인증 치과대학이 제공한, **최근 2년 이내**의 인정된 치과수면의학 **보수교육(continuing education)**","why":{"1":"장비 보유는 자격 조건이 아닙니다.","2":"진정제 처방은 자격 조건이 아닙니다.","3":"일반치과 수련만으로는 조건이 아닙니다.","4":"보수교육은 최근 2년 이내여야 하고, 치과수면의학 중심 단체의 인정된 교육이어야 합니다."},"one":"자격 조건: ABDSM 등 비영리 단체 인증, AADSM 인증 시설의 치과 책임자, 또는 최근 2년 이내 인정된 보수교육.","src":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 55","img":[{"u":"img/w12_sleep_apnea/p55.webp","cap":"2025-Sleep-ApneaPPT-CANVAS.pdf, slide 55"}],"ch":"w12_sleep_apnea","chn":"Sleep Apnea","week":12},"w12_asthma-1":{"q":"According to the 2018 US asthma prevalence data, which group had the highest current asthma prevalence?","o":["White (7.6%)","Hispanic (6.4%)","Children (7.5%)","Black (10.6%)","Males (6.2%)"],"a":3,"qk":"2018년 미국 천식 유병률 자료에서 현재 천식 유병률이 가장 높은 집단은?","ok":["백인(7.6%)","히스패닉(6.4%)","소아(7.5%)","흑인(10.6%)","남성(6.2%)"],"exp":"천식이 치과의료인에게 중요한 이유 중 하나는 **흔하기 때문**입니다. 2018년 미국 현재 천식 유병률:\n\n- **나이**: 소아 7.5%, 성인 7.7%\n- **성별**: 남성 6.2%, **여성 9.1%**\n- **인종/민족**: 백인 7.6%, **흑인 10.6%**, 히스패닉 6.4%\n\n가장 높은 집단은 **흑인(10.6%)**이고, 성별로는 여성이 남성보다 높습니다.","why":{"0":"백인 7.6%는 흑인 10.6%보다 낮습니다.","1":"히스패닉 6.4%는 인종 중 가장 낮습니다.","2":"소아 7.5%는 흑인 10.6%보다 낮습니다.","4":"남성 6.2%는 여성 9.1%보다도 낮습니다."},"one":"2018년 미국 천식 유병률은 흑인 10.6%가 가장 높고, 여성(9.1%)이 남성(6.2%)보다 높다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 3","img":[{"u":"img/w12_asthma/p03.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 3"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-2":{"q":"How is asthma defined?","o":["An irreversible destruction of alveolar walls","A chronic (long-term) inflammatory disease of the airways that is potentially reversible","A collapse of the upper airway during sleep","A disease caused only by genetic factors","An acute infectious disease of the alveoli"],"a":1,"qk":"천식(asthma)은 어떻게 정의되는가?","ok":["폐포벽의 비가역적 파괴","잠재적으로 가역적인, 기도의 만성(장기) 염증 질환","수면 중 상기도의 허탈","유전 요인만으로 생기는 질환","폐포의 급성 감염 질환"],"exp":"**천식의 정의**(별표 항목): **기도의 만성(장기) 염증 질환(chronic inflammatory disease of the airways)**이며 **잠재적으로 가역적(potentially reversible)**입니다.\n\n천식은 **삽화적인 만성 호흡기 질환(episodic, chronic respiratory disorder)**으로, **기관지 평활근의 염증과 과민반응(inflammation & hyperresponsiveness of bronchial smooth muscle)**이 핵심입니다. 천식은 WHO의 비감염성질환(NCDs) 예방·관리 세계행동계획과 UN 2030 지속가능발전 의제에도 포함되어 있습니다.","why":{"0":"폐포벽 파괴는 천식의 정의가 아니며, 천식은 잠재적으로 가역적입니다.","2":"수면 중 상기도 허탈은 폐쇄성 수면무호흡(OSA)입니다.","3":"천식은 유전과 환경 요인이 모두 중요합니다.","4":"천식은 감염 질환이 아니라 기도의 만성 염증 질환입니다."},"one":"천식은 잠재적으로 가역적인 기도의 만성 염증 질환이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 4, 5","img":[{"u":"img/w12_asthma/p04.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 4"},{"u":"img/w12_asthma/p05.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 5"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-3":{"q":"Asthma is described as reversible and inducible. What does \"inducible\" mean?","o":["It can only be induced by exercise.","The narrowing can be reversed with an inhaler.","It is always present and never changes.","It is induced by bacterial infection of the alveoli.","The airway narrowing can be triggered by things such as a pet, smoke, or allergens."],"a":4,"qk":"천식은 가역적(reversible)이고 유발성(inducible)이라고 설명된다. \"유발성\"은 무엇을 뜻하는가?","ok":["운동으로만 유발된다.","흡입기로 좁아진 기도를 되돌릴 수 있다.","항상 있으며 변하지 않는다.","폐포의 세균 감염으로 유발된다.","반려동물, 연기, 알레르겐 같은 것이 기도 좁아짐을 유발할 수 있다."],"exp":"천식의 두 성질:\n\n- **가역적(reversible)**: 좁아진 기도가 **흡입기(inhaler)** 등으로 다시 넓어질 수 있음\n- **유발성(inducible)**: **고양이 같은 반려동물, 연기(smoke), 알레르겐** 같은 자극이 기도를 좁게 만들 수 있음\n\n즉 천식은 자극으로 생기고 치료로 되돌릴 수 있는 기도 좁아짐이 특징입니다.","why":{"0":"운동은 유발 요인 중 하나일 뿐, 운동으로만 유발되는 것이 아닙니다.","1":"흡입기로 되돌릴 수 있다는 것은 가역적(reversible)의 뜻입니다.","2":"천식은 삽화적이고 변하는 질환입니다.","3":"천식은 폐포의 세균 감염 질환이 아닙니다."},"one":"천식은 흡입기로 되돌릴 수 있고(가역적), 반려동물·연기·알레르겐 등으로 유발된다(유발성).","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 6","img":[{"u":"img/w12_asthma/p06.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 6"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-4":{"q":"During an asthma exacerbation (attack), what happens to the airways?","o":["The alveoli fill with pus.","The trachea ruptures.","They become even narrower in response to something in the environment, which can be life-threatening.","The upper airway collapses only during sleep.","They dilate and stay open."],"a":2,"qk":"천식 악화(asthma exacerbation, 발작) 때 기도에는 어떤 일이 일어나는가?","ok":["폐포에 고름이 찬다.","기관이 파열된다.","환경 속 무언가에 반응해 기도가 더욱 좁아지며, 생명을 위협할 수 있다.","수면 중에만 상기도가 허탈된다.","기도가 넓어진 채로 유지된다."],"exp":"천식은 **기도의 만성 염증(chronic inflammation in airways)**으로 기도가 **좁아져서(narrow)** 숨쉬기 어렵습니다.\n\n**천식 악화(asthma exacerbation, 발작 attack)** 때는 **환경 속 무언가(something in environment)**에 반응해 기도가 **더욱 좁아지고(even narrower)**, 이는 **생명을 위협할 수 있습니다(life-threatening)**.","why":{"0":"폐포에 고름이 차는 것은 천식 악화의 설명이 아닙니다.","1":"기관 파열은 천식 악화의 설명이 아닙니다.","3":"수면 중 상기도 허탈은 폐쇄성 수면무호흡입니다.","4":"발작 때 기도는 넓어지지 않고 더 좁아집니다."},"one":"천식 발작은 환경 자극으로 이미 좁은 기도가 더 좁아지는 것이며 생명을 위협할 수 있다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 7, 8","img":[{"u":"img/w12_asthma/p07.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 7"},{"u":"img/w12_asthma/p08.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 8"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-5":{"q":"In the airway wall diagram, which layers make up the mucosa, and where is the smooth muscle?","o":["Mucosa = epithelial cells and lamina propria; smooth muscle is in the submucosa","Mucosa = smooth muscle and cartilage; epithelium is in the submucosa","Mucosa = lamina propria only; smooth muscle is in the adventitia","Mucosa = submucosal glands; smooth muscle is in the epithelium","Mucosa = epithelial cells only; smooth muscle is in the lumen"],"a":0,"qk":"기도벽 그림에서 점막(mucosa)을 이루는 층은 무엇이며, 평활근(smooth muscle)은 어디에 있는가?","ok":["점막 = 상피세포와 고유판(lamina propria); 평활근은 점막하층(submucosa)에","점막 = 평활근과 연골; 상피는 점막하층에","점막 = 고유판만; 평활근은 바깥막에","점막 = 점막하샘; 평활근은 상피에","점막 = 상피세포만; 평활근은 내강에"],"exp":"기관(trachea)은 **좌우 기관지(right & left bronchi)**로, 다시 **세기관지(bronchioles)**로 갈라지며 가운데에 **내강(lumen)**이 있습니다.\n\n기도벽의 층:\n- **점막(mucosa)**: **상피세포(epithelial cells)**와 **고유판(lamina propria)**\n- **점막하층(submucosa)**: **평활근(smooth muscle)**\n\n천식에서는 이 평활근의 수축과 점액 분비가 내강을 좁힙니다.","why":{"1":"평활근은 점막이 아니라 점막하층에 표시되어 있고, 상피는 점막에 있습니다.","2":"점막에는 고유판뿐 아니라 상피세포도 있습니다.","3":"평활근은 상피에 있지 않습니다.","4":"평활근은 내강이 아니라 벽(점막하층)에 있습니다."},"one":"기도 점막은 상피세포+고유판이고, 평활근은 점막하층에 있다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 9","img":[{"u":"img/w12_asthma/p09.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 9"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-6":{"q":"The molecular pathway leading to asthma is often initiated by environmental triggers and involves Th2 cells. Which conditions make up the atopic triad?","o":["Asthma, candidiasis, and caries","Asthma, sleep apnea, and GERD","Asthma, COPD, and emphysema","Asthma, diabetes, and hypertension","Asthma, atopic dermatitis, and allergic rhinitis"],"a":4,"qk":"천식으로 가는 분자 경로는 흔히 환경 유발 요인으로 시작되며 Th2 세포가 관여한다. 아토피 삼징(atopic triad)을 이루는 질환은?","ok":["천식, 칸디다증, 충치","천식, 수면무호흡, 위식도역류","천식, COPD, 폐기종","천식, 당뇨병, 고혈압","천식, 아토피피부염(atopic dermatitis), 알레르기비염(allergic rhinitis)"],"exp":"**천식으로 가는 분자 경로(molecular pathway)**는 흔히 **환경 유발 요인(environmental triggers)**으로 시작됩니다.\n\n여기에 관여하는 **Th2 세포**는 세 질환에 함께 관여하며, 이를 **아토피 삼징(atopic triad)**이라고 합니다.\n- **천식(asthma)**\n- **아토피피부염(atopic dermatitis)**\n- **알레르기비염(allergic rhinitis)**","why":{"0":"칸디다증과 충치는 천식 약물의 구강 부작용이지 아토피 삼징이 아닙니다.","1":"수면무호흡과 위식도역류는 아토피 삼징이 아닙니다.","2":"COPD와 폐기종은 아토피 삼징이 아닙니다.","3":"당뇨병과 고혈압은 아토피 삼징이 아닙니다."},"one":"Th2 세포가 관여하는 아토피 삼징은 천식·아토피피부염·알레르기비염이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 10","img":[{"u":"img/w12_asthma/p10.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 10"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-7":{"q":"Why is asthma called an obstructive pulmonary disease?","o":["Smooth muscle spasm and increased mucus secretion narrow the airway, making it difficult to breathe.","The pleural space fills with fluid.","The diaphragm is paralyzed.","The alveoli are destroyed by infection.","The upper airway collapses during sleep."],"a":0,"qk":"천식을 폐쇄성 폐질환(obstructive pulmonary disease)이라고 부르는 이유는?","ok":["평활근 연축과 점액 분비 증가로 기도가 좁아져 숨쉬기 어렵기 때문이다.","가슴막안에 액체가 차기 때문이다.","가로막이 마비되기 때문이다.","감염으로 폐포가 파괴되기 때문이다.","수면 중 상기도가 허탈되기 때문이다."],"exp":"천식에서 기도가 좁아지는 두 가지 이유:\n- **평활근 연축(smooth muscle spasm)** → 기도가 좁아짐\n- **점액 분비 증가(increased mucus secretion)** → 기도가 좁아짐\n\n그래서 **숨쉬기 어렵고**, 이것이 천식이 **폐쇄성 폐질환(obstructive pulmonary disease)**인 이유입니다.\n\n그리고 **혈관 투과성 증가(increased vascular permeability)**와 **면역세포 증가**, 특히 **호산구(eosinophils)**가 일어나며, 이것이 **폐의 내피(endothelium)를 손상**시킵니다.","why":{"1":"가슴막안 액체는 천식의 기전이 아닙니다.","2":"가로막 마비는 천식의 기전이 아닙니다.","3":"폐포 파괴는 천식이 폐쇄성 질환인 이유가 아닙니다.","4":"수면 중 상기도 허탈은 OSA입니다."},"one":"천식은 평활근 연축과 점액 분비 증가로 기도가 좁아지는 폐쇄성 폐질환이며, 호산구 등이 폐 내피를 손상시킨다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 11","img":[{"u":"img/w12_asthma/p11.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 11"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-8":{"q":"Over years, initially reversible asthma can become irreversible. Which changes cause this airway remodeling?","o":["Loss of cilia only","Cartilage calcification of the trachea","Alveolar wall destruction and air trapping","Edema, scarring and fibrosis, leading to a thickened basement membrane","Hyperplasia of the thyroid gland"],"a":3,"qk":"처음에는 가역적인 천식이 수년에 걸쳐 비가역적이 될 수 있다. 이런 기도 재형성을 일으키는 변화는?","ok":["섬모 소실만","기관 연골의 석회화","폐포벽 파괴와 공기 갇힘","부종, 흉터, 섬유화로 기저막이 두꺼워짐","갑상샘 증식"],"exp":"천식은 **처음에는 가역적(initially reversible)**이지만, **수년(years)**에 걸쳐 **비가역적(irreversible)**이 될 수 있습니다.\n\n반복되는 염증으로 **부종(edema), 흉터(scarring), 섬유화(fibrosis)**가 생기고, 그 결과 **기저막이 두꺼워집니다(thickened basement membrane)**. 이렇게 되면 기도 벽이 영구적으로 두꺼워져 내강이 좁은 상태로 남습니다.","why":{"0":"섬모 소실만으로 설명되지 않으며, 핵심은 부종·흉터·섬유화와 기저막 비후입니다.","1":"기관 연골의 석회화는 제시되지 않습니다.","2":"폐포벽 파괴는 천식의 비가역 변화로 제시되지 않습니다.","4":"갑상샘은 관계없습니다."},"one":"오래된 천식은 부종·흉터·섬유화로 기저막이 두꺼워져 비가역적이 될 수 있다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 12","img":[{"u":"img/w12_asthma/p12.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 12"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-9":{"q":"The causes of asthma are unknown. Which statement about genetic and environmental factors is correct?","o":["Environmental factors play no role in asthma.","No genes have been identified.","Genetic factors are linked to childhood asthma (<12 years); environmental factors are linked to later-onset asthma.","The hygiene hypothesis says increased early exposure to bacteria causes asthma.","Genetic factors are linked to later-onset asthma only."],"a":2,"qk":"천식의 원인은 알려지지 않았다. 유전 요인과 환경 요인에 대해 옳은 것은?","ok":["환경 요인은 천식에 아무 역할이 없다.","확인된 유전자는 없다.","유전 요인은 소아 천식(12세 미만)과, 환경 요인은 늦게 발병하는 천식과 연관된다.","위생 가설은 이른 시기 세균 노출 증가가 천식을 일으킨다고 본다.","유전 요인은 늦게 발병하는 천식과만 연관된다."],"exp":"천식의 **원인은 알려지지 않았습니다(unknown)**. 그러나 두 가지 요인이 중요합니다.\n\n- **유전 요인(genetic factors)** → **소아 천식(childhood asthma, 12세 미만)**: 특정 유전자가 확인되었고, 가족력이 있음\n- **환경 요인(environmental factors)** → **늦게 발병하는 천식(later onset asthma)**: **위생 가설(hygiene hypothesis)** – 이른 시기 세균·바이러스 **노출이 줄어서** 면역세포의 비율이 바뀔 수 있음\n\n유전과 환경 요인은 염증의 시작과 지속 모두에 중요합니다.","why":{"0":"환경 요인은 늦게 발병하는 천식과 연관되고 염증 지속에도 중요합니다.","1":"특정 유전자가 확인되었습니다.","3":"위생 가설은 노출 증가가 아니라 노출 감소를 말합니다.","4":"유전 요인은 소아 천식과 연관됩니다."},"one":"유전 요인은 소아 천식(12세 미만), 환경 요인은 늦은 발병 천식과 연관되며, 위생 가설은 이른 시기 미생물 노출 감소를 말한다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 13","img":[{"u":"img/w12_asthma/p13.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 13"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-10":{"q":"Which sputum findings are seen in asthma?","o":["Acid-fast bacilli","Curschmann spirals (mucus plugs, casts from small bronchi) and Charcot-Leyden crystals (need
