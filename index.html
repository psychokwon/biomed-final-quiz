acConkey agar).","세이어–마틴 한천(Thayer–Martin agar).","뢰벤슈타인–옌센 배지(Löwenstein–Jensen).","텔루라이트(Tinsdale) 한천."],"exp":"진균은 거의 모든 유기물을 탄소원으로 쓸 수 있어 영양 요구가 간단합니다. 수업에서 **사부로 덱스트로스 한천(Sabouraud dextrose agar)**에 물결 밑줄을 치고, 이것이 진균 배양의 **표준 배지(standard medium)**라고 강조했습니다. 보통 25–30°C에서 1–4주 배양이 필요합니다.","why":{"1":"맥콘키 한천은 그람 음성 세균, 특히 장내세균 선택 배지입니다.","2":"세이어–마틴 한천은 임균·수막구균 같은 나이세리아용 선택 배지입니다.","3":"뢰벤슈타인–옌센은 결핵균(mycobacteria) 배양 배지입니다.","4":"텔루라이트(Tinsdale) 한천은 디프테리아균 확인에 쓰입니다."},"one":"진균 배양의 표준 배지는 사부로 덱스트로스 한천이다.","src":"Mycology 2026.pdf, slide 15","img":[{"u":"img/w11_mycology/p15.webp","cap":"Mycology 2026.pdf, slide 15"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-12":{"q":"On the classification of fungal diseases, which category was struck through so that the lecture would not cover it?","o":["Cutaneous mycoses.","Subcutaneous mycoses.","Systemic mycoses.","Opportunistic mycoses.","Superficial (tinea versicolor) infections."],"a":1,"qk":"진균 질환 분류에서 이번 수업에서 다루지 않겠다고 줄을 그어 지운 범주는 무엇입니까?","ok":["피부 진균증(cutaneous mycoses).","피하 진균증(subcutaneous mycoses).","전신 진균증(systemic mycoses).","기회감염 진균증(opportunistic mycoses).","표재 감염(전풍, tinea versicolor)."],"exp":"진균 질환 분류에서 **피하 진균증(Subcutaneous)** 제목에 줄을 그어 지우고, **피부(cutaneous)**와 **전신(systemic)**은 그대로 남겨 두었습니다. 즉 이번 강의의 초점은 피부 진균증과 전신 진균증(그리고 이어지는 기회감염)이며, 피하 진균증은 다루지 않습니다.","why":{"0":"피부 진균증은 줄을 긋지 않고 남겨 둔 범주입니다. 백선(tinea, dermatophytes)이 여기에 속합니다.","2":"전신 진균증도 남겨 둔 범주입니다. 히스토플라스마, 블라스토미세스, 콕시디오이데스, 크립토코쿠스 등이 이어집니다.","3":"기회감염은 이후 칸디다, 뉴모시스티스, 아스페르길루스로 다룹니다. 줄을 그은 항목이 아닙니다.","4":"전풍은 표재 감염으로 따로 다루며, 제목을 지운 것은 피하 진균증입니다."},"one":"피하 진균증(subcutaneous)은 줄을 그어 지웠고, 피부·전신 진균증을 다룬다.","src":"Mycology 2026.pdf, slide 17","img":[{"u":"img/w11_mycology/p17.webp","cap":"Mycology 2026.pdf, slide 17"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-13":{"q":"Matching the handwritten site lists and the note “hair is micro thin,” which dermatophyte infects skin and hair but not nails?","o":["Trichophyton.","Epidermophyton.","Microsporum.","Malassezia furfur.","Cryptococcus neoformans."],"a":2,"qk":"손글씨로 적힌 감염 부위와 ‘hair is micro thin’ 메모에 따르면, 피부와 털은 감염시키지만 손발톱은 감염시키지 않는 피부사상균은 무엇입니까?","ok":["트리코피톤(Trichophyton).","에피더모피톤(Epidermophyton).","마이크로스포룸(Microsporum).","말라세지아 푸르푸르(Malassezia furfur).","크립토코쿠스 네오포르만스(Cryptococcus neoformans)."],"exp":"세 속(genera)이 중괄호·별표로 묶여 있습니다. 손글씨 부위는 **트리코피톤(Trichophyton): 피부·털·손발톱**, **마이크로스포룸(Microsporum): 피부·털**, **에피더모피톤(Epidermophyton): 피부·손발톱**입니다. 마이크로스포룸 옆에는 **hair is micro thin**이라고 적어, 이름이 ‘micro’인 속이 얇은 털(hair)을 침범한다는 연상으로 외우게 했습니다. 즉 손발톱을 빼는 속은 마이크로스포룸입니다.","why":{"0":"트리코피톤은 피부·털·손발톱 세 부위를 모두 감염시킵니다.","1":"에피더모피톤은 피부와 손발톱을 감염시키고 털은 감염시키지 않습니다.","3":"말라세지아는 피부사상균이 아니라, 각질층만 침범하는 전풍(tinea versicolor)의 원인입니다.","4":"크립토코쿠스는 피부사상균이 아니라 전신(기회) 진균입니다."},"one":"마이크로스포룸은 피부와 털만 감염시키고 손발톱은 감염시키지 않는다.","src":"Mycology 2026.pdf, slide 19","img":[{"u":"img/w11_mycology/p19.webp","cap":"Mycology 2026.pdf, slide 19"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-14":{"q":"What two features of dermatophyte infection were wavy-underlined under tinea / ringworm?","o":["Only nails are involved, and lesions are always square.","Lesions fluoresce red, and only the dermis is infected.","Hair is never involved, and lesions are painless vesicles.","Skin lesions form, and they have a circular shape.","Only zoophilic species cause circular lesions."],"a":3,"qk":"백선(tinea, ringworm) 설명에서 물결 밑줄이 쳐진 두 가지 특징은 무엇입니까?","ok":["손발톱만 침범하고, 병변은 항상 사각형이다.","병변이 빨간색으로 형광을 내고, 진피만 감염된다.","털은 절대 침범하지 않고, 병변은 통증 없는 수포이다.","피부 병변(skin lesions)이 생기며, 원형(circular shape)이다.","원형 병변은 동물친화성(zoophilic) 종만 만든다."],"exp":"**피부 병변(skin lesions)**과 **원형(circular shape)**에 물결 밑줄이 쳐져 있습니다. 백선은 피부, 털, 손발톱을 침범할 수 있는 피부 진균증이며, 특징적인 피부 병변의 모양이 원형이라서 ringworm이라고도 부릅니다. 원인균은 케라틴을 먹는 사상균(dermatophytes)입니다.","why":{"0":"손발톱만 침범하는 것이 아니며, 병변 모양은 원형입니다. 사각형이라는 기술은 없습니다.","1":"우드등(Wood’s lamp)에서 일부 종이 형광을 내기도 하지만, 여기서 밑줄 친 것은 피부 병변의 원형입니다. 감염 부위의 핵심은 각질층이지 ‘진피만’이 아닙니다.","2":"털도 침범할 수 있습니다(특히 트리코피톤, 마이크로스포룸). 원형 피부 병변이 핵심입니다.","4":"원형 병변은 백선의 일반적인 피부 소견이지, 동물친화성 종만의 특징이 아닙니다."},"one":"백선은 원형 피부 병변을 만든다.","src":"Mycology 2026.pdf, slide 20","img":[{"u":"img/w11_mycology/p20.webp","cap":"Mycology 2026.pdf, slide 20"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-15":{"q":"Which common-name pairings were starred and lined to the tinea terms?","o":["Tinea corporis is athlete’s foot; tinea pedis is jock itch.","Tinea capitis is onychomycosis; tinea unguium is scalp ringworm.","Tinea cruris is ringworm of the body; tinea corporis is jock itch.","Tinea versicolor is athlete’s foot.","Tinea pedis is athlete’s foot, tinea corporis is ringworm, tinea capitis is scalp ringworm, tinea cruris is jock itch, and tinea unguium is onychomycosis."],"a":4,"qk":"백선 이름과 일상 명칭을 별표·선으로 짝 지은 내용은 무엇입니까?","ok":["체부백선(tinea corporis)이 무좀, 족부백선(tinea pedis)이 사타구니 백선이다.","두부백선(tinea capitis)이 손발톱진균증, 조갑백선(tinea unguium)이 두피 백선이다.","사타구니백선(tinea cruris)이 몸 백선, 체부백선이 사타구니 백선이다.","전풍(tinea versicolor)이 무좀이다.","족부백선은 무좀(athlete’s foot), 체부백선은 링웜(ringworm), 두부백선은 두피 백선, 사타구니백선은 완선(jock itch), 조갑백선은 손발톱진균증(onychomycosis)이다."],"exp":"별표와 연결선으로 일상 이름을 짝지었습니다. **tinea pedis = athlete’s foot(무좀)**, **tinea corporis = ringworm(몸 백선)**, **tinea capitis = scalp ringworm(두피 백선)**, **tinea cruris = jock itch(완선)**, **tinea unguium = onychomycosis(손발톱진균증)**입니다. 전풍(tinea versicolor)은 이 짝짓기에 들어가지 않습니다.","why":{"0":"반대입니다. 무좀은 tinea pedis, 완선은 tinea cruris입니다.","1":"두부백선은 두피, 조갑백선이 손발톱진균증입니다. 서로 바뀌었습니다.","2":"tinea cruris가 완선(jock itch), tinea corporis가 몸 백선(ringworm)입니다.","3":"전풍은 말라세지아에 의한 표재 감염이지, 무좀(족부백선)이 아닙니다."},"one":"족부백선=무좀, 체부=링웜, 두부=두피 백선, 사타구니=완선, 조갑=손발톱진균증.","src":"Mycology 2026.pdf, slide 21","img":[{"u":"img/w11_mycology/p21.webp","cap":"Mycology 2026.pdf, slide 21"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-16":{"q":"What contrast was starred between anthropophilic dermatophytes and geophilic or zoophilic species?","o":["Anthropophilic species typically cause little inflammation; geophilic and zoophilic species cause inflammatory reactions.","Anthropophilic species always fluoresce; geophilic species never do.","Only geophilic species infect humans.","Zoophilic species cause no inflammation in humans.","Anthropophilic species infect only nails, never skin."],"a":0,"qk":"사람친화성(anthropophilic) 피부사상균과 토양성(geophilic)·동물친화성(zoophilic) 종 사이에 별표로 대비한 내용은 무엇입니까?","ok":["사람친화성 종은 염증이 거의 없고, 토양성·동물친화성 종은 염증 반응을 일으킨다.","사람친화성 종은 항상 형광을 내고, 토양성 종은 절대 내지 않는다.","사람을 감염시키는 것은 토양성 종뿐이다.","동물친화성 종은 사람에게 염증을 일으키지 않는다.","사람친화성 종은 손발톱만 감염시키고 피부는 감염시키지 않는다."],"exp":"**사람친화성(anthropophilic)**은 사람끼리 옮기며 **염증이 거의 없다(little inflammation)**고 별표와 선으로 강조되어 있습니다. 반대로 **토양성(geophilic)**과 **동물친화성(zoophilic)**은 **염증 반응(inflammatory)**을 일으킨다고 짝지어 두었습니다. 감염원의 숙주 범위가 염증의 세기를 가름합니다.","why":{"1":"형광은 일부 종의 우드등 소견이지, 이 별표 대비의 내용이 아닙니다.","2":"사람친화성 종이 사람 사이의 주된 감염원입니다. 토양성만 사람을 감염시키는 것이 아닙니다.","3":"동물친화성 종이 오히려 사람에게 염증을 잘 일으킵니다. 염증이 적은 쪽은 사람친화성입니다.","4":"사람친화성 종도 피부·털·손발톱을 침범할 수 있습니다. 손발톱만의 이야기가 아닙니다."},"one":"사람친화성은 염증이 거의 없고, 토양성·동물친화성은 염증을 잘 일으킨다.","src":"Mycology 2026.pdf, slide 22","img":[{"u":"img/w11_mycology/p22.webp","cap":"Mycology 2026.pdf, slide 22"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-17":{"q":"Which dermatophyte was arrowed as infecting skin, hair, and nails, and as the main cause of tinea pedis?","o":["Microsporum.","Trichophyton.","Epidermophyton.","Malassezia.","Sporothrix."],"a":1,"qk":"화살표로 ‘피부·털·손발톱’을 가리키고, 족부백선(tinea pedis)의 주된 원인으로 표시된 피부사상균은 무엇입니까?","ok":["마이크로스포룸(Microsporum).","트리코피톤(Trichophyton).","에피더모피톤(Epidermophyton).","말라세지아(Malassezia).","스포로트릭스(Sporothrix)."],"exp":"실험실 진단 설명에서 **트리코피톤(Trichophyton)**으로 화살표를 긋고 옆에 **skin, hair, nails**라고 적어 두었습니다. 같은 흐름에서 **족부백선(tinea pedis)은 주로 트리코피톤**이라고 연결되어 있습니다. 현미경으로 균사와 분생포자를 확인하고, 배양과 우드등도 보조로 씁니다.","why":{"0":"마이크로스포룸은 피부와 털을 감염시키고 손발톱은 감염시키지 않습니다. 족부백선의 주된 균도 아닙니다.","2":"에피더모피톤은 피부와 손발톱을 감염시키고 털은 감염시키지 않습니다. 주된 족부백선 균으로 화살표가 그어진 것은 트리코피톤입니다.","3":"말라세지아는 전풍의 원인이지 전형적인 피부사상균 백선의 주원인이 아닙니다.","4":"스포로트릭스는 피하 진균증(스포로트리쿠스증)의 원인으로, 이번 강의에서 피하 범주는 줄을 그어 제외했습니다."},"one":"트리코피톤은 피부·털·손발톱을 감염시키며 족부백선의 주된 원인이다.","src":"Mycology 2026.pdf, slide 24","img":[{"u":"img/w11_mycology/p24.webp","cap":"Mycology 2026.pdf, slide 24"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-18":{"q":"What did the starred arrow identify as a cause of tinea incognito?","o":["Failure to use any topical agent.","Oral griseofulvin given for every scalp infection.","Inappropriate use of topical steroids.","Wood’s lamp examination itself.","Application of allylamines to the nails only."],"a":2,"qk":"별표 친 화살표가 티네아 인코그니토(tinea incognito)의 원인으로 가리킨 것은 무엇입니까?","ok":["국소 약제를 전혀 쓰지 않는 것.","모든 두피 감염에 경구 그리세오풀빈을 쓰는 것.","국소 스테로이드(topical steroids)를 부적절하게 쓰는 것.","우드등(Wood’s lamp) 검사 자체.","알릴아민(allylamines)을 손발톱에만 바르는 것."],"exp":"치료 설명에서 **부적절한 국소 스테로이드 사용(inappropriate topical steroids)**에 화살표와 별표를 치고, 이것이 **티네아 인코그니토(tinea incognito)**로 이어진다고 적어 두었습니다. 스테로이드가 전형적인 백선 모양을 가려 진단을 어렵게 만듭니다. 피부 감염은 대개 국소 항진균제로 치료합니다.","why":{"0":"국소 약을 안 쓰는 것이 인코그니토의 정의가 아닙니다. 원인은 스테로이드를 잘못 쓰는 것입니다.","1":"경구 그리세오풀빈은 두피 등 적응이 되는 경우에 쓰는 전신 약이지, 인코그니토의 원인이 아닙니다.","3":"우드등은 진단 도구이지, 병변 형태를 가리는 원인이 아닙니다.","4":"알릴아민은 에르고스테롤 합성을 막는 항진균제입니다. 인코그니토의 원인이 아닙니다."},"one":"국소 스테로이드를 부적절하게 쓰면 티네아 인코그니토가 된다.","src":"Mycology 2026.pdf, slide 25","img":[{"u":"img/w11_mycology/p25.webp","cap":"Mycology 2026.pdf, slide 25"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-19":{"q":"Allylamines (e.g., terbinafine) and azoles share which mechanism, as shown by the arrows on the treatment slide?","o":["They inhibit fungal DNA gyrase.","They bind ergosterol already present and punch holes in the membrane.","They inhibit chitin synthesis in the cell wall.","They inhibit ergosterol synthesis.","They are converted into 5-fluorouracil inside fungal cells."],"a":3,"qk":"치료 설명의 화살표가 보여 주듯, 알릴아민(예: 테르비나핀)과 아졸(azole)이 공유하는 기전은 무엇입니까?","ok":["진균 DNA 자이레이스(gyrase)를 억제한다.","이미 있는 에르고스테롤에 결합해 막에 구멍을 낸다.","세포벽의 키틴 합성을 억제한다.","에르고스테롤 합성을 억제한다(inhibit ergosterol synthesis).","진균 세포 안에서 5-플루오로우라실로 바뀐다."],"exp":"알릴아민(테르비나핀 등)과 아졸 계열 모두에 **에르고스테롤 합성을 억제한다(inhibit ergosterol synthesis)**는 화살표가 그려져 있습니다. 에르고스테롤은 진균 막의 필수 성분이므로, 합성을 막으면 진균이 죽거나 성장을 멈춥니다. 같은 설명에서 클로트리마졸·미코나졸은 가장 흔한 항진균제로 표시되어 있습니다.","why":{"0":"DNA 자이레이스는 퀴놀론 계 항균제의 세균 표적입니다. 이 항진균제의 기전이 아닙니다.","1":"이미 있는 에르고스테롤에 결합해 구멍을 내는 것은 암포테리신 B의 기전에 가깝습니다. 알릴아민·아졸은 합성을 막습니다.","2":"키틴 합성 억제는 이 화살표의 내용이 아닙니다. 표적은 에르고스테롤 합성입니다.","4":"5-플루오로우라실로 바뀌는 것은 플루시토신(flucytosine)입니다."},"one":"알릴아민과 아졸은 모두 에르고스테롤 합성을 억제한다.","src":"Mycology 2026.pdf, slide 26","img":[{"u":"img/w11_mycology/p26.webp","cap":"Mycology 2026.pdf, slide 26"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-20":{"q":"Which pair was labeled “MOST COMMON anti-fungal meds”?","o":["Amphotericin B and nystatin.","Griseofulvin and terbinafine only.","Potassium iodide and flucytosine.","Fluconazole and itraconazole only.","Clotrimazole and miconazole."],"a":4,"qk":"‘가장 흔한 항진균제(MOST COMMON anti-fungal meds)’라고 적어 둔 짝은 무엇입니까?","ok":["암포테리신 B와 니스타틴.","그리세오풀빈과 테르비나핀만.","요오드화칼륨과 플루시토신.","플루코나졸과 이트라코나졸만.","클로트리마졸(clotrimazole)과 미코나졸(miconazole)."],"exp":"아졸 항목의 **클로트리마졸(clotrimazole)**과 **미코나졸(miconazole)** 옆에 **가장 흔한 항진균제(MOST COMMON anti-fungal meds)**라고 크게 적어 두었습니다. 둘 다 에르고스테롤 합성을 억제하는 아졸이며, 피부 진균 감염의 국소 치료에 흔히 쓰입니다.","why":{"0":"암포테리신 B는 중증 전신 진균증의 대표 약이고, 니스타틴은 칸디다 등 점막·피부에 국소로 쓰입니다. ‘가장 흔하다’고 적힌 짝은 클로트리마졸·미코나졸입니다.","1":"그리세오풀빈은 두피 등 전신 치료에, 테르비나핀은 알릴아민으로 쓰이지만, 그 문구가 붙은 것은 클로트리마졸·미코나졸입니다.","2":"이 약들은 여기서 ‘가장 흔하다’고 적힌 쌍이 아닙니다.","3":"플루코나졸·이트라코나졸도 아졸이지만, ‘MOST COMMON’이라고 손글씨로 표시된 것은 클로트리마졸과 미코나졸입니다."},"one":"가장 흔한 항진균제로 표시된 것은 클로트리마졸과 미코나졸이다.","src":"Mycology 2026.pdf, slide 26","img":[{"u":"img/w11_mycology/p26.webp","cap":"Mycology 2026.pdf, slide 26"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-21":{"q":"Tinea versicolor was braced and starred as which kind of infection, caused by which organism?","o":["A superficial infection of the stratum corneum caused by Malassezia furfur.","A deep dermal abscess caused by Trichophyton.","A systemic mold infection of the lungs caused by Aspergillus.","A nail-only infection caused by Epidermophyton.","A meningeal yeast infection caused by Cryptococcus."],"a":0,"qk":"전풍(tinea versicolor)은 중괄호·별표로 어떤 감염, 어떤 원인균으로 정리되었습니까?","ok":["각질층(stratum corneum)의 표재 감염이며, 원인균은 말라세지아 푸르푸르(Malassezia furfur)이다.","진피 심부 농양이며, 원인균은 트리코피톤이다.","폐의 전신 곰팡이 감염이며, 원인균은 아스페르길루스이다.","손발톱만의 감염이며, 원인균은 에피더모피톤이다.","수막의 효모 감염이며, 원인균은 크립토코쿠스이다."],"exp":"전풍은 **각질층(stratum corneum)의 표재 감염(superficial infection)**이라고 2번에 중괄호와 별표가 쳐져 있습니다. 원인균은 **말라세지아 푸르푸르(Malassezia furfur)**입니다. 각질만 침범하므로 전형적인 피부사상균 백선보다 얕고, 저색소·과색소 반을 만듭니다.","why":{"1":"전풍은 심부 농양이 아니라 각질층의 얕은 감염입니다. 트리코피톤은 전형적인 백선 균입니다.","2":"아스페르길루스는 기회감염 전신/폐 진균의 이야기입니다. 전풍의 원인균이 아닙니다.","3":"손발톱만의 감염은 조갑백선입니다. 전풍은 피부의 표재 변색입니다.","4":"크립토코쿠스 수막염은 전신(기회) 진균증이지 전풍이 아닙니다."},"one":"전풍은 말라세지아에 의한 각질층의 표재 감염이다.","src":"Mycology 2026.pdf, slide 27","img":[{"u":"img/w11_mycology/p27.webp","cap":"Mycology 2026.pdf, slide 27"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-22":{"q":"Which two fungi were enclosed in a handwritten oval as commensal fungi?","o":["Histoplasma and Blastomyces.","Malassezia and Candida.","Cryptococcus and Coccidioides.","Trichophyton and Microsporum.","Aspergillus flavus and Aspergillus parasiticus."],"a":1,"qk":"손글씨 타원 안에 ‘상재 진균(commensal fungi)’으로 묶어 둔 두 균은 무엇입니까?","ok":["히스토플라스마와 블라스토미세스.","말라세지아(Malassezia)와 칸디다(Candida).","크립토코쿠스와 콕시디오이데스.","트리코피톤과 마이크로스포룸.","아스페르길루스 플라부스와 파라시티쿠스."],"exp":"전풍 치료·예후 설명 옆에 **말라세지아와 칸디다는 상재 진균(Malassezia and Candida are commensal fungi)**이라고 타원으로 묶어 적어 두었습니다. 둘 다 사람의 피부나 점막에 정상적으로 살다가, 환경이 바뀌면 병을 일으킬 수 있습니다. 전풍 치료에는 셀레늄 설파이드(selenium sulfide)나 아졸 크림 등을 씁니다.","why":{"0":"히스토플라스마와 블라스토미세스는 환경(토양 등)에서 오는 이형성 전신 진균이지, 이 타원에 적힌 상재균이 아닙니다.","2":"크립토코쿠스·콕시디오이데스도 환경에서 흡입되는 전신 진균입니다.","3":"트리코피톤·마이크로스포룸은 피부사상균이며, 이 상재균 메모의 대상이 아닙니다.","4":"두 아스페르길루스 종은 아플라톡신(aflatoxin) 생산균으로 따로 박스 쳐져 있습니다. 상재균 타원이 아닙니다."},"one":"말라세지아와 칸디다는 상재 진균이다.","src":"Mycology 2026.pdf, slide 29","img":[{"u":"img/w11_mycology/p29.webp","cap":"Mycology 2026.pdf, slide 29"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-23":{"q":"In the systemic mycoses overview, what clinical feature was marked as true of all of these fungi?","o":["All are geographically restricted to the Southwestern United States.","All are dimorphic, including Cryptococcus.","All can cause mucocutaneous lesions.","None can involve the lungs.","All are highly contagious from person to person in their systemic form."],"a":2,"qk":"전신 진균증 개요에서, 이 균들 모두에 해당한다고 표시된 임상 특징은 무엇입니까?","ok":["모두 미국 남서부에만 지리적 제한이 있다.","크립토코쿠스를 포함해 모두 이형성이다.","모두 점막피부 병변(mucocutaneous lesions)을 일으킬 수 있다.","어느 것도 폐를 침범하지 못한다.","전신형은 모두 사람에서 사람으로 매우 잘 옮는다."],"exp":"개요에서 **모두 점막피부 병변을 일으킬 수 있다(all can cause mucocutaneous lesions)**는 문장에 표시가 되어 있습니다. 전신 진균은 대개 폐에서 시작해 피부·점막으로 퍼질 수 있습니다. 같은 개요에서 이형성은 크립토코쿠스를 제외하고, 전신형은 전염되지 않으며, 피부형은 전염될 수 있다고 손글씨로 보강해 두었습니다.","why":{"0":"미국 남서부에 토착인 것은 콕시디오이데스입니다. 전신 진균 전부에 해당하는 지리가 아닙니다.","1":"별표로 ‘Dimorphic except Cryptococcus’라고 되어 있습니다. 크립토코쿠스는 이형성이 아닙니다.","3":"전신 진균은 대개 폐 흡입으로 시작합니다. 폐를 못 침범하는 것이 아닙니다.","4":"전신형은 사람 사이에 전염되지 않는다고 적혀 있습니다. 전염되는 쪽은 피부형입니다."},"one":"전신 진균은 모두 점막피부 병변을 일으킬 수 있다.","src":"Mycology 2026.pdf, slide 32","img":[{"u":"img/w11_mycology/p32.webp","cap":"Mycology 2026.pdf, slide 32"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-24":{"q":"Which two annotations were starred or handwritten on the systemic mycoses overview?","o":["All of these fungi are monomorphic yeasts; none is contagious.","Only Cryptococcus is dimorphic; systemic disease is highly contagious.","Cutaneous disease is never contagious; all species are dimorphic.","They are dimorphic except Cryptococcus, and cutaneous disease is contagious.","Systemic disease is contagious, but cutaneous disease is not."],"a":3,"qk":"전신 진균증 개요에서 별표 또는 손글씨로 보강한 두 가지는 무엇입니까?","ok":["이 균들은 모두 단일형 효모이며, 어느 것도 전염되지 않는다.","이형성인 것은 크립토코쿠스뿐이며, 전신 질환은 매우 잘 옮는다.","피부형은 결코 전염되지 않고, 모든 종이 이형성이다.","크립토코쿠스를 제외하면 이형성이며, 피부형은 전염된다(cutaneous = contagious).","전신형은 전염되고, 피부형은 전염되지 않는다."],"exp":"**Dimorphic except Cryptococcus**에 별표가 쳐져 있습니다. 즉 블라스토미세스, 파라콕시디오이데스, 히스토플라스마, 콕시디오이데스는 이형성이고, 크립토코쿠스만 이형성이 아닙니다. 아래쪽에는 손글씨로 **피부형 = 전염된다(Cutaneous = contagious)**고 적어, 전신형은 전염되지 않는다는 인쇄 문구와 대비했습니다.","why":{"0":"크립토코쿠스를 제외하면 이형성입니다. 모두 단일형 효모가 아니며, 피부형은 전염될 수 있습니다.","1":"반대입니다. 크립토코쿠스만 이형성이 아니고, 전신형은 전염되지 않습니다.","2":"피부형은 전염된다고 손글씨로 적혀 있고, 모든 종이 이형성인 것도 아닙니다(크립토코쿠스 제외).","4":"방향이 반대입니다. 전신형은 전염되지 않고, 피부형은 전염됩니다."},"one":"크립토코쿠스를 제외하면 이형성이고, 피부형은 전염된다.","src":"Mycology 2026.pdf, slide 32","img":[{"u":"img/w11_mycology/p32.webp","cap":"Mycology 2026.pdf, slide 32"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-25":{"q":"Which laboratory features of Cryptococcus neoformans were wavy-underlined?","o":["Dimorphic mold in tissue; acid-fast staining of hyphae.","Intracellular tuberculate macroconidia on silver stain only.","Germ-tube formation and chlamydospores in serum.","Broad-based budding and a figure-8 appearance.","Encapsulated budding yeast with a polysaccharide capsule, demonstrated by India ink, and not dimorphic."],"a":4,"qk":"크립토코쿠스 네오포르만스(Cryptococcus neoformans)에서 물결 밑줄이 쳐진 검사실 특징은 무엇입니까?","ok":["조직에서는 이형성 곰팡이이며, 균사는 항산성 염색이 된다.","은염색에서만 보이는 세포 안 결절형 대형분생포자.","혈청에서 발아관(germ tube)과 후막포자.","넓은 기저의 출아와 8자 모양.","피막이 있는 출아 효모이고 다당 피막(polysaccharide capsule)을 가지며, 먹을 먹(India ink)으로 확인하고, 이형성이 아니다."],"exp":"**피막이 있는 출아 효모(encapsulated budding yeast)**, **다당 피막(polysaccharide capsule)**, **먹을 먹(India ink)**에 물결 밑줄이 쳐져 있고, **이형성이 아니다(Not dimorphic)**는 점도 강조되어 있습니다. 피막이 먹을 먹 배경에서 투명한 달무리로 보이며, 이것이 중요한 진단 소견입니다.","why":{"0":"크립토코쿠스는 이형성이 아니며 조직에서 피막 효모로 보입니다. 항산성 균사는 결핵균 쪽 이야기입니다.","1":"결절형 대형분생포자와 세포 내 기생은 히스토플라스마의 특징입니다.","2":"발아관·후막포자는 칸디다 알비칸스의 검사 소견에 가깝습니다.","3":"넓은 기저 출아·8자 모양은 블라스토미세스의 특징입니다."},"one":"크립토코쿠스는 이형성이 아닌 피막 출아 효모이며, 다당 피막을 먹을 먹으로 확인한다.","src":"Mycology 2026.pdf, slide 33","img":[{"u":"img/w11_mycology/p33.webp","cap":"Mycology 2026.pdf, slide 33"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-26":{"q":"On the Cryptococcus pathogenesis pathway, what did the handwritten arrows URT and LRT stand for?","o":["Upper respiratory tract, then lower respiratory tract, then blood.","Urethra, then lower urinary tract, then bladder.","Upper GI tract, then lymph ring, then thoracic duct.","Unencapsulated resting trophozoite, then latent round trophozoite.","Upper skin region, then lower skin region, then nail."],"a":0,"qk":"크립토코쿠스 발병 경로에서 손글씨 화살표 URT와 LRT는 무엇을 뜻합니까?","ok":["상기도(upper respiratory tract)에서 하기도(lower respiratory tract)로 간 뒤 혈액으로 간다.","요도에서 하부 요로, 방광으로 간다.","상부 위장관에서 림프고리, 흉관으로 간다.","피막 없는 휴지기 영양형에서 잠복 원형 영양형으로 바뀐다.","상부 피부에서 하부 피부, 손발톱으로 간다."],"exp":"경로 그림 위에 **upper/lower respiratory tract**라고 적어 두고, **URT → LRT → Blood**로 화살표를 그었습니다. 흙·새 배설물에 있는 효모가 공기로 흡입되어 상기도에서 하기도, 이어서 혈액으로 퍼집니다. 피막이 있으면 식세포 작용을 피하고 전신으로 나갈 수 있습니다.","why":{"1":"URT/LRT는 호흡기입니다. 요로가 아닙니다.","2":"이 경로는 호흡기 흡입 후 혈행 전파이지, 위장관·흉관이 아닙니다.","3":"영양형 전환은 원충(예: 아메바) 용어입니다. 크립토코쿠스 경로의 URT/LRT가 아닙니다.","4":"피부·손발톱 경로는 피부사상균의 이야기입니다."},"one":"URT는 상기도, LRT는 하기도이며, 흡입 후 혈액으로 퍼진다.","src":"Mycology 2026.pdf, slide 34","img":[{"u":"img/w11_mycology/p34.webp","cap":"Mycology 2026.pdf, slide 34"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-27":{"q":"Which central-nervous-system points were highlighted or underlined for Cryptococcus neoformans?","o":["It is strictly dermatotropic and never reaches the meninges.","It is neurotropic, causes meningitis, and encapsulated yeast cells are found in brain tissue.","It forms endosporulating spherules in the cerebral cortex.","It produces aflatoxins that necrose the basal ganglia.","It remains confined to the scalp as tinea capitis."],"a":1,"qk":"크립토코쿠스 네오포르만스에서 강조되거나 밑줄 쳐진 중추신경계 관련 내용은 무엇입니까?","ok":["엄격히 피부친화성이어서 수막에는 절대 가지 않는다.","친신경성(neurotropic)이며 수막염(meningitis)을 일으키고, 뇌 조직에서 피막 효모 세포가 관찰된다.","대뇌피질에서 내생포자 구상체(endosporulating spherules)를 만든다.","기저핵을 괴사시키는 아플라톡신을 만든다.","두부백선으로 두피에만 머문다."],"exp":"**친신경성(neurotropic)**이 노란 형광으로 강조되어 있고, **수막염(meningitis)**에 밑줄이 쳐져 있습니다. 병리 설명에서는 **뇌 조직(in brain tissue)**에 피막 효모가 보인다는 구절에 손글씨 물결 밑줄이 있습니다. 크립토코쿠스는 폐에서 시작해 특히 중추신경계로 잘 퍼집니다.","why":{"0":"피부친화성이 아니라 친신경성입니다. 수막염이 중요한 임상상입니다.","2":"내생포자 구상체는 콕시디오이데스의 조직 형태입니다.","3":"아플라톡신은 아스페르길루스 플라부스·파라시티쿠스가 만드는 독소입니다.","4":"두부백선은 피부사상균의 두피 감염입니다. 크립토코쿠스의 CNS 침범이 아닙니다."},"one":"크립토코쿠스는 친신경성이며 수막염을 일으키고, 뇌 조직에서 피막 효모가 보인다.","src":"Mycology 2026.pdf, slide 35, 36","img":[{"u":"img/w11_mycology/p35.webp","cap":"Mycology 2026.pdf, slide 35"},{"u":"img/w11_mycology/p36.webp","cap":"Mycology 2026.pdf, slide 36"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-28":{"q":"For Blastomyces dermatitidis, which temperature–form relationship and budding pattern were emphasized?","o":["Room temperature = yeast; body temperature = mold; no budding.","It is not dimorphic and grows only as a mold in tissue.","It is dimorphic: room temperature (RT) = mold, body temperature = yeast, with single budding.","Body temperature produces spherules filled with endospores.","Both temperatures produce only arthroconidia."],"a":2,"qk":"블라스토미세스 더마티티디스(Blastomyces dermatitidis)에서 강조된 온도–형태 관계와 출아 양상은 무엇입니까?","ok":["실온 = 효모, 체온 = 곰팡이이며, 출아는 없다.","이형성이 아니며 조직에서는 곰팡이로만 자란다.","이형성이다. 실온(RT) = 곰팡이, 체온 = 효모이며, 단일 출아(single budding)를 한다.","체온에서는 내생포자로 가득 찬 구상체가 된다.","두 온도 모두 분절포자(arthroconidia)만 만든다."],"exp":"**이형성(dimorphic)**에 밑줄이 있고, **실온(RT) = 곰팡이**, **체온(body temp) = 효모**라고 적어 두었습니다. 효모형의 **단일 출아(single budding)**가 강조되어 있습니다. 이는 파라콕시디오이데스의 다중 출아(파일럿 휠)와 구별됩니다.","why":{"0":"방향이 반대입니다. 실온이 곰팡이, 체온이 효모입니다.","1":"블라스토미세스는 이형성이며, 조직(체온)에서는 효모입니다.","3":"구상체·내생포자는 콕시디오이데스입니다.","4":"분절포자는 무성포자의 한 형태이지, 블라스토미세스의 체온 형태가 아닙니다."},"one":"블라스토미세스는 이형성으로, 실온은 곰팡이, 체온은 단일 출아 효모이다.","src":"Mycology 2026.pdf, slide 39","img":[{"u":"img/w11_mycology/p39.webp","cap":"Mycology 2026.pdf, slide 39"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-29":{"q":"For blastomycosis, which sites were oval-marked as the initial infection and the most common secondary site?","o":["Bone is initial; meninges are the most common secondary site.","Mucous membranes of mouth and nose are initial; lung is secondary.","Gastrointestinal tract is initial; liver is the most common secondary site.","Pulmonary is initial; cutaneous is the most common secondary site.","Genitourinary tract is initial; scalp is the most common secondary site."],"a":3,"qk":"블라스토미세스증에서 타원으로 표시된 초기 감염 부위와 가장 흔한 이차 부위는 무엇입니까?","ok":["뼈가 초기이고, 수막이 가장 흔한 이차 부위이다.","입·코 점막이 초기이고, 폐가 이차 부위이다.","위장관이 초기이고, 간이 가장 흔한 이차 부위이다.","폐(pulmonary)가 초기이고, 피부(cutaneous)가 가장 흔한 이차 부위이다.","비뇨생식기가 초기이고, 두피가 가장 흔한 이차 부위이다."],"exp":"**폐(Pulmonary) = 초기(initial)**, **피부(Cutaneous) = 가장 흔한 이차(most common secondary)**라고 타원으로 묶어 두었습니다. 흡입으로 폐에서 시작한 뒤, 혈행으로 퍼질 때 피부가 가장 흔한 이차 병터입니다.","why":{"0":"뼈·수막 전파는 콕시디오이데스 파종의 밑줄 항목에 가깝습니다. 블라스토미세스의 타원은 폐→피부입니다.","1":"입·코 점막이 가장 흔한 이차 부위인 것은 파라콕시디오이데스입니다. 초기 부위도 폐입니다.","2":"위장관 초기는 이 균의 전형이 아닙니다.","4":"비뇨생식기·두피는 이 타원의 내용이 아닙니다."},"one":"블라스토미세스증은 폐가 초기, 피부가 가장 흔한 이차 부위이다.","src":"Mycology 2026.pdf, slide 40","img":[{"u":"img/w11_mycology/p40.webp","cap":"Mycology 2026.pdf, slide 40"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-30":{"q":"Paracoccidioides brasiliensis yeast was circled for which distinctive appearance, and what handwritten name was given to it?","o":["Single narrow-neck budding; “bowling pin.”","Tuberculate macroconidia; “finger spores.”","Endosporulating spherules; “cyst balls.”","Encapsulated yeast; “India-ink halo.”","Multiple-budding yeast; “pilot-wheel.”"],"a":4,"qk":"파라콕시디오이데스 브라실리엔시스(Paracoccidioides brasiliensis) 효모에서 동그라미 친 독특한 모양과, 손글씨로 붙인 이름은 무엇입니까?","ok":["가는 목의 단일 출아; ‘볼링핀’.","결절형 대형분생포자; ‘손가락 포자’.","내생포자 구상체; ‘낭종 공’.","피막 효모; ‘먹을 먹 달무리’.","다중 출아 효모(multiple-budding yeast); ‘파일럿 휠(pilot-wheel)’."],"exp":"**다중 출아(Multiple-budding)**가 동그라미 쳐져 있고, 옆에 **파일럿 휠(pilot-wheel)**이라고 손글씨로 적어 두었습니다. 모세포 둘레에 여러 출아가 배 조타륜처럼 붙는 모습이 이 균의 특징적 조직 형태입니다. 남아메리카에 토착인 이형성 진균입니다.","why":{"0":"단일 출아는 블라스토미세스(넓은 기저)에 가깝습니다. 파라콕시디오이데스는 다중 출아입니다.","1":"결절형 대형분생포자와 ‘포자에 손가락 같은 돌기’는 히스토플라스마의 메모입니다.","2":"내생포자 구상체는 콕시디오이데스입니다.","3":"피막·먹을 먹은 크립토코쿠스입니다."},"one":"파라콕시디오이데스는 다중 출아 효모로, 모양이 파일럿 휠이다.","src":"Mycology 2026.pdf, slide 42","img":[{"u":"img/w11_mycology/p42.webp","cap":"Mycology 2026.pdf, slide 42"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-31":{"q":"For paracoccidioidomycosis, which sites were oval-marked and starred as the initial infection and the most common secondary site?","o":["Pulmonary is initial; mucous membranes of the mouth and nose are the most common secondary site.","Cutaneous skin is initial; bone is the most common secondary site.","Meninges are initial; lung is the most common secondary site.","Nails are initial; scalp is the most common secondary site.","Gastrointestinal tract is initial; kidney is the most common secondary site."],"a":0,"qk":"파라콕시디오이데스증에서 타원·별표로 표시된 초기 감염과 가장 흔한 이차 부위는 무엇입니까?","ok":["폐가 초기이고, 입과 코의 점막이 가장 흔한 이차 부위이다.","피부가 초기이고, 뼈가 가장 흔한 이차 부위이다.","수막이 초기이고, 폐가 가장 흔한 이차 부위이다.","손발톱이 초기이고, 두피가 가장 흔한 이차 부위이다.","위장관이 초기이고, 신장이 가장 흔한 이차 부위이다."],"exp":"**폐(Pulmonary) = 초기(initial)**, **입과 코의 점막(Mucous membranes mouth and nose) = 가장 흔한 이차(most common secondary)**라고 타원과 별표로 묶어 두었습니다. 폐에서 시작한 뒤 구강·비강 점막으로 잘 퍼지는 것이 이 질환의 임상 특징입니다. 블라스토미세스증의 가장 흔한 이차 부위가 피부인 것과 대조됩니다.","why":{"1":"피부가 가장 흔한 이차 부위인 것은 블라스토미세스증입니다.","2":"수막이 초기가 아닙니다. 초기는 폐입니다. 수막 파종은 콕시디오이데스 등에서 밑줄 친 항목입니다.","3":"손발톱·두피는 피부사상균의 이야기입니다.","4":"위장관 초기·신장 이차는 이 타원의 내용이 아닙니다."},"one":"파라콕시디오이데스증은 폐가 초기, 입·코 점막이 가장 흔한 이차 부위이다.","src":"Mycology 2026.pdf, slide 43","img":[{"u":"img/w11_mycology/p43.webp","cap":"Mycology 2026.pdf, slide 43"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-32":{"q":"Histoplasma capsulatum was circled and annotated as infecting which cells?","o":["Erythrocytes only, as an extracellular pathogen.","Phagocytes; it is intracellular.","Squamous epithelial cells of the epidermis only.","Neurons after crossing the blood–brain barrier first.","Keratinocytes of hair shafts only."],"a":1,"qk":"히스토플라스마 캡술라툼(Histoplasma capsulatum)은 동그라미와 손글씨로 어떤 세포를 감염시킨다고 되어 있습니까?","ok":["세포 밖 병원체로서 적혈구만 감염시킨다.","식세포(phagocytes)를 감염시키며, 세포 내(intracellular) 병원체이다.","표피 편평상피만 감염시킨다.","혈뇌장벽을 먼저 넘은 뒤 신경세포만 감염시킨다.","모간의 각질형성세포만 감염시킨다."],"exp":"**세포 내(Intracellular)**가 동그라미·별표로 강조되어 있고, 옆에 **식세포를 감염시킨다(infects phagocytes)**고 적어 두었습니다. 히스토플라스마는 이형성이며, 몸 안에서 대식세포 등 식세포 안에 삽니다. 이 점이 다른 전신 진균과 구별되는 핵심입니다.","why":{"0":"적혈구 내 기생은 말라리아 같은 원충의 이야기입니다. 히스토플라스마는 식세포 안에 있습니다.","2":"표피 편평상피만 감염시키는 것은 표재·피부 진균에 가깝습니다.","3":"친신경성으로 뇌를 잘 침범하는 것은 크립토코쿠스입니다. 히스토플라스마의 별표는 식세포 내 기생입니다.","4":"모간 각질은 피부사상균의 이야기에 가깝습니다."},"one":"히스토플라스마는 식세포를 감염시키는 세포 내 병원체이다.","src":"Mycology 2026.pdf, slide 31, 46","img":[{"u":"img/w11_mycology/p31.webp","cap":"Mycology 2026.pdf, slide 31"},{"u":"img/w11_mycology/p46.webp","cap":"Mycology 2026.pdf, slide 46"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-33":{"q":"What handwritten description was given for the tuberculate macroconidia of Histoplasma?","o":["Broad-based single buds that look like a figure 8.","A polysaccharide halo seen with India ink.","Finger-like projections on the spore.","A wheel of multiple buds around a mother cell.","Spherules packed with endospores instead of yeast."],"a":2,"qk":"히스토플라스마의 결절형 대형분생포자(tuberculate macroconidia)에 대해 손글씨로 적어 둔 설명은 무엇입니까?","ok":["8자처럼 보이는 넓은 기저의 단일 출아.","먹을 먹으로 보이는 다당 달무리.","포자에 손가락 같은 돌기(finger-like projections on spore).","모세포 둘레의 다중 출아 바퀴.","효모 대신 내생포자로 가득 찬 구상체."],"exp":"결절형 대형분생포자(tuberculate macroconidia) 옆에 **포자에 손가락 같은 돌기(finger-like projections on spore)**라고 적어 두었습니다. 배양에서 보이는 이 돌기 있는 큰 분생포자가 히스토플라스마의 중요한 형태 단서입니다. 조직에서는 식세포 안의 작은 효모로 보입니다.","why":{"0":"넓은 기저 출아·8자 모양은 블라스토미세스입니다.","1":"먹을 먹 다당 달무리는 크립토코쿠스입니다.","3":"다중 출아 바퀴(파일럿 휠)는 파라콕시디오이데스입니다.","4":"효모 대신 구상체인 것은 콕시디오이데스입니다."},"one":"히스토플라스마의 결절형 대형분생포자는 포자에 손가락 같은 돌기가 있다.","src":"Mycology 2026.pdf, slide 46","img":[{"u":"img/w11_mycology/p46.webp","cap":"Mycology 2026.pdf, slide 46"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-34":{"q":"Histoplasma habitat was annotated how, next to soil with bird and bat droppings?","o":["The droppings sterilize the soil so the fungus cannot grow.","Only river-bank sand, never droppings, supports growth.","The fungus lives only in human keratin, not in soil.","Droppings “feed the bacteria” (the fungus in that soil).","Growth occurs only in desert rodent burrows of the Southwest."],"a":3,"qk":"새와 박쥐 배설물이 있는 흙 옆에, 히스토플라스마 서식지에 대해 적어 둔 메모는 무엇입니까?","ok":["배설물이 흙을 멸균해 진균이 자라지 못하게 한다.","강기슭 모래에서만 자라고 배설물에서는 자라지 않는다.","이 균은 흙이 아니라 사람 케라틴에만 산다.","배설물이 ‘세균(이 흙의 진균)을 먹여 살린다(feed the bacteria)’.","미국 남서부 사막 설치류 굴에서만 자란다."],"exp":"서식지인 **새와 박쥐 배설물이 있는 흙** 옆에 **feed the bacteria**라고 적어 두었습니다. 배설물이 흙 속 히스토플라스마가 자라는 영양이 된다는 뜻의 메모입니다(여기서 bacteria는 느슨한 손글씨 표현이고, 실제 병원체는 진균입니다). 이런 흙의 미소유착소(microconidia)를 들이마시면 감염됩니다.","why":{"0":"배설물은 균을 말려 없애는 것이 아니라, 흙에서 균이 잘 자라게 합니다.","1":"강기슭은 이 균의 전형적인 설명가 아닙니다. 핵심은 배설물 섞인 흙입니다.","2":"사람 케라틴을 먹는 것은 피부사상균입니다. 히스토플라스마는 환경 흙에서 옵니다.","4":"남서부 사막은 콕시디오이데스의 토착지입니다."},"one":"새·박쥐 배설물이 있는 흙이 히스토플라스마를 키운다.","src":"Mycology 2026.pdf, slide 47","img":[{"u":"img/w11_mycology/p47.webp","cap":"Mycology 2026.pdf, slide 47"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-35":{"q":"When the immune system is good, pulmonary histoplasmosis is typically what, and which two disseminated findings were oval-starred?","o":["Rapidly fatal ARDS in every host; only nail pits are starred.","Always an AIDS-defining illness, even in healthy hosts; only tinea.","A chronic meningitis from the start; only spherules in tissue.","A purely cutaneous contagion; only athlete’s foot.","A benign, self-limited, flu-like illness; involvement of reticuloendothelial tissues and oral lesions."],"a":4,"qk":"면역이 좋을 때 폐 히스토플라스마증은 전형적으로 어떤 경과이며, 타원·별표로 표시된 파종 소견 두 가지는 무엇입니까?","ok":["모든 숙주에서 급속히 치명적인 ARDS이며, 별표는 손발톱 함몰뿐이다.","건강한 숙주에서도 항상 AIDS 정의 질환이며, 백선뿐이다.","처음부터 만성 수막염이며, 조직의 구상체뿐이다.","순수한 피부 전염병이며, 무좀뿐이다.","양호하고 스스로 끝나는 독감 비슷한 병이며, 그물내피 조직(RE tissues) 침범과 구강 병변(oral lesions)이다."],"exp":"손글씨로 **면역이 좋으면(if immune system is good)** 폐 감염은 **양호하고 스스로 끝나며 독감 비슷한(benign, self-limited, flu-like)** 경과라고 연결되어 있습니다. 파종되면 **그물내피 조직(RE tissues)**과 **구강 병변(Oral lesions)**이 타원·별표로 강조됩니다. 면역이 떨어진 사람에서 파종 위험이 큽니다.","why":{"0":"건강한 숙주의 전형은 가벼운 독감 비슷한 경과이지, 모든 사람에서 치명적인 ARDS가 아닙니다.","1":"AIDS 정의 질환으로 박스·별표가 쳐진 것은 HIV 양성에서의 히스토플라스마증입니다. 건강한 숙주의 전형적인 폐 감염은 가벼운 경과입니다.","2":"만성 수막염·구상체는 크립토코쿠스·콕시디오이데스 쪽에 가깝습니다.","3":"피부 전염·무좀은 피부사상균의 이야기입니다."},"one":"면역이 좋으면 가벼운 독감처럼 지나가고, 파종 때는 그물내피 조직과 구강 병변이 중요하다.","src":"Mycology 2026.pdf, slide 47","img":[{"u":"img/w11_mycology/p47.webp","cap":"Mycology 2026.pdf, slide 47"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-36":{"q":"Histoplasmosis in which host was boxed and starred as an AIDS-defining illness?","o":["HIV-positive (AIDS) patients.","Healthy children with tinea capitis only.","Every immunocompetent adult with a positive skin test.","Patients whose only risk is walking barefoot.","Pregnant women in the first trimester only."],"a":0,"qk":"박스와 별표로 ‘AIDS 정의 질환(AIDS defining illness)’이라고 표시된 히스토플라스마증의 숙주는 누구입니까?","ok":["HIV 양성(AIDS) 환자.","두부백선만 있는 건강한 어린이.","피부시험 양성인 모든 면역정상 성인.","맨발로 걷는 것만이 위험 요인인 사람.","첫 삼분기 임신부만."],"exp":"**HIV 양성(HIV +ve)** 항목이 박스와 별표로 **AIDS 정의 질환(AIDS defining illness)**이라고 강조되어 있습니다. 면역이 떨어진 AIDS 환자에서 히스토플라스마증은 파종되기 쉽고, 그 자체로 AIDS를 정의하는 기회감염이 됩니다. 면역이 좋은 사람에서의 가벼운 폐 감염과는 무게가 다릅니다.","why":{"1":"두부백선은 피부사상균 감염이며 AIDS 정의 질환이 아닙니다.","2":"피부시험 양성은 노출을 시사할 수 있지만, AIDS 정의로 박스 친 것은 HIV 양성 환자의 히스토플라스마증입니다.","3":"맨발은 일부 피하·피부 진균의 위험 이야기이지, 이 박스의 내용이 아닙니다.","4":"임신 3삼분기는 질칸디다증이 늘어난다는 밑줄과 관련 있습니다. 이 AIDS 정의 박스가 아닙니다."},"one":"HIV 양성 환자에서 히스토플라스마증은 AIDS 정의 질환이다.","src":"Mycology 2026.pdf, slide 48","img":[{"u":"img/w11_mycology/p48.webp","cap":"Mycology 2026.pdf, slide 48"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-37":{"q":"Coccidioides immitis differs from a typical yeast form in tissue. What phrase was written next to endosporulating spherules?","o":["“Same as a cryptococcal capsule.”","“Instead of yeast.”","“Pilot-wheel buds.”","“Finger-like projections.”","“Only at 25°C in soil.”"],"a":1,"qk":"콕시디오이데스 이미티스(Coccidioides immitis)는 조직에서 전형적인 효모형과 다릅니다. 내생포자 구상체(endosporulating spherules) 옆에 적어 둔 구절은 무엇입니까?","ok":["‘크립토코쿠스 피막과 같다.’","‘효모 대신에(instead of yeast).’","‘파일럿 휠 출아.’","‘손가락 같은 돌기.’","‘흙 속 25°C에서만.’"],"exp":"조직 형태인 **내생포자를 품은 구상체(endosporulating spherules)** 옆에 **효모 대신에(instead of yeast)**라고 적어 두었습니다. 다른 이형성 전신 진균은 몸 안에서 효모가 되지만, 콕시디오이데스만은 효모 대신 구상체가 됩니다. 구상체 안에서 내생포자가 성숙해 터지며 퍼집니다.","why":{"0":"피막 효모는 크립토코쿠스입니다. 구상체는 그와 다릅니다.","2":"파일럿 휠은 파라콕시디오이데스의 다중 출아입니다.","3":"손가락 같은 돌기는 히스토플라스마의 결절형 대형분생포자입니다.","4":"구상체는 몸 안(체온) 조직 형태입니다. 흙·실온에서는 곰팡이(분절포자)입니다."},"one":"콕시디오이데스는 몸 안에서 효모 대신 내생포자 구상체가 된다.","src":"Mycology 2026.pdf, slide 49","img":[{"u":"img/w11_mycology/p49.webp","cap":"Mycology 2026.pdf, slide 49"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-38":{"q":"Which endemic region for coccidioidomycosis was marked with an oval and stars?","o":["The Ohio and Mississippi river valleys only.","The Amazon basin only.","The Southwestern United States.","East Africa only.","Northern Europe only."],"a":2,"qk":"콕시디오이데스증의 토착 지역으로 타원과 별표가 쳐진 곳은 어디입니까?","ok":["오하이오·미시시피 강 유역만.","아마존 분지만.","미국 남서부(Southwestern U.S.A.).","동아프리카만.","북유럽만."],"exp":"**미국 남서부(Southwestern U.S.A.)**가 타원과 별표로 강조되어 있습니다. 사막 먼지가 날리는 이 지역이 콕시디오이데스의 전형적인 토착지입니다. 흙의 분절포자를 들이마시면 폐 감염(일명 Valley fever 등)이 시작됩니다.","why":{"0":"오하이오·미시시피 강 유역은 히스토플라스마의 전형적인 지리입니다.","1":"남아메리카(브라질 등)는 파라콕시디오이데스의 지리입니다.","3":"동아프리카는 이 타원의 내용이 아닙니다.","4":"북유럽은 이 균의 토착지가 아닙니다."},"one":"콕시디오이데스증은 미국 남서부에 토착이다.","src":"Mycology 2026.pdf, slide 51","img":[{"u":"img/w11_mycology/p51.webp","cap":"Mycology 2026.pdf, slide 51"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-39":{"q":"When coccidioidomycosis disseminates, which targets were underlined?","o":["Only the hair shaft and nail plate.","Only the stratum corneum.","Only reticuloendothelial tissues and the tongue.","Skin, bones, joints, and meninges.","Only the nasal septum and vocal cords."],"a":3,"qk":"콕시디오이데스증이 파종될 때 밑줄 쳐진 표적 부위는 어디입니까?","ok":["모간과 조갑판만.","각질층만.","그물내피 조직과 혀만.","피부, 뼈, 관절, 수막(skin, bones, joints, meninges).","코중격과 성대만."],"exp":"파종(dissemination) 설명에서 **피부, 뼈, 관절, 수막(skin, bones, joints, meninges)**에 밑줄이 쳐져 있습니다. 폐에서 시작한 감염이 혈행으로 이 부위들에 퍼질 수 있습니다. 특히 수막 침범은 심한 경과입니다.","why":{"0":"모간·조갑판은 피부사상균의 표적입니다.","1":"각질층만의 감염은 전풍에 가깝습니다.","2":"그물내피 조직·구강 병변은 히스토플라스마 파종의 별표 항목입니다.","4":"코중격·성대만으로 국한된다는 밑줄은 없습니다."},"one":"콕시디오이데스증의 파종은 피부, 뼈, 관절, 수막을 침범한다.","src":"Mycology 2026.pdf, slide 51","img":[{"u":"img/w11_mycology/p51.webp","cap":"Mycology 2026.pdf, slide 51"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-40":{"q":"Candida albicans was boxed as the most important Candida species. Which growth forms were listed, and what note was written beside them?","o":["Only a capsule-bearing yeast; “AKA bacterium.”","Only septate hyphae in soil; “AKA dermatophyte.”","Only spherules; “AKA Coccidioides.”","Only arthroconidia; “AKA mold in the cold.”","It is a polymorphic fungus (yeast, hyphae, and pseudohyphae); hyphae were annotated “AKA mold.”"],"a":4,"qk":"칸디다 알비칸스(C. albicans)는 가장 중요한 종으로 박스 쳐져 있습니다. 어떤 성장 형태가 나열되었고, 옆에 어떤 메모가 적혀 있습니까?","ok":["피막 효모만 있으며 ‘일명 세균’이다.","흙에서 격벽 균사만 있으며 ‘일명 피부사상균’이다.","구상체만 있으며 ‘일명 콕시디오이데스’이다.","분절포자만 있으며 ‘추우면 곰팡이’이다.","다형(polymorphic) 진균으로 효모, 균사, 위균사(pseudohyphae)를 만들고, 균사 옆에는 ‘일명 곰팡이(AKA mold)’라고 적혀 있다."],"exp":"**C. albicans**가 **가장 중요하다(most important)**고 박스 쳐져 있습니다. 이 균은 **다형(polymorphic)**으로 **효모, 균사, 위균사**를 모두 만들 수 있고, 균사 옆에는 **일명 곰팡이(AKA mold)**라고 적어 두었습니다. 조건에 따라 형태가 바뀌는 점이 병독성과 점막 침범에 중요합니다.","why":{"0":"피막 효모는 크립토코쿠스입니다. 칸디다는 피막 다당으로 정의되지 않습니다.","1":"피부사상균은 트리코피톤 등입니다. 칸디다의 박스 내용이 아닙니다.","2":"구상체는 콕시디오이데스입니다.","3":"분절포자·온도 이형성은 전신 이형성 진균의 틀입니다. 칸디다는 다형 효모/균사/위균사입니다."},"one":"칸디다 알비칸스는 가장 중요하며, 효모·균사·위균사를 만드는 다형 진균이다.","src":"Mycology 2026.pdf, slide 55","img":[{"u":"img/w11_mycology/p55.webp","cap":"Mycology 2026.pdf, slide 55"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-41":{"q":"Candida was underlined as a commensal. Which site was oval-marked among its normal habitats?","o":["The mouth and throat.","Desert soil of the Southwestern United States.","Bird and bat droppings only.","Keratin of hair shafts only.","The meninges of healthy hosts."],"a":0,"qk":"칸디다는 상재균(commensal)으로 밑줄 쳐져 있습니다. 정상 서식지 가운데 타원으로 표시된 부위는 어디입니까?","ok":["입과 목(mouth and throat).","미국 남서부 사막 흙.","새와 박쥐 배설물만.","모간의 케라틴만.","건강한 숙주의 수막."],"exp":"칸디다는 위장관과 질 점막의 **상재균(commensals)**이라고 밑줄 쳐져 있고, **입과 목(Mouth and throat)**이 타원으로 표시되어 있습니다. 건강한 사람의 입·인두에도 살다가, 숙주 방어가 흔들리면 아구창 같은 내인성 감염을 일으킵니다.","why":{"1":"남서부 사막 흙은 콕시디오이데스의 토착 서식지입니다.","2":"새·박쥐 배설물 흙은 히스토플라스마(그리고 크립토코쿠스의 새 배설물) 서식지입니다.","3":"모간 케라틴은 피부사상균의 표적입니다.","4":"수막은 정상 서식지가 아닙니다. 수막 침범은 크립토코쿠스 등 파종 감염의 소견입니다."},"one":"칸디다는 상재균이며, 입과 목이 타원으로 표시된 서식지이다.","src":"Mycology 2026.pdf, slide 56","img":[{"u":"img/w11_mycology/p56.webp","cap":"Mycology 2026.pdf, slide 56"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-42":{"q":"Oral thrush was boxed and starred. Which description and predisposing event were emphasized?","o":["Black necrotic plaques after trauma only.","White, cottage-cheese patches, often after broad-spectrum antibiotics.","Circular scalp plaques that fluoresce green.","A meningeal yeast seen with India ink.","Painful vesicles on an erythematous base."],"a":1,"qk":"구강 아구창(oral thrush)은 박스·별표로 강조되었습니다. 어떤 모습과 유발 상황이 함께 강조되었습니까?","ok":["외상 후에만 생기는 검은 괴사 반.","하얀 코티지치즈 같은 반(white, cottage-cheese patches)이며, 종종 광범위 항생제 사용 후에 생긴다.","초록 형광을 내는 원형 두피 반.","먹을 먹으로 보이는 수막 효모.","홍반 바탕 위의 통증성 수포."],"exp":"**구강 아구창(oral thrush)**이 박스와 별표로 강조되어 있고, **하얀 코티지치즈 같은 반(white, cottage-cheese patches)**이 특징입니다. 같은 흐름에서 **광범위 항생제(broad-spectrum antibiotics) 사용 후**에 잘 생긴다고 연결되어 있습니다. 정상 세균총이 깨지면 상재 칸디다가 과증식합니다.","why":{"0":"검은 괴사 반은 침습 곰팡이(예: 뮤코르) 등의 소견에 가깝고, 아구창의 별표 묘사가 아닙니다.","2":"형광 원형 두피 반은 일부 두부백선의 우드등 소견입니다.","3":"먹을 먹 수막 효모는 크립토코쿠스입니다.","4":"홍반 위 통증성 수포는 단순포진 등 바이러스 병변에 가깝습니다."},"one":"아구창은 하얀 코티지치즈 같은 반이며, 광범위 항생제 후에 잘 생긴다.","src":"Mycology 2026.pdf, slide 57","img":[{"u":"img/w11_mycology/p57.webp","cap":"Mycology 2026.pdf, slide 57"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-43":{"q":"On the cutaneous candidiasis slide, which common presentation was hand-underlined?","o":["Tinea capitis of the scalp.","Cryptococcal meningitis.","Diaper rash.","Valley fever.","Onychomycosis caused only by Microsporum."],"a":2,"qk":"피부 칸디다증 설명에서 손글씨로 밑줄 친 흔한 양상은 무엇입니까?","ok":["두피의 두부백선.","크립토코쿠스 수막염.","기저귀 발진(diaper rash).","밸리 피버(Valley fever).","마이크로스포룸만 일으키는 손발톱진균증."],"exp":"**기저귀 발진(diaper rash)**에 손글씨 밑줄이 쳐져 있습니다. 칸디다는 따뜻하고 습한 피부 주름에서 피부염을 잘 일으키고, 젖은 기저귀 아래가 대표적인 자리입니다. 동일 범주의 피부 칸디다증으로 간찰성 병변도 다룹니다.","why":{"0":"두부백선은 피부사상균(마이크로스포룸·트리코피톤)의 두피 감염입니다.","1":"크립토코쿠스 수막염은 전신 진균증입니다.","3":"밸리 피버는 콕시디오이데스증의 다른 이름에 가깝습니다.","4":"마이크로스포룸은 손발톱을 감염시키지 않습니다. 조갑 칸디다/조갑백선과 이 밑줄의 내용은 기저귀 발진입니다."},"one":"피부 칸디다증의 흔한 양상으로 기저귀 발진이 밑줄 쳐져 있다.","src":"Mycology 2026.pdf, slide 59","img":[{"u":"img/w11_mycology/p59.webp","cap":"Mycology 2026.pdf, slide 59"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-44":{"q":"Vulvovaginal candidiasis was wavy-underlined as increasing in which period?","o":["The first 48 hours of life only.","The male climacteric only.","The first trimester exclusively, never later.","The third trimester of pregnancy.","Only after menopause, never in pregnancy."],"a":3,"qk":"외음질 칸디다증(vulvovaginal candidiasis)이 늘어난다고 물결 밑줄이 쳐진 시기는 언제입니까?","ok":["생후 48시간만.","남성 갱년기만.","첫 삼분기에만 늘고 그 이후에는 절대 늘지 않는다.","임신 제3삼분기(3rd trimester of pregnancy).","폐경 후에만 늘고 임신 중에는 절대 늘지 않는다."],"exp":"**임신 제3삼분기(3rd trimester of pregnancy)**에 물결 밑줄이 쳐져 있습니다. 이 시기에 외음질 칸디다증이 증가합니다. 호르몬·당 환경 변화로 질 내 칸디다가 과증식하기 쉽습니다. 가려움과 치즈 같은 분비물이 전형적인 증상입니다.","why":{"0":"신생아 초기만의 이야기가 아닙니다. 밑줄은 임신 3삼분기입니다.","1":"이 밑줄은 임신 3삼분기의 외음질 칸디다증입니다.","2":"밑줄이 쳐진 것은 첫 삼분기가 아니라 제3삼분기입니다.","4":"임신 중에, 특히 3삼분기에 증가한다고 밑줄 쳐져 있습니다. 폐경 후에만 는다는 내용이 아닙니다."},"one":"외음질 칸디다증은 임신 제3삼분기에 증가한다.","src":"Mycology 2026.pdf, slide 60","img":[{"u":"img/w11_mycology/p60.webp","cap":"Mycology 2026.pdf, slide 60"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-45":{"q":"Systemic candidiasis was underlined as a serious disease. Which organs were listed as involvement sites?","o":["Hair shafts and nail plates only.","The stratum corneum only.","Desert lymph nodes only.","Cartilage and intervertebral discs only.","The kidneys, eyes, and heart."],"a":4,"qk":"전신 칸디다증(systemic candidiasis)은 중증이라고 밑줄 쳐져 있습니다. 침범 부위로 나열된 장기는 무엇입니까?","ok":["모간과 조갑판만.","각질층만.","사막 림프절만.","연골과 추간판만.","신장, 눈, 심장(kidneys, eyes, and heart)."],"exp":"**전신 칸디다증(Systemic candidiasis)**과 **중증(serious)**에 밑줄이 쳐져 있고, 침범 장기로 **신장, 눈, 심장(kidneys, eyes, heart)**이 나열되어 있습니다. 점막 상재균이 혈류로 들어가면 이 장기들을 침범하는 침습 감염이 되며, 면역저하나 도관 등 위험 요인이 있을 때 특히 중요합니다.","why":{"0":"모간·조갑판은 피부사상균의 표적입니다.","1":"각질층만의 감염은 전풍처럼 표재 감염입니다. 전신 칸디다증은 내장 침범입니다.","2":"사막 림프절은 이 목록이 아닙니다.","3":"연골·추간판은 이 목록이 아닙니다."},"one":"전신 칸디다증은 중증이며 신장, 눈, 심장을 침범한다.","src":"Mycology 2026.pdf, slide 61","img":[{"u":"img/w11_mycology/p61.webp","cap":"Mycology 2026.pdf, slide 61"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-46":{"q":"Which predisposing factor for candidiasis was boxed and starred?","o":["Broad-spectrum antibiotics.","Live-virus vaccination in childhood only.","Walking barefoot on river banks.","Exposure to Southwestern desert dust only.","House-dust exposure to Aspergillus fumigatus only."],"a":0,"qk":"칸디다증의 소인으로 박스와 별표가 쳐진 것은 무엇입니까?","ok":["광범위 항생제(broad-spectrum antibiotics).","어린 시절 약독화 생백신만.","강기슭을 맨발로 걷는 것.","남서부 사막 먼지에만 노출되는 것.","집먼지 속 아스페르길루스 푸미가투스에만 노출되는 것."],"exp":"소인 목록에서 **광범위 항생제(Broad-spectrum antibiotics)**가 박스와 별표로 가장 강조되어 있습니다. 정상 세균총이 깨지면 상재 칸디다가 과증식합니다. 아구창이 항생제 후에 잘 생긴다는 앞선 강조와 이어지는 내용입니다. 다른 소인(스테로이드, 면역저하, 당뇨, 도관 등)도 있지만, 박스·별표가 쳐진 항목이 광범위 항생제입니다.","why":{"1":"생백신은 이 박스의 소인이 아닙니다.","2":"맨발·강기슭은 일부 환경 진균의 노출 이야기에 가깝습니다.","3":"남서부 사막 먼지는 콕시디오이데스 노출입니다.","4":"아스페르길루스 푸미가투스와 집먼지는 다른 부분의 기회감염 곰팡이 이야기입니다. 이 칸디다 소인 박스가 아닙니다."},"one":"칸디다증의 소인으로 가장 강조된 것은 광범위 항생제이다.","src":"Mycology 2026.pdf, slide 62","img":[{"u":"img/w11_mycology/p62.webp","cap":"Mycology 2026.pdf, slide 62"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-47":{"q":"How was candidiasis treatment marked for mild-to-moderate versus severe disease?","o":["Mild-to-moderate disease needs intravenous amphotericin B; severe disease needs only talc powder.","Mild-to-moderate: nystatin, clotrimazole, or miconazole topically; severe: fluconazole orally.","Both severities are treated only with potassium iodide.","Mild disease is never treated; severe disease is treated with griseofulvin cream alone.","Severe disease is treated with topical nystatin only; oral fluconazole is reserved for athlete’s foot."],"a":1,"qk":"칸디다증 치료에서 경증–중등도와 중증을 어떻게 구분해 표시했습니까?","ok":["경증–중등도는 정맥 암포테리신 B, 중증은 활석 가루만 쓴다.","경증–중등도: 니스타틴, 클로트리마졸, 미코나졸을 국소로. 중증: 플루코나졸을 경구로.","심한 정도와 상관없이 요오드화칼륨만 쓴다.","경증은 치료하지 않고, 중증은 그리세오풀빈 크림만 쓴다.","중증은 국소 니스타틴만 쓰고, 경구 플루코나졸은 무좀에만 쓴다."],"exp":"경증–중등도는 **니스타틴, 클로트리마졸, 미코나졸을 국소(topically)**로, 중증은 **플루코나졸을 경구(orally)**로 쓴다고 표시되어 있습니다. 점막·피부 경증은 국소 약으로 충분한 경우가 많고, 심한 감염은 전신 아졸이 필요합니다.","why":{"0":"정맥 암포테리신 B는 일부 중증 전신 진균증의 약이지, 경증 칸디다의 1차 처치가 아닙니다.","2":"요오드화칼륨은 이 칸디다 치료 구분의 내용이 아닙니다.","3":"경증도 국소 항진균제로 치료합니다. 그리세오풀빈 크림만 쓰는 체계가 아닙니다.","4":"방향이 반대입니다. 국소 니스타틴 등은 경증–중등도, 경구 플루코나졸은 중증입니다."},"one":"경증–중등도는 국소 니스타틴·클로트리마졸·미코나졸, 중증은 경구 플루코나졸이다.","src":"Mycology 2026.pdf, slide 63","img":[{"u":"img/w11_mycology/p63.webp","cap":"Mycology 2026.pdf, slide 63"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-48":{"q":"Pneumocystis jirovecii lacks ergosterol. What therapeutic consequence was starred?","o":["It is uniquely susceptible to all azoles at low dose.","Allylamines are the drugs of choice.","It is resistant to amphotericin B and azoles.","Nystatin alone reliably cures pneumonia.","Griseofulvin is required because the organism is a dermatophyte."],"a":2,"qk":"뉴모시스티스 지로베시(Pneumocystis jirovecii)는 에르고스테롤이 없습니다. 별표로 강조된 치료상 결과는 무엇입니까?","ok":["모든 아졸에 저용량으로도 특별히 잘 듣는다.","알릴아민이 선택 약제이다.","암포테리신 B와 아졸에 내성이다.","니스타틴 단독으로 폐렴이 반드시 낫는다.","이 균이 피부사상균이라서 그리세오풀빈이 필요하다."],"exp":"**에르고스테롤이 없다(lacks ergosterol)**는 점에 밑줄·별표가 있고, 그래서 **암포테리신 B와 아졸에 내성(resistant to amphotericin B and azoles)**이라고 강조되어 있습니다. 이 약들의 표적이 에르고스테롤(또는 그 합성)이기 때문입니다. 치료는 다른 계열(트라이메토프림–설파메톡사졸 등)을 씁니다.","why":{"0":"에르고스테롤이 없어서 아졸이 잘 듣는 것이 아니라, 아졸에 내성입니다.","1":"알릴아민도 에르고스테롤 합성을 막으므로, 에르고스테롤이 없는 이 균의 선택 약이 아닙니다.","3":"니스타틴은 막 에르고스테롤에 작용하는 폴리엔 계열에 가깝고, 이 폐렴의 확실한 단독 치료가 아닙니다.","4":"뉴모시스티스는 피부사상균이 아니며, 주로 AIDS 환자의 폐렴을 일으킵니다."},"one":"뉴모시스티스는 에르고스테롤이 없어 암포테리신 B와 아졸에 내성이다.","src":"Mycology 2026.pdf, slide 64","img":[{"u":"img/w11_mycology/p64.webp","cap":"Mycology 2026.pdf, slide 64"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-49":{"q":"Which diagnostic and host points were starred or underlined for Pneumocystis jirovecii?","o":["India-ink capsule in CSF of healthy children.","Tuberculate macroconidia in soil; mainly athletes.","Pilot-wheel yeast in oral mucosa; mainly neonates.","It is diagnosed with silver stains (cysts), occurs mainly in AIDS, and causes pneumonia.","Wood’s lamp fluorescence of hair; mainly tinea capitis."],"a":3,"qk":"뉴모시스티스 지로베시에서 별표나 밑줄로 강조된 진단·숙주 포인트는 무엇입니까?","ok":["건강한 어린이 뇌척수액의 먹을 먹 피막.","흙의 결절형 대형분생포자. 주로 운동선수.","구강 점막의 파일럿 휠 효모. 주로 신생아.","은염색으로 낭종(cysts)을 보고 진단하며, 주로 AIDS에서 생기고, 폐렴을 일으킨다.","털의 우드등 형광. 주로 두부백선."],"exp":"**은염색(silver stains)**으로 **낭종(cysts)**을 보는 진단, **주로 AIDS**, 그리고 **폐렴(pneumonia)**을 일으킨다는 점이 별표·밑줄로 강조되어 있습니다. 전형적인 임상상은 면역이 크게 떨어진 AIDS 환자의 폐렴이며, 조직이나 유도객담 등에서 은염색으로 낭종을 확인합니다.","why":{"0":"먹을 먹 피막은 크립토코쿠스입니다.","1":"결절형 대형분생포자는 히스토플라스마입니다.","2":"파일럿 휠은 파라콕시디오이데스입니다.","4":"우드등 형광·두부백선은 피부사상균의 이야기입니다."},"one":"뉴모시스티스는 주로 AIDS에서 폐렴을 일으키며, 은염색으로 낭종을 본다.","src":"Mycology 2026.pdf, slide 64","img":[{"u":"img/w11_mycology/p64.webp","cap":"Mycology 2026.pdf, slide 64"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-50":{"q":"Which Aspergillus species were boxed, and what did the arrowed products do?","o":["A. fumigatus and A. niger; they produce only penicillin.","A. nidulans only; it produces ergosterol for Pneumocystis.","A. terreus only; it causes tinea versicolor.","A. clavatus only; it is the sole cause of diaper rash.","A. flavus and A. parasiticus; they produce aflatoxins that are carcinogenic and contaminate crops."],"a":4,"qk":"박스 쳐진 아스페르길루스 종과, 화살표로 연결된 산물의 작용은 무엇입니까?","ok":["A. fumigatus와 A. niger이며, 페니실린만 만든다.","A. nidulans만이며, 뉴모시스티스용 에르고스테롤을 만든다.","A. terreus만이며, 전풍을 일으킨다.","A. clavatus만이며, 기저귀 발진의 유일한 원인이다.","A. flavus와 A. parasiticus이며, 발암성 아플라톡신(aflatoxins)을 만들고 농작물을 오염시킨다."],"exp":"**A. flavus**와 **A. parasiticus**가 박스로 묶여 있고, 이들이 만드는 **아플라톡신(aflatoxins)**에 화살표가 그려져 있습니다. 아플라톡신은 **발암성(carcinogenic)**이며 **농작물을 오염(contaminate crops)**시킵니다. 감염성 폐 아스페르길루스증의 대표 종인 A. fumigatus와 달리, 이 두 종은 독소 생산이 강조된 포인트입니다.","why":{"0":"페니실린은 페니실리움 속의 이야기에 가깝습니다. 박스 친 종은 A. flavus와 A. parasiticus이고, 산물은 아플라톡신입니다.","1":"뉴모시스티스는 오히려 에르고스테롤이 없습니다. A. nidulans가 이 박스의 종이 아닙니다.","2":"전풍의 원인균은 말라세지아입니다.","3":"기저귀 발진의 흔한 원인은 칸디다입니다. A. clavatus가 이 박스의 종이 아닙니다."},"one":"A. flavus와 A. parasiticus는 발암성 아플라톡신을 만들며 농작물을 오염시킨다.","src":"Mycology 2026.pdf, slide 66","img":[{"u":"img/w11_mycology/p66.webp","cap":"Mycology 2026.pdf, slide 66"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w12_blood-1":{"q":"Blood is classified as which type of tissue, and what is its liquid extracellular matrix called?","o":["Connective tissue; serum","Epithelial tissue; plasma","Epithelial tissue; lymph","Muscle tissue; interstitial fluid","Connective tissue; plasma"],"a":4,"qk":"혈액(blood)은 어떤 조직으로 분류되며, 그 액체 세포바깥바탕질(extracellular matrix)은 무엇이라 부르는가?","ok":["결합조직(connective tissue); 혈청(serum)","상피조직(epithelial tissue); 혈장(plasma)","상피조직(epithelial tissue); 림프(lymph)","근육조직(muscle tissue); 사이질액(interstitial fluid)","결합조직(connective tissue); 혈장(plasma)"],"exp":"혈액(blood)은 **결합조직(connective tissue)**의 한 종류이고, 그 세포바깥바탕질(extracellular matrix)이 액체라는 점이 특징입니다. 이 액체 바탕질을 **혈장(plasma)**이라고 부릅니다.\n\n혈액은 심장(heart)이 만드는 압력으로 온몸을 순환하며, 성인은 약 5 L의 혈액을 가지고 있습니다. 이 안에 유형성분(formed elements: 적혈구(erythrocytes), 백혈구(leukocytes), 혈소판(platelets))과 혈장(plasma)이 들어 있습니다.","why":{"0":"결합조직은 맞지만, 혈청(serum)은 혈액이 응고된 뒤 남는 액체입니다. 순환하는 혈액의 바탕질은 혈장(plasma)입니다.","1":"혈장(plasma)은 맞지만 혈액은 상피조직(epithelial tissue)이 아니라 결합조직(connective tissue)입니다.","2":"혈액은 상피조직(epithelial tissue)이 아니고, 림프(lymph)는 혈액의 바탕질이 아닙니다.","3":"혈액은 근육조직(muscle tissue)이 아니며, 사이질액(interstitial fluid)은 조직 사이의 액체입니다."},"one":"혈액(blood)은 액체 바탕질인 혈장(plasma)을 가진 결합조직(connective tissue)이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w12_blood/p02.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-2":{"q":"After blood clots, the remaining fluid is called serum. Why does serum differ in composition from plasma?","o":["Plasma lacks water, while serum is mostly water.","Serum contains more red blood cells than plasma.","Platelets release various proteins during blood clotting.","Serum is collected only with an anticoagulant.","Serum is produced only in the bone marrow."],"a":2,"qk":"혈액이 응고된 뒤 남는 액체를 혈청(serum)이라고 한다. 혈청의 조성이 혈장(plasma)과 다른 이유는 무엇인가?","ok":["혈장에는 물이 없고 혈청은 대부분 물이기 때문이다.","혈청에 적혈구가 혈장보다 더 많기 때문이다.","혈액 응고 중에 혈소판(platelets)이 여러 단백질을 방출하기 때문이다.","혈청은 항응고제(anticoagulant)를 써야만 얻기 때문이다.","혈청은 골수(bone marrow)에서만 만들어지기 때문이다."],"exp":"혈액이 혈관(vasculature) 밖으로 나오면 혈장 단백질(plasma proteins)이 연쇄 반응을 일으켜 **혈병(blood clot)**을 만듭니다. 응고 후 남는 액체가 **혈청(serum)**입니다.\n\n응고 과정에서 **혈소판(platelets)이 여러 단백질을 방출**하기 때문에, 혈청의 조성은 혈장(plasma)과 다릅니다. 그래서 혈청에는 TGF-β, VEGF, IL-8 같은 물질이 더 많고, 반대로 응고에 쓰인 섬유소원(fibrinogen)은 빠져 있습니다.","why":{"0":"혈장은 대부분 물(무게로 약 92%)이며, 둘 다 물이 주성분입니다.","1":"혈청과 혈장은 모두 세포를 걷어낸 액체 부분이라 적혈구 양으로 구분하지 않습니다.","3":"항응고제(anticoagulant)를 써서 응고를 막고 원심분리해 얻는 것은 혈장(plasma)입니다. 혈청은 응고된 혈액에서 얻습니다.","4":"혈청은 골수(bone marrow)에서 만들어지는 것이 아니라 응고된 혈액에서 분리되는 액체입니다."},"one":"혈청(serum)은 응고 후 남는 액체이고, 혈소판이 단백질을 방출하므로 혈장과 조성이 다르다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w12_blood/p02.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 2"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-3":{"q":"When anticoagulated blood is centrifuged, what is the hematocrit?","o":["The percentage of leukocytes among all formed elements","The percentage of total blood volume made up of red blood cells, about 45%","The percentage of total blood volume made up of plasma, about 55%","The thin whitish layer of leukocytes and platelets, about 1%","The concentration of hemoglobin in each red blood cell"],"a":1,"qk":"항응고 처리한 혈액을 원심분리했을 때, 적혈구용적률(hematocrit)이란 무엇인가?","ok":["전체 유형성분 중 백혈구의 비율","전체 혈액 부피 중 적혈구(RBC)가 차지하는 비율로, 약 45%","전체 혈액 부피 중 혈장(plasma)이 차지하는 비율로, 약 55%","백혈구와 혈소판으로 된 얇은 흰색 층으로, 약 1%","적혈구 한 개당 헤모글로빈 농도"],"exp":"항응고제(anticoagulant)로 처리한 혈액을 원심분리(centrifuge)하면 밀도에 따라 층이 나뉩니다.\n\n- 맨 아래: **적혈구(erythrocytes)**, 전체 부피의 약 **45%**\n- 가운데: 얇고 흰 **연층(buffy coat)**, 백혈구(leukocytes)와 혈소판(platelets), 약 1%\n- 맨 위: 노르스름하고 맑은 **혈장(plasma)**, 약 55%\n\n이 중 **전체 혈액 부피에서 적혈구가 차지하는 비율**을 **적혈구용적률(hematocrit)**이라고 합니다.","why":{"0":"백혈구 비율이 아니라 적혈구가 전체 혈액 부피에서 차지하는 비율입니다.","2":"약 55%를 차지하는 것은 혈장(plasma)이며, 이것은 적혈구용적률의 정의가 아닙니다.","3":"백혈구와 혈소판의 얇은 흰 층은 연층(buffy coat)입니다.","4":"적혈구용적률은 헤모글로빈 농도가 아니라 적혈구가 차지하는 부피 비율입니다."},"one":"적혈구용적률(hematocrit)은 전체 혈액 부피 중 적혈구가 차지하는 비율로 약 45%이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w12_blood/p03.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-4":{"q":"In centrifuged anticoagulated blood, the thin whitish buffy coat contains which components, and what fraction of blood volume does it make up?","o":["Leukocytes and platelets; about 1%","Reticulocytes only; about 5%","Erythrocytes; about 45%","Plasma proteins; about 55%","Fibrin and serum; about 10%"],"a":0,"qk":"원심분리한 항응고 혈액에서 얇고 흰 연층(buffy coat)에는 무엇이 들어 있으며, 혈액 부피의 얼마를 차지하는가?","ok":["백혈구(leukocytes)와 혈소판(platelets); 약 1%","그물적혈구(reticulocytes)만; 약 5%","적혈구(erythrocytes); 약 45%","혈장 단백질(plasma proteins); 약 55%","섬유소(fibrin)와 혈청(serum); 약 10%"],"exp":"원심분리한 혈액의 가운데 층인 **연층(buffy coat)**은 얇고 하얀 층으로, **백혈구(leukocytes)와 혈소판(platelets)**으로 이루어지며 전체 혈액 부피의 **약 1%**를 차지합니다.\n\n아래층 적혈구(erythrocytes)는 약 45%, 위층 혈장(plasma)은 약 55%입니다. 백혈구는 4,500–11,000/mm³, 혈소판은 150,000–400,000/mm³ 정도 들어 있습니다.","why":{"1":"연층은 그물적혈구(reticulocytes)가 아니라 백혈구와 혈소판으로 이루어집니다.","2":"적혈구(erythrocytes)는 맨 아래층이며 약 45%를 차지합니다.","3":"약 55%를 차지하는 것은 맨 위층 혈장(plasma)이고, 혈장 단백질은 그 안에 녹아 있습니다.","4":"항응고 처리한 혈액이므로 섬유소(fibrin)나 혈청(serum)이 층을 이루지 않습니다."},"one":"연층(buffy coat)은 백혈구와 혈소판으로 된 얇은 흰 층이며 혈액 부피의 약 1%이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w12_blood/p03.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 3"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-5":{"q":"In the composition of plasma, which protein makes up the largest share of the plasma proteins (about 58%)?","o":["Hemoglobin","Globulins","Fibrinogen","Albumin","Regulatory proteins"],"a":3,"qk":"혈장(plasma)의 조성에서, 혈장 단백질 중 가장 큰 비중(약 58%)을 차지하는 단백질은 무엇인가?","ok":["헤모글로빈(hemoglobin)","글로불린(globulins)","섬유소원(fibrinogen)","알부민(albumin)","조절 단백질(regulatory proteins)"],"exp":"혈장(plasma)은 무게로 **물 92%**, **단백질 7%**, 기타 용질 1%로 이루어집니다.\n\n혈장 단백질(plasma proteins) 중에서는 **알부민(albumin) 58%**, 글로불린(globulins) 37%, 섬유소원(fibrinogen) 4%, 조절 단백질(regulatory proteins) 1% 순입니다. 기타 용질에는 전해질(electrolytes), 영양소(nutrients), 호흡 가스(respiratory gases), 노폐물(waste products)이 있습니다.","why":{"0":"헤모글로빈(hemoglobin)은 적혈구 안의 단백질이지 혈장 단백질이 아닙니다.","1":"글로불린(globulins)은 약 37%로 두 번째입니다.","2":"섬유소원(fibrinogen)은 약 4%에 불과합니다.","4":"조절 단백질(regulatory proteins)은 약 1%입니다."},"one":"혈장 단백질의 약 58%는 알부민(albumin)이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w12_blood/p04.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 4"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-6":{"q":"How is CO2 transported in the blood?","o":["Only bound to albumin","Only inside leukocytes","Only dissolved as CO2 gas in the plasma","As CO2 gas, as the bicarbonate ion HCO3-, or bound to hemoglobin","Only as carboxyhemoglobin"],"a":3,"qk":"혈액에서 이산화탄소(CO2)는 어떤 형태로 운반되는가?","ok":["알부민(albumin)에 결합한 형태로만","백혈구(leukocytes) 안에서만","혈장에 녹은 CO2 가스 형태로만","CO2 가스, 중탄산이온(HCO3-), 또는 헤모글로빈(hemoglobin)에 결합한 형태로","일산화탄소헤모글로빈(carboxyhemoglobin) 형태로만"],"exp":"혈액의 중요한 기능 중 하나가 가스 운반입니다. 산소(O2)는 적혈구(RBC) 안의 헤모글로빈(hemoglobin)에 실려 갑니다.\n\n이산화탄소(CO2)는 세 가지 형태로 운반됩니다. **CO2 가스 그대로**, **중탄산이온(HCO3-)**, 또는 **헤모글로빈에 결합**한 형태입니다. 조직에서 생긴 CO2는 적혈구 안으로 들어가 **탄산탈수효소(carbonic anhydrase)**에 의해 H2CO3를 거쳐 HCO3-와 H+로 바뀌고, 허파꽈리(alveolus)에서는 반대 반응으로 다시 CO2가 되어 빠져나갑니다.","why":{"0":"알부민(albumin)은 삼투압을 유지하는 단백질로, CO2 운반 형태로 제시되지 않습니다.","1":"백혈구는 감염 방어를 담당하며, CO2 운반은 혈장과 적혈구가 맡습니다.","2":"녹은 CO2 가스는 한 가지 형태일 뿐이고, 중탄산이온과 헤모글로빈 결합 형태도 있습니다.","4":"일산화탄소헤모글로빈(carboxyhemoglobin)은 헤모글로빈에 CO(일산화탄소)가 결합한 것으로, CO2 운반과 다릅니다."},"one":"CO2는 가스 그대로, HCO3-로, 또는 헤모글로빈에 결합해 운반된다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5, 6","img":[{"u":"img/w12_blood/p05.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5"},{"u":"img/w12_blood/p06.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 6"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-7":{"q":"How do leukocytes defend the body against infection?","o":["They remain in the bloodstream and release antibodies only into plasma.","They are active only while circulating and become inactive in tissues.","They form clots that seal off infected tissue.","They transport O2 to infected tissues using hemoglobin.","They are carried by the blood to infection sites, leave the bloodstream, and invade the infected tissues."],"a":4,"qk":"백혈구(leukocytes)는 감염에 대해 몸을 어떻게 방어하는가?","ok":["혈류 속에 머물며 혈장으로만 항체를 방출한다.","순환 중에만 활성이 있고 조직에서는 비활성이 된다.","응고물을 만들어 감염 조직을 봉쇄한다.","헤모글로빈을 이용해 감염 조직에 O2를 운반한다.","혈액을 타고 감염 부위로 가서 혈류를 떠나 감염된 조직으로 침입한다."],"exp":"**백혈구(leukocytes)**는 몸이 감염과 싸우는 주된 수단 중 하나입니다. 혈액을 타고 **감염 부위로 운반된 뒤 혈류를 떠나 감염된 조직으로 침입**하여 몸을 지킵니다.\n\n그래서 백혈구는 일반적으로 **혈류를 떠난 뒤에 활성화**되어 면역(immunity)에 관여합니다. 혈액은 백혈구를 필요한 곳까지 실어 나르는 통로인 셈입니다.","why":{"0":"백혈구는 혈류에 머물지 않고 조직으로 나가서 작용합니다.","1":"반대입니다. 백혈구는 대개 혈류를 떠난 뒤에 활성화됩니다.","2":"응고에 관여하는 것은 혈소판(platelets)과 혈장 응고 단백질입니다.","3":"O2 운반은 적혈구(RBC)의 헤모글로빈이 담당합니다."},"one":"백혈구는 혈액을 타고 감염 부위로 가서 혈관 밖 조직으로 나가 작용한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5","img":[{"u":"img/w12_blood/p05.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 5"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-8":{"q":"Which plasma protein is made in the liver and maintains the osmotic pressure of the blood?","o":["Fibronectin","Albumin","γ-globulins","Complement proteins","Transferrin"],"a":1,"qk":"간(liver)에서 만들어지며 혈액의 삼투압(osmotic pressure)을 유지하는 혈장 단백질은 무엇인가?","ok":["피브로넥틴(fibronectin)","알부민(albumin)","감마글로불린(γ-globulins)","보체 단백질(complement proteins)","트랜스페린(transferrin)"],"exp":"혈장(plasma)은 pH 7.4의 수용액으로, 혈장 단백질, 영양소, 호흡 가스, 질소성 노폐물(nitrogenous wastes), 호르몬, 전해질을 담고 있습니다.\n\n주요 혈장 단백질 중 **알부민(albumin)**은 **간(liver)에서 만들어지고 혈액의 삼투압(osmotic pressure)을 유지**합니다. 알부민이 혈관 안에 물을 붙잡아 두는 역할을 하기 때문에, 알부민이 부족하면 물이 조직으로 빠져나가 부종(edema)이 생기기 쉽습니다.","why":{"0":"피브로넥틴(fibronectin)은 α·β-글로불린에 속하는 예로, 삼투압 유지 단백질로 제시되지 않습니다.","2":"감마글로불린(γ-globulins)은 형질세포(plasma cells)가 분비하는 면역글로불린(immunoglobulins)입니다.","3":"보체 단백질(complement proteins)은 염증과 병원체 파괴에 관여합니다.","4":"트랜스페린(transferrin)은 α·β-글로불린에 속하는 운반 인자(transport factor)입니다."},"one":"알부민(albumin)은 간에서 만들어지며 혈액의 삼투압을 유지한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-9":{"q":"Which plasma protein fraction consists of immunoglobulins secreted by plasma cells?","o":["γ-globulins","Albumin","β-globulins","α-globulins","Fibrinogen"],"a":0,"qk":"형질세포(plasma cells)가 분비하는 면역글로불린(immunoglobulins)으로 이루어진 혈장 단백질 분획은 무엇인가?","ok":["감마글로불린(γ-globulins)","알부민(albumin)","베타글로불린(β-globulins)","알파글로불린(α-globulins)","섬유소원(fibrinogen)"],"exp":"혈장 단백질 중 **감마글로불린(γ-globulins)**은 **형질세포(plasma cells)가 분비하는 면역글로불린(immunoglobulins)**, 즉 항체(antibodies)입니다.\n\n반면 **알파·베타글로불린(α- and β-globulins)**은 간(liver) 등에서 만들어지며, 트랜스페린(transferrin) 같은 운반 인자, 피브로넥틴(fibronectin), 프로트롬빈(prothrombin) 등 응고 인자(coagulation factors), 지질단백질(lipoproteins)이 여기에 속합니다.","why":{"1":"알부민(albumin)은 간에서 만들어지고 삼투압을 유지합니다.","2":"베타글로불린(β-globulins)도 간 등에서 만들어지며 트랜스페린, 지질단백질 등이 해당합니다.","3":"알파글로불린(α-globulins)은 간 등에서 만들어지는 운반 인자·응고 인자 등입니다.","4":"섬유소원(fibrinogen)은 간에서 만들어지고 응고 때 섬유소(fibrin)로 중합합니다."},"one":"감마글로불린(γ-globulins)은 형질세포가 분비하는 면역글로불린이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-10":{"q":"Fibrinogen is made in the liver. What does it do during clotting?","o":["It carries iron as a transport factor.","It maintains the osmotic pressure of blood.","It polymerizes to form the insoluble protein fibrin.","It destroys pathogens as part of complement.","It is secreted by plasma cells as an antibody."],"a":2,"qk":"섬유소원(fibrinogen)은 간에서 만들어진다. 응고 과정에서 섬유소원은 무엇을 하는가?","ok":["운반 인자로서 철을 운반한다.","혈액의 삼투압을 유지한다.","중합하여 불용성 단백질인 섬유소(fibrin)를 만든다.","보체의 일부로서 병원체를 파괴한다.","형질세포가 항체로 분비한다."],"exp":"**섬유소원(fibrinogen)**은 **간(liver)에서 만들어지는** 혈장 단백질로, 응고 과정에서 **중합(polymerize)하여 불용성 단백질인 섬유소(fibrin)**를 만듭니다. 이 섬유소 그물이 혈병(blood clot)의 뼈대가 됩니다.\n\n응고가 끝난 뒤 남는 혈청(serum)에는 섬유소원이 거의 남지 않는 이유가 바로 이것입니다.","why":{"0":"운반 인자는 트랜스페린(transferrin) 같은 α·β-글로불린입니다.","1":"삼투압 유지는 알부민(albumin)의 역할입니다.","3":"병원체 파괴와 염증은 보체 단백질(complement proteins)의 역할입니다.","4":"형질세포가 분비하는 항체는 감마글로불린(γ-globulins)입니다."},"one":"섬유소원(fibrinogen)은 간에서 만들어지고 응고 때 섬유소(fibrin)로 중합한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7","img":[{"u":"img/w12_blood/p07.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 7"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-11":{"q":"Comparing serum and plasma, which statement is correct?","o":["Serum is obtained by centrifuging blood with an anticoagulant.","Serum contains fibrinogen, whereas plasma does not.","Plasma is mainly used for blood typing and culture-medium supplementation.","Serum is used for blood transfusions instead of plasma.","Plasma contains fibrinogen, whereas serum is obtained after the blood has clotted."],"a":4,"qk":"혈청(serum)과 혈장(plasma)을 비교할 때 옳은 것은?","ok":["혈청은 항응고제와 함께 혈액을 원심분리해 얻는다.","혈청에는 섬유소원이 있고 혈장에는 없다.","혈장은 주로 혈액형 검사와 배양액 보충에 쓰인다.","혈장 대신 혈청을 수혈에 쓴다.","혈장에는 섬유소원(fibrinogen)이 있고, 혈청은 혈액이 응고된 뒤에 얻는다."],"exp":"혈청(serum)과 혈장(plasma)의 비교입니다.\n\n- **혈청(serum)**: 혈액이 **응고된 뒤** 남는 액체. 응고된 혈액을 원심분리해 얻습니다. 밀도 1.024 g/ml, TGF-β·VEGF·IL-8이 더 많습니다. 쓰임: 혈액형 검사(blood typing), 진단 검사, 배양액 보충, 항체 검사.\n- **혈장(plasma)**: **응고를 막은** 상태의 액체. 항응고제(anticoagulant)를 넣은 전혈(whole blood)을 원심분리해 얻습니다. 밀도 1.025 g/ml이며 **섬유소원(fibrinogen)**을 포함합니다. 쓰임: 수혈(blood transfusions), 진단 검사.","why":{"0":"항응고제와 함께 원심분리해 얻는 것은 혈장(plasma)입니다.","1":"반대입니다. 섬유소원은 응고에 쓰이므로 혈장에 있고 혈청에는 없습니다.","2":"혈액형 검사와 배양액 보충은 혈청(serum)의 용도입니다.","3":"수혈에 쓰이는 것은 혈장(plasma)입니다."},"one":"혈장은 항응고 혈액에서 얻어 섬유소원을 포함하고, 혈청은 응고된 혈액에서 얻는다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w12_blood/p09.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 9"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-12":{"q":"Peripheral blood is best studied using a blood smear. Which stains are added after the smear dries?","o":["Giemsa or Wright","Periodic acid–Schiff","Gram stain","Hematoxylin and eosin","Silver stain"],"a":0,"qk":"말초혈액(peripheral blood)은 혈액 도말(blood smear)로 관찰하는 것이 가장 좋다. 도말이 마른 뒤 어떤 염색약을 사용하는가?","ok":["김자(Giemsa) 또는 라이트(Wright) 염색","PAS 염색(periodic acid–Schiff)","그람 염색(Gram stain)","헤마톡실린-에오신(hematoxylin and eosin)","은 염색(silver stain)"],"exp":"**말초혈액(peripheral blood)**, 즉 정맥에서 채취한 혈액은 **혈액 도말(blood smear)**로 관찰하는 것이 가장 좋습니다.\n\n순서는 다음과 같습니다. 혈액 한 방울을 현미경용 유리판(glass slide) 가운데에 떨어뜨리고, 다른 유리판으로 얇게 펴 바릅니다. 말린 뒤 **김자(Giemsa) 또는 라이트(Wright) 염색**을 하고, 덮개유리를 덮어 고배율로 관찰합니다.","why":{"1":"PAS 염색은 혈액 도말의 표준 염색으로 제시되지 않습니다.","2":"그람 염색은 세균 염색법으로 혈구 관찰용이 아닙니다.","3":"헤마톡실린-에오신은 일반 조직 절편에 흔히 쓰지만, 혈액 도말에 쓰는 염색으로 제시된 것은 김자·라이트입니다.","4":"은 염색은 혈액 도말 염색으로 제시되지 않습니다."},"one":"혈액 도말은 말린 뒤 김자(Giemsa) 또는 라이트(Wright) 염색을 한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w12_blood/p10.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 10"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-13":{"q":"Which feature describes mature erythrocytes?","o":["Cells about 2–4 µm in diameter derived from megakaryocytes","Flexible biconcave discs about 7.5 µm in diameter that lack nuclei and organelles","Cells with a lifespan of about 10 days","Spherical cells with a large indented nucleus","Nucleated cells with abundant mitochondria"],"a":1,"qk":"성숙한 적혈구(erythrocytes)를 설명하는 것은?","ok":["거대핵세포에서 유래한 지름 약 2–4 µm의 세포","지름 약 7.5 µm의 유연한 양면오목원반(biconcave disc)으로, 핵과 세포소기관이 없다","수명이 약 10일인 세포","크고 움푹한 핵을 가진 구형 세포","미토콘드리아가 풍부한 유핵 세포"],"exp":"**적혈구(erythrocytes, RBCs)**는 **최종분화(terminally differentiated)**된 세포로, **핵과 세포소기관이 없고** 헤모글로빈(hemoglobin)으로 가득 차 있습니다.\n\n모양은 **유연한 양면오목원반(biconcave disc)**이며, 지름 **7.5 µm**, 가장자리 두께 2.6 µm, 가운데 두께 0.75 µm입니다. 이 모양 덕분에 **부피 대비 표면적(surface-to-volume ratio)이 커서 가스 교환**에 유리합니다. 평균 수명은 **120일**입니다.","why":{"0":"지름 2–4 µm의 거대핵세포 조각은 혈소판(platelets)입니다.","2":"수명 약 10일은 혈소판이며, 적혈구는 약 120일입니다.","3":"크고 움푹한(C자형) 핵을 가진 것은 단핵구(monocytes)입니다.","4":"성숙 적혈구는 핵과 세포소기관이 없습니다."},"one":"적혈구는 핵·세포소기관이 없는 지름 7.5 µm의 양면오목원반이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-14":{"q":"Which form of hemoglobin binding is irreversible and decreases the blood's capacity to carry O2?","o":["Bicarbonate-bound hemoglobin","Deoxyhemoglobin","Carbaminohemoglobin","Carboxyhemoglobin","Oxyhemoglobin"],"a":3,"qk":"비가역적(irreversible)이며 혈액의 O2 운반 능력을 떨어뜨리는 헤모글로빈 결합 형태는 무엇인가?","ok":["중탄산 결합 헤모글로빈","탈산소헤모글로빈(deoxyhemoglobin)","카바미노헤모글로빈(carbaminohemoglobin)","일산화탄소헤모글로빈(carboxyhemoglobin)","산소헤모글로빈(oxyhemoglobin)"],"exp":"헤모글로빈(hemoglobin)의 결합 형태를 구분하세요.\n\n- **산소헤모글로빈(oxyhemoglobin)**: O2 결합\n- **카바미노헤모글로빈(carbaminohemoglobin)**: CO2 결합\n\n이 두 가지는 혈액과 주변 조직의 O2·CO2 농도에 따라 **가역적(reversible)**으로 붙었다 떨어집니다.\n\n- **일산화탄소헤모글로빈(carboxyhemoglobin)**: **CO(일산화탄소)** 결합. 이 결합은 **비가역적(irreversible)**이어서 혈액의 **O2 운반 능력을 떨어뜨립니다**.","why":{"0":"중탄산(HCO3-)은 주로 혈장에서 운반되며, 비가역적 결합 형태로 제시되지 않습니다.","1":"탈산소헤모글로빈은 O2가 떨어진 상태로, 비가역적 결합이 아닙니다.","2":"카바미노헤모글로빈은 CO2가 가역적으로 결합한 형태입니다.","4":"산소헤모글로빈은 O2가 가역적으로 결합한 형태입니다."},"one":"일산화탄소헤모글로빈(carboxyhemoglobin)은 CO가 비가역적으로 결합해 O2 운반 능력을 떨어뜨린다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-15":{"q":"What is the average lifespan of red blood cells?","o":["A few days","About 10 days","About 120 days","Many years","1–2 weeks"],"a":2,"qk":"적혈구(RBC)의 평균 수명은?","ok":["며칠","약 10일","약 120일","수년","1–2주"],"exp":"**적혈구(RBCs)의 평균 수명은 120일**입니다. 핵이 없어 스스로 단백질을 새로 만들거나 수리할 수 없기 때문에 일정 기간이 지나면 교체되어야 합니다.\n\n비교해 두면 좋습니다. **혈소판(platelets)은 약 10일**, **호중구(neutrophils)는 1–4일**, 호산구(eosinophils)는 1–2주, 림프구(lymphocytes)는 수 시간에서 수년입니다.","why":{"0":"며칠은 과립백혈구(granulocytes), 예를 들어 호중구(neutrophils)의 수명입니다.","1":"약 10일은 혈소판(platelets)의 수명입니다.","3":"수년까지 사는 것은 일부 림프구(lymphocytes)입니다.","4":"1–2주는 호산구(eosinophils)의 수명입니다."},"one":"적혈구의 평균 수명은 120일이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11, 21","img":[{"u":"img/w12_blood/p11.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 11"},{"u":"img/w12_blood/p21.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 21"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-16":{"q":"Which statement correctly describes granulocytes?","o":["They have polymorphic nuclei, are terminally differentiated, live a few days, and die by apoptosis.","They have well-developed Golgi and rER with many mitochondria.","Their azurophilic granules are secretory vesicles containing hemoglobin.","They lack specific granules and have spherical nuclei.","They are the precursors of macrophages."],"a":0,"qk":"과립백혈구(granulocytes)를 옳게 설명한 것은?","ok":["다형핵을 가지고 최종분화되었으며, 수명이 며칠이고 세포자멸사(apoptosis)로 죽는다.","골지체와 과립세포질그물이 잘 발달했고 미토콘드리아가 많다.","아주르친화과립은 헤모글로빈을 담은 분비소포이다.","특수과립이 없고 핵이 구형이다.","대식세포(macrophages)의 전구세포이다."],"exp":"백혈구(leukocytes)는 세포질에 **특수과립(specific granules)**이 있는지에 따라 **과립백혈구(granulocytes)**와 **무과립백혈구(agranulocytes)**로 나뉩니다.\n\n과립백혈구의 특징:\n- **아주르친화과립(azurophilic granules)**: 아주르(azure) 색소로 염색되는 **리소좀(lysosomes)**\n- **특수과립(specific granules)**: 중성·염기성·산성 염색약 중 하나로 염색\n- **다형핵(polymorphic nuclei)**: 두 개 이상의 엽(lobe)이 가는 띠로 연결됨\n- **최종분화**, 수명 **며칠**, **세포자멸사(apoptosis)**로 죽음\n- 골지체(Golgi)와 과립세포질그물(rER)이 빈약하고 미토콘드리아가 적음","why":{"1":"과립백혈구는 골지체와 rER이 빈약하고 미토콘드리아가 적습니다.","2":"아주르친화과립은 리소좀(lysosomes)이며 헤모글로빈과 관계없습니다.","3":"특수과립이 없는 것은 무과립백혈구(agranulocytes)이고, 구형 핵은 림프구(lymphocytes)의 특징입니다.","4":"대식세포의 전구세포는 무과립백혈구인 단핵구(monocytes)입니다."},"one":"과립백혈구는 다형핵·최종분화·수명 며칠·세포자멸사가 특징이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 12, 13","img":[{"u":"img/w12_blood/p12.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 12"},{"u":"img/w12_blood/p13.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 13"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-17":{"q":"Which leukocyte is the most abundant in blood (54–62%) and is typically the first immune cell to arrive at a site of infection?","o":["Eosinophil","Basophil","Neutrophil","Monocyte","Lymphocyte"],"a":2,"qk":"혈액에서 가장 많은 백혈구(54–62%)이며 대개 감염 부위에 가장 먼저 도착하는 면역세포는?","ok":["호산구(eosinophil)","호염기구(basophil)","호중구(neutrophil)","단핵구(monocyte)","림프구(lymphocyte)"],"exp":"**호중구(neutrophils, 다형핵백혈구 polymorphonuclear leukocytes)**는 혈액에서 **가장 많은 백혈구**로, 순환 백혈구의 **54–62%**를 차지합니다.\n\n- 핵은 **2–5개의 엽(lobe)**\n- 역할: **세균과 작은 입자를 탐식(phagocytose)**\n- 대개 **감염 부위에 가장 먼저 도착하는 면역세포**입니다.","why":{"0":"호산구(eosinophils)는 백혈구의 1–3%이며 기생충 방어가 주 역할입니다.","1":"호염기구(basophils)는 1% 미만으로 가장 적습니다.","3":"단핵구(monocytes)는 가장 큰 백혈구이며 3–7%입니다.","4":"림프구(lymphocytes)는 가장 많은 무과립백혈구이지만 전체 백혈구 중 가장 많지는 않습니다."},"one":"호중구는 가장 많은 백혈구(54–62%)이고 감염 부위에 가장 먼저 도착한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w12_blood/p14.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-18":{"q":"In females, what is the small appendage seen on one lobe of the neutrophil nucleus?","o":["A nucleolus","A Charcot-Leyden crystal","A specific granule","An azurophilic granule","The Barr body, the inactive X chromosome"],"a":4,"qk":"여성의 호중구(neutrophil) 핵의 한 엽에서 보이는 작은 부속물은 무엇인가?","ok":["핵소체(nucleolus)","샤르코-라이덴 결정(Charcot-Leyden crystal)","특수과립(specific granule)","아주르친화과립(azurophilic granule)","비활성 X염색체인 바소체(Barr body)"],"exp":"호중구(neutrophils)의 핵은 2–5개의 엽(lobe)으로 나뉩니다. **여성에서는 비활성 X염색체(inactive X chromosome)**가 한 엽에 붙은 **작은 부속물(small appendage)**로 보이는데, 이를 **바소체(Barr body)**라고 합니다.\n\n핵 자체의 구조이므로 세포질 과립과 혼동하지 않아야 합니다.","why":{"0":"핵소체(nucleolus)는 핵 안의 구조이며 엽에 붙은 부속물이 아닙니다.","1":"샤르코-라이덴 결정은 호산구가 분해되어 생기는 결정으로, 호중구 핵의 부속물이 아닙니다.","2":"특수과립은 세포질에 있는 과립이지 핵의 부속물이 아닙니다.","3":"아주르친화과립은 세포질의 리소좀입니다."},"one":"여성 호중구 핵의 작은 부속물은 비활성 X염색체인 바소체(Barr body)이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14","img":[{"u":"img/w12_blood/p14.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 14"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-19":{"q":"Which substances are contained in neutrophil azurophilic granules for destroying bacteria?","o":["PDGF and platelet factor 4","Major basic protein and peroxidase","Heparin and histamine","Myeloperoxidase, lysozyme and defensins","ADP, ATP and serotonin"],"a":3,"qk":"호중구(neutrophil)의 아주르친화과립(azurophilic granules)에 들어 있으며 세균을 파괴하는 물질은?","ok":["PDGF와 혈소판 인자 4(platelet factor 4)","주염기성단백질(major basic protein)과 과산화효소(peroxidase)","헤파린(heparin)과 히스타민(histamine)","골수세포과산화효소(myeloperoxidase), 리소자임(lysozyme), 디펜신(defensins)","ADP, ATP, 세로토닌(serotonin)"],"exp":"호중구(neutrophils)의 과립은 두 종류입니다.\n\n- **아주르친화과립(azurophilic granules)**: **골수세포과산화효소(myeloperoxidase), 리소자임(lysozyme), 디펜신(defensins)**을 담아 **세균을 파괴**합니다.\n- **특수과립(specific granules)**: **연분홍색**으로 염색되며, 세포바깥바탕질(ECM) 분해 효소, 살균 단백질(bactericidal proteins), 새 세포막 성분을 담습니다.","why":{"0":"PDGF와 혈소판 인자 4는 혈소판의 알파과립(α granules) 내용물입니다.","1":"주염기성단백질과 과산화효소는 호산구(eosinophils) 특수과립의 내용물입니다.","2":"헤파린과 히스타민은 호염기구(basophils) 과립의 내용물입니다.","4":"ADP, ATP, 세로토닌은 혈소판의 델타과립(δ granules) 내용물입니다."},"one":"호중구 아주르친화과립에는 골수세포과산화효소·리소자임·디펜신이 있다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 15","img":[{"u":"img/w12_blood/p15.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 15"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-20":{"q":"Which leukocyte makes up 1–3% of blood leukocytes, has a bilobed nucleus, and has large acidophilic granules containing major basic protein?","o":["Neutrophil","Eosinophil","Lymphocyte","Basophil","Monocyte"],"a":1,"qk":"혈액 백혈구의 1–3%를 차지하고, 핵이 두 엽(bilobed)이며, 주염기성단백질(major basic protein)을 담은 큰 호산성 과립을 가진 백혈구는?","ok":["호중구(neutrophil)","호산구(eosinophil)","림프구(lymphocyte)","호염기구(basophil)","단핵구(monocyte)"],"exp":"**호산구(eosinophils)**는 혈액 백혈구의 **1–3%**이며, 핵이 **두 엽(bilobed nucleus)**입니다.\n\n세포질에 붉거나 분홍색으로 염색되는 **크고 호산성(acidophilic)인 특수과립**이 많고, 그 안에 **주염기성단백질(major basic proteins)**과 **과산화효소(peroxidase)**가 들어 있습니다.","why":{"0":"호중구(neutrophils)는 54–62%이고 핵이 2–5엽이며 특수과립은 연분홍색입니다.","2":"림프구(lymphocytes)는 무과립백혈구이며 구형의 응축된 핵을 가집니다.","3":"호염기구(basophils)는 1% 미만이고, 과립이 염기성 색소에 보라색으로 염색됩니다.","4":"단핵구(monocytes)는 무과립백혈구이며 C자형 핵을 가집니다."},"one":"호산구는 1–3%, 두 엽 핵, 주염기성단백질을 담은 큰 호산성 과립을 가진다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w12_blood/p16.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-21":{"q":"Which is a function of eosinophils?","o":["Releasing heparin to prevent clotting in vessels","Producing antibodies as plasma cells","Pinching off proplatelets in the bone marrow","Destroying parasitic worms and removing antigen-antibody complexes from interstitial fluid","Transporting O2 to the tissues"],"a":3,"qk":"호산구(eosinophils)의 기능은?","ok":["헤파린을 방출해 혈관 내 응고를 막는다","형질세포로서 항체를 생산한다","골수에서 전혈소판(proplatelets)을 떼어낸다","기생충을 파괴하고 사이질액의 항원-항체 복합체를 제거한다","O2를 조직으로 운반한다"],"exp":"**호산구(eosinophils)**의 세 가지 기능을 정리하세요.\n\n1. **기생충(parasitic worms, helminths) 파괴**\n2. **염증 반응 조절(modulate inflammatory responses)**\n3. **사이질액(interstitial fluid)의 항원-항체 복합체(antigen-antibody complexes) 제거**\n\n과립 속 주염기성단백질(major basic proteins)과 과산화효소(peroxidase)가 기생충 파괴에 쓰입니다.","why":{"0":"헤파린(heparin)은 호염기구(basophils) 과립의 내용물입니다.","1":"항체를 생산하는 것은 B 림프구에서 분화한 형질세포(plasma cells)입니다.","2":"전혈소판(proplatelets)을 떼어내는 것은 거대핵세포(megakaryocytes)입니다.","4":"O2 운반은 적혈구의 역할입니다."},"one":"호산구는 기생충을 파괴하고, 염증을 조절하며, 항원-항체 복합체를 제거한다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16","img":[{"u":"img/w12_blood/p16.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 16"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-22":{"q":"Basophils make up less than 1% of leukocytes. Which describes them?","o":["They are the largest leukocytes with a C-shaped nucleus.","Their pale pink granules contain defensins.","They are the first cells to arrive at an infection site.","They are agranulocytes that mature in the thymus.","Their purple granules often hide the bilobed nucleus; they contain heparin and histamine and have surface receptors for IgE."],"a":4,"qk":"호염기구(basophils)는 백혈구의 1% 미만이다. 호염기구를 설명하는 것은?","ok":["C자형 핵을 가진 가장 큰 백혈구이다.","연분홍 과립에 디펜신이 들어 있다.","감염 부위에 가장 먼저 도착하는 세포이다.","가슴샘에서 성숙하는 무과립백혈구이다.","보라색 과립이 두 엽 핵을 가릴 정도이며, 헤파린·히스타민을 담고 표면에 IgE 수용체가 있다."],"exp":"**호염기구(basophils)**는 백혈구의 **1% 미만**으로 가장 적습니다. 핵은 **두 엽**이지만, 특수과립이 염기성 색소에 **보라색**으로 진하게 염색되어 혈액 도말에서는 **과립이 핵을 가립니다**.\n\n과립 내용물: **헤파린(heparin)**과 황산화 글리코사미노글리칸(sulfated GAGs), **히스타민(histamine)** 등 염증 매개체, 혈소판활성인자(platelet activating factor), 호산구 화학주성인자(eosinophil chemotactic factor), 류코트리엔(leukotrienes)을 만들게 하는 포스포리파제 A(phospholipase A).\n\n**비만세포(mast cells)**의 기능을 보충하고, 표면에 **IgE 수용체**가 있어 **알레르기 증상**을 일으킵니다.","why":{"0":"C자형 핵을 가진 가장 큰 백혈구는 단핵구(monocytes)입니다.","1":"연분홍 특수과립은 호중구(neutrophils)의 특징이며, 디펜신은 호중구 아주르친화과립에 있습니다.","2":"감염 부위에 가장 먼저 도착하는 것은 호중구입니다.","3":"가슴샘(thymus)에서 성숙하는 것은 T 림프구이며, 호염기구는 과립백혈구입니다."},"one":"호염기구는 보라색 과립이 핵을 가리고, 헤파린·히스타민을 담으며 IgE 수용체로 알레르기를 일으킨다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 17, 18","img":[{"u":"img/w12_blood/p17.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 17"},{"u":"img/w12_blood/p18.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 18"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-23":{"q":"Which statement about lymphocytes is correct?","o":["They contain specific granules that stain purple.","Helper T cells are CD8+ and cytotoxic T cells are CD4+.","They are the most abundant agranulocyte and the smallest leukocyte, with a spherical condensed nucleus.","They are the largest circulating leukocytes.","They all die within a few days by apoptosis."],"a":2,"qk":"림프구(lymphocytes)에 대해 옳은 것은?","ok":["보라색으로 염색되는 특수과립이 있다.","도움 T세포는 CD8+, 세포독성 T세포는 CD4+이다.","가장 많은 무과립백혈구이자 가장 작은 백혈구이며, 구형의 응축된 핵을 가진다.","순환하는 백혈구 중 가장 크다.","모두 며칠 안에 세포자멸사로 죽는다."],"exp":"**림프구(lymphocytes)**는 혈액에서 **가장 많은 무과립백혈구(agranulocyte)**이고, **가장 작은 백혈구**입니다. 핵은 **구형으로 응축(spherical condensed nucleus)**되어 있고 세포질이 적습니다.\n\n종류:\n- **B 림프구(B cells)**\n- **T 림프구(T cells)**: 도움 T세포(helper) = **CD4+**, 세포독성 T세포(cytotoxic) = **CD8+**\n- **자연살해세포(NK cells)**\n\n수명은 **며칠에서 수년**까지 다양합니다.","why":{"0":"림프구는 무과립백혈구로 특수과립이 없습니다. 보라색 과립은 호염기구입니다.","1":"반대입니다. 도움 T세포가 CD4+, 세포독성 T세포가 CD8+입니다.","3":"가장 큰 백혈구는 단핵구(monocytes)입니다.","4":"림프구의 수명은 며칠에서 수년까지 다양합니다."},"one":"림프구는 가장 많은 무과립백혈구이자 가장 작은 백혈구이며, CD4+는 도움, CD8+는 세포독성 T세포이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 19","img":[{"u":"img/w12_blood/p19.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 19"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-24":{"q":"Which statement about monocytes is correct?","o":["They are the smallest leukocytes.","They are the largest circulating leukocytes, with an indented or C-shaped nucleus, and are thought to be precursors of macrophages and other MPS cells.","They are fragments of megakaryocytes.","They are terminally differentiated and live only a few days.","They have bilobed nuclei and red granules."],"a":1,"qk":"단핵구(monocytes)에 대해 옳은 것은?","ok":["가장 작은 백혈구이다.","순환 백혈구 중 가장 크고, 움푹하거나 C자형인 핵을 가지며, 대식세포 등 단핵포식세포계통(MPS) 세포의 전구세포로 여겨진다.","거대핵세포의 조각이다.","최종분화되어 며칠만 산다.","두 엽 핵과 붉은 과립을 가진다."],"exp":"**단핵구(monocytes, 단핵백혈구 mononuclear leukocytes)**는 **순환하는 백혈구 중 가장 큽니다**. 핵은 **크고 움푹하거나 C자형(indented or C-shaped)**이고, 세포질은 호염기성(basophilic)이며 아주르친화과립(azurophilic granules)이 있습니다.\n\n단핵구는 **대식세포(macrophages)**, **미세아교세포(microglia)**, 경우에 따라 **뼈파괴세포(osteoclasts)** 등 **단핵포식세포계통(MPS, mononuclear phagocytic system)** 세포의 전구세포로 여겨지며, 이 파생 세포들은 대개 **항원제시(antigen-presenting)** 기능을 가집니다.","why":{"0":"가장 작은 백혈구는 림프구(lymphocytes)입니다.","2":"거대핵세포의 조각은 혈소판(platelets)입니다.","3":"최종분화되어 며칠 사는 것은 과립백혈구입니다. 단핵구는 조직에서 대식세포로 성숙합니다.","4":"두 엽 핵과 붉은 과립은 호산구(eosinophils)의 특징입니다."},"one":"단핵구는 가장 큰 백혈구로 C자형 핵을 가지며 대식세포 등 MPS 세포의 전구세포이다.","src":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w12_blood/p20.webp","cap":"17 - Blood and Hemopoiesis 2024-2025 CANVAS.pdf, slide 20"}],"ch":"w12_blood","chn":"Blood and Hemopoiesis","week":12},"w12_blood-25":{"q":"In the leukocyte summary table, which cell type has a differential count of about 25–33% with a life span of hours to many years?","o":["Lymphocytes","Basophils","Eosinophils","Monocytes","Neutrophils"],"a":0,"qk":"백혈구 요약표에서 백혈구 감별계산(differential count)이 약 25–33%이고 수명이 수 시간에서 수년인 세포는?","ok":["림프구(lymphocytes)","호염기구(basophils)","호산구(eosinophils)","단핵구(monocytes)","호중구(neutrophils)"],"exp":"백혈구 요약표를 정리하면 다음과 같습니다.\n\n- **호중구(neutrophils)**: 핵 3–5엽, 연분홍 과립, 57–67%, 1–4일, 세균을 죽이고 탐식\n- **호산구(eosinophils)**: 두 엽, 붉은/진분홍 과립, 1–3%, 1–2주, 기생충 처리·국소 염증 조절\n- **호염기구(basophils)**: 두 엽 또는 S자형, 진청/보라 과립, 0–0.75%, 수개월, 염증 조절·알레르기 때 히스타민 방출\n- **림프구(lymphocytes)**: 거의 구형 핵, 과립 없음, **25–33%**, **수 시간–수년**, 적응면역(adaptive immunity)의 작동·조절 세포\n- **단핵구(monocytes)**: 움푹하거나 C자형 핵, 3–7%, 수 시간–수년, 대식세포와 단핵포식세포의 전구세포","why":{"1":"호염기구는 0–0.75%이며 수명은 수개월입니다.","2":"호산구는 1–3%, 수명 1–2주입니다.","3":"단핵구는 3–7%입니다.","4":"호중구는 감별계산 57–67%, 수명 1–4일입니
