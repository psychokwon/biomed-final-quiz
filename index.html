ter switch on inspiratory activity.","The only output is via the phrenic nerves."],"a":0,"qk":"호흡중추(respiratory center)의 활동을 가장 잘 설명하는 것은 무엇입니까?","ok":["정상적인 리듬성 호흡 패턴은 뇌교(pons)와 연수(medulla)의 뉴런에서 시작된다.","흡기 활동은 뇌교에 있는 배측 호흡군(dorsal respiratory group) 뉴런에서 시작된다.","호흡조절중추(pneumotaxic center)의 자극이 흡기 활동을 켠다(switch on).","유일한 출력은 횡격신경(phrenic nerves)을 통한 것이다."],"exp":"**정답 이유**\n\n기본 호흡 리듬은 뇌간(brainstem)의 중추 조절기(central controller)에서 만들어집니다. 연수의 배측 호흡군(DRG)과 복측 호흡군(VRG)이 리듬을 만들고, 뇌교의 지속흡식중추(apneustic center)와 호흡조절중추(pneumotaxic center)가 이를 **미세조정(fine-tune)**합니다. 그래서 \"뇌교와 연수의 뉴런\"이 정상 리듬 패턴을 함께 만든다는 A가 가장 적절합니다.","why":{"1":"배측 호흡군(DRG)은 뇌교가 아니라 **연수(medulla)**에 있습니다. DRG가 주로 흡기 뉴런을 가진다는 부분은 맞습니다.","2":"호흡조절중추는 흡기를 켜는 것이 아니라 **끄는(switch off)** 쪽입니다. 흡기 시간을 짧게 해 호흡수를 늘립니다. 흡기를 계속 유지시키는 쪽은 지속흡식중추입니다.","3":"횡격신경 외에도 늑간근으로 가는 늑간신경(intercostal nerves), 보조호흡근으로 가는 신경 등 출력이 여럿 있습니다."},"one":"정상적인 리듬성 호흡 패턴은 뇌교(pons)와 연수(medulla)의 뉴런에서 시작된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q20) / 8b. Pulmonary Physiology 2026.pdf, slides 75, 76, 77","img":[{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75"},{"u":"img/w11_pulm_phys/p76.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 76"},{"u":"img/w11_pulm_phys/p77.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 77"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-21":{"q":"What best characterizes glomus cells?","o":["They are located in the carotid sinus.","They form the BBB.","They exist in the airways of the lung.","They possess oxygen sensors."],"a":3,"qk":"사구세포(glomus cells)를 가장 잘 설명하는 것은 무엇입니까?","ok":["경동맥동(carotid sinus)에 위치한다.","혈뇌장벽(BBB)을 형성한다.","폐의 기도에 존재한다.","산소 감지기(oxygen sensors)를 가지고 있다."],"exp":"**정답 이유**\n\n사구세포는 말초 화학수용체인 **경동맥소체(carotid body)**의 감각 세포입니다. 동맥혈 O₂ 분압이 떨어지면(저산소혈증 hypoxemia) 사구세포의 산소 감지 기전(O₂ 민감성 K⁺ 채널)이 작동해 세포가 **탈분극(depolarize)**합니다. 그러면 Ca²⁺가 들어오고 신경전달물질이 분비되어, 설인신경(glossopharyngeal nerve)을 통해 뇌간에 신호를 보냅니다. 즉 사구세포는 \"산소 감지기\"를 가진 세포입니다.","why":{"0":"경동맥**동(sinus)**은 혈압을 감지하는 **압수용체(baroreceptor)**가 있는 곳입니다. 사구세포가 있는 경동맥**소체(body)**와 헷갈리게 만든 함정입니다.","1":"혈뇌장벽은 뇌 모세혈관 내피세포의 치밀이음부(tight junction) 등이 만듭니다.","2":"기도에는 사구세포가 없습니다. 경동맥 분기부와 대동맥궁에 있습니다."},"one":"사구세포(glomus cells)는 말초 화학수용체의 산소 감지기(oxygen sensors)를 가진 세포이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q21) / 8b. Pulmonary Physiology 2026.pdf, slides 78, 79","img":[{"u":"img/w11_pulm_phys/p78.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 78"},{"u":"img/w11_pulm_phys/p79.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 79"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-22":{"q":"John is a 62 yr-old male who has been a heavy cigarette smoker for 40+ years. He is hospitalized because of COPD and supplied with 50% oxygen through a nasal cannula. Which of the following will change the most as a result of the oxygenation?","o":["His vital capacity.","His hematocrit.","The viscosity of his blood.","The oxygen content of his blood.","His lung diffusing capacity."],"a":3,"qk":"John은 40년 넘게 담배를 많이 피운 62세 남성입니다. COPD로 입원해 비강 캐뉼라(nasal cannula)로 50% 산소를 공급받고 있습니다. 산소 공급의 결과로 가장 많이 변하는 것은 무엇입니까?","ok":["그의 폐활량(vital capacity)","그의 적혈구용적률(hematocrit)","그의 혈액 점도(viscosity)","그의 혈액 산소 함량(oxygen content)","그의 폐 확산능(lung diffusing capacity)"],"exp":"**정답 이유**\n\nCOPD에서는 V/Q 불일치로 저산소혈증이 생깁니다. 고농도 산소를 주면 흡입 PO₂(PIO₂)가 크게 올라갑니다. 그러면 환기가 나쁜(V/Q가 낮은) 폐포에도 O₂가 더 들어가 PaO₂와 Hb 포화도가 올라가고, 용존 O₂도 증가합니다. 산소 함량 = 용존 O₂ + Hb 결합 O₂이므로 **혈액 산소 함량이 가장 즉각적이고 크게 변합니다**. (단, V/Q 불일치와 달리 진짜 단락은 100% O₂로도 교정되지 않는다는 점은 Q12에서 보신 대로입니다.)","why":{"0":"폐활량은 폐와 흉벽의 기계적 특성으로 정해집니다. 산소를 마신다고 바뀌지 않습니다.","1":"적혈구용적률과 이로 인한 혈액 점도는 만성 저산소에 대한 적혈구 증가(수주 이상)로 변하는 값입니다. 산소 공급 직후에 크게 변하지 않습니다.","2":"적혈구용적률과 이로 인한 혈액 점도는 만성 저산소에 대한 적혈구 증가(수주 이상)로 변하는 값입니다. 산소 공급 직후에 크게 변하지 않습니다.","4":"확산능(DL)은 막의 면적과 두께 등 구조로 정해집니다(Fick의 법칙). 흡입 산소 농도와는 무관합니다."},"one":"COPD 환자에게 산소를 공급하면 가장 즉각적으로 크게 변하는 것은 혈액 산소 함량이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q22) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 82","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55"},{"u":"img/w11_pulm_phys/p82.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 82"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-23":{"q":"Humans inspire about 10,000 L of air daily. This air contains various substances some of which are potentially injurious to respiratory tissues. Mucocillliary transport is a vital mechanism designed to protect against injury. How is this mechanism best described?","o":["It moves inhaled particulates downward where they are destroyed by alveolar macrophages.","Biphasic ciliary activity moves the mucus layer containing inhaled particulates toward the pharynx.","Biphasic ciliary activity moves the fluid layer containing inhaled particulates toward the pharynx.","The mucus layer contains hydrolytic enzymes that digest inhaled particulates.","The fluid layer contains hydrolytic enzymes that digest inhaled particulates."],"a":1,"qk":"사람은 하루 약 10,000 L의 공기를 들이마십니다. 이 공기에는 호흡기 조직을 손상시킬 수 있는 다양한 물질이 들어 있습니다. 점액섬모 수송(mucociliary transport)은 손상을 막기 위한 중요한 기전입니다. 이 기전을 가장 잘 설명한 것은 무엇입니까?","ok":["흡입된 입자를 아래쪽으로 옮겨 폐포 대식세포(alveolar macrophages)가 파괴하게 한다.","이상성(biphasic) 섬모 운동이 흡입 입자가 담긴 점액층(mucus layer)을 인두(pharynx) 쪽으로 이동시킨다.","이상성 섬모 운동이 흡입 입자가 담긴 액체층(fluid layer)을 인두 쪽으로 이동시킨다.","점액층에 흡입 입자를 소화하는 가수분해효소(hydrolytic enzymes)가 있다.","액체층에 흡입 입자를 소화하는 가수분해효소가 있다."],"exp":"**정답 이유**\n\n\"작은 입자는 기도의 섬모 작용(ciliary action)으로 **위로 움직이는 점액층(upward moving mucus layer)**에 의해 제거된다\". 기도 표면은 두 층으로 되어 있습니다.\n\n· 아래층: 묽은 **액체층**(섬모주위액 periciliary fluid). 섬모가 이 안에서 자유롭게 움직입니다.\n\n· 위층: 끈끈한 **점액층(mucus)**. 먼지와 세균이 여기에 달라붙습니다.\n\n섬모는 빠르고 힘찬 앞쪽 박동(effective stroke)과 느린 복귀 박동(recovery stroke)의 **이상성(biphasic)** 운동을 합니다. 앞쪽 박동 때 섬모 끝이 위의 점액층을 밀어 올려, 점액을 인두 쪽으로 운반합니다. 운반된 점액은 삼키거나 뱉어냅니다(점액섬모 에스컬레이터 mucociliary escalator).","why":{"0":"방향이 반대입니다. 점액은 아래가 아니라 위(인두 쪽)로 움직입니다. 폐포까지 들어간 입자를 대식세포가 처리하는 것은 맞지만, 점액섬모 수송과는 별개의 기전입니다.","2":"운반되는 것은 아래의 묽은 액체층이 아니라 그 위의 **점액층**입니다.","3":"점액섬모 수송은 입자를 \"소화\"하는 것이 아니라 \"물리적으로 밖으로 운반\"하는 기전입니다.","4":"점액섬모 수송은 입자를 \"소화\"하는 것이 아니라 \"물리적으로 밖으로 운반\"하는 기전입니다."},"one":"점액섬모 수송은 이상성(biphasic) 섬모 운동이 흡입 입자가 담긴 점액층을 인두 쪽으로 이동시키는 기전이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q23) / 8b. Pulmonary Physiology 2026.pdf, slides 86, 87","img":[{"u":"img/w11_pulm_phys/p86.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 86"},{"u":"img/w11_pulm_phys/p87.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 87"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-24":{"q":"What substrate in the blood is most likely to undergo modification or elimination during passage through the pulmonary vasculature?","o":["Histamine","Vasoactive intestinal peptide (VIP)","Angiotensin I","Angiotensin II","Substance P"],"a":2,"qk":"폐혈관(pulmonary vasculature)을 지나면서 변형되거나 제거될 가능성이 가장 높은 혈액 내 물질은 무엇입니까?","ok":["히스타민(histamine)","혈관활성장펩타이드(vasoactive intestinal peptide, VIP)","안지오텐신 I(angiotensin I)","안지오텐신 II(angiotensin II)","P 물질(substance P)"],"exp":"**정답 이유**)\"을 명시합니다. 폐 모세혈관 내피세포 표면에는 안지오텐신 전환효소(angiotensin-converting enzyme, ACE)가 아주 많습니다. 그래서 혈액이 폐를 한 번 지나는 동안 안지오텐신 I(약한 형태)의 대부분이 강력한 혈관수축물질인 안지오텐신 II로 바뀝니다. 몸 전체 혈액이 폐를 지나므로 폐는 이 전환의 주된 장소입니다.","why":{"3":"안지오텐신 II는 폐에서 **만들어지는 결과물**입니다. 폐를 거의 변화 없이 통과해 전신 혈관에 작용합니다.","0":"히스타민(histamine)은 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 이 문제의 정답 근거는 폐가 안지오텐신 I을 안지오텐신 II로 전환한다는 점입니다.","1":"혈관활성장펩타이드(VIP)는 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 정답은 안지오텐신 I의 전환입니다.","4":"P 물질(substance P)은 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 정답은 안지오텐신 I의 전환입니다."},"one":"폐를 지나며 가장 잘 변형되는 혈액 내 물질은 안지오텐신 I로, ACE에 의해 안지오텐신 II로 전환된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q24) / 8b. Pulmonary Physiology 2026.pdf, slides 85, 89","img":[{"u":"img/w11_pulm_phys/p85.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 85"},{"u":"img/w11_pulm_phys/p89.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 89"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-25":{"q":"Inflammation of the airways is most likely to result in","o":["increased ventilation of alveoli.","increased airway resistance.","reduced turbulence in airways.","dynamic compression of large airways.","increased FEV1."],"a":1,"qk":"기도의 염증(inflammation of the airways)은 다음 중 어떤 결과를 가져올 가능성이 가장 높습니까?","ok":["폐포 환기 증가","기도 저항(airway resistance) 증가","기도 난류(turbulence) 감소","큰 기도의 동적 압박(dynamic compression)","FEV1 증가"],"exp":"**정답 이유**\n\n기류는 압력차에 비례하고 기도 저항에 반비례합니다. 평활근 긴장도가 변하면 기도 지름이 바뀌어 저항이 달라집니다. 염증이 생기면 기도 벽이 붓고(부종 edema), 점액 분비가 늘고, 평활근이 수축해 **기도 지름이 좁아집니다**. 저항은 반지름의 4제곱에 반비례하므로(푸아죄유 법칙 Poiseuille's law, 일반 생리 원리), 조금만 좁아져도 저항이 크게 **증가**합니다. 천식(asthma)과 기관지염(bronchitis)이 대표적인 예입니다.","why":{"0":"기도가 좁아지면 폐포로 가는 공기가 줄어 폐포 환기는 오히려 감소합니다.","2":"기도가 좁아지면 같은 유량에서 공기 속도가 빨라져 난류가 오히려 **증가**합니다.","3":"동적 압박은 노력성 호기 때 흉막내압이 기도압보다 커져서 생기는 현상입니다. 특히 탄성이 줄어든 폐기종에서 두드러집니다. 염증의 \"가장 직접적인\" 결과는 아닙니다.","4":"저항이 커지면 1초간 내쉴 수 있는 양(FEV1)은 **감소**합니다."},"one":"기도 염증은 기도 지름을 좁혀 기도 저항(airway resistance)을 증가시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q25) / 8b. Pulmonary Physiology 2026.pdf, slides 28, 30","img":[{"u":"img/w11_pulm_phys/p28.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 28"},{"u":"img/w11_pulm_phys/p30.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 30"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_cv_phys-1":{"q":"Which statement best characterizes the normal right heart?","o":["It is a high pressure pump.","It forces blood into the vena cava.","It produces systolic pressures of 120 mm Hg.","It pumps a volume of blood equal to that pumped by the left heart.","It has greater afterload than the left heart."],"a":3,"qk":"정상 우심(right heart)을 가장 잘 설명하는 것은 무엇입니까?","ok":["고압 펌프(high pressure pump)이다.","혈액을 대정맥(vena cava)으로 밀어낸다.","120 mmHg의 수축기압을 만든다.","좌심이 박출하는 혈액량과 같은 양을 박출한다.","좌심보다 후부하(afterload)가 크다."],"exp":"**정답 이유**\n\n\"좌·우 심실의 심박출량은 정상적으로 **양은 같지만 압력은 같지 않습니다**\". 두 심실은 하나의 회로로 이어져 있습니다. 만약 우심이 좌심보다 조금이라도 더 많이 보내면 그 차이만큼 혈액이 폐에 계속 쌓이게 됩니다. 그래서 정상에서는 박출량이 같아야 합니다. 우심은 \"용적 펌프(volume pump)\", 좌심은 \"압력 펌프(pressure pump)\"입니다.","why":{"0":"우심은 저압의 폐순환으로 혈액을 보내는 **저압** 펌프입니다.","1":"우심은 혈액을 대정맥에서 **받아서** 폐동맥(pulmonary artery)으로 내보냅니다.","2":"120 mmHg는 **좌**심실 수축기압입니다. 우심실 수축기압은 약 25 mmHg입니다.","4":"후부하는 우심실의 경우 평균 폐동맥압, 좌심실의 경우 평균 체동맥압입니다. 폐동맥압이 훨씬 낮으므로 우심의 후부하가 더 **작습니다**."},"one":"정상에서 우심과 좌심은 박출하는 혈액량은 같고, 압력은 같지 않다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q1) / 9b. Cardiovascular Physiology 2026.pdf, slides 52, 55","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52"},{"u":"img/w11_cv_phys/p55.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 55"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-2":{"q":"Assuming no change in the other forces, what effect will an increase in plasma oncotic pressure have on capillary fluid dynamics?","o":["An increase in capillary filtration.","An increase in net filtration pressure.","A decrease in capillary absorption.","An increase in interstitial hydrostatic pressure.","A decrease in capillary filtration."],"a":4,"qk":"다른 힘들은 변하지 않는다고 할 때, 혈장 교질삼투압(plasma oncotic pressure)이 증가하면 모세혈관 액체 역학에 어떤 영향이 있습니까?","ok":["모세혈관 여과(filtration) 증가","순여과압(net filtration pressure) 증가","모세혈관 재흡수(absorption) 감소","간질 정수압(interstitial hydrostatic pressure) 증가","모세혈관 여과(filtration) 감소"],"exp":"**스탈링 힘 **\n\n순여과 = (CHP + TOP) − (POP + THP)\n\n· CHP 모세혈관 정수압(capillary hydrostatic pressure), TOP 조직 교질삼투압(tissue oncotic pressure): 물을 **밖으로** 미는 힘\n\n· POP 혈장 교질삼투압(plasma oncotic pressure), THP 조직 정수압(tissue hydrostatic pressure): 물을 **안으로** 붙잡는 힘\n\n혈장 교질삼투압은 혈장 단백질(주로 알부민 albumin)이 물을 혈관 안으로 끌어당기는 힘입니다. 이 값이 커지면 위 식의 빼는 쪽이 커지므로 순여과가 줄고, 결국 **여과가 감소**합니다.","why":{"0":"정반대입니다. 여과와 순여과압은 감소합니다.","1":"정반대입니다. 여과와 순여과압은 감소합니다.","2":"물을 혈관 안으로 끌어당기는 힘이 커지므로 재흡수는 오히려 **증가**합니다.","3":"여과가 줄면 간질로 나가는 물이 줄어, 간질 정수압은 증가하지 않습니다."},"one":"혈장 교질삼투압이 증가하면 물을 혈관 안으로 붙잡는 힘이 커져 모세혈관 여과가 감소한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q2) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14"},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-3":{"q":"What is primarily responsible for the increased blood flow to active muscle?","o":["Dilation of small veins and venules.","Dilation of capillaries.","Constriction of arterioles.","Venoconstriction.","Accumulation of vasodilatory metabolites in the muscle."],"a":4,"qk":"활동하는 근육으로의 혈류 증가를 주로 일으키는 것은 무엇입니까?","ok":["작은 정맥과 세정맥(venules)의 확장","모세혈관(capillaries)의 확장","세동맥(arterioles)의 수축","정맥 수축(venoconstriction)","근육 내 혈관확장성 대사산물(vasodilatory metabolites)의 축적"],"exp":"**정답 이유**\n\n미세순환의 혈류는 국소 조직 대사산물(local tissue metabolites)의 영향을 받습니다. 근육이 일하면 CO₂, H⁺, 젖산(lactate), K⁺, 아데노신(adenosine)이 쌓이고 O₂는 줄어듭니다. 이 대사산물들이 그 근육의 **세동맥 평활근을 이완**시킵니다. 세동맥이 넓어지면 저항이 줄어(저항 ∝ 1/r⁴) 혈류가 크게 늘어납니다. 이를 능동 충혈(active hyperemia)이라고 합니다. 일을 많이 하는 조직이 스스로 혈류를 더 끌어오는 셈입니다.","why":{"0":"정맥은 저항 혈관이 아니라 **용량 혈관(capacitance vessel)**입니다. 정맥의 지름 변화는 혈류량 조절보다 혈액 저장과 정맥 환류에 관여합니다.","3":"정맥은 저항 혈관이 아니라 **용량 혈관(capacitance vessel)**입니다. 정맥의 지름 변화는 혈류량 조절보다 혈액 저장과 정맥 환류에 관여합니다.","1":"모세혈관은 평활근이 없어 스스로 확장하지 못합니다. 혈류 변화는 상류의 세동맥이 결정합니다.","2":"세동맥이 **수축**하면 혈류는 오히려 감소합니다."},"one":"활동 근육의 혈류 증가는 주로 혈관확장성 대사산물 축적에 의한 세동맥 이완 때문이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q3) / 9b. Cardiovascular Physiology 2026.pdf, slide 18","img":[{"u":"img/w11_cv_phys/p18.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 18"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-4":{"q":"What best characterizes normal veins?","o":["They are resistance vessels.","They are exchange vessels.","They are more compliant than arteries.","They have thicker walls than arteries.","They contain less blood than arteries."],"a":2,"qk":"정상 정맥(veins)을 가장 잘 설명하는 것은 무엇입니까?","ok":["저항 혈관(resistance vessels)이다.","교환 혈관(exchange vessels)이다.","동맥보다 순응도(compliance)가 크다.","동맥보다 벽이 두껍다.","동맥보다 혈액을 적게 담고 있다."],"exp":"**정답 이유**\n\n순응도(compliance)는 압력이 조금 오를 때 부피가 얼마나 늘어나는지를 나타내는 \"늘어나는 성질(distensibility)\"입니다. 정맥은 벽이 얇고 탄성이 적어 **매우 잘 늘어납니다**(\"veins are highly compliant\"). 그래서 전체 혈액의 약 2/3를 담는 저장소(용량 혈관 capacitance vessel) 역할을 합니다. 필요할 때 이 저장 혈액을 동원하면 정맥 환류와 심박출량이 늘어납니다.","why":{"0":"저항 혈관은 **세동맥(arteriole)**입니다.","1":"교환 혈관은 **모세혈관(capillary)**입니다.","3":"정맥은 동맥보다 벽이 **얇습니다**.","4":"정맥은 동맥보다 혈액을 훨씬 **많이** 담고 있습니다."},"one":"정맥은 동맥보다 순응도(compliance)가 커서 용량 혈관(capacitance vessel)으로 작용한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q4) / 9b. Cardiovascular Physiology 2026.pdf, slide 9","img":[{"u":"img/w11_cv_phys/p09.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 9"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-5":{"q":"Turbulence in the vasculature is most likely to occur","o":["in capillaries.","in venules.","with increased blood viscosity.","when the hematocrit is low.","in vessels arranged in series."],"a":3,"qk":"혈관계에서 난류(turbulence)가 생길 가능성이 가장 높은 경우는 언제입니까?","ok":["모세혈관에서","세정맥에서","혈액 점도(viscosity)가 증가했을 때","적혈구용적률(hematocrit)이 낮을 때","직렬(series)로 배열된 혈관에서"],"exp":"**정답 이유**\n\n난류는 다음 경우에 잘 생깁니다. (a) 혈관 지름이 클 때, (b) **혈액 점도가 낮을 때**, (c) 유속이 빠를 때, (d) 국소적으로 혈관이 좁아졌을 때. 적혈구용적률은 혈액 중 적혈구가 차지하는 비율이고, 혈액 점도를 결정하는 가장 큰 요인입니다. 빈혈처럼 적혈구용적률이 **낮으면** 점도가 낮아져 난류가 잘 생깁니다. 빈혈 환자에서 심잡음(murmur)이 들리는 이유이기도 합니다. (참고: 이는 레이놀즈 수 Reynolds number = 밀도 × 지름 × 속도 / 점도와 같은 원리입니다.)","why":{"0":"모세혈관과 세정맥은 지름이 매우 작고 유속도 느려 난류가 거의 생기지 않습니다.","1":"모세혈관과 세정맥은 지름이 매우 작고 유속도 느려 난류가 거의 생기지 않습니다.","2":"점도가 **증가**하면 난류는 오히려 생기기 어렵습니다.","4":"직렬이냐 병렬이냐 하는 배열은 전체 저항 계산과 관련된 개념입니다. 난류의 조건이 아닙니다."},"one":"적혈구용적률이 낮아 혈액 점도가 떨어지면 혈관계에서 난류가 생기기 쉽다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q5) / 9b. Cardiovascular Physiology 2026.pdf, slides 11, 12","img":[{"u":"img/w11_cv_phys/p11.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 11"},{"u":"img/w11_cv_phys/p12.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 12"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-6":{"q":"What is the most important factor favoring normal filtration across capillaries?","o":["Plasma oncotic pressure.","Tissue oncotic pressure.","Hydrostatic pressure.","Tissue hydrostatic pressure.","Lymph flow."],"a":2,"qk":"정상적인 모세혈관 여과(filtration)를 촉진하는 가장 중요한 요인은 무엇입니까?","ok":["혈장 교질삼투압","조직 교질삼투압","정수압(hydrostatic pressure)","조직 정수압","림프 흐름(lymph flow)"],"exp":"**정답 이유**\n\n여과를 일으키는 힘은 CHP(모세혈관 정수압)와 TOP(조직 교질삼투압)입니다. 이 중 압도적으로 큰 힘은 심장이 만든 혈압이 모세혈관까지 전달된 **모세혈관 정수압**입니다(동맥 쪽 약 30–35 mmHg). 그래서 여과는 주로 정수압이 높은 동맥 쪽에서 일어나고, 정수압이 낮아진 정맥 쪽에서는 재흡수가 일어납니다.","why":{"0":"혈장 교질삼투압은 여과에 **반대**하는(물을 붙잡는) 힘입니다.","1":"조직 교질삼투압은 여과를 돕는 쪽이지만, 정상에서 간질 단백질이 적어 값이 작습니다.","3":"조직 정수압은 여과에 반대하는 힘이고, 값도 작습니다(0 근처).","4":"림프 흐름은 여과된 여분의 액체를 간질에서 제거하는 경로입니다. 여과를 일으키는 힘이 아닙니다."},"one":"정상적인 모세혈관 여과를 촉진하는 가장 중요한 요인은 정수압(hydrostatic pressure)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q6) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14"},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-7":{"q":"What does an increase in the slope of phase 4 of slow response action potentials result in?","o":["Increased heart rate","Decreased heart rate","Decreased firing rate of the SA node","Decreased inward conductance of calcium current","Increased outward conductance of potassium current."],"a":0,"qk":"느린 반응 활동전위(slow response action potential)에서 4기(phase 4)의 기울기가 증가하면 어떤 결과가 생깁니까?","ok":["심박수 증가","심박수 감소","동방결절(SA node) 발화율 감소","칼슘 내향 전도도(inward conductance) 감소","칼륨 외향 전도도(outward conductance) 증가"],"exp":"**정답 이유**\n\n동방결절 같은 박동조율세포(pacemaker cell)는 4기에 스스로 서서히 탈분극합니다(자발적 탈분극 spontaneous depolarization). 이는 funny 전류(If), Ca²⁺ 전류 등 때문입니다. 이 오르막의 **기울기가 가파르면 역치(threshold)에 더 빨리 도달**합니다. 그만큼 활동전위가 자주 발생하므로 동방결절 발화율이 늘고 **심박수가 증가**합니다. 교감신경(β₁)이 바로 이 방식으로 심박수를 올립니다.","why":{"1":"기울기가 **감소**할 때(부교감, ACh)의 결과입니다.","2":"기울기가 **감소**할 때(부교감, ACh)의 결과입니다.","3":"칼슘(과 If) 내향 전류가 **증가**해야 기울기가 가팔라집니다. 감소는 반대 결과를 낳습니다.","4":"칼륨 외향 전류 증가(KACₕ 채널 열림)는 세포를 과분극시켜 기울기를 **완만하게** 만듭니다. 부교감 작용입니다."},"one":"느린 반응 활동전위 4기 기울기가 증가하면 역치에 더 빨리 도달해 심박수가 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q7) / 9b. Cardiovascular Physiology 2026.pdf, slides 25, 26, 56","img":[{"u":"img/w11_cv_phys/p25.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 25"},{"u":"img/w11_cv_phys/p26.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 26"},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-8":{"q":"Which phase of the fast response action potential is maintained by Na/K ATPase?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"qk":"빠른 반응 활동전위(fast response action potential)의 어느 기가 Na/K ATPase에 의해 유지됩니까?","ok":["0기","1기","2기","3기","4기"],"exp":"**정답 이유**\n\n4기는 \"안정막전위(resting membrane potential)가 회복되어 **안정적인**\" 시기입니다. 활동전위 동안 Na⁺는 세포 안으로 들어오고 K⁺는 밖으로 나갑니다. Na⁺/K⁺ ATPase는 ATP를 써서 Na⁺ 3개를 내보내고 K⁺ 2개를 들여와 이온 농도 기울기를 되돌립니다. 이 덕분에 안정막전위(약 −90 mV)가 유지되므로 4기와 가장 직접적으로 연결됩니다.","why":{"0":"0기: 빠른 Na⁺ 채널 개방에 의한 급속 탈분극","1":"1기: 빠른 Na⁺ 채널 불활성화에 의한 초기 재분극","2":"2기: L형 Ca²⁺ 채널 유입과 K⁺ 유출의 균형으로 생기는 고원기(plateau)","3":"3기: Ca²⁺ 채널이 닫히고 K⁺가 유출되는 재분극"},"one":"빠른 반응 활동전위의 4기(안정막전위)는 Na⁺/K⁺ ATPase에 의해 유지된다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q8) / 9b. Cardiovascular Physiology 2026.pdf, slide 23","img":[{"u":"img/w11_cv_phys/p23.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 23"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-9":{"q":"Which phase of the slow response action potential is affected by adrenergic agonists?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"qk":"느린 반응 활동전위의 어느 기가 아드레날린 작동제(adrenergic agonists)의 영향을 받습니까?","ok":["0기","1기","2기","3기","4기"],"exp":"**정답 이유**\n\n\"아드레날린 작동제가 박동조율세포의 β₁ 수용체에 결합하면 If와 Ca²⁺ 전류에 영향을 주어 느린 반응 활동전위 **4기의 기울기를 증가**시킵니다. 그 결과 동방결절 발화율이 증가합니다\". Q7과 짝을 이루는 문제입니다.","why":{"1":"느린 반응 활동전위에는 **1기와 2기가 없습니다**. 0, 3, 4의 세 기만 있습니다. 이 두 보기는 처음부터 해당 사항이 없습니다.","2":"느린 반응 활동전위에는 **1기와 2기가 없습니다**. 0, 3, 4의 세 기만 있습니다. 이 두 보기는 처음부터 해당 사항이 없습니다.","0":"0기(L형 Ca²⁺ 유입에 의한 상승)도 교감 자극으로 약간 영향을 받습니다. 하지만 심박수를 바꾸는 핵심이자","3":"3기는 K⁺ 유출에 의한 재분극으로, 시험에서 요구하는 답이 아닙니다."},"one":"아드레날린 작동제는 느린 반응 활동전위의 4기 기울기를 증가시켜 심박수를 올린다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q9) / 9b. Cardiovascular Physiology 2026.pdf, slide 56","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-10":{"q":"What change in the EKG comes with a bundle branch block (BBB)?","o":["An increase in the PR interval.","A wider QRS complex.","A decrease in the PR interval.","Atrial fibrillation.","Absence of T waves."],"a":1,"qk":"각차단(bundle branch block, BBB)이 있으면 심전도(EKG)에 어떤 변화가 생깁니까?","ok":["PR 간격 증가","QRS 복합파가 넓어짐","PR 간격 감소","심방세동(atrial fibrillation)","T파 소실"],"exp":"**정답 이유**\n\n흥분은 동방결절 → 방실결절 → 히스속(bundle of His) → **좌·우 각(bundle branches)** → 푸르키네 섬유(Purkinje fibers)로 전달됩니다. QRS 복합파는 심실이 탈분극되는 시간입니다. 한쪽 각이 막히면 그쪽 심실은 빠른 전도로를 쓰지 못합니다. 대신 반대쪽 심실에서 심근세포끼리 천천히 흥분이 퍼져 와야 하므로, 심실 탈분극 시간이 길어져 **QRS가 넓어집니다**(≥ 0.12초).","why":{"0":"PR 간격 증가는 방실결절 전도 지연, 즉 1도 방실차단(first degree AV block)의 소견입니다. 각차단은 방실결절보다 아래 문제입니다.","2":"PR 간격 감소는 우회로(예: WPW 증후군)나 방실결절 전도가 빨라질 때 보입니다.","3":"심방세동은 심방의 재진입(reentry) 부정맥입니다. 각차단과는 별개입니다.","4":"각차단에서도 T파는 있습니다(모양이 변할 수는 있습니다)."},"one":"각차단(bundle branch block)이 있으면 심실 탈분극이 늦어져 QRS 복합파가 넓어진다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q10) / 9b. Cardiovascular Physiology 2026.pdf, slides 27, 32, 33","img":[{"u":"img/w11_cv_phys/p27.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 27"},{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32"},{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-11":{"q":"What is the most life-threatening cardiac arrhythmia ?","o":["Atrial flutter","Atrial fibrillation","Ventricular tachycardia","Sinus rhythm","Ventricular fibrillation"],"a":4,"qk":"가장 생명을 위협하는 부정맥(cardiac arrhythmia)은 무엇입니까?","ok":["심방조동(atrial flutter)","심방세동(atrial fibrillation)","심실빈맥(ventricular tachycardia)","동성리듬(sinus rhythm)","심실세동(ventricular fibrillation)"],"exp":"**정답 이유**\n\n심실세동은 심실 근육이 재진입 흥분(reentrant excitation)으로 제각각 무질서하게 떨기만 하는 상태입니다. 심실이 한꺼번에 수축하지 못하므로 **혈액을 전혀 박출하지 못합니다**. 맥박과 혈압이 사라지고 몇 분 안에 뇌 손상과 사망에 이릅니다. 즉시 제세동(defibrillation)이 필요합니다.","why":{"0":"심방조동과 심방세동은 심방의 문제입니다. 심방 수축이 사라지더라도 심실은 계속 박출하므로 즉시 치명적이지는 않습니다(장기적으로는 혈전·뇌졸중 위험이 있습니다).","1":"심방조동과 심방세동은 심방의 문제입니다. 심방 수축이 사라지더라도 심실은 계속 박출하므로 즉시 치명적이지는 않습니다(장기적으로는 혈전·뇌졸중 위험이 있습니다).","2":"심실빈맥은 위험하고 심실세동으로 넘어갈 수 있습니다. 하지만 아직 박출이 어느 정도 유지되는 경우가 많아 심실세동보다는 덜 치명적입니다.","3":"동성리듬은 **정상** 리듬입니다."},"one":"가장 생명을 위협하는 부정맥은 심실세동(ventricular fibrillation)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q11) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-12":{"q":"Which of the following is a cholinergic response to stimulation of M receptors in the SA node of the heart by ACh as observed on an EKG?","o":["Missing P waves.","Decreased PR interval","Longer RR interval","Longer QT interval","Missing T waves"],"a":2,"qk":"ACh가 동방결절의 M 수용체를 자극했을 때 EKG에서 관찰되는 콜린성(cholinergic) 반응은 무엇입니까?","ok":["P파 소실","PR 간격 감소","RR 간격 증가","QT 간격 증가","T파 소실"],"exp":"**정답 이유**\n\nACh가 M₂ 수용체에 결합하면 KACₕ 채널이 열려 4기 기울기가 완만해집니다. 그래서 동방결절 발화가 느려지고, 방실결절의 지연 시간도 길어집니다. **RR 간격**은 한 심박의 R파에서 다음 심박의 R파까지의 시간입니다. 심박수가 느려지면 RR 간격이 **길어집니다**. (심박수 = 60 / RR간격(초))","why":{"0":"P파는 심방 탈분극이므로, 느려지더라도 동방결절 흥분이 있으면 나타납니다.","1":"ACh는 방실결절 전도를 늦추므로 PR 간격이 **증가**하는 쪽입니다.","3":"QT 간격은 심박수가 느리면 약간 길어질 수는 있습니다. 하지만 동방결절 M 수용체 자극의 직접적이고 대표적인 소견은 RR 간격 증가입니다.","4":"T파(심실 재분극)는 소실되지 않습니다."},"one":"ACh가 동방결절 M 수용체를 자극하면 심박수가 느려져 EKG에서 RR 간격이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q12) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 56","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32"},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-13":{"q":"James is a 58-yr-old with a history of cigarette smoking and two myocardial infarctions. A routine EKG shows that the mean electrical axis of his heart is shifted toward the left of normal. What does this indicate?","o":["A first degree conduction block","Right ventricular hypertrophy","Left ventricular hypertrophy","Ectopic pacemakers","Third degree heart block"],"a":2,"qk":"James는 흡연력과 두 번의 심근경색(myocardial infarction) 병력이 있는 58세 남성입니다. 정기 EKG에서 심장의 평균 전기축(mean electrical axis)이 정상보다 왼쪽으로 치우쳐 있습니다. 이것은 무엇을 의미합니까?","ok":["1도 전도차단(first degree conduction block)","우심실 비대(right ventricular hypertrophy)","좌심실 비대(left ventricular hypertrophy)","이소성 박동조율기(ectopic pacemakers)","3도 방실차단(third degree heart block)"],"exp":"**정답 이유**\n\n평균 전기축은 심실 탈분극 전류가 전체적으로 향하는 방향입니다. 심근이 **두꺼운 쪽으로** 전류가 더 많이 흐르므로 축이 그쪽으로 기웁니다. 좌심실이 비대해지면 축이 **왼쪽으로 치우칩니다(좌축편위 left axis deviation)**. 이 환자는 심근경색과 흡연력(고혈압·관상동맥질환 위험)이 있어, 남은 좌심실 근육이 더 큰 부담을 견디며 두꺼워졌다고 보는 것이 자연스럽습니다.","why":{"0":"1도 차단은 PR 간격 연장으로 나타납니다. 축과는 관계없습니다.","1":"우심실 비대는 축을 **오른쪽**으로 치우치게 합니다.","3":"이소성 박동조율기는 비정상 위치에서 생기는 박동(조기수축 등)으로, 평균축이 지속적으로 왼쪽으로 치우치는 것과는 다릅니다.","4":"3도 차단은 P파와 QRS가 완전히 따로 뛰는 해리 현상입니다. 축 편위가 핵심 소견이 아닙니다."},"one":"평균 전기축의 좌측 편위는 좌심실 비대(left ventricular hypertrophy)를 시사한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q13) / 9b. Cardiovascular Physiology 2026.pdf, slide 33","img":[{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-14":{"q":"What cardiac arrhythmia is best illustrated by the EKG tracing shown on the right?","o":["Tachycardia.","Atrial fibrillation","Bradycardia.","Ventricular fibrillation","Third degree heart block"],"a":3,"qk":"오른쪽에 제시된 EKG 기록이 가장 잘 보여주는 부정맥은 무엇입니까?","ok":["빈맥(tachycardia)","심방세동(atrial fibrillation)","서맥(bradycardia)","심실세동(ventricular fibrillation)","3도 방실차단(third degree heart block)"],"exp":"**정답 이유**\n\n그림을 보면 **P파, QRS 복합파, T파를 전혀 구별할 수 없습니다**. 크기와 모양, 간격이 제각각인 불규칙한 파형만 계속 이어집니다. 심실 근육이 조율 없이 무질서하게 떨고 있다는 뜻이며, 이것이 심실세동의 전형적인 모습입니다. EKG는 파형의 모양과 간격으로 해석합니다.","why":{"0":"빈맥이라면 모양이 일정한 QRS가 빠르게 반복되어야 합니다.","1":"심방세동에서는 기저선이 잔물결처럼 떨리면서도, 좁은 **QRS 복합파는 뚜렷하게 보입니다**(간격만 불규칙합니다).","2":"서맥은 정상 모양의 파형이 느리게 나타나는 것입니다.","4":"3도 차단에서는 P파와 QRS가 각각 규칙적으로 나타나되 서로 관계가 없습니다. 파형 자체는 알아볼 수 있습니다."},"one":"P파·QRS·T파를 구별할 수 없는 불규칙한 파형은 심실세동의 전형적인 EKG이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q14) / 9b. Cardiovascular Physiology 2026.pdf, slides 42, 46","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42"},{"u":"img/w11_cv_phys/p46.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 46"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-15":{"q":"What physical finding would occur rapidly following initiation of the EKG pattern shown in question 14?","o":["A rapid, weak pulse","A seizure","A stroke","A sharp decline in blood pressure","Tachycardia"],"a":3,"qk":"14번 문제의 EKG 패턴이 시작된 직후 빠르게 나타나는 신체 소견은 무엇입니까?","ok":["빠르고 약한 맥박","발작(seizure)","뇌졸중(stroke)","혈압의 급격한 하강","빈맥(tachycardia)"],"exp":"**정답 이유**\n\n심실세동에서는 심실이 혈액을 박출하지 못합니다. 그래서 심박출량(cardiac output) = 심박수 × 일회박출량이 사실상 0이 되고, **혈압이 급격히 떨어집니다**. 맥박이 잡히지 않고, 수 초 안에 의식을 잃습니다.","why":{"0":"심실세동에서는 박출이 없으므로 맥박 자체가 **없습니다**(Q17 E \"no pulse\"). 빠르고 약한 맥박은 출혈성 쇼크 같은 상황의 소견입니다.","1":"뇌 혈류 중단으로 경련 같은 움직임이 나중에 생길 수는 있습니다. 하지만 가장 먼저, 빠르게 나타나는 핵심 소견은 혈압 하강입니다.","2":"뇌졸중은 주로 혈전 등으로 생기며 심방세동의 장기 합병증에 가깝습니다.","4":"빈맥은 EKG 리듬의 이름이지, 심실세동 후의 신체 소견이 아닙니다. 심실세동은 효과적인 심박 자체가 없습니다."},"one":"심실세동이 시작되면 박출이 없어 혈압이 급격히 하강한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q15) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-16":{"q":"Which of the following is true about the cardiac cycle?","o":["High heart rates allow for increased EDV.","QRS complexes follow P waves on the EKG.","Increased cardiac contractility reduces cardiac output.","Stroke volume is independent of ventricular filling time.","Systolic pressure is highest in the right ventricle."],"a":1,"qk":"심장주기(cardiac cycle)에 대해 옳은 것은 무엇입니까?","ok":["빠른 심박수는 EDV(이완기말 용적) 증가를 허용한다.","EKG에서 QRS 복합파는 P파 뒤에 온다.","심장 수축력 증가는 심박출량을 감소시킨다.","일회박출량은 심실 충만 시간과 무관하다.","수축기압은 우심실에서 가장 높다."],"exp":"**정답 이유**\n\n정상 순서는 다음과 같습니다. 동방결절 흥분 → 심방 탈분극(P파) → 방실결절 지연 → 심실 탈분극(QRS) → 심실 재분극(T파). 따라서 **QRS는 항상 P파 다음**에 옵니다. 심방 수축(P파 뒤)이 먼저 혈액을 밀어 넣어 EDV를 채운 뒤, 심실이 수축(QRS 뒤)하는 순서입니다.","why":{"0":"심박수가 빠르면 이완기(충만 시간)가 짧아져 EDV가 **감소**합니다.","2":"수축력이 증가하면 ESV가 줄어 일회박출량과 심박출량이 **증가**합니다.","3":"충만 시간이 길면 EDV가 늘고, 프랭크-스탈링 법칙(Frank-Starling law)에 따라 일회박출량도 늡니다. 따라서 무관하지 않습니다.","4":"수축기압은 **좌심실**에서 가장 높습니다(약 120 vs 25 mmHg)."},"one":"심장주기에서 QRS 복합파는 항상 심방 탈분극인 P파 뒤에 온다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q16) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 49","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32"},{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-17":{"q":"Which cardiac arrhythmia is correctly matched with its effect on cardiac function?","o":["Atrial flutter: increased preload","Atrial fibrillation: increased afterload","Ventricular tachycardia: cardiac arrest","Mobitz 2 conduction block: increased cardiac output","Ventricular fibrillation: no pulse"],"a":4,"qk":"부정맥과 그것이 심장 기능에 미치는 효과가 올바르게 짝지어진 것은 무엇입니까?","ok":["심방조동: 전부하(preload) 증가","심방세동: 후부하(afterload) 증가","심실빈맥: 심정지(cardiac arrest)","Mobitz 2형 전도차단: 심박출량 증가","심실세동: 맥박 없음(no pulse)"],"exp":"**정답 이유**\n\n심실세동은 심실이 무질서하게 떨 뿐 박출이 없으므로 **맥박이 없습니다**. 짝이 정확합니다 (Q11·14·15와 같은 원리).","why":{"0":"심방조동에서는 효과적인 심방 수축이 없고 빠른 심박으로 충만 시간도 줄어듭니다. 그래서 전부하(EDV)가 오히려 **감소**하는 쪽입니다.","1":"후부하는 동맥압(대동맥압)으로 정해집니다. 심방세동은 후부하를 높이지 않습니다.","2":"심실빈맥은 심정지로 진행할 **수는** 있습니다. 하지만 항상 심정지를 뜻하는 것은 아니어서, E만큼 확정적인 짝이 아닙니다.","3":"Mobitz 2형은 일부 심방 흥분이 심실로 전달되지 않아 심실 박동이 빠지는 차단입니다. 심박출량은 **감소**합니다."},"one":"심실세동은 효과적인 박출이 없으므로 맥박이 없다(no pulse).","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q17) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-18":{"q":"The normal response of baroreceptors to an abrupt increase in blood pressure is","o":["a decrease in sensitivity.","an increase in sensitivity.","an increase in firing rate.","a decrease in firing rate.","nothing since baroreceptors do not monitor blood pressure."],"a":2,"qk":"혈압이 갑자기 상승할 때 압수용체(baroreceptors)의 정상 반응은 무엇입니까?","ok":["민감도 감소","민감도 증가","발화율(firing rate) 증가","발화율 감소","압수용체는 혈압을 감시하지 않으므로 아무 반응도 없다."],"exp":"**정답 이유**\n\n경동맥동(carotid sinus)과 대동맥궁(aortic arch)의 고압 압수용체는 **신장수용체(stretch receptors)**입니다. 혈압이 오르면 혈관벽이 더 늘어나므로 **발화율이 증가**합니다. 신호는 연수의 고립로핵(nucleus tractus solitarius, NTS)으로 갑니다. 그러면 교감신경 활동은 줄고 부교감신경 활동은 늘어 심박수와 혈관저항이 떨어지고, 혈압이 다시 내려옵니다.","why":{"0":"\"민감도\"는 수용체가 반응하는 기준(설정점) 자체를 뜻합니다. 급격한 혈압 변화에 대한 즉각 반응은 민감도 변화가 아니라 발화율 변화입니다. (만성 고혈압에서는 설정점이 재조정 resetting되지만, 이 문제와는 다릅니다.)","1":"\"민감도\"는 수용체가 반응하는 기준(설정점) 자체를 뜻합니다. 급격한 혈압 변화에 대한 즉각 반응은 민감도 변화가 아니라 발화율 변화입니다. (만성 고혈압에서는 설정점이 재조정 resetting되지만, 이 문제와는 다릅니다.)","3":"발화율 감소는 혈압이 **떨어질** 때의 반응입니다.","4":"압수용체는 바로 혈압(평균 동맥압)을 감지하는 수용체입니다."},"one":"혈압이 갑자기 오르면 압수용체(신장수용체)의 발화율이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q18) / 9b. Cardiovascular Physiology 2026.pdf, slides 62, 63","img":[{"u":"img/w11_cv_phys/p62.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 62"},{"u":"img/w11_cv_phys/p63.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 63"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-19":{"q":"Which of the following contributes to the regulation of mean arterial blood pressure?","o":["Baroreceptor firing rate.","Activation of RAAS.","Effects of aldosterone.","Changes in TPR.","All of the above."],"a":4,"qk":"다음 중 평균 동맥압(mean arterial blood pressure) 조절에 기여하는 것은 무엇입니까?","ok":["압수용체 발화율","RAAS(레닌-안지오텐신-알도스테론계) 활성화","알도스테론(aldosterone)의 효과","총말초저항(TPR)의 변화","위의 모두"],"exp":"**정답 이유**\n\n· A 압수용체 발화율: 초 단위의 **단기** 조절을 담당합니다.\n\n· B RAAS 활성화와 C 알도스테론: 소변으로 나가는 물과 Na⁺를 조절하는 **장기** 조절입니다. 알도스테론은 신장에서 Na⁺ 재흡수를 늘려 혈액량을 늘립니다.\n\n· D TPR: 평균 동맥압 ≈ 심박출량 × 총말초저항이므로 TPR은 동맥압을 직접 결정합니다.\n\n네 가지 모두 평균 동맥압 조절에 기여하므로 정답은 **E (위의 모두)**입니다.","why":{"0":"압수용체 발화율은 초 단위의 단기 조절에 기여하지만, 그것만으로는 불완전합니다. RAAS·알도스테론·TPR도 함께 평균 동맥압을 조절하므로 정답은 E(위의 모두)입니다.","1":"RAAS 활성화는 장기 조절에 기여하지만, 압수용체·알도스테론·TPR도 함께 관여하므로 정답은 E입니다.","2":"알도스테론은 신장에서 Na⁺ 재흡수를 늘려 혈액량을 늘리는 장기 조절 인자이지만, 이것만 고르면 불완전합니다. 정답은 E입니다.","3":"총말초저항(TPR)은 평균 동맥압 ≈ 심박출량 × TPR이므로 직접 기여하지만, 다른 기전도 모두 기여하므로 정답은 E입니다."},"one":"압수용체 발화, RAAS·알도스테론, 총말초저항(TPR) 변화가 모두 평균 동맥압 조절에 기여한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q19) / 9b. Cardiovascular Physiology 2026.pdf, slides 61, 65","img":[{"u":"img/w11_cv_phys/p61.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 61"},{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-20":{"q":"Which mechanism in the regulation of blood pressure has the potential to be the most effective over time?","o":["Stress relaxation.","Vasomotor changes.","Altered cardiac output.","Renal handling of salt and water.","Autonomic responses."],"a":3,"qk":"혈압 조절 기전 중 시간이 지남에 따라 가장 효과적일 수 있는 것은 무엇입니까?","ok":["응력 이완(stress relaxation)","혈관운동 변화(vasomotor changes)","심박출량 변화","신장의 염분과 수분 처리(renal handling of salt and water)","자율신경 반응"],"exp":"**정답 이유**\n\n\"평균 동맥압의 **장기 조절**은 소변으로 나가는 물과 Na⁺의 손실을 조절하는 것으로 이루어집니다. 이는 RAA계, 아르기닌 바소프레신(arginine vasopressin), 심방나트륨이뇨펩타이드(atrial natriuretic peptide)의 작용을 통해 일어납니다\". 신장은 혈압이 정상으로 돌아올 때까지 염분과 수분 배설을 계속 조절합니다. 그래서 시간이 충분하면 혈압을 정상으로 되돌릴 수 있는 사실상 무한한 능력을 가집니다.","why":{"0":"응력 이완은 혈관이 늘어난 뒤 서서히 긴장을 풀어 압력을 줄이는 현상입니다. 효과가 제한적이고 일시적입니다.","1":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다.","2":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다.","4":"혈관운동 변화, 심박출량 변화, 자율신경 반응은 초~분 단위의 **단기** 조절입니다. 빠르지만 압수용체가 며칠 만에 재설정되므로 장기적으로는 효과가 줄어듭니다."},"one":"시간이 지남에 따라 가장 효과적인 혈압 조절은 신장의 염분과 수분 처리이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q20) / 9b. Cardiovascular Physiology 2026.pdf, slide 65","img":[{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 65"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-21":{"q":"Cardiac glycosides inhibit Na+- K+ ATPase in cardiac myocytes. How does this affect cardiac function?","o":["It decreases cardiac contractility.","It increases cardiac contractility.","It slows spontaneous depolarization of the S-A node.","It reduces blood flow through coronary arteries.","It increases blood flow through coronary arteries."],"a":1,"qk":"강심배당체(cardiac glycosides)는 심근세포의 Na⁺-K⁺ ATPase를 억제합니다. 이것이 심장 기능에 어떤 영향을 줍니까?","ok":["심장 수축력(contractility)을 감소시킨다.","심장 수축력을 증가시킨다.","동방결절의 자발적 탈분극을 늦춘다.","관상동맥 혈류를 감소시킨다.","관상동맥 혈류를 증가시킨다."],"exp":"**정답 이유**\n\n연쇄 반응으로 이해하시면 쉽습니다.\n\n① 디곡신(digoxin) 같은 강심배당체가 Na⁺-K⁺ ATPase를 억제합니다.\n\n② 세포 안 Na⁺가 쌓입니다.\n\n③ 세포 안팎의 Na⁺ 농도 차이가 줄어 Na⁺-Ca²⁺ 교환체(exchanger)가 Ca²⁺를 잘 내보내지 못합니다(\"indirectly inhibiting Na⁺-Ca²⁺ exchange\").\n\n④ 세포 안 Ca²⁺가 늘고 근소포체(SR)에 더 많이 저장됩니다.\n\n⑤ 다음 수축 때 Ca²⁺가 더 많이 방출되어 **수축력이 증가**합니다.","why":{"0":"정반대입니다. 강심배당체는 심부전 치료에 쓰는 수축력 강화제입니다.","2":"디곡신은 미주신경 작용을 통해 방실결절 전도를 늦추는 부가 효과가 있습니다(일반 약리 지식). 하지만 질문이 묻는 Na⁺-K⁺ ATPase 억제의 핵심 효과는 수축력 증가입니다.","3":"관상동맥 혈류를 직접 조절하는 약이 아닙니다. 관상동맥 확장제(coronary vessel dilators)는 따로 있습니다.","4":"관상동맥 혈류를 직접 조절하는 약이 아닙니다. 관상동맥 확장제(coronary vessel dilators)는 따로 있습니다."},"one":"강심배당체의 Na⁺-K⁺ ATPase 억제는 세포 안 Ca²⁺를 늘려 심장 수축력을 증가시킨다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q21) / 9b. Cardiovascular Physiology 2026.pdf, slide 48","img":[{"u":"img/w11_cv_phys/p48.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 48"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-22":{"q":"What receptor is stimulated by adrenergic agents in the heart?","o":["α1","α2","β1","β2","M1."],"a":2,"qk":"심장에서 아드레날린성 약물(adrenergic agents)에 의해 자극되는 수용체는 무엇입니까?","ok":["α₁","α₂","β₁","β₂","M₁"],"exp":"**정답 이유**\n\n\"교감신경 작용은 **심장의 β₁ 수용체**와 혈관의 α₁, β₂ 수용체 자극에 의해 일어납니다\". 심장의 β₁ 자극은 심박수 증가(4기 기울기 ↑), 수축력 증가(L형 Ca²⁺ 채널 인산화), 전도 속도 증가를 일으킵니다. 외우는 법: \"심장은 하나(1)라서 β**1**, 폐는 둘(2)이라서 β**2**\"라고 기억하시면 됩니다.","why":{"0":"α₁: 주로 **혈관** 평활근 수축(피부·신장 혈관 수축)에 작용합니다.","1":"α₂: 주로 신경 말단의 시냅스전 억제 수용체입니다.","3":"β₂: **혈관**(골격근 세동맥 확장)과 기관지 평활근 이완에 작용합니다.","4":"M 수용체는 아드레날린성이 아니라 **콜린성(ACh)** 수용체입니다. 심장에 있는 것도 M₁이 아니라 M₂입니다."},"one":"심장에서 아드레날린성 약물이 자극하는 수용체는 β₁이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q22) / 9b. Cardiovascular Physiology 2026.pdf, slides 56, 64","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56"},{"u":"img/w11_cv_phys/p64.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 64"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-23":{"q":"Which of the following events in the cardiac cycle correctly corresponds to time points in the pressure tracing shown below?","o":["Isovolumetric contraction occurs between B and C.","Aortic valve closes at C.","Isovolumetric relaxation occurs between B and C.","Aortic valve closes at B.","Mitral valve closes at E."],"a":0,"qk":"아래 압력 곡선의 시점들과 심장주기의 사건이 올바르게 대응하는 것은 무엇입니까?","ok":["등용적 수축(isovolumetric contraction)은 B와 C 사이에 일어난다.","대동맥판(aortic valve)은 C에서 닫힌다.","등용적 이완(isovolumetric relaxation)은 B와 C 사이에 일어난다.","대동맥판은 B에서 닫힌다.","승모판(mitral valve)은 E에서 닫힌다."],"exp":"**그림 읽기 **\n\n· A: 심방 수축으로 생긴 작은 언덕(a파)\n\n· **B**: 심실압이 심방압보다 높아지는 지점 → **방실판(승모판) 닫힘**, S1\n\n· **C**: 심실압이 대동맥압보다 높아지는 지점 → **대동맥판 열림**, 박출 시작\n\n· D: 심실압 최고점\n\n· **E**: 심실압이 대동맥압보다 낮아지는 지점 → **대동맥판 닫힘**, S2(대동맥 곡선의 작은 패임 dicrotic notch)\n\n· **F**: 심실압이 심방압보다 낮아지는 지점 → **승모판 열림**, 충만 시작\n\n**정답 이유**\n\nB(승모판 닫힘)부터 C(대동맥판 열림)까지는 **모든 판막이 닫힌 채** 심실압만 급격히 오릅니다. 이것이 등용적 수축(isovolumetric contraction)입니다.","why":{"1":"대동맥판은 C에서 **열립니다**.","2":"등용적 이완은 E(대동맥판 닫힘)부터 F(승모판 열림) 사이입니다.","3":"B에서 닫히는 것은 대동맥판이 아니라 승모판입니다.","4":"E에서 닫히는 것은 대동맥판입니다. 승모판은 B에서 닫히고 F에서 열립니다."},"one":"등용적 수축은 승모판이 닫히는 B와 대동맥판이 열리는 C 사이에서 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q23) / 9b. Cardiovascular Physiology 2026.pdf, slides 49, 51","img":[{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49"},{"u":"img/w11_cv_phys/p51.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 51"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pressure.webp","cap":"Cardiac cycle pressure tracing (9a Study Q23)"}},"w11_cv_phys-24":{"q":"Which of the following has the greatest effect on blood flow through arterioles?","o":["The pressure gradient between the right and left ventricles.","The contractility of the ventricles.","Venous return.","The viscosity of the blood.","The diameter of the arterioles."],"a":4,"qk":"세동맥(arterioles)을 통과하는 혈류에 가장 큰 영향을 주는 것은 무엇입니까?","ok":["좌·우 심실 사이의 압력 차이","심실의 수축력","정맥 환류(venous return)","혈액의 점도(viscosity)","세동맥의 지름(diameter)"],"exp":"**정답 이유**\n\n혈류 = 압력 차이(ΔP) / 저항(R)이고, 저항은 혈관 길이와 점도에 비례하며 **반지름의 4제곱에 반비례**합니다. 지름이 절반이 되면 저항은 2⁴ = 16배가 되어 혈류가 1/16로 줄어듭니다. 지름이 아주 조금만 변해도 혈류가 엄청나게 변하므로, 세동맥의 지름(평활근 수축·이완)이 혈류를 가장 크게 좌우합니다. 그래서 세동맥을 \"저항 혈관\"이라고 부릅니다.","why":{"0":"좌·우 심실 사이의 압력 차이는 세동맥 양 끝의 압력 차이(구동압 driving pressure)가 아닙니다. 혈류와 무관합니다.","1":"수축력과 정맥 환류는 전체 심박출량에 영향을 줍니다. 하지만 개별 세동맥의 혈류 분배는 그 세동맥의 지름이 결정합니다.","2":"수축력과 정맥 환류는 전체 심박출량에 영향을 줍니다. 하지만 개별 세동맥의 혈류 분배는 그 세동맥의 지름이 결정합니다.","3":"점도도 저항에 영향을 주지만 1제곱(비례)의 영향입니다. 반지름의 4제곱보다 훨씬 작고, 정상에서는 거의 변하지 않습니다."},"one":"세동맥 혈류에 가장 큰 영향을 주는 것은 반지름의 4제곱에 반비례하는 세동맥의 지름이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q24) / 9b. Cardiovascular Physiology 2026.pdf, slides 5, 8","img":[{"u":"img/w11_cv_phys/p05.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 5"},{"u":"img/w11_cv_phys/p08.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 8"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-25":{"q":"Isovolumic contraction occurs between which points on the loop?","o":["1 and 2","4 and 1","2 and 3","3 and 4"],"a":0,"qk":"루프(loop)의 어느 점들 사이에서 등용적 수축(isovolumic contraction)이 일어납니까?","ok":["1과 2","4와 1","2와 3","3과 4"],"exp":"**압력-용적 고리 읽기 – Q25–27 공통**\n\n고리는 반시계 방향으로 돕니다(화살표 방향).\n\n· **점 1**(약 140 mL, 낮은 압력): 이완기말(EDV). **승모판 닫힘**\n\n· **1 → 2**: 부피는 140 mL 그대로, 압력만 급상승 → **등용적 수축**\n\n· **점 2**(약 80 mmHg): **대동맥판 열림**\n\n· **2 → 3**: 부피가 140 → 70 mL로 감소, 압력은 최고점을 지남 → **박출(ejection)**\n\n· **점 3**: 수축기말(ESV). **대동맥판 닫힘**\n\n· **3 → 4**: 부피는 70 mL 그대로, 압력만 급하강 → **등용적 이완**\n\n· **점 4**: **승모판 열림**\n\n· **4 → 1**: 압력은 낮은 채 부피가 증가 → **충만(filling)**\n\n일회박출량 = EDV − ESV = 140 − 70 = 약 70 mL입니다.\n\n**정답 이유**\n\n등용적 수축은 \"부피 변화 없이 압력만 오르는\" 구간, 즉 그래프에서 **수직으로 올라가는 오른쪽 선(1 → 2)**입니다.","why":{"1":"4 → 1: 충만기입니다.","2":"2 → 3: 박출기입니다.","3":"3 → 4: 수직으로 내려가는 선으로, 등용적 **이완**입니다."},"one":"압력-용적 고리에서 등용적 수축은 점 1과 점 2 사이(부피 없이 압력만 상승)에서 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q25) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53"},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-26":{"q":"Which of the following normally occurs between points 2 and 3?","o":["Developed afterload","Energy transfer to the wall of the aorta.","A decrease in left ventricular volume.","Ejection of blood into the aorta.","Each of the above."],"a":4,"qk":"정상적으로 점 2와 3 사이에서 일어나는 것은 무엇입니까?","ok":["발생된 후부하(developed afterload)","대동맥 벽으로의 에너지 전달","좌심실 용적의 감소","대동맥으로의 혈액 박출","위의 각각(each of the above)"],"exp":"**정답 이유**\n\n2 → 3은 대동맥판이 열려 있는 **박출기**입니다 (Q25 그림 설명 참조). 이 구간에서는 네 가지가 모두 일어납니다.\n\n· A 심실은 대동맥압이라는 **후부하(afterload)**를 이기며 혈액을 밀어냅니다.\n\n· B 박출된 혈액이 탄력 있는 대동맥 벽을 늘려 에너지를 저장시킵니다. 이 에너지가 이완기 동안 혈류를 계속 밀어줍니다.\n\n· C 혈액이 빠져나가므로 좌심실 부피가 140 → 70 mL로 **감소**합니다(그래프에서 왼쪽으로 이동).\n\n· D 대동맥으로 혈액이 **박출**됩니다.\n\n따라서 정답은 **E (위의 각각)**입니다.","why":{"0":"점 2와 3 사이는 박출기이므로, 심실은 대동맥압이라는 후부하(afterload)를 이기며 혈액을 밀어냅니다. 이것만 일어난 것이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","1":"박출된 혈액이 탄력 있는 대동맥 벽을 늘려 에너지를 저장합니다. 이것만의 사건이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","2":"혈액이 빠져나가 좌심실 용적이 감소합니다(그래프에서 왼쪽 이동). 이것만이 아니라 A–D가 모두 일어나므로 정답은 E입니다.","3":"대동맥으로 혈액이 박출됩니다. 이것만이 아니라 A–D가 모두 일어나므로 정답은 E입니다."},"one":"점 2와 3 사이는 박출기로, 후부하·대동맥 벽 에너지 전달·좌심실 용적 감소·대동맥 박출이 모두 일어난다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q26) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53"},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-27":{"q":"The aortic valve normally closes at which point on the loop?","o":["1","2","3","4"],"a":2,"qk":"대동맥판은 정상적으로 루프의 어느 점에서 닫힙니까?","ok":["1","2","3","4"],"exp":"**정답 이유**\n\n박출(2 → 3)이 끝나는 **점 3**에서 심실압이 대동맥압 아래로 떨어지며 대동맥판이 닫힙니다(S2). 이후 3 → 4의 등용적 이완이 시작됩니다. 점 3의 부피가 수축기말 용적(ESV)입니다.","why":{"0":"점 1: 승모판이 **닫히는** 점입니다(S1, 등용적 수축 시작).","1":"점 2: 대동맥판이 **열리는** 점입니다.","3":"점 4: 승모판이 **열리는** 점입니다(충만 시작). 외우는 법: 고리의 네 모서리는 판막 사건 4개(1 승모판 닫힘 → 2 대동맥판 열림 → 3 대동맥판 닫힘 → 4 승모판 열림)입니다."},"one":"대동맥판은 박출이 끝나는 점 3에서 닫힌다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q27) / 9b. Cardiovascular Physiology 2026.pdf, slides 53, 54","img":[{"u":"img/w11_cv_phys/p53.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 53"},{"u":"img/w11_cv_phys/p54.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 54"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_pvloop.webp","cap":"Left ventricular pressure-volume loop (9a Study Q25–27)"}},"w11_cv_phys-28":{"q":"What is the effect of increased filling time on ventricular function?","o":["A decrease in cardiac output.","A decrease in end-diastolic volume.","A decrease in end-systolic volume.","An increase in end-diastolic volume.","An increase in end-systolic volume."],"a":3,"qk":"충만 시간(filling time)이 증가하면 심실 기능에 어떤 영향이 있습니까?","ok":["심박출량 감소","이완기말 용적(EDV) 감소","수축기말 용적(ESV) 감소","이완기말 용적(EDV) 증가","수축기말 용적(ESV) 증가"],"exp":"**정답 이유**\n\n\"충만 압력, **충만 시간**, 심실 순응도가 증가하면 EDV가 증가합니다\". 심실이 혈액을 받을 시간이 길어지면 더 많이 채워지는 것은 당연합니다. 심박수가 느려질 때가 대표적인 예입니다. 그리고 프랭크-스탈링 법칙에 따라 EDV가 늘면 일회박출량도 늡니다.","why":{"0":"EDV가 늘면 일회박출량이 늘어납니다. 따라서 충만 시간 증가 자체가 심박출량 감소를 일으킨다고 할 수 없습니다.","1":"EDV는 감소가 아니라 증가합니다.","2":"ESV는 전부하, 후부하, 심박수, 수축력이 함께 결정합니다. 충만 시간의 직접적이고 대표적인 효과는 EDV 증가입니다.","4":"ESV는 전부하, 후부하, 심박수, 수축력이 함께 결정합니다. 충만 시간의 직접적이고 대표적인 효과는 EDV 증가입니다."},"one":"충만 시간이 증가하면 이완기말 용적(EDV)이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q28) / 9b. Cardiovascular Physiology 2026.pdf, slide 57","img":[{"u":"img/w11_cv_phys/p57.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 57"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-29":{"q":"A patient with long-standing coronary artery disease also has advanced CHF. What physical findings are most likely to be present in this patient?","o":["Exercise intolerance.","Swelling of the ankles.","A shift in the location of the apical beat toward the left on the chest.","An enlarged heart.","Each of the above"],"a":4,"qk":"오래된 관상동맥질환이 있는 환자가 진행된 울혈성 심부전(CHF)도 가지고 있습니다. 이 환자에서 나타날 가능성이 가장 높은 신체 소견은 무엇입니까?","ok":["운동 불내성(exercise intolerance)","발목 부종(swelling of the ankles)","심첨 박동(apical beat) 위치가 가슴에서 왼쪽으로 이동","심장 비대(enlarged heart)","위의 각각"],"exp":"**정답 이유**\n\n· A 운동 불내성: 손상된 심장은 운동 때 심박출량을 충분히 늘리지 못합니다. 심기능곡선이 아래로 내려가 있기 때문입니다.\n\n· B 발목 부종: 우심부전에서는 정맥압이 올라 전신 모세혈관 여과가 늘어 **부종(edema)**이 생깁니다. 중력 때문에 발목에 잘 생깁니다.\n\n· C·D 심장 비대와 심첨 박동 이동: 만성 심부전에서는 혈액량이 늘고 심실이 늘어나 **심장이 커집니다**. 커진 좌심실 때문에 심첨 박동(가장 강하게 뛰는 곳)이 정상 위치(왼쪽 5번째 늑간, 쇄골중앙선)보다 더 왼쪽 아래로 이동합니다.\n\n네 가지 모두 진행된 CHF에서 볼 수 있으므로 정답은 **E**입니다.","why":{"0":"운동 불내성은 손상된 심장이 운동 때 심박출량을 충분히 늘리지 못해 나타납니다. 진행된 CHF에서는 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","1":"우심부전에서 정맥압이 올라 전신 모세혈관 여과가 늘어 발목 부종이 잘 생깁니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","2":"커진 좌심실 때문에 심첨 박동이 정상보다 왼쪽 아래로 이동합니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다.","3":"만성 심부전에서는 혈액량이 늘고 심실이 늘어나 심장이 커집니다. 이것만이 아니라 A–D가 모두 나타날 수 있으므로 정답은 E입니다."},"one":"진행된 울혈성 심부전에서는 운동 불내성, 발목 부종, 심첨 박동 좌측 이동, 심장 비대가 모두 나타날 수 있다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q29) / 9b. Cardiovascular Physiology 2026.pdf, slide 79","img":[{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-30":{"q":"Stroke volume of the heart is defined as","o":["cardiac output plus end-systolic volume.","cardiac output minus end-diastolic volume.","end-diastolic volume minus end-systolic volume.","end-systolic volume minus end-diastolic volume.","heart rate times mean arterial pressure."],"a":2,"qk":"심장의 일회박출량(stroke volume)의 정의는 무엇입니까?","ok":["심박출량 더하기 수축기말 용적","심박출량 빼기 이완기말 용적","이완기말 용적 빼기 수축기말 용적","수축기말 용적 빼기 이완기말 용적","심박수 곱하기 평균 동맥압"],"exp":"**정답 이유**\n\n\"일회박출량은 **이완기말 용적(EDV)과 수축기말 용적(ESV)의 차이**입니다\". 심실이 가득 찼을 때의 양(EDV)에서 수축 후 남은 양(ESV)을 빼면 한 번에 뿜어낸 양이 됩니다. Q25 고리 예시로 계산하면 140 − 70 = 70 mL입니다. 관련 공식은 다음과 같습니다.\n\n· 심박출량(CO) = 심박수 × 일회박출량 (약 5 L/min)\n\n· 박출률(ejection fraction) = 일회박출량 / EDV","why":{"0":"심박출량(L/min)과 용적(mL)은 단위부터 다르므로 더하거나 뺄 수 없습니다.","1":"심박출량(L/min)과 용적(mL)은 단위부터 다르므로 더하거나 뺄 수 없습니다.","3":"순서가 반대라 음수가 나옵니다.","4":"의미 없는 조합입니다. 평균 동맥압 ≈ 심박출량 × 총말초저항이라는 공식과 헷갈리게 만든 보기입니다."},"one":"일회박출량(stroke volume)은 이완기말 용적에서 수축기말 용적을 뺀 값이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q30) / 9b. Cardiovascular Physiology 2026.pdf, slide 52","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-31":{"q":"The initial effect of a significant loss of blood prior to any compensatory action.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":0,"qk":"보상 작용이 일어나기 전, 상당한 출혈(significant loss of blood)의 초기 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n출혈로 혈액량이 줄면 평균 체충만압이 낮아집니다. 그래서 혈관기능곡선이 **평행하게 왼쪽**으로 이동합니다. 아직 보상(교감신경 활성) 전이므로 심장 자체는 그대로이고, 심기능곡선은 **정상 곡선**을 유지합니다. 정상 심기능곡선과 왼쪽으로 많이 이동한 혈관곡선의 교차점이 **a**입니다. 이 점에서 우심방압은 내려가고(약 1.5 → 0.5 mmHg) 심박출량도 감소합니다(약 5.4 → 4 L/min). 즉 \"정맥 환류가 줄어 → 전부하가 줄고 → 심박출량이 감소\"한 상태입니다.","why":{"1":"점 b는 출혈에 대한 보상 반응입니다. 심기능곡선이 위로 올라가고 혈관곡선이 a보다 조금 오른쪽으로 돌아오며 심박출량이 거의 정상으로 회복된 교차점입니다.","2":"점 c는 격렬한 운동의 효과입니다. 심기능곡선이 위로, 혈관기능곡선이 오른쪽으로 이동해 심박출량이 가장 높습니다.","3":"점 d는 보상 전 심근경색의 효과로, 오른쪽 그래프에서 심기능곡선이 아래로 이동하고 혈관곡선은 정상인 교차점입니다.","4":"점 e는 울혈성 심부전에 대한 수분 저류 보상으로, 혈관곡선이 오른쪽으로 이동한 오른쪽 그래프의 교차점입니다."},"one":"보상 전 출혈의 초기 효과는 혈관기능곡선이 왼쪽으로 이동한 교차점 a이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q31) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60"},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76"},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-32":{"q":"Compensatory response to blood loss.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":1,"qk":"출혈에 대한 보상 반응(compensatory response).","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n10% 이상 출혈하면 압수용체 발화가 줄어 **교감신경 활동이 증가**하고 부교감신경 활동은 감소합니다. 그 결과 두 가지가 일어납니다.\n\n① 심장 수축력과 심박수가 늘어 심기능곡선이 **위로** 올라갑니다(회색 곡선).\n\n② 정맥 수축(venoconstriction)으로 저장 혈액이 동원되어 정맥 환류가 늘어납니다. 그래서 평균 체충만압이 일부 회복되고, 혈관곡선이 a의 곡선보다 **조금 오른쪽**(왼쪽 두 번째 점선)으로 돌아옵니다.\n\n이 두 곡선의 교차점이 **b**입니다. 우심방압은 여전히 낮지만(약 0.2 mmHg) 심박출량은 정상에 가깝게(약 5.4 L/min) 회복되었습니다. 보상 반응으로 심박출량이 다시 올라온 모습입니다.","why":{"0":"점 a는 보상 전 출혈의 초기 효과입니다. 심기능곡선은 정상이고 혈관기능곡선만 왼쪽으로 많이 이동해 심박출량이 감소한 상태입니다.","2":"점 c는 격렬한 운동의 효과입니다. 심박출량이 그림에서 가장 높은 교차점입니다.","3":"점 d는 보상 전 심근경색의 효과입니다(오른쪽 그래프, 심기능곡선 하향).","4":"점 e는 CHF에 대한 수분 저류 보상입니다(오른쪽 그래프, 혈관곡선 우측 이동)."},"one":"출혈에 대한 보상 반응은 심기능곡선이 위로 올라가고 혈관곡선이 일부 회복된 교차점 b이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q32) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 76, 77","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60"},{"u":"img/w11_cv_phys/p76.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 76"},{"u":"img/w11_cv_phys/p77.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 77"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-33":{"q":"Effect of strenuous exercise.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":2,"qk":"격렬한 운동(strenuous exercise)의 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n운동하면 심박출량이 크게 늘고, 심기능곡선은 **위로(반시계 방향) 이동**합니다. 교감신경이 심장 수축력과 심박수를 높이기 때문입니다. 동시에 수축하는 근육이 정맥을 쥐어짜고(근육 펌프 muscle pump) 정맥 수축으로 혈액이 동원되어 정맥 환류가 늘어납니다. 그래서 혈관곡선이 **오른쪽**으로 이동합니다. 위로 올라간 회색 심기능곡선과 오른쪽 점선 혈관곡선의 교차점 **c**에서 심박출량이 가장 높습니다(약 7.3 L/min). 그림 속 다섯 점 중 심박출량이 최대인 점이므로 운동에 해당합니다.","why":{"0":"점 a는 보상 전 출혈의 초기 효과로, 심박출량이 감소합니다. 운동처럼 심박출량이 최대가 아닙니다.","1":"점 b는 출혈에 대한 보상으로 심박출량이 정상에 가깝게 회복된 점이지, 운동으로 최대 심박출량이 된 점이 아닙니다.","3":"점 d는 보상 전 심근경색으로 심박출량이 떨어진 점입니다.","4":"점 e는 CHF 수분 저류 보상으로, 심박출량이 정상보다 낮고 우심방압이 높은 점입니다."},"one":"격렬한 운동은 심기능곡선이 위로, 혈관기능곡선이 오른쪽으로 이동한 교차점 c(최고 심박출량)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q33) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 73, 75","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60"},{"u":"img/w11_cv_phys/p73.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 73"},{"u":"img/w11_cv_phys/p75.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 75"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-34":{"q":"Effect of myocardial infarction before any compensatory response.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":3,"qk":"보상 반응이 일어나기 전, 심근경색(myocardial infarction)의 효과.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n\"심근이 손상되면 심장 수행능력이 감소하고 심기능곡선이 **아래로(시계 방향) 이동**합니다\". 보상 전이므로 혈액량과 혈관 상태는 그대로이고, 혈관기능곡선은 **정상**입니다. 가장 아래 심기능곡선과 정상 혈관곡선의 교차점이 **d**입니다. 이 점에서 심박출량은 떨어지고(약 5.4 → 3.2 L/min) 우심방압은 올라갑니다(약 1.5 → 3.7 mmHg). 심장이 혈액을 다 퍼내지 못해 심장 앞에 혈액이 쌓이기(울혈 congestion) 때문입니다.","why":{"0":"점 a는 출혈의 초기 효과입니다. 혈관곡선이 왼쪽으로 이동하고 심장은 아직 정상입니다. 심근경색은 심기능곡선이 아래로 이동합니다.","1":"점 b는 출혈에 대한 교감 보상이지, 심근 손상의 초기 효과가 아닙니다.","2":"점 c는 격렬한 운동으로 심박출량이 가장 높은 점입니다.","4":"점 e는 심근 손상 이후 수분 저류 보상이 일어난 점으로, 보상 전 교차점이 아닙니다."},"one":"보상 전 심근경색은 심기능곡선이 아래로 이동하고 혈관곡선은 정상인 교차점 d이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q34) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60"},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_cv_phys-35":{"q":"Increased fluid retention as a compensatory response to CHF.","o":["Point a (left graph)","Point b (left graph)","Point c (left graph)","Point d (right graph)","Point e (right graph)"],"a":4,"qk":"CHF(울혈성 심부전)에 대한 보상 반응으로서의 수분 저류(fluid retention) 증가.","ok":["점 a (왼쪽 그래프)","점 b (왼쪽 그래프)","점 c (왼쪽 그래프)","점 d (오른쪽 그래프)","점 e (오른쪽 그래프)"],"exp":"**그래프 읽는 법**\n\n· **심기능곡선(cardiac function curve)**: 왼쪽 아래에서 올라가 평평해지는 곡선입니다. 우심방압(PRA, 전부하)이 오를수록 심박출량이 늘어나는 프랭크-스탈링 관계를 보여줍니다. 수축력이 커지면 곡선이 **위로** 올라가고(반시계), 심근이 손상되면 **아래로** 내려갑니다(시계).\n· **혈관기능곡선(vascular function curve)**: 왼쪽 위에서 오른쪽 아래로 내려가는 직선입니다. 우심방압이 오를수록 정맥 환류가 줄어듭니다. x축과 만나는 점(정맥 환류 = 0)이 **평균 체충만압(mean systemic filling pressure)**이며, 혈액량과 혈관 순응도로 결정됩니다. 혈액량이 줄면 직선이 **평행하게 왼쪽**으로, 늘면 **오른쪽**으로 이동합니다.\n· 두 곡선이 만나는 **교차점**이 실제 심박출량(= 정맥 환류)과 우심방압입니다.\n\n**그림 속 점**\n**왼쪽 그래프**\n· **N**: 정상 심기능곡선 × 정상 혈관기능곡선 (PRA 약 1.5 mmHg, 심박출량 약 5.4 L/min)\n· **a**: 정상 심기능곡선 × 가장 왼쪽 점선 혈관곡선 (약 0.5 mmHg, 약 4 L/min)\n· **b**: 위로 올라간 회색 심기능곡선 × 왼쪽 두 번째 점선 혈관곡선 (약 0.2 mmHg, 약 5.4 L/min)\n· **c**: 위로 올라간 회색 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 1 mmHg, 약 7.3 L/min)\n**오른쪽 그래프**\n· **N**: 정상 교차점 (약 1.5 mmHg, 약 5.4 L/min)\n· **d**: 가장 아래 심기능곡선 × 정상 혈관곡선 (약 3.7 mmHg, 약 3.2 L/min)\n· **e**: 중간 점선 심기능곡선 × 오른쪽으로 이동한 점선 혈관곡선 (약 3.5 mmHg, 약 4.7 L/min)\n\n**해석**\n\n심박출량이 정상으로 돌아오지 못하는 만성 울혈성 심부전에서는 신장이 RAAS 등을 통해 물과 Na⁺를 저류합니다. 그래서 **혈액량이 증가**합니다. 혈액량이 늘면 평균 체충만압이 올라 혈관곡선이 **오른쪽**으로 이동합니다. 동시에 교감신경 보상으로 심기능곡선이 d의 곡선보다 **조금 위**(중간 점선 곡선)로 올라갑니다. 이 두 곡선의 교차점이 **e**입니다. 심박출량은 d보다 회복되었지만(약 4.7 L/min) 정상보다는 낮고, 우심방압은 높은 상태(약 3.5 mmHg)로 남습니다. 높은 정맥압은 모세혈관 여과를 늘려 부종(edema)을 일으킵니다.\n\n참고: 오른쪽 그래프의 중간 점선 심기능곡선이 \"교감 보상으로 일부 회복된 심장\"을 나타낸다고 해석했습니다. 그림에 표시가 없어 이 부분은 해석에 의존합니다. 다만 수분 저류에 따른 혈관곡선의 오른쪽 이동은","why":{"0":"점 a는 출혈의 초기 효과(혈액량 감소, 혈관곡선 좌측 이동)이지, 혈액량이 늘어난 수분 저류 보상이 아닙니다.","1":"점 b는 출혈에 대한 급성 교감 보상입니다. 만성 CHF의 수분 저류가 아닙니다.","2":"점 c는 격렬한 운동의 효과로 심박출량이 최대인 점입니다.","3":"점 d는 보상 전 심근경색의 효과입니다. 수분 저류로 혈관곡선이 오른쪽으로 이동하기 전의 교차점입니다."},"one":"CHF에 대한 수분 저류 보상은 혈관곡선이 오른쪽으로 이동한 교차점 e이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q35) / 9b. Cardiovascular Physiology 2026.pdf, slides 60, 79","img":[{"u":"img/w11_cv_phys/p60.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 60"},{"u":"img/w11_cv_phys/p79.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 79"}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_curves.webp","cap":"Cardiac & vascular function curves (9a Q31–35; red labels a–e, N added for reference)"}},"w11_mycology-1":{"q":"In the lecture overview, what meaning was written above the term saprophytic?","o":["Feed on dead matter.","Feed on living host tissue only.","Produce chlorophyll like plants.","Lack a membrane-enclosed nucleus.","Cannot cause poisoning, only infection."],"a":0,"qk":"개요에서 saprophytic(부생의) 위에 적어 둔 뜻은 무엇입니까?","ok":["죽은 물질을 먹고 산다(feed on dead matter).","살아있는 숙주 조직만 먹고 산다.","식물처럼 엽록소(chlorophyll)를 만든다.","막으로 둘러싸인 핵이 없다.","감염만 일으키고 중독(poisoning)은 일으키지 못한다."],"exp":"진균(fungi)은 부생(saprophytic)이거나 기생(parasitic)하는 진핵생물(eukaryotes)입니다. 수업에서 saprophytic 위에 **죽은 물질을 먹고 산다(feed on dead matter)**고 적어 두었습니다. 자연계에서 대부분의 진균은 이렇게 분해자 역할을 합니다.","why":{"1":"죽은 물질을 먹고 산다는 필기입니다. 살아있는 숙주만 먹는다는 뜻은 saprophytic이 아니라 parasitic에 가깝습니다.","2":"진균은 식물과 달리 엽록소·엽록체가 없습니다.","3":"진균은 막으로 둘러싸인 핵을 가진 진핵생물입니다. 핵이 없는 것은 세균입니다.","4":"같은 개요에서 진균은 중독과 감염을 모두 일으킬 수 있다고 밑줄 쳐 두었습니다."},"one":"부생(saprophytic)은 죽은 물질을 먹고 산다는 뜻이다.","src":"Mycology 2026.pdf, slide 2","img":[{"u":"img/w11_mycology/p02.webp","cap":"Mycology 2026.pdf, slide 2"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-2":{"q":"Why can fungi not be treated with antibiotics that target peptidoglycan, as annotated next to chitin?","o":["Fungal membranes contain cholesterol instead of ergosterol.","The fungal cell wall is composed largely of chitin.","Fungi lack a membrane-enclosed nucleus.","Fungi are prokaryotes like bacteria.","Fungi have chloroplasts, so cell-wall drugs cannot enter."],"a":1,"qk":"키틴(chitin) 옆에 적힌 대로, 펩티도글리칸(peptidoglycan)을 표적으로 하는 항생제를 진균에 쓸 수 없는 이유는 무엇입니까?","ok":["진균 막은 에르고스테롤 대신 콜레스테롤을 가지기 때문이다.","진균 세포벽은 주로 키틴(chitin)으로 이루어져 있기 때문이다.","진균에는 막으로 둘러싸인 핵이 없기 때문이다.","진균은 세균과 같은 원핵생물(prokaryote)이기 때문이다.","진균은 엽록체(chloroplast)가 있어 세포벽 약물이 들어가지 못하기 때문이다."],"exp":"진균 세포벽(fungal cell wall)은 주로 **키틴(chitin)**으로 이루어져 있습니다. 수업에서 이 두 단어를 묶어 동그라미 치고, 옆에 **펩티도글리칸을 표적으로 하는 항생제는 쓸 수 없다(can't use antibiotics that target peptidoglycan)**고 적어 두었습니다. 따라서 펩티도글리칸 합성을 막는 항생제에는 진균이 영향받지 않습니다.","why":{"0":"진균 막의 스테롤은 포유류의 콜레스테롤이 아니라 에르고스테롤(ergosterol)입니다. 이건 세포벽이 아니라 막의 이야기입니다.","2":"진균은 막으로 둘러싸인 핵과 세포소기관을 가진 진핵생물입니다.","3":"진균은 진핵생물이고, 원핵생물은 세균입니다.","4":"진균은 엽록소·엽록체가 없습니다. 약제를 못 쓰는 이유는 세포벽이 펩티도글리칸이 아니라 키틴이기 때문입니다."},"one":"진균 세포벽은 키틴이라서 펩티도글리칸 항생제를 쓸 수 없다.","src":"Mycology 2026.pdf, slide 3","img":[{"u":"img/w11_mycology/p03.webp","cap":"Mycology 2026.pdf, slide 3"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-3":{"q":"The lecture circled ergosterol and noted that antifungals target this component. What happens if ergosterol biosynthesis is disrupted?","o":["The fungus switches from yeast to mold.","Peptidoglycan synthesis is inhibited.","The result is fungal cell death.","The fungal cell wall is replaced by cellulose.","Mammalian cholesterol synthesis is also required for fungal survival."],"a":2,"qk":"수업에서 에르고스테롤(ergosterol)을 동그라미 치고 ‘항진균제가 이것을 표적으로 한다’고 적었습니다. 에르고스테롤 생합성이 끊어지면 어떻게 됩니까?","ok":["진균이 효모(yeast)에서 곰팡이(mold)로 바뀐다.","펩티도글리칸 합성이 억제된다.","진균 세포가 죽는다(cell death).","진균 세포벽이 셀룰로스(cellulose)로 바뀐다.","진균이 살아가려면 포유류의 콜레스테롤 합성도 필요하다."],"exp":"진균 막은 포유류 막의 콜레스테롤(cholesterol) 대신 **에르고스테롤(ergosterol)**을 가집니다. 수업에서 ergosterol을 크게 동그라미 치고 위에 **항진균제(antibiotics/antifungals)가 이것을 표적으로 한다**고 적었습니다. 에르고스테롤은 진균 세포막의 필수 성분이므로, 그 생합성이 끊어지면 **세포 사멸(cell death)**이 일어납니다.","why":{"0":"효모·곰팡이 전환은 이형성(dimorphism)의 이야기이지, 에르고스테롤 생합성 억제의 결과가 아닙니다.","1":"펩티도글리칸은 세균 세포벽 성분입니다. 진균 세포벽은 키틴입니다.","3":"진균 세포벽의 주성분은 키틴이지 셀룰로스가 아니며, 에르고스테롤은 막 성분입니다.","4":"포유류 막은 콜레스테롤을 쓰고, 진균은 에르고스테롤을 씁니다. 진균 생존에 포유류 콜레스테롤 합성이 필요한 것이 아닙니다."},"one":"에르고스테롤 생합성이 끊기면 진균 세포가 죽는다. 항진균제의 표적이다.","src":"Mycology 2026.pdf, slide 3","img":[{"u":"img/w11_mycology/p03.webp","cap":"Mycology 2026.pdf, slide 3"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-4":{"q":"Which three basic forms of fungal growth were underlined and starred?","o":["Virus, bacterium, and protozoan.","Septate, nonseptate, and spore.","Saprophyte, parasite, and allergen.","Filamentous mold, unicellular yeast, and dimorphic.","Conidium, sporangium, and spherule."],"a":3,"qk":"밑줄과 별표로 강조된 진균 성장의 기본 형태 세 가지는 무엇입니까?","ok":["바이러스, 세균, 원충.","격벽형(septate), 무격벽형(nonseptate), 포자(spore).","부생균, 기생균, 알레르겐.","실 모양 곰팡이(filamentous mold), 단세포 효모(unicellular yeast), 이형성(dimorphic).","분생포자, 포자낭, 구상체(spherule)."],"exp":"기본 형태(Basic forms)로 **다세포 실 모양 곰팡이(multicellular, filamentous mold)**, **단세포 비실성 효모(unicellular, non-filamentous yeast)**, **이형성(dimorphic; 실 모양과 단세포를 오감)** 세 가지가 제시됩니다. 수업에서 곰팡이와 효모 문구에 물결 밑줄을 치고 별표를 붙였으며, 이형성에도 별표와 밑줄을 쳤습니다. 이후 원인균 분류의 기준이 바로 이 세 형태입니다.","why":{"0":"바이러스·세균·원충은 진균의 성장 형태가 아닙니다. 진균은 이들과 구별되는 진핵생물입니다.","1":"격벽형·무격벽형은 곰팡이 균사(hyphae)의 세부 형태이지, 별표 친 세 가지 기본 형태가 아닙니다.","2":"부생·기생은 영양 방식이고, 알레르겐은 포자의 성질입니다.","4":"분생포자·포자낭·구상체는 포자/조직 형태이지, 별표 친 기본 성장 형태 세 가지가 아닙니다."},"one":"별표로 강조된 기본 형태는 곰팡이, 효모, 이형성 세 가지이다.","src":"Mycology 2026.pdf, slide 4","img":[{"u":"img/w11_mycology/p04.webp","cap":"Mycology 2026.pdf, slide 4"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-5":{"q":"Which relationship was circled and underlined for filamentous mold?","o":["A single unconnected spheroid cell is called a mycelium.","Yeasts grow only by forming septate hyphae.","Spores are the same thing as a mycelium.","Dimorphic fungi cannot form hyphae at any temperature.","Threads are hyphae; the branched mass of those threads is a mycelium."],"a":4,"qk":"실 모양 곰팡이(filamentous mold)에서 동그라미·밑줄로 정리한 관계는 무엇입니까?","ok":["서로 연결되지 않은 공 모양 세포 하나를 균사체(mycelium)라고 한다.","효모는 격벽 균사(septate hyphae)를 만들어야만 자란다.","포자(spore)와 균사체는 같은 말이다.","이형성 진균은 어떤 온도에서도 균사를 만들지 못한다.","실은 균사(hyphae)이고, 그 실이 가지 치며 모인 덩어리가 균사체(mycelium)이다."],"exp":"수업에서 **가지가 많다(many branches)**에 물결 밑줄을 치고, **실(threads) = 균사(hyphae)**를 동그라미 쳤으며, 그 덩어리를 **균사체(mycelium)**라고 밑줄 쳤습니다. 균사 하나하나가 실이고, 실이 수없이 가지 치며 얽힌 덩어리 전체가 균사체입니다. 균사체는 가지 치기와 끝 신장으로 자랍니다.","why":{"0":"서로 연결되지 않은 공 모양 세포는 효모(yeast)의 정의입니다. 균사체는 실이 모인 덩어리입니다.","1":"효모는 일반적으로 출아(budding)로 번식하는 단세포이지, 격벽 균사를 만들어야만 자라는 것이 아닙니다.","2":"포자는 번식·전파 수단이고, 균사체는 균사 덩어리입니다.","3":"이형성 진균은 환경에 따라 균사형(곰팡이)과 효모형을 오갑니다."},"one":"실은 균사(hyphae)이고, 가지 친 실의 덩어리가 균사체(mycelium)이다.","src":"Mycology 2026.pdf, slide 5","img":[{"u":"img/w11_mycology/p05.webp","cap":"Mycology 2026.pdf, slide 5"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-6":{"q":"What did the lecture emphasize about septate hyphae?","o":["Septate hyphae are perforated so that the cytoplasm of the hyphae is continuous.","Septate means the hyphae have no crosswalls at all.","Nonseptate hyphae are partitioned into segments by pores.","Only yeasts form septate hyphae.","Septate walls completely isolate each cell so cytoplasm cannot mix."],"a":0,"qk":"수업에서 격벽 균사(septate hyphae)에 대해 강조한 내용은 무엇입니까?","ok":["격벽 균사는 구멍이 뚫려 있어 균사의 세포질이 연속된다.","격벽형(septate)은 가로막(crosswall)이 전혀 없다는 뜻이다.","무격벽 균사(nonseptate)는 구멍으로 분절되어 있다.","격벽 균사를 만드는 것은 효모뿐이다.","격벽은 각 세포를 완전히 격리해 세포질이 섞일 수 없다."],"exp":"**격벽형(septate)**과 **무격벽형(nonseptate)**에 밑줄이 쳐져 있습니다. 격벽이 있는 균사는 가로막으로 분절되지만, 그 격벽은 **구멍이 뚫려(perforated)** 있어 **세포질이 연속됩니다**. 무격벽형은 가로막 없이 이어집니다.","why":{"1":"가로막이 없는 것은 무격벽형(nonseptate)입니다. 격벽형은 가로막으로 분절됩니다.","2":"구멍이 있는 가로막으로 분절되는 것은 격벽형입니다. 무격벽형은 가로막이 없습니다.","3":"격벽·무격벽은 곰팡이 균사의 형태이고, 효모는 단세포입니다.","4":"격벽에는 구멍이 있어 세포질이 이어집니다. 완전히 격리되는 것이 아닙니다."},"one":"격벽 균사는 구멍(perforation)이 있어 세포질이 연속된다.","src":"Mycology 2026.pdf, slide 5","img":[{"u":"img/w11_mycology/p05.webp","cap":"Mycology 2026.pdf, slide 5"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-7":{"q":"A brace in the dimorphic lecture grouped the definition, the conditions that change morphology, and which clinical point?","o":["They cause only superficial skin discoloration.","They are mainly fungi that cause systemic mycoses (lungs).","They are never found at 37°C.","They reproduce only by sexual meiosis.","They lack ergosterol in their membranes."],"a":1,"qk":"이형성(dimorphic) 설명에서 중괄호로 묶은 정의·조건과 함께 강조된 임상 포인트는 무엇입니까?","ok":["표재성 피부 탈색만 일으킨다.","주로 전신 진균증(systemic mycoses), 그중에서도 폐(lungs)를 일으키는 진균이다.","37°C에서는 결코 발견되지 않는다.","유성 감수분열(meiosis)로만 번식한다.","막에 에르고스테롤이 없다."],"exp":"**이형성(Dimorphic)**에 밑줄이 쳐 있고, 한 환경에서는 효모형, 다른 환경에서는 곰팡이형이라는 정의와, 형태를 바꾸는 조건인 **온도와 이산화탄소(CO₂)** , 그리고 **주로 전신 진균증(systemic mycoses)**을 일으키는 균이라는 문장이 중괄호로 묶여 있습니다. 전신 진균증 옆에는 **폐(lungs)**라고 적어 두었습니다. 예로 Blastomyces dermatitidis와 Histoplasma capsulatum이 나옵니다.","why":{"0":"표재성 탈색은 전풍(tinea versicolor) 같은 표재 감염의 이야기입니다. 이형성 전신 진균의 핵심이 아닙니다.","2":"체온(37°C, 몸 안)에서는 대개 효모형입니다. 37°C에서 안 나오는 것이 아닙니다.","3":"이형성의 핵심은 환경에 따른 형태 전환이지, 유성 생식만 한다는 뜻이 아닙니다.","4":"진균 막은 에르고스테롤을 가집니다. 이형성 정의와 무관합니다."},"one":"이형성 진균은 온도와 CO₂에 따라 형태가 바뀌고, 주로 폐의 전신 진균증을 일으킨다.","src":"Mycology 2026.pdf, slide 8","img":[{"u":"img/w11_mycology/p08.webp","cap":"Mycology 2026.pdf, slide 8"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-8":{"q":"On the dimorphic comparison chart, what labels were written above in vitro (25°C) and in vivo (37°C)?","o":["In vitro = in body (yeast); in vivo = environment (mold).","Both temperatures produce only spherules.","In vitro (25°C) = environment (mold); in vivo (37°C) = in body (yeast or spherule).","In vitro is always 37°C in the laboratory.","Dimorphic fungi cannot grow at 25°C."],"a":2,"qk":"이형성 비교표에서 시험관 내(in vitro, 25°C)와 생체 내(in vivo, 37°C) 위에 적어 둔 표시는 무엇입니까?","ok":["in vitro = 몸 안(효모), in vivo = 바깥 환경(곰팡이).","두 온도 모두 구상체(spherule)만 만든다.","in vitro(25°C) = 바깥 환경(곰팡이), in vivo(37°C) = 몸 안(효모 또는 구상체).","in vitro는 언제나 실험실 37°C이다.","이형성 진균은 25°C에서 자라지 못한다."],"exp":"왼쪽 **시험관 내(in vitro, 25°C)** 위에는 **바깥 환경(environment)**, 오른쪽 **생체 내(in vivo, 37°C)** 위에는 **몸 안(in body)**이라고 적어 두었습니다. 표에서 25°C는 곰팡이(mold) 형태이고, 37°C 몸 안은 대개 효모(yeast)입니다. 다만 콕시디오이데스(Coccidioides)는 몸 안에서 효모 대신 **구상체(spherule)**가 됩니다.","why":{"0":"방향이 반대입니다. 25°C 시험관(환경)이 곰팡이, 37°C 몸 안이 효모(또는 구상체)입니다.","1":"구상체가 되는 것은 콕시디오이데스입니다. 블라스토미세스·히스토플라스마 등은 몸 안에서 효모입니다.","3":"표에 in vitro는 25°C로 나와 있습니다. 37°C는 in vivo입니다.","4":"25°C 바깥 환경에서 곰팡이 형태로 자랍니다."},"one":"25°C 바깥 환경은 곰팡이, 37°C 몸 안은 효모(콕시디오이데스는 구상체)이다.","src":"Mycology 2026.pdf, slide 9","img":[{"u":"img/w11_mycology/p09.webp","cap":"Mycology 2026.pdf, slide 9"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-9":{"q":"Which pairing was starred and circled for asexual versus sexual spores?","o":["Asexual spores are formed by meiosis; sexual spores by mitosis.","Both asexual and sexual spores are formed only by budding.","Sexual spores cannot be used for identification.","Asexual spores (e.g., conidia) are formed by mitosis; sexual spores are formed by meiosis.","Asexual sporulation occurs only inside the human body at 37°C."],"a":3,"qk":"무성포자와 유성포자에 별표·동그라미로 대비해 둔 짝은 무엇입니까?","ok":["무성포자는 감수분열(meiosis), 유성포자는 체세포분열(mitosis)로 만들어진다.","무성·유성포자 모두 출아(budding)로만 만들어진다.","유성포자는 동정에 쓸 수 없다.","무성포자(예: 분생포자 conidia)는 체세포분열(mitosis)로, 유성포자는 감수분열(meiosis)로 만들어진다.","무성 포자 형성은 37°C 사람 몸 속에서만 일어난다."],"exp":"무성 포자형성 설명의 왼쪽 위에 **Sexual = meiosis**라고 별표와 함께 적어 두었고, **무성포자(asexual spores, 예: conidia)는 체세포분열(mitosis)로 만들어진다**는 구절을 동그라미·별표로 강조했습니다. 유성 포자 설명에서는 **Formed by meiosis**를 다시 동그라미·별표로 묶어, 무성 = 유사분열, 유성 = 감수분열이라는 대비를 분명히 했습니다.","why":{"0":"방향이 반대입니다. 무성은 mitosis, 유성은 meiosis입니다.","1":"출아는 효모의 번식 방식(분아포자)이지, 모든 포자의 유일한 형성법이 아닙니다.","2":"포자, 특히 유성포자의 모양과 표면 무늬는 종 동정의 주된 또는 유일한 수단이 될 수 있습니다.","4":"무성포자는 특수한 균사(분생체 등)에서 만들어져 공기 중으로 퍼질 수 있습니다. 몸 속에서만 생기는 것이 아닙니다."},"one":"무성포자는 체세포분열(mitosis), 유성포자는 감수분열(meiosis)로 만들어진다.","src":"Mycology 2026.pdf, slide 11, 14","img":[{"u":"img/w11_mycology/p11.webp","cap":"Mycology 2026.pdf, slide 11"},{"u":"img/w11_mycology/p14.webp","cap":"Mycology 2026.pdf, slide 14"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-10":{"q":"How were asexual spores grouped in the handwritten labels on the sporulation diagram?","o":["All five types are produced only inside a sac.","Sexual spores were placed in the same five boxes.","Only Candida can form any of these spores.","Enclosed spores are always formed by meiosis.","Externally produced: conidiospores, blastoconidia, and arthroconidia; enclosed: chlamydospores and sporangiospores."],"a":4,"qk":"포자형성 그림에 손글씨로 나눈 무성포자 묶음은 어떻게 됩니까?","ok":["다섯 가지 모두 주머니(sac) 안에서만 만들어진다.","유성포자도 같은 다섯 칸에 넣어 두었다.","이 포자를 만들 수 있는 것은 칸디다뿐이다.","둘러싸여 만들어지는 포자는 항상 감수분열로 생긴다.","바깥에서 만들어지는 것: 분생포자, 분아포자, 분절포자. 둘러싸여 만들어지는 것: 후막포자, 포자낭포자."],"exp":"무성포자를 **바깥에서 만들어지는(externally produced)** 묶음과 **둘러싸여 만들어지는(enclosed)** 묶음으로 나누어 적어 두었습니다. 바깥쪽은 **분생포자(conidiospore/conidia, 예: Aspergillus)**, **분아포자(blastoconidia, 모세포에서 떨어지는 출아, C. albicans)**, **분절포자(arthroconidia, 격벽 균사가 낱세포로 조각남)**이고, 둘러싸인 쪽은 **후막포자(chlamydospore)**와 **포자낭포자(sporangiospore, 포자낭 안에서 형성)**입니다.","why":{"0":"주머니(포자낭) 안에서 생기는 것은 포자낭포자입니다. 분생포자·분아포자·분절포자는 바깥에서 만들어집니다.","1":"이 그림은 무성포자(asexual spores) 분류입니다.","2":"아스페르길루스 등은 분생포자를, 칸디다는 분아포자·후막포자를 만듭니다. 칸디다만이 아닙니다.","3":"이 다섯 가지는 모두 무성포자이며 체세포분열로 만들어집니다. 감수분열은 유성포자입니다."},"one":"무성포자는 바깥에서 생기는 분생·분아·분절포자와, 둘러싸여 생기는 후막·포자낭포자로 나눈다.","src":"Mycology 2026.pdf, slide 12","img":[{"u":"img/w11_mycology/p12.webp","cap":"Mycology 2026.pdf, slide 12"}],"ch":"w11_mycology","chn":"Mycology","week":11},"w11_mycology-11":{"q":"Which culture medium was wavy-underlined as the standard medium for fungal culture?","o":["Sabouraud dextrose agar.","MacConkey agar.","Thayer–Martin agar.","Löwenstein–Jensen medium.","Tellurite (Tinsdale) agar."],"a":0,"qk":"진균 배양의 표준 배지로 물결 밑줄이 쳐진 것은 무엇입니까?","ok":["사부로 덱스트로스 한천(Sabouraud dextrose agar).","맥콘키 한천(M
