드·에탐부톨)는 결핵 치료입니다.","1":"페니실린 또는 에리트로마이신은 디프테리아 치료·보균자 제거에 쓰입니다.","3":"독시사이클린·아지트로마이신은 앵무병 등에 쓰이며, 나병 MDT가 아닙니다.","4":"이소니아지드 단독 2개월은 나병 MDT가 아닙니다."},"one":"나병 MDT는 답손·리팜핀·클로파지민이며, 신경 손상 때문에 1–2년으로 결핵보다 길다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 77","img":[{"u":"img/w11_resp_inf/p77.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 77"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-29":{"q":"Dr. McLean boxed the species jump of Mycobacterium bovis as which pair of routes?","o":["Cattle to animals by ingestion; cattle to humans by skin contact.","Cattle to animals by fomites; cattle to humans by arthropod bite.","Cattle to animals by water mist; cattle to humans by PPD injection.","Cattle to animals by inhalation; cattle to humans by ingestion (raw infected cow’s milk).","Cattle to both animals and humans only by prolonged nerve contact."],"a":3,"qk":"소결핵균(Mycobacterium bovis)이 종을 넘어가는 경로로 박스에 적힌 짝은 무엇입니까?","ok":["소→동물은 섭취, 소→사람은 피부 접촉이다.","소→동물은 매개물, 소→사람은 절지동물 침이다.","소→동물은 물안개, 소→사람은 PPD 주사이다.","소→동물은 흡입, 소→사람은 섭취(감염된 생우유)이다.","소→동물과 사람 모두 오랜 신경 접촉으로만 전파된다."],"exp":"M. bovis는 소에서 결핵을 일으키고, 종을 넘어 사람에게도 병을 일으킬 수 있습니다. 박스 메모는 경로를 이렇게 구별합니다. **소 → 동물: 흡입(inhalation) / 소 → 사람: 섭취(ingestion)**.\n\n사람으로의 전파는 주로 **감염된 생우유를 마시는 것**이며, 병변은 림프절에 생기고 뼈와 관절로 퍼질 수 있습니다. 흡입으로도 퍼질 수는 있습니다. 이 균으로 BCG 백신을 만듭니다.","why":{"0":"소→동물의 주된 경로는 섭취가 아니라 흡입이고, 소→사람은 피부 접촉이 아니라 섭취입니다.","1":"매개물이나 절지동물 침은 이 박스에 적힌 경로가 아닙니다.","2":"물안개는 레지오넬라, PPD 주사는 피부 검사이지 감염 경로가 아닙니다.","4":"오랜 신경 접촉은 나병 전파의 맥락입니다. M. bovis의 박스 경로가 아닙니다."},"one":"M. bovis는 소→동물은 흡입, 소→사람은 감염된 생우유 섭취로 전파된다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 81","img":[{"u":"img/w11_resp_inf/p81.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 81"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-30":{"q":"Atypical mycobacteria such as MAC (M. avium complex) are marked as having which set of properties?","o":["They are strictly human pathogens that never exist in the environment.","They are readily transmitted from person to person by respiratory droplets.","They are uniformly susceptible to standard RIPE anti-TB drugs.","They are the source organisms from which the BCG vaccine is made.","They are widespread environmental opportunists, especially in AIDS, that are not readily transmitted and are highly resistant to anti-TB drugs."],"a":4,"qk":"MAC(M. avium complex) 같은 비정형 마이코박테리아에 표시된 특성은 무엇입니까?","ok":["환경에는 전혀 없고 사람에게만 있는 병원체이다.","호흡기 비말로 사람 사이에 쉽게 전파된다.","표준 RIPE 항결핵제에 모두 감수성이다.","BCG 백신을 만드는 원료 균이다.","환경에 널리 있는 기회감염균으로, 특히 AIDS에서 문제를 일으키며, 사람 간 전파가 잘 안 되고 항결핵제에 강한 내성이 있다."],"exp":"비정형 마이코박테리아, 특히 **M. avium-intracellulare(MAC)**에 대해 다음이 동그라미 또는 밑줄로 표시되어 있습니다.\n\n· **환경(공기, 흙, 물 등)에 널리 분포**한다.\n· **기회감염균(opportunists)**이다.\n· **AIDS**와 연관된 결핵 비슷한 병을 일으킨다.\n· **사람 사이에 쉽게 전파되지 않는다(not readily transmitted)**.\n· **항결핵제에 강한 내성(highly resistant to anti-TB drugs)**이 있다.","why":{"0":"이 균들은 환경에 널리 있습니다. 사람만의 절대 병원체가 아닙니다.","1":"사람 간 전파가 잘 안 된다고 밑줄 쳐져 있습니다.","2":"항결핵제에 강한 내성이 있다고 밑줄 쳐져 있습니다. 표준 RIPE에 모두 듣지 않습니다.","3":"BCG의 원료는 M. bovis입니다. MAC이 아닙니다."},"one":"MAC은 환경에 널리 있는 기회감염균으로, AIDS에서 문제를 일으키고, 사람 간 전파가 잘 안 되며 항결핵제에 내성이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 82","img":[{"u":"img/w11_resp_inf/p82.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 82"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-31":{"q":"A brace on the diphtheria infection-site list grouped pharynx, tonsils, and larynx as what, and what was written next to skin?","o":["Upper respiratory tract, and also skin.","Lower respiratory tract only, never the skin.","The meninges only, and never the throat.","The alveoli only, with no cutaneous form.","The gastrointestinal tract, and also the liver."],"a":0,"qk":"디프테리아 감염 부위 목록의 중괄호는 인두·편도·후두를 무엇으로 묶었고, 피부 옆에는 무엇을 적었습니까?","ok":["상기도(upper respiratory tract), 그리고 피부(skin)도 감염시킨다.","하기도만 감염시키고 피부는 절대 감염시키지 않는다.","수막만 감염시키고 목은 절대 감염시키지 않는다.","폐포만 감염시키고 피부형은 없다.","위장관, 그리고 간도 감염시킨다."],"exp":"인두(pharynx), 편도(tonsils), 후두(larynx)가 중괄호로 **상기도(upper resp. tract)**로 묶여 있고, **피부(Skin)**에는 밑줄과 함께 **AND skin**이라고 적어 두었습니다. 디프테리아는 목의 상기도 점막을 주로 침범하지만, 피부도 함께 감염시킬 수 있습니다.","why":{"1":"하기도만이 아닙니다. 중괄호는 상기도이고, 피부도 AND로 표시되어 있습니다.","2":"수막이 이 목록의 중괄호 대상이 아닙니다. 인두·편도·후두가 상기도로 묶여 있습니다.","3":"폐포만이 아니며, 피부형이 있다고 AND skin으로 적어 두었습니다.","4":"위장관·간은 이 감염 부위 메모의 내용이 아닙니다."},"one":"디프테리아는 상기도(인두·편도·후두)와 피부를 감염시킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 6","img":[{"u":"img/w11_resp_inf/p06.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 6"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-32":{"q":"Besides the boxed oral pseudomembrane, which other diphtheria presentation was marked “Q’s”?","o":["A bull-neck only, with no skin involvement.","A cutaneous skin ulcer.","A currant-jelly sputum cavity.","A wrist-drop deformity of the hand.","A nonproductive cough due to an intracellular organism."],"a":1,"qk":"박스 친 구강 위막 외에, ‘Q’s’라고 표시된 디프테리아의 다른 양상은 무엇입니까?","ok":["피부 침범이 없는 황소목(bull neck)만.","피부의 궤양(cutaneous skin ulcer).","건포도 젤리 가래가 있는 공동.","손목처짐(wrist-drop) 변형.","세포 내 균 때문에 생기는 비생산성 기침."],"exp":"왼쪽 구강 위막(pseudo-membrane)은 박스로 ‘구강의 디프테리아’라고 적혀 있고, 오른쪽 **피부 궤양(Skin ulcer)** 위에는 **Q’s**라고 별표처럼 크게 표시되어 있습니다. 피부형 디프테리아의 궤양도 시험에 나올 수 있는 소견으로 강조된 것입니다.","why":{"0":"황소목은 경부 림프절염의 소견입니다. ‘Q’s’라고 적힌 것은 피부 궤양 사진입니다.","2":"건포도 젤리 가래는 클렙시엘라 폐렴의 단골 소견입니다.","3":"손목처짐은 나병의 임상 사진입니다.","4":"세포 내 균에 의한 비생산성 기침은 레지오넬라 쪽에 적힌 메모입니다."},"one":"디프테리아는 구강 위막뿐 아니라 피부 궤양으로도 나타날 수 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 10","img":[{"u":"img/w11_resp_inf/p10.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 10"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-33":{"q":"Which vaccine was starred or underlined for prevention of diphtheria and of pertussis?","o":["BCG (live attenuated M. bovis) only.","The pneumococcal conjugate capsule vaccine only.","The DTaP (Diphtheria-Pertussis-Tetanus) vaccine; boosters are needed because immunity wanes.","A toxoid directed against pneumolysin only.","No vaccine exists for either disease."],"a":2,"qk":"디프테리아와 백일해 예방에 별표 또는 밑줄이 쳐진 백신은 무엇입니까?","ok":["BCG(약독화 생 M. bovis)만.","폐렴구균 접합 피막 백신만.","DTaP(디프테리아-백일해-파상풍) 백신이며, 면역이 떨어지므로 추가접종이 필요하다.","뉴몰리신만 표적으로 하는 톡소이드.","두 질환 모두 백신이 없다."],"exp":"디프테리아 예방에서 **DTaP** 앞에 별표가 있고 위에 **Prevents Diphtheria**라고 적혀 있습니다. 백일해 예방에서도 **DTaP**에 밑줄이 쳐져 있습니다. 디프테리아 쪽에는 면역이 시간이 지나며 약해지므로 **추가접종(booster)**이 필요하다고 나와 있습니다.","why":{"0":"BCG는 결핵 예방 백신입니다. 디프테리아·백일해의 표시된 백신은 DTaP입니다.","1":"폐렴구균 접합 백신은 폐렴구균 피막을 표적으로 합니다.","3":"뉴몰리신은 폐렴구균의 용혈소입니다. 이 두 질환의 표시된 백신이 아닙니다.","4":"DTaP가 두 질환 예방으로 표시되어 있습니다."},"one":"DTaP가 디프테리아와 백일해를 예방하며, 면역이 떨어지므로 추가접종이 필요하다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 11, 30","img":[{"u":"img/w11_resp_inf/p11.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 11"},{"u":"img/w11_resp_inf/p30.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 30"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-34":{"q":"What sites were handwritten under the Haemophilus influenzae title?","o":["The gastrointestinal tract only.","Skin, hair, and nails only.","The meninges only, never the airways.","The upper and lower respiratory tract.","Desert soil and bird droppings only."],"a":3,"qk":"헤모필루스 인플루엔자(Haemophilus influenzae) 제목 아래에 손글씨로 적어 둔 부위는 어디입니까?","ok":["위장관만.","피부, 털, 손발톱만.","수막만이고 기도는 절대 아니다.","상기도와 하기도(upper + lower resp. tract).","사막 흙과 새 배설물만."],"exp":"제목 아래에 **upper + lower resp. tract**라고 손글씨로 적어 두었습니다. 이 균은 상기도와 하기도를 모두 침범할 수 있습니다. 같은 강의에서 수막염·중이염·부비동염·폐렴이 질병 목록에 나옵니다.","why":{"0":"위장관만이 아닙니다. 적힌 것은 상기도와 하기도입니다.","1":"피부·털·손발톱은 피부사상균의 표적입니다.","2":"수막염도 일으키지만, 여기에 적힌 것은 상기도와 하기도입니다.","4":"사막 흙·새 배설물은 다른 호흡기 병원체의 서식지입니다."},"one":"헤모필루스 인플루엔자는 상기도와 하기도를 모두 침범한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 13","img":[{"u":"img/w11_resp_inf/p13.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 13"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-35":{"q":"For H. influenzae, which host and which two diseases were underlined, starred, or boxed?","o":["Elderly smokers only; only urinary tract infection.","Neonates only; only bull-neck diphtheria.","Healthy adults only; only tinea pedis.","Adolescents only; only Legionnaires’ disease.","Children under 5 years are most susceptible; meningitis in that group is starred, and pneumonia is boxed and starred."],"a":4,"qk":"H. influenzae에서 밑줄·별표·박스로 강조된 숙주와 질환 두 가지는 무엇입니까?","ok":["흡연 노인만이며, 요로감염만.","신생아만이며, 황소목 디프테리아만.","건강한 성인만이며, 족부백선만.","청소년만이며, 재향군인병만.","5세 미만 어린이가 가장 잘 걸리고, 이 나이의 수막염에 별표가 있으며, 폐렴은 박스와 별표로 강조되어 있다."],"exp":"**5세 미만 어린이(Children under 5 years)**가 가장 잘 걸린다고 밑줄 쳐져 있습니다. 그 아래 **수막염(Meningitis, Children under 5 years)**에 별표가 있고, **폐렴(Pneumonia)**은 박스와 별표로 강조되어 있습니다. 중이염·부비동염도 목록에 있으나, 별표·박스가 쳐진 것은 수막염과 폐렴입니다. 같은 쪽에서 H. ducreyi는 통증성 생식기 궤양의 연성하감(chancroid)을 일으킨다고 적혀 있습니다.","why":{"0":"강조된 숙주는 5세 미만 어린이이고, 별표·박스 질환은 수막염과 폐렴입니다.","1":"황소목 디프테리아는 코리네박테리움의 소견입니다.","2":"족부백선은 피부사상균의 이야기입니다.","3":"재향군인병은 레지오넬라입니다."},"one":"H. influenzae는 5세 미만에서 잘 걸리며, 수막염과 폐렴이 특히 강조되어 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 14","img":[{"u":"img/w11_resp_inf/p14.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 14"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-36":{"q":"Which Haemophilus influenzae mechanism was underlined in the summary table?","o":["It produces IgA protease that degrades secretory IgA.","It inactivates elongation factor 2.","It forms a currant-jelly polysaccharide plug in bile.","It lacks a cell wall and therefore ignores penicillin.","It lives only inside amoebae in cooling towers."],"a":0,"qk":"헤모필루스 인플루엔자 요약표에서 밑줄 쳐진 기전은 무엇입니까?","ok":["IgA 단백분해효소(IgA protease)를 만들어 분비형 IgA를 분해한다.","신장인자 2(EF2)를 불활성화한다.","담즙에서 건포도 젤리 다당 마개를 만든다.","세포벽이 없어서 페니실린의 영향을 받지 않는다.","냉각탑의 아메바 안에서만 산다."],"exp":"**IgA 단백분해효소(IgA protease)가 분비형 IgA를 분해한다**는 구절에 빨간 밑줄이 쳐져 있습니다. 분비형 IgA가 깨지면 상기도 집락 형성이 쉬워지고, 이후 혈액과 수막 등 다른 부위로 퍼질 수 있습니다.","why":{"1":"EF2 불활성화는 디프테리아 독소의 기전입니다.","2":"건포도 젤리 가래는 클렙시엘라의 소견입니다.","3":"세포벽이 없는 것은 마이코플라스마입니다.","4":"아메바 속 세포 내 기생은 레지오넬라의 특징입니다."},"one":"H. influenzae는 분비형 IgA를 분해하는 IgA 단백분해효소를 만든다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 16","img":[{"u":"img/w11_resp_inf/p16.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 16"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-37":{"q":"Besides being a leading cause of community-acquired pneumonia and adult bacterial meningitis, where was S. pneumoniae underlined as being found?","o":["Only in desert rodent burrows.","In the nasopharynx of many healthy individuals.","Only inside amoebae in spa water.","Only on Lowenstein-Jensen medium as mold-like colonies.","Only in raw cow’s milk."],"a":1,"qk":"지역사회획득 폐렴과 성인 세균 수막염의 가장 흔한 원인 외에, 폐렴구균이 어디에 있다고 밑줄 쳐져 있습니까?","ok":["사막 설치류 굴에만.","많은 건강한 사람의 비인두(nasopharynx of many healthy individuals).","온천수 아메바 안에만.","뢰벤슈타인–옌센 배지의 곰팡이 같은 집락에만.","생우유에만."],"exp":"**건강한(healthy)** 사람의 **비인두(nasopharynx)**에 밑줄이 쳐져 있습니다. 폐렴구균은 사람의 의무기생체로서, 많은 건강한 사람의 비인두에 상재하다가 폐렴·수막염·중이염 등을 일으킬 수 있습니다. 지역사회획득 폐렴과 성인 세균 수막염의 가장 흔한 원인이라는 점은 따로 별표가 쳐져 있습니다.","why":{"0":"사막 굴은 이 균의 서식지 메모가 아닙니다.","2":"아메바·온천수는 레지오넬라의 이야기입니다.","3":"뢰벤슈타인–옌센은 결핵균 배지입니다.","4":"생우유는 M. bovis의 사람 전파 경로입니다."},"one":"폐렴구균은 많은 건강한 사람의 비인두에 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 19","img":[{"u":"img/w11_resp_inf/p19.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 19"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-38":{"q":"After the starred capsule and pneumolysin, which exudate and spread findings were underlined for pneumococcal pathogenesis?","o":["A dry cough only, with no cellular exudate, confined to keratin.","Caseous necrosis limited to the adrenal glands.","Alveoli exude fluid, RBCs, and WBCs, leading to a productive cough, and the organism disseminates to lymphatics and blood.","A nonproductive cough because the organism is strictly extracellular in water.","Endosporulating spherules replace the alveolar exudate."],"a":2,"qk":"별표 친 피막과 뉴몰리신 다음에, 폐렴구균 발병기전에서 밑줄 쳐진 삼출과 전파 소견은 무엇입니까?","ok":["세포 삼출이 없는 마른 기침뿐이며 케라틴에만 머문다.","부신에만 국한된 건락 괴사.","폐포에서 체액, 적혈구, 백혈구가 스며 나와 생산성 기침이 되고, 균은 림프관과 혈액으로 퍼진다.","물속에만 있는 세포 밖 균이라서 비생산성 기침만 난다.","내생포자 구상체가 폐포 삼출을 대신한다."],"exp":"별표는 피막과 뉴몰리신(용혈소)에 쳐져 있고, 그 아래 **폐포에서 체액·적혈구·백혈구가 스며 나와(exudes fluid, RBCs and WBCs) 생산성 기침(productive cough)**이 난다는 구절과, **림프관·혈액(lymphatics, blood)**으로 퍼진다는 구절에 밑줄이 있습니다. 녹슨색·혈성 가래의 바탕이 바로 이 삼출입니다.","why":{"0":"생산성 기침과 세포 삼출이 밑줄 쳐져 있습니다. 마른 기침·케라틴이 아닙니다.","1":"건락 괴사는 결핵 병터의 이야기입니다.","3":"비생산성 기침은 레지오넬라에서 ‘세포 내라서’라고 적힌 소견입니다.","4":"구상체는 콕시디오이데스입니다."},"one":"폐렴구균은 폐포에 체액·적혈구·백혈구가 스며 생산성 기침을 만들고, 림프관과 혈액으로 퍼진다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 20","img":[{"u":"img/w11_resp_inf/p20.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 20"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-39":{"q":"Which Bordetella points were underlined or annotated as the lecture’s focus?","o":["Only B. parapertussis is encapsulated, and it is the sole focus.","Virulent strains are nonencapsulated yeasts that cause tinea.","The genus never produces toxins and never causes cough.","Virulent strains are encapsulated, and B. pertussis (whooping cough) is the focus species.","B. pertussis infects only the urinary tract of elderly men."],"a":3,"qk":"보르데텔라에서 밑줄 치거나 ‘focus’라고 적어 둔 수업의 초점은 무엇입니까?","ok":["피막이 있는 것은 B. parapertussis뿐이며, 그것이 유일한 초점이다.","독력 주는 피막 없는 효모이며 백선을 일으킨다.","이 속은 독소를 만들지 않고 기침도 일으키지 않는다.","독력 주는 피막이 있고, 초점은 백일해의 원인인 B. pertussis이다.","B. pertussis는 노인 남성의 요로만 감염시킨다."],"exp":"**독력 있는 주는 피막이 있다(Virulent strains - encapsulated)**에 밑줄이 쳐져 있고, **백일해(whooping cough, pertussis)**와 **B. pertussis**에 밑줄이 있습니다. 중요 종 목록에서는 **B. pertussis** 옆에 **(focus)**라고 적어, 수업의 초점이 이 종임을 분명히 했습니다.","why":{"0":"초점으로 표시된 것은 B. pertussis입니다. 피막은 독력 있는 주에 있다고 밑줄 쳐져 있습니다.","1":"보르데텔라는 피막이 있는 그람 음성 구막대균이지 효모가 아니며, 백선의 원인이 아닙니다.","2":"독소를 만들고 백일해를 일으킨다고 밑줄 쳐져 있습니다.","4":"감염 부위는 호흡기(비인두, 기관·기관지 섬모세포)입니다."},"one":"독력 있는 보르데텔라는 피막이 있고, 수업의 초점은 백일해균 B. pertussis이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 25, 26","img":[{"u":"img/w11_resp_inf/p25.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 25"},{"u":"img/w11_resp_inf/p26.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 26"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-40":{"q":"Which modes of transmission were underlined for Bordetella pertussis?","o":["Sexual contact only.","Ingestion of raw milk only.","The bite of an infected armadillo only.","Airborne spores from desert dust only.","Respiratory droplets by coughing, or direct contact."],"a":4,"qk":"백일해균(Bordetella pertussis)의 전파 경로로 밑줄 쳐진 것은 무엇입니까?","ok":["성접촉만.","생우유 섭취만.","감염된 아르마딜로의 교상만.","사막 먼지의 공기 중 포자만.","기침에 의한 호흡기 비말, 또는 직접 접촉."],"exp":"**기침에 의한 호흡기 비말(droplets by coughing)**과 **직접 접촉(direct contact)**에 밑줄이 쳐져 있습니다. 감염 부위로는 비인두와 기관·기관지의 섬모세포가 나열되어 있습니다.","why":{"0":"성접촉이 이 밑줄의 경로가 아닙니다.","1":"생우유는 M. bovis의 사람 전파 경로입니다.","2":"아르마딜로는 나균 배양의 천연 숙주이지, 백일해 전파 경로가 아닙니다.","3":"사막 먼지는 콕시디오이데스 노출에 가깝습니다."},"one":"백일해는 기침 비말 또는 직접 접촉으로 옮는다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 27","img":[{"u":"img/w11_resp_inf/p27.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 27"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-41":{"q":"After a common-cold-like start, which pertussis symptom was underlined?","o":["A prolonged characteristic cough.","Currant-jelly sputum from the first day.","Painless genital ulcers.","Bull-neck swelling of the cervical nodes.","A painless scalp plaque that fluoresces green."],"a":0,"qk":"감기처럼 시작한 뒤에, 백일해 증상으로 밑줄 쳐진 것은 무엇입니까?","ok":["오래 가는 특징적인 기침(prolonged characteristic cough).","첫날부터의 건포도 젤리 가래.","통증 없는 생식기 궤양.","경부 림프절의 황소목 종창.","초록 형광을 내는 통증 없는 두피 반."],"exp":"처음에는 감기와 비슷하다가, 이어서 **오래 가는 특징적인 기침(prolonged characteristic cough)**이 난다고 밑줄 쳐져 있습니다. 이것이 백일해의 임상 핵심이며, 이후 ‘휘핑’ 소리의 설명으로 이어집니다.","why":{"1":"건포도 젤리 가래는 클렙시엘라의 단골 소견입니다.","2":"통증성 생식기 궤양은 H. ducreyi(연성하감)입니다.","3":"황소목은 디프테리아의 소견입니다.","4":"형광 두피 반은 일부 두부백선의 이야기입니다."},"one":"백일해는 감기처럼 시작하다가 오래 가는 특징적인 기침이 이어진다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 28","img":[{"u":"img/w11_resp_inf/p28.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 28"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-42":{"q":"The contamination list for Legionella (cooling towers, spas, showers, and similar sites) was braced with which handwritten note, and how was the fine mist annotated?","o":["Only sterile distilled water in sealed vials; mist was labeled “not infectious.”","Anywhere with water or spraying; the fine mist was annotated as shower mist.","Only desert dust; the mist was labeled “pollen only.”","Only raw milk; the mist was labeled “caseous droplets.”","Only keratin of hair shafts; the mist was labeled “arthroconidia.”"],"a":1,"qk":"레지오넬라 오염원 목록(냉각탑, 온천, 샤워 등)을 중괄호로 묶으며 적어 둔 메모와, 미세 안개에 대한 주석은 무엇입니까?","ok":["밀봉 증류수만이며, 안개는 ‘감염성이 없다’고 적혀 있다.","물이 있거나 분무가 일어나는 어디든(anywhere with water/spraying)이며, 미세 안개는 샤워 안개(shower mist)라고 적혀 있다.","사막 먼지만이며, 안개는 ‘꽃가루만’이라고 적혀 있다.","생우유만이며, 안개는 ‘건락 방울’이라고 적혀 있다.","모간 케라틴만이며, 안개는 ‘분절포자’라고 적혀 있다."],"exp":"냉각탑, 증발 응축기, 온수기, 정수기, 온천, 샤워 등이 중괄호로 묶이고 옆에 **물이 있거나 분무가 일어나는 어디든(anywhere with water/spraying happens)**이라고 적혀 있습니다. **미세 안개(water in fine mist)**로 전파된다는 문장에는 별표·박스가 있고, 아래에 **샤워 안개(shower mist)**라고 주석이 달려 있습니다.","why":{"0":"증류수가 무균이라서가 아닙니다. 분무되는 물 어디에나 있을 수 있습니다.","2":"사막 먼지·꽃가루가 이 중괄호의 내용이 아닙니다.","3":"생우유·건락은 다른 균의 이야기입니다.","4":"케라틴·분절포자는 진균 쪽 이야기입니다."},"one":"레지오넬라는 분무되는 물 어디에나 있을 수 있고, 샤워 같은 미세 안개로 전파된다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 33","img":[{"u":"img/w11_resp_inf/p33.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 33"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-43":{"q":"In Legionella pathogenesis, what was written under alveolar macrophages, and which step was underlined after uptake?","o":["Macrophages instantly kill the organism; it never enters a phagosome.","The organism lives only on keratin and never meets macrophages.","Macrophages don’t kill it; the organism inhibits lysosome-phagosome fusion and grows in the phagosome.","Macrophages convert it into a toxigenic phage that inactivates EF2.","The organism is killed by pasteurization inside the phagosome only."],"a":2,"qk":"레지오넬라 발병기전에서 폐포 대식세포 아래에 적은 메모와, 섭취 뒤에 밑줄 쳐진 단계는 무엇입니까?","ok":["대식세포가 즉시 균을 죽이며, 균은 결코 파고솜에 들어가지 않는다.","균은 케라틴에만 살고 대식세포를 만나지 않는다.","대식세포는 균을 죽이지 못하며(doesn’t kill it), 균은 리소좀-파고솜 융합을 억제하고 파고솜 안에서 자란다.","대식세포가 균을 EF2를 불활성화하는 독소원성 파지로 바꾼다.","균은 파고솜 안에서만 저온살균으로 죽는다."],"exp":"**폐포 대식세포(alveolar macrophages)**에 밑줄이 있고 아래에 **죽이지 못한다(doesn’t kill it)**고 적혀 있습니다. 이어서 **리소좀-파고솜 융합을 억제한다(Inhibits lysosome-phagosome fusion)**에 밑줄이 있고, 파고솜 안에서 자랍니다. 단백분해효소 등도 조직 손상을 일으킨다고 밑줄 쳐져 있습니다.","why":{"0":"대식세포가 즉시 죽이는 것이 아니라, 죽이지 못한다고 적혀 있습니다.","1":"흡입된 균은 폐포 대식세포에 잡아먹힙니다.","3":"EF2 불활성화는 디프테리아 독소입니다.","4":"저온살균은 결핵균 세포벽 설명에서 ‘죽이는 조건’으로 나온 것이지, 파고솜 안의 레지오넬라 이야기가 아닙니다."},"one":"폐포 대식세포는 레지오넬라를 죽이지 못하고, 균은 리소좀-파고솜 융합을 억제한 채 파고솜에서 자란다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 34","img":[{"u":"img/w11_resp_inf/p34.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 34"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-44":{"q":"Which clinical grouping and cough annotation were written on the Legionnaires’ disease list?","o":["Currant-jelly sputum only, because the organism is extracellular.","A whooping inspiratory sound only, with no systemic symptoms.","Bull-neck and a gray pharyngeal membrane only.","Myalgia, headache, fever, and diarrhea were braced as flu-like symptoms, and the cough is generally nonproductive because of the organism’s intracellular nature.","Cottage-cheese oral patches after antibiotics only."],"a":3,"qk":"재향군인병 증상 목록에 적어 둔 묶음과 기침에 대한 주석은 무엇입니까?","ok":["균이 세포 밖이라서 건포도 젤리 가래만 난다.","전신 증상 없이 들이쉴 때의 휘핑 소리만 난다.","황소목과 회색 인두 위막만 있다.","근육통, 두통, 발열, 설사가 독감 비슷한 증상(flu-like symptoms)으로 묶이고, 기침은 세포 내 성질 때문에 대개 비생산성이다.","항생제 후의 코티지치즈 구강 반만 있다."],"exp":"근육통, 두통, 발열, 설사가 중괄호로 **독감 비슷한 증상(flu-like symptoms)**으로 묶여 있습니다. **대개 비생산성 기침(nonproductive cough)**에 밑줄이 있고, 아래에 **세포 내 성질 때문에(due to intracellular nature)**라고 적혀 있습니다.","why":{"0":"건포도 젤리 가래는 클렙시엘라이며, 레지오넬라 기침은 비생산성이라고 적혀 있습니다.","1":"휘핑 소리는 백일해의 소견입니다.","2":"황소목·위막은 디프테리아입니다.","4":"코티지치즈 반은 칸디다 아구창입니다."},"one":"재향군인병은 독감 비슷한 전신 증상과, 세포 내 성질 때문에 비생산성인 기침이 특징이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 35","img":[{"u":"img/w11_resp_inf/p35.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 35"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-45":{"q":"What kind of antibiotics were annotated as needed for Legionella, with which examples listed?","o":["Topical nystatin only, because the organism is a fungus.","Inhaled ribavirin only, because it is a virus.","Penicillin alone, because the wall is pure peptidoglycan.","Isoniazid monotherapy for 5 days only.","Antibiotics that can penetrate the cell, such as levofloxacin and azithromycin."],"a":4,"qk":"레지오넬라 치료에 ‘세포를 뚫고 들어가야 한다’고 주석된 항생제와, 예시로 나열된 약은 무엇입니까?","ok":["진균이라서 국소 니스타틴만.","바이러스라서 흡입 리바비린만.","세포벽이 순수 펩티도글리칸이라서 페니실린 단독만.","이소니아지드 5일 단독만.","세포 안으로 들어갈 수 있는 항생제이며, 예는 레보플록사신과 아지트로마이신이다."],"exp":"‘사람 세포를 효과적으로 통과하는 항생제’ 아래에 **세포 안으로 들어갈 수 있어야 한다(that can penetrate the cell)**는 화살표 주석이 있습니다. 예시로 **레보플록사신(levofloxacin)**과 **아지트로마이신(azithromycin)**이 나열되어 있습니다. 균이 대식세포 안에 살기 때문에 세포 내 농도가 되는 약이 필요합니다.","why":{"0":"레지오넬라는 세균이지 진균이 아닙니다.","1":"레지오넬라는 세균이지 바이러스가 아닙니다.","2":"페니실린 단독이 이 주석의 약이 아닙니다. 세포 투과가 핵심입니다.","3":"이소니아지드는 결핵 치료약입니다."},"one":"레지오넬라는 세포 안으로 들어가는 항생제(레보플록사신, 아지트로마이신)가 필요하다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 36","img":[{"u":"img/w11_resp_inf/p36.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 36"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-46":{"q":"Which two environmental measures were underlined for Legionella prevention?","o":["Hyper-chlorinate water, and heat water to greater than 70°C.","Pasteurize sputum specimens only, and avoid all sunlight.","Vaccinate cattle, and boil only bottled juice.","Apply topical steroids to cooling towers.","Quarantine infected birds and avoid raw eggs only."],"a":0,"qk":"레지오넬라 예방으로 밑줄 쳐진 환경 조치 두 가지는 무엇입니까?","ok":["물을 고농도 염소 처리(hyper-chlorinate)하고, 물을 70°C보다 높게 가열한다.","객담 검체만 저온살균하고 햇빛을 모두 피한다.","소에 백신을 주고 병주스만 끓인다.","냉각탑에 국소 스테로이드를 바른다.","감염된 새만 격리하고 생계란만 피한다."],"exp":"**물을 고농도 염소 처리(Hyper-chlorinate water)**와 **물을 70°C보다 높게 가열(Heat water to > 70°C)**하여 수원을 소독한다는 두 줄에 밑줄이 쳐져 있습니다. 분무되는 물 속 균을 줄이는 것이 예방의 핵심입니다.","why":{"1":"객담 저온살균·햇빛은 결핵균 세포벽 생존 조건의 이야기입니다.","2":"소 백신은 이 예방 밑줄이 아닙니다.","3":"국소 스테로이드는 백선을 가리는 잘못된 처치로 나온 내용입니다.","4":"감염된 새 격리는 앵무병(C. psittaci) 예방입니다."},"one":"레지오넬라 예방은 물의 고농도 염소 처리와 70°C 초과 가열이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 37","img":[{"u":"img/w11_resp_inf/p37.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 37"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-47":{"q":"Which transmission source and clinical picture were marked for Chlamydia psittaci?","o":["Person-to-person droplets only; typical lobar pneumonia with rusty sputum.","Inhalation of dust containing dried bird feces; atypical pneumonia that resembles influenza.","Raw cow’s milk only; miliary lesions in every host.","Armadillo bite only; leonine facies from the first day.","Cooling-tower mist only; whooping cough in infants."],"a":1,"qk":"클라미디아 프시타시(Chlamydia psittaci)에서 표시된 전파원과 임상 양상은 무엇입니까?","ok":["사람 사이 비말만이며, 녹슨 가래의 전형 대엽 폐렴.","말린 새 배설물이 든 먼지(dried bird feces)의 흡입이며, 인플루엔자와 비슷한 비정형 폐렴.","생우유만이며, 모든 숙주에서 속립 병터.","아르마딜로 교상만이며, 첫날부터 사자얼굴.","냉각탑 안개만이며, 영아의 백일해."],"exp":"**말린 새 배설물(dried bird feces)**이 박스 쳐져 있고, **먼지(dust containing)**에도 밑줄이 있습니다. 임상에서는 **인플루엔자와 비슷한 비정형 폐렴(Atypical pneumonia that resembles influenza)**에 밑줄이 쳐져 있습니다. 잠복기 5–14일은 따로 별표가 있습니다.","why":{"0":"전형 대엽·녹슨 가래는 폐렴구균에 가깝습니다. 앵무병은 비정형 폐렴입니다.","2":"생우유·속립은 마이코박테리아 쪽 이야기입니다.","3":"아르마딜로·사자얼굴은 나병의 이야기입니다.","4":"냉각탑 안개·백일해는 레지오넬라·보르데텔라입니다."},"one":"앵무병은 말린 새 배설물 먼지 흡입으로 옮고, 인플루엔자와 비슷한 비정형 폐렴을 일으킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 40","img":[{"u":"img/w11_resp_inf/p40.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 40"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-48":{"q":"Which Mycoplasma pneumoniae mechanism and disease name were underlined?","o":["Formation of a gray pharyngeal pseudomembrane; “bull neck.”","Inactivation of EF2; “Lockjaw.”","Secretion of exotoxin with destruction of cilia and ciliated cells; atypical “walking pneumonia,” in which the patient remains ambulatory.","Production of cord factor only; “miliary TB.”","IgA protease only; “chancroid.”"],"a":2,"qk":"마이코플라스마 폐렴균에서 밑줄 쳐진 기전과 병명은 무엇입니까?","ok":["회색 인두 위막 형성; ‘황소목’.","EF2 불활성화; ‘개구장애’.","외독소(exotoxin) 분비와 섬모·섬모세포 파괴; 환자가 걸어 다닐 수 있는 비정형 ‘보행 폐렴(walking pneumonia)’.","코드 인자만 생산; ‘속립 결핵’.","IgA 단백분해효소만; ‘연성하감’."],"exp":"**외독소(exotoxin)**와 **섬모 및 섬모세포를 파괴한다(Destroys cilia and ciliated cells)**에 밑줄이 쳐져 있습니다. 질환명은 비정형 폐렴, 일명 **보행 폐렴(walking pneumonia)**으로 밑줄 쳐져 있고, 병 중에도 환자가 걸어 다닐 수 있다는 뜻입니다.","why":{"0":"위막·황소목은 디프테리아입니다.","1":"EF2 불활성화도 디프테리아 독소입니다.","3":"코드 인자·속립 결핵은 결핵균의 이야기입니다.","4":"IgA 단백분해효소·연성하감은 헤모필루스의 이야기입니다."},"one":"마이코플라스마는 외독소로 섬모를 파괴하며, 걸어 다닐 수 있는 보행 폐렴을 일으킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 45","img":[{"u":"img/w11_resp_inf/p45.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 45"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-49":{"q":"Klebsiella was handwritten as which kind of pneumonia, and which transmission and mechanism phrases were underlined?","o":["Atypical only; spread only by bird feces; no biofilm.","Walking pneumonia only; spread only by cooling-tower mist; no capsule.","Whooping cough only; spread only by fomites in spas; no adhesion.","Typical pneumonia; primarily direct person-to-person contact (not typically airborne), and it produces a thick biofilm.","Fungal pneumonia only; spread only by arthroconidia; no human cases."],"a":3,"qk":"클렙시엘라는 손글씨로 어떤 폐렴이라고 적혀 있고, 전파와 기전에서 밑줄 쳐진 구절은 무엇입니까?","ok":["비정형만이며 새 배설물로만 퍼지고 생물막이 없다.","보행 폐렴만이며 냉각탑 안개로만 퍼지고 피막이 없다.","백일해만이며 온천 매개물로만 퍼지고 부착이 없다.","전형 폐렴(typical pneumonia)이며, 주로 사람 사이 직접 접촉으로 퍼지고(공기로는 잘 안 퍼지며), 두꺼운 생물막(thick biofilm)을 만든다.","진균 폐렴만이며 분절포자로만 퍼지고 사람 감염이 없다."],"exp":"제목 아래에 **전형 폐렴(Typical pneumonia)**이라고 손글씨로 적혀 있습니다. 요약표에서는 **주로 사람 사이 직접 접촉(Primarily by direct person to person contact)**과 **두꺼운 생물막(thick biofilm)**에 밑줄이 있습니다. 공기로는 전형적으로 퍼지지 않는다고 나와 있습니다.","why":{"0":"전형 폐렴이라고 적혀 있고, 새 배설물은 앵무병의 경로입니다.","1":"보행 폐렴은 마이코플라스마이며, 클렙시엘라는 전형 폐렴입니다.","2":"백일해는 보르데텔라입니다.","4":"클렙시엘라는 그람 음성 세균의 전형 폐렴입니다."},"one":"클렙시엘라는 전형 폐렴이며, 주로 직접 접촉으로 퍼지고 두꺼운 생물막을 만든다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 46, 48","img":[{"u":"img/w11_resp_inf/p46.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 46"},{"u":"img/w11_resp_inf/p48.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 48"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-50":{"q":"Besides the classic currant-jelly sputum, which host, capsule, and extra-site points were underlined for Klebsiella pneumoniae?","o":["It lacks a capsule and infects only healthy athletes’ hair shafts.","It has a thin teichoic-acid wall and infects only the meninges of neonates.","It is a wall-less organism that requires cholesterol and never causes UTI.","It is acid-fast and grows only in the armadillo footpad.","It has a large polysaccharide capsule, causes disease mainly in patients with underlying disease or alcoholism, and can cause UTI in patients with urinary catheters."],"a":4,"qk":"단골인 건포도 젤리 가래 외에, 클렙시엘라에서 밑줄 쳐진 숙주·피막·다른 부위 포인트는 무엇입니까?","ok":["피막이 없고 건강한 운동선수의 모간만 감염시킨다.","얇은 테이코산 벽만 있고 신생아 수막만 감염시킨다.","세포벽이 없고 콜레스테롤이 필요하며 요로감염은 절대 일으키지 않는다.","항산성이며 아르마딜로 발바닥에만 자란다.","큰 다당 피막이 있고, 주로 기저 질환이나 알코올 중독 환자에서 병을 일으키며, 도뇨관 환자에서 요로감염도 일으킬 수 있다."],"exp":"**큰 다당 피막(large polysaccharide capsule)**에 밑줄이 있습니다. **기저 질환 또는 알코올 중독(underlying disease or alcoholism)** 환자에서 주로 병을 일으키고, 알코올 중독·당뇨·폐 기능이 떨어진 사람에서 폐렴의 흔한 원인이라고 밑줄 쳐져 있습니다. 아래쪽 **요로감염(UTI)**에도 밑줄이 있어, 도뇨관 환자에서의 요로감염이 강조됩니다. 건포도 젤리 가래와 농양 순위는 따로 ‘단골 문제’로 표시되어 있습니다.","why":{"0":"큰 다당 피막이 있다고 밑줄 쳐져 있습니다. 모간 감염은 피부사상균입니다.","1":"신생아 수막만이 이 밑줄의 내용이 아닙니다.","2":"세포벽이 없는 것은 마이코플라스마입니다. 클렙시엘라는 요로감염도 일으킵니다.","3":"항산성·아르마딜로는 마이코박테리아의 이야기입니다."},"one":"클렙시엘라는 큰 다당 피막을 가지고, 기저 질환·알코올 중독 환자에서 잘 오며, 도뇨관 요로감염도 일으킨다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 47","img":[{"u":"img/w11_resp_inf/p47.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 47"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-51":{"q":"Which mycobacterial cell-wall properties were underlined regarding composition, survival, and killing?","o":["The wall is about 60% lipid including mycolic acid, is waxy and resists many disinfectants, remains viable for weeks in sputum or bedding, and is killed by heat, pasteurization, and sunlight.","The wall is pure peptidoglycan only and is instantly killed by drying.","The wall lacks lipid and is stained easily with ordinary Gram reagents.","The wall is chitin, so only azoles can damage it.","The wall is cholesterol-rich and therefore requires Sabouraud agar only."],"a":0,"qk":"마이코박테리아 세포벽에서 조성·생존·사멸에 대해 밑줄 쳐진 성질은 무엇입니까?","ok":["세포벽의 약 60%가 마이콜산을 포함한 지질이고, 왁스처럼 많은 소독제에 버티며, 객담이나 침구에서 수주 생존하고, 열·저온살균·햇빛에 죽는다.","순수 펩티도글리칸뿐이며 건조에 즉시 죽는다.","지질이 없어 일반 그람 염색에 쉽게 물든다.","키틴 벽이라 아졸만 손상시킬 수 있다.","콜레스테롤이 많아 사부로 한천에서만 자란다."],"exp":"**60% lipid**(마이콜산 포함), **왁스 같은 세포 표면(waxy cell surface)**, **많은 화학 소독제·정균제·건조에 끄떡없다(impervious)**, **객담·침구 등에서 수주 생존(viable for weeks)**, 그리고 **열, 저온살균, 햇빛(heat, pasteurization, and sunlight)**에 죽는다는 구절들이 모두 밑줄 쳐져 있습니다. 지질이 많은 벽이 항산성 염색과 환경 생존력의 바탕입니다.","why":{"1":"펩티도글리칸만의 벽이 아니며, 건조에 바로 죽지 않고 수주 버틴다고 밑줄 쳐져 있습니다.","2":"지질이 풍부해서 그람 염색 시약이 잘 들어가지 않습니다.","3":"키틴·아졸은 진균의 이야기입니다.","4":"콜레스테롤 요구·사부로 한천은 진균/마이코플라스마 쪽에 가깝습니다."},"one":"결핵균 세포벽은 지질이 많고 왁스 같아 소독제에 버티며, 열·저온살균·햇빛에 죽는다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 54","img":[{"u":"img/w11_resp_inf/p54.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 54"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-52":{"q":"Sulfatides (sulfolipids), which were boxed with the other mycobacterial virulence factors, have which underlined or listed function?","o":["They inactivate elongation factor 2 in the pharynx.","They inhibit phagosome-lysosome fusion, allowing the organism to survive intracellularly.","They form a gray pseudomembrane on the tonsils.","They are the same molecule as the Hib PRP capsule.","They are the dye used in the Ziehl-Neelsen stain."],"a":1,"qk":"다른 독성인자와 함께 박스 쳐진 설파티드(sulfatides, sulfolipids)의 기능은 무엇입니까?","ok":["인두에서 신장인자 2를 불활성화한다.","파고솜-리소좀 융합을 억제해 균이 세포 안에서 살아남게 한다.","편도에 회색 위막을 만든다.","Hib의 PRP 피막과 같은 분자이다.","질-넬슨 염색에 쓰이는 염료이다."],"exp":"**Sulfatides(설파티드, sulfolipids)**가 박스 쳐져 있고, 기능은 **파고솜-리소좀 융합을 억제**하여 균이 **세포 안에서 살아남게** 하는 것입니다. 코드 인자(트레할로스 디미콜레이트)와 세포벽 골격(예전 이름 Wax D)도 같은 표에서 박스 쳐져 있습니다.","why":{"0":"EF2 불활성화는 디프테리아 독소입니다.","2":"회색 위막은 디프테리아입니다.","3":"PRP 피막은 Hib의 주된 독성인자입니다.","4":"설파티드는 염색 시약이 아니라 균의 독성인자입니다."},"one":"설파티드는 파고솜-리소좀 융합을 막아 결핵균이 세포 안에서 살아남게 한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-53":{"q":"The boxed cell-wall skeleton of M. tuberculosis, formerly called Wax D, was listed as doing what?","o":["Inhibiting neutrophil migration only.","Lysing red cells to produce rusty sputum.","Inducing a delayed-type hypersensitivity reaction.","Binding factor H to block the membrane-attack complex.","Serving as the antigen in the Quellung reaction."],"a":2,"qk":"박스 쳐진 결핵균 세포벽 골격(예전 이름 Wax D)의 기능으로 적힌 것은 무엇입니까?","ok":["호중구 이동만 억제한다.","적혈구를 용혈시켜 녹슨 가래를 만든다.","지연형 과민반응(delayed-type hypersensitivity)을 유도한다.","인자 H에 결합해 막공격복합체를 막는다.","퀠룽 반응의 항원 역할을 한다."],"exp":"**세포벽 골격(Cell wall skeleton: Mycolic acid-Arabinogalactan-Peptidoglycan complex, MAPc)**, 예전 이름 **Wax D**가 박스 쳐져 있습니다. 기능은 **지연형 과민반응(delayed-type hypersensitivity reaction)을 유도**하는 것입니다. 코드 인자와 설파티드와 함께 ‘두 용어를 모두 알라’는 표의 한 줄입니다.","why":{"0":"호중구 이동 억제는 코드 인자의 기능으로 밑줄 쳐져 있습니다.","1":"녹슨 가래는 폐렴구균 삼출의 소견입니다.","3":"인자 H 결합은 이 박스의 내용이 아닙니다.","4":"퀠룽 반응은 피막 다당을 보는 검사이며, 폐렴구균·히브 등에 나옵니다."},"one":"세포벽 골격(예전 이름 Wax D)은 지연형 과민반응을 유도한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-54":{"q":"Besides being trehalose dimycolate and making serpentine cords, which two functions of cord factor were underlined?","o":["Degrading secretory IgA and inactivating EF2.","Forming a polysaccharide capsule and a thick biofilm.","Inducing only immediate anaphylaxis and complement lysis.","Inhibiting mitochondrial respiration and inhibiting neutrophil migration.","Binding cholesterol and forming endosporulating spherules."],"a":3,"qk":"코드 인자가 트레할로스 디미콜레이트이며 사행색을 만든다는 점 외에, 밑줄 쳐진 기능 두 가지는 무엇입니까?","ok":["분비형 IgA를 분해하고 EF2를 불활성화한다.","다당 피막과 두꺼운 생물막을 만든다.","즉시형 아나필락시스와 보체 용혈만 유도한다.","미토콘드리아 호흡을 억제하고, 호중구 이동을 억제한다.","콜레스테롤에 결합하고 내생포자 구상체를 만든다."],"exp":"코드 인자 상자에서 **미토콘드리아 호흡(mitochondrial respiration)**과 **호중구(neutrophil)** 이동 억제에 밑줄이 쳐져 있습니다. 액체 배지에서 사행색(serpentine cords)을 이루게 하는 것도 같은 줄의 기능입니다. 분자 이름 트레할로스 디미콜레이트는 ‘두 용어를 모두 알라’고 따로 적혀 있습니다.","why":{"0":"IgA 분해는 헤모필루스, EF2는 디프테리아입니다.","1":"큰 다당 피막·생물막은 클렙시엘라 쪽에 밑줄 쳐진 내용입니다.","2":"즉시형 아나필락시스가 이 밑줄의 기능이 아닙니다. 세포벽 골격이 유도하는 것은 지연형 과민입니다.","4":"구상체는 콕시디오이데스입니다."},"one":"코드 인자는 미토콘드리아 호흡과 호중구 이동을 억제한다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 56","img":[{"u":"img/w11_resp_inf/p56.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 56"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-55":{"q":"On the laboratory-identification table, which epidemiologic and clinical underlines describe pulmonary versus advanced versus miliary TB?","o":["Pulmonary TB is rare; advanced disease is painless hematuria only; miliary TB stays in one lobe.","Extrapulmonary TB is the majority; advanced disease is only otitis; miliary TB never enters blood.","Only latent infection produces cough; advanced disease is bull neck; miliary TB is a skin ulcer.","Only children under 2 are affected; advanced disease is whooping; miliary TB is walking pneumonia.","Pulmonary TB is the majority of cases, advanced cases may spit blood, and miliary TB reflects widespread bloodstream dissemination."],"a":4,"qk":"검사실 동정 표에서, 폐결핵·진행된 경우·속립 결핵에 대해 밑줄 쳐진 내용은 무엇입니까?","ok":["폐결핵은 드물고, 진행은 통증 없는 혈뇨뿐이며, 속립 결핵은 한 엽에만 머문다.","폐외 결핵이 대다수이고, 진행은 중이염뿐이며, 속립 결핵은 혈액에 절대 안 들어간다.","잠복 감염만 기침을 만들고, 진행은 황소목이며, 속립 결핵은 피부 궤양이다.","2세 미만만 걸리고, 진행은 백일해이며, 속립 결핵은 보행 폐렴이다.","폐결핵이 대다수이고, 진행된 경우는 객혈을 할 수 있으며, 속립 결핵은 광범위한 혈행 파종이다."],"exp":"**폐결핵(Pulmonary TB)은 대다수(majority of cases)**, 진행된 경우는 **객혈(spitting blood, advanced cases)**, 속립 결핵(miliary TB)은 여러 장기에  Tiny lesions가 동시에 생기는 **광범위한 혈행 파종(widespread bloodstream dissemination)**이라고 밑줄 쳐져 있습니다. 속립 결핵이 가장 심하다는 점도 같은 표에 나와 있습니다.","why":{"0":"폐결핵이 드물다는 것이 아니라 대다수라고 밑줄 쳐져 있습니다.","1":"폐외 결핵은 소수(minority)라고 밑줄 쳐져 있고, 속립은 혈행 파종입니다.","2":"황소목·피부 궤양은 디프테리아 소견입니다.","3":"2세 미만·백일해는 보르데텔라의 이야기입니다."},"one":"폐결핵이 대다수이고, 진행 시 객혈이 있으며, 속립 결핵은 광범위한 혈행 파종이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 59","img":[{"u":"img/w11_resp_inf/p59.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 59"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-56":{"q":"On the PPD schematic, what was written as the source of the hardening in a positive reaction?","o":["Memory cells, T-helper 1 cells, and cytokines.","Immediate neutrophil-only pus, without lymphocytes.","A diphtheria pseudomembrane at the injection site.","Erythema alone, which should be measured instead of induration.","Cord-factor crystals deposited in the epidermis only."],"a":0,"qk":"PPD 모식도에서, 양성 반응의 경결(hardening)을 만든다고 적어 둔 것은 무엇입니까?","ok":["기억세포, 제1형 도움 T세포(T-helper 1), 사이토카인.","림프구 없이 호중구 고름만.","주사 부위의 디프테리아 위막.","경결 대신 재야 하는 홍반만.","표피에만 쌓인 코드 인자 결정."],"exp":"양성 반응의 단단한 융기(hardening)에 화살표를 긋고 **기억세포, 제1형 도움 T세포, 사이토카인(memory cells, T-helper 1 cells, cytokines)**에서 온다고 적혀 있습니다. 즉 경결은 지연형 과민의 세포면역 반응입니다. 양성은 활동성 질환을 뜻하지 않으며, 고위험 ≥5 mm, 중등도 ≥10 mm, 저위험 ≥15 mm 컷오프는 따로 박스·원으로 표시되어 있습니다.","why":{"1":"경결의 주석은 기억 T세포·Th1·사이토카인이지, 호중구 고름만이 아닙니다.","2":"디프테리아 위막이 주사 자리에 생긴다는 주석이 아닙니다.","3":"재는 것은 홍반이 아니라 경결입니다.","4":"코드 인자 결정이 표피에 쌓인다는 주석이 아닙니다."},"one":"PPD 경결은 기억세포, Th1 세포, 사이토카인에 의한 반응이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 60","img":[{"u":"img/w11_resp_inf/p60.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 60"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-57":{"q":"On the chest radiograph shown for a PPD-positive patient, what did the handwritten label identify in the active-TB film?","o":["A completely normal lung with no air-space change.","Fluid pockets (a cavity) in the patient’s right upper lobe.","Bilateral bull-neck soft-tissue swelling only.","A renal stone, unrelated to the chest.","Only a foreign body in the stomach."],"a":1,"qk":"PPD 양성자를 위해 보여 준 흉부 방사선 사진에서, 활동성 결핵 영상에 손글씨로 표시한 것은 무엇입니까?","ok":["공기 공간 변화가 전혀 없는 완전히 정상 폐.","오른쪽 상엽의 체액 주머니(fluid pockets), 즉 공동(cavity).","양쪽 황소목 연부조직 종창만.","흉부와 무관한 신장 결석.","위에만 있는 이물."],"exp":"활동성 결핵 사진의 화살표가 가리키는 오른쪽 상엽 병터에 **fluid pockets**라고 적혀 있습니다. 캡션은 환자의 오른쪽 상엽 공동(cavity)을 가리킨다고 하고, 아래 제목은 **PPD 양성자를 위한 흉부 방사선 사진**입니다. 정상 사진에는 성장이나 체액·공기 주머니가 없다고 나와 있습니다.","why":{"0":"왼쪽은 정상 사진입니다. 손글씨는 활동성 결핵 쪽 공동에 적혀 있습니다.","2":"황소목은 디프테리아의 목 소견이지, 이 흉부 사진의 표시가 아닙니다.","3":"신장 결석이 이 사진의 표기가 아닙니다.","4":"위 이물이 이 사진의 표기가 아닙니다."},"one":"PPD 양성자의 활동성 결핵 사진에는 상엽 공동(체액 주머니)이 표시되어 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 62","img":[{"u":"img/w11_resp_inf/p62.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 62"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-58":{"q":"The often-used TB regimen, circled as RIPE, is which schedule?","o":["Dapsone plus clofazimine only, for 5 days.","A single dose of BCG given after the chest film.","Rifampin, isoniazid, pyrazinamide, and ethambutol for the first 2 months, then rifampin plus isoniazid for the remaining 4 or 7 months (6- or 9-month courses).","Streptomycin monotherapy indefinitely.","No drugs are used if the PPD is positive, regardless of the chest film."],"a":2,"qk":"RIPE로 원 쳐진, 흔히 쓰는 결핵 치료 일정은 무엇입니까?","ok":["답손과 클로파지민만 5일.","흉부 사진 뒤에 BCG 한 번만.","처음 2개월은 리팜핀, 이소니아지드, 피라진아미드, 에탐부톨이고, 남은 4또는 7개월은 리팜핀과 이소니아지드이다(전체 6또는 9개월).","스트렙토마이신 무기한 단독.","PPD가 양성이면 흉부 사진과 상관없이 약을 쓰지 않는다."],"exp":"**흔히 쓰는 요법(Often used regimen, 6 or 9 months)**에 밑줄이 있고, **RIPE**(리팜핀, 이소니아지드, 피라진아미드, 에탐부톨)가 원으로 쳐져 있습니다. **처음 2개월**은 네 약을 쓰고, 이후 **4또는 7개월**은 리팜핀과 이소니아지드만 씁니다. 약제 감수성 폐결핵은 많은 환자에서 6개월 요법을 쓸 수 있다고 나와 있습니다.","why":{"0":"답손·클로파지민은 나병 다제요법의 약입니다.","1":"BCG는 예방 백신이지, RIPE 치료 일정이 아닙니다.","3":"단독 스트렙토마이신 무기한이 이 원 친 요법이 아닙니다.","4":"활동성 결핵은 다제 치료가 필요합니다. PPD 양성만으로 약을 안 쓰는 지침이 이 요법의 내용이 아닙니다."},"one":"RIPE는 처음 2개월 네 약, 이후 4또는 7개월은 리팜핀과 이소니아지드이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 65","img":[{"u":"img/w11_resp_inf/p65.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 65"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-59":{"q":"Which culture points were underlined for Mycobacterium leprae?","o":["It grows overnight on ordinary blood agar in every clinical lab.","It is the fastest-growing mycobacterium on Middlebrook medium alone.","It forms pigmented colonies in 24 hours on MacConkey agar.","It does not grow on artificial media, but can be grown in the mouse footpad and in the armadillo, its natural hosts.","It is identified only by a positive Quellung reaction."],"a":3,"qk":"나균(Mycobacterium leprae) 배양에서 밑줄 쳐진 내용은 무엇입니까?","ok":["모든 검사실의 일반 혈액 한천에서 하룻밤에 자란다.","미들브룩 배지에서만 가장 빨리 자라는 마이코박테리아이다.","맥콘키 한천에서 24시간 만에 색소 집락을 만든다.","인공 배지에서는 자라지 않고, 천연 숙주인 마우스 발바닥과 아르마딜로에서 기를 수 있다.","퀠룽 반응 양성으로만 동정한다."],"exp":"**인공 배지에서는 자라지 않는다(No growth on artificial media)**에 밑줄이 있습니다. 실험동물에서도 키우기 어렵지만, 예외가 **마우스 발바닥(mouse footpad)**과 **아르마딜로(armadillo)**이며, 이들이 천연 숙주라고 밑줄 쳐져 있습니다.","why":{"0":"일반 혈액 한천에서 하룻밤에 자라지 않습니다. 인공 배지에서 안 자란다고 밑줄 쳐져 있습니다.","1":"미들브룩·뢰벤슈타인–옌센은 결핵균 배지로 별표 쳐진 내용입니다.","2":"맥콘키 한천은 장내세균 선택 배지입니다.","4":"퀠룽 반응은 피막 검사이지 나균 배양의 밑줄 내용이 아닙니다."},"one":"나균은 인공 배지에서 안 자라고, 마우스 발바닥과 아르마딜로에서 기를 수 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 70","img":[{"u":"img/w11_resp_inf/p70.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 70"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-60":{"q":"Besides preferring cooler body parts because it is temperature-sensitive, which transmission and host points were underlined for leprosy?","o":["A single casual handshake is sufficient; adults are far more susceptible than children.","Spread occurs only by raw milk; only the elderly are at risk.","Spread occurs only by cooling-tower mist; only pregnant women are at risk.","No human-to-human spread occurs; only soil exposure matters.","Prolonged close contact with untreated leprosy over many months is needed, primarily by inhalation, and children are more susceptible than adults."],"a":4,"qk":"온도 감수성 때문에 차가운 부위를 좋아한다는 점 외에, 나병의 전파와 숙주로 밑줄 쳐진 내용은 무엇입니까?","ok":["가벼운 악수 한 번으로 충분하고, 성인이 어린이보다 훨씬 잘 걸린다.","생우유로만 퍼지고, 노인만 위험하다.","냉각탑 안개로만 퍼지고, 임신부만 위험하다.","사람 사이 전파는 없고 흙 노출만 중요하다.","치료받지 않은 나병 환자와 여러 달에 걸친 가까운 접촉이 필요하며, 주로 흡입이고, 어린이가 성인보다 잘 걸린다."],"exp":"**가까운 접촉(close contact)**을 **여러 달(over many months)** 해야 옮고, 주된 경로는 **흡입(inhalation)**이라고 밑줄 쳐져 있습니다. **어린이(Children)**가 성인보다 잘 걸린다고 밑줄 쳐져 있고, 천천히 만성으로 진행해 **말초 신경염(peripheral neuritis)**에 이른다는 구절에도 밑줄이 있습니다. 차가운 부위(피부, 신경)를 좋아한다는 점은 따로 별표가 있습니다.","why":{"0":"가벼운 악수가 아니라 여러 달의 가까운 접촉이 필요하고, 어린이가 더 잘 걸린다고 밑줄 쳐져 있습니다.","1":"생우유는 M. bovis의 경로입니다.","2":"냉각탑 안개는 레지오넬라입니다.","3":"사람 사이 전파가 없다고 되어 있지 않습니다. 가까운 장기 접촉이 필요하다고 되어 있습니다."},"one":"나병은 여러 달의 가까운 접촉, 주로 흡입으로 옮고, 어린이가 더 잘 걸린다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 71","img":[{"u":"img/w11_resp_inf/p71.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 71"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-61":{"q":"Which points about leprosy nodules, immunity, and death were handwritten or underlined?","o":["Nodules are full of bacteria and immune cells; secondary infections occur because the immune system is compromised; leprosy is rarely the cause of death, and fatality is due to secondary infections such as tuberculosis.","Nodules are sterile keratin plugs; death is usually from acute diphtheria toxin.","The immune system is stronger than normal; death is inevitable in the first week.","Nodules contain only uric acid crystals; death is from bull-neck airway obstruction.","There is never bone resorption, and leprosy itself is the usual cause of death."],"a":0,"qk":"나병의 결절, 면역, 사망에 대해 손글씨나 밑줄로 강조된 내용은 무엇입니까?","ok":["결절은 균과 면역세포로 가득 차고, 면역이 떨어져 이차 감염이 생기며, 나병 자체가 사망 원인인 경우는 드물고 결핵 같은 이차 감염으로 죽는다.","결절은 무균 케라틴 마개이고, 사망은 대개 급성 디프테리아 독소 때문이다.","면역이 정상보다 강하고, 첫 주에 반드시 죽는다.","결절은 요산 결정만 있고, 사망은 황소목 기도 폐쇄 때문이다.","뼈 흡수는 절대 없고, 나병 자체가 흔한 사망 원인이다."],"exp":"**결절(nodules)**에 밑줄이 있고 옆에 **균과 면역세포 등으로 가득하다(full of bacteria, immune cells, etc.)**고 적혀 있습니다. **이차 감염** 옆에는 **면역이 떨어져 있다(immune system is compromised)**고 적혀 있습니다. 아래에서는 **나병 자체가 사망 원인인 경우는 드물고, 사망은 이차 감염(예: 결핵) 때문**이라고 밑줄 쳐져 있습니다. 뼈 흡수(bone resorption)에도 밑줄이 있습니다.","why":{"1":"결절은 균과 면역세포로 가득하다고 적혀 있습니다. 디프테리아 독소가 나병 사망의 주석이 아닙니다.","2":"면역이 떨어진다고 적혀 있고, 나병 자체로 첫 주에 반드시 죽는 것이 아닙니다.","3":"요산 결정·황소목은 이 주석의 내용이 아닙니다.","4":"뼈 흡수에 밑줄이 있고, 나병 자체는 드문 사망 원인이라고 적혀 있습니다."},"one":"나병 결절은 균과 면역세포로 가득하고, 사망은 대개 이차 감염 때문이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 72","img":[{"u":"img/w11_resp_inf/p72.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 72"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-62":{"q":"Which two leprosy deformities were underlined in the clinical photographs?","o":["Bull neck and a pharyngeal pseudomembrane.","Wrist-drop and claw hand.","Rusty sputum and currant-jelly cavities.","Cottage-cheese patches and diaper rash.","Keratin scalp plaques that fluoresce green."],"a":1,"qk":"나병 임상 사진에서 밑줄 쳐진 변형 두 가지는 무엇입니까?","ok":["황소목과 인두 위막.","손목처짐(wrist-drop)과 갈퀴손(claw hand).","녹슨 가래와 건포도 젤리 공동.","코티지치즈 반과 기저귀 발진.","초록 형광을 내는 케라틴 두피 반."],"exp":"엄지 감각 소실과 함께 **손목처짐(wrist-drop)**에 밑줄이 쳐져 있고, 다른 사진에서는 **갈퀴손(“Claw” hand)**에 밑줄이 쳐져 있습니다. 말초신경 손상으로 생기는 대표적인 손 변형입니다.","why":{"0":"황소목·위막은 디프테리아입니다.","2":"녹슨 가래는 폐렴구균, 건포도 젤리 가래는 클렙시엘라입니다.","3":"코티지치즈 반·기저귀 발진은 칸디다입니다.","4":"형광 두피 반은 일부 두부백선입니다."},"one":"나병의 손 변형으로 손목처짐과 갈퀴손이 밑줄 쳐져 있다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 73, 74","img":[{"u":"img/w11_resp_inf/p73.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 73"},{"u":"img/w11_resp_inf/p74.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 74"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-63":{"q":"How were the two types of leprosy annotated, and what oval statement was emphasized?","o":["Lepromatous disease is always 1° and mild; everyone who is infected develops disease.","Tuberculoid disease is always 2° and severe; infection always progresses.","Tuberculoid leprosy occurs 1° (mild) and lepromatous leprosy occurs 2° (severe); the great majority of infected people do not develop disease.","Both types are acute 48-hour illnesses that always reverse spontaneously.","Only tuberculoid disease is contagious; lepromatous disease never infects others."],"a":2,"qk":"나병의 두 형은 어떻게 주석되었고, 타원으로 강조된 문장은 무엇입니까?","ok":["나종형은 항상 1도이고 가벼우며, 감염된 사람은 모두 발병한다.","결핵형은 항상 2도이고 심하며, 감염은 항상 진행한다.","결핵형 나병은 1도(가벼움), 나종형 나병은 2도(중함)로 적혀 있고, 감염된 사람의 대다수는 발병하지 않는다.","두 형 모두 48시간 급성 병이며 항상 저절로 되돌아간다.","결핵형만 전염되고 나종형은 절대 남을 감염시키지 않는다."],"exp":"결핵형(tuberculoid) 위에는 **occurs 1° (mild)**, 나종형(lepromatous) 위에는 **occurs 2° (severe)**라고 적혀 있습니다. 아래 큰 타원에는 **감염된 사람의 대다수는 발병하지 않는다(Great majority of infected DO NOT develop disease)**고 강조되어 있습니다. 나종형이 감염력이 더 높고 면역이 더 떨어져 있습니다.","why":{"0":"방향이 반대입니다. 가벼운 1도는 결핵형입니다. 대다수는 발병하지 않는다고 타원으로 강조되어 있습니다.","1":"심한 2도는 나종형입니다. 감염된 사람 모두가 진행하는 것이 아닙니다.","3":"나병은 만성 경과이지 48시간 급성 병이 아니며, 손상은 치료가 되돌려 주지 못합니다.","4":"나종형이 감염력(high infectivity)이 더 높다고 나와 있습니다. 결핵형은 감염력이 낮습니다."},"one":"결핵형은 가벼운 1도, 나종형은 심한 2도이며, 감염된 사람의 대다수는 발병하지 않는다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 76","img":[{"u":"img/w11_resp_inf/p76.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 76"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-64":{"q":"Which limitation of modern leprosy treatment was wavy-underlined, and which prevention goal was underlined?","o":["Treatment never cures anyone, so prevention is unnecessary.","Treatment reverses all nerve damage within 48 hours.","Treatment is only topical nystatin, which fully rebuilds bone.","Treatment is highly effective and cures patients but does not reverse damage; early detection is needed to prevent irreversible physical and neurological damage.","The only prevention is cooling-tower chlorination."],"a":3,"qk":"현대 나병 치료의 한계로 물결 밑줄이 쳐진 내용과, 예방 목표로 밑줄 쳐진 내용은 무엇입니까?","ok":["치료는 아무도 못 고치므로 예방이 필요 없다.","치료는 48시간 안에 모든 신경 손상을 되돌린다.","치료는 국소 니스타틴뿐이며 뼈를 완전히 재건한다.","현재 치료는 매우 효과적이고 환자를 치유하지만 손상은 되돌리지 못하며, 되돌릴 수 없는 신체·신경 손상을 막으려면 조기 발견이 필요하다.","예방은 냉각탑 염소 처리뿐이다."],"exp":"‘현재 치료는 매우 효과적이고 환자를 치유하지만 **손상은 되돌리지 못한다(does not reverse damage)**’는 구절에 물결 밑줄이 쳐져 있습니다. 요약표 예방란에서는 **조기 발견으로 되돌릴 수 없는 신체적·신경학적 손상을 막는다**는 문장에 밑줄이 있습니다. 이미 생긴 변형은 약이 되돌리지 못하므로, 일찍 찾아 치료하는 것이 핵심입니다.","why":{"0":"치료는 효과적이고 치유한다고 나와 있습니다. 다만 손상은 되돌리지 못합니다.","1":"손상이 48시간에 되돌려진다는 밑줄이 아닙니다. 오히려 되돌리지 못한다고 적혀 있습니다.","2":"니스타틴은 칸디다 국소 약입니다. 나병 치료가 아닙니다.","4":"냉각탑 염소 처리는 레지오넬라 예방입니다."},"one":"나병 치료는 치유하지만 손상을 되돌리지는 못하므로, 조기 발견이 중요하다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 78, 79","img":[{"u":"img/w11_resp_inf/p78.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 78"},{"u":"img/w11_resp_inf/p79.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 79"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-65":{"q":"In the mycobacteria introduction, which two diseases were starred as the most alarming, and which pair was underlined as atypical / nontuberculous examples?","o":["Diphtheria and pertussis; the examples were S. pneumoniae and K. pneumoniae.","Psittacosis and walking pneumonia; the examples were C. psittaci and M. pneumoniae.","Legionnaires’ disease and chancroid; the examples were L. pneumophila and H. ducreyi.","Histoplasmosis and cryptococcosis; the examples were H. capsulatum and C. neoformans.","Tuberculosis and leprosy; the atypical examples were M. avium and M. intracellulare."],"a":4,"qk":"마이코박테리아 도입에서, 가장 심각한 두 질환으로 별표 쳐진 것과 비정형/비결핵성 예로 밑줄 쳐진 짝은 무엇입니까?","ok":["디프테리아와 백일해; 예는 폐렴구균과 클렙시엘라.","앵무병과 보행 폐렴; 예는 C. psittaci와 M. pneumoniae.","재향군인병과 연성하감; 예는 레지오넬라와 H. ducreyi.","히스토플라스마증과 크립토코쿠스증; 예는 H. capsulatum과 C. neoformans.","결핵과 나병이며, 비정형 예는 M. avium과 M. intracellulare이다."],"exp":"**결핵(Tuberculosis, M. tuberculosis)**과 **나병(Leprosy, M. leprae)**이 가장 심각한 두 질환으로 별표·괄호 쳐져 있습니다. 다른 종의 예로 M. bovis와 함께 **M. avium과 M. intracellulare**가 밑줄 쳐져 있고, 이들이 **비정형/비결핵성 마이코박테리아**라고 연결되어 있습니다.","why":{"0":"디프테리아·백일해는 이 도입의 별표 대상이 아닙니다.","1":"앵무병·보행 폐렴은 클라미디아·마이코플라스마입니다.","2":"재향군인병·연성하감은 레지오넬라·헤모필루스입니다.","3":"히스토플라스마·크립토코쿠스는 전신 진균입니다."},"one":"가장 심각한 마이코박테리아 질환은 결핵과 나병이고, 비정형 예는 M. avium과 M. intracellulare이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 51","img":[{"u":"img/w11_resp_inf/p51.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 51"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_pulm_phys-1":{"q":"What accounts for the difference between minute ventilation of alveoli and just ventilation?","o":["Breathing rate.","Anatomic dead space.","Tidal volume.","The FRC.","Forced vital capacity."],"a":1,"qk":"폐포 분당환기량(alveolar minute ventilation)과 그냥 분당환기량(minute ventilation)의 차이를 만드는 것은 무엇입니까?","ok":["호흡수(breathing rate)","해부학적 사강(anatomic dead space)","일회호흡량(tidal volume)","기능적 잔기량(FRC)","노력성 폐활량(forced vital capacity)"],"exp":"**핵심 공식**\n\n· 분당환기량(minute ventilation, VE) = 일회호흡량(tidal volume) × 호흡수(breathing rate)\n\n· 폐포 분당환기량(alveolar minute ventilation, VA) = (일회호흡량 − 사강 dead space) × 호흡수\n\n두 공식을 나란히 놓으면, 차이는 딱 하나 **사강(dead space)**뿐입니다. 숨을 한 번 쉬면 들이마신 공기 중 일부는 코·기관·기관지 같은 전도기도(conducting airways)에 그냥 머물렀다가 다시 나갑니다. 이 공기는 폐포(alveolus)까지 가지 못하므로 가스교환(gas exchange)에 쓰이지 않습니다. 이 부분이 해부학적 사강(anatomic dead space)입니다. 예를 들어 일회호흡량 500 mL, 사강 150 mL, 호흡수 12회라면 VE = 6,000 mL/min이지만 VA = 350 × 12 = 4,200 mL/min입니다. 차이 1,800 mL는 전부 사강 때문입니다.","why":{"0":"호흡수: 두 공식 모두에 똑같이 곱해지므로 \"차이\"를 만들지 않습니다.","2":"일회호흡량: 역시 두 공식 모두에 들어 있습니다. 차이를 만드는 것은 일회호흡량에서 빼는 사강입니다.","3":"FRC: 조용히 숨을 내쉰 뒤 폐에 남은 공기량으로, 환기량 공식과 관계가 없습니다.","4":"노력성 폐활량: 최대로 들이마신 뒤 힘껏 내쉰 양으로, 폐기능검사 지표이지 분당환기량 차이와는 무관합니다."},"one":"분당환기량과 폐포 분당환기량의 차이는 해부학적 사강(anatomic dead space) 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q1) / 8b. Pulmonary Physiology 2026.pdf, slide 10","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-2":{"q":"If CO2 production remains constant and alveolar ventilation is increased three-fold, the alveolar PCO2 after reaching a steady state will be what percentage of its former value?","o":["25","33","50","100","300"],"a":1,"qk":"CO₂ 생성량이 일정하게 유지되고 폐포환기량(alveolar ventilation)이 3배로 증가하면, 정상상태(steady state)에 도달한 후 폐포 PCO₂는 이전 값의 몇 %가 됩니까?","ok":["25","33","50","100","300"],"exp":"**핵심**\n\nCO₂ 생성량(VCO₂)이 일정하면 폐포 PCO₂(PACO₂)는 폐포환기량(VA)에 **반비례(inversely proportional)**합니다. 공식을 정리하면 PACO₂ = k × VCO₂/VA입니다.\n\nVA가 3배가 되면 PACO₂는 1/3, 즉 약 **33%**가 됩니다. 정상 40 mmHg라면 약 13 mmHg까지 떨어집니다. 쉽게 말하면, 몸이 만드는 CO₂ 양은 그대로인데 이를 씻어내는 공기를 3배로 넣어주니 폐포 안 CO₂ 농도가 1/3로 희석되는 것입니다.","why":{"0":"25: 4배로 증가했을 때의 값입니다.","2":"50: 2배로 증가했을 때의 값입니다.","3":"100: 환기량이 PCO₂에 영향을 주지 않는다는 뜻인데, 반비례 관계와 맞지 않습니다.","4":"300: 비례관계로 착각한 값입니다. 환기가 늘면 PCO₂는 오히려 줄어듭니다."},"one":"CO₂ 생성이 일정하면 폐포 PCO₂는 폐포환기량에 반비례하므로, 환기가 3배가 되면 PCO₂는 약 33%가 된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q2) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-3":{"q":"Which of the following is most likely to change during a heavy physical workout in a normal healthy individual?","o":["Anatomic dead space increases.","Alveolar ventilation increases.","Total lung volume decreases.","Tidal volume decreases.","Alveolar dead space ventilation increases."],"a":1,"qk":"정상적인 건강한 사람이 격렬한 운동을 할 때 가장 변할 가능성이 높은 것은 무엇입니까?","ok":["해부학적 사강이 증가한다.","폐포환기량(alveolar ventilation)이 증가한다.","총 폐용적(total lung volume)이 감소한다.","일회호흡량(tidal volume)이 감소한다.","폐포 사강 환기(alveolar dead space ventilation)가 증가한다."],"exp":"**정답 이유**\n\n운동하면 근육이 O₂를 많이 쓰고 CO₂를 많이 만듭니다. 몸은 동맥혈 PO₂와 PCO₂를 정상 범위로 유지하려고 일회호흡량과 호흡수를 조절합니다. 운동 중에는 일회호흡량과 호흡수가 모두 늘어 VA = (일회호흡량 − 사강) × 호흡수가 크게 **증가**합니다.","why":{"0":"해부학적 사강은 기도의 구조적 부피라 운동으로 의미 있게 늘지 않습니다.","2":"총 폐용적(TLC)은 폐의 최대 용량으로, 운동 한 번으로 줄어들지 않습니다.","3":"운동 중 일회호흡량은 오히려 증가합니다.","4":"폐포 사강(환기는 되나 관류가 안 되는 폐포)은 정상인에서 운동 시 늘지 않습니다. 오히려 심박출량이 늘어 폐 윗부분까지 혈류가 더 고르게 퍼지므로 줄어드는 쪽입니다. 폐포 사강 증가는 폐색전 같은 질환 상황입니다."},"one":"격렬한 운동 때는 일회호흡량과 호흡수가 늘어 폐포환기량(alveolar ventilation)이 증가한다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q3) / 8b. Pulmonary Physiology 2026.pdf, slides 10, 75","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10"},{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-4":{"q":"What accounts for the difference in PO2 between dry ambient air and air in the conducting airways?","o":["The diluting effect of CO2.","Water vapor in the ambient air.","Water vapor in the conducting airways.","Turbulence in the larger airways.","Resistance in the small airways."],"a":2,"qk":"건조한 대기(dry ambient air)와 전도기도(conducting airways) 안 공기 사이의 PO₂ 차이를 만드는 것은 무엇입니까?","ok":["CO₂의 희석 효과","대기 중의 수증기","전도기도 안의 수증기","큰 기도의 난류(turbulence)","작은 기도의 저항(resistance)"],"exp":"**핵심 공식**\n\nPIO₂ = (Pₐₜₘ − PH₂O) × 0.21 = (760 − 47) × 0.21 ≈ **150 mmHg** (해수면)\n\n건조한 대기의 PO₂는 760 × 0.21 ≈ 160 mmHg입니다. 그런데 공기가 코와 기도를 지나면서 체온(37℃)으로 데워지고 **수증기(water vapor)로 완전히 포화**됩니다. 37℃에서 수증기압은 47 mmHg로 항상 일정합니다. 전체 압력(760)은 그대로인데 그중 47 mmHg를 수증기가 차지하니, 나머지 기체(O₂, N₂)가 나눠 가질 압력이 713 mmHg로 줄어듭니다. 그래서 O₂ 분압이 약 150 mmHg로 낮아집니다 (돌턴의 법칙 Dalton's law, 공식표).","why":{"0":"CO₂ 희석은 폐포(alveolus)에서 일어나는 일입니다. 폐포 기체 공식 PAO₂ = PIO₂ − PₐCO₂/R에서 150 → 100으로 떨어지는 단계입니다. 전도기도 단계에는 해당하지 않습니다.","1":"문제에서 \"건조한(dry)\" 대기라고 했으므로 대기 중 수증기는 없다고 봅니다.","3":"난류와 저항은 공기 흐름(airflow)에 영향을 줄 뿐 분압을 바꾸지 않습니다.","4":"난류와 저항은 공기 흐름(airflow)에 영향을 줄 뿐 분압을 바꾸지 않습니다."},"one":"건조한 대기와 전도기도 공기 사이 PO₂ 차이는 기도에서 포화되는 수증기(47 mmHg) 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q4) / 8b. Pulmonary Physiology 2026.pdf, slide 12","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-5":{"q":"Which statement best describes pulmonary surfactant?","o":["It is a secretory product of type I alveolar pneumocytes.","It increases the work required to expand the lung.","It decreases the work of breathing.","It increases the surface tension of the alveolar lining liquid.","It increases the movement of fluid from the capillaries into the alveolar spaces."],"a":2,"qk":"폐 표면활성제(pulmonary surfactant)를 가장 잘 설명하는 것은 무엇입니까?","ok":["제1형 폐포세포(type I alveolar pneumocytes)의 분비물이다.","폐를 팽창시키는 데 필요한 일을 증가시킨다.","호흡일(work of breathing)을 감소시킨다.","폐포 내면 액체의 표면장력(surface tension)을 증가시킨다.","모세혈관에서 폐포 공간으로의 액체 이동을 증가시킨다."],"exp":"**정답 이유**\n\n폐포 안쪽은 얇은 물층으로 덮여 있습니다. 물 분자끼리 서로 당기는 힘, 즉 **표면장력(surface tension)** 때문에 폐포는 계속 쪼그라들려고 합니다. 제2형 폐포세포(type II pneumocyte)가 분비하는 표면활성제는 이 표면장력을 **낮춥니다**. 그 결과 폐가 잘 부풀고(순응도 compliance ↑), 숨을 들이쉴 때 필요한 힘, 즉 **호흡일(work of breathing)이 줄어듭니다**. 그 밖에 작은 폐포가 찌그러지는 것을 막고, 폐부종을 막는 기능도 있습니다 (\"numerous important functions\").","why":{"0":"표면활성제는 제1형이 아니라 **제2형** 세포가 만듭니다. 제1형은 폐포 표면의 약 95%를 덮어 가스교환 면을 이룹니다.","1":"정반대입니다. 폐를 팽창시키는 일을 줄여줍니다.","3":"표면장력을 높이는 것이 아니라 낮춥니다.","4":"표면장력은 모세혈관 액체를 폐포 쪽으로 끌어당기는 힘으로도 작용합니다. 표면활성제는 이를 줄여 폐포로 액체가 새는 것(폐부종 pulmonary edema)을 **막는** 쪽입니다."},"one":"폐 표면활성제(surfactant)는 표면장력을 낮춰 호흡일(work of breathing)을 감소시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q5) / 8b. Pulmonary Physiology 2026.pdf, slides 23, 26, 27","img":[{"u":"img/w11_pulm_phys/p23.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 23"},{"u":"img/w11_pulm_phys/p26.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 26"},{"u":"img/w11_pulm_phys/p27.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 27"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-6":{"q":"Air hunger while hiking at high altitude is caused by","o":["inhalation of dry atmospheric air.","a lower fraction of O2 in the inspired mountain air.","increased CO2 content in the inspired mountain air.","increased barometric pressure.","decreased barometric pressure."],"a":4,"qk":"고지대 등산 중 숨이 차는 느낌(air hunger)의 원인은 무엇입니까?","ok":["건조한 대기를 들이마시는 것","산 공기의 흡입 O₂ 분율(fraction)이 더 낮은 것","산 공기의 CO₂ 함량 증가","기압(barometric pressure) 증가","기압(barometric pressure) 감소"],"exp":"**정답 이유 (공식표 PIO₂ = FIO₂ × (PB − PH₂O))**\n\n고지대에서도 공기 중 O₂ **비율(FIO₂)은 21%로 똑같습니다**. 달라지는 것은 전체 **기압(PB)**입니다. 높이 올라갈수록 기압이 낮아지므로, 같은 21%라도 실제 O₂ 분압(PIO₂)이 낮아집니다. 예를 들어 기압이 500 mmHg라면 PIO₂ = (500 − 47) × 0.21 ≈ 95 mmHg로, 해수면의 150보다 훨씬 낮습니다. 그 결과 흡입 PO₂ 감소(↓PIO₂)에 의한 저산소혈증(hypoxemia)이 생깁니다. 말초 화학수용체(peripheral chemoreceptor)가 이를 감지해 호흡을 재촉하면서 숨이 찬 느낌이 듭니다.","why":{"0":"들이마신 공기는 기도에서 어차피 수증기로 포화되므로 건조함 자체가 원인은 아닙니다.","1":"가장 흔한 함정입니다. 고지대에서도 O₂ **분율(%)은 0.21 그대로**입니다.","2":"산 공기의 CO₂ 함량은 거의 0으로 해수면과 같습니다.","3":"고지대에서는 기압이 증가하는 것이 아니라 감소합니다."},"one":"고지대 숨참은 산소 분율이 아니라 기압(barometric pressure) 감소로 흡입 PO₂가 낮아지기 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q6) / 8b. Pulmonary Physiology 2026.pdf, slides 12, 65","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12"},{"u":"img/w11_pulm_phys/p65.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 65"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-7":{"q":"During a forced expiration from total lung capacity, what primarily limits flow rate?","o":["The force of contraction of expiratory muscles.","The contraction of the diaphragm.","Constriction of bronchial smooth muscle","Elasticity of the chest wall","Airway compression"],"a":4,"qk":"총폐용량(TLC)에서 시작하는 노력성 호기(forced expiration) 동안, 유속(flow rate)을 주로 제한하는 것은 무엇입니까?","ok":["호기근의 수축력","횡격막의 수축","기관지 평활근의 수축","흉벽의 탄성","기도 압박(airway compression)"],"exp":"**정답 이유**\n\n힘껏 숨을 내쉬면 흉막내압(intrapleural pressure)이 양압으로 크게 올라갑니다. 기도 안 압력은 폐포에서 입으로 갈수록 점점 떨어집니다. 그러다 어느 지점에서 **흉막내압이 기도 안 압력보다 커지면** 기도 바깥이 안쪽보다 세게 눌려 기도가 **찌그러집니다(compression)**. 그러면 저항이 커져 호기 유속이 줄어듭니다.\n\n중요한 점은, 더 세게 힘을 줄수록 흉막내압도 더 올라가 기도를 더 누른다는 것입니다. 그래서 일정 이상 힘을 주면 유속이 더 늘지 않습니다(노력 비의존적 effort-independent). 그래서 유속을 \"주로 제한하는\" 것은 근육의 힘이 아니라 기도 압박입니다. 폐기종(emphysema)에서는 기도를 잡아주는 탄성 지지가 줄어 이 현상이 특히 심합니다.","why":{"0":"호기근의 힘은 처음에는 유속을 늘리지만, 앞서 설명했듯 일정 수준 이상에서는 기도 압박 때문에 효과가 없습니다.","1":"횡격막은 흡기근입니다. 호기 때는 이완합니다.","2":"기관지 평활근 수축은 천식 같은 질환에서 저항을 높이는 요인입니다. 정상인의 노력성 호기를 제한하는 주 요인은 아닙니다.","3":"흉벽의 탄성은 FRC의 균형을 정하는 요소로, 노력성 호기 유속의 주된 제한 요인이 아닙니다."},"one":"총폐용량에서 시작하는 노력성 호기의 유속을 주로 제한하는 것은 동적 기도 압박(airway compression)이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q7) / 8b. Pulmonary Physiology 2026.pdf, slides 35, 36","img":[{"u":"img/w11_pulm_phys/p35.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 35"},{"u":"img/w11_pulm_phys/p36.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 36"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-8":{"q":"What happens with normal quiet expiration?","o":["Airway resistance increases significantly.","Alveolar pressure exceeds atmospheric pressure.","Intra-pleural pressure gradually falls.","Alveoli collapse.","The diaphragm moves downward."],"a":1,"qk":"정상적인 조용한 호기(quiet expiration) 때 일어나는 일은 무엇입니까?","ok":["기도 저항이 크게 증가한다.","폐포압(alveolar pressure)이 대기압을 초과한다.","흉막내압(intra-pleural pressure)이 점차 떨어진다.","폐포가 허탈(collapse)된다.","횡격막이 아래로 내려간다."],"exp":"**정답 이유**\n\n공기는 압력이 높은 곳에서 낮은 곳으로 흐릅니다. 기류는 폐포압과 대기압의 차이에 비례합니다. 조용한 호기는 **수동적(passive)**입니다. 흡기근(횡격막 diaphragm)이 이완되면 늘어나 있던 폐의 탄성 반동(elastic recoil)이 폐를 안쪽으로 눌러 **폐포압이 대기압보다 약간 높아집니다**(예: +1 cmH₂O). 그래서 공기가 밖으로 나갑니다. 호기가 끝나면 폐포압은 다시 대기압과 같아집니다.","why":{"0":"조용한 호기에서는 기도 저항이 크게 변하지 않습니다. 동적 압박에 의한 저항 증가는 노력성 호기 때 일어납니다 (Q7 참조).","2":"흉막내압은 흡기 때 더 음압이 되고, 호기 때는 **덜 음압이 됩니다(상승)**. \"떨어진다\"는 흡기 때의 변화입니다.","3":"정상 폐는 표면활성제와 흉벽·폐의 균형 덕분에 호기 때 폐포가 허탈되지 않습니다.","4":"횡격막이 아래로 내려가는 것은 흡기 때입니다. 호기 때는 이완하며 위로 올라갑니다."},"one":"정상적인 조용한 호기는 수동적이며, 폐포압이 대기압을 초과해 공기가 나간다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q8) / 8b. Pulmonary Physiology 2026.pdf, slides 16, 18, 32","img":[{"u":"img/w11_pulm_phys/p16.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 16"},{"u":"img/w11_pulm_phys/p18.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 18"},{"u":"img/w11_pulm_phys/p32.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 32"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-9":{"q":"An 18 y/o high school star basketball player has a forced vital capacity of 5 L, a FRC of 3 L, and a RV of 1.2 L. What is his total lung capacity?","o":["9.2 L","8.0 L","7.2 L","6.2 L","5.0 L"],"a":3,"qk":"18세 고교 농구 스타 선수의 노력성 폐활량(FVC)이 5 L, FRC가 3 L, 잔기량(RV)이 1.2 L입니다. 그의 총폐용량(TLC)은 얼마입니까?","ok":["9.2 L","8.0 L","7.2 L","6.2 L","5.0 L"],"exp":"**계산 **\n\n총폐용량(total lung capacity, TLC) = 폐활량(vital capacity, VC) + 잔기량(residual volume, RV)\n\n= 5 + 1.2 = **6.2 L**\n\n폐활량은 최대한 들이마신 뒤 최대한 내쉴 수 있는 양이고, 잔기량은 그래도 폐에 남아 있는 공기입니다. 둘을 합치면 폐가 담을 수 있는 최대량이 됩니다. 정상 폐에서 FVC는 VC와 거의 같으므로 FVC를 VC로 쓰면 됩니다. **FRC(3 L)는 함정 숫자**입니다. FRC = ERV + RV이므로 이미 RV를 포함하고 있어서, VC에 FRC를 더하면 RV를 두 번 세게 됩니다.","why":{"0":"9.2 = 5 + 3 + 1.2 (세 숫자를 모두 더한 오류)","1":"8.0 = 5 + 3 (FVC + FRC, RV 중복)","2":"7.2: 맞는 조합이 없는 값입니다.","4":"5.0 = FVC만 쓴 값으로, RV를 빼먹었습니다."},"one":"총폐용량(TLC) = 노력성 폐활량(FVC) + 잔기량(RV) = 5 + 1.2 = 6.2 L이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q9) / 8b. Pulmonary Physiology 2026.pdf, slide 8","img":[{"u":"img/w11_pulm_phys/p08.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 8"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-10":{"q":"At what lung volume or capacity do the lungs and chest wall normally have opposite and equal recoil tendencies?","o":["FVC","FRC","RV","IRV","ERV"],"a":1,"qk":"폐와 흉벽이 정상적으로 서로 반대 방향이고 크기가 같은 반동(recoil) 경향을 갖는 폐용적 또는 폐용량은 무엇입니까?","ok":["FVC","FRC","RV","IRV","ERV"],"exp":"**정답 이유**\n\n폐는 탄성 때문에 항상 **안쪽으로 오그라들려** 하고, 흉벽은 **바깥으로 벌어지려** 합니다. 조용히 숨을 내쉬고 근육이 모두 쉬고 있을 때, 이 두 힘이 크기는 같고 방향은 반대가 되어 균형을 이룹니다. 이 균형점의 폐 부피가 **기능적 잔기량(functional residual capacity, FRC)**입니다. 두 힘이 서로 반대로 당기기 때문에 흉막강(intrapleural space)에는 대기압보다 낮은 음압이 생기고, 이것이 폐포 허탈을 막는 데 도움을 줍니다.","why":{"0":"FVC는 폐기능 검사에서 측정하는 \"양\"이지, 근육이 쉬고 있는 평형 상태가 아닙니다.","2":"RV(잔기량)에서는 흉벽이 바깥으로 벌어지려는 힘이 훨씬 큽니다. 힘껏 내쉬어 근육으로 눌러야 도달합니다.","3":"IRV(흡기 예비량)는 조용한 흡기 위로 더 들이마실 수 있는 양입니다. 평형점이 아닙니다.","4":"ERV(호기 예비량)는 FRC에서 더 내쉴 수 있는 \"양\"으로, 평형 위치 자체를 뜻하지 않습니다."},"one":"폐의 안쪽 반동과 흉벽의 바깥쪽 반동이 크기는 같고 방향은 반대가 되는 평형점이 기능적 잔기량(FRC)이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q10) / 8b. Pulmonary Physiology 2026.pdf, slide 17","img":[{"u":"img/w11_pulm_phys/p17.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 17"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-11":{"q":"A man with normal lungs and a normal arterial Pco2 takes an overdose of a barbiturate which reduces his alveolar ventilation by ½ but does not change his output of CO2. Which of the following is a consequence of the overdose?","o":["PvO2 > PaO2","PaO2 > PAO2","PACO2 doubles.","PACO2 decreases by 50%.","PaCO2 decreases by 50%."],"a":2,"qk":"정상 폐와 정상 동맥 PCO₂를 가진 남성이 바르비투르산(barbiturate)을 과다복용하여 폐포환기량이 ½로 줄었지만 CO₂ 생성량은 변하지 않았습니다. 다음 중 과다복용의 결과는 무엇입니까?","ok":["PvO₂ > PaO₂ (정맥혈 PO₂가 동맥혈 PO₂보다 높음)","PaO₂ > PAO₂ (동맥혈 PO₂가 폐포 PO₂보다 높음)","PACO₂가 두 배가 된다.","PACO₂가 50% 감소한다.","PaCO₂가 50% 감소한다."],"exp":"**정답 이유**\n\nQ2와 같은 원리입니다. CO₂ 생성이 일정하면 PACO₂ ∝ 1/VA입니다. VA가 ½이 되면 PACO₂는 **2배**(40 → 약 80 mmHg)가 됩니다. 바르비투르산은 뇌간 호흡중추를 억제해 저환기(hypoventilation)를 일으키는 약입니다. 저환기는 CO₂ 정체로 호흡성 산증(respiratory acidosis)을 일으킵니다.","why":{"0":"정맥혈은 조직에 O₂를 내준 뒤의 피라서 항상 동맥혈보다 PO₂가 낮습니다(약 40 vs 95 mmHg).","1":"O₂는 폐포에서 혈액으로 확산되므로 동맥혈 PO₂는 폐포 PO₂보다 높을 수 없습니다. 정상에서도 A-a 차이가 5–15 mmHg 있습니다.","3":"환기가 줄면 PCO₂는 감소가 아니라 증가합니다. 50% 감소는 환기가 2배가 되었을 때의 결과입니다.","4":"환기가 줄면 PCO₂는 감소가 아니라 증가합니다. 50% 감소는 환기가 2배가 되었을 때의 결과입니다."},"one":"CO₂ 생성이 그대로인데 폐포환기량이 ½이 되면 폐포 PCO₂는 두 배가 된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q11) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-12":{"q":"Which of the following is correct regarding V/Q?","o":["It is independent of age.","Anatomic and physiologic shunting cause mismatch.","It is unrelated to COPD.","It is stable after puberty.","Breathing 100% O2 corrects for V/Q mismatch regardless of the cause."],"a":1,"qk":"V/Q(환기-관류비 ventilation-perfusion ratio)에 대해 옳은 것은 무엇입니까?","ok":["나이와 무관하다.","해부학적·생리학적 단락(shunting)이 불일치(mismatch)를 일으킨다.","COPD와 무관하다.","사춘기 이후에는 안정적이다.","100% O₂ 흡입은 원인에 관계없이 V/Q 불일치를 교정한다."],"exp":"**정답 이유**\n\nV/Q는 폐포에 들어가는 공기(V)와 그 폐포를 지나는 혈액(Q)의 비율입니다. **단락(shunt)**이란 혈액이 환기되는 폐포를 거치지 않고 지나가는 것입니다. 기관지 순환 혈액 일부가 폐정맥으로 바로 들어가는 해부학적 단락이 그 예입니다. 단락 혈액은 V/Q = 0인 셈이므로 V/Q 불일치를 만듭니다. 그래서 정상인도 폐포-동맥 PO₂ 차이(A-a gradient)가 5–15 mmHg 정도 있습니다.","why":{"0":"나이가 들면 V/Q 불균일성이 커집니다. A-a 차이도 나이에 따라 증가하므로 나이와 무관하지도, 사춘기 이후 고정되지도 않습니다.).","3":"나이가 들면 V/Q 불균일성이 커집니다. A-a 차이도 나이에 따라 증가하므로 나이와 무관하지도, 사춘기 이후 고정되지도 않습니다.).","2":"COPD(만성폐쇄성폐질환)는 V/Q 불일치와 저산소혈증의 대표적 원인입니다.","4":"100% O₂ 흡입은 해부학적 우→좌 단락(right-to-left shunt)을 교정하지 **못합니다**. 단락 혈액은 환기되는 폐포를 아예 지나지 않기 때문입니다."},"one":"해부학적·생리학적 단락(shunt)은 V/Q = 0인 혈류를 만들어 V/Q 불일치를 일으킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q12) / 8b. Pulmonary Physiology 2026.pdf, slides 47, 50","img":[{"u":"img/w11_pulm_phys/p47.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 47"},{"u":"img/w11_pulm_phys/p50.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 50"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-13":{"q":"A patient with lung disease who is breathing air has an arterial PO2 and Pco2 of 49 and 48 mm Hg, respectively and a respiratory exchange ratio of 0.8. What does this indicate?","o":["COVID-19 infection.","Restrictive lung disease.","Congestive heart failure.","V/Q mismatch.","Decreased AO2 – aO2."],"a":3,"qk":"공기를 호흡하는 폐질환 환자의 동맥 PO₂와 PCO₂가 각각 49와 48 mmHg이고, 호흡교환율(respiratory exchange ratio)이 0.8입니다. 이것은 무엇을 의미합니까?","ok":["COVID-19 감염","제한성 폐질환(restrictive lung disease)","울혈성 심부전(congestive heart failure)","V/Q 불일치(mismatch)","AO₂ – aO₂(폐포-동맥 PO₂ 차이) 감소"],"exp":"**계산 **\n\nPAO₂ = PIO₂ − PₐCO₂/R = 150 − 48/0.8 = 150 − 60 = **90 mmHg**\n\nA-a 차이 = PAO₂ − PₐO₂ = 90 − 49 = **41 mmHg**\n\n정상 A-a 차이는 5–15 mmHg입니다. **15 mmHg를 넘으면 산소화 이상과 V/Q 불일치**를 뜻합니다. 41 mmHg는 크게 증가한 값이므로 V/Q 불일치가 정답입니다. 만약 저산소혈증이 단순 저환기(hypoventilation) 때문이었다면 A-a 차이는 정상이었을 것입니다. 숫자를 공식에 넣어 확인하는 것이 핵심입니다.","why":{"0":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","1":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","2":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","4":"계산 결과 A-a 차이는 감소가 아니라 **증가**했습니다."},"one":"폐포 기체 공식으로 구한 A-a 차이가 41 mmHg로 커져 있으므로 V/Q 불일치를 뜻한다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q13) / 8b. Pulmonary Physiology 2026.pdf, slides 13, 48","img":[{"u":"img/w11_pulm_phys/p13.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 13"},{"u":"img/w11_pulm_phys/p48.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 48"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-14":{"q":"An increase in which of the following will increase the affinity of hemoglobin for bound oxygen?","o":["Body temperature","Pco2","[H+]","2,3 DPG","Inhaled carbon monoxide"],"a":4,"qk":"다음 중 어느 것이 증가하면 헤모글로빈(hemoglobin)의 결합 산소에 대한 친화도(affinity)가 증가합니까?","ok":["체온","PCO₂","[H⁺]","2,3-DPG","흡입한 일산화탄소(carbon monoxide)"],"exp":"**정답 이유**\n\n\"CO also increases the affinity of Hb for bound O₂\", 즉 일산화탄소(CO)는 헤모글로빈이 **이미 결합한 O₂를 더 꽉 붙잡게** 만듭니다. CO가 Hb의 결합 자리 일부를 차지하면 Hb 분자 모양이 O₂를 잘 놓지 않는 형태로 바뀝니다. 그래서 산소해리곡선(oxyhemoglobin dissociation curve)이 **왼쪽으로 이동**합니다. 결과적으로 조직에서 O₂를 잘 내주지 못해 더 위험해집니다.","why":{"0":"체온 ↑: 운동하는 뜨거운 근육에서 O₂를 잘 내놓게 합니다.","1":"PCO₂ ↑: CO₂가 많은 조직에서 O₂를 잘 내놓게 합니다.","2":"[H⁺] ↑(산성): 친화도를 감소시킵니다.","3":"2,3-DPG ↑: 적혈구 대사산물로, 친화도를 감소시킵니다. 외우는 법: \"조직에서 많이 쓰는 상황(뜨겁고, 산성이고, CO₂ 많음)에서는 O₂를 놓아준다(우측이동)\"고 기억하시면 됩니다."},"one":"일산화탄소(CO)는 헤모글로빈이 이미 결합한 O₂에 대한 친화도를 증가시킨다(곡선 좌측 이동).","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q14) / 8b. Pulmonary Physiology 2026.pdf, slides 60, 61","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60"},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-15":{"q":"Acute carbon monoxide poisoning will most likely","o":["reduce the arterial PO2.","affect the reading of a pulse oximeter.","reduce the amount of oxygen dissolved in plasma.","reduce the oxygen content of the blood.","decrease the affinity of hemoglobin for oxygen."],"a":3,"qk":"급성 일산화탄소(CO) 중독은 다음 중 어떤 결과를 가져올 가능성이 가장 높습니까?","ok":["동맥 PO₂를 감소시킨다.","맥박산소측정기(pulse oximeter)의 수치에 영향을 준다.","혈장에 녹아 있는 산소량을 감소시킨다.","혈액의 산소 함량(oxygen content)을 감소시킨다.","헤모글로빈의 산소 친화도를 감소시킨다."],"exp":"**정답 이유**\n\nCO는 O₂보다 Hb에 훨씬 강하게 결합해 O₂ 결합 자리를 빼앗습니다. 그래서 Hb 포화도가 떨어지고 **혈액의 산소 함량(oxygen content)이 감소**합니다. 하지만 **동맥 PO₂는 변하지 않습니다**(\"without altering the arterial PO₂\"). 산소 함량 = 용존 O₂ + Hb 결합 O₂이고, 이 중 Hb 결합분이 줄어드는 것입니다.","why":{"0":"PO₂는 혈장에 **녹아 있는** O₂가 만드는 압력입니다. 폐의 환기와 확산이 정상이면 PaO₂도 정상입니다.","2":"용존 O₂ = 0.003 × PO₂이므로 PO₂가 그대로면 용존 O₂도 그대로입니다.","4":"CO는 친화도를 오히려 **증가**시킵니다 (Q14).","1":"실제 임상에서는 일반 맥박산소측정기(pulse oximeter)가 일산화탄소헤모글로빈(carboxyhemoglobin)과 산소헤모글로빈을 구별하지 못해 SpO₂가 정상처럼 높게 나올 수 있습니다. 하지만 이 문제가 묻는 핵심은 동맥 PO₂는 정상이고 혈액의 산소 함량(oxygen content)이 감소한다는 것이므로, 정답은 D입니다."},"one":"급성 CO 중독은 동맥 PO₂는 그대로 두고 혈액의 산소 함량(oxygen content)을 감소시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q15) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 61","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55"},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-16":{"q":"In what form is most carbon dioxide transported in the venous blood?","o":["Dissolved CO2.","Bicarbonate.","Carbamino compounds.","Carbonic acid.","Carboxyhemoglobin."],"a":1,"qk":"정맥혈에서 대부분의 이산화탄소(CO₂)는 어떤 형태로 운반됩니까?","ok":["용존 CO₂(dissolved CO₂)","중탄산염(bicarbonate)","카바미노 화합물(carbamino compounds)","탄산(carbonic acid)","카복시헤모글로빈(carboxyhemoglobin)"],"exp":"**정답 이유**\n\n혈액은 CO₂를 \"거의 전부 **중탄산염(bicarbonate, HCO₃⁻)**으로\" 운반합니다. 흐름은 다음과 같습니다.\n\n① 조직에서 생긴 CO₂가 적혈구로 들어갑니다.\n\n② 탄산탈수효소(carbonic anhydrase)가 CO₂ + H₂O → H₂CO₃ 반응을 빠르게 진행시킵니다.\n\n③ H₂CO₃ → H⁺ + HCO₃⁻로 해리됩니다.\n\n④ H⁺는 Hb에 붙고, HCO₃⁻는 Cl⁻와 맞바꿔 혈장으로 나갑니다(염소 이동 chloride shift).","why":{"0":"용존 CO₂는 소량(약 5–10%)입니다.","2":"카바미노 화합물(Hb의 아미노기에 CO₂가 붙은 것)도 일부(약 5–10%)만 차지합니다.","3":"탄산은 만들어지자마자 바로 H⁺와 HCO₃⁻로 해리되므로 운반 형태가 아닙니다.","4":"카복시헤모글로빈은 **일산화탄소(CO)**가 Hb에 붙은 것입니다. CO₂와 이름이 비슷해 헷갈리게 만든 함정입니다. (CO₂가 Hb에 붙은 것은 카바미노헤모글로빈 carbaminohemoglobin입니다.)"},"one":"정맥혈 CO₂의 대부분은 중탄산염(bicarbonate, HCO₃⁻) 형태로 운반된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q16) / 8b. Pulmonary Physiology 2026.pdf, slides 66, 67","img":[{"u":"img/w11_pulm_phys/p66.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 66"},{"u":"img/w11_pulm_phys/p67.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 67"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-17":{"q":"Which statement below is inconsistent with normal gas exchange and normal gas transport events?","o":["Hyperventilation reduces the alveolar PCO2.","The difference between alveolar and arterial PO2 increases with V/Q mismatch.","Acidemia increases the affinity of hemoglobin for oxygen.","Most of the transported oxygen is bound to hemoglobin.","An increase in arterial PO2 will increase the oxygen content of blood."],"a":2,"qk":"다음 중 정상적인 가스교환 및 가스운반 현상과 맞지 **않는** 것은 무엇입니까?","ok":["과호흡(hyperventilation)은 폐포 PCO₂를 감소시킨다.","폐포-동맥 PO₂ 차이는 V/Q 불일치에서 증가한다.","산혈증(acidemia)은 헤모글로빈의 산소 친화도를 증가시킨다.","운반되는 산소의 대부분은 헤모글로빈에 결합되어 있다.","동맥 PO₂가 증가하면 혈액의 산소 함량이 증가한다."],"exp":"**정답 이유**\n\n\"맞지 않는 것\"을 고르는 문제입니다. [H⁺] 증가(산혈증 acidemia)는 곡선을 **오른쪽**으로 옮기고(보어 효과 Bohr effect) Hb의 O₂ 친화도를 **감소**시킵니다. 따라서 \"산혈증이 친화도를 증가시킨다\"는 C가 틀린 문장이고, 이것이 정답입니다.","why":{"0":"과호흡하면 CO₂를 많이 내보내 PACO₂가 내려갑니다.","1":"A-a 차이가 15 mmHg를 넘으면 V/Q 불일치를 뜻합니다.","3":"혈액 O₂ 약 20 mL/dL 중 대부분이 Hb에 결합되어 있습니다. 용존 O₂는 0.003 × 95 ≈ 0.3 mL/dL뿐입니다.","4":"PO₂가 오르면 용존 O₂(0.003 × PO₂)가 늘고, 포화도도 같거나 오르므로 산소 함량이 증가합니다."},"one":"산혈증(acidemia)은 보어 효과로 헤모글로빈의 산소 친화도를 감소시키므로, 친화도가 증가한다는 문장은 틀렸다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q17) / 8b. Pulmonary Physiology 2026.pdf, slide 60","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-18":{"q":"A normal healthy 25 y/o male has a hemoglobin content of 14.5 gm/dl blood and a SaO2 of 97%. How much oxygen is his hemoglobin transporting?","o":["20 vol%","20 ml/dl","18.8 ml/dl","14.5 ml/dl","1.34 ml/dl"],"a":2,"qk":"정상적인 건강한 25세 남성의 헤모글로빈이 14.5 g/dL이고 SaO₂가 97%입니다. 그의 헤모글로빈은 얼마의 산소를 운반하고 있습니까?","ok":["20 vol%","20 mL/dL","18.8 mL/dL","14.5 mL/dL","1.34 mL/dL"],"exp":"**계산 (공식표: Hb 결합 O₂ = Hb(g/dL) × 1.34 mL O₂/g Hb × %포화도/100)**\n\n14.5 × 1.34 × 0.97 = 19.43 × 0.97 ≈ **18.8 mL/dL**\n\n1.34는 Hb 1 g이 최대로 붙잡을 수 있는 O₂ 양(mL)입니다. 문제는 \"헤모글로빈이\" 운반하는 산소만 물었으므로 용존 O₂(0.003 × PO₂ ≈ 0.3 mL/dL)는 더하지 않습니다.","why":{"0":"20 vol% = 20 mL/dL은 같은 단위로, 교과서의 \"정상 산소운반 능력(carrying capacity) 약 20 mL/dL\"입니다. 이 사람의 수치로 계산한 값이 아닙니다.","1":"20 vol% = 20 mL/dL은 같은 단위로, 교과서의 \"정상 산소운반 능력(carrying capacity) 약 20 mL/dL\"입니다. 이 사람의 수치로 계산한 값이 아닙니다.","3":"14.5는 Hb 농도(g/dL)를 그대로 옮긴 함정입니다.","4":"1.34는 Hb 1 g당 결합 상수로, 결과값이 아닙니다."},"one":"헤모글로빈 결합 산소 = 14.5 × 1.34 × 0.97 ≈ 18.8 mL/dL이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q18) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 62","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55"},{"u":"img/w11_pulm_phys/p62.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 62"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-19":{"q":"What best characterizes the central chemoreceptors?","o":["They are located in the pons.","They are unresponsive to changes in either PO2 or PCO2 of the blood.","They are activated by pH changes in surrounding extracellular fluid.","They exist in the carotid and aortic bodies.","They are stimulated by the opening of Ca2+ sensitive potassium channels."],"a":2,"qk":"중추 화학수용체(central chemoreceptors)를 가장 잘 설명하는 것은 무엇입니까?","ok":["뇌교(pons)에 위치한다.","혈액의 PO₂나 PCO₂ 변화 어느 쪽에도 반응하지 않는다.","주변 세포외액(extracellular fluid)의 pH 변화에 의해 활성화된다.","경동맥소체(carotid body)와 대동맥소체(aortic body)에 있다.","Ca²⁺ 민감성 칼륨 채널의 개방에 의해 자극된다."],"exp":"**정답 이유**\n\n중추(연수 medullary) 화학수용체는 **뇌척수액(cerebrospinal fluid)의 pH**에 민감하고, 이 pH는 PCO₂와 연결되어 있습니다. 원리는 이렇습니다. 혈액의 CO₂는 혈뇌장벽(blood-brain barrier, BBB)을 쉽게 통과하지만 H⁺는 잘 통과하지 못합니다. 뇌척수액으로 들어간 CO₂는 H₂O와 반응해 H⁺를 만들고, 수용체 주변 세포외액의 pH를 떨어뜨립니다. 수용체는 이 pH 변화를 감지해 호흡을 늘립니다.","why":{"0":"위치는 뇌교가 아니라 **연수(medulla)**의 복측 표면입니다.","1":"혈액 PCO₂ 변화에는 (pH를 통해 간접적으로) 강하게 반응합니다. PO₂에 반응하지 않는 것은 맞지만, \"둘 다 반응 안 한다\"는 틀렸습니다.","3":"경동맥소체·대동맥소체는 **말초(peripheral)** 화학수용체입니다.","4":"칼륨 채널이 관여하는 것은 말초 화학수용체의 사구세포(glomus cell) 기전입니다. 저산소 시 O₂ 민감성 K⁺ 채널이 닫혀 탈분극됩니다. 중추 화학수용체의 설명이 아닙니다."},"one":"중추 화학수용체는 주변 세포외액(뇌척수액)의 pH 변화에 의해 활성화된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q19) / 8b. Pulmonary Physiology 2026.pdf, slide 80","img":[{"u":"img/w11_pulm_phys/p80.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 80"}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-20":{"q":"What best describes respiratory center activity?","o":["The normal rhythmic pattern of breathing originates from neurons in the pons and medulla.","Inspiratory activity originates in the dorsal respiratory group of neurons in the pons.","Impulses from the pneumotaxic cen
