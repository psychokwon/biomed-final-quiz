he oropharyngeal membrane","Cessation of placental blood flow and the beginning of respiration"],"a":4,"qk":"출생 시 순환 변화(circulatory changes at birth)의 원인은?","ok":["가로중격의 폐쇄","심내막 쿠션의 융합","대동맥궁의 형성","구인두막의 파열","태반 혈류의 중단과 호흡의 시작"],"exp":"**출생 시 순환 변화**의 원인은 두 가지입니다.\n1. **태반 혈류의 중단(cessation of placental blood flow)**\n2. **호흡의 시작(beginning of respiration)**\n\n출생 시 변화는 **기능적 변화로 인한 점진적 폐쇄(gradual closure due to functional changes)**입니다.","why":{"0":"가로중격은 횡격막 일부가 되며, 출생 시 변화의 원인이 아닙니다.","1":"심내막 쿠션 융합은 4–5주의 중격 형성입니다.","2":"대동맥궁은 배아기에 형성·재구성됩니다.","3":"구인두막은 미래의 입과 관련된 발생 초기 구조입니다."},"one":"출생 시 순환 변화의 원인: 태반 혈류 중단과 호흡 시작, 그리고 기능적 변화로 점진적으로 닫힌다.","src":"Cardiovascular System.pdf, slide 35","img":[{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-35":{"q":"Which pairing of fetal structure and its postnatal remnant is correct?","o":["Ductus arteriosus → ligamentum arteriosum; oval foramen → fossa ovalis","Umbilical arteries → ligamentum teres","Umbilical vein → medial umbilical ligament","Ductus venosus → ligamentum arteriosum","Oval foramen → ligamentum venosum"],"a":0,"qk":"태아 구조와 출생 후 잔재의 짝이 옳은 것은?","ok":["동맥관(ductus arteriosus) → 동맥관인대(ligamentum arteriosum); 타원구멍(oval foramen) → 타원오목(fossa ovalis)","배꼽동맥 → 간원인대","배꼽정맥 → 안쪽배꼽인대","정맥관 → 동맥관인대","타원구멍 → 정맥관인대"],"exp":"**출생 시 변화와 잔재(changes at birth)**:\n1. **배꼽동맥(umbilical arteries)** → **안쪽배꼽인대(medial umbilical ligament)** (근위부 = **위방광동맥** sup. vesical a.)\n2. **배꼽정맥과 정맥관(umbilical vein and ductus venosus)** → **간원인대(ligamentum teres)**와 **정맥관인대(ligamentum venosum)**\n3. **동맥관(ductus arteriosus)** → **동맥관인대(ligamentum arteriosum)**\n4. **타원구멍(oval foramen)** → **타원오목(fossa ovalis)**","why":{"1":"배꼽동맥은 안쪽배꼽인대가 됩니다.","2":"안쪽배꼽인대는 배꼽동맥의 잔재이고, 배꼽정맥은 간원인대가 됩니다.","3":"정맥관은 정맥관인대가 됩니다.","4":"타원구멍은 타원오목이 됩니다."},"one":"배꼽동맥 → 안쪽배꼽인대, 배꼽정맥·정맥관 → 간원인대·정맥관인대, 동맥관 → 동맥관인대, 타원구멍 → 타원오목.","src":"Cardiovascular System.pdf, slide 35","img":[{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-36":{"q":"Which four cardiac defects make up the tetralogy of Fallot?","o":["Pulmonary stenosis, ventricular septal defect, dextroposition (overriding) of the aorta, and right ventricular hypertrophy","Patent ductus arteriosus, aortic stenosis, VSD, and left atrial enlargement","Tricuspid atresia, ASD, PDA, and transposition","Atrial septal defect, mitral stenosis, left ventricular hypertrophy, and coarctation","Pulmonary stenosis, ASD, left ventricular hypertrophy, and dextrocardia"],"a":0,"qk":"팔로4징(tetralogy of Fallot)을 이루는 네 가지 심장 결손은?","ok":["폐동맥 협착, 심실중격결손, 대동맥 우방위(걸친 대동맥), 우심실 비대","동맥관 개존, 대동맥판 협착, VSD, 좌심방 확대","삼첨판 폐쇄, ASD, PDA, 대혈관 전위","심방중격결손, 승모판 협착, 좌심실 비대, 축착","폐동맥 협착, ASD, 좌심실 비대, 우심증"],"exp":"**임상 노트: 팔로4징(tetralogy of Fallot)** – **NDE 문제 중 가장 흔한 것**으로 표시되어 있습니다.\n\n고전적인 **네 가지 심장 결손**:\n1. **폐동맥 협착(pulmonary stenosis)** – **우심실 유출로 폐쇄**\n2. **심실중격결손(VSD)**\n3. **대동맥 우방위(dextroposition of aorta)** – **걸친(overriding/straddling) 대동맥**\n4. **우심실 비대(right ventricular hypertrophy)**","why":{"1":"PDA, 대동맥판 협착, 좌심방 확대는 포함되지 않습니다.","2":"삼첨판 폐쇄와 대혈관 전위는 포함되지 않습니다.","3":"ASD, 승모판 협착, 좌심실 비대, 축착은 팔로4징이 아닙니다.","4":"ASD, 좌심실 비대, 우심증이 아니라 VSD, 걸친 대동맥, 우심실 비대입니다."},"one":"팔로4징: 폐동맥 협착, VSD, 걸친 대동맥, 우심실 비대(NDE 단골).","src":"Cardiovascular System.pdf, slide 36","img":[{"u":"img/w12_cv_dev/p36.webp","cap":"Cardiovascular System.pdf, slide 36"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-37":{"q":"How does tetralogy of Fallot arise, how common is it, and what is the treatment of choice?","o":["Premature closure of the foramen ovale; 1 in 10,000; repair in adulthood","Persistent 5th aortic arch; 1 in 50; no treatment needed","Unequal division of the truncus arteriosus (the pulmonary trunk may have no lumen or no orifice at the pulmonary valve); most common cyanotic congenital heart malformation (~1 in 1,000 live births); primary surgical repair of the pulmonary stenosis and VSD in early infancy","Failure of the septum secundum; most common acyanotic defect (~1 in 10); medication only","Abnormal looping to the left; 1 in 100,000; heart transplant at age 10"],"a":2,"qk":"팔로4징은 어떻게 생기며, 얼마나 흔하고, 선택 치료는?","ok":["타원구멍의 조기 폐쇄; 1/10,000; 성인기에 교정","5번 대동맥궁의 잔존; 1/50; 치료 불필요","동맥줄기(truncus arteriosus)가 매우 불균등하게 나뉜다(폐동맥줄기에 내강이 없거나 폐동맥판 높이에 구멍이 없음); 가장 흔한 청색증 선천 심장 기형(생존 출생아 약 1/1,000); 영아기 초기에 폐동맥 협착과 VSD의 일차 수술 교정","이차중격 실패; 가장 흔한 비청색증 결손(약 1/10); 약물 치료만","왼쪽으로의 비정상 고리 형성; 1/100,000; 10세에 심장 이식"],"exp":"**원인**: **동맥줄기(truncus arteriosus)의 분할이 매우 불균등**하여 **폐동맥줄기에 내강이 없거나**, **폐동맥판 높이에 구멍이 없을 때** 생깁니다.\n\n**빈도**: **가장 흔한 청색증 선천 심장 기형(most common cyanotic congenital heart formation)**으로, **생존 출생아 약 1,000명 중 1명**.\n\n**치료**: **영아기 초기(early infancy)**에 **1번(폐동맥 협착)과 2번(VSD)의 일차 수술 교정(primary surgical repair)**이 선택 치료입니다.","why":{"0":"타원구멍 폐쇄와 무관하며, 영아기 초기에 교정합니다.","1":"5번 궁은 사실상 없으며, 수술 교정이 필요합니다.","3":"원인은 동맥줄기의 불균등 분할이며, 팔로4징은 청색증 기형이고 수술이 선택 치료입니다.","4":"고리 형성 이상이 원인이 아니며, 빈도는 약 1/1,000입니다."},"one":"팔로4징 = 동맥줄기의 불균등 분할, 가장 흔한 청색증 선천 심장 기형(약 1/1,000), 영아기 초기 폐동맥 협착·VSD 수술 교정.","src":"Cardiovascular System.pdf, slide 36","img":[{"u":"img/w12_cv_dev/p36.webp","cap":"Cardiovascular System.pdf, slide 36"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w13_murmurs-1":{"q":"Which starred reason explains why a heart murmur in a dental patient is a concern?","o":["It proves that the patient has uncontrolled hypertension","It shows that the patient is allergic to local anesthetics","It always means the patient needs open-heart surgery before receiving any dental care","It may signal heart disease that is a risk factor for infective endocarditis","It means the patient has an active oral infection"],"a":3,"qk":"치과 환자의 심잡음(heart murmur)이 문제가 되는 이유로 별표 표시된 것은?","ok":["환자의 고혈압이 조절되지 않음을 증명한다","환자가 국소마취제에 알레르기가 있음을 보여 준다","어떤 치과 치료든 받기 전에 반드시 개심술이 필요하다는 뜻이다","감염성 심내막염 위험 인자인 심장병을 나타낼 수 있다","환자에게 활동성 구강 감염이 있다는 뜻이다"],"exp":"심잡음이 치과의료인에게 중요한 이유는 네 가지입니다.\n\n- 치과 환자에게 **흔한 소견**이다\n- 일부 시술이 드물게 **심한 심혈관 합병증**을 일으킬 수 있다\n- **(별표)** **치과 시술 후 감염성 심내막염(infective endocarditis, IE)의 위험 인자인 기존 심장병**을 나타낼 수 있다\n- **선천성 심장병(congenital heart disease), 심방세동(atrial fibrillation), 울혈성 심부전(congestive heart failure)**을 나타낼 수 있다\n\n핵심은 심잡음이 **IE 위험이 있는 심장병의 신호**일 수 있다는 점입니다.","why":{"0":"심잡음은 고혈압을 증명하는 소견이 아닙니다.","1":"심잡음은 국소마취제 알레르기와 관계가 없습니다.","2":"심잡음이 있다고 모두 수술이 필요한 것은 아니며, 강의는 위험을 평가하라고 합니다.","4":"심잡음은 심장 안팎의 난류 혈류로 생기는 소리이지 구강 감염의 표시가 아닙니다."},"one":"심잡음은 치과 시술 후 감염성 심내막염 위험이 있는 기존 심장병을 나타낼 수 있다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 2","img":[{"u":"img/w13_murmurs/p02.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 2","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-2":{"q":"What is a heart murmur?","o":["An abnormal heartbeat sound caused by turbulent blood flow","A sound produced by air moving through narrowed bronchi","An irregular heart rhythm seen only on an electrocardiogram","The normal sound made by closure of the heart valves","A painful sensation in the chest during exercise"],"a":0,"qk":"심잡음(heart murmur)이란 무엇인가?","ok":["난류 혈류 때문에 생기는 비정상적인 심장 소리","좁아진 기관지를 공기가 지나가며 나는 쌕쌕거리는 소리","심전도에서만 보이는 불규칙한 심장 리듬","심장 판막이 닫히며 나는 정상 소리","운동 중 가슴에 느껴지는 통증"],"exp":"**심잡음(heart murmur)**은 **심장 안이나 근처의 난류 혈류(turbulent blood)** 때문에 **심장 박동 주기 중에 들리는 비정상적인 소리**입니다.\n\n- **(별표)** **태어날 때부터 있을 수도(선천성, congenital)**, **나중에 생길 수도** 있습니다\n- 심잡음은 그 자체가 병이라기보다 **징후이자 증상(sign and symptom)**입니다","why":{"1":"좁아진 기관지의 공기 소리는 천명(wheezing)입니다.","2":"불규칙한 리듬은 부정맥이며, 심잡음은 청진으로 듣는 소리입니다.","3":"판막이 닫히는 정상 소리는 심음 S1, S2입니다.","4":"운동 중 흉통은 증상이지 심잡음의 정의가 아닙니다."},"one":"심잡음은 심장 안팎의 난류 혈류로 생기는 비정상 소리이고, 선천성일 수도 후천성일 수도 있다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 3","img":[{"u":"img/w13_murmurs/p03.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 3","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-3":{"q":"During the period of isovolumic contraction, what is the state of the heart valves?","o":["Only the mitral valve is open","AV valves closed and semilunar valves open","AV valves closed and semilunar valves closed","AV valves open and semilunar valves still closed","AV valves open and semilunar valves open"],"a":2,"qk":"등용적 수축기(isovolumic contraction) 동안 심장 판막의 상태는?","ok":["승모판만 열려 있음","방실판막 닫힘, 반달판막 열림","방실판막 닫힘, 반달판막 닫힘","방실판막 열림, 반달판막은 계속 닫힘","방실판막 열림, 반달판막 열림"],"exp":"**심장 주기(cardiac cycle)** 그림의 다섯 단계:\n\n1. **수축기 - 등용적 수축기(isovolumic contraction)**: **방실판막(AV valves) 닫힘, 반달판막(semilunar valves) 닫힘**\n2. **수축기 - 박출기(ejection)**: 방실판막 닫힘, 반달판막 열림\n3. **이완기 - 등용적 이완기(isovolumic relaxation)**: 둘 다 닫힘\n4. **이완기 - 수동적 심실 충만(passive ventricular filling)**: 방실판막 열림, 반달판막 닫힘\n5. **이완기 - 능동적 심실 충만(active ventricular filling)**: 방실판막 열림, 반달판막 닫힘\n\n\"등용적\"은 판막이 모두 닫혀 있어 **심실 부피가 변하지 않는다**는 뜻입니다.","why":{"0":"등용적 수축기에는 승모판을 포함한 방실판막이 모두 닫혀 있습니다.","1":"방실판막이 닫히고 반달판막이 열린 상태는 박출기입니다.","3":"방실판막이 열리고 반달판막이 닫힌 상태는 심실 충만기입니다.","4":"두 판막이 동시에 열리는 단계는 정상 심장 주기에 없습니다."},"one":"등용적 수축기에는 방실판막과 반달판막이 모두 닫혀 있다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 4","img":[{"u":"img/w13_murmurs/p04.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 4","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-4":{"q":"What mainly produces the first heart sound (S1)?","o":["Closure of the semilunar (aortic and pulmonary) valves at end systole","Closure of the atrioventricular (tricuspid and mitral) valves","Atrial contraction in late diastole","Opening of the aortic valve","Rapid filling of the ventricles in early diastole"],"a":1,"qk":"제1심음(S1)은 주로 무엇 때문에 생기는가?","ok":["수축기 끝의 반달판막(대동맥판, 폐동맥판) 닫힘","방실판막(삼첨판, 승모판)의 닫힘","이완기 말기의 심방 수축","대동맥판의 열림","이완기 초기의 빠른 심실 충만"],"exp":"**(별표) 정상 심음은 무엇이 만드는가?**\n\n- **S1**: 주로 **방실판막(atrioventricular valves), 즉 삼첨판(tricuspid)과 승모판(mitral)의 닫힘**\n- **S2**: 주로 **반달판막(semilunar valves), 즉 대동맥판(aortic)과 폐동맥판(pulmonary)의 닫힘**\n- 가끔 **S3**(있다면 **이완기 초기**), **S4**(있다면 **이완기 말기**)가 들립니다","why":{"0":"반달판막의 닫힘은 S2를 만듭니다.","2":"이완기 말기 소리는 S4입니다.","3":"정상 심음은 판막이 닫힐 때 나며, S1은 방실판막 닫힘입니다.","4":"이완기 초기 소리는 S3입니다."},"one":"S1은 방실판막(삼첨판·승모판), S2는 반달판막(대동맥판·폐동맥판)이 닫히는 소리다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 5","img":[{"u":"img/w13_murmurs/p05.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-5":{"q":"When do the S3 and S4 heart sounds occur, if present?","o":["S3 in early systole and S4 in late systole","S3 in late diastole and S4 in early diastole","Both at the moment the AV valves close","Both in mid-systole","S3 early diastole; S4 late diastole"],"a":4,"qk":"S3, S4 심음이 있다면 언제 들리는가?","ok":["S3는 수축기 초기, S4는 수축기 말기","S3는 이완기 말기, S4는 이완기 초기","둘 다 방실판막이 닫히는 순간","둘 다 수축기 중간","S3 이완기 초기, S4 이완기 말기"],"exp":"정상 심음은 S1, S2이고, **가끔(occasionally)** S3나 S4가 들립니다.\n\n- **S3**(있다면): **이완기 초기(early diastole)**\n- **S4**(있다면): **이완기 말기(late diastole)**\n\n둘 다 **이완기** 소리이며, 번호 순서대로 S3가 먼저, S4가 나중입니다.","why":{"0":"S3와 S4는 수축기가 아니라 이완기 소리입니다.","1":"순서가 반대입니다. S3가 초기, S4가 말기입니다.","2":"방실판막이 닫히는 소리는 S1입니다.","3":"둘 다 이완기에 들립니다."},"one":"S3는 이완기 초기, S4는 이완기 말기에 들린다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 5","img":[{"u":"img/w13_murmurs/p05.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 5","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-6":{"q":"Which part of the stethoscope detects low-frequency sounds (20-70 Hz)?","o":["The earpieces","The tubing","The diaphragm","The chest piece stem","The bell"],"a":4,"qk":"청진기에서 저주파 소리(20-70 Hz)를 잡는 부분은?","ok":["귀꽂이(earpieces)","튜브(tubing)","막(diaphragm)","흉부 부품 줄기(chest piece stem)","벨(bell)"],"exp":"**청진(cardiac auscultation)**에 쓰는 청진기(stethoscope)의 두 면:\n\n- **막(diaphragm)**: **고주파(high frequencies) 100-400 Hz** 소리를 잡음\n- **벨(bell)**: **저주파(low frequencies) 20-70 Hz** 소리를 잡음\n\n외우는 법: 막은 \"높은\" 소리, 벨은 \"낮은\" 소리입니다.","why":{"0":"귀꽂이는 소리를 귀로 전달할 뿐 주파수를 골라 잡지 않습니다.","1":"튜브는 소리를 전달하는 통로입니다.","2":"막은 100-400 Hz의 고주파 소리를 잡습니다.","3":"강의는 주파수 구분을 막과 벨로만 설명합니다."},"one":"청진기의 막은 고주파(100-400 Hz), 벨은 저주파(20-70 Hz)를 잡는다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 6","img":[{"u":"img/w13_murmurs/p06.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 6","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-7":{"q":"On the starred cardiac auscultation diagram, where is the auscultation position for the mitral valve?","o":["At the apex, on the lower left chest","Above the clavicle","At the upper right sternal border","On the right side of the lower sternum","At the upper left sternal border"],"a":0,"qk":"별표 표시된 심장 청진 그림에서 승모판(mitral valve)의 청진 위치는?","ok":["왼쪽 가슴 아래쪽의 심첨부","쇄골 위","흉골 오른쪽 위 가장자리","흉골 아래쪽 오른편 가장자리","흉골 왼쪽 위 가장자리"],"exp":"**(별표) 심장 청진(cardiac auscultation)** 그림의 네 청진 위치:\n\n- **대동맥판(aortic valve)**: **흉골 오른쪽 위** (환자 기준 오른쪽)\n- **폐동맥판(pulmonary valve)**: **흉골 왼쪽 위**\n- **삼첨판(tricuspid valve)**: **흉골 왼쪽 아래 가장자리**\n- **승모판(mitral valve)**: 더 바깥쪽 아래인 **왼쪽 가슴 아래, 심첨부(apex)**\n\n각 판막의 소리는 판막 자체 위치가 아니라 혈류가 흘러가는 방향의 청진 위치에서 가장 잘 들립니다.","why":{"1":"쇄골 위는 그림의 심장 청진 위치가 아닙니다.","2":"흉골 오른쪽 위는 대동맥판 청진 위치입니다.","3":"그림에 흉골 아래 오른편 청진 위치는 없으며, 삼첨판은 흉골 왼쪽 아래 가장자리입니다.","4":"흉골 왼쪽 위는 폐동맥판 청진 위치입니다."},"one":"청진 위치: 대동맥판 흉골 우상, 폐동맥판 흉골 좌상, 삼첨판 흉골 좌하, 승모판 심첨부.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 7","img":[{"u":"img/w13_murmurs/p07.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 7","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-8":{"q":"What causes innocent murmurs?","o":["Infection of the heart valves","Increased flow or turbulence across anatomically normal valves","Scarring of the mitral valve from rheumatic fever","Calcific degeneration of the aortic valve leaflets in older adults","A hole in the ventricular septum"],"a":1,"qk":"무해성 심잡음(innocent murmur)의 원인은?","ok":["심장 판막의 감염","정상 판막을 지나는 혈류 증가나 난류","류마티스열로 인한 승모판 흉터","노인에서 대동맥판 판막엽의 석회화 변성","심실중격의 구멍"],"exp":"강의에서 다루는 심잡음은 네 종류입니다: **수축기(systolic), 이완기(diastolic), 연속성(continuous), 무해성(innocent)** 심잡음.\n\n**무해성 심잡음(innocent murmur)**은 **해부학적으로 정상인 판막(anatomically normal valves)**을 지나는 **혈류 증가나 난류(increased flow or turbulence)** 때문에 생깁니다. 판막 자체에는 구조적 이상이 없습니다.","why":{"0":"판막 감염은 감염성 심내막염입니다.","2":"류마티스성 판막 손상은 비정상 판막이라 무해성이 아닙니다.","3":"대동맥판 석회화는 대동맥판 협착이라는 구조적 이상입니다.","4":"심실중격결손(VSD)은 구조적 결손이라 무해성이 아닙니다."},"one":"무해성 심잡음은 정상 판막을 지나는 혈류 증가나 난류로 생긴다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 9","img":[{"u":"img/w13_murmurs/p09.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 9","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-9":{"q":"In the long systolic murmur flowchart, a murmur that increases with inspiration suggests which lesions?","o":["Hypertrophic cardiomyopathy","Mitral stenosis or severe aortic regurgitation","Tricuspid regurgitation or pulmonic stenosis","Aortic stenosis","Mitral regurgitation or VSD"],"a":2,"qk":"긴 수축기 심잡음(long systolic murmur) 순서도에서 들숨 때 커지는 심잡음은 어떤 병변을 시사하는가?","ok":["비대성 심근병증","승모판 협착 또는 심한 대동맥판 역류","삼첨판 역류 또는 폐동맥판 협착","대동맥판 협착","승모판 역류 또는 심실중격결손"],"exp":"**긴 수축기 심잡음(long systolic murmur)** 순서도:\n\n1. **들숨 때 커짐(increases with inspiration)** → **삼첨판 역류(tricuspid regurgitation) 또는 폐동맥판 협착(pulmonic stenosis)**\n2. 들숨에 변화 없음 → **발살바(Valsalva)나 쪼그려 앉았다 일어서기(squat to stand)**에 커지면 → **비대성 심근병증(hypertrophic cardiomyopathy)**\n3. 아니면 → **손 쥐기(handgrip)나 일시적 동맥 폐쇄**에 커지면 → **승모판 역류(mitral regurgitation) 또는 VSD**\n4. 아니면 → **대동맥판 협착(aortic stenosis)**\n\n들숨에 오른쪽 심장으로 들어오는 혈액이 늘어서 **오른쪽 심장 병변**의 소리가 커집니다.","why":{"0":"비대성 심근병증은 발살바나 일어서기에 커질 때입니다.","1":"승모판 협착과 대동맥판 역류는 수축기가 아니라 이완기 심잡음입니다.","3":"대동맥판 협착은 들숨, 발살바, 손 쥐기에 모두 커지지 않을 때입니다.","4":"승모판 역류나 VSD는 손 쥐기에 커질 때입니다."},"one":"들숨에 커지는 긴 수축기 심잡음은 삼첨판 역류나 폐동맥판 협착, 즉 오른쪽 심장 병변이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 10","img":[{"u":"img/w13_murmurs/p10.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 10","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-10":{"q":"What is the most common abnormal auscultatory finding on cardiac examination?","o":["A diastolic murmur","A pericardial friction rub","An S4 sound","A systolic murmur","A continuous murmur"],"a":3,"qk":"심장 진찰에서 가장 흔한 비정상 청진 소견은?","ok":["이완기 심잡음","심낭 마찰음","S4 심음","수축기 심잡음","연속성 심잡음"],"exp":"**심장 진찰에서 가장 흔한 비정상 청진 소견은 수축기 심잡음(systolic murmur)**입니다.\n\n**수축기 심잡음**의 예:\n\n- **대동맥판 협착(aortic stenosis)**\n- **승모판 역류(mitral regurgitation)**\n- **폐동맥판 협착(pulmonary stenosis)**\n- **삼첨판 역류(tricuspid regurgitation)**\n- **중격 결손(septal defects)**: 심실중격결손, 심방중격결손","why":{"0":"이완기 심잡음은 대동맥판 역류, 승모판 협착이며 가장 흔한 소견으로 제시되지 않았습니다.","1":"심낭 마찰음은 이 강의에서 다루지 않습니다.","2":"S4는 심음이며, 가장 흔한 비정상 소견은 수축기 심잡음입니다.","4":"연속성 심잡음은 가장 흔한 소견으로 제시되지 않았습니다."},"one":"가장 흔한 비정상 청진 소견은 수축기 심잡음이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 12","img":[{"u":"img/w13_murmurs/p12.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 12","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-11":{"q":"About two-thirds of aortic regurgitation cases are secondary to what?","o":["Mitral valve prolapse","Acromegaly","Rheumatic heart disease","Hypertrophic cardiomyopathy","Senile calcification"],"a":2,"qk":"대동맥판 역류(aortic regurgitation) 사례의 약 3분의 2는 무엇에 이차적으로 생기는가?","ok":["승모판 탈출증","말단비대증","류마티스성 심장병","비대성 심근병증(HCM)","노인성 석회화"],"exp":"**(별표) 이완기 심잡음(diastolic murmurs)**은 두 가지입니다.\n\n**대동맥판 역류(aortic regurgitation)** — 남성 3:1\n\n- **2/3는 류마티스성 심장병(rheumatic heart disease)**에 이차적\n- 그 밖: **마르판 증후군(Marfan syndrome)**, 원발성 선천성 또는 **매독(syphilis) 감염** 관련, **감염성 심내막염으로 인한 판막 손상**\n\n**승모판 협착(mitral stenosis)** — 여성 2:1\n\n- **대부분 류마티스성 심장병**\n- **전수축기 강화(pre-systolic accentuation)를 동반한 전이완기(holodiastolic)** 심잡음, 원인은 **심방 킥(atrial kick)**","why":{"0":"승모판 탈출증은 수축기 심잡음입니다.","1":"말단비대증은 \"기타 원인\"의 내분비 질환으로 나옵니다.","3":"비대성 심근병증은 수축기 심잡음 순서도에 나옵니다.","4":"노인성 석회화는 대동맥판 협착(aortic stenosis)의 원인입니다."},"one":"대동맥판 역류는 남성에 많고(3:1), 2/3가 류마티스성 심장병 때문이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 13","img":[{"u":"img/w13_murmurs/p13.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 13","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-12":{"q":"Which condition is listed as able to cause or exacerbate an innocent heart murmur?","o":["Hypothyroidism","Hyperthyroidism","Bradycardia","Hypothermia","Prolonged bed rest"],"a":1,"qk":"무해성 심잡음(innocent murmur)을 일으키거나 악화시킬 수 있는 상태로 나온 것은?","ok":["갑상선기능저하증","갑상선기능항진증","서맥","저체온증","장기간 침상 안정"],"exp":"**(별표) 무해성 심잡음을 일으키거나 악화시키는 상태**는 모두 **심장을 지나는 혈류를 더 빠르게 하는(more rapid blood flow through the heart)** 상태입니다.\n\n- **신체 활동이나 운동(physical activity or exercise)**\n- **임신(pregnancy)**\n- **발열(fever)**\n- **심장 구조의 변화**(노화나 심장 수술)\n- **빈혈/저산소혈증(anemia/hypoxemia)**\n- **갑상선기능항진증(hyperthyroidism)**, 즉 갑상선 호르몬 과다","why":{"0":"갑상선기능저하증은 목록에 없으며, 목록은 갑상선 호르몬 과다(항진증)입니다.","2":"서맥은 혈류를 빠르게 하는 상태로 나오지 않았습니다.","3":"목록은 발열이며 저체온증이 아닙니다.","4":"목록은 신체 활동이나 운동이며 침상 안정이 아닙니다."},"one":"운동, 임신, 발열, 빈혈, 갑상선기능항진증처럼 혈류를 빠르게 하는 상태가 무해성 심잡음을 만든다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 14","img":[{"u":"img/w13_murmurs/p14.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 14","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-13":{"q":"Which sign is listed as possibly indicating a heart problem?","o":["Skin that appears blue at the fingertips and lips","Hair loss on the scalp","Ringing in the ears","Yellowing of the teeth","Increased appetite and unusually rapid growth in infants"],"a":0,"qk":"심장 문제를 시사할 수 있는 징후로 나온 것은?","ok":["손끝과 입술이 파랗게 보이는 피부","두피 탈모","귀울림","치아의 황변","영아의 식욕 증가와 비정상적으로 빠른 성장"],"exp":"**심장 문제를 시사할 수 있는 징후/증상**:\n\n- **피부가 파랗게 보임(손끝, 입술)**, 즉 청색증(cyanosis)\n- **부종(swelling)**\n- **숨참(shortness of breath)**\n- **간 비대(enlarged liver)**\n- **목정맥 확장(enlarged neck veins)**\n- **식욕 부진과 정상 성장 실패(영아)**\n- **체중 증가**(성인과 소아)\n- **약간의 운동에도 심한 땀**\n- **흉통(chest pain)**, **어지럼(dizziness)**, **실신(fainting)**","why":{"1":"두피 탈모는 목록에 없습니다.","2":"귀울림은 목록에 없습니다.","3":"치아 황변은 목록에 없습니다.","4":"영아에서는 식욕 증가가 아니라 식욕 부진과 성장 실패입니다."},"one":"청색증, 부종, 숨참, 간 비대, 목정맥 확장, 영아의 성장 실패 등은 심장 문제를 시사한다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 15","img":[{"u":"img/w13_murmurs/p15.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 15","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-14":{"q":"Which starred single-gene defect carries a higher risk of congenital heart disease?","o":["Trisomy 21","Hemifacial microsomia","DiGeorge syndrome","Turner syndrome","Marfan syndrome"],"a":4,"qk":"선천성 심장병(CHD) 위험을 높이는 단일 유전자 결함(single gene defect) 중 별표 표시된 것은?","ok":["21번 삼염색체증","반안면 왜소증","디조지 증후군","터너 증후군","마르판 증후군"],"exp":"**(별표) 선천성 심장병(congenital heart disease, CHD) 위험이 높은 경우** - 유전 요인:\n\n**단일 유전자 결함(single gene defect)**\n\n- **마르판 증후군(Marfan syndrome)** (별표)\n- 스미스-렘리-오피츠 증후군(Smith-Lemli-Opitz syndrome)\n- 누난 증후군(Noonan syndrome)\n- 점액다당류증(mucopolysaccharidoses) 등\n\n**기타 유전 증후군**\n\n- **반안면 왜소증(hemifacial microsomia)** (별표)\n- **VACTERL**","why":{"0":"21번 삼염색체증은 염색체 이상입니다.","1":"반안면 왜소증은 단일 유전자 결함이 아니라 \"기타 유전 증후군\"입니다.","2":"디조지 증후군(22q11 결실)은 염색체 이상입니다.","3":"터너 증후군은 염색체 이상입니다."},"one":"CHD 위험을 높이는 단일 유전자 결함 중 별표는 마르판 증후군이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 16","img":[{"u":"img/w13_murmurs/p16.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 16","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-15":{"q":"With a family history of CHD, the risk of congenital heart disease can be up to what, compared with 1% in the general population?","o":["Up to 2%","Up to 10%","Up to 90%","Up to 50%","Up to 5%"],"a":3,"qk":"선천성 심장병(CHD) 가족력이 있으면 일반 인구의 1%에 비해 CHD 위험이 최대 얼마까지 될 수 있는가?","ok":["최대 2%","최대 10%","최대 90%","최대 50%","최대 5%"],"exp":"**(별표) CHD 가족력(family history of CHD)**: 위험이 **최대 50%**까지 (일반 인구는 **1%**)\n\n**(별표) 염색체 이상(chromosome abnormalities)**\n\n- CHD 아기의 **5-8%**가 염색체 이상을 가짐\n- CHD 발생이 높은 염색체 질환: **21, 18, 13번 삼염색체증(trisomy)** (별표), **터너 증후군(Turner syndrome, XO)** (별표), **묘성 증후군(cri du chat)**, **디조지 증후군(DiGeorge, 22q11 결실)**","why":{"0":"2%는 강의 수치가 아닙니다.","1":"10%는 강의 수치가 아닙니다.","2":"90%는 강의 수치보다 높습니다.","4":"5%는 일반 인구 1%보다 높지만 강의 수치인 50%가 아닙니다."},"one":"CHD 가족력이 있으면 위험이 최대 50%(일반 인구 1%)이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 18","img":[{"u":"img/w13_murmurs/p18.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 18","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-16":{"q":"Which starred maternal factor raises the risk of congenital heart disease?","o":["Lithium used to treat depression","Iron supplementation","Rubella vaccination before pregnancy","Well-controlled blood pressure","Folic acid supplementation"],"a":0,"qk":"선천성 심장병 위험을 높이는 모체 요인 중 별표 표시된 것은?","ok":["우울증 치료에 쓰는 리튬","철분 보충","임신 전에 맞은 풍진 예방접종","잘 조절된 혈압","엽산 보충"],"exp":"**(별표) CHD 위험을 높이는 모체 요인(maternal factors)**:\n\n- **항경련제(anti-seizure medications)** (별표)\n- **리튬(lithium, 우울증 치료)** (별표)\n- **페닐케톤뇨증(PKU)의 관리 부실**\n- **조절이 안 되는 인슐린 의존성 당뇨(poorly controlled insulin-dependent diabetes)** (별표)\n- **임신 첫 3개월(first trimester)의 풍진(rubella)**","why":{"1":"철분 보충은 위험 요인 목록에 없습니다.","2":"위험 요인은 임신 첫 3개월의 풍진 감염이지 예방접종이 아닙니다.","3":"목록은 조절이 안 되는 당뇨이며, 잘 조절된 혈압은 위험 요인이 아닙니다.","4":"엽산 보충은 위험 요인 목록에 없습니다."},"one":"항경련제, 리튬, 조절 안 되는 인슐린 의존성 당뇨(별표), PKU 관리 부실, 임신 초기 풍진이 CHD 위험을 높인다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 19","img":[{"u":"img/w13_murmurs/p19.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 19","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-17":{"q":"What is the most common cause of abnormal murmurs in children?","o":["Rheumatic fever","Senile calcific aortic stenosis","Radiation therapy","Systemic lupus erythematosus","Congenital heart disease"],"a":4,"qk":"소아에서 비정상 심잡음의 가장 흔한 원인은?","ok":["류마티스열","노인성 석회화 대동맥판 협착","방사선 치료","전신홍반루푸스","선천성 심장병"],"exp":"**(별표) 소아에서 비정상 심잡음의 가장 흔한 원인은 선천성 심장병(congenital heart disease)**입니다.\n\n- **청색증형(cyanotic)**: 단심실(single ventricle), 대혈관 전위(transposition of great arteries), **팔로 4징(Tetralogy of Fallot)**\n- **비청색증형(non-cyanotic)**: **심방중격결손(ASD)**, **심실중격결손(VSD)**, **동맥관 개존(PDA)**, **대동맥 축착(coarctation of the aorta)**","why":{"0":"류마티스열은 나이 든 소아나 성인의 후천성 원인입니다.","1":"노인성 석회화 대동맥판 협착은 노인의 원인입니다.","2":"방사선 치료는 후천성 원인입니다.","3":"전신홍반루푸스는 나이 든 소아나 성인의 후천성 원인입니다."},"one":"소아 비정상 심잡음의 가장 흔한 원인은 선천성 심장병이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 20","img":[{"u":"img/w13_murmurs/p20.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 20","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-18":{"q":"Which starred condition is listed as a common acquired cause of abnormal murmurs in older children or adults?","o":["Atrial septal defect","Systemic lupus erythematosus (SLE)","Patent ductus arteriosus","Turner syndrome","Tetralogy of Fallot diagnosed at birth"],"a":1,"qk":"나이 든 소아나 성인에서 비정상 심잡음의 흔한 후천성 원인으로 별표 표시된 것은?","ok":["심방중격결손","전신홍반루푸스(SLE)","동맥관 개존","터너 증후군","출생 시 진단된 팔로 4징"],"exp":"**(별표) 나이 든 소아나 성인에서 비정상 심잡음의 가장 흔한 원인 - 후천성 병변(acquired lesions)**:\n\n- **류마티스열(rheumatic fever)** (별표)\n- **노인성 석회화 대동맥판 협착(senile calcific aortic stenosis)** (별표)\n- **승모판 탈출증(mitral valve prolapse, MVP)** (별표)\n- **심내막염(endocarditis)**\n- **전신홍반루푸스(SLE)** (별표)\n- **방사선 치료(radiation therapy)**\n- **내분비 질환(endocrine conditions)**\n\n일부 선천성 심장 이상은 나중에야 진단되기도 합니다.","why":{"0":"심방중격결손은 선천성 심장병입니다.","2":"동맥관 개존은 선천성 심장병입니다.","3":"터너 증후군은 CHD 위험을 높이는 염색체 이상입니다.","4":"팔로 4징은 선천성 심장병입니다."},"one":"성인 후천성 심잡음 원인 중 별표: 류마티스열, 노인성 석회화 AS, MVP, SLE.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 21","img":[{"u":"img/w13_murmurs/p21.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 21","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-19":{"q":"Worldwide, what is the most common cause of clinically significant heart murmurs?","o":["Congenital bicuspid aortic valve","Mitral valve prolapse","Rheumatic fever, through rheumatic heart disease","Radiation therapy to the mediastinum for lymphoma","Senile calcific aortic stenosis"],"a":2,"qk":"전 세계적으로 임상적으로 의미 있는 심잡음의 가장 흔한 원인은?","ok":["선천성 이첨 대동맥판","승모판 탈출증","류마티스성 심장병을 통한 류마티스열","림프종 치료를 위한 종격동 방사선 치료","노인성 석회화 대동맥판 협착"],"exp":"**(별표) 가장 흔한 원인**:\n\n- **전 세계(worldwide)**: **류마티스열(rheumatic fever)**이 **류마티스성 심장병(rheumatic heart disease)**을 통해 임상적으로 의미 있는 심잡음의 가장 흔한 원인\n- **미국(USA)**: **노인성 석회화 대동맥판 협착(senile calcific AS)**과 **승모판 탈출증(MVP)**이 가장 흔한 원인","why":{"0":"이첨 대동맥판은 중년의 석회화 대동맥판 협착 원인으로 나옵니다.","1":"승모판 탈출증은 미국에서 가장 흔한 원인입니다.","3":"종격동 방사선 치료는 \"기타 원인\"입니다.","4":"노인성 석회화 AS는 미국에서 가장 흔한 원인입니다."},"one":"전 세계 1위 원인은 류마티스열(류마티스성 심장병), 미국은 노인성 석회화 AS와 MVP이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 22","img":[{"u":"img/w13_murmurs/p22.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 22","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-20":{"q":"Rheumatic fever is triggered by what, and which lesions does it most commonly cause?","o":["Fungal pneumonia; ventricular septal defect","Group A streptococcal pharyngitis; aortic stenosis and pulmonic stenosis","Viral hepatitis; mitral valve prolapse","Group A streptococcal pharyngitis; mitral stenosis and aortic regurgitation","Staphylococcus aureus skin infection; tricuspid regurgitation and pulmonic stenosis"],"a":3,"qk":"류마티스열(rheumatic fever)은 무엇에 의해 유발되며, 가장 흔히 어떤 병변을 일으키는가?","ok":["진균 폐렴; 심실중격결손","A군 연쇄상구균 인두염; 대동맥판 협착과 폐동맥판 협착","바이러스 간염; 승모판 탈출증","A군 연쇄상구균 인두염; 승모판 협착과 대동맥판 역류","황색포도알균 피부 감염; 삼첨판 역류와 폐동맥판 협착"],"exp":"**류마티스열(rheumatic fever)**:\n\n- **A군 연쇄상구균 인두염(group A streptococcal pharyngitis)**으로 유발\n- **(별표) 가장 흔한 병변: 승모판 협착(mitral stenosis)과 대동맥판 역류(aortic insufficiency/regurgitation)** → 결과적으로 **이완기 심잡음(diastolic murmurs)**\n\n사진은 점상출혈과 삼출물이 있는 12세 여아의 후인두이며, 신속 항원 검사와 인후 배양 모두 A군 베타용혈성 연쇄상구균 양성이었습니다.","why":{"0":"진균 폐렴은 류마티스열의 원인이 아닙니다.","1":"유발 원인은 맞지만 병변은 승모판 협착과 대동맥판 역류(이완기 심잡음)입니다.","2":"바이러스 간염은 류마티스열의 원인이 아닙니다.","4":"황색포도알균은 급성 심내막염의 가장 흔한 원인이며, 류마티스열 유발 원인이 아닙니다."},"one":"류마티스열은 A군 연쇄상구균 인두염 뒤에 생기며 승모판 협착과 대동맥판 역류(이완기 심잡음)를 남긴다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 23","img":[{"u":"img/w13_murmurs/p23.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 23","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-21":{"q":"If a middle-aged person has calcific aortic stenosis, what is the most likely cause?","o":["A congenital bicuspid aortic valve","Mitral valve prolapse","Hyperthyroidism","Calcific degeneration of aging","Infective endocarditis of the tricuspid valve"],"a":0,"qk":"중년의 사람에게 석회화 대동맥판 협착(calcific aortic stenosis)이 있다면 가장 가능성 높은 원인은?","ok":["선천성 이첨 대동맥판","승모판 탈출증","갑상선기능항진증","노화에 따른 석회화 변성","삼첨판의 감염성 심내막염"],"exp":"**대동맥판 협착(aortic stenosis)**:\n\n- **노인(elderly)**: 대동맥판이 **석회화 변성(calcific degeneration)**을 겪어 대동맥 구멍이 좁아짐\n- **중년(middle-aged)**에 석회화 대동맥판 협착이 있으면 → 가장 가능성 높은 원인은 **선천성 이첨 대동맥판(congenital bicuspid aortic valve, BAV)**\n- BAV는 **전체 출생아의 1-2%**에서 생깁니다","why":{"1":"승모판 탈출증은 승모판 병변입니다.","2":"갑상선기능항진증은 무해성 심잡음을 악화시키는 상태입니다.","3":"노화에 따른 석회화 변성은 노인의 원인입니다.","4":"삼첨판 심내막염은 정맥주사 약물 사용자의 급성 심내막염과 관련됩니다."},"one":"노인의 AS는 석회화 변성, 중년의 석회화 AS는 선천성 이첨 대동맥판(출생아 1-2%) 때문이다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 24","img":[{"u":"img/w13_murmurs/p24.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 24","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-22":{"q":"Which murmur can result from taking the diet medication fenfluramine-phentermine for more than 6 months?","o":["Pulmonic stenosis","Mitral stenosis","Ventricular septal defect","Mild aortic regurgitation","Severe tricuspid regurgitation"],"a":3,"qk":"식욕억제제 펜플루라민-펜터민(fenfluramine-phentermine)을 6개월 넘게 복용하면 생길 수 있는 심잡음은?","ok":["폐동맥판 협착","승모판 협착","심실중격의 결손(VSD)","경한 대동맥판 역류","심한 삼첨판 역류"],"exp":"**심잡음의 기타 원인(other causes of murmur)**:\n\n- **다이어트 약(diet medications)**: **펜플루라민-펜터민(fenfluramine-phentermine)**을 **6개월 넘게** → **경한 대동맥판 역류(mild aortic regurgitation)**\n- **방사선 치료(radiation therapy)**: **종격동(mediastinum)** 방사선, 예: 호지킨 및 비호지킨 림프종 치료\n- **내분비 질환(endocrine conditions)**: **말단비대증(acromegaly)**","why":{"0":"폐동맥판 협착은 다이어트 약의 결과로 나오지 않았습니다.","1":"승모판 협착은 대부분 류마티스성 심장병 때문입니다.","2":"VSD는 선천성 심장병입니다.","4":"삼첨판 역류는 다이어트 약의 결과로 나오지 않았습니다."},"one":"기타 원인: 펜플루라민-펜터민 6개월 이상 → 경한 AR, 종격동 방사선(림프종), 말단비대증.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 25","img":[{"u":"img/w13_murmurs/p25.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 25","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-23":{"q":"When a systolic murmur is found on auscultation, it is considered pathologic if associated with which findings?","o":["A normal S1 and S2","Normal blood pressure readings","A resting heart rate under 100 beats per minute","Disappearance when the patient sits up","Dyspnea, chest pain, or lower-extremity edema"],"a":4,"qk":"청진에서 수축기 심잡음이 발견될 때, 어떤 소견과 함께 있으면 병적(pathologic)으로 보는가?","ok":["정상 S1과 S2","정상 혈압 수치","안정 시 분당 100회 미만의 심박수","환자가 앉으면 사라짐","호흡곤란, 흉통, 또는 하지 부종"],"exp":"**심잡음의 발견(detection of a heart murmur)** 방법: **청진(auscultation)**, **심초음파(echocardiography, 심실 박출 기능 포함)**, 흉부 X선, 심전도, 심도자술, 심장 CT나 MRI.\n\n**청진**에 대해:\n\n- 수축기 심잡음은 **소아의 80-96%**, **성인의 15-44%**에서 발견됨\n- **호흡곤란(dyspnea), 흉통(chest pain), 하지 부종(lower-extremity edema)**이 동반되면 **병적(pathologic)**으로 봄\n\n**심초음파**: **경흉부(TTE)** 민감도 60-70%, **경식도(TEE)** 민감도 75-95%로 TEE가 더 민감합니다.","why":{"0":"정상 S1, S2는 병적 판단 기준으로 나오지 않았습니다.","1":"정상 혈압은 병적 판단 기준이 아닙니다.","2":"심박수 기준은 강의에 없습니다.","3":"자세에 따른 소실은 병적 판단 기준으로 나오지 않았습니다."},"one":"수축기 심잡음에 호흡곤란, 흉통, 하지 부종이 동반되면 병적으로 본다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 27","img":[{"u":"img/w13_murmurs/p27.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 27","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-24":{"q":"In the \"back to basics\" approach to a murmur, which murmurs are listed as diastolic?","o":["Tricuspid regurgitation and pulmonic stenosis","Aortic regurgitation and mitral stenosis","Mitral valve prolapse and aortic stenosis","Mitral regurgitation and mitral valve prolapse","Aortic stenosis and mitral regurgitation"],"a":1,"qk":"심잡음의 \"기본으로 돌아가기(back to basics)\" 접근에서 이완기 심잡음으로 나온 것은?","ok":["삼첨판 역류와 폐동맥판 협착","대동맥판 역류와 승모판 협착","승모판 탈출증과 대동맥판 협착","승모판 역류와 승모판 탈출증","대동맥판 협착과 승모판 역류"],"exp":"**기본으로 돌아가기(back to basics) - 심잡음**:\n\n1. **언제 들리는가?** 수축기(systole)인가 이완기(diastole)인가\n2. **어디서 가장 큰가?** A(대동맥판), P(폐동맥판), T(삼첨판), M(승모판)\n3. **수축기 심잡음**: **대동맥판 협착(aortic stenosis)**, **승모판 역류(mitral regurgitation)**, **승모판 탈출증(mitral valve prolapse)**\n4. **이완기 심잡음**: **대동맥판 역류(aortic regurgitation)**, **승모판 협착(mitral stenosis)**\n\n외우는 법: 대동맥판은 **수축기에 열리므로** 좁으면(협착) 수축기, 새면(역류) 이완기 심잡음입니다. 승모판은 반대입니다.","why":{"0":"삼첨판 역류와 폐동맥판 협착은 수축기 심잡음입니다.","2":"승모판 탈출증과 대동맥판 협착은 수축기 심잡음입니다.","3":"승모판 역류와 승모판 탈출증은 수축기 심잡음입니다.","4":"대동맥판 협착과 승모판 역류는 수축기 심잡음입니다."},"one":"수축기: AS, MR, MVP / 이완기: AR, MS.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 28","img":[{"u":"img/w13_murmurs/p28.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 28","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-25":{"q":"In subacute endocarditis, which valve is infected most often?","o":["The pulmonary valve","The aortic valve","The mitral valve","All four valves equally","The tricuspid valve"],"a":2,"qk":"아급성 심내막염(subacute endocarditis)에서 가장 자주 감염되는 판막은?","ok":["폐동맥판","대동맥판","승모판","네 판막 모두 같은 빈도","삼첨판"],"exp":"**아급성 심내막염(subacute endocarditis)**:\n\n- 구강의 **덜 독성인(less virulent)** 균이 **치과 시술**로 전신에 들어올 수 있음\n- **혈전이나 증식물(vegetations)**은 **이미 비정상이거나 손상된 판막**에 생김\n- **(별표) 감염되는 판막 (많은 순서)**: **승모판(mitral) > 대동맥판(aortic) > 삼첨판(tricuspid)**\n- 단, **정맥주사 약물 사용자(IV drug users)**에서는 **삼첨판**이 가장 흔함","why":{"0":"폐동맥판은 목록에 없습니다.","1":"대동맥판은 두 번째로 흔합니다.","3":"빈도에는 순서가 있으며 승모판이 가장 흔합니다.","4":"삼첨판은 일반적으로 세 번째이며, 정맥주사 약물 사용자에서만 가장 흔합니다."},"one":"아급성 심내막염의 감염 판막은 승모판 > 대동맥판 > 삼첨판(정맥주사 약물 사용자는 삼첨판이 최다).","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 30","img":[{"u":"img/w13_murmurs/p30.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 30","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-26":{"q":"What is the most common organism in acute endocarditis?","o":["Staphylococcus aureus","Mycobacterium tuberculosis","Group A streptococcus","Escherichia coli","Candida albicans"],"a":0,"qk":"급성 심내막염(acute endocarditis)의 가장 흔한 원인균은?","ok":["황색포도알균","결핵균","A군 연쇄상구균","대장균","칸디다 알비칸스"],"exp":"**급성 심내막염(acute endocarditis)**:\n\n- 가장 흔한 원인균: **황색포도알균(Staphylococcus aureus)**\n- **정맥주사 약물 사용자(IV drug users)**에서 가장 자주 발생하며, **삼첨판(tricuspid valve)**이 침범됨\n\n**아급성(subacute)**과 비교: 아급성은 **덜 독성인 구강균**이 치과 시술로 들어와 **이미 손상된 판막**에 생깁니다.","why":{"1":"결핵균은 이 강의에서 심내막염 원인으로 나오지 않습니다.","2":"A군 연쇄상구균은 류마티스열을 유발하는 인두염의 원인입니다.","3":"대장균은 급성 심내막염의 가장 흔한 원인으로 나오지 않았습니다.","4":"칸디다는 급성 심내막염의 가장 흔한 원인으로 나오지 않았습니다."},"one":"급성 심내막염은 황색포도알균이 가장 흔하고, 정맥주사 약물 사용자의 삼첨판에 잘 생긴다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 31","img":[{"u":"img/w13_murmurs/p31.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 31","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-27":{"q":"Under the starred dental treatment considerations, what should the dentist obtain besides consulting the cardiologist or physician?","o":["A new blood culture before every visit","A signed waiver to skip antibiotics","A chest X-ray taken the same day","A cardiac catheterization result","A copy of the echocardiography report"],"a":4,"qk":"별표 표시된 치과 치료 고려 사항에서, 심장내과 의사나 주치의와 상의하는 것 외에 받아 두어야 할 것은?","ok":["매 방문 전 새 혈액 배양","항생제 생략 동의서","당일 찍은 흉부 X선","심도자술 결과","심초음파 보고서 사본"],"exp":"**(별표) 치과 치료 고려 사항(dental treatment considerations)**:\n\n- 많은 환자, 특히 **노인**은 자신의 심잡음을 **모르거나 말하지 않으려** 한다는 점을 고려\n- **심장내과 의사나 주치의(cardiologist or primary care physician)**와 상의: **심잡음의 종류, 원인, 치료 계획**\n- **심초음파 보고서 사본(copy of the echocardiography report)**을 받아 둠","why":{"0":"혈액 배양은 심내막염 징후가 있을 때 항생제 전에 하는 검사입니다.","1":"항생제 생략 동의서는 강의에 없습니다.","2":"흉부 X선은 심잡음 발견 방법 중 하나이지만 치과에서 받아 둘 자료로 나온 것은 심초음파 보고서입니다.","3":"심도자술은 발견 방법 목록에 있지만 치과에서 받아 둘 자료로 나온 것은 심초음파 보고서입니다."},"one":"심잡음 환자는 담당 의사와 상의하고 심초음파 보고서 사본을 받아 둔다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 32","img":[{"u":"img/w13_murmurs/p32.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 32","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-28":{"q":"Under hemostasis concerns, what is the most common cause of atrial fibrillation?","o":["Ventricular septal defect","Hypertrophic cardiomyopathy","Congenital bicuspid aortic valve","Rheumatic mitral valve disease","Aortic stenosis"],"a":3,"qk":"지혈(hemostasis) 우려 사항에서 심방세동(atrial fibrillation)의 가장 흔한 원인은?","ok":["심실중격결손","비대성 심근병증","선천성 이첨 대동맥판 기형","류마티스성 승모판 질환","대동맥판 협착"],"exp":"**(별표) 지혈(hemostasis)**: 환자가 **항응고제(아마도 와파린, warfarin)** 치료를 받고 있을 수 있습니다.\n\n- **심방세동(atrial fibrillation, AF)의 가장 흔한 원인은 류마티스성 승모판 질환(rheumatic mitral valve disease)**\n- AF는 **나이, 고혈압, 당뇨, 울혈성 심부전**과 함께 증가\n- 치과에서 쓰는 약이 **와파린의 효과를 높일** 수 있음\n\n**주의할 다른 약**: 아세트아미노펜·NSAID·아스피린 장기 복용, **항생제**(메트로니다졸, 에리트로마이신, 세팔로스포린, 테트라사이클린, 페니실린), **항진균제**(플루코나졸, 케토코나졸)","why":{"0":"VSD는 AF의 원인으로 나오지 않았습니다.","1":"비대성 심근병증은 수축기 심잡음 순서도에 나옵니다.","2":"이첨 대동맥판은 중년 석회화 AS의 원인입니다.","4":"대동맥판 협착은 AF의 가장 흔한 원인으로 나오지 않았습니다."},"one":"AF의 가장 흔한 원인은 류마티스성 승모판 질환이고, 이런 환자는 와파린을 쓸 가능성이 높다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 34","img":[{"u":"img/w13_murmurs/p34.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 34","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-29":{"q":"Which antimicrobial used in dentistry increases the serum concentration of digoxin?","o":["Chlorhexidine rinse","Erythromycin","Amoxicillin","Nystatin","Penicillin V"],"a":1,"qk":"치과에서 쓰는 항균제 중 디곡신(digoxin)의 혈중 농도를 높이는 것은?","ok":["클로르헥시딘 가글","에리트로마이신","아목시실린","니스타틴","페니실린 V"],"exp":"**(별표) IE 감수성(susceptibility to IE)**: **대동맥판 협착과 승모판 탈출증**이 가장 흔한 판막 문제입니다.\n\n**(별표) 약물 작용과 상호작용(drug actions and interactions)**:\n\n- **디지탈리스 배당체(digitalis glycosides)**는 AF와 울혈성 심부전 치료에 쓰이며 **치료 범위가 좁고(narrow therapeutic range)** 상호작용이 많음\n- 치과에서 쓰는 항균제인 **테트라사이클린(tetracycline), 클래리스로마이신(clarithromycin), 에리트로마이신(erythromycin), 케토코나졸(ketoconazole)**이 **디곡신 혈중 농도를 높임**","why":{"0":"클로르헥시딘은 목록에 없습니다.","2":"아목시실린은 디곡신 농도를 높이는 약 목록에 없습니다.","3":"니스타틴은 목록에 없습니다.","4":"페니실린 V는 디곡신 농도를 높이는 약 목록에 없습니다."},"one":"테트라사이클린, 클래리스로마이신, 에리트로마이신, 케토코나졸은 디곡신 농도를 높인다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 35","img":[{"u":"img/w13_murmurs/p35.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 35","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-30":{"q":"How should a patient with orthopnea be positioned during dental treatment?","o":["Lying on the left side","Prone","In a more upright position","With the head lower than the feet","Fully supine"],"a":2,"qk":"기좌호흡(orthopnea)이 있는 환자는 치과 치료 중 어떤 자세로 두어야 하는가?","ok":["왼쪽으로 누운 자세","엎드린 자세","더 똑바로 세운 자세","머리를 발보다 낮춘 자세","완전히 눕힌 자세"],"exp":"**(별표) 치과 시술의 스트레스와 외상을 견디는 능력**:\n\n- 환자에게 **호흡곤란, 피로, 기좌호흡(orthopnea), 발작성 야간 호흡곤란, 두근거림, 흉통**이 있을 수 있음\n- **기좌호흡 환자는 더 똑바로 세운 자세(more upright position)**로 치료\n- **불안**은 심장 합병증을 촉발할 수 있음\n - 불안한 환자에게 **충분한 산소와 함께 아산화질소(nitrous oxide)**는 안전하고 권장됨\n - **충분한 통증 조절**","why":{"0":"강의는 옆으로 눕히는 자세를 말하지 않습니다.","1":"엎드린 자세는 치과 치료 자세가 아닙니다.","3":"머리를 낮추면 호흡이 더 힘들어집니다.","4":"완전히 눕히면 기좌호흡 환자의 숨이 더 차집니다."},"one":"기좌호흡 환자는 더 세운 자세로 치료하고, 불안하면 산소와 아산화질소를 쓴다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 36","img":[{"u":"img/w13_murmurs/p36.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 36","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-31":{"q":"When are appointments preferably scheduled for these cardiac patients?","o":["Short appointments in the late morning or early afternoon","Any time of day, as long as the visit is long and thorough","Short appointments only at night","Long appointments early in the morning","Long appointments late in the evening"],"a":0,"qk":"이런 심장 환자의 진료 약속은 언제로 잡는 것이 좋은가?","ok":["늦은 오전이나 이른 오후의 짧은 약속","길고 꼼꼼하기만 하면 하루 중 아무 때나","밤에만 잡는 짧은 약속","이른 아침의 긴 약속","늦은 저녁의 긴 약속"],"exp":"**(별표) 스트레스와 외상을 견디는 능력 (계속)**:\n\n- **러버댐(rubber dam)**은 충분한 공기를 들이마시는 것을 제한하므로 **금기일 수 있음**\n- 약속은 **짧게**, 가능하면 **늦은 오전이나 이른 오후(late morning or early afternoon)**\n- 구강 진료 외에 **혈압을 측정**하고 심혈관 변화를 선별","why":{"1":"길게 잡는 것은 권장되지 않습니다.","2":"밤 시간은 권장 시간이 아닙니다.","3":"약속은 길지 않고 짧아야 합니다.","4":"약속은 짧게, 늦은 오전이나 이른 오후가 좋습니다."},"one":"심장 환자는 짧게, 늦은 오전이나 이른 오후에 보고, 러버댐은 금기일 수 있다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 37","img":[{"u":"img/w13_murmurs/p37.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 37","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-32":{"q":"For high cardiac risk patients, a completely repaired CHD with prosthetic material or device counts as high risk during what period?","o":["Only after 1 year has passed","The first 5 years after the procedure","For the rest of the patient's life","The first 6 months after the procedure","Only the first 2 weeks after the procedure"],"a":3,"qk":"고위험 심장 환자에서, 인공 재료나 장치로 완전히 교정한 선천성 심장병(CHD)은 언제 고위험으로 보는가?","ok":["1년이 지난 뒤에만","시술 후 첫 5년 동안","평생","시술 후 첫 6개월 동안","시술 후 첫 2주 동안만"],"exp":"**고위험 심장 환자(high cardiac risk)**에게는 **잇몸 조직이나 치근단 부위를 조작하거나 구강 점막을 뚫는 모든 치과 시술**에 **항생제 예방(antibiotic prophylaxis)**이 권장됩니다.\n\n**고위험 상태**:\n\n- **인공 심장판막(prosthetic cardiac valve)**\n- **감염성 심내막염 병력(history of IE)**\n- **선천성 심장병(CHD)**\n - **교정하지 않은 청색증형 CHD** (고식적 단락·도관 포함)\n - 인공 재료나 장치로 **완전히 교정한 CHD - 시술 후 첫 6개월**\n - 인공 패치나 장치 부위·인접 부위에 **잔존 결손이 있는 교정 CHD**\n- **심장판막 질환이 있는 심장이식 수혜자**","why":{"0":"고위험인 기간은 시술 직후 첫 6개월입니다.","1":"5년이 아니라 6개월입니다.","2":"완전 교정 CHD는 첫 6개월만 고위험이며, 잔존 결손이 있으면 계속 고위험입니다.","4":"2주가 아니라 6개월입니다."},"one":"고위험: 인공판막, IE 병력, 특정 CHD(인공 재료로 완전 교정 후 첫 6개월 등), 판막 질환이 있는 심장이식 환자.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 39, 40","img":[{"u":"img/w13_murmurs/p39.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 39","w":1200,"h":675},{"u":"img/w13_murmurs/p40.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 40","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-33":{"q":"Which dental event is low risk for IE and does not need antibiotic prophylaxis?","o":["Tooth extraction","Scaling that manipulates gingival tissue","Subgingival root planing","Periapical surgery","Taking dental radiographs"],"a":4,"qk":"IE 위험이 낮아 항생제 예방이 필요 없는 치과 상황은?","ok":["발치","잇몸 조직을 조작하는 스케일링","치은연하 치근활택술","치근단 수술","치과 방사선 사진 촬영"],"exp":"**IE 위험이 낮아 항생제 예방이 필요 없는 경우**:\n\n- **감염되지 않은 조직을 통한 일상적 마취 주사**\n- **치과 방사선 사진 촬영(taking dental radiographs)**\n- **가철성 보철물이나 교정 장치의 장착**\n- **교정 장치의 조정**\n- **교정 브래킷 부착**\n- **유치의 탈락(shedding of deciduous teeth)**\n- **입술이나 구강 점막 외상으로 인한 출혈**\n\n반대로 **잇몸 조직이나 치근단 부위를 조작하거나 구강 점막을 뚫는** 시술은 고위험 환자에게 예방이 권장됩니다.","why":{"0":"발치는 잇몸 조직을 조작하고 점막을 뚫는 시술입니다.","1":"잇몸 조직을 조작하는 시술은 고위험 환자에게 예방이 권장됩니다.","2":"치은연하 치근활택술은 잇몸 조직을 조작합니다.","3":"치근단 부위를 조작하는 시술은 예방이 권장됩니다."},"one":"방사선 촬영, 비감염 조직 마취, 교정 장치 조정, 유치 탈락 등은 항생제 예방이 필요 없다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 41","img":[{"u":"img/w13_murmurs/p41.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 41","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-34":{"q":"On the AHA wallet card, what is the standard oral prophylaxis regimen for adults before dental procedures?","o":["Amoxicillin 500 mg three times a day for 7 days afterward","Amoxicillin 2 g as a single dose 30-60 minutes before","Clindamycin 2 g as a single dose after","Penicillin V 250 mg the night before","Erythromycin 1 g weekly"],"a":1,"qk":"AHA 지갑 카드(wallet card)에서 치과 시술 전 성인의 표준 경구 예방 요법은?","ok":["시술 후 7일간 아목시실린 500 mg 하루 세 번","시술 30-60분 전 아목시실린 2 g 단회","시술 후 클린다마이신 2 g 단회","전날 밤 페니실린 V 250 mg","매주 에리트로마이신 1 g"],"exp":"**치과 시술 항생제 예방 요법(AHA 지갑 카드)** - **시술 30-60분 전 단회(single dose)**:\n\n- **경구(oral)**: **아목시실린(amoxicillin) 성인 2 g**, 소아 50 mg/kg\n- **경구 복용 불가**: 암피실린, 또는 세파졸린·세프트리악손 (근주/정주)\n- **페니실린·암피실린 알레르기 (경구)**: 세팔렉신, 또는 **클린다마이신(clindamycin) 600 mg**, 또는 아지트로마이신·클래리스로마이신 500 mg\n- **세팔로스포린**은 페니실린·암피실린에 **아나필락시스, 혈관부종, 두드러기** 병력이 있으면 쓰지 않음\n\n위장관·비뇨생식기 시술만을 위한 IE 예방은 더 이상 권장되지 않습니다.","why":{"0":"예방은 시술 후 며칠 복용이 아니라 시술 전 단회입니다.","2":"클린다마이신은 페니실린 알레르기용이며 용량은 600 mg, 시술 전 단회입니다.","3":"표준 경구 약은 아목시실린이며, 전날 밤 복용이 아닙니다.","4":"매주 복용하는 요법은 없습니다."},"one":"성인 표준 예방: 시술 30-60분 전 아목시실린 2 g 경구 단회(소아 50 mg/kg).","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 42","img":[{"u":"img/w13_murmurs/p42.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 42","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13},"w13_murmurs-35":{"q":"If a patient shows signs of endocarditis such as unexplained fever, when should blood cultures be obtained?","o":["At the next routine dental visit","Only after a full course of antibiotics","Before antibiotics are started","Blood cultures are not needed","Only if the fever lasts more than a month"],"a":2,"qk":"환자에게 원인 불명의 발열 같은 심내막염 징후가 있으면 혈액 배양은 언제 해야 하는가?","ok":["다음 정기 치과 방문 때","항생제 치료를 다 마친 뒤에만","항생제를 시작하기 전","혈액 배양은 필요 없다","발열이 한 달 넘게 갈 때만"],"exp":"**새 AHA 지침(new AHA guidelines)**:\n\n- 지침이 바뀌어도 **심장 상태 때문에 IE 위험이 높다는 사실은 변하지 않음**\n- **원인 불명의 발열(unexplained fever)** 같은 심내막염 징후가 있으면 **즉시 진료**를 받아야 함\n- IE가 있는지 확인하려면 **혈액 배양(blood cultures)**이 필요\n- 배양과 관련 검사 검체는 **항생제를 시작하기 전(BEFORE antibiotics)**에 얻는 것이 중요","why":{"0":"다음 정기 방문까지 기다리지 않고 즉시 진료를 받아야 합니다.","1":"항생제를 먼저 쓰면 배양 결과를 믿기 어려우므로 시작 전에 채취합니다.","3":"IE 확인에는 혈액 배양이 필요합니다.","4":"즉시 진료를 받아야 하며 한 달을 기다리지 않습니다."},"one":"심내막염 징후가 있으면 즉시 진료하고, 혈액 배양은 항생제 시작 전에 한다.","src":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 43","img":[{"u":"img/w13_murmurs/p43.webp","cap":"THE PATIENT with HEART MURMURS-2025-CANVAS.pdf, slide 43","w":1200,"h":675}],"ch":"w13_murmurs","chn":"The Patient with Heart Murmurs","week":13}},"mix":{"title":"Mixed Quiz (11/17)","subtitle":"Week 10 & 11 · all lectures except Pulmonary & CV Physiology","sets":[{"key":"mix_1117_01","name":"Set 1","ids":["w11_resp_inf-56","w10_wrist-2","w10_arm-30","w10_riedel-26","w11_heart-21","w11_thorax-12","w11_resp_inf-10","w11_mycology-39","w11_cv_histo-14","w11_resp_histo-29"],"nq":10,"status":"ready","mixed":true,"weekName":"Mixed Qui /*DATA*/
const LS='biomed_final_';let S=null,set=null;
function load(k){try{return JSON.parse(localStorage.getItem(LS+k))}catch(e){return null}}
function save(){if(set)localStorage.setItem(LS+set.key,JSON.stringify(S));localStorage.setItem(LS+'last',set?set.key:'')}
function fresh(){return{mode:'study',ans:{},chk:{},cur:0,submitted:false,score:null,retry:null}}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function md(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').split(/\n\n/).map(p=>'<p>'+p.replace(/\n/g,'<br>')+'</p>').join('')}
const th=localStorage.getItem(LS+'theme');if(th==='dark')document.body.classList.add('dark');
function setThemeBtn(){theme.textContent=document.body.classList.contains('dark')?'Light':'Dark'}setThemeBtn();
theme.onclick=()=>{document.body.classList.toggle('dark');localStorage.setItem(LS+'theme',document.body.classList.contains('dark')?'dark':'light');setThemeBtn()};
document.getElementById('home').onclick=home;
function packs(){return D.chapters}
function mixSets(){return (D.mix&&D.mix.sets)||[]}
function findPack(key){return D.chapters.find(c=>c.key===key)||mixSets().find(c=>c.key===key)}
function weekGroups(){
  const map=new Map();
  D.chapters.forEach(c=>{
    const id=c.week, name=c.weekName||('Week '+id);
    if(!map.has(id)) map.set(id,{id,name,chapters:[]});
    map.get(id).chapters.push(c);
  });
  return [...map.values()].sort((a,b)=>a.id-b.id);
}
function backLabel(){return '← Chapters'}
function qCount(s){return (s.ids&&s.ids.length)?s.ids.length:(s.nq||30)}
function hasQuestions(s){return !!(s.ids && s.ids.length)}
function ready(s){return s.status!=='pending' && hasQuestions(s)}
function progressLabel(s){
  const st=load(s.key), n=qCount(s);
  if(!st) return 'Not started';
  if(st.score) return 'Submitted: '+st.score.c+'/'+st.score.t;
  return 'In progress: '+Object.keys(st.ans).length+'/'+n;
}
function home(){set=null;localStorage.setItem(LS+'last','');
  const groups=weekGroups();
  const readyCh=D.chapters.filter(ready);
  const tot=readyCh.reduce((a,c)=>a+qCount(c),0);
  const nCh=D.chapters.length;
  const intro='<b>'+tot+' questions · '+readyCh.length+' chapters ready</b>'
    +(mixSets().length?'<div class="mu" style="margin-top:6px"><b>'+mixSets().length+' mixed 10-question sets</b> for the 11/17 quiz are listed first. Each set draws from Week 10 and Week 11 lectures (not Pulmonary or CV Physiology). Progress is saved separately from the chapter quizzes.</div>':'')
    +'<div class="mu">Chapters are grouped by week. New weeks can be added to this same site — existing progress stays on this device, under the same chapter keys.</div>'
    +'<div class="mu" style="margin-top:6px">Pick an answer (you can change it), then press <b>Check</b> to see the Korean translation, the answer, a detailed explanation, the source, and the original slide. Progress is saved on this device automatically, per chapter.</div>';
  let h='<div class="card">'+intro+'</div>';
  if(mixSets().length){
    const sets=mixSets();
    const nq=sets.reduce((a,s)=>a+qCount(s),0);
    h+='<div class="week-h"><h2>'+esc(D.mix.title||'Mixed Quiz (11/17)')+'</h2><span class="mu">'+sets.length+' sets · '+nq+' questions · 10 per set</span></div>';
    if(D.mix.subtitle) h+='<div class="mu" style="margin:-4px 0 10px">'+esc(D.mix.subtitle)+'</div>';
    h+='<div class="grid">';
    sets.forEach(s=>{
      const st=load(s.key);
      h+='<div class="card">'
        +'<div><span class="badge">11/17</span></div>'
        +'<b>'+esc(s.name)+'</b>'
        +'<div class="prof">'+esc(s.prof||D.mix.subtitle||'')+'</div>'
        +'<div class="mu">'+qCount(s)+' questions · '+esc(progressLabel(s))+'</div>'
        +'<div class="row" style="margin-top:10px">'
        +'<button class="pri" data-k="'+esc(s.key)+'">'+(st?'Resume':'Start')+'</button>'
        +(st?'<button data-r="'+esc(s.key)+'">Reset</button>':'')
        +'</div></div>';
    });
    h+='</div>';
  }
  groups.forEach(g=>{
    const nq=g.chapters.reduce((a,c)=>a+(ready(c)?qCount(c):0),0);
    h+='<div class="week-h"><h2>'+esc(g.name)+'</h2><span class="mu">'+g.chapters.length+' chapter'+(g.chapters.length>1?'s':'')+(nq?(' · '+nq+' questions'):'')+'</span></div><div class="grid">';
    g.chapters.forEach(s=>{
      const live=s.status!=='pending';
      const go=hasQuestions(s);
      const st=live?load(s.key):null;
      const info=live?progressLabel(s):(s.pendingReason||'Questions coming soon');
      h+='<div class="card">'
        +'<div><span class="badge">'+esc(g.name)+'</span>'+(live?'':'<span class="badge pend">Pending</span>')+'</div>'
        +'<b>'+esc(s.name)+'</b>'
        +'<div class="prof">'+esc(s.prof||'')+'</div>'
        +'<div class="mu">'+qCount(s)+' questions · '+esc(info)+'</div>'
        +'<div class="row" style="margin-top:10px">';
      if(go){
        h+='<button class="pri" data-k="'+esc(s.key)+'">'+(st?'Resume':'Start')+'</button>';
        if(st) h+='<button data-r="'+esc(s.key)+'">Reset</button>';
      }else{
        h+='<button disabled>Start</button>';
      }
      h+='</div></div>';
    });
    h+='</div>';
  });
  app.innerHTML=h;
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>open_(b.dataset.k));
  app.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{
    const s=findPack(b.dataset.r);
    if(confirm('Reset progress for '+s.name+' only?')){localStorage.removeItem(LS+s.key);home()}
  });
}
function open_(key){
  set=findPack(key);
  if(!set||!ready(set))return;
  S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render();scrollTo(0,0);
}
function ctx(){return S.retry?S.retry:S}
function ids(){return S.retry?S.retry.ids:set.ids}
function expl(q,my){const L='ABCDE';let h='';
  h+='<h4>문제 번역</h4><p>'+esc(q.qk)+'</p>';
  h+='<h4>보기 번역</h4><p>'+q.ok.map((o,k)=>L[k]+'. '+esc(o)).join('<br>')+'</p>';
  h+='<h4>정답</h4><p><b>'+L[q.a]+'. '+esc(q.o[q.a])+'</b></p>';
  h+='<h4>해설</h4>'+md(q.exp);
  const w=Object.keys(q.why||{}).map(Number).filter(k=>k!==q.a).sort();
  if(w.length) h+='<h4>오답 해설</h4><p>'+w.map(k=>'<b>'+L[k]+'. '+esc(q.o[k])+'</b> — '+esc(q.why[k])).join('<br>')+'</p>';
  if(q.one) h+='<h4>한 줄 정리</h4><p>'+esc(q.one)+'</p>';
  h+='<h4>출처</h4><p class="mu">'+esc(q.src)+'</p>';
  h+=(q.img||[]).map(m=>'<figure class="slide"><img src="'+m.u+'" alt="'+esc(m.cap)+'" loading="lazy" decoding="async"'
    +(m.w?(' width="'+m.w+'"'):'')+(m.h?(' height="'+m.h+'"'):'')
    +' data-z="'+m.u+'" data-c="'+esc(m.cap)+'"><figcaption>'+esc(m.cap)+' <span class="mu">· tap to enlarge</span></figcaption></figure>').join('');
  return h;
}
function zoom(u,c){const z=document.createElement('div');z.id='zoom';z.innerHTML='<img src="'+u+'" alt="'+esc(c)+'"><div class="zc">'+esc(c)+' · tap to close</div>';z.onclick=()=>z.remove();document.body.appendChild(z)}
document.addEventListener('click',e=>{const i=e.target.closest&&e.target.closest('img[data-z]');if(i)zoom(i.dataset.z,i.dataset.c)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const z=document.getElementById('zoom');if(z)z.remove()}});
function render(){const A=ctx(),L=ids(),id=L[A.cur],q=D.q[id],my=A.ans[id];if(!A.chk)A.chk={};
  const reveal=(A.mode==='study'&&A.chk[id])||A.submitted;
  let h='<div class="row" style="justify-content:space-between"><button id="back">'+backLabel()+'</button><span class="mu">'+esc(set.name)+(S.retry?' · Retry':'')+'</span></div>';
  h+='<div class="row" style="margin-top:10px"><span class="mu">Mode:</span><button id="ms" '+(A.mode==='study'?'class="pri"':'')+' '+(A.submitted?'disabled':'')+'>Study (check each)</button><button id="me" '+(A.mode==='exam'?'class="pri"':'')+' '+(A.submitted?'disabled':'')+'>Exam (submit at end)</button></div>';
  h+='<div class="nav">'+L.map((x,j)=>{let c=[];if(A.ans[x]!==undefined)c.push('ans');if(j===A.cur)c.push('cur');if(A.submitted||(A.mode==='study'&&A.chk[x])){if(A.ans[x]!==undefined)c.push(A.ans[x]===D.q[x].a?'r':'w')}return '<button class="'+c.join(' ')+'" data-j="'+j+'">'+(j+1)+'</button>'}).join('')+'</div>';
  const tag=(q.chn)?((q.week?('Week '+q.week+' · '):'')+q.chn):((set.weekName||('Week '+set.week))+' · '+set.name);
  h+='<div class="card"><div class="mu"><span class="tag">'+esc(tag)+'</span>Question '+(A.cur+1)+' of '+L.length+'</div><p style="font-size:1.05rem"><b>'+esc(q.q)+'</b></p>';
  if(q.fig){h+='<figure class="slide"><img src="'+q.fig.u+'" alt="'+esc(q.fig.cap||'Figure')+'" data-z="'+q.fig.u+'" data-c="'+esc(q.fig.cap||'Figure')+'"><figcaption class="mu">'+esc(q.fig.cap||'Question figure · tap to enlarge')+'</figcaption></figure>'}
  q.o.forEach((o,k)=>{let c='opt';if(my===k)c+=' sel';if(reveal){if(k===q.a)c+=' ok';else if(my===k)c+=' bad'}
    h+='<button class="'+c+'" data-k="'+k+'" '+(reveal?'disabled':'')+'>'+'ABCDE'[k]+'. '+esc(o)+'</button>'});
  if(!reveal&&A.mode==='study')h+='<button id="chk" class="pri" '+(my===undefined?'disabled':'')+'>Check</button><div class="hint">'+(my===undefined?'Choose an answer first. ':'')+'You can change your choice until you press Check.</div>';
  if(!reveal&&A.mode==='exam')h+='<div class="hint">Exam mode: answers are shown after you submit the chapter.</div>';
  if(reveal)h+='<div class="exp"><p><b>'+(my===q.a?'<span class="ok">Correct</span>':my===undefined?'<span class="mu">Unanswered</span>':'<span class="bad">Incorrect</span>')+'</b> — Answer: '+'ABCDE'[q.a]+'</p>'+expl(q,my)+'</div>';
  h+='</div><div class="row" style="justify-content:space-between"><button id="prev" '+(A.cur?'':'disabled')+'>← Prev</button>';
  h+=A.submitted?'<button id="res" class="pri">Results</button>':'<button id="sub">Submit</button>';
  h+='<button id="next" '+(A.cur<L.length-1?'':'disabled')+'>Next →</button></div>';
  app.innerHTML=h;
  back.onclick=home;prev.onclick=()=>{A.cur--;save();render()};next.onclick=()=>{A.cur++;save();render();scrollTo(0,0)};
  app.querySelectorAll('[data-j]').forEach(b=>b.onclick=()=>{A.cur=+b.dataset.j;save();render()});
  app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{A.ans[id]=+b.dataset.k;save();render()});
  if(window.chk&&chk.tagName==='BUTTON')chk.onclick=()=>{if(A.ans[id]===undefined)return;A.chk[id]=true;save();render()};
  ms.onclick=()=>{A.mode='study';save();render()};me.onclick=()=>{A.mode='exam';save();render()};
  if(window.sub)sub.onclick=()=>{const un=L.filter(x=>A.ans[x]===undefined).length;if(un&&!confirm(un+' unanswered. Submit anyway?'))return;A.submitted=true;
    const c=L.filter(x=>A.ans[x]===D.q[x].a).length;A.result={c,t:L.length};if(!S.retry){S.score={c,t:L.length}}save();results()};
  if(window.res)res.onclick=results}
function results(){const A=ctx(),L=ids();const r=L.filter(x=>A.ans[x]===D.q[x].a),w=L.filter(x=>A.ans[x]!==undefined&&A.ans[x]!==D.q[x].a),u=L.filter(x=>A.ans[x]===undefined);
  const list=a=>a.map(x=>'<li>Q'+(L.indexOf(x)+1)+': '+esc(D.q[x].q)+'</li>').join('');
  let h='<button id="back">'+backLabel()+'</button><div class="card"><h2>'+(S.retry?'Retry results':'Results')+' — '+esc(set.name)+'</h2><p><b>'+r.length+'/'+L.length+'</b> correct ('+Math.round(100*r.length/L.length)+'%)</p>'
    +(S.retry&&S.score?'<p class="mu">Original score kept: '+S.score.c+'/'+S.score.t+'</p>':'')
    +'<p class="bad"><b>Wrong: '+w.length+'</b></p><ol>'+list(w)+'</ol><p class="mu"><b>Unanswered: '+u.length+'</b></p><ol>'+list(u)+'</ol>'
    +'<div class="row"><button id="rev">Review answers</button>'+(w.length+u.length?'<button id="rt" class="pri">Retry wrong &amp; unanswered</button>':'')+(S.retry?'<button id="ex">End retry</button>':'')+'</div></div>';
  app.innerHTML=h;back.onclick=home;rev.onclick=()=>{A.cur=0;save();render()};
  if(window.rt)rt.onclick=()=>{S.retry={ids:w.concat(u),mode:'study',ans:{},chk:{},cur:0,submitted:false};save();render()};
  if(window.ex)ex.onclick=()=>{S.retry=null;save();results()}}
const last=localStorage.getItem(LS+'last');
const pack=findPack(last);
if(pack && ready(pack)){set=pack;S=load(set.key)||fresh();if(!S.chk)S.chk={};save();render()}
else home();
</script></body></html>
