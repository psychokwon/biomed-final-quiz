경우가 많고, 굴 내 압력이 높아져 저림으로 잠에서 깨는 일이 흔합니다. 이 병력만으로도 임상 진단에 크게 기여하며, 영상 검사보다 문진·신체검사가 더 중요합니다.","why":{"0":"급성 팔꿉 외상은 척골신경 손상의 병력에 가깝습니다.","1":"한낮 식사와 특이적으로 관련되지 않습니다.","3":"어깨 벌림은 팔신경얼기 아래 줄기 증상과 더 관련됩니다.","4":"엄지 연마 검사(grind test)는 엄지 CMC 관절염의 검사입니다."},"one":"손목굴 증후군은 밤과 극단적 손목 자세에서 저림·통증이 심해진다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 10","img":[{"u":"img/w10_riedel/p10.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 10"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-4":{"q":"In the evaluation of suspected carpal tunnel syndrome, the most important diagnostic tool is:","o":["Plain radiographs of the wrist","CT of the carpal tunnel","MRI of the median nerve","History and physical examination","Routine bone scintigraphy"],"a":3,"qk":"손목굴 증후군이 의심될 때, 가장 중요한 진단 도구는?","ok":["손목 단순 방사선 촬영","손목굴 CT","정중신경 MRI","문진과 신체검사(H&P)","일상적 뼈스캔"],"exp":"손목굴 증후군의 진단에는 여러 검사가 있으나, **가장 중요한 도구는 문진과 신체검사(H&P)**입니다.\n\n**X선, CT, MRI는 유용하지 않습니다.** 근전도·신경전도검사(EMG/NCS)는 진단을 확인하거나, 이중압박(double crush), 당뇨신경병증, 신체검사가 어려운 상황에서 도움이 됩니다.\n\n즉, 전형적인 야간 저림과 정중신경 영역 증상, 팔렌·티넬·직접압박 검사 등 임상 소견이 중심이고, 영상으로 먼저 ‘확인’하려 해서는 안 됩니다.","why":{"0":"단순 방사선 촬영은 이 진단에 유용하지 않습니다.","1":"CT 역시 유용하지 않은 영상 검사로 제시됩니다.","2":"MRI도 일차 진단에 유용하지 않습니다.","4":"뼈스캔은 손목굴 증후군의 진단 도구가 아닙니다."},"one":"손목굴 증후군 진단의 핵심은 문진·신체검사이다. X선·CT·MRI는 유용하지 않다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 11","img":[{"u":"img/w10_riedel/p11.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 11"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-5":{"q":"A Phalen’s test is considered positive when wrist flexion with the elbows on the table produces numbness and tingling in the radial digits within:","o":["10 seconds","15 seconds","30 seconds","90 seconds","60 seconds"],"a":4,"qk":"팔렌 검사(Phalen’s test)에서, 팔꿉을 테이블에 두고 손목을 굽힌 채 노쪽 손가락에 저림·무감각이 나타나면 양성으로 판정하는 시간 기준은?","ok":["10초","15초","30초","90초","60초"],"exp":"**팔렌 검사**는 팔꿉을 테이블에 두고 **손목을 굽힌** 자세를 유지하며, 그 자세에 반응하여 감각이상이 나타나는지를 봅니다. **60초 안에** 노쪽 손가락(정중신경 영역)에 무감각과 저림이 생기면 양성입니다. 그림에서도 양손을 손목 굽힘 자세로 맞대고 ‘ONE MINUTE’을 표시합니다.\n\n손목굴 증후군을 시사하지만 민감도 0.75, 특이도 0.47로, 특이도가 높지 않습니다. 직접압박 검사(30초, 민감도 0.87, 특이도 0.90)와 티넬 징후(민감도 0.60, 특이도 0.67)를 함께 해석합니다.","why":{"0":"10초는 팔렌 검사의 양성 기준이 아닙니다.","1":"15초는 팔렌 검사의 양성 기준이 아닙니다.","2":"30초는 정중신경 직접압박 검사의 양성 시간에 가깝습니다.","3":"90초는 제시된 양성 기준이 아닙니다. 팔렌은 60초입니다."},"one":"팔렌 검사: 손목 굽힘을 60초 유지하여 노쪽 손가락 저림이 나면 양성.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 12, 13","img":[{"u":"img/w10_riedel/p12.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 12"},{"u":"img/w10_riedel/p13.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 13"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-6":{"q":"Direct compression of the median nerve at the wrist (a Durkan-type test) is considered positive if paresthesias occur within:","o":["30 seconds","60 seconds","90 seconds","2 minutes","5 minutes"],"a":0,"qk":"손목에서 정중신경을 직접 누르는 검사(Durkan형)는, 감각이상이 몇 초 안에 나타나면 양성인가?","ok":["30초","60초","90초","2분","5분"],"exp":"정중신경을 손목에서 **직접 압박**하면, 압력에 반응하여 감각이상이 나타납니다. **30초 안에** 감각이상(paresthesia)이 생기면 양성으로 보며, 손목굴 증후군을 상당히 강하게 시사합니다. 제시된 민감도는 0.87, 특이도는 0.90으로, 팔렌 검사(60초, 민감도 0.75, 특이도 0.47)나 티넬 징후(민감도 0.60, 특이도 0.67)보다 특이도가 높습니다.\n\n티넬 징후는 손목의 정중신경을 두드려 축삭 손상 부위의 과민성을 보는 검사로, 신경 분포 영역으로 저림과 찌르는 듯한 통증이 퍼집니다. 세 검사를 함께 쓰고, 영상보다 임상 소견을 우선합니다.","why":{"1":"60초는 팔렌 검사의 양성 시간입니다.","2":"90초는 이 직접압박 검사의 기준이 아닙니다.","3":"2분은 제시된 양성 기준이 아닙니다.","4":"5분은 지나치게 긴 시간으로, 양성 기준이 아닙니다."},"one":"정중신경 직접압박 검사는 30초 내 감각이상이 양성이며, 세 검사 중 특이도가 가장 높다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 14, 15","img":[{"u":"img/w10_riedel/p14.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 14"},{"u":"img/w10_riedel/p15.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 15"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-7":{"q":"Static two-point discrimination greater than 6 mm in a patient being evaluated for carpal tunnel syndrome indicates:","o":["Early, fully reversible nerve irritability only","Advanced nerve dysfunction or nerve laceration","A normal finding in most adults","An isolated muscle end-plate disorder","Ulnar rather than median nerve disease"],"a":1,"qk":"손목굴 증후군 평가에서 정적 두점식별(static two-point discrimination)이 6 mm보다 크면 무엇을 시사하는가?","ok":["초기이고 완전히 가역적인 신경 과민만","진행된 신경 기능장애 또는 신경 열상","대부분 성인에서 정상적인 소견","근육 종말판만의 장애","정중신경이 아닌 척골신경 질환"],"exp":"두점식별(two-point discrimination)은 신경의 식별 감각을 보는 검사입니다. **정적 두점식별이 6 mm보다 크거나**, **동적 두점식별이 5 mm보다 크면** 양성으로 봅니다.\n\n그러나 이 두 검사 모두 **진행된 신경 기능장애** 또는 **신경 열상**을 가리킵니다. 즉, 초기 손목굴 증후군을 선별하는 검사가 아니라, 이미 심한 손상 단계에서 이상이 나타난다는 뜻입니다.\n\n단섬유 촉각(monofilament) 검사는 점점 굵은 섬유를 손바닥쪽 손가락에 대어, 어느 손가락인지 알아챌 때까지 시행합니다. 노쪽 세 손가락에서 값이 2.83보다 크면 손목굴 증후군을 시사하며 민감도는 0.83입니다.","why":{"0":"두점식별 이상은 초기 과민이 아니라 진행된 기능장애를 시사합니다.","2":"6 mm를 넘는 정적 두점식별은 정상으로 보지 않습니다.","3":"이 검사는 말초신경의 식별 감각을 보며, 종말판 질환의 특이 소견이 아닙니다.","4":"노쪽 손가락에서 시행하는 이 이상 소견은 정중신경 영역의 진행된 손상을 가리킵니다."},"one":"정적 두점식별 >6 mm(동적 >5 mm)는 진행된 신경 기능장애 또는 열상을 시사한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 16, 17","img":[{"u":"img/w10_riedel/p16.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 16"},{"u":"img/w10_riedel/p17.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 17"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-8":{"q":"For intermediate carpal tunnel syndrome with possible weakness of thumb abduction and an irritable median nerve, the recommended treatment is:","o":["Observation alone for 12 months","Repeated steroid injection of the A1 pulley","Surgical decompression","Immediate thumb CMC arthrodesis","Radial-nerve transposition at the elbow"],"a":2,"qk":"엄지 벌림 근력이 떨어질 수 있고 정중신경이 과민한 중간단계 손목굴 증후군의 권장 치료는?","ok":["12개월간 경과 관찰만","A1 도르래에 반복 스테로이드 주사","수술적 감압(surgical decompression)","즉시 엄지 CMC 관절유합","팔꿉에서 요골신경 이전술"],"exp":"중간단계 손목굴 증후군에서는 엄지 **벌림 근력 저하가 있을 수도 있고**, 신경을 자극하면 통증이 있습니다. 이 단계의 치료는 **수술적 감압(surgical decompression)**입니다. 검사에서는 검사자가 엄지 손바닥쪽 벌림(짧은엄지벌림근)에 저항을 주며 근력을 확인합니다.\n\n늦은 단계에서는 영구 감각 소실, 근위축, 물건 잡기 약화, 통증이 있을 수도 없습니다. 치료 역시 수술적 감압이며, 수술 후에도 증상이 남을 수 있으나 **진행과 통증은 멈출 수 있습니다.** 위축이 이미 있어도 수술이 금기는 아닙니다.\n\n늦은 단계 사진에서는 엄지두덩이 야위고, 손목 앞쪽에 감압술 흉터가 있는 손을 볼 수 있습니다.","why":{"0":"중간단계에서 장기간 관찰만 하는 것은 권장 치료가 아닙니다.","1":"A1 도르래 주사는 방아쇠손가락의 치료입니다.","3":"엄지 CMC 유합은 이 신경 포착의 치료가 아닙니다.","4":"요골신경을 팔꿉에서 옮기는 술은 정중신경 감압과 무관합니다."},"one":"중간·늦은 손목굴 증후군의 치료는 수술적 감압이며, 늦은 단계에서는 진행을 멈추나 증상이 남을 수 있다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 18, 19, 20","img":[{"u":"img/w10_riedel/p18.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 18"},{"u":"img/w10_riedel/p19.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 19"},{"u":"img/w10_riedel/p20.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 20"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-9":{"q":"After decompression for late carpal tunnel syndrome with muscle atrophy and permanent sensory loss, surgery is expected to:","o":["Restore all lost sensation in every patient","Reverse established thenar atrophy completely","Cure nocturnal pain without affecting progression","Halt progression and pain, although symptoms may persist","Be contraindicated once atrophy is present"],"a":3,"qk":"근위축과 영구 감각 소실이 있는 늦은 단계 손목굴 증후군에서 감압술을 시행할 때, 수술에 기대할 수 있는 결과는?","ok":["모든 환자에서 소실된 감각이 완전히 회복된다","이미 생긴 엄지두덩 위축이 완전히 되돌려진다","진행에는 영향 없이 야간통만 없어진다","진행과 통증은 멈추지만, 증상은 남을 수 있다","위축이 있으면 수술이 금기이다"],"exp":"늦은 단계에서는 영구 감각 소실, 근위축, 물건을 잡는 힘의 약화, 통증은 있을 수도 없을 수도 있습니다. 치료는 **수술적 감압**입니다.\n\n수술 후에도 **증상이 계속될 수 있습니다.** 그러나 수술은 **진행을 멈추고 통증을 줄이며**, 이미 비가역적으로 변한 축삭·근육을 정상으로 되돌린다고 보장하지는 않습니다. 위축이 있다고 해서 수술이 금기는 아닙니다.\n\n임상 사진에서는 엄지두덩이 꺼지고, 감압술 후 주먹을 쥐는 손과 손목 앞쪽 흉터를 볼 수 있습니다.","why":{"0":"늦은 단계에서는 감각이 모든 환자에서 완전히 회복된다고 할 수 없습니다.","1":"이미 생긴 엄지두덩 위축이 반드시 완전히 회복되는 것은 아닙니다.","2":"수술의 목표는 진행을 멈추고 통증을 줄이는 것이지, 진행을 방치한 채 통증만 없애는 것이 아닙니다.","4":"위축이 있어도 감압술은 시행하며, 금기가 아닙니다."},"one":"늦은 단계 감압술은 진행과 통증을 멈추지만, 이미 생긴 증상은 남을 수 있다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 19, 20","img":[{"u":"img/w10_riedel/p19.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 19"},{"u":"img/w10_riedel/p20.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 20"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-10":{"q":"Cubital tunnel syndrome, the second most frequent upper-extremity nerve entrapment, may occur at any of several elbow sites, one of which is:","o":["The spinoglenoid notch","The transverse carpal ligament","Lister’s tubercle of the radius","The first dorsal extensor compartment","Osborne’s ligament"],"a":4,"qk":"윗팔에서 두 번째로 흔한 신경 포착인 팔꿉굴 증후군이 생길 수 있는 팔꿉 부위 중 하나로 꼽히는 것은?","ok":["극아래패임(spinoglenoid notch)","가로손목인대(굽힘근지지띠)","노뼈의 리스터 결절","첫째 등쪽 폄근 구획","오스본 인대(Osborne’s ligament)"],"exp":"팔꿉굴 증후군은 팔꿉에서 척골신경이 압박되는 질환으로, **윗팔에서 두 번째로 흔한** 신경 포착입니다. 일시적 무감각·감각이상까지 포함하면 발생률은 더 높아집니다.\n\n팔꿉 주위 **약 15 cm 구간**에 압박 가능 부위가 있고, **다섯 곳**이 제시됩니다. **안쪽 근육사이막**, **안쪽위관절융기**, **위관절융기고랑(epicondylar groove)**, **오스본 인대(Osborne’s ligament)**, **자쪽손목굽힘근(FCU)**입니다.\n\n척골신경은 아래팔에서 근육 2개를 지배하지만 손 근육의 대부분(14½)과 손의 자쪽 감각을 담당하므로, 팔꿉 포착의 손 증상이 클 수 있습니다.","why":{"0":"극아래패임은 어깨뼈의 구조로, 팔꿉 척골신경 포착 부위가 아닙니다.","1":"가로손목인대는 손목굴의 지붕이며, 정중신경 포착 부위입니다.","2":"리스터 결절은 긴엄지폄근 힘줄이 꺾이는 노뼈 등쪽 결절입니다.","3":"첫째 등쪽 구획은 De Quervain병의 부위입니다."},"one":"팔꿉굴 증후군의 가능 압박 부위 다섯 곳 중 하나가 오스본 인대이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 21, 22, 23","img":[{"u":"img/w10_riedel/p21.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 21"},{"u":"img/w10_riedel/p22.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 22"},{"u":"img/w10_riedel/p23.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 23"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-11":{"q":"In a patient with numbness of the ring and little fingers, sensory loss over the dorsal ulnar hand suggests that the compression is:","o":["At the elbow (proximal to the dorsal branch)","Only in Guyon’s canal at the wrist","Of the median nerve in the carpal tunnel","Of the superficial radial nerve","Of the posterior cord in the axilla only"],"a":0,"qk":"약지·새끼 무감각이 있는 환자에서 자쪽 손등 감각까지 떨어져 있다면, 압박 부위로 시사되는 것은?","ok":["등쪽피부가지보다 근위인 팔꿉","손목 기용 굴에 국한된 압박","손목굴의 정중신경","얕은요골신경","겨드랑이의 뒤다발만"],"exp":"팔꿉굴 증후군의 전형적인 증상은 약지·새끼의 무감각과 감각이상, 안쪽 팔꿉 통증이 아래팔로 내려가거나 목까지 올라가는 것, 병이나 병을 열 때 힘이 빠짐, 반복 동작에서 쉽게 지치는 것입니다.\n\n**자쪽 손등 감각 저하**는 중요한 위치 정보입니다. 척골신경의 **등쪽피부가지**는 손목보다 근위 아래팔에서 갈라지므로, 이 영역까지 감각이 떨어지면 압박은 **손목(기용 굴)이 아니라 팔꿉**처럼 더 근위일 가능성이 큽니다. 반대로 손목 자쪽 굴만의 포착에서는 손등 감각이 보전됩니다.\n\n손목에서 척골신경 티넬이 양성이면 **두 곳 압박**을 의심합니다. 단섬유 검사로 약지·새끼 감각 결손을 확인하는 것도 중요합니다.","why":{"1":"기용 굴만의 포착에서는 등쪽피부가지가 이미 갈라진 뒤이므로 자쪽 손등 감각이 보전되는 것이 보통입니다.","2":"정중신경 영역은 노쪽 손가락이며, 자쪽 손등과 무관합니다.","3":"얕은요골신경은 가쪽 손등 감각을 담당합니다.","4":"뒤다발 병변은 요골·겨드랑신경 영역을 넓게 침범하며, 이 소견만의 설명이 아닙니다."},"one":"약지·새끼 저림에 자쪽 손등 감각 소실이 동반되면 팔꿉(등쪽가지보다 근위) 압박을 시사한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 24, 25","img":[{"u":"img/w10_riedel/p24.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 24"},{"u":"img/w10_riedel/p25.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 25"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-12":{"q":"The elbow flexion test for cubital tunnel syndrome, regarded as the equivalent of Phalen’s test at the wrist, must be held for:","o":["15 seconds","1 minute","3 minutes","5 minutes","10 seconds"],"a":1,"qk":"손목 팔렌 검사에 해당하는 팔꿉굴 증후군의 팔꿉 굽힘 검사(elbow flexion test)는 얼마 동안 유지해야 하는가?","ok":["15초","1분","3분","5분","10초"],"exp":"**팔꿉 굽힘 검사**는 손목의 팔렌 검사에 해당하는 유발 검사입니다. **1분 동안** 팔꿉을 굽힌 채 유지하며, 약지와 새끼에 감각이상이 재현되면 양성입니다. **위양성률은 약 10%**입니다.\n\n척골신경은 안쪽 위팔, 안쪽위관절융기 뒤, 아래팔 자쪽 모서리를 따라 촉진하여 과민성을 확인할 수 있습니다. 손자체근 약화는 무감각보다 늦게 나타나며, 첫째 등쪽뼈사이근 벌림이나 ‘손가락 교차(cross-finger)’ 검사로 보고, 진행하면 갈퀴손(clawing)이 보입니다.","why":{"0":"15초는 이 검사의 유지 시간이 아닙니다.","2":"3분은 제시된 유지 시간보다 깁니다. 기준은 1분입니다.","3":"5분은 제시된 유지 시간이 아닙니다.","4":"10초는 너무 짧아 표준 유지 시간이 아닙니다."},"one":"팔꿉 굽힘 검사는 1분 유지하며, 약지·새끼 저림이 재현되면 양성(위양성 약 10%)이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 26, 28","img":[{"u":"img/w10_riedel/p26.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 26"},{"u":"img/w10_riedel/p28.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 28"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-13":{"q":"A useful motor test later in cubital tunnel syndrome, after numbness has already appeared, is:","o":["Resisted thumb IP flexion only","The Phalen maneuver at the wrist","First dorsal interosseous or “cross-finger” test","Finkelstein’s test","The grind test of the thumb CMC joint"],"a":2,"qk":"팔꿉굴 증후군에서 무감각보다 늦게 나타나는 손자체근 약화를 확인하는 데 유용한 검사는?","ok":["엄지 지절간관절 저항 굽힘만","손목의 팔렌 검사","첫째 등쪽뼈사이근 벌림 또는 ‘손가락 교차’ 검사","핑켈스타인 검사","엄지 CMC 연마 검사"],"exp":"팔꿉굴 증후군에서 **손자체근 약화는 무감각보다 늦게** 나타납니다. 유용한 운동 검사는 **첫째 등쪽뼈사이근(first dorsal interosseous)의 벌림** 또는 **손가락 교차(cross-finger) 검사**입니다. 진행된 단계에서는 **갈퀴손(clawing)**이 보입니다.\n\n첫째 등쪽뼈사이근은 집게를 가운데손가락 축에서 가쪽으로 벌리며, 손등 첫째 공간의 불룩한 근육입니다. 이 근육이 위축되거나 저항 벌림이 약하면 척골신경 운동 침범을 시사합니다.","why":{"0":"엄지 IP 굽힘은 긴엄지굽힘근(앞뼈사이신경) 검사이며, 척골신경 손자체근 검사가 아닙니다.","1":"팔렌 검사는 손목굴의 정중신경 유발 검사입니다.","3":"핑켈스타인 검사는 첫째 등쪽 구획(De Quervain) 검사입니다.","4":"연마 검사는 엄지 CMC 관절염을 보는 검사입니다."},"one":"팔꿉굴에서 손자체근 약화는 늦게 나타나며, 첫째 등쪽뼈사이근 벌림·손가락 교차 검사로 확인한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 28","img":[{"u":"img/w10_riedel/p28.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 28"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-14":{"q":"To isolate flexor digitorum superficialis, the examiner should:","o":["Stabilize the middle phalanx and test DIP flexion","Hold the wrist extended and test MCP flexion","Tap over the flexor retinaculum for shooting pain","Hold the other fingers extended and test PIP flexion","Ulnar-deviate a fist that encloses the thumb"],"a":3,"qk":"얕은손가락굽힘근(FDS)을 따로 검사하려면 검사자가 해야 할 것은?","ok":["중간손가락뼈를 고정하고 원위지절 굽힘을 시킨다","손목을 완전히 편 채 손허리손가락관절 굽힘을 본다","굽힘근지지띠를 두드려 방사통을 본다","나머지 손가락을 펴 고정한 채, 검사하는 손가락의 근위지절을 굽히게 한다","엄지를 감싼 주먹을 자쪽으로 치우치게 한다"],"exp":"**얕은손가락굽힘근(FDS)**은 중간손가락뼈에 닿아 **PIP를 굽힙니다.** 그러나 깊은손가락굽힘근(FDP)도 PIP를 굽힐 수 있으므로, FDS만 보려면 FDP를 기능적으로 막아야 합니다.\n\nFDP는 여러 손가락에 공통된 근복을 가지므로, **나머지 손가락을 편 채로 고정**하면 FDP가 검사 손가락에서 일하기 어렵습니다. 그 상태에서 환자에게 **검사 손가락의 PIP를 굽히게** 하면 FDS를 따로 볼 수 있습니다. 그림에서도 다른 손가락을 편 채 한 손가락 PIP가 굽혀집니다.\n\n반대로 FDP를 보려면 중간손가락뼈(PIP)를 편 채로 고정하고 DIP만 굽히게 합니다.","why":{"0":"중간손가락뼈를 고정하고 DIP를 굽히게 하는 것은 FDP 검사법입니다.","1":"손목 과신전 후 MCP 굽힘은 FDS 분리 검사가 아닙니다.","2":"지지띠를 두드리는 것은 티넬 검사입니다.","4":"엄지를 넣은 주먹의 자쪽 치우침은 핑켈스타인 검사입니다."},"one":"FDS 검사: 나머지 손가락을 펴 고정하고 검사 손가락 PIP를 굽힌다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 35","img":[{"u":"img/w10_riedel/p35.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 35"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-15":{"q":"To test flexor digitorum profundus of a finger, the examiner should:","o":["Hold the other fingers extended and test PIP flexion","Resist palmar abduction of the thumb","Compress both wrist arteries and then release one","Ask for isolated MCP extension against resistance","Stabilize the middle phalanx and test DIP flexion"],"a":4,"qk":"어떤 손가락의 깊은손가락굽힘근(FDP)을 검사하려면 검사자가 해야 할 것은?","ok":["나머지 손가락을 편 채 근위지절 굽힘을 본다","엄지 손바닥쪽 벌림에 저항한다","양쪽 손목 동맥을 막았다가 하나를 푼다","손허리손가락관절만 저항 하에 펴게 한다","중간손가락뼈를 고정하여 근위지절을 편 채로 두고 원위지절을 굽히게 한다"],"exp":"**깊은손가락굽힘근(FDP)**은 먼쪽손가락뼈에 닿아 **DIP를 굽힙니다.** DIP 굽힘은 FDP만의 고유 기능이므로, **PIP를 편 채로 중간손가락뼈를 고정**한 다음 환자에게 **DIP를 굽히게** 하면 됩니다. 그림에서도 검사자의 손가락이 중간손가락뼈를 붙잡고, 먼쪽마디가 굽혀집니다.\n\n정상 주먹 굽힘에서는 손가락들이 손배뼈 결절 쪽으로 모이며, 회전 변형이 있으면 주먹을 쥘 때 손가락이 서로 교차하는 **가위변형(digital scissoring)**이 나타납니다.","why":{"0":"나머지 손가락을 펴 고정하고 PIP를 굽히게 하는 것은 FDS 검사법입니다.","1":"엄지 손바닥쪽 벌림은 짧은엄지벌림근(정중신경) 검사입니다.","2":"양쪽 동맥을 막았다가 하나를 푸는 것은 앨런 검사입니다.","3":"MCP 폄은 겉재 폄근의 기능에 가깝습니다."},"one":"FDP 검사: PIP를 편 채로 중간손가락뼈를 고정하고 DIP를 굽힌다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 34, 36","img":[{"u":"img/w10_riedel/p34.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 34"},{"u":"img/w10_riedel/p36.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 36"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-16":{"q":"Trigger digit, a common cause of hand pain with catching or locking of a flexor tendon, typically results from entrapment at the:","o":["A1 pulley, palmar to the metacarpal head","A2 pulley alone","First dorsal extensor compartment","Flexor retinaculum of the carpal tunnel","Sagittal band of the extensor hood"],"a":0,"qk":"굽힘근 힘줄이 걸리거나 잠기는 방아쇠손가락(trigger digit)에서, 힘줄이 흔히 포착되는 부위는?","ok":["손허리뼈머리 손바닥쪽의 A1 도르래","A2 도르래만","첫째 등쪽 폄근 구획","손목굴의 굽힘근지지띠","폄근 두건의 시상띠"],"exp":"방아쇠손가락은 **손 통증의 가장 흔한 원인** 중 하나로, 굽힘근 힘줄이 **걸리고 툭 하는 느낌(catching and popping)**을 줍니다. 굽힌 채로 잠겨 수동으로 펴야 하거나, 반대로 완전히 굽히지 못할 수도 있고, 뻣뻣하고 아픈 PIP가 동반되기도 합니다.\n\n아침에 뻣뻣한 병력이 흔하고, 열감으로 증상이 좋아지며, 반복 동작과 관련될 수 있습니다. 포착은 **A1 도르래**에서 일어나고, 손허리뼈머리 높이의 손바닥을 눌러 압통을 확인하면 위치를 쉽게 잡을 수 있습니다. 소아에서는 엄지가 굽힌 채로 잠긴 모습과 A1 도르래 부위 수술적 개방을 볼 수 있습니다.","why":{"1":"방아쇠손가락의 전형적 포착 부위는 A2가 아니라 A1 도르래입니다.","2":"첫째 등쪽 구획은 De Quervain병의 부위입니다.","3":"굽힘근지지띠는 손목굴 증후군의 지붕입니다.","4":"시상띠 손상은 폄근 힘줄의 탈구·MCP 문제와 관련됩니다."},"one":"방아쇠손가락은 A1 도르래(손허리뼈머리 손바닥)에서 굽힘근 힘줄이 포착되어 생긴다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 37, 38, 40","img":[{"u":"img/w10_riedel/p37.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 37"},{"u":"img/w10_riedel/p38.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 38"},{"u":"img/w10_riedel/p40.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 40"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-17":{"q":"Most patients with trigger digit become symptom-free after two steroid injections given 6–8 weeks apart. Patients who fail two injections are:","o":["Treated with lifelong weekly injections","Surgical candidates","Managed with immediate ray amputation","Placed in a thumb spica cast","Restricted to night splints indefinitely"],"a":1,"qk":"방아쇠손가락은 6–8주 간격의 스테로이드 주사 두 번으로 대다수가 증상에서 벗어나는데, 두 번에 실패하면 다음으로 어떻게 하는가?","ok":["평생 매주 주사를 한다","수술 대상이 된다","즉시 손가락열 절단을 한다","엄지 스피카 석고를 한다","야간 부목만 무기한 유지한다"],"exp":"대부분의 방아쇠손가락 환자는 **6–8주 간격의 스테로이드 주사**로 치료됩니다. **두 번 주사로 70–80%**가 증상에서 벗어나며, **당뇨 환자**는 성공률이 더 낮습니다. 운동은 권장됩니다.\n\n**주사 두 번에 실패하면 수술 대상**이 됩니다. 소아에서 잠긴 엄지를 볼 때처럼, 수술은 A1 도르래를 열어 힘줄이 걸리지 않게 합니다. 처음부터 절단이나 스피카 석고가 표준이 아닙니다.","why":{"0":"주사를 평생 매주 반복하는 것은 권장 경과가 아닙니다. 두 번 실패 시 수술을 고려합니다.","2":"손가락열 절단은 방아쇠손가락의 치료가 아닙니다.","3":"엄지 스피카는 안정적인 엄지 척골측부인대 손상 등에 쓰입니다.","4":"야간 부목만 무기한 유지하는 것은, 주사 두 번 실패 후의 표준 다음 단계가 아닙니다."},"one":"방아쇠손가락은 주사 두 번(70–80% 성공, 당뇨는 낮음)에 실패하면 수술한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 39, 40","img":[{"u":"img/w10_riedel/p39.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 39"},{"u":"img/w10_riedel/p40.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 40"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-18":{"q":"De Quervain’s disease, stenosis of the first dorsal compartment (APL and EPB) over the radial styloid, is distinguished from thumb CMC arthritis by:","o":["A positive grind test with axial loading of the thumb","Night pain in the median digits","A negative grind test and a positive Finkelstein test","Kanavel signs in the thumb pulp","Thenar atrophy and a simian thumb posture"],"a":2,"qk":"노뼈 붓돌기 위의 첫째 등쪽 구획(APL, EPB) 협착인 De Quervain병은, 엄지 CMC 관절염과 어떻게 구별되는가?","ok":["엄지에 축성 부하를 가한 연마 검사가 양성이다","정중신경 손가락의 야간통이 있다","연마 검사는 음성이고 핑켈스타인 검사는 양성이다","엄지 손가락 끝에 카나벨 징후가 있다","엄지두덩 위축과 원숭이손 자세가 있다"],"exp":"De Quervain병은 **요골 쪽 손 통증**의 흔한 원인으로, **40–50대 여성**에서 많습니다. 병태는 손목 **첫째 등쪽 구획**의 협착이며, 노뼈 붓돌기 위를 지나는 **APL과 EPB** 힘줄이 자극됩니다.\n\n반드시 **엄지 CMC 관절염**과 감별해야 합니다. De Quervain 환자는 엄지에 축성 부하를 가하는 **연마 검사(grind test)가 음성**이고, 엄지를 주먹 안에 넣고 손목을 자쪽으로 치우치게 하는 **핑켈스타인 검사(Finkelstein’s test)가 양성**입니다. 방사선에서 CMC 관절 간격이 좁아지고 아탈구가 있는 경우는 관절염 쪽에 가깝습니다.\n\n주사 성공률은 약 50–60%, 부목만은 약 30%이며, 둘을 병용할 수 있고, 주사 두 번에 실패하면 수술적 개방의 대상이 됩니다.","why":{"0":"연마 검사 양성은 CMC 관절염을 시사하며, De Quervain과의 구별점이 반대입니다.","1":"정중신경 영역의 야간통은 손목굴 증후군의 전형입니다.","3":"카나벨 징후는 화농성 굽힘근윤활막염의 소견입니다.","4":"엄지두덩 위축과 원숭이손은 진행된 정중신경 압박의 소견입니다."},"one":"De Quervain: 핑켈스타인 양성, 연마 검사 음성으로 엄지 CMC 관절염과 구별한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 41, 42, 43, 67","img":[{"u":"img/w10_riedel/p41.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 41"},{"u":"img/w10_riedel/p42.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 42"},{"u":"img/w10_riedel/p43.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 43"},{"u":"img/w10_riedel/p67.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 67"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-19":{"q":"Allen’s test assesses patency of the palmar arterial arches by compressing the:","o":["Brachial artery alone at mid-arm","Cephalic and basilic veins at the elbow","Superficial palmar arch in mid-palm","Radial and ulnar arteries, then one released","Princeps pollicis artery on the thumb"],"a":3,"qk":"앨런 검사(Allen’s test)는 손바닥 동맥활의 개통을 보기 위해 무엇을 압박하는가?","ok":["위팔 중간의 위팔동맥만","팔꿉의 머리정맥과 바탕정맥","손바닥 한가운데의 얕은활을 직접","손목의 노동맥과 자동맥을 막았다가 하나를 푼다","엄지의 엄지주요동맥"],"exp":"손의 동맥은 **노동맥과 자동맥**이며, **자동맥이 우성**인 경우가 많고, 노동맥은 손목 가쪽에서 잘 촉진됩니다.\n\n**앨런 검사**는 주먹을 쥐게 한 뒤 **손목에서 노·자동맥을 동시에 압박**하여 손바닥을 하얗게 만든 다음, **한 동맥만 풀어** 혈류가 돌아오는지를 봅니다. 그림에서도 손목의 두 동맥을 엄지로 누르는 모습이 그려져 있습니다. 이 검사로 얕은·깊은손바닥활을 통한 측부순환이 충분한지 확인합니다.\n\n자동맥은 기용 굴을 지나 깊은활과 문합한 뒤 갈고리뼈 갈고리를 돌아 **얕은손바닥활**을 만들며, 이 활은 굽힘근 힘줄보다 손바닥쪽, 손바닥근막 바로 아래를 가로지릅니다. 깊은활은 엄지모음근의 등쪽으로, 기용 굴 먼쪽 가장자리에서 자동맥과 문합합니다.","why":{"0":"위팔동맥만 막으면 손의 두 동맥 사이 측부순환을 분리해 볼 수 없습니다.","1":"머리·바탕정맥은 얕은정맥이며, 동맥활 검사가 아닙니다.","2":"활 자체를 손바닥에서 직접 누르는 검사가 아닙니다.","4":"엄지주요동맥만 누르는 것이 앨런 검사가 아닙니다."},"one":"앨런 검사: 손목에서 노·자동맥을 막았다가 하나씩 풀어 손바닥활 개통을 확인한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 44, 45, 46, 47","img":[{"u":"img/w10_riedel/p44.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 44"},{"u":"img/w10_riedel/p45.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 45"},{"u":"img/w10_riedel/p46.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 46"},{"u":"img/w10_riedel/p47.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 47"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-20":{"q":"Rotational deformity of a metacarpal or phalangeal fracture is best detected by observing:","o":["Isolated loss of the nail plate","A positive Finkelstein test","Thenar muscle atrophy","Delayed capillary refill alone","Digital scissoring with active flexion"],"a":4,"qk":"손허리뼈 또는 손가락뼈 골절의 회전 변형을 확인하는 가장 좋은 방법은?","ok":["손발톱판 소실만 관찰한다","핑켈스타인 검사 양성을 확인한다","엄지두덩 위축을 본다","모세혈관 재충전 지연만 본다","능동 굽힘 때 손가락이 교차하는 가위변형을 본다"],"exp":"손허리뼈·손가락뼈 골절은 전체 골절의 약 10%를 차지하고, 절반은 업무와 관련되며, **가장자리 손가락(엄지·새끼)**이 흔합니다. 평가에서는 손상 기전, 전위 여부, 개방성, 관절 내 침범, **각형성·회전 변형**, 안정성, 동반 손상을 봅니다.\n\n골절 형태는 가로, 빗, 나선, 분쇄입니다. **회전 변형**은 주먹을 쥐거나 **능동 굽힘 때 손가락이 서로 교차하는 가위변형(digital scissoring)**으로 확인합니다. 정상 굽힘에서는 손가락이 손배뼈 쪽으로 모이며 서로 겹치지 않습니다. 회전을 놓치면 집기·쥐기 기능이 크게 떨어집니다.\n\n중간지절관절(PIP) 손상(측부인대, 바닥판, 탈구, 골절·골절탈구)에서는 안정성과 운동을 함께 얻기 위해 강선으로 만든 **동적 외고정(dynamic external fixator)**을 쓰기도 합니다.","why":{"0":"손발톱판 소실은 먼쪽손가락뼈 압궤와 연관될 수 있으나, 회전 변형의 지표가 아닙니다.","1":"핑켈스타인 검사는 De Quervain병의 검사입니다.","2":"엄지두덩 위축은 진행된 정중신경 압박의 소견입니다.","3":"모세혈관 재충전은 혈류 평가이지, 회전 정렬의 지표가 아닙니다."},"one":"손가락 골절의 회전 변형은 능동 굽힘 때 손가락이 교차하는 가위변형으로 확인한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 34, 48, 50, 61, 62","img":[{"u":"img/w10_riedel/p34.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 34"},{"u":"img/w10_riedel/p48.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 48"},{"u":"img/w10_riedel/p50.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 50"},{"u":"img/w10_riedel/p61.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 61"},{"u":"img/w10_riedel/p62.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 62"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-21":{"q":"The safe position for immobilizing an injured hand places the:","o":["MCP joints flexed and the IP joints extended","MCP joints extended and the IP joints fully flexed","Wrist, MCP, and IP joints in full extension","Thumb adducted tightly against the palm","Fingers fully hooked with the wrist flexed"],"a":0,"qk":"손상된 손을 고정할 때 권장되는 안전 자세(safe position)는?","ok":["손허리손가락관절은 굽히고 지절간관절은 편다","손허리손가락관절은 펴고 지절간관절은 완전히 굽힌다","손목·손허리손가락·지절간관절을 모두 완전히 편다","엄지를 손바닥에 바짝 모은다","손목을 굽히고 손가락을 완전히 갈고리처럼 굽힌다"],"exp":"손가락 골절 치료의 원칙은 정확한 정복, 다치지 않은 손가락의 운동 유지, 부종 조절을 위한 거상, **안전 자세로 고정**, 그리고 다친 손가락의 조기 재운동입니다.\n\n**안전 자세(intrinsic-plus, safe position)**는 **MCP를 굽히고 IP를 편** 자세입니다. 이 자세에서 MCP 측부인대가 늘어나고 IP는 신전 구축을 피할 수 있습니다. 반대로 MCP를 펴고 IP를 굽힌 ‘편한 자세’로 오래 고정하면 뻣뻣함과 구축이 오기 쉽습니다.\n\n그림에서도 MCP가 굽고 IP가 거의 펴진 손이 안전 자세로, IP가 굽고 MCP가 덜 굽은 손과 대비됩니다.\n\n고정 후에는 추적 방사선으로 유합을 확인합니다. 손가락뼈는 수개월에 걸쳐 재형성되며, 정확한 정복과 조기 운동이 변형·강직을 줄입니다.","why":{"1":"MCP를 펴고 IP를 굽힌 자세는 구축이 생기기 쉬운, 안전하지 않은 고정 자세입니다.","2":"모든 관절을 완전히 펴면 MCP 측부인대가 줄어들기 쉽습니다.","3":"엄지를 손바닥에 바짝 모으면 첫 번째 공간 구축이 올 수 있습니다.","4":"손목 굽힘과 갈고리 굽힘은 안전 자세가 아닙니다."},"one":"손 손상의 안전 고정 자세는 MCP 굽힘, IP 신전이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 51, 52, 53","img":[{"u":"img/w10_riedel/p51.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 51"},{"u":"img/w10_riedel/p52.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 52"},{"u":"img/w10_riedel/p53.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 53"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-22":{"q":"A crush injury of the distal phalanx that involves the nail matrix should be treated as:","o":["A closed fracture that never needs antibiotics","An open fracture, and oral antibiotics should be given","A mallet injury requiring immediate tendon repair","An indication for a fish-mouth drainage incision","Flexor tenosynovitis until proven otherwise"],"a":1,"qk":"손발톱 바탕질(nail matrix)까지 다친 먼쪽손가락뼈 압궤 손상은 어떻게 다루어야 하는가?","ok":["항생제가 필요 없는 폐쇄 골절로 본다","개방 골절로 보고 경구 항생제를 투여한다","즉시 힘줄 봉합이 필요한 망치 손상으로 본다","생선입 절개 배농의 적응으로 본다","증명이 될 때까지 굽힘근윤활막염으로 본다"],"exp":"먼쪽손가락뼈 골절은 대개 **압궤 손상**이며, **손발톱 바탕질 손상**이 자주 동반됩니다. 바탕질이 다치면 **개방 골절**로 간주하고 **경구 항생제**를 투여합니다.\n\n관절이 침범되지 않았다면 골절 정복이 꼭 필요하지는 않습니다. 통증 완화와 보호를 위해 부목을 대고, **MCP와 PIP는 움직이게** 하여 뻣뻣함을 막습니다. 생선입 절개는 손끝 감염(felon) 배농에서 끝이 괴사할 수 있어 피해야 하는 절개이지, 이 골절의 표준 치료가 아닙니다.","why":{"0":"바탕질이 다치면 폐쇄 골절이 아니라 개방 골절로 봅니다.","2":"등쪽 바닥의 관절 내 견열은 망치손가락이고, 대부분의 망치는 비수술(부목)로 치료합니다. 모든 압궤가 즉시 힘줄 봉합을 요하지는 않습니다.","3":"생선입 절개는 손끝염 배농에서 끝 괴사의 위험이 있어 피합니다.","4":"카나벨 징후가 없는 압궤를 윤활막염으로 단정하지 않습니다."},"one":"손발톱 바탕질이 다친 먼쪽손가락뼈 압궤는 개방 골절로 보고 경구 항생제를 쓴다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 54","img":[{"u":"img/w10_riedel/p54.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 54"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-23":{"q":"Most mallet fingers are treated nonoperatively with a DIP extension splint, whereas most flexor digitorum profundus avulsions:","o":["Also heal reliably with DIP extension splinting","Are observed until a mallet deformity appears","Require surgical repair","Are treated with an A1-pulley steroid injection","Need only buddy taping of the PIP joint"],"a":2,"qk":"대부분의 망치손가락(mallet finger)은 원위지절 신전 부목으로 비수술 치료하는 반면, 대부분의 깊은손가락굽힘근 견열(FDP avulsion)은?","ok":["마찬가지로 원위지절 신전 부목으로 잘 낫는다","망치 변형이 나타날 때까지 관찰한다","수술적 봉합이 필요하다","A1 도르래 스테로이드 주사로 치료한다","근위지절 친구 테이핑만으로 충분하다"],"exp":"먼쪽손가락뼈의 관절 내 손상은 등쪽 바닥의 **망치(mallet)** 또는 손바닥쪽 바닥의 **깊은굽힘근 견열(profundus avulsion)**로 나뉩니다.\n\n**대부분의 망치손가락은 비수술**로 치료합니다. 임상적으로는 DIP가 처져 능동 신전이 안 되고, 뼈 견열이 있으면 방사선에서 등쪽 바닥 조각을 보며, **DIP를 편 채로 고정하는 부목**(PIP는 자유롭게)을 사용합니다.\n\n반면 **대부분의 FDP 견열은 수술적 봉합**이 필요합니다. 힘줄이 손바닥 쪽으로 말려 올라가면 보존적 부목만으로는 닿는곳을 회복할 수 없습니다.","why":{"0":"DIP 신전 부목은 망치손가락의 주된 치료이며, FDP 견열의 표준이 아닙니다.","1":"FDP 견열을 망치 변형이 올 때까지 관찰하는 것은 적절한 경과가 아닙니다.","3":"A1 도르래 주사는 방아쇠손가락의 치료입니다.","4":"PIP 친구 테이핑만으로 FDP 닿는곳을 복구할 수 없습니다."},"one":"망치손가락은 대개 DIP 신전 부목, FDP 견열은 대개 수술이 필요하다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 55, 56, 57","img":[{"u":"img/w10_riedel/p55.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 55"},{"u":"img/w10_riedel/p56.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 56"},{"u":"img/w10_riedel/p57.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 57"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-24":{"q":"At the finger, the extrinsic tendons extend the MCP joint and the intrinsic muscles flex the MCP joint. Extension of the PIP and DIP joints is produced by:","o":["The extrinsics alone","The lumbricals alone","The flexor digitorum profundus tendon","Both the extrinsics and the intrinsics","The dorsal interossei alone"],"a":3,"qk":"손가락에서 겉재근은 손허리손가락관절을 펴고 속재근은 손허리손가락관절을 굽힌다. 근위·원위지절관절의 신전은 어느 것이 담당하는가?","ok":["겉재근만","충양근만","깊은손가락굽힘근 힘줄","겉재근과 속재근 모두","등쪽뼈사이근만"],"exp":"손가락 폄·굽힘의 역할 분담을 관절마다 구별합니다.\n\n**겉재근(extrinsics)**은 **MCP를 펴고**, **속재근(intrinsics**, 충양근·뼈사이근)은 **MCP를 굽힙니다.** 그러나 PIP와 DIP를 펴는 일에는 **겉재와 속재가 모두** 기여합니다. 둘 다 중심슬립(central slip)과 종말힘줄(terminal tendon)에 합류하기 때문입니다.\n\n이 균형이 깨지면 단추구멍 변형, 백조목 변형, 갈퀴손 등이 생깁니다. 골절 고정 때 MCP를 굽히고 IP를 펴는 안전 자세도, 이 힘줄 장치와 측부인대 길이를 고려한 것입니다.","why":{"0":"겉재근만 PIP·DIP를 펴는 것이 아니며, 속재근도 중심슬립과 종말힘줄에 기여합니다.","1":"충양근만의 기능이 아니며, 겉재 폄근도 IP 신전에 기여합니다.","2":"깊은손가락굽힘근은 DIP를 굽히는 근육입니다.","4":"등쪽뼈사이근만의 기능이 아니며, 겉재 폄근도 함께 IP를 펍니다."},"one":"겉재는 MCP 신전, 속재는 MCP 굴곡; PIP·DIP 신전은 겉재와 속재가 함께 한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 58","img":[{"u":"img/w10_riedel/p58.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 58"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-25":{"q":"Acceptable residual angulation after a small-finger metacarpal neck fracture is up to about:","o":["5 degrees","10–15 degrees","30–40 degrees","90 degrees","50–60 degrees"],"a":4,"qk":"새끼 손허리뼈 목 골절에서 허용되는 잔여 각형성은 대략 얼마까지인가?","ok":["5도","10–15도","30–40도","90도","50–60도"],"exp":"손허리뼈 목 골절은 흔히 직접 타격으로 생깁니다. 치료는 **어느 손허리뼈인지**와 **각형성 정도**에 따라 달라집니다. 약지와 새끼는 집게·가운데보다 **각형성을 더 잘 보상**합니다.\n\n허용 각형성은 **집게·가운데 10–15도**, **약지 30–40도**, **새끼 50–60도**입니다. 폐쇄 정복은 **Jahss 수기**(MCP를 굽힌 채 몸쪽손가락뼈를 통해 손허리뼈머리를 밀어 올리는 방법)로 하고, 대개 석고나 구터 부목으로 고정한 뒤 **2–3주에 운동을 시작**합니다. 수술가 필요한 경우는 드뭅니다.","why":{"0":"5도는 새끼에서 불필요하게 엄격한 기준입니다. 새끼는 50–60도까지 허용됩니다.","1":"10–15도는 집게·가운데 손허리뼈 목의 허용 범위입니다.","2":"30–40도는 약지 손허리뼈 목의 허용 범위입니다.","3":"90도는 허용 범위를 훨씬 넘습니다."},"one":"손허리뼈 목 각형성 허용: 집게·가운데 10–15도, 약지 30–40도, 새끼 50–60도.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 59, 60","img":[{"u":"img/w10_riedel/p59.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 59"},{"u":"img/w10_riedel/p60.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 60"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-26":{"q":"A thumb ulnar collateral ligament injury is considered an unstable joint, usually requiring open repair, when laxity compared with the contralateral thumb exceeds:","o":["30 degrees","10 degrees","15 degrees","45 degrees of IP flexion lag","60 degrees of MCP hyperextension"],"a":0,"qk":"엄지 척골측부인대(UCL) 손상에서, 반대쪽과 비교한 이완이 얼마를 넘으면 불안정 관절로 보고 대개 개방 봉합이 필요한가?","ok":["30도","10도","15도","45도의 지절간관절 신전 지연","60도의 손허리손가락관절 과신전"],"exp":"엄지 MCP의 척골측부인대 손상은 스키어나 공을 다루는 운동선수에게 흔하고, 등쪽 관절낭 파열이나 바닥판(volar plate) 손상과 함께 올 수 있으며, 중간부 파열 또는 뼈 견열이 가능합니다.\n\n치료의 핵심은 **관절 안정성** 평가입니다. 반대쪽 엄지와 비교하여 **30도보다 큰 이완**이면 **불안정 관절**로 봅니다. 이완의 끝점(endpoint)도 함께 평가합니다.\n\n**안정 관절**은 **4–6주 엄지 스피카 석고**로 치료하고, **불안정 관절은 개방 봉합**이 필요합니다. 만성 손상은 긴손바닥근 힘줄 이식으로 인대를 재건할 수 있습니다.","why":{"1":"10도는 불안정으로 보는 기준(30도)보다 작습니다.","2":"15도 역시 제시된 불안정 기준에 미치지 않습니다.","3":"지절간관절 신전 지연은 망치손가락 평가에 가깝습니다.","4":"MCP 과신전 60도는 이 UCL 이완 기준이 아닙니다."},"one":"엄지 UCL: 반대쪽보다 30도 초과 이완이면 불안정 → 개방 봉합, 안정이면 4–6주 스피카.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 63, 64, 65","img":[{"u":"img/w10_riedel/p63.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 63"},{"u":"img/w10_riedel/p64.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 64"},{"u":"img/w10_riedel/p65.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 65"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-27":{"q":"Drainage of a felon (pulp-space infection) should use a midvolar or lateral incision because a fish-mouth incision risks:","o":["Recurrence of a mucous cyst","Tip necrosis","Triggering at the A1 pulley","Injury to the ulnar artery in Guyon’s canal","Isolated DIP extensor lag"],"a":1,"qk":"손끝염(felon, 손가락 끝 지방조직 감염)을 배농할 때 중간손바닥 또는 가쪽 절개를 쓰는 이유는, 생선입(fish-mouth) 절개가 어떤 위험을 초래하기 때문인가?","ok":["점액낭종의 재발","손끝 괴사(tip necrosis)","A1 도르래에서의 방아쇠 현상","기용 굴에서 자동맥 손상","원위지절 신전 지연만"],"exp":"**손끝염(felon)**은 손가락 끝 지방조직(digital pad, pulp)의 감염으로, **심한 박동성 통증과 부종**이 특징이며, 가장 흔한 균은 **황색포도알균(S. aureus)**입니다.\n\n배농 절개는 **중간손바닥(midvolar) 또는 가쪽(lateral)**이 권장됩니다. **생선입 절개(fish-mouth incision)**는 **손끝 괴사**를 일으킬 수 있어 피해야 하고, 만지는 면(touch pad)도 피합니다. 이후 따뜻한 담금와 드레싱을 권합니다.\n\n손발톱주름 아래의 **손발톱주위염(paronychia)**도 황색포도알균이 가장 흔하며, 주름을 들어 올리면 되고 손발톱을 반드시 제거할 필요는 없습니다.","why":{"0":"점액낭종은 종양 범주의 병변이며, 생선입 절개의 주된 위험이 아닙니다.","2":"A1 도르래 방아쇠는 손끝염 배농 절개와 직접 관련이 없습니다.","3":"기용 굴의 자동맥은 손목 자쪽에 있어, 손끝 절개와 무관합니다.","4":"원위지절 신전 지연은 망치손가락의 소견입니다."},"one":"손끝염은 중간손바닥·가쪽 절개로 배농하고, 생선입 절개는 손끝 괴사 위험이 있어 피한다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 70, 72, 73","img":[{"u":"img/w10_riedel/p70.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 70"},{"u":"img/w10_riedel/p72.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 72"},{"u":"img/w10_riedel/p73.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 73"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-28":{"q":"Which of the following is a classic Kanavel sign of pyogenic flexor tenosynovitis?","o":["Night pain relieved by shaking the hand","Pain with Finkelstein ulnar deviation","Severe pain on passive extension of the digit","Thenar atrophy with a simian thumb","A transilluminating dorsal wrist mass"],"a":2,"qk":"화농성 굽힘근윤활막염(pyogenic flexor tenosynovitis)의 전형적인 카나벨 징후(Kanavel sign)는?","ok":["손을 털면 좋아지는 야간통","핑켈스타인 자쪽 치우침 시 통증","손가락을 수동으로 펼 때의 심한 통증","엄지두덩 위축과 원숭이손","빛을 투과하는 등쪽 손목 종괴"],"exp":"화농성 굽힘근윤활막염은 굽힘근 집(sheath)의 세균 감염입니다. 집은 **먼쪽 손바닥주름에서 손끝까지** 이어지며, 가장 흔한 균은 **황색포도알균**입니다.\n\n진단의 핵심은 **카나벨 징후** 네 가지입니다. **굽힌 자세**, **손가락의 방추형 부종**, **손가락을 수동으로 펼 때의 심한 통증**, **굽힘근 집을 따른 압통**입니다. 조기에 오면 정맥 항생제와 관찰이 가능하고, 늦게 오면 수술적 감압이 필요하며, 조기 운동이 권장됩니다. 증상이 남으면 재수술적 배농을 고려합니다.\n\n심한 연부조직 감염(괴사근막염 등)은 광범위 변연절제 후 그물 피부이식으로 덮을 수 있습니다.","why":{"0":"손을 털면 좋아지는 야간통은 손목굴 증후군의 병력에 가깝습니다.","1":"핑켈스타인 검사 통증은 De Quervain병을 시사합니다.","3":"엄지두덩 위축과 원숭이손은 진행된 정중신경 압박의 소견입니다.","4":"빛을 투과하는 종괴는 결절종(ganglion)의 특징입니다."},"one":"카나벨 징후: 굽힌 자세, 방추형 부종, 수동 신전 시 심한 통증, 굽힘근 집 압통.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 74, 75, 76, 77, 78, 79","img":[{"u":"img/w10_riedel/p74.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 74"},{"u":"img/w10_riedel/p75.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 75"},{"u":"img/w10_riedel/p76.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 76"},{"u":"img/w10_riedel/p77.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 77"},{"u":"img/w10_riedel/p78.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 78"},{"u":"img/w10_riedel/p79.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 79"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-29":{"q":"The most common soft-tissue tumor of the hand is a benign mucin-filled cyst (ganglion) that accounts for 50–70% of hand masses and is most often seen in:","o":["Elderly men after a deep infection","Children with open growth plates","Laborers immediately after a crush injury","Women in the second to fourth decades of life","Patients with late carpal tunnel atrophy"],"a":3,"qk":"손에서 가장 흔한 연부조직 종양은 점액이 찬 양성 낭종(결절종, ganglion)으로 손 종괴의 50–70%를 차지하며, 가장 흔히 보이는 대상은?","ok":["깊은 감염 후의 고령 남성","성장판이 열린 소아","압궤 손상 직후의 육체 노동자","20–40대 여성","늦은 손목굴 증후군으로 위축된 환자"],"exp":"**결절종(ganglion)**은 관절, 힘줄, 힘줄집과 관련된 **점액이 찬 양성 낭종**으로, **손에서 가장 흔한 연부조직 종양**이며 손 종괴의 **50–70%**를 차지합니다. **20–40대 여성**에서 흔하고, 통증과 약화의 원인이 될 수 있습니다.\n\n활동하면 커지고 쉬면 작아지며, 방사선 소견은 대개 특이하지 않고, 진단은 보통 임상 진찰로 합니다. **등쪽·손바닥쪽 손목과 굽힘근 집**이 병변의 **약 90%**를 차지합니다. 손가락의 결절종은 빛을 비추면 투과(transillumination)되어, 점액 내용임을 시사합니다. 등쪽 손목의 종괴는 가장 흔한 위치의 전형적인 모습입니다.","why":{"0":"결절종은 감염 후의 고령 남성 질환이 아니며, 20–40대 여성에서 흔합니다.","1":"열린 성장판은 청소년 동맥조영의 소견일 뿐, 결절종의 전형적 대상이 아닙니다.","2":"급성 압궤와 직접 관련된 종양이 아닙니다.","4":"손목굴 증후군의 위축과 결절종의 역학은 다릅니다."},"one":"결절종은 손에서 가장 흔한 연부 종양(50–70%)이며, 20–40대 여성, 손목 등쪽·손바닥과 굽힘근 집이 90%이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 80, 81, 82, 83, 84, 85","img":[{"u":"img/w10_riedel/p80.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 80"},{"u":"img/w10_riedel/p81.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 81"},{"u":"img/w10_riedel/p82.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 82"},{"u":"img/w10_riedel/p83.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 83"},{"u":"img/w10_riedel/p84.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 84"},{"u":"img/w10_riedel/p85.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 85"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w10_riedel-30":{"q":"When a symptomatic wrist ganglion is excised, which statement about treatment is correct?","o":["Steroid injection is preferred first-line therapy","Capsular closure is required to prevent recurrence","Aspiration is contraindicated in every case","Recurrence after excision is about 80–90%","Recurrence after excision of the base is about 10–15%"],"a":4,"qk":"증상이 있는 손목 결절종을 절제할 때, 치료에 대한 설명으로 옳은 것은?","ok":["스테로이드 주사가 선호되는 일차 치료이다","재발을 막으려면 관절낭 봉합이 필요하다","흡인은 모든 경우에서 금기이다","절제 후 재발률은 약 80–90%이다","기저부 절제 후 재발률은 약 10–15%이다"],"exp":"결절종의 비수술 치료에는 손가락으로 누르기, **흡인·천공(aspiration and fenestration)**, 양성 병변임을 안심시키는 것이 포함됩니다. 그러나 **스테로이드 주사는 피부 변화** 때문에 **권장되지 않습니다.**\n\n수술 적응은 **지속되는 증상성 종괴**입니다. **결절종의 기저부(base)를 절제**해야 하고, **관절낭을 봉합할 필요는 없습니다.** 재발률은 약 **10–15%**이며, 뻣뻣함이 문제가 될 수 있습니다. 빛을 투과하는 손가락 병변이나 등쪽 손목 종괴는 임상 진단에 도움이 됩니다.","why":{"0":"스테로이드 주사는 피부 변화 때문에 권장되지 않습니다.","1":"관절낭 봉합은 필요하지 않다고 제시됩니다.","2":"흡인과 천공은 비수술 치료의 한 방법이며, 전면 금기가 아닙니다.","3":"절제 후 재발률은 약 10–15%이지, 80–90%가 아닙니다."},"one":"결절종: 흡인은 가능하나 스테로이드는 피하고, 수술 시 기저부를 절제하며 재발은 약 10–15%이다.","src":"Riedel - Clinical Correlates - upper limb 2026-2027.pdf, slide 83, 86, 87","img":[{"u":"img/w10_riedel/p83.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 83"},{"u":"img/w10_riedel/p86.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 86"},{"u":"img/w10_riedel/p87.webp","cap":"Riedel - Clinical Correlates - Upper Limb.pdf, slide 87"}],"ch":"w10_riedel","chn":"Upper Limb Clinical Correlates","week":10},"w11_resp_histo-1":{"q":"The principal purpose of the respiratory system is to:","o":["Filter lymph and store oxygen inside alveolar macrophages","Generate voice in the larynx and also drain the paranasal sinus system","Exchange O2 and CO2 between air and blood, and then with the tissues","Pump systemic arterial blood throughout the bronchial tree","Produce all of the body's surfactant in the nasal vestibule"],"a":2,"qk":"호흡계통의 주된 목적은 무엇인가?","ok":["림프를 거르고 폐포대식세포에 산소를 저장한다","후두에서 목소리를 만들고 부비동의 분비물을 배출한다","공기와 혈액, 이어서 조직 사이에서 O2와 CO2를 교환한다","전신 동맥혈을 기관지를 통해 펌프질한다","코안뜰에서 몸 전체의 표면활성제를 생성한다"],"exp":"호흡계통의 근본 목적은 공기와 혈액 사이에서 **산소(O2)**와 **이산화탄소(CO2)**를 교환하고, 궁극적으로 몸 조직에 산소를 공급하며 이산화탄소를 제거하는 것입니다.\n\n**폐(lungs)**가 가스 교환이 일어나는 현장이며, 호흡계통의 나머지 부분은 공기를 폐로 들이고 내보내는 **기도(airways)**입니다.\n\n따라서 가스 교환과 조직 수준의 산소 공급·이산화탄소 제거가 본래의 목적이고, 목소리 생성이나 림프 여과 같은 기능은 이 목적 자체는 아닙니다.","why":{"0":"폐포대식세포(dust cells)는 입자성 오염물을 탐식하지만, 산소를 저장하거나 림프를 거르는 기관이 아닙니다.","1":"후두는 발성에 관여하고 부비동 점액은 섬모에 의해 비강으로 쓸려 나가지만, 이것이 호흡계통의 본래 목적은 아닙니다.","3":"기관지동맥은 기관지 벽에 영양혈을 공급하지만, 호흡계통의 목적은 전신 혈액을 펌프질하는 것이 아닙니다.","4":"표면활성제(surfactant)는 주로 제2형 폐포세포와 클럽세포가 분비하며, 코안뜰에서 전신 표면활성제를 만드는 것이 아닙니다."},"one":"호흡계통의 목적은 공기–혈액–조직 사이 O2/CO2 교환이며, 그 현장은 폐이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 2","img":[{"u":"img/w11_resp_histo/p02.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 2"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-2":{"q":"Which set of structures constitutes the conducting portion of the respiratory system?","o":["Airways from the nasal cavities through the terminal bronchioles","Airways from respiratory bronchioles through the alveoli","Alveolar ducts, alveolar sacs, and the visceral pleura only","Terminal bronchioles plus respiratory bronchioles and alveolar ducts","Nasal cavities and alveoli, excluding the trachea and bronchi"],"a":0,"qk":"호흡계통의 전도부(conducting portion)를 구성하는 구조는?","ok":["비강에서 종말세기관지까지의 기도","호흡세기관지에서 폐포까지의 기도","폐포관, 폐포낭 및 내장가슴막만","종말세기관지에 더해 호흡세기관지와 폐포관","비강과 폐포(기관과 기관지는 제외)"],"exp":"호흡계통은 **전도부(conducting portion)**와 **호흡부(respiratory portion)**로 나뉩니다.\n\n전도부는 공기를 폐의 가스 교환 부위로 전달하는 통로로, **비강(nasal cavities)**, **비인두(nasopharynx)**, **후두(larynx)**, **기관(trachea)**, **기관지(bronchi)**, **세기관지(bronchioles)**, 그리고 **종말세기관지(terminal bronchioles)**까지입니다.\n\n호흡부는 실제로 가스 교환이 일어나는 구간으로, **호흡세기관지(respiratory bronchioles)**, **폐포관(alveolar ducts)**, **폐포낭(alveolar sacs)**, **폐포(alveoli)**로 이루어집니다.\n\n종말세기관지는 전도부의 마지막이고, 벽에 폐포가 열리는 호흡세기관지부터가 호흡부입니다.","why":{"1":"이들은 호흡부(respiratory portion)이며 전도부가 아닙니다.","2":"폐포관과 폐포낭은 호흡부이고, 내장가슴막은 폐 겉면을 덮는 장막이지 전도 기도가 아닙니다.","3":"종말세기관지는 전도부이지만, 호흡세기관지와 폐포관은 호흡부에 속합니다.","4":"비강은 전도부, 폐포는 호흡부이며, 기관과 기관지를 빼면 전도부가 완전히 기술되지 않습니다."},"one":"전도부는 비강부터 종말세기관지까지이고, 호흡세기관지부터는 호흡부이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_resp_histo/p03.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-3":{"q":"The ventilation system that moves air in and out of the lungs consists of the:","o":["Pulmonary arteries, bronchial arteries, and the pulmonary veins","Visceral pleura, parietal pleura, and the pleural cavity only","Nasal conchae, the larynx, and the trachealis muscle alone","Alveolar macrophages, club cells, and type II pneumocytes","Thoracic cage, intercostals, diaphragm, and elastic lung tissue"],"a":4,"qk":"공기를 폐로 들이고 내보내는 환기 계통(ventilation system)을 구성하는 것은?","ok":["허파동맥, 기관지동맥 및 허파정맥","내장가슴막, 벽쪽가슴막 및 가슴막공간만","코선반, 후두 및 기관근만","폐포대식세포, 클럽세포 및 제2형 폐포세포","흉곽, 갈비사이근, 가로막 및 폐의 탄력 조직"],"exp":"**환기 계통(ventilation system)**은 공기를 폐로 들이고 내보내는 기계적 장치입니다.\n\n이는 **흉곽(thoracic cage)**, **갈비사이근(intercostal muscles)**, **가로막(diaphragm)**, 그리고 폐 조직의 **탄력 성분(elastic components)**으로 구성됩니다.\n\n가로막이 수축하면 흉강 부피가 늘어나 음압이 생겨 공기가 들어오고, 이완하면 부피가 줄어 양압으로 공기가 나갑니다. 기도의 탄력섬유는 들숨에서 늘어났다가 날숨에서 **탄력 반동(elastic recoil)**을 제공합니다.\n\n혈관, 가슴막, 상피세포는 각각 순환·윤활·분비에 중요하지만 환기 계통의 구성 요소로 열거되지는 않습니다.","why":{"0":"이들은 폐의 순환(폐순환·기관지순환)이지, 흉강 부피를 바꾸는 환기 계통이 아닙니다.","1":"가슴막은 장막으로서 윤활을 제공하지만, 환기 계통의 구성으로 제시된 것은 흉곽·갈비사이근·가로막·탄력 성분입니다.","2":"코선반과 후두, 기관근은 기도의 일부이지만 환기 계통 자체는 아닙니다.","3":"이들 세포는 탐식·표면활성제 분비 등에 관여하며, 흉강 부피를 바꾸는 환기 장치가 아닙니다."},"one":"환기는 흉곽, 갈비사이근, 가로막, 그리고 폐의 탄력 성분이 담당한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3","img":[{"u":"img/w11_resp_histo/p03.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 3"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-4":{"q":"The nasal vestibule, into which the nares open, is lined by:","o":["Olfactory epithelium with bipolar neurons plus Bowman's glands","Skin with sweat glands, sebaceous glands, and coarse vibrissae","Thin respiratory epithelium attached directly to periosteum","Simple cuboidal epithelium rich in club (Clara) cells","Mesothelium that secretes a lubricating serous fluid"],"a":1,"qk":"콧구멍(nares)이 열리는 코안뜰(nasal vestibule)의 덮개는?","ok":["양극신경세포와 보우만샘을 가진 후각상피","땀샘, 피지샘 및 굵은 털(vibrissae)을 가진 피부","골막에 직접 붙는 얇은 호흡상피","클럽(클라라)세포가 풍부한 단층입방상피","윤활 장액을 분비하는 중피"],"exp":"좌우 **비강(nasal cavities)**은 **비중격(nasal septum)**으로 나뉘며, **콧구멍(nares, nostrils)**은 **코안뜰(vestibule)**로 열립니다.\n\n코안뜰은 **피부**로 덮여 있고, **땀샘(sweat glands)**, **피지샘(sebaceous glands)**, **vibrissae(굵은 털)**를 가집니다. 안뜰에서 고유 비강으로 가면서 상피는 **각질화된 중층편평상피(stratified squamous keratinized epithelium)**에서 **거짓중층섬모원주상피(pseudostratified ciliated columnar epithelium)**로 이행합니다.\n\n비중격은 뒤쪽이 뼈, 앞쪽이 연골이며, **코선반(nasal conchae, turbinates)**은 각 비강의 **가쪽벽**에서 돌출하는 세 개의 뼈 선반입니다.","why":{"0":"후각상피는 비강 천장에 있으며 코안뜰의 lining이 아닙니다.","2":"골막에 직접 붙는 얇은 호흡상피(점막골막, mucoperiosteum)는 부비동의 특징입니다.","3":"클럽세포가 있는 단층입방상피는 세기관지에서 나타나는 이행이지 코안뜰이 아닙니다.","4":"중피(mesothelium)는 가슴막과 같은 장막의 lining입니다."},"one":"코안뜰은 땀샘·피지샘·vibrissae를 가진 피부이며, 고유 비강으로 가며 호흡상피로 이행한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4","img":[{"u":"img/w11_resp_histo/p04.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4"},{"u":"img/w11_resp_histo/p05.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 5"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-5":{"q":"The three nasal conchae (formerly called turbinates) protrude from the:","o":["Cribriform plate of the ethmoid in the nasal roof","Medial wall formed solely by the vomer","Floor formed by the palatine process of the maxilla bone","Lateral wall of each nasal cavity, as three bony shelves","Posterior openings (choanae) into the nasopharynx"],"a":3,"qk":"세 개의 코선반(nasal conchae, 옛 이름 turbinates)은 어디에서 돌출하는가?","ok":["비강 천장의 벌집뼈 체판","보기로만 이루어진 안쪽벽","위턱뼈 입천장돌기가 만드는 바닥","각 비강의 가쪽벽에서 돌출하는 세 개의 뼈 선반","비인두로 가는 뒤쪽 구멍(후비공, choanae)"],"exp":"각 비강의 **안쪽벽(medial wall)**은 **비중격(nasal septum)**이 만듭니다. 비중격은 **뒤쪽이 뼈**, **앞쪽이 연골**입니다. 그림에서는 **보기(vomer)**, **벌집뼈 수직판(perpendicular plate of ethmoid)**, **중격연골(septal cartilage)**, 그리고 위턱뼈·입천장의 **코능선(nasal crest)**이 중격을 구성합니다.\n\n이와 달리 **코선반(nasal conchae)**은 각 비강의 **가쪽벽(lateral wall)**에서 돌출하는 세 개의 뼈 선반으로, 과거에는 **비갑개(turbinates)**라고 불렀습니다. 위·중간·아래 코선반이 보이며, 앞쪽에는 **코안뜰(nasal vestibule)**이 있습니다.\n\n코선반은 점막 표면적을 넓혀 흡입 공기의 가온·가습·여과에 기여합니다.","why":{"0":"체판은 후각신경 축삭이 후각망울로 지나가는 비강 천장 구조이지, 코선반의 기시부가 아닙니다.","1":"보기는 비중격의 뼈 성분으로 안쪽벽을 이루며, 코선반은 가쪽벽에서 나옵니다.","2":"입천장 쪽은 비강 바닥이며 코선반의 기시벽이 아닙니다.","4":"후비공(choanae)은 비강과 비인두를 잇는 뒤쪽 통로이지, 코선반이 돌출하는 벽이 아닙니다."},"one":"코선반은 각 비강의 가쪽벽에서 돌출하고, 비중격이 안쪽벽을 이룬다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4, 5","img":[{"u":"img/w11_resp_histo/p04.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 4"},{"u":"img/w11_resp_histo/p05.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 5"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-6":{"q":"Brush cells in respiratory epithelium are best described as:","o":["Chemosensory cells with blunt microvilli that synapse on afferent endings","Mucus-secreting cells that form most of the epithelial surface","Mitotically active progenitor cells replacing the other epithelial cell types","DNES cells that store dense-core granules near the basal surface","Ciliated cells whose beating clears mucus toward the pharynx"],"a":0,"qk":"호흡상피의 솔세포(brush cells)를 가장 잘 설명한 것은?","ok":["뭉툭한 미세융모를 가지고 들신경 말단과 연접하는 화학감각세포","상피 표면의 대부분을 이루는 점액 분비 세포","다른 모든 상피세포를 교체하는 유사분열 활성 전구세포","기저막 근처에 치밀중심과립을 저장하는 DNES 세포","박동으로 점액을 인두 쪽으로 쓸어 보내는 섬모세포"],"exp":"대부분의 비강과 다른 기도를 덮는 **호흡상피(respiratory epithelium)**는 **거짓중층섬모원주상피(pseudostratified ciliated columnar epithelium)**입니다.\n\n세포 유형은 다음과 같습니다. **술잔세포(goblet cells)**는 점액을 분비합니다. **솔세포(brush cells)**는 **화학감각세포(chemosensory cells)**로, **성기고 뭉툭한 미세융모(sparse blunt microvilli)**를 가지며 **들신경 말단(afferent nerve endings)**과 연접합니다. **소과립세포(small granule cells)**는 치밀중심과립을 가지며 **미만신경내분비계통(DNES)**에 속합니다. **기저세포(basal cells)**는 유사분열이 활발한 전구세포로 다른 상피세포를 만듭니다.\n\n솔세포를 술잔세포·기저세포·소과립세포·섬모세포와 혼동하지 마세요.","why":{"1":"점액을 분비하는 것은 술잔세포(goblet cells)입니다.","2":"전구세포는 기저세포(basal cells)입니다.","3":"치밀중심과립과 DNES는 소과립세포(small granule cells)의 특징입니다.","4":"점액 배출을 위한 운동성 섬모는 섬모원주세포의 특징입니다."},"one":"솔세포는 뭉툭한 미세융모를 가진 화학감각세포로, 들신경 말단과 연접한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6"},{"u":"img/w11_resp_histo/p07.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 7"},{"u":"img/w11_resp_histo/p08.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 8"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-7":{"q":"Small granule cells of respiratory epithelium are characterized by:","o":["Sparse blunt microvilli and synapses onto afferent nerve endings","Abundant apical mucus granules released into the airway lumen","Dense-core granules and membership in the DNES","Numerous motile cilia that sweep mucus toward the nasopharynx","Production of odorant-binding proteins for the olfactory cilia"],"a":2,"qk":"호흡상피의 소과립세포(small granule cells)의 특징은?","ok":["성긴 뭉툭한 미세융모와 들신경 말단과의 연접","기도 내강으로 배출되는 풍부한 꼭대기쪽 점액 과립","치밀중심과립과 미만신경내분비계통(DNES)에의 소속","점액을 비인두 쪽으로 쓸어 보내는 수많은 운동성 섬모","후각신경세포 섬모용 냄새물질결합단백질의 생성"],"exp":"호흡상피의 **소과립세포(small granule cells)**는 **치밀중심과립(dense-core granules)**을 가지며 **미만신경내분비계통(DNES, diffuse neuroendocrine system)**의 일부입니다.\n\n이 세포는 국소 호르몬·아민을 함유하는 내분비·신경내분비 세포로, 기도의 국소 조절에 관여하는 것으로 이해됩니다.\n\n솔세포의 화학감각 연접, 술잔세포의 점액, 섬모세포의 운동성 섬모, 후각 지지세포의 냄새물질결합단백질과는 구분해야 합니다.","why":{"0":"이는 솔세포(brush cells)의 특징입니다.","1":"꼭대기쪽 점액 과립은 술잔세포(goblet cells)의 특징입니다.","3":"운동성 섬모는 호흡상피의 섬모원주세포 특징입니다.","4":"냄새물질결합단백질은 후각상피 지지세포(supporting cells)가 만듭니다."},"one":"소과립세포는 치밀중심과립을 가지며 DNES에 속하는 호흡상피 세포이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6"},{"u":"img/w11_resp_histo/p08.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 8"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-8":{"q":"Capillary loops in the respiratory lamina propria, located near the mucosal surface, primarily:","o":["Exchange O2 and CO2 across the alveolar blood-air barrier","Drain lymph from the subpleural lymphatic plexus to hilar nodes","Supply blood to the vocalis muscle of the vocal folds","Carry odorants through the cribriform plate to the olfactory bulb","Warm the inspired air as it flows over the mucosa"],"a":4,"qk":"호흡점막 고유층(respiratory lamina propria)에서 표면에 가까운 모세혈관 고리의 주된 역할은?","ok":["폐포 혈액-공기 장벽을 통해 O2와 CO2를 교환한다","가슴막밑 림프총을 폐문 림프절로 배출한다","성대주름 안의 성대근에 혈액을 공급한다","체판을 통해 냄새 물질을 후각망울로 운반한다","점막 위를 지나는 흡입 공기를 데운다"],"exp":"호흡점막의 **고유층(lamina propria)**에는 복잡한 혈관그물이 있으며, 표면 근처의 **모세혈관 고리(capillary loops)**는 **흡입 공기를 데우는(warming the inspired air)** 역할을 합니다.\n\n또한 고유층의 **점액장액샘(mucoserous glands)**이 상피 술잔세포의 분비를 보완합니다.\n\n가스 교환은 폐포의 혈액-공기 장벽에서, 림프 배액은 폐의 기관지주위·가슴막 림프관에서 일어나며, 코 고유층의 표면 모세혈관 기능과 같지 않습니다.","why":{"0":"혈액-공기 장벽에서의 가스 교환은 폐포와 그 주위 모세혈관에서 일어납니다.","1":"가슴막밑 림프총은 폐 표면의 림프 배액로이지, 비강 고유층 모세혈관의 기능이 아닙니다.","2":"성대근 혈류는 후두의 공급이지 호흡점막 표면 모세혈관 고리의 기능이 아닙니다.","3":"후각신경 축삭이 체판을 지나 후각망울로 가며, 모세혈관이 냄새 물질을 운반하지는 않습니다."},"one":"호흡점막 고유층의 표면 근처 모세혈관 고리는 흡입 공기를 데운다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6","img":[{"u":"img/w11_resp_histo/p06.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 6"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-9":{"q":"Olfactory neurons in the roof of the nasal cavity are:","o":["Unipolar neurons whose axons remain confined to the nasal mucosa","Bipolar neurons with non-motile cilia; axons cross the cribriform plate","Multipolar neurons that synapse on goblet cells in the epithelium","Pseudounipolar neurons whose cell bodies lie in the trigeminal ganglion","Bipolar neurons with motile cilia that sweep mucus to the choanae"],"a":1,"qk":"비강 천장에 있는 후각신경세포(olfactory neurons)의 특징은?","ok":["축삭이 비점막 안에만 머무르는 단극신경세포","비운동성 섬모를 가진 양극신경세포이며, 축삭은 체판을 가로지른다","호흡상피 술잔세포와 연접하는 다극신경세포","세포체가 삼차신경절에 있는 거짓단극신경세포","운동성 섬모로 점액을 후비공 쪽으로 쓸어 보내는 양극신경세포"],"exp":"**후각상피(olfactory epithelium)**는 비강 **천장(roof)**에 있으며 후각을 담당합니다.\n\n**후각신경세포(olfactory neurons)**는 **양극신경세포(bipolar neurons)**입니다. 내강 쪽 끝은 팽대되어 수많은 **비운동성 섬모(non-motile cilia)**가 나와, 냄새 분자를 감지하는 표면적을 넓힙니다. 축삭은 고유층에서 가는 다발로 모인 뒤 **벌집뼈 체판(cribriform plate of the ethmoid)**의 구멍을 지나 **후각망울(olfactory bulb)**의 다른 신경세포와 연접합니다.\n\n이 섬모는 점액을 쓸어 보내는 호흡상피의 운동성 섬모와 다릅니다.","why":{"0":"후각신경세포는 단극이 아니며, 축삭은 체판을 넘어 후각망울까지 갑니다.","2":"후각신경세포는 다극이 아니고 술잔세포와 연접하지 않습니다.","3":"거짓단극세포가 삼차신경절에 있는 것은 일반 체지각이며, 후각신경세포의 기술이 아닙니다.","4":"후각 섬모는 비운동성이며 냄새 감지 면적을 넓히는 역할이지, 점액 청소용이 아닙니다."},"one":"후각신경세포는 비운동성 섬모를 가진 양극세포로, 축삭은 체판을 지나 후각망울로 간다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 9","img":[{"u":"img/w11_resp_histo/p09.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 9"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-10":{"q":"Supporting cells of the olfactory epithelium produce:","o":["Pulmonary surfactant that lowers surface tension in alveolar sacs","Dense-core granules of the diffuse neuroendocrine system","Mucus that motile cilia then sweep into the paranasal sinuses","Odorant-binding proteins that deliver odorants to olfactory cilia","Antimicrobial peptides and xenobiotic-detoxifying SER enzymes"],"a":3,"qk":"후각상피의 지지세포(supporting cells)가 생성하는 것은?","ok":["폐포 표면장력을 낮추는 폐표면활성제","미만신경내분비계통의 치밀중심과립","운동성 섬모가 부비동으로 쓸어 보내는 점액","냄새 분자를 후각 섬모에 전달하는 냄새물질결합단백질","활면서세망에서 이물질을 해독하는 항균 펩타이드"],"exp":"후각상피의 **지지세포(supporting cells)**는 원주형이고 꼭대기가 넓으며, 꼭대기 표면에 **미세융모(microvilli)**가 있습니다. 인접 후각신경세포와 **연접복합체(junctional complexes)**로 붙고, 신경아교세포처럼 후각세포에 기계적·대사적 지지를 제공합니다.\n\n핵심 기능 중 하나는 **냄새물질결합단백질(odorant-binding proteins)**을 만들어, 공기 속 냄새 분자를 붙잡아 후각신경세포 섬모의 수용체에 전달하는 것입니다.\n\n후각상피의 **기저세포(basal cells)**는 구형 또는 원뿔형으로 기저막 위에 있으며, 나머지 두 세포 유형을 교체하는 줄기세포입니다.","why":{"0":"폐표면활성제는 제2형 폐포세포(및 세기관지 클럽세포)가 분비합니다.","1":"치밀중심과립과 DNES는 호흡상피 소과립세포의 특징입니다.","2":"부비동 점액은 얇은 호흡상피의 섬모가 작은 개구 쪽으로 쓸어 보내며, 후각 지지세포의 주기능이 아닙니다.","4":"이물질 해독(SER 효소)과 항균 펩타이드 분비는 클럽세포의 기능입니다."},"one":"후각 지지세포는 냄새물질결합단백질을 만들어 냄새 분자를 후각 섬모에 전달한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 10","img":[{"u":"img/w11_resp_histo/p10.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 10"},{"u":"img/w11_resp_histo/p12.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 12"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-11":{"q":"Olfactory (Bowman's) glands in the olfactory lamina propria secrete:","o":["Mucus identical to goblet-cell mucus of respiratory epithelium","Surfactant phospholipids packaged in lamellar bodies","A serous fluid whose only role is to warm inspired air","A watery secretion that lubricates the vocal ligaments","A proteinaceous fluid that traps and dissolves odorants"],"a":4,"qk":"후각 고유층의 후각샘(Bowman's glands)이 분비하는 것은?","ok":["호흡상피 술잔세포의 점액과 동일한 점액","층판소체에 포장된 표면활성제 인지질","흡입 공기를 데우는 것만이 목적인 장액","성대인대를 윤활하는 수성 분비물","냄새 물질을 가두고 용해시키는 단백질성 액체"],"exp":"후각점막의 **고유층(olfactory lamina propria)**에는 **후각샘(olfactory glands, Bowman's glands)**이 있습니다.\n\n이 샘은 점막 표면으로 **단백질성 액체(proteinaceous fluid)**를 분비하여, 냄새 물질을 **가두고 용해(traps and dissolves)**시켜 후각신경세포가 감지할 수 있게 합니다.\n\n광학현미경에서는 후각상피 아래 고유층에 큰 샘 단면이 보이며, 이는 호흡점막의 술잔세포 점액이나 폐포 층판소체의 표면활성제와는 다른 분비입니다.","why":{"0":"보우만샘 분비물은 냄새 물질을 용해시키는 단백질성 액체이며, 호흡상피 술잔세포 점액과 같다고 하지 않습니다.","1":"층판소체의 표면활성제 인지질은 제2형 폐포세포의 특징입니다.","2":"흡입 공기 가온은 호흡점막 고유층 모세혈관 고리의 역할이며, 보우만샘의 기술된 기능이 아닙니다.","3":"성대인대 윤활은 보우만샘의 기능이 아니며, 성대주름 고유층에는 샘이 없습니다."},"one":"보우만샘은 냄새 물질을 가두고 용해시키는 단백질성 액을 후각점막 표면에 분비한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 11","img":[{"u":"img/w11_resp_histo/p11.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 11"},{"u":"img/w11_resp_histo/p12.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 12"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-12":{"q":"The mucosa of the paranasal sinuses is called mucoperiosteum because:","o":["A thick submucosa with mixed salivary glands separates it from bone","The lamina propria attaches directly to periosteum, without a submucosa","The lining is keratinized stratified squamous epithelium, like skin","C-shaped hyaline cartilage rings support the walls of each sinus","Olfactory neurons and Bowman's glands that are embedded in the periosteum"],"a":1,"qk":"부비동 점막을 점막골막(mucoperiosteum)이라고 부르는 이유는?","ok":["혼합 침샘이 있는 두꺼운 점막밑조직이 뼈와 점막을 가른다","고유층이 점막밑조직 없이 골막에 직접 붙기 때문이다","표면이 피부처럼 각질화된 중층편평상피이기 때문이다","각 부비동 벽이 C자 유리연골 고리로 지탱되기 때문이다","후각신경세포와 보우만샘이 골막에 묻혀 있기 때문이다"],"exp":"**부비동(paranasal sinuses)**은 **이마뼈(frontal)**, **위턱뼈(maxillary)**, **벌집뼈(ethmoid)**, **나비뼈(sphenoid)** 안의 좌우 공동입니다. 얇은 호흡상피로 덮입니다.\n\n고유층이 **점막밑조직(submucosa) 없이 골막(periosteum)에 직접** 붙기 때문에 이 점막을 **점막골막(mucoperiosteum)**이라고 합니다.\n\n부비동은 작은 개구로 비강과 통하며, **섬모가 점액을 이 개구 쪽으로 쓸어** 보냅니다. 해부 표본과 관상면 CT에서는 위턱뼈 위의 큰 위턱굴과 중앙의 비강·벌집공기가 잘 보입니다.","why":{"0":"부비동에서는 점막밑조직이 개재하지 않고 고유층이 골막에 직접 붙습니다.","2":"부비동 lining은 얇은 호흡상피이며 각질화된 중층편평상피가 아닙니다.","3":"C자 유리연골 고리는 기관의 특징이지 부비동의 지지 구조가 아닙니다.","4":"후각신경세포와 보우만샘은 비강 천장 후각점막에 있으며 부비동 골막의 구성이 아닙니다."},"one":"부비동 점막은 고유층이 골막에 직접 붙는 점막골막이며, 섬모가 점액을 비강 개구로 쓸어 보낸다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 13","img":[{"u":"img/w11_resp_histo/p13.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 13"},{"u":"img/w11_resp_histo/p14.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 14"},{"u":"img/w11_resp_histo/p15.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 15"},{"u":"img/w11_resp_histo/p16.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 16"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-13":{"q":"The nasopharynx communicates with the tympanic cavities (middle ear) via the:","o":["Pharyngotympanic (auditory) tubes","Choanae (posterior nasal apertures)","Vestibular folds of the larynx","Cricothyroid ligament of the larynx","Vestibule of the nasal cavity"],"a":0,"qk":"비인두가 고실(중이)과 교통하는 통로는?","ok":["인두고실관(귀관, pharyngotympanic tubes)","후비공(choanae, 뒤콧구멍)","후두의 전정주름","후두의 반지방패인대","비강의 코안뜰"],"exp":"**비인두(nasopharynx)**는 **후비공(choanae)**으로 비강과, **인두고실관(pharyngotympanic tubes, 귀관)**으로 **고실(tympanic cavities, 중이)**과, 그리고 **구인두(oropharynx)**와 통합니다.\n\n비인두는 호흡상피로 덮이며, **인두편도(pharyngeal tonsil)**와 **귀관편도(tubal tonsils)**가 있는 위치입니다. 그림에는 인두고실관의 인두 개구와 인두편도가 표시되어 있습니다.\n\n후비공은 비강과의 교통, 전정주름과 반지패열인대는 후두의 구조이므로 중이와의 통로가 아닙니다.","why":{"1":"후비공(choanae)은 비인두와 비강을 잇는 통로이지, 고실과의 교통이 아닙니다.","2":"전정주름은 후두의 주름이며 중이와 연결되지 않습니다.","3":"반지방패인대는 후두에서 방패연골과 반지연골을 잇는 구조입니다.","4":"코안뜰은 콧구멍이 열리는 비강의 앞부분입니다."},"one":"비인두는 인두고실관으로 중이와, 후비공으로 비강과 교통한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 17","img":[{"u":"img/w11_resp_histo/p17.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 17"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-14":{"q":"Which laryngeal cartilages are elastic, rather than hyaline?","o":["Thyroid, cricoid, and arytenoid","Thyroid, cuneiform, and cricoid","Arytenoid, corniculate, and the cricoid","Cuneiform, corniculate, and epiglottic","Thyroid, arytenoid, and epiglottic"],"a":3,"qk":"유리연골이 아니라 탄성연골로 된 후두 연골은?","ok":["방패연골, 반지연골, 모뿔연골","방패연골, 쐐기연골, 반지연골","모뿔연골, 뿔연골, 반지연골","쐐기연골, 뿔연골, 후두개연골","방패연골, 모뿔연골, 후두개연골"],"exp":"후두는 인두와 기관을 잇는 구조이며 여러 연골로 보강됩니다.\n\n**유리연골(hyaline cartilage)**은 **방패연골(thyroid)**, **반지연골(cricoid)**, **모뿔연골(arytenoid)**입니다. **탄성연골(elastic cartilage)**은 **쐐기연골(cuneiform)**, **뿔연골(corniculate)**, **후두개연골(epiglottic)**입니다.\n\n후두개는 앞면이 **구강상피(oral epithelium)**, 뒷면이 **호흡상피**로 덮이고, 고유층에는 점액·장액 혼합샘이 있습니다. 방패·반지·모뿔을 탄성연골로 외우면 틀리기 쉬우니 두 군을 짝지어 기억하세요.","why":{"0":"방패·반지·모뿔연골은 유리연골입니다.","1":"방패연골과 반지연골은 유리연골이고, 쐐기연골만 탄성연골입니다.","2":"모뿔연골과 반지연골은 유리연골이고, 뿔연골만 탄성연골입니다.","4":"방패연골과 모뿔연골은 유리연골이며, 후두개만 탄성연골입니다."},"one":"후두에서 탄성연골은 쐐기·뿔·후두개연골이고, 방패·반지·모뿔연골은 유리연골이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18","img":[{"u":"img/w11_resp_histo/p18.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-15":{"q":"Compared with the vestibular folds, the vocal folds are covered by:","o":["Respiratory epithelium, with seromucous glands throughout the lamina propria","Olfactory epithelium, with Bowman's glands in the lamina propria","Stratified squamous epithelium, no glands, plus a vocal ligament and vocalis","Transitional epithelium and plates of hyaline cartilage","Simple squamous mesothelium continuous with the pleura"],"a":2,"qk":"전정주름과 비교할 때, 성대주름(vocal folds)의 덮개와 고유층 특징은?","ok":["호흡상피로 덮이고 고유층에 장액점액샘이 있다","후각상피로 덮이고 고유층에 보우만샘이 있다","중층편평상피로 덮이고 샘은 없으며 성대인대와 성대근이 있다","이행상피로 덮이고 유리연골 판이 있다","가슴막과 이어지는 단층편평 중피로 덮인다"],"exp":"후두 가쪽벽에 두 주름이 붙습니다.\n\n**전정주름(vestibular folds)**은 **호흡상피**로 덮이고, 고유층에 **장액점액샘(seromucous glands)**이 있습니다(조직 절편에서는 심실주름·점액샘으로 표시).\n\n**성대주름(vocal folds)**은 **중층편평상피(stratified squamous epithelium)**로 덮입니다. 고유층에는 **샘이 없고**, 대신 치밀한 탄성결합조직 다발인 **성대인대(vocal ligament)**와 **성대근(vocalis muscle)**이 있습니다. 성대인대의 진동이 목소리를 만듭니다.\n\n중층편평상피는 진동·마찰을 견디기에 적합하고, 샘이 없으면 점액이 진동을 방해하지 않습니다.","why":{"0":"호흡상피와 장액점액샘은 전정주름(vestibular folds)의 특징입니다.","1":"후각상피와 보우만샘은 비강 천장 후각점막의 특징입니다.","3":"후두 주름은 이행상피로 덮이지 않으며, 성대주름에 유리연골 판이 있지 않습니다.","4":"단층편평 중피는 가슴막의 lining이며 성대주름의 상피가 아닙니다."},"one":"성대주름은 중층편평상피·성대인대·성대근을 갖고 샘이 없으며, 전정주름은 호흡상피와 샘을 갖는다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18, 19","img":[{"u":"img/w11_resp_histo/p18.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 18"},{"u":"img/w11_resp_histo/p19.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 19"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-16":{"q":"Posteriorly, the C-shaped hyaline cartilage rings of the trachea are replaced by:","o":["A plate of elastic cartilage like that of the epiglottis","Striated vocalis muscle within a vocal ligament","A complete ring of compact bone","Trachealis muscle (smooth muscle)","A dense fibrous vocal ligament"],"a":3,"qk":"기관의 C자 유리연골 고리는 뒤쪽에서 무엇으로 대치되는가?","ok":["후두개와 같은 탄성연골 판","성대인대 안의 가로무늬 성대근","완전한 치밀뼈 고리","기관근(평활근, trachealis muscle)","치밀한 섬유성 성대인대"],"exp":"성인의 **기관(trachea)**은 길이 약 **10–12 cm**이며 호흡점막으로 덮입니다. 고유층에는 장액점액샘이 있습니다.\n\n점막밑조직의 약 **12개 C자 유리연골 고리**가 경도를 부여해 기관이 납작해지지 않게 합니다. 고리의 열린 뒤쪽은 **기관근(trachealis muscle, 평활근)**으로 대치됩니다. 가장 바깥은 **외막(adventitia)**입니다.\n\n횡단 조직 절편에서 연골이 뒤쪽에서 끊기고 그 사이가 부드러운 근조직으로 이어진 모습을 볼 수 있습니다. 식도가 바로 뒤에 있어, 뒤쪽이 연골이 아닌 평활근인 것이 삼킴 때 약간의 확장을 허용합니다.","why":{"0":"탄성연골 판은 후두개 등의 특징이며, 기관 고리의 뒤쪽 대치는 평활근입니다.","1":"성대근은 성대주름에 있는 가로무늬근이며 기관 뒤벽이 아닙니다.","2":"기관을 지탱하는 것은 뼈 고리가 아니라 C자 유리연골입니다.","4":"성대인대는 성대주름 고유층의 탄성결합조직 다발입니다."},"one":"기관의 C자 유리연골 고리 뒤쪽은 기관근(평활근)으로 대치된다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 20","img":[{"u":"img/w11_resp_histo/p20.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 20"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-17":{"q":"How many lobar (secondary) and segmental (tertiary) bronchi supply the right and left lungs?","o":["3 lobar and 10 segmental on the right; 2 lobar and 8 segmental on the left","2 lobar and 8 segmental on the right; 3 lobar and 10 segmental on the left","3 lobar and 8 segmental bronchi on each side","2 lobar and 10 segmental bronchi on each side","3 lobar and 10 segmental bronchi for each lung"],"a":0,"qk":"오른쪽과 왼쪽 폐에 공급하는 엽기관지(2차)와 구역기관지(3차)의 수는?","ok":["오른쪽 엽 3·구역 10, 왼쪽 엽 2·구역 8","오른쪽 엽 2·구역 8, 왼쪽 엽 3·구역 10","양측 모두 엽 3·구역 8","양측 모두 엽 2·구역 10","각 폐에 엽 3·구역 10"],"exp":"기관은 좌우 **일차기관지(primary bronchi)**로 갈라져 각 폐로 갑니다. 일차기관지는 **이차(엽)기관지(secondary / lobar bronchi)**로 나뉘며, **오른쪽 3개**, **왼쪽 2개**입니다(우폐 3엽, 좌폐 2엽).\n\n각 엽기관지는 **삼차(구역)기관지(tertiary / segmental bronchi)**를 내며, **오른쪽 10개**, **왼쪽 8개**입니다. 그림에서 왼쪽은 B1+2, B7+8처럼 구역이 합쳐져 8개가 됩니다. 오른쪽 위엽기관지는 **동맥위기관지(eparterial bronchus)**라고도 불립니다.\n\n구역동맥과 구역기관지가 공급하는 폐 단위는 결합조직 중격으로 둘러싸여, 주위 건강한 조직을 크게 해치지 않고 외과적으로 제거할 수 있습니다.","why":{"1":"좌우가 바뀌었습니다. 엽기관지는 오른쪽 3, 왼쪽 2이고 구역기관지는 오른쪽 10, 왼쪽 8입니다.","2":"엽기관지 수는 좌우가 다르며(3과 2), 구역기관지도 양쪽이 8로 같지 않습니다.","3":"엽기관지는 양쪽이 2가 아니고, 구역기관지도 양쪽이 10이 아닙니다.","4":"각 폐가 3엽·10구역인 것은 아니며, 왼쪽은 2엽·8구역입니다."},"one":"엽기관지는 우 3·좌 2, 구역기관지는 우 10·좌 8이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 21, 22","img":[{"u":"img/w11_resp_histo/p21.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 21"},{"u":"img/w11_resp_histo/p22.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 22"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-18":{"q":"As bronchi decrease in diameter, which wall change occurs?","o":["Cartilage, glands, and goblet cells increase, while smooth muscle decreases","Epithelial cell height increases, while elastic tissue disappears from the wall","Cartilage, glands, goblet cells, and cell height fall; muscle and elastin rise","Smooth muscle and elastic tissue vanish as soon as bronchi are formed","The epithelium changes abruptly into the mesothelium of the pleura"],"a":2,"qk":"기관지 지름이 작아질 때 벽에서 일어나는 변화는?","ok":["연골·샘·술잔세포는 늘고 평활근은 줄어든다","상피세포 높이는 커지고 탄력조직은 사라진다","연골·샘·술잔세포·상피 높이는 줄고, 평활근과 탄력조직은 늘어난다","기관지가 형성되는 순간 평활근과 탄력조직이 사라진다","상피가 갑자기 가슴막 중피로 바뀐다"],"exp":"기관지 지름이 작아지면 벽 성분도 체계적으로 변합니다.\n\n**감소**하는 것은 **연골의 양**, **샘의 수**, **술잔세포의 수**, **상피세포의 높이**입니다. 반대로 **상대적인 평활근**과 **탄력조직**은 **증가**합니다.\n\n이 경향이 이어져 세기관지(<1 mm)에서는 점막샘과 연골이 없어지고, 상피는 거짓중층섬모원주에서 단층원주, 단층입방으로 낮아집니다. 상대적 평활근·탄력섬유의 증가는 소기도 지름 조절과 날숨의 탄력 반동에 중요합니다.","why":{"0":"연골·샘·술잔세포는 지름이 작아질수록 줄고, 상대적 평활근은 늘어납니다.","1":"상피세포 높이는 낮아지고, 탄력조직은 사라지지 않고 상대적으로 늘어납니다.","3":"지름이 작아질수록 상대적 평활근과 탄력조직은 오히려 증가합니다.","4":"기관지 상피는 호흡상피에서 더 낮은 상피로 이행할 뿐, 가슴막 중피로 바뀌지 않습니다."},"one":"기관지가 가늘어지면 연골·샘·술잔세포·상피 높이는 줄고, 상대적 평활근과 탄력조직은 늘어난다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 23","img":[{"u":"img/w11_resp_histo/p23.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 23"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-19":{"q":"Club (Clara) cells of bronchioles perform all of the following functions EXCEPT:","o":["Secreting surfactant onto the bronchiolar surface","Detoxifying inhaled xenobiotic compounds using enzymes in the SER","Secreting antimicrobial peptides and cytokines","Serving as a stem-cell subpopulation that undergoes mitosis","Forming C-shaped hyaline cartilage plates in the bronchiolar wall"],"a":4,"qk":"세기관지의 클럽(클라라)세포가 하지 않는 기능은?","ok":["세기관지 표면에 표면활성제를 분비한다","활면서세망 효소로 흡입된 이물질(xenobiotics)을 해독한다","항균 펩타이드와 사이토카인을 분비한다","유사분열하는 줄기세포 아집단으로 작용한다","세기관지 벽에 C자 유리연골 판을 만든다"],"exp":"**세기관지(bronchioles)**는 기관지의 말단 가지로 지름이 **1 mm 미만**이며, **점막샘과 연골이 없습니다**. 상피는 거짓중층섬모원주에서 단층원주, 단층입방으로 이행합니다.\n\n**클럽세포(club cells, Clara cells)**는 외분비 세기관지 세포로, **표면활성제 분비**, 활면서세망(SER) 효소에 의한 **흡입 이물질 해독**, **항균 펩타이드와 사이토카인 분비**, 그리고 새 세포를 만드는 **줄기세포 아집단** 기능을 합니다. 세기관지에는 솔세포와 DNES 소과립세포도 있습니다.\n\n연골이 없는 것이 세기관지의 정의적 특징이므로, 클럽세포가 C자 연골 판을 만든다는 것은 틀린 설명입니다. 조직 절편에서 클럽세포는 내강 쪽으로 불룩한 세포(표지 C)로 보입니다.","why":{"0":"클럽세포는 표면활성제를 분비합니다. 이것은 이들이 하는 기능입니다.","1":"클럽세포의 SER 효소는 흡입된 이물질을 해독합니다.","2":"클럽세포는 항균 펩타이드와 사이토카인을 분비합니다.","3":"클럽세포의 일부는 유사분열하여 새 세포를 만드는 줄기세포입니다."},"one":"세기관지에는 연골과 점막샘이 없고, 클럽세포는 표면활성제·해독·항균·줄기세포 기능을 한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 24","img":[{"u":"img/w11_resp_histo/p24.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 24"},{"u":"img/w11_resp_histo/p27.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 27"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-20":{"q":"The histologic feature that distinguishes a respiratory bronchiole from a terminal bronchiole is the presence of:","o":["A complete loss of the surrounding muscle layer","Alveoli that open directly into its wall","C-shaped hyaline cartilage rings in the wall","A lining made entirely of type I pneumocytes","Mucosal glands in the lamina propria"],"a":1,"qk":"호흡세기관지를 종말세기관지와 구별하는 조직학적 특징은?","ok":["주위 근육층이 완전히 없어진다","벽에 폐포가 직접 열리는 것","벽에 C자 유리연골 고리가 있다","내벽 전체가 제1형 폐포세포로만 덮인다","고유층에 점막샘이 있다"],"exp":"**종말세기관지(terminal bronchioles)**는 세기관지 가운데 **가스 교환이 없는 가장 작은 가지**입니다. **호흡세기관지(respiratory bronchioles)**는 벽에 **폐포가 열려** 있어 전도부와 호흡부의 이행부입니다.\n\n**폐포관(alveolar ducts)**은 벽이 전적으로 폐포로 둘러싸이고, **폐포낭(alveolar sacs)**은 폐포관 끝에 있으며 폐포로 이루어집니다.\n\n현미경 비교에서 종말세기관지 쪽은 연속된 단층원주상피와 근육층을 보이고, 호흡세기관지는 벽에 폐포가 직접 열린 것이 보입니다. 근육층은 호흡세기관지에도 남아 있습니다.","why":{"0":"호흡세기관지에도 근육층이 남아 있으며, 근육층의 완전 소실이 구별점은 아닙니다.","2":"세기관지(종말·호흡 모두)에는 연골이 없습니다. C자 고리는 기관의 특징입니다.","3":"호흡세기관지 상피는 아직 세기관지 상피이며, 일부가 폐포로 열릴 뿐 전체가 제1형 세포인 것은 아닙니다.","4":"세기관지는 점막샘이 없습니다. 샘은 더 근위 기도의 특징입니다."},"one":"호흡세기관지는 벽에 폐포가 열리는 점이 종말세기관지와의 구별점이다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 25, 26","img":[{"u":"img/w11_resp_histo/p25.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 25"},{"u":"img/w11_resp_histo/p26.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 26"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-21":{"q":"Interalveolar septa that separate adjacent alveoli are formed of:","o":["Hyaline cartilage plates together with seromucous glands","Fibroblasts and a sparse ECM of reticular and elastic fibers","Dense irregular collagen together with skeletal muscle bundles","A complete smooth-muscle coat and club cells","Stratified squamous epithelium and a vocal ligament"],"a":1,"qk":"이웃한 폐포를 나누는 폐포사이중격(interalveolar septa)의 구성은?","ok":["유리연골 판과 장액점액샘","섬유모세포와 그물섬유·탄력섬유로 된 성긴 세포외기질","치밀 불규칙 교원질과 골격근 다발","완전한 평활근층과 클럽세포","중층편평상피와 성대인대"],"exp":"**폐포(alveoli)**는 지름 약 **200 µm**인 작은 공기주머니로, 호흡세기관지·폐포관·폐포낭에서 돌출하여 폐에 해면 구조를 줍니다. 성인 폐당 약 **2억 개**, 표면적은 약 **75 m²**입니다.\n\n폐포는 가스 교환을 위한 모세혈관그물에 둘러싸입니다. 이웃 폐포를 가르는 **폐포사이중격(interalveolar septa)**은 **섬유모세포(fibroblasts)**와 그물섬유·탄력섬유로 된 **성긴 세포외기질**로 이루어집니다. **작은 폐포구멍(alveolar pores)**이 이웃 폐포 사이의 공기 교통을 허용합니다.\n\n연골이나 샘, 골격근, 성대인대는 폐포중격의 구성이 아닙니다.","why":{"0":"유리연골과 장액점액샘은 기관·큰 기관지 벽의 특징이지 폐포중격의 구성이 아닙니다.","2":"폐포중격은 치밀 교원질과 골격근으로 이루어지지 않습니다.","3":"중격에 약간의 세포와 탄력·그물섬유가 있을 뿐, 완전한 평활근층과 클럽세포로 구성되지 않습니다.","4":"중층편평상피와 성대인대는 성대주름의 특징입니다."},"one":"폐포사이중격은 섬유모세포와 그물·탄력섬유의 성긴 기질이며, 작은 폐포구멍이 이웃 폐포를 잇는다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 28","img":[{"u":"img/w11_resp_histo/p28.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 28"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-22":{"q":"Type I alveolar cells (type I pneumocytes) are best described as:","o":["Cuboidal cells whose cytoplasm is filled with lamellar bodies of surfactant","Phagocytes confined to the connective tissue of the interalveolar septa","Ciliated columnar cells that form the lining of respiratory bronchioles","Very thin simple squamous cells (to 25 nm) that also pinocytose particles","Stem cells that rest on a basal lamina different from that of type II cells"],"a":3,"qk":"제1형 폐포세포(type I pneumocytes)를 가장 잘 설명한 것은?","ok":["표면활성제 층판소체로 가득 찬 입방세포","폐포사이중격에만 있는 탐식세포","호흡세기관지를 덮는 섬모원주세포","25 nm까지 얇은 단층편평세포로, 음세포작용으로 입자도 제거한다","제2형 세포와 다른 기저막 위에 있는 줄기세포"],"exp":"폐포 벽은 주로 **제1형 폐포세포(type I pneumocytes / type I alveolar cells)**로 구성됩니다. 이들은 극히 얇은 **단층편평세포(simple squamous cells)**로, 세포소기관은 핵 주위에 몰리고 나머지 세포질은 **25 nm**까지 얇아집니다. 이 얇음이 가스 확산을 돕습니다.\n\n또한 제1형 세포의 **음세포작용(pinocytosis)**이 표면활성제와 작은 입자 오염물의 일부 제거에 관여합니다.\n\n제2형 세포는 입방형이고 층판소체를 가지며, 같은 기저막·기원을 공유합니다. 폐포대식세포가 주된 탐식세포입니다.","why":{"0":"층판소체를 가진 입방세포는 제2형 폐포세포입니다.","1":"탐식은 주로 폐포대식세포(dust cells)의 역할이며, 이들은 폐포 안과 중격 모두에 있습니다.","2":"섬모원주세포는 더 근위 기도의 호흡상피 특징입니다.","4":"제1형과 제2형 세포는 같은 기저막 위에 있고 기원이 같으며, 제1형 세포를 줄기세포로 기술하지 않습니다."},"one":"제1형 폐포세포는 25 nm까지 얇은 단층편평세포이며, 음세포작용으로 표면활성제와 입자를 일부 제거한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 29","img":[{"u":"img/w11_resp_histo/p29.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 29"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-23":{"q":"Type II alveolar cells (type II pneumocytes):","o":["Are cuboidal, bulge into the air space, share type I origin, and have lamellar bodies","Are thin simple squamous cells that form most of the alveolar blood-air barrier itself","Are macrophages known as dust cells and occur only inside the alveolar lumen","Line the visceral pleura as a layer of simple squamous mesothelium","Form the fused basal lamina that belongs only to capillary endothelial cells"],"a":0,"qk":"제2형 폐포세포(type II pneumocytes)의 특징으로 옳은 것은?","ok":["입방형으로 공기 공간으로 불룩하고, 제1형과 기원을 공유하며 층판소체를 가진다","혈액-공기 장벽의 대부분을 이루는 얇은 단층편평세포이다","먼지세포라 불리는 대식세포이며 폐포 내강에만 있다","내장가슴막을 단층편평 중피로 덮는다","모세혈관 내피세포만의 융합 기저막을 만든다"],"exp":"**제2형 폐포세포(type II alveolar cells / type II pneumocytes)**는 더 **입방형**이며 폐포 공기 공간으로 **불룩** 나옵니다. 제1형 세포와 **같은 기저막** 위에 있고 **기원이 같습니다**.\n\n세포질에는 **층판소체(lamellar bodies)**가 있으며, 여기의 지질·인지질·단백질이 **폐표면활성제(pulmonary surfactant)**를 이룹니다. 표면활성제는 폐포낭의 **표면장력을 낮추어** 허탈을 막는 데 기여합니다. 합성 경로에는 포스파티딜콜린 합성과 골지를 경유한 층판소체 성숙이 포함됩니다.\n\n**폐포대식세포(alveolar macrophages, dust cells)**는 이와 별개인 탐식세포로, 폐포 안과 폐포사이중격 모두에 있습니다.","why":{"1":"얇은 단층편평세포로 장벽의 대부분을 이루는 것은 제1형 폐포세포입니다.","2":"먼지세포는 폐포대식세포이며, 폐포 안과 중격 모두에 있고 제2형 세포가 아닙니다.","3":"내장가슴막 lining은 중피이지 제2형 폐포세포가 아닙니다.","4":"융합 기저막은 제1형 세포와 내피세포의 기저막이 합쳐진 것이며, 제2형 세포만의 구조가 아닙니다."},"one":"제2형 세포는 입방형이며 층판소체에서 표면활성제를 만들고, 제1형과 기저막·기원을 공유한다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 30, 31","img":[{"u":"img/w11_resp_histo/p30.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 30"},{"u":"img/w11_resp_histo/p31.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 31"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-24":{"q":"From alveolar air to capillary blood, the blood-air barrier includes which of the following layers?","o":["Type II cell cytoplasm, a thick unfused basal lamina, and a club-cell sheet","Alveolar macrophage cytoplasm, elastic fibers, and a surrounding pericyte layer","Ciliated epithelium, a submucosal gland, and a coat of arteriolar smooth muscle","Type I cell membranes alone, without any endothelial contribution","Type I alveolar cell, fused basal laminae, and endothelium (plus surfactant)"],"a":4,"qk":"폐포 공기에서 모세혈관 혈액까지, 혈액-공기 장벽(blood-air barrier)에 포함되는 층은?","ok":["제2형 세포 세포질, 두껍고 융합되지 않은 기저막, 클럽세포 층","폐포대식세포 세포질, 탄력섬유, 혈관둘레세포 층","섬모상피, 점막밑샘, 세동맥 평활근","내피 기여 없이 제1형 세포막만","제1형 폐포세포, 융합 기저막, 내피(그리고 표면활성제)"],"exp":"폐포에서 O2와 CO2가 교환되려면 두 기체가 **혈액-공기 장벽(blood-air barrier)**을 지나야 합니다. 이 장벽은 다음으로 구성됩니다.\n\n① **제1형 폐포세포**의 세포막과 세포질, ② 제1형 세포와 내피세포의 **융합 기저막(fused basal lamina)**, ③ **내피세포**의 세포막과 세포질입니다. 여기에 폐포 내면의 **표면활성제 층**을 더할 수 있습니다.\n\n전자현미경에서 폐포(A)와 모세혈관(C) 사이에 제1형 세포(I), 융합 기저막(B), 내피세포(E)가 보입니다. 제2형 세포·대식세포·섬모상피·샘은 이 얇은 확산 장벽의 구성층이 아닙니다.","why":{"0":"장벽의 상피 성분은 제1형 세포이며, 기저막은 두꺼운 비융합층이 아니라 융합 기저막입니다.","1":"대식세포와 탄력섬유, 혈관둘레세포는 혈액-공기 장벽의 세 층으로 열거되지 않습니다.","2":"섬모상피, 점막밑샘, 세동맥 평활근은 근위 기도 벽의 구조입니다.","3":"장벽에는 반드시 내피세포의 세포막과 세포질이 포함됩니다."},"one":"혈액-공기 장벽은 제1형 폐포세포, 융합 기저막, 내피세포이며, 표면활성제 층을 더할 수 있다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 32","img":[{"u":"img/w11_resp_histo/p32.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 32"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-25":{"q":"Most of the blood supplied by the bronchial arteries leaves the lungs by way of the:","o":["Bronchial veins that drain the entire lung parenchyma","Azygos vein exclusively, without any pulmonary venous return","Pulmonary veins returning blood toward the left atrium","Thoracic duct carrying lymph to the venous angle","Superior vena cava directly from the alveolar capillary bed"],"a":2,"qk":"기관지동맥이 공급한 혈액의 대부분은 폐를 어떤 경로로 떠나는가?","ok":["폐 실질 전체를 받는 기관지정맥","허파정맥 환류 없이 홀정맥만","좌심방 쪽으로 혈액을 되돌리는 허파정맥","가슴관(thoracic duct)","폐포 모세혈관에서 위대정맥으로 직접"],"exp":"**기관지순환(bronchial circulation)**에서 기관지동맥은 대동맥에서 나오는 가는 가지로, 기관지 나무를 따라가며 기관지·세기관지 벽과 폐 결합조직에 영양혈을 공급합니다. 전도부와 호흡부의 이행 부위에서 폐혈관과 문합합니다.\n\n중요한 점은 **기관지정맥은 폐문 부위 결합조직만** 배액하고, 기관지동맥으로 들어온 혈액의 **대부분은 허파정맥(pulmonary veins)**을 통해 폐를 떠난다는 것입니다.\n\n따라서 좌심방으로 돌아가는 허파정맥혈에는 소량의 기관지동맥 혈(전신 동맥혈)이 섞입니다.","why":{"0":"기관지정맥은 폐 실질 전체가 아니라 폐문 부위 결합조직만 배액합니다.","1":"홀정맥은 뒤갈비사이정맥 등의 가슴 정맥계이며, 기관지동맥 혈의 주된 출로로 기술되지 않았습니다.","3":"가슴관은 림프 통로이지 기관지동맥 혈의 출로가 아닙니다.","4":"폐포 모세혈관의 혈액은 허파정맥으로 좌심방에 들어가며, 위대정맥으로 직접 가지 않습니다."},"one":"기관지동맥 혈의 대부분은 허파정맥으로 나가며, 기관지정맥은 폐문 결합조직만 받는다.","src":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33","img":[{"u":"img/w11_resp_histo/p33.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 33"},{"u":"img/w11_resp_histo/p34.webp","cap":"13 - Histology of the Respiratory System 2024-2025 CANVAS.pdf, slide 34"}],"ch":"w11_resp_histo","chn":"Histology of the Respiratory System","week":11},"w11_resp_histo-26":{"q":"Which statement about the pulmonary circulation is correct?","o":["Pulmonary venules travel in the same connective-tissue sheath as the bronchioles","Pulmonary arteries arise as tiny direct branches of the thoracic aorta","Capillary networks first appear around the walls of terminal bronchioles","Bronchial arteries never accompany the branches of the bronchial tree","Arterial branching follows the bronchi; pulmonary venules travel separately"],"a":4,"qk":"폐순환(pulmonary circulation)에 대한 설명으로 옳은 것은?","ok":["허파세정맥은 세기관지와 같은 집 안에서 주행한다","허파동맥은 대동맥에서 직접 나오는 가는 가지이다","모세혈관그물은 종말세기관지 주위에서 처음 나타난다","기관지동맥은 기관지 나무를 따라가지 않는다","동맥 분지는 기관지를 따르고, 허파세정맥은 따로 주행한다"],"exp":"**폐순환(pulmonary circulation)**에서 허파동맥의 분지는 **기관지와 같은 분지 양식**을 따릅니다. **폐포관** 수준에서 허파세동맥이 폐포를 둘러싼 촘촘한 모세혈관그물을
