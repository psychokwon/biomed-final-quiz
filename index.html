le-shaped, from breakdown of eosinophils)","Rust-colored sputum with lobar consolidation","Sulfur granules and Gram-positive cocci","Asbestos bodies"],"a":1,"qk":"천식에서 보이는 객담(sputum) 소견은?","ok":["항산성 간균","쿠르슈만 나선(Curschmann spirals; 점액 마개, 작은 기관지의 원주형)과 샤르코-라이덴 결정(Charcot-Leyden crystals; 바늘 모양, 호산구 분해 산물)","대엽 경화를 동반한 녹슨색 객담","황색 과립과 그람양성 알균","석면 소체"],"exp":"천식의 증상: **가슴 답답함(chest tightness)**, **호흡곤란(dyspnea, 숨쉬기 어려움)**, **쌕쌕거림(wheezing, 높은 음의 휘파람 소리)**, **기침(coughing)**.\n\n객담(sputum) 소견:\n- **쿠르슈만 나선(Curschmann spirals)**: **점액 마개(mucus plugs)**, **작은 기관지의 원주형(casts from small bronchi)**. 공기 교환과 약물 전달을 막아 **위험**합니다.\n- **샤르코-라이덴 결정(Charcot-Leyden crystals)**: **바늘 모양(needle-shaped)**, **호산구(eosinophils)의 분해**로 생김","why":{"0":"항산성 간균은 천식 소견이 아닙니다.","2":"녹슨색 객담은 천식 소견으로 제시되지 않습니다.","3":"황색 과립과 그람양성 알균은 천식 객담 소견으로 제시되지 않습니다.","4":"석면 소체는 천식 소견이 아닙니다."},"one":"천식 객담: 쿠르슈만 나선(점액 마개)과 샤르코-라이덴 결정(호산구 분해, 바늘 모양).","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 14","img":[{"u":"img/w12_asthma/p14.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 14"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-11":{"q":"Asthma is classified according to several measures. Which two measure the amount of obstruction?","o":["AHI and Epworth score","Frequency of night-time symptoms and medication use","Hematocrit and white cell count","Mallampati score and neck circumference","FEV1 (forced expiratory volume in 1 second) and PEFR (peak expiratory flow rate)"],"a":4,"qk":"천식은 여러 지표로 분류된다. 그중 폐쇄 정도(amount of obstruction)를 측정하는 두 가지는?","ok":["AHI와 엡워스 점수","야간 증상 빈도와 약물 사용 빈도","적혈구용적률과 백혈구 수","말람파티 점수와 목둘레","FEV1(1초간 강제호기량)과 PEFR(최대호기유량)"],"exp":"**천식의 분류 기준**:\n- **증상의 빈도(frequency of symptoms)**: 야간, 이른 아침\n- **FEV1**: 1초간 강제호기량(forced expiratory volume in 1 second)\n- **PEFR**: 최대호기유량(peak expiratory flow rate)\n- **약물 사용 빈도(frequency of medication use)**\n\n이 중 **FEV1과 PEFR이 폐쇄 정도(amount of obstruction)를 측정**합니다.\n\n**유형(types)**: **간헐성(intermittent) → 경증 지속성(mild persistent) → 중등도 지속성(moderate persistent) → 중증 지속성(severe persistent)**","why":{"0":"AHI와 엡워스 점수는 수면무호흡 지표입니다.","1":"증상·약물 사용 빈도도 분류 기준이지만 폐쇄 정도를 직접 측정하지는 않습니다.","2":"혈액 검사 수치는 천식 분류 기준이 아닙니다.","3":"말람파티 점수와 목둘레는 OSA 선별 지표입니다."},"one":"천식 분류에서 FEV1과 PEFR이 폐쇄 정도를 재며, 유형은 간헐성→경증·중등도·중증 지속성이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 15","img":[{"u":"img/w12_asthma/p15.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 15"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-12":{"q":"In treating asthma, what do bronchodilators do, and which drugs are listed for very severe asthma?","o":["Increase eosinophils; leukotriene agonists","Constrict smooth muscle; antibiotics only","Thicken mucus; aspirin and NSAIDs","Relax smooth muscle to dilate the airway; intravenous corticosteroids, magnesium sulfate, and oxygen therapy","Block oxygen uptake; beta blockers"],"a":3,"qk":"천식 치료에서 기관지확장제(bronchodilators)는 무엇을 하며, 매우 중증(very severe) 천식에 제시된 약물은?","ok":["호산구를 늘린다; 류코트리엔 작용제","평활근을 수축시킨다; 항생제만","점액을 진하게 한다; 아스피린과 NSAIDs","평활근을 이완시켜 기도를 넓힌다; 정맥 코르티코스테로이드, 황산마그네슘, 산소 치료","산소 흡수를 막는다; 베타차단제"],"exp":"천식 **치료(treatment)**의 목표는 **증상을 관리하고 발작을 피하는 것**입니다.\n\n- **유발 요인 접촉 피하기**: 진공청소기 사용, 카펫·러그 제거, 환경 바꾸기(예: 방을 건조하게)\n- **약물**:\n  - **기관지확장제(bronchodilators)**: 짧게 작용하는 베타아드레날린수용체 작용제(short-acting beta-adrenoceptor agonists), 항콜린제(anticholinergics). **평활근을 이완시켜 기도를 넓힘(dilated)**\n  - **중증(severe)**: 매일 코르티코스테로이드, 길게 작용하는 베타아드레날린수용체 작용제(LABA), 류코트리엔 길항제(leukotriene antagonists)\n  - **매우 중증(very severe)**: **정맥 코르티코스테로이드(IV corticosteroids), 황산마그네슘(magnesium sulfate), 산소 치료(oxygen therapy)**","why":{"0":"중증 천식에 쓰는 것은 류코트리엔 길항제(antagonists)입니다.","1":"기관지확장제는 평활근을 이완시키며, 항생제는 제시되지 않습니다.","2":"아스피린과 NSAIDs는 오히려 천식 환자에게 피해야 할 약물입니다.","4":"베타차단제는 천식을 유발하는 약물로 제시됩니다."},"one":"기관지확장제는 평활근을 이완시켜 기도를 넓히고, 매우 중증 천식에는 정맥 스테로이드·황산마그네슘·산소를 쓴다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 16, 17","img":[{"u":"img/w12_asthma/p16.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 16"},{"u":"img/w12_asthma/p17.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 17"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-13":{"q":"What is status asthmaticus?","o":["Asthma that only occurs during exercise","Life-threatening respiratory failure from frequent acute exacerbations","Snoring during sleep","A normal FEV1 with no symptoms","Infrequent, mild symptoms with minimal functional limitation"],"a":1,"qk":"천식지속상태(status asthmaticus)란 무엇인가?","ok":["운동할 때만 생기는 천식","잦은 급성 악화로 인한 생명을 위협하는 호흡부전","수면 중 코골이","증상 없이 FEV1이 정상인 상태","기능 제한이 거의 없는 드물고 가벼운 증상"],"exp":"천식의 **임상 양상(clinical manifestations)**은 스펙트럼입니다.\n\n- **드물고 가벼운 증상(infrequent & mild symptoms)** → 기능 제한이 거의 없음\n- **잦은 급성 악화(frequent acute exacerbations)** → 기능적 능력이 크게 떨어지고, **생명을 위협하는 호흡부전(life-threatening respiratory failure)**, 즉 **천식지속상태(status asthmaticus)**까지 갈 수 있음","why":{"0":"운동 유발은 천식지속상태의 정의가 아닙니다.","2":"코골이는 수면무호흡과 관련됩니다.","3":"정상 FEV1과 무증상은 천식지속상태가 아닙니다.","4":"드물고 가벼운 증상은 스펙트럼의 반대쪽 끝입니다."},"one":"천식지속상태(status asthmaticus)는 생명을 위협하는 호흡부전이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 19","img":[{"u":"img/w12_asthma/p19.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 19"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-14":{"q":"In the ABCDE assessment of an asthma patient who is unstable, what should be done?","o":["Start elective dental treatment immediately","Send the patient home with advice","Stabilize airway, breathing, and circulation; obtain IV access; and provide continuous vital sign monitoring (HR and BP)","Give beta blockers","Lay the patient fully flat and leave the room"],"a":2,"qk":"천식 환자의 ABCDE 평가에서 불안정(unstable)하다면 무엇을 해야 하는가?","ok":["즉시 선택적 치과 치료를 시작한다","조언만 하고 집에 보낸다","기도·호흡·순환을 안정시키고, 정맥로를 확보하며, 활력징후(심박수·혈압)를 지속 감시한다","베타차단제를 투여한다","환자를 완전히 눕히고 자리를 뜬다"],"exp":"**ABCDE 평가(ABCDE assessment)** 결과가 **불안정(unstable)**하면:\n- **기도·호흡·순환(airway, breathing, circulation) 안정화**\n- **정맥로(IV access) 확보**\n- **활력징후 지속 감시(continuous vital sign monitoring)**: 심박수(HR)와 혈압(BP)\n\n이후 평가는 **집중 병력·신체검사(focused H&P)**, **동맥혈가스(ABG)**, **폐활량측정의 최대호기유량(spirometry: PEF)**, **맥박산소측정(pulse oximetry)**입니다.\n\n- **병력(Hx)**: 숨참, 기침, 가슴 답답함\n- **신체검사(PE)**: **빠른호흡(tachypnea)**, **보조 흡기근 사용(use of accessory inspiratory muscles)**, 청진상 **양측 쌕쌕거림(bilateral wheezing)**, **호흡음 감소 또는 소실**","why":{"0":"불안정 상태에서 선택적 치료는 하지 않습니다.","1":"불안정한 환자는 즉시 안정화가 필요합니다.","3":"베타차단제는 천식 유발 약물입니다.","4":"환자를 방치하면 안 되며, 지속 감시가 필요합니다."},"one":"불안정한 천식 환자: ABC 안정화, 정맥로 확보, 활력징후 지속 감시.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 20, 21","img":[{"u":"img/w12_asthma/p20.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 20"},{"u":"img/w12_asthma/p21.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 21"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-15":{"q":"In the basic pathophysiology of asthma, what follows airway inflammation and leads to narrow breathing passages?","o":["Hypersecretion of mucus, airway muscle constriction, and swelling of bronchial membranes","Upper airway collapse during sleep","Alveolar collapse and surfactant loss","Increased lung compliance and air trapping only","Pleural effusion and rib fracture"],"a":0,"qk":"천식의 기본 병태생리에서 기도 염증 다음에 와서 좁은 호흡 통로로 이어지는 것은?","ok":["점액 과분비, 기도 근육 수축, 기관지 막의 부종","수면 중 상기도 허탈","폐포 허탈과 표면활성제 소실","폐 순응도 증가와 공기 갇힘만","가슴막삼출과 갈비뼈 골절"],"exp":"**천식의 기본 병태생리(basic pathophysiology of asthma)**(별표 항목) 흐름도:\n\n1. **유발 요인(trigger factor)**\n2. **기도 염증(airway inflammation)**\n3. 세 갈래: **점액 과분비(hypersecretion of mucus)**, **기도 근육 수축(airway muscle constriction)**, **기관지 막의 부종(swelling bronchial membranes)**\n4. **좁은 호흡 통로(narrow breathing passages)**\n5. **쌕쌕거림, 기침, 숨참, 가슴 답답함**\n\n주석: **유전과 환경 요인**이 염증의 **시작과 지속** 모두에 중요합니다.","why":{"1":"수면 중 상기도 허탈은 OSA의 기전입니다.","2":"폐포 허탈과 표면활성제 소실은 천식 병태생리 흐름도에 없습니다.","3":"흐름도의 세 갈래는 점액 과분비, 근육 수축, 기관지 막 부종입니다.","4":"가슴막삼출과 갈비뼈 골절은 관계없습니다."},"one":"천식: 유발 요인 → 기도 염증 → 점액 과분비·근육 수축·막 부종 → 좁은 기도 → 쌕쌕거림·기침·숨참·가슴 답답함.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 18","img":[{"u":"img/w12_asthma/p18.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 18"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-16":{"q":"Asthma is a variable disease. Which is listed as complicating risk factors and disease processes?","o":["Smoking, exposure to smoke or irritants, comorbidities, and prior asthma exacerbations in the past year","Only genetic factors","Regular exercise with proper medication","High-protein diet","Only age over 65"],"a":0,"qk":"천식은 변하는 질환(variable disease)이다. 상황을 복잡하게 만드는 위험인자와 질환 과정으로 제시된 것은?","ok":["흡연, 연기나 자극물 노출, 동반질환, 지난 1년 내 천식 악화 병력","유전 요인만","적절한 약물과 함께하는 규칙적인 운동","고단백 식사","65세 이상 나이만"],"exp":"**천식은 변하는 질환(variable disease)**입니다.\n- **환경 변수(environmental variables)**에 의해 유발되고\n- **위험인자와 질환 과정**으로 복잡해지며: **흡연(smoking)**, **연기나 자극물 노출(exposure to smoke or irritants)**, **동반질환(comorbidities)**, **지난 1년 내 천식 악화(prior asthma exacerbations in past year)**\n- 시간에 따라 **악화되거나(decompensate) 좋아질(improve) 수 있습니다**.","why":{"1":"유전 요인만이 아니라 환경·동반질환·과거 악화 등이 함께 작용합니다.","2":"적절한 약물과 함께하는 운동은 건강한 활동으로 권장됩니다.","3":"고단백 식사는 불안을 줄이는 조언으로 나오며 위험인자가 아닙니다.","4":"나이는 이 목록의 위험인자로 제시되지 않습니다."},"one":"천식은 환경으로 유발되고 흡연·연기·동반질환·지난 1년 내 악화로 복잡해지며, 시간에 따라 악화되거나 좋아진다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 22","img":[{"u":"img/w12_asthma/p22.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 22"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-17":{"q":"Which medications are listed among the triggering substances for asthma?","o":["Montelukast and salmeterol","Magnesium sulfate and oxygen","Aspirin and beta blockers","Fluoride and chlorhexidine","Albuterol and fluticasone"],"a":2,"qk":"천식을 유발하는 물질(triggering substances) 중 약물로 제시된 것은?","ok":["몬테루카스트와 살메테롤","황산마그네슘과 산소","아스피린(aspirin)과 베타차단제(beta blockers)","불소와 클로르헥시딘","알부테롤과 플루티카손"],"exp":"**유발 물질(triggering substances)**은 세 묶음입니다.\n- **대기오염(air pollution)**: 담배 연기, 자동차 배기가스\n- **알레르겐(allergens)**: 먼지, 반려동물, 바퀴벌레, 곰팡이\n- **약물(medications)**: **아스피린(aspirin)**과 **베타차단제(beta blockers)**\n\n그래서 천식 환자에게는 아스피린이 든 약과 NSAIDs를 피해야 합니다.","why":{"0":"몬테루카스트와 살메테롤은 천식 조절제입니다.","1":"황산마그네슘과 산소는 매우 중증 천식의 치료입니다.","3":"불소와 클로르헥시딘은 유발 약물로 제시되지 않습니다.","4":"알부테롤과 플루티카손은 천식 치료제입니다."},"one":"천식 유발 약물은 아스피린과 베타차단제이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 23","img":[{"u":"img/w12_asthma/p23.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 23"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-18":{"q":"What does a \"trigger\" do in asthma, and which is a recommended way to deal with triggers?","o":["It relaxes smooth muscle; inhale it daily","It makes symptoms start or get worse; know your triggers and stay away, and always have medication","It only affects adults; ignore it in children","It cures asthma; seek triggers out to build tolerance","It only acts in summer; avoid ice cream"],"a":1,"qk":"천식에서 \"유발 요인(trigger)\"은 무엇을 하며, 유발 요인에 대처하는 권장 방법은?","ok":["평활근을 이완시킨다; 매일 흡입한다","증상을 시작시키거나 악화시킨다; 유발 요인을 알고 멀리하며, 항상 약을 지닌다","성인에게만 작용한다; 소아에서는 무시한다","천식을 치료한다; 내성을 기르기 위해 찾아다닌다","여름에만 작용한다; 아이스크림을 피한다"],"exp":"**유발 요인(trigger)**은 **증상을 시작시키거나 악화시키는 것**입니다.\n\n예: **담배 연기**(옷과 가구에 배어 있을 수 있음), 먼지, 반려동물, 바퀴벌레, 곰팡이, 향수, 청소용품, **찬 공기, 꽃가루, 감기(cold)**, 대기오염, 풀. 감기는 **나으면 좋아집니다**.\n\n대처:\n- **유발 요인을 알고 멀리하기(know & stay away)**\n- **항상 약을 지니기(always have medication)**\n- **대기오염이 심한 날은 실내에 머물기**, 시동 걸린 차나 버스 가까이 서 있지 않기\n- **운동이나 스포츠**는 건강의 중요한 부분이며, **알맞은 약과 함께라면** 활동적인 삶이 가능","why":{"0":"평활근을 이완시키는 것은 기관지확장제입니다.","2":"유발 요인은 소아에게도 작용합니다.","3":"유발 요인은 증상을 악화시키므로 피해야 합니다.","4":"찬 공기 등 다양한 요인이 있으며 여름에만 작용하는 것이 아닙니다."},"one":"유발 요인은 증상을 시작·악화시키므로 알고 피하며, 항상 약을 지니고, 오염이 심한 날은 실내에 머문다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 24, 25, 26, 27","img":[{"u":"img/w12_asthma/p24.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 24"},{"u":"img/w12_asthma/p25.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 25"},{"u":"img/w12_asthma/p26.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 26"},{"u":"img/w12_asthma/p27.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 27"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-19":{"q":"How do asthma relievers differ from controllers?","o":["Relievers are used every day; controllers are only for emergencies.","Controllers work in minutes; relievers take weeks.","Relievers reduce mucus; controllers relax muscles.","Relievers (rescue inhalers) work in minutes and relax muscles; controllers reduce mucus and swelling, are used every day, and over time make the lungs healthier.","Both are antibiotics."],"a":3,"qk":"천식의 완화제(relievers)와 조절제(controllers)는 어떻게 다른가?","ok":["완화제는 매일 쓰고, 조절제는 응급 때만 쓴다.","조절제는 몇 분 안에 작용하고, 완화제는 몇 주가 걸린다.","완화제는 점액을 줄이고, 조절제는 근육을 이완시킨다.","완화제(구조 흡입기)는 몇 분 안에 작용해 근육을 이완시키고, 조절제는 점액과 부종을 줄이며 매일 쓰고 시간이 지나면 폐를 더 건강하게 한다.","둘 다 항생제이다."],"exp":"천식 **약물(medication)**은 두 종류입니다.\n\n- **완화제(relievers)**: **바로 도움(helps right away)**. **구조 흡입기(rescue inhalers)**라고도 하며, **몇 분 안에 작용**하고 **근육을 이완**시킵니다. **항상 지니고 다녀야** 합니다.\n- **조절제(controllers)**: **점액과 부종을 줄이고**, **매일 사용**하며, **시간이 지나면 폐를 더 건강하게** 만듭니다.","why":{"0":"반대입니다. 조절제를 매일 쓰고, 완화제는 필요할 때 바로 씁니다.","1":"몇 분 안에 작용하는 것은 완화제입니다.","2":"반대입니다. 완화제가 근육을 이완시키고, 조절제가 점액과 부종을 줄입니다.","4":"둘 다 항생제가 아닙니다."},"one":"완화제는 몇 분 안에 근육을 이완시키는 구조 흡입기이고, 조절제는 매일 써서 점액·부종을 줄인다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 29","img":[{"u":"img/w12_asthma/p29.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 29"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-20":{"q":"What is the purpose of a spacer and of a nebulizer?","o":["A spacer measures FEV1; a nebulizer measures oxygen saturation.","Both are used only in adults.","A spacer holds the jaw forward; a nebulizer delivers CPAP.","A spacer is a rescue drug; a nebulizer is a controller drug.","A spacer helps children get medication deep into the lungs; a nebulizer turns liquid into a fine mist for young kids and babies."],"a":4,"qk":"스페이서(spacer)와 네뷸라이저(nebulizer)의 목적은?","ok":["스페이서는 FEV1을 재고, 네뷸라이저는 산소포화도를 잰다.","둘 다 성인에게만 쓴다.","스페이서는 턱을 앞으로 잡아 주고, 네뷸라이저는 CPAP를 준다.","스페이서는 구조약이고, 네뷸라이저는 조절약이다.","스페이서는 소아가 약을 폐 깊숙이 들이마시도록 돕고, 네뷸라이저는 어린아이와 영아를 위해 액체를 미세한 안개로 바꾼다."],"exp":"흡입약 전달 보조 기구:\n\n- **스페이서(spacer)**: 흡입기(inhaler)에 연결해 쓰며, **소아(for children)**가 **약을 폐 깊숙이 들이마시도록 돕습니다**.\n- **네뷸라이저(nebulizer)**: **어린아이와 영아(young kids & babies)**용으로, **액체를 미세한 안개(fine mist)로 바꿉니다**.","why":{"0":"스페이서와 네뷸라이저는 측정 기구가 아니라 약물 전달 보조 기구입니다.","1":"스페이서는 소아, 네뷸라이저는 어린아이·영아용으로 제시됩니다.","2":"턱을 잡아 주는 것은 수면무호흡용 구강장치이고, CPAP는 별도 장비입니다.","3":"둘 다 약이 아니라 기구입니다."},"one":"스페이서는 소아의 약을 폐 깊이 보내고, 네뷸라이저는 액체를 미세 안개로 바꿔 어린아이·영아에게 쓴다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 30","img":[{"u":"img/w12_asthma/p30.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 30"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-21":{"q":"The primary goal with a dental patient who has asthma is to prevent an attack during the procedure. Which is part of keeping the patient well controlled?","o":["Give aspirin for postoperative pain","Give high-flow O2 (15 L/min) to every patient","Keep the inhaler and EpiPen at home","Avoid NSAIDs, avoid narcotics and barbiturates, use a pulse oximeter, and give low-flow O2 (2 L/min) if oxygen saturation is <95%","Skip stress management"],"a":3,"qk":"천식이 있는 치과 환자에서 일차 목표는 시술 중 발작을 막는 것이다. 환자를 잘 조절된(well controlled) 상태로 유지하는 데 해당하는 것은?","ok":["수술 후 통증에 아스피린을 준다","모든 환자에게 고유량 O2(15 L/min)를 준다","흡입기와 에피펜(EpiPen)은 집에 둔다","NSAIDs를 피하고, 마약성 진통제와 바르비투르산염을 피하며, 맥박산소측정기를 쓰고, 산소포화도가 95% 미만이면 저유량 O2(2 L/min)를 준다","스트레스 관리는 생략한다"],"exp":"치과 환자에서의 **일차 목표(primary goal)**: **시술 중 천식 발작을 막는 것**. 환자는 **잘 조절된(well controlled)** 상태여야 합니다.\n\n- **스트레스 관리(stress management)**\n- **적절한 약 복용 확인(confirm proper medication)**\n- **흡입기와 에피펜(EpiPen) 준비**\n- **철저한 격리(excellent isolation)**\n- **NSAIDs 피하기**\n- **마약성 진통제와 바르비투르산염 피하기(avoid narcotics and barbiturates)**\n- **맥박산소측정기 사용(use pulse oximeter)**\n- **산소포화도 <95%이면 저유량 O2(2 L/min)**","why":{"0":"아스피린은 천식 유발 약물이므로 피해야 합니다.","1":"기준은 산소포화도 95% 미만일 때 저유량 2 L/min입니다.","2":"흡입기와 에피펜은 진료실에 준비해 두어야 합니다.","4":"스트레스 관리는 목록의 첫 항목입니다."},"one":"천식 환자 진료: 스트레스 관리, 약 복용 확인, 흡입기·에피펜 준비, NSAIDs·마약성 진통제·바르비투르산염 회피, 맥박산소측정, SpO2 <95%면 O2 2 L/min.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 31","img":[{"u":"img/w12_asthma/p31.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 31"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-22":{"q":"Which is listed among the oral manifestations of asthma?","o":["Dry mouth due to inhalers, caries, and oral candidiasis","Macrodontia","Black hairy tongue only","Gingival hyperplasia due to phenytoin","Hypersalivation and sialorrhea"],"a":0,"qk":"천식의 구강 증상(oral manifestations)으로 제시된 것은?","ok":["흡입기로 인한 입마름, 충치, 구강 칸디다증","거대치","흑모설만","페니토인으로 인한 잇몸 증식","침 과다 분비와 침흘림"],"exp":"**천식의 구강 증상(oral manifestations of asthma)**:\n- **흡입기로 인한 입마름(dry mouth due to inhalers)**\n- **충치(caries)**\n- 위식도역류(GERD)\n- **구강 칸디다증(oral candidiasis)**\n- 법랑질 결함(enamel defects)\n- 치주질환(periodontal disease)\n- 구강 호흡과 관련된 **높은 부정교합(malocclusion)** 비율(과도한 수평피개, 구치부 반대교합, 높은 입천장)","why":{"1":"거대치는 목록에 없습니다.","2":"흑모설은 목록에 없습니다.","3":"페니토인 잇몸 증식은 천식 증상이 아닙니다.","4":"천식에서는 침 과다가 아니라 입마름이 문제입니다."},"one":"천식의 구강 증상: 흡입기로 인한 입마름, 충치, 위식도역류, 칸디다증, 법랑질 결함, 치주질환, 부정교합.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 32","img":[{"u":"img/w12_asthma/p32.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 32"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-23":{"q":"Asthmatic mouth breathers have higher rates of malocclusion. Which features are listed?","o":["Diastema and microdontia","Increased overjet, overbite, posterior crossbite, and high palatal vault","Class III malocclusion and a low palatal vault","Anterior open bite only, with a flat palate","Ankylosis and impaction"],"a":1,"qk":"천식이 있는 구강 호흡자(mouth breathers)는 부정교합 비율이 높다. 제시된 특징은?","ok":["치간이개와 왜소치","수평피개(overjet)·수직피개(overbite) 증가, 구치부 반대교합(posterior crossbite), 높은 입천장(high palatal vault)","3급 부정교합과 낮은 입천장","전치부 개방교합만, 평평한 입천장","유착과 매복"],"exp":"또 다른 위험: **구강 호흡자(mouth breathers)**는 **부정교합(malocclusion) 비율이 높습니다**.\n\n- **수평피개 증가(increased overjet)**\n- **수직피개 증가(overbite)**\n- **구치부 반대교합(posterior crossbite)**\n- **높은 입천장(high palatal vault)**","why":{"0":"치간이개와 왜소치는 제시되지 않습니다.","2":"3급 부정교합은 제시되지 않고, 입천장은 높습니다.","3":"개방교합과 평평한 입천장은 제시되지 않으며, 오히려 높은 입천장입니다.","4":"유착과 매복은 제시되지 않습니다."},"one":"천식 구강 호흡자는 수평·수직피개 증가, 구치부 반대교합, 높은 입천장이 많다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 33","img":[{"u":"img/w12_asthma/p33.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 33"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-24":{"q":"Anxiety can exacerbate asthma symptoms. What is the most important factor in overcoming dental anxiety?","o":["Giving the patient caffeine before the visit","Avoiding all conversation","Good dentist-patient communication","Eating sugary foods before the appointment","Long appointments with the mouth open"],"a":2,"qk":"불안은 천식 증상을 악화시킬 수 있다. 치과 불안을 극복하는 데 가장 중요한 요인은?","ok":["진료 전 카페인 섭취","모든 대화를 피하기","좋은 치과의사-환자 의사소통","진료 전 단 음식 섭취","입을 벌린 채 긴 진료"],"exp":"**불안(anxiety)은 천식 증상을 악화시킬 수 있습니다.** 치과의사와 치과위생사는 불안 징후나 스트레스 지표를 보이는 성인 천식 환자에게 진료 전·중에 주의를 기울여야 합니다.\n\n**천식과 불안**(별표 항목):\n- **치과 불안을 극복하는 데 가장 중요한 요인은 좋은 치과의사-환자 의사소통(good dentist-patient communication)**\n- 환자에게 진료 중 **규칙적이고 천천히 숨쉬기**에 집중하게 함\n- 진료 전 **카페인과 단 음식 피하기**\n- **고단백 음식**은 진정 효과가 있음","why":{"0":"진료 전에는 카페인을 피하게 합니다.","1":"의사소통이 가장 중요한 요인입니다.","3":"진료 전 단 음식은 피하게 합니다.","4":"긴 진료는 불안 극복 방법으로 제시되지 않으며, 가장 중요한 요인은 의사소통입니다."},"one":"치과 불안 극복의 가장 중요한 요인은 좋은 의사소통이며, 천천히 숨쉬기·카페인과 단 음식 피하기·고단백 음식이 도움이 된다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 34, 35","img":[{"u":"img/w12_asthma/p34.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 34"},{"u":"img/w12_asthma/p35.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 35"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-25":{"q":"What are the indications for nitrous oxide in the dental setting?","o":["It is contraindicated in all asthmatic patients","Acute asthma attack with hypoxia only","Patients taking theophylline only","COPD only","Dental anxiety, gag reflex, and asthma with emotional stress"],"a":4,"qk":"치과에서 아산화질소(nitrous oxide)의 적응증은?","ok":["모든 천식 환자에게 금기","저산소증을 동반한 급성 천식 발작만","테오필린 복용 환자만","COPD만","치과 불안, 구역 반사, 정서적 스트레스를 동반한 천식"],"exp":"사용 적응증(indications) 비교:\n\n- **아산화질소(nitrous oxide)**: **치과 불안(dental anxiety)**, **구역 반사(gag reflex)**, **정서적 스트레스를 동반한 천식(asthma with emotional stress)**\n- **산소(oxygen)**: **COPD**, **천식(asthma)**\n\n천식 환자 치과 진료 권고 목록에도 아산화질소(nitrous oxide)가 포함됩니다.","why":{"0":"정서적 스트레스를 동반한 천식은 아산화질소의 적응증입니다.","1":"급성 발작의 저산소증에는 산소를 씁니다.","2":"테오필린은 마크롤라이드 항생제와 관련된 주의 사항이지 아산화질소 적응증이 아닙니다.","3":"COPD는 산소(oxygen)의 적응증입니다."},"one":"아산화질소는 치과 불안·구역 반사·정서적 스트레스 동반 천식에, 산소는 COPD와 천식에 쓴다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 36","img":[{"u":"img/w12_asthma/p36.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 36"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-26":{"q":"What is the heritability of asthma and of dental caries, and how does caries in the primary teeth of asthmatic children compare?","o":["10% for asthma, 90% for caries; no difference in caries","90% for asthma, 40–60% for caries; nearly two-fold increase in caries in the primary teeth of children with asthma","50% for both; caries decreases in asthma","40–60% for asthma, 90% for caries; four-fold increase","Neither is heritable"],"a":1,"qk":"천식과 충치(dental caries)의 유전율은 각각 얼마이며, 천식 소아의 유치 충치는 어떻게 다른가?","ok":["천식 10%, 충치 90%; 충치 차이 없음","천식 90%, 충치 40–60%; 천식 소아의 유치에서 충치가 거의 2배","둘 다 50%; 천식에서 충치 감소","천식 40–60%, 충치 90%; 4배 증가","둘 다 유전되지 않는다"],"exp":"**천식과 구강 건강(asthma and oral health)**:\n- **유전(genetic)**: 두 경우 모두 **유전율이 높음** – **천식 90%**, **충치 40–60%**\n- 천식 환자는 **충치, 구취(bad breath), 잇몸 문제**가 늘 수 있음\n- 연구에 따르면 **천식 소아의 유치(primary teeth)에서 충치가 천식 없는 소아보다 거의 2배**","why":{"0":"수치가 반대로 되어 있고, 천식 소아에서 충치가 늘어납니다.","2":"유전율은 천식 90%, 충치 40–60%이며 충치는 증가합니다.","3":"천식이 90%, 충치가 40–60%이며 증가 폭은 거의 2배입니다.","4":"둘 다 유전율이 높습니다."},"one":"유전율은 천식 90%, 충치 40–60%이고, 천식 소아의 유치 충치는 거의 2배이다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 37","img":[{"u":"img/w12_asthma/p37.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 37"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-27":{"q":"Which oral effects are listed for β2-agonists?","o":["Increased bone mineral density","Gingival hyperplasia and hairy tongue","Increased IgA and lower S. mutans counts","Decreased salivation rate (higher incidence of calculus), decreased saliva pH, higher incidence of candidiasis, and sugar content","Increased salivation and higher saliva pH"],"a":3,"qk":"β2-작용제(β2-agonist)의 구강 영향으로 제시된 것은?","ok":["골밀도 증가","잇몸 증식과 모설","IgA 증가와 S. mutans 감소","침 분비 속도 감소(치석 발생 증가), 침 pH 감소, 칸디다증 증가, 당 함량","침 분비 증가와 침 pH 상승"],"exp":"치아 침식·치주질환·충치의 **요인(factors)** 중 **β2-작용제(B2-agonist)**:\n- **침 분비 속도 감소(decrease salivation rate)** → **치석(calculus) 발생 증가**\n- **침 pH 감소(decrease saliva pH)**\n- **칸디다증 증가(higher incidence of candidiasis)**\n- **당 함량(sugar content)**\n\n그래서 β2-작용제 사용자에게 특히 불소가 권장됩니다.","why":{"0":"골밀도 감소는 스테로이드의 영향이며, 증가가 아닙니다.","1":"잇몸 증식과 모설은 제시되지 않습니다.","2":"IgA 감소와 S. mutans 증가는 스테로이드의 영향이며, 방향도 반대입니다.","4":"침 분비와 pH는 증가가 아니라 감소합니다."},"one":"β2-작용제: 침 분비 감소(치석 증가), 침 pH 감소, 칸디다증 증가, 당 함량.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-28":{"q":"Besides lowering salivation and pH, which effects are listed for steroids?","o":["Immunosuppression with decreased IgA, higher salivary Streptococcus mutans counts, higher incidence of candidiasis, and decreased bone mineral density","Increased IgA and fewer bacteria","Higher salivary flow and enamel hardening","No oral effects","Increased bone mineral density"],"a":0,"qk":"침 분비와 pH 감소 외에 스테로이드(steroids)의 영향으로 제시된 것은?","ok":["IgA 감소를 동반한 면역억제, 침 속 Streptococcus mutans 증가, 칸디다증 증가, 골밀도 감소","IgA 증가와 세균 감소","침 분비 증가와 법랑질 경화","구강 영향 없음","골밀도 증가"],"exp":"**스테로이드(steroids)**의 영향:\n- **침 분비 속도 감소, 침 pH 감소**, **당 함량 높음**\n- **칸디다증 증가(higher incidence of candidiasis)**\n- **IgA 감소를 동반한 면역억제 효과(immunosuppressive effect with decreased IgA)**\n- 침 속 **Streptococcus mutans 수가 건강한 대조군보다 높음**\n- **골밀도 감소(decrease in bone mineral density)**\n\n그 밖의 요인:\n- **외인성(extrinsic)**: 단 음료, 산성 탄산음료, 단 간식 섭취 증가\n- **내인성(intrinsic)**: 위식도역류(GERD), 구강안면 이상","why":{"1":"IgA는 감소하고 S. mutans는 증가합니다.","2":"침 분비는 감소합니다.","3":"여러 구강 영향이 있습니다.","4":"골밀도는 감소합니다."},"one":"스테로이드: 침 분비·pH 감소, 당, 칸디다증, IgA 감소(면역억제), S. mutans 증가, 골밀도 감소.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-29":{"q":"Which preventive measures are listed against medication-related oral damage, and why does nighttime inhaler use matter?","o":["Stop all asthma medication; nighttime use neutralizes acid","Antibiotics daily; nighttime use has no effect","Rinsing the mouth, sialagogues for low salivary flow, and sugar-free gum; inhaled therapy is often taken at night without oral hygiene and without masticatory movement","Brushing is contraindicated after an inhaler; nighttime use protects teeth","Avoid all fluids; nighttime use increases saliva"],"a":2,"qk":"약물로 인한 구강 손상을 막는 예방법으로 제시된 것과, 밤에 흡입기를 쓰는 것이 문제가 되는 이유는?","ok":["천식약을 모두 끊고, 밤 사용은 산을 중화한다","매일 항생제를 쓰고, 밤 사용은 영향이 없다","입 헹구기, 침 분비가 낮은 환자에게 타액분비촉진제, 무설탕 껌; 흡입 치료는 흔히 구강 위생 없이 자기 전에 하고 저작 운동도 없다","흡입기 후 칫솔질은 금기이고, 밤 사용은 치아를 보호한다","모든 수분을 피하고, 밤 사용은 침을 늘린다"],"exp":"**예방(prevention)**:\n- **입 헹구기와 동반 요인 조절은 필수(mandatory)**\n- 침 분비 속도가 낮은 환자에게 **타액분비촉진제(sialagogue)**\n- **무설탕 껌(sugar free gum)** 씹기\n\n**주요 요인: 천식약의 역할(role of asthma medication)**\n흡입 치료는 흔히 **밤에 자기 전에 구강 위생 없이** 하고, **저작 운동(masticatory movements)이 없어서** 약물 자체로 인한 구강 손상이 커질 수 있습니다.","why":{"0":"천식약을 끊으라는 것이 아니라 구강 관리를 강화하는 것입니다.","1":"매일 항생제는 제시되지 않으며, 밤 사용은 손상을 키울 수 있습니다.","3":"흡입기 사용 후에는 입을 헹구도록 하며, 밤 사용은 손상을 키울 수 있습니다.","4":"수분을 피하라는 내용은 없고, 밤에는 저작이 없어 오히려 손상이 커집니다."},"one":"예방: 입 헹구기, 타액분비촉진제, 무설탕 껌. 밤에 구강 위생과 저작 없이 흡입하면 손상이 커진다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38, 39","img":[{"u":"img/w12_asthma/p38.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 38"},{"u":"img/w12_asthma/p39.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 39"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-30":{"q":"Because asthmatics have increased risk for cavities and gum disease, which dental care recommendations are listed?","o":["Routine antibiotic premedication for all asthmatics","Fewer dental visits to reduce stress","Fluoride only if the patient uses steroids","Avoid informing the dentist of health changes","More frequent maintenance visits, fluoride interventions if using β2-agonist inhalers, caries prevention, antibiotic premedication if needed, stress reduction, and nitrous oxide for anxiety"],"a":4,"qk":"천식 환자는 충치와 잇몸 질환 위험이 높으므로 어떤 치과 관리 권고가 제시되는가?","ok":["모든 천식 환자에게 일상적인 항생제 예방 투여","스트레스를 줄이기 위해 치과 방문을 줄인다","스테로이드를 쓰는 경우에만 불소","건강 변화를 치과의사에게 알리지 않는다","정기 관리 방문 빈도 증가, β2-작용제 흡입기 사용 시 불소 처치, 충치 예방, 필요 시 항생제 예방 투여, 스트레스 감소, 불안 감소를 위한 아산화질소"],"exp":"천식 치료에서 **구강 건강 제공자는 중요한 역할**을 합니다. 천식 조절 약을 먹는 환자는 **치아 건강을 더 적극적으로 관찰(monitor dental health more aggressively)**해야 할 수 있습니다.\n\n**충치와 잇몸 질환 위험 증가 때문에** 천식 환자는:\n- **정기 관리 방문 빈도 증가**\n- **불소 처치(fluoride interventions)** – **β2-작용제 흡입기**를 쓰는 경우\n- **충치 예방 조치**\n- **필요 시 항생제 예방 투여(antibiotic premedication if needed)**\n- **스트레스 감소 기법**\n- **건강 변화를 치과의사에게 알림**\n- **불안 감소를 위해 아산화질소(nitrous oxide) 요청**","why":{"0":"항생제 예방 투여는 필요한 경우에만입니다.","1":"방문 빈도는 줄이지 않고 늘립니다.","2":"불소는 특히 β2-작용제 흡입기 사용자에게 권장됩니다.","3":"건강 변화는 치과의사에게 계속 알려야 합니다."},"one":"천식 환자: 방문 빈도 증가, β2-작용제면 불소, 충치 예방, 필요 시 항생제, 스트레스 감소, 건강 변화 공유, 아산화질소.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 40, 41","img":[{"u":"img/w12_asthma/p40.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 40"},{"u":"img/w12_asthma/p41.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 41"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-31":{"q":"Which general oral health care instruction is given for asthmatic patients?","o":["Instruct patients not to rinse after using an inhaler","Prescribe fluoride only for children","Prescribe fluoride for all asthmatics, especially those on β2-agonists (higher sugar content), and instruct them to rinse after using an inhaler","Never prescribe antifungal agents","Stop oral hygiene instruction for asthmatics"],"a":2,"qk":"천식 환자에 대한 일반 구강 관리 지침(general oral health care instructions)으로 제시된 것은?","ok":["흡입기 사용 후 헹구지 않게 한다","소아에게만 불소를 처방한다","모든 천식 환자, 특히 β2-작용제(당 함량이 높음)를 쓰는 환자에게 불소를 처방하고, 흡입기 사용 후 입을 헹구게 한다","항진균제는 절대 처방하지 않는다","천식 환자에게는 구강 위생 교육을 중단한다"],"exp":"**일반 구강 관리 지침(general oral health care instructions)**(별표 항목):\n- **모든 천식 환자에게 불소 보충제(fluoride supplements)**(예: 불소 치약)를 처방하되, **특히 β2-작용제 사용자**에게(**당 함량이 높기 때문**)\n- **흡입기 사용 후 입을 헹구도록** 지도\n- 치은염을 줄이기 위해 **구강 위생 교육 강화**\n- **분무 코르티코스테로이드(nebulized corticosteroids)**를 만성적으로 쓰는 환자에게 **항진균제(antifungal agents)** 처방이 필요할 수 있음을 인지","why":{"0":"흡입기 사용 후 입을 헹구게 합니다.","1":"불소는 모든 천식 환자에게 권장됩니다.","3":"만성 분무 코르티코스테로이드 사용자에게는 항진균제가 필요할 수 있습니다.","4":"구강 위생 교육은 강화합니다."},"one":"모든 천식 환자에게 불소(특히 β2-작용제), 흡입기 후 입 헹구기, 구강 위생 강화, 만성 분무 스테로이드면 항진균제 고려.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 42","img":[{"u":"img/w12_asthma/p42.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 42"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-32":{"q":"Which drugs should be avoided in asthmatic patients?","o":["Inhaled corticosteroids","Aspirin-containing drugs, NSAIDs, macrolide antibiotics in patients on theophylline, opiates, and adrenalin or levonordefrin in local anesthetics","Fluoride toothpaste and chlorhexidine","Acetaminophen only","Short-acting β2-agonists"],"a":1,"qk":"천식 환자에서 피해야 할 약물은?","ok":["흡입 코르티코스테로이드","아스피린이 든 약, NSAIDs, 테오필린을 쓰는 환자의 마크롤라이드 항생제, 아편유사제, 국소마취제의 아드레날린·레보노르데프린","불소 치약과 클로르헥시딘","아세트아미노펜만","단시간 작용 β2-작용제"],"exp":"**천식 환자에서 피해야 할 약물(drugs to be avoided)**:\n- **아스피린(aspirin)이 든 약**\n- **비스테로이드성 소염제(NSAIDs)**\n- **테오필린(theophylline)** 치료 중인 환자의 **마크롤라이드 항생제(macrolide antibiotics)**\n- **아편유사제(opiates)**\n- **국소마취제 속 아드레날린(adrenalin) 또는 레보노르데프린(levonordefrin)**\n\n아스피린과 NSAIDs는 천식 유발 물질이기도 합니다.","why":{"0":"흡입 코르티코스테로이드는 조절 치료제입니다.","2":"불소와 클로르헥시딘은 피해야 할 약물로 제시되지 않습니다.","3":"아세트아미노펜은 목록에 없습니다.","4":"단시간 작용 β2-작용제는 오히려 준비해 두고 시술 직전 예방 투여하기도 합니다."},"one":"피할 약: 아스피린, NSAIDs, 테오필린 환자의 마크롤라이드, 아편유사제, 국소마취제의 아드레날린·레보노르데프린.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 43","img":[{"u":"img/w12_asthma/p43.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 43"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-33":{"q":"According to the take-home hints, when should elective dentistry be performed on an asthmatic patient?","o":["Only on asymptomatic patients; coughing, wheezing or an upper respiratory infection requires reappointment","Only after stopping all asthma medication","At any time, as long as the patient has an inhaler at home","Only during an upper respiratory infection","Only under general anesthesia"],"a":0,"qk":"핵심 요점(take home hints)에 따르면 천식 환자의 선택적 치과 치료(elective dentistry)는 언제 해야 하는가?","ok":["증상이 없는 환자에게만; 기침, 쌕쌕거림, 상기도 감염이 있으면 다시 예약한다","천식약을 모두 끊은 뒤에만","집에 흡입기가 있으면 언제든지","상기도 감염 중에만","전신마취하에서만"],"exp":"**핵심 요점(take home hints)** 1–3:\n1. **매 방문마다 병력 업데이트** – 천식 활동성, **구조약 사용 빈도 증가**, 증상 변화나 존재\n2. **선택적 치과 치료는 증상이 없는(asymptomatic) 환자에게만**. **기침, 쌕쌕거림, 상기도 감염(upper respiratory infection)**이 있으면 **재예약(reappointment)**\n3. 환자가 **가장 최근 예정된 천식약을 복용했는지 확인**","why":{"1":"최근 예정된 천식약을 복용했는지 확인해야 합니다.","2":"흡입기는 진료실에서 바로 쓸 수 있어야 하고, 증상이 없어야 합니다.","3":"상기도 감염이 있으면 재예약합니다.","4":"전신마취는 제시되지 않습니다."},"one":"선택적 치료는 무증상일 때만, 기침·쌕쌕거림·상기도 감염이면 재예약, 매 방문 병력 업데이트, 최근 약 복용 확인.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","img":[{"u":"img/w12_asthma/p44.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_asthma-34":{"q":"How should the patient's short-acting β2-agonist (SABA) be handled at a dental visit?","o":["It is not needed if the patient is well controlled","The SABA should be withheld for 24 hours before the visit","The dentist should replace it with a long-acting β2-agonist only","The patient's own SABA should be readily available, and the patient should take a prophylactic dose immediately prior to the procedure","It should be given only after an attack has lasted 30 minutes"],"a":3,"qk":"치과 방문 시 환자의 단시간 작용 β2-작용제(SABA)는 어떻게 다루어야 하는가?","ok":["잘 조절되는 환자라면 필요 없다","방문 24시간 전부터 SABA를 끊는다","치과의사가 장시간 작용 β2-작용제로만 바꾼다","환자 본인의 SABA를 바로 쓸 수 있게 두고, 시술 직전에 예방 용량을 흡입하게 한다","발작이 30분 지속된 뒤에만 준다"],"exp":"**핵심 요점(take home hints)** 4–6:\n4. 진료실의 **잠재적 유발 요인을 인지하고 노출을 줄이거나 없애기**\n5. **환자 본인의 단시간 작용 β2-작용제(short-acting β2 agonist)**를 **바로 쓸 수 있게(readily available)** 두기\n6. **시술 직전(immediately prior to procedure)**에 **예방 용량(prophylactic dose)**의 SABA를 흡입하게 하기","why":{"0":"잘 조절되는 환자라도 SABA를 준비하고 예방 투여합니다.","1":"SABA를 끊는 것이 아니라 시술 직전에 예방 투여합니다.","2":"환자 본인의 단시간 작용제를 준비합니다.","4":"시술 직전 예방 투여하며, 발작 시 바로 씁니다."},"one":"환자 본인의 SABA를 바로 쓸 수 있게 두고, 시술 직전 예방 용량을 흡입하며, 진료실 유발 요인을 줄인다.","src":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44","img":[{"u":"img/w12_asthma/p44.webp","cap":"2025Dental-Asthma-MODIFIED-NEW-CANVAS.pdf, slide 44"}],"ch":"w12_asthma","chn":"Asthma and Dental Health","week":12},"w12_cv_dev-1":{"q":"By what time does the heart begin to beat, and by when is the primitive heart tube transformed into the adult-appearing four-chambered heart?","o":["Beats by day 18; four-chambered by 4 weeks","Beats by day 8; four-chambered by 23 weeks","Beats by day 23; four-chambered by 8 weeks","Beats only after birth; four-chambered by 8 weeks","Beats by week 12; four-chambered at birth"],"a":2,"qk":"심장은 언제까지 뛰기 시작하며, 원시 심장관(primitive heart tube)은 언제까지 성인 모양의 네 방 심장으로 바뀌는가?","ok":["18일째까지 박동 시작; 4주까지 네 방 심장","8일째까지 박동 시작; 23주까지 네 방 심장","23일째까지 박동 시작; 8주까지 네 방 심장","출생 후에야 박동; 8주까지 네 방 심장","12주까지 박동 시작; 출생 시 네 방 심장"],"exp":"심장 발생 개요(heart development overview)의 핵심 숫자 두 개입니다.\n\n- **23일째까지(by day 23) 심장이 뛰기 시작합니다!**\n- **원시 심장관(primitive heart tube)**은 **8주까지(by 8 weeks)** 성인 모양의 **네 방 심장(4 chambered heart)**으로 완전히 바뀝니다.\n\n개요 흐름: 심장관 형성(기원, 고리 형성) → 중격 형성(심방, 방실, 심실, 유출로) → 혈관 발생(동맥계, 정맥계) → 출생 시 순환 변화.","why":{"0":"18일째는 혈관형성(vasculogenesis)이 배아내 중배엽 전체에 생기는 시점이고, 네 방 심장은 8주입니다.","1":"숫자가 뒤바뀌었습니다. 박동은 23일, 네 방 심장은 8주입니다.","3":"심장은 태아기 23일째부터 뜁니다.","4":"박동은 훨씬 이른 23일째에 시작합니다."},"one":"심장은 23일째에 뛰기 시작하고, 8주까지 네 방 심장이 된다.","src":"Cardiovascular System.pdf, slide 3","img":[{"u":"img/w12_cv_dev/p03.webp","cap":"Cardiovascular System.pdf, slide 3"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-2":{"q":"From where are cardiac progenitor cells derived?","o":["Neural crest from the caudal neural tube","The caudal third of the primitive streak in late gastrulation","Ectoderm of the oropharyngeal membrane","Intraembryonic mesoderm emerging from the cranial third of the primitive streak during early gastrulation","Hypoblast of the yolk sac"],"a":3,"qk":"심장 전구세포(cardiac progenitor cells)는 어디에서 유래하는가?","ok":["꼬리쪽 신경관의 신경능선","후기 낭배 형성 시 원시선의 꼬리쪽 1/3","구인두막의 외배엽","초기 낭배 형성 동안 원시선(primitive streak)의 머리쪽 1/3에서 나오는 배아내 중배엽","난황낭의 하배엽"],"exp":"**심장 계통 확립(establishing cardiac lineage)**은 **초기 낭배 형성(early gastrulation)**에서 중배엽이 생길 때부터 시작됩니다.\n\n- **심장 전구세포(cardiac progenitor cells)**는 초기 낭배 형성 동안 **원시선의 머리쪽 1/3(cranial third of the primitive streak)**에서 나오는 **배아내 중배엽(intraembryonic mesoderm)**에서 유래합니다.\n- 이 전구세포들은 원시선을 떠나 **머리-바깥쪽(cranial-lateral) 방향으로 이동**해 원시선 **양쪽**에 자리 잡습니다.","why":{"0":"신경능선은 중격 형성의 쿠션 조직에 기여하지만, 심장 전구세포의 기원은 중배엽입니다.","1":"머리쪽 1/3, 초기 낭배 형성입니다.","2":"구인두막은 미래의 입이 되는 구조입니다.","4":"하배엽은 처음 들어오는 세포가 만드는 최종 내배엽으로 대체됩니다."},"one":"심장 전구세포는 초기 낭배 형성 때 원시선 머리쪽 1/3의 배아내 중배엽에서 나와 머리-바깥쪽으로 이동한다.","src":"Cardiovascular System.pdf, slide 6","img":[{"u":"img/w12_cv_dev/p06.webp","cap":"Cardiovascular System.pdf, slide 6"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-3":{"q":"During gastrulation, what do the first ingressing epiblast cells form?","o":["Extraembryonic mesoderm only","Notochord only","Cardiac jelly","Ectoderm, which remains on the surface","Definitive endoderm, which eventually completely replaces the hypoblast"],"a":4,"qk":"낭배 형성 중 처음으로 함입(ingression)하는 상배엽(epiblast) 세포는 무엇을 만드는가?","ok":["배아외 중배엽만","척삭만","심장 젤리","외배엽; 표면에 남는다","최종 내배엽(definitive endoderm); 결국 하배엽을 완전히 대체한다"],"exp":"**함입(ingression)**은 \"**원시선을 통한 세포의 이동**\"입니다.\n- 상배엽 세포가 정중선의 원시선으로 **모여들고(convergence)**\n- **플라스크 모양(flask-shaped)**이 되어 떨어져 나와 외배엽 아래로 미끄러져 들어갑니다.\n\n세 배엽은 모두 **상배엽(epiblast)**에서 유래합니다.\n1. **처음 함입하는 세포 → 최종 내배엽(definitive endoderm)**, 결국 **하배엽(hypoblast)을 완전히 대체**\n2. 일부는 상배엽 아래 공간으로 퍼져 → **배아내 중배엽(intraembryonic mesoderm)**, 상배엽과 내배엽 사이의 느슨한 세포층\n3. **표면에 남은 세포 → 외배엽(ectoderm)**\n\n내배엽과 중배엽이 생기면 함입은 멈추고, 배아판은 머리쪽으로 늘어납니다.","why":{"0":"상배엽 아래로 퍼진 세포는 배아내 중배엽이 됩니다.","1":"처음 함입하는 세포는 최종 내배엽이 됩니다.","2":"심장 젤리는 발생 중인 심근이 분비하는 세포외기질입니다.","3":"외배엽은 함입하지 않고 표면에 남은 세포입니다."},"one":"함입 순서: 처음 세포 → 최종 내배엽(하배엽 대체), 다음 → 배아내 중배엽, 표면에 남은 세포 → 외배엽.","src":"Cardiovascular System.pdf, slide 7","img":[{"u":"img/w12_cv_dev/p07.webp","cap":"Cardiovascular System.pdf, slide 7"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-4":{"q":"When does the vascular system appear, and what is the sequence that forms the endocardial heart tubes?","o":["Week 8; endocardial tubes → angioblastic cords → angiogenetic clusters","Middle of week 3; angiogenetic clusters → angioblastic cords (two longitudinal strands) → canalization into endocardial heart tubes","Week 1; neural folds → heart tube","Week 6; aortic arches → endocardial tubes","Middle of week 3; septum primum → septum secundum → heart tube"],"a":1,"qk":"혈관계는 언제 나타나며, 심내막 심장관(endocardial heart tubes)이 만들어지는 순서는?","ok":["8주; 심내막관 → 혈관모세포 끈 → 혈관생성 세포군","3주 중반; 혈관생성 세포군(angiogenetic clusters) → 혈관모세포 끈(angioblastic cords, 두 줄의 세로 세포 가닥) → 관강화되어 심내막 심장관","1주; 신경주름 → 심장관","6주; 대동맥궁 → 심내막관","3주 중반; 일차중격 → 이차중격 → 심장관"],"exp":"**기원(origin)**: 혈관계는 **3주 중반(middle of week 3)**에 나타납니다.\n\n1. **혈관생성 세포군(angiogenetic clusters)**: 간엽세포가 증식해 고립된 세포 덩어리를 만듦\n2. **혈관모세포 끈(angioblastic cords)**: 세포군이 **두 줄의 세로 세포 가닥**으로 배열\n3. 관강화(canalizes) → **심내막 심장관(endocardial heart tubes)**\n\n심장 형성 영역은 **척삭앞판(prochordal plate)의 앞쪽(anterior)**에 있는 **심장 초승달(cardiac crescent)**입니다(NDE 출제 포인트).","why":{"0":"순서가 거꾸로이고, 시기도 3주 중반입니다.","2":"신경주름은 신경관을 만드는 구조입니다.","3":"대동맥궁은 심장관 형성 이후의 동맥계 발생입니다.","4":"일차·이차중격은 4–5주의 심방 중격 형성 과정입니다."},"one":"3주 중반: 혈관생성 세포군 → 두 줄의 혈관모세포 끈 → 관강화 → 심내막 심장관.","src":"Cardiovascular System.pdf, slide 8","img":[{"u":"img/w12_cv_dev/p08.webp","cap":"Cardiovascular System.pdf, slide 8"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-5":{"q":"Where is the cardiogenic field (cardiac crescent) located relative to the prochordal plate?","o":["Anterior (cranial) to the prochordal plate","Posterior to the cloacal membrane","Within the notochord","Lateral to the allantois only","Inside the yolk sac wall"],"a":0,"qk":"심장 형성 영역(cardiac crescent)은 척삭앞판(prochordal plate)을 기준으로 어디에 있는가?","ok":["척삭앞판의 앞쪽(머리쪽)","총배설강막의 뒤쪽","척삭 안","요막의 바깥쪽에만","난황낭 벽 안"],"exp":"심내막 심장관을 만드는 **심장 형성 영역(cardiogenic field)**은 **심장 초승달(cardiac crescent)** 모양으로 **척삭앞판(prochordal plate)의 앞쪽(anterior)**에 놓입니다. **NDE 출제 포인트**로 표시된 항목입니다.","why":{"1":"총배설강막은 꼬리쪽 구조입니다.","2":"척삭은 정중선 축 구조이며 심장 영역이 아닙니다.","3":"요막은 꼬리쪽 구조입니다.","4":"난황낭 벽의 혈도는 배아외 구조이며, 심장 영역은 척삭앞판 앞쪽입니다."},"one":"심장 형성 영역(심장 초승달)은 척삭앞판의 앞쪽에 있다(NDE).","src":"Cardiovascular System.pdf, slide 8","img":[{"u":"img/w12_cv_dev/p08.webp","cap":"Cardiovascular System.pdf, slide 8"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-6":{"q":"Which statements about the developing cardiovascular system are emphasized?","o":["It reaches a functional state long before any other organ system, grows from a simple bilaterally symmetrical plexus into an asymmetrical complex system, and the young heart is relatively enormous compared with the adult","It is the last organ system to function","It stays the same shape while the embryo grows","The embryonic heart is relatively tiny compared with the adult","It begins asymmetrical and becomes bilaterally symmetrical"],"a":0,"qk":"발생 중인 심혈관계에 대해 강조된 내용은?","ok":["다른 어떤 기관계보다 훨씬 먼저 기능 상태에 이르며, 단순한 좌우대칭 혈관망에서 비대칭의 복잡한 계통으로 자라고, 어린 심장은 성인에 비해 상대적으로 매우 크다","가장 늦게 기능하는 기관계이다","배아가 자라는 동안 모양이 변하지 않는다","배아 심장은 성인에 비해 상대적으로 매우 작다","비대칭으로 시작해 좌우대칭이 된다"],"exp":"밑줄 친 핵심:\n- 심혈관계는 첫 번째로 나타나는 기관계는 아니지만, **다른 어떤 기관계보다 훨씬 먼저 기능 상태(functional state)**에 이릅니다. 그것도 아직 비교적 원시적인 발생 단계에서요.\n- **단순한 좌우대칭 혈관망(simple, bilaterally symmetrical plexus)**에서 **동맥·정맥·모세혈관의 비대칭적 복잡계(asymmetrical complex system)**로 자랍니다. 새 혈관 형성, 일시적 우회, 혈류 재배치, 기존 주 통로나 하위 계통의 소실이 포함된 역동적 과정입니다.\n- 배아가 자라면서 **커지고(enlarge)** 모양 변화에 **적응(adapt)**해야 하며, 일하면서 단순한 관에서 네 개의 판막을 가진 네 방 기관으로 **자라고 분화**합니다.\n- 배아외(태반) 조직에도 혈액을 공급하므로 **어린 심장은 성인에 비해 상대적으로 매우 큽니다(relatively enormous)**.","why":{"1":"다른 기관계보다 훨씬 먼저 기능합니다.","2":"배아의 모양 변화에 적응하며 계속 바뀝니다.","3":"상대적으로 매우 큽니다.","4":"대칭에서 비대칭으로 바뀝니다."},"one":"심혈관계는 가장 먼저 기능하고, 대칭 혈관망에서 비대칭 계통으로 자라며, 배아 심장은 성인보다 상대적으로 매우 크다.","src":"Cardiovascular System.pdf, slide 9","img":[{"u":"img/w12_cv_dev/p09.webp","cap":"Cardiovascular System.pdf, slide 9"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-7":{"q":"Cranial (head) folding is caused by forward growth of the neural plate. Which three structures in the cranial rim result, and what do they become?","o":["Cloacal membrane → anus; allantois → bladder; yolk stalk → umbilicus","Amnion → skin; chorion → placenta; yolk sac → gut","Septum primum → fossa ovalis; truncus → aorta; sinus venosus → right atrium","Oropharyngeal membrane → future mouth; cardiogenic area → heart; septum transversum → part of diaphragm","Notochord → nucleus pulposus; somites → vertebrae; neural crest → ganglia"],"a":3,"qk":"머리 접힘(cranial folding)은 신경판의 앞쪽 성장으로 일어난다. 머리쪽 가장자리의 세 구조와 그 운명은?","ok":["총배설강막 → 항문; 요막 → 방광; 난황줄기 → 배꼽","양막 → 피부; 융모막 → 태반; 난황낭 → 장","일차중격 → 타원오목; 동맥줄기 → 대동맥; 정맥동 → 우심방","구인두막(oropharyngeal membrane) → 미래의 입; 심장 형성 영역(cardiogenic area) → 심장; 가로중격(septum transversum) → 횡격막 일부","척삭 → 속질핵; 체절 → 척추; 신경능선 → 신경절"],"exp":"**배아 접힘(embryonic folding)**은 조직층의 능동적 재구성이며, **주된 힘은 여러 구조의 차등 성장(differential growth)**입니다. 머리-꼬리 및 옆 접힘으로 납작한 배아판이 **3차원의 관 속의 관(tube-within-a-tube)** 구조가 됩니다.\n\n**머리 접힘(head folding)**은 **신경판의 앞쪽 성장**으로 일어나며, 배아판의 머리쪽 가장자리에는 다음이 있습니다.\n1. **구인두막(oropharyngeal membrane)** → **미래의 입(future mouth)**\n2. **심장 형성 영역(cardiogenic area)** → **심장(heart)**\n3. **가로중격(septum transversum)** → **횡격막(diaphragm)의 일부**","why":{"0":"꼬리쪽 구조와 그 운명이며, 머리 접힘과 무관합니다.","1":"배아외막의 내용으로 머리 접힘의 세 결과가 아닙니다.","2":"심장 내부 구조의 운명이며, 머리 접힘의 결과가 아닙니다.","4":"척삭·체절·신경능선은 머리 접힘의 세 결과가 아닙니다."},"one":"머리 접힘의 세 결과: 구인두막 → 입, 심장 형성 영역 → 심장, 가로중격 → 횡격막 일부. 접힘의 주된 힘은 차등 성장.","src":"Cardiovascular System.pdf, slide 10, 5","img":[{"u":"img/w12_cv_dev/p10.webp","cap":"Cardiovascular System.pdf, slide 10"},{"u":"img/w12_cv_dev/p05.webp","cap":"Cardiovascular System.pdf, slide 5"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-8":{"q":"Which describes the layers of the primitive heart tube?","o":["Epicardium lines the lumen of the heart tube","Endocardium (an endothelium); myocardium (heart muscle) separated from the fused endocardial tubes by cardiac jelly deposited mainly by the myocardium; epicardium (visceral pericardium)","Only two layers form: endocardium and epicardium","Cardiac jelly is deposited by the endocardium and lies outside the epicardium","Endocardium (heart muscle); myocardium (endothelium); epicardium (parietal pericardium)"],"a":1,"qk":"원시 심장관(primitive heart tube)의 층에 대한 설명으로 옳은 것은?","ok":["심외막이 심장관 내강을 덮는다","심내막(endocardium, 내피); 심근(myocardium, 심장 근육)은 주로 심근이 분비한 심장 젤리(cardiac jelly)로 융합된 심내막관과 분리됨; 심외막(epicardium, 장측 심막)","심내막과 심외막 두 층만 생긴다","심장 젤리는 심내막이 분비하며 심외막 바깥에 있다","심내막(심장 근육); 심근(내피); 심외막(벽측 심막)"],"exp":"심장관이 융합하면서 **세 층**이 생깁니다.\n\n1. **심내막(endocardium)**: **내피(endothelium)**로 구성\n2. **심근(myocardium)**: 심장 근육. 두꺼운 세포외기질인 **심장 젤리(cardiac jelly, \"심근세포 전구\")**가 **주로 발생 중인 심근이 분비**되어 심근과 융합된 심내막관 사이를 **분리**합니다.\n3. **심외막(epicardium)**: 심장관 바깥을 덮는 **장측 심막(visceral pericardium)**","why":{"0":"내강을 덮는 것은 심내막입니다.","2":"심근을 포함한 세 층이 생깁니다.","3":"심장 젤리는 주로 심근이 분비하며 심근과 심내막 사이에 있습니다.","4":"심내막은 내피, 심근은 심장 근육이며, 심외막은 장측 심막입니다."},"one":"심장관의 세 층: 심내막(내피), 심근(심장 젤리로 심내막과 분리, 젤리는 주로 심근이 분비), 심외막(장측 심막).","src":"Cardiovascular System.pdf, slide 11","img":[{"u":"img/w12_cv_dev/p11.webp","cap":"Cardiovascular System.pdf, slide 11"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-9":{"q":"Which region of the primitive heart tube becomes the right atrium and receives the umbilical, vitelline and common cardinal veins?","o":["Truncus arteriosus","Primitive ventricle","Primitive atria","Bulbus cordis","Sinus venosus"],"a":4,"qk":"원시 심장관에서 우심방이 되며 배꼽정맥, 난황정맥, 총주정맥을 받는 부위는?","ok":["동맥줄기(truncus arteriosus)","원시 심실(primitive ventricle)","원시 심방(primitive atria)","심장구(bulbus cordis)","정맥동(sinus venosus)"],"exp":"원시 심장관은 길어지며 **오른쪽으로 고리**를 만듭니다. 다섯 부위와 운명:\n\n1. **정맥동(sinus venosus)** → **우심방(right atrium)** (정맥굴부위 sinus venarum 기억!). 세 정맥을 받음:\n   - **배꼽정맥(umbilical veins)** ← 태반\n   - **난황정맥(vitelline veins)** ← 난황낭\n   - **총주정맥(common cardinal veins)** ← 배아\n2. **원시 심방(primitive atria)** → 양쪽 **심방귀(auricles)**(와 우심방의 빗살근)\n3. **원시 심실(primitive ventricle)** → 더 빠른 성장으로 **좌심실**\n4. **심장구(bulbus cordis)** → **우심실**\n5. **동맥줄기(truncus arteriosus)** → **대동맥과 폐동맥줄기의 뿌리**","why":{"0":"동맥줄기는 대동맥과 폐동맥줄기 뿌리가 됩니다.","1":"원시 심실은 좌심실이 됩니다.","2":"원시 심방은 심방귀와 우심방 빗살근이 됩니다.","3":"심장구는 우심실이 됩니다."},"one":"정맥동 → 우심방(배꼽·난황·총주정맥 유입), 원시 심방 → 심방귀, 원시 심실 → 좌심실, 심장구 → 우심실, 동맥줄기 → 대동맥·폐동맥줄기 뿌리.","src":"Cardiovascular System.pdf, slide 12","img":[{"u":"img/w12_cv_dev/p12.webp","cap":"Cardiovascular System.pdf, slide 12"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-10":{"q":"Which pairing of primitive heart tube region and adult derivative is correct?","o":["Primitive atria → interventricular septum","Truncus arteriosus → right atrium","Bulbus cordis → right ventricle; primitive ventricle → left ventricle","Sinus venosus → pulmonary trunk","Bulbus cordis → left ventricle; primitive ventricle → right ventricle"],"a":2,"qk":"원시 심장관 부위와 성인 유도체의 짝이 옳은 것은?","ok":["원시 심방 → 심실사이중격","동맥줄기 → 우심방","심장구(bulbus cordis) → 우심실; 원시 심실(primitive ventricle) → 좌심실","정맥동 → 폐동맥줄기","심장구 → 좌심실; 원시 심실 → 우심실"],"exp":"헷갈리기 쉬운 짝입니다.\n\n- **원시 심실(primitive ventricle)**은 **더 빠른 성장으로 좌심실(left ventricle)**이 됩니다.\n- **심장구(bulbus cordis)**는 **우심실(right ventricle)**이 됩니다.\n\n나머지: 정맥동 → 우심방, 원시 심방 → 심방귀(와 우심방 빗살근), 동맥줄기 → 대동맥·폐동맥줄기 뿌리.","why":{"0":"원시 심방은 심방귀가 됩니다.","1":"동맥줄기는 대동맥과 폐동맥줄기 뿌리가 되고, 우심방은 정맥동에서 옵니다.","3":"정맥동은 우심방이 됩니다.","4":"좌우가 뒤바뀌었습니다."},"one":"원시 심실 → 좌심실, 심장구 → 우심실.","src":"Cardiovascular System.pdf, slide 12","img":[{"u":"img/w12_cv_dev/p12.webp","cap":"Cardiovascular System.pdf, slide 12"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-11":{"q":"Why does the heart tube form a bulboventricular loop to the right?","o":["It shortens and straightens","Its ends are fixed (venous end with the septum transversum, arterial end with the aortic arches), so as it grows and elongates inside the pericardial cavity it has nowhere to go but to fold","The septum primum pushes it to the right","Its ends are free, so it rotates passively","Blood flow stops during looping"],"a":1,"qk":"심장관이 오른쪽으로 심장구-심실 고리(bulboventricular loop)를 만드는 이유는?","ok":["짧아지고 곧아지기 때문이다","양 끝이 고정되어 있어(정맥 끝은 가로중격, 동맥 끝은 대동맥궁) 심막강 안에서 자라고 길어지면서 접히는 수밖에 없기 때문이다","일차중격이 오른쪽으로 밀기 때문이다","양 끝이 자유로워 수동적으로 회전하기 때문이다","고리 형성 동안 혈류가 멈추기 때문이다"],"exp":"**심장 고리 형성(cardiac looping)**:\n- 심장관은 처음에 거의 **머리-꼬리 방향으로 곧고**, **위아래 끝이 사실상 고정**되어 있습니다.\n- 심장관이 **자라고 길어지면서** **심막강(pericardial cavity)** 안에서 접히기, 즉 \"고리\"를 만들기 시작합니다.\n- **양 끝이 고정**: **정맥 끝은 가로중격(septum transversum)**, **동맥 끝은 대동맥궁(aortic arches)**에 붙어 있어 **접히는 것 외에는 갈 곳이 없으므로** **오른쪽으로 심장구-심실 고리(bulboventricular loop)**가 생깁니다.","why":{"0":"심장관은 자라고 길어지면서 접힙니다.","2":"일차중격은 심방 중격 형성 구조이며, 고리 형성의 원인이 아닙니다.","3":"양 끝은 고정되어 있습니다.","4":"고리 형성 중에도 혈류가 있습니다."},"one":"심장관은 양 끝(가로중격, 대동맥궁)이 고정된 채 길어지므로 오른쪽으로 심장구-심실 고리를 만든다.","src":"Cardiovascular System.pdf, slide 13, 14","img":[{"u":"img/w12_cv_dev/p13.webp","cap":"Cardiovascular System.pdf, slide 13"},{"u":"img/w12_cv_dev/p14.webp","cap":"Cardiovascular System.pdf, slide 14"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-12":{"q":"Septation of the heart occurs concurrently during which weeks, and what two basic processes play key roles?","o":["Weeks 12–16; ossification and fusion of somites","Weeks 8 and 9; apoptosis and calcification","Weeks 4 and 5; vasculogenesis and intussusception only","Weeks 4 and 5; differential growth and remodeling, and endocardial-derived and neural crest-derived cushion tissue","Week 2; ingression and gastrulation"],"a":3,"qk":"심장의 중격 형성(septation)은 어느 주에 동시에 일어나며, 핵심 역할을 하는 두 기본 과정은?","ok":["12–16주; 골화와 체절 융합","8주와 9주; 세포자멸사와 석회화","4주와 5주; 혈관형성과 혈관 중첩만","4주와 5주; 차등 성장과 재구성(differential growth and remodeling), 그리고 심내막 유래와 신경능선 유래 쿠션 조직(cushion tissue)","2주; 함입과 낭배 형성"],"exp":"**심장의 중격 형성(septation of the heart)**은 **4주와 5주(weeks 4 and 5)** 동안 **동시에(concurrent)** 진행되는 과정들입니다.\n\n두 가지 기본 과정:\n1. **차등 성장과 재구성(differential growth and remodeling)**\n2. **심내막 유래와 신경능선 유래 쿠션 조직(endocardial-derived and neural crest-derived cushion tissue)**\n\n이 과정으로 RA, LA, RV, LV 네 방이 나뉩니다.","why":{"0":"골화와 체절 융합은 무관합니다.","1":"중격 형성은 4–5주입니다.","2":"혈관형성과 혈관 중첩은 혈관 발생 과정입니다.","4":"함입과 낭배 형성은 세 배엽을 만드는 더 이른 과정이며, 중격 형성은 4–5주입니다."},"one":"심장 중격 형성은 4–5주에 동시에 일어나며, 차등 성장·재구성과 심내막·신경능선 유래 쿠션 조직이 핵심이다.","src":"Cardiovascular System.pdf, slide 15","img":[{"u":"img/w12_cv_dev/p15.webp","cap":"Cardiovascular System.pdf, slide 15"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-13":{"q":"In atrial septation, how do the foramen primum and foramen secundum arise?","o":["Both are openings in the interventricular septum","The foramen secundum forms first, then the foramen primum","The foramen primum is the initial large opening below the growing septum primum; the foramen secundum forms by coalescence of perforations in the septum primum","Both are perforations in the septum secundum","The foramen primum forms in the septum secundum; the foramen secundum is the gap left by the septum secundum"],"a":2,"qk":"심방 중격 형성에서 일차구멍(foramen primum)과 이차구멍(foramen secundum)은 어떻게 생기는가?","ok":["둘 다 심실사이중격의 구멍이다","이차구멍이 먼저 생기고 그다음 일차구멍이 생긴다","일차구멍은 자라는 일차중격(septum primum) 아래의 처음 큰 구멍이고, 이차구멍은 일차중격의 천공들이 합쳐져 생긴다","둘 다 이차중격의 천공이다","일차구멍은 이차중격에 생기고, 이차구멍은 이차중격이 남긴 틈이다"],"exp":"**심방(atria)** 중격 형성은 **체순환과 폐순환을 분리하는 필수 단계**입니다.\n\n1. **일차중격(septum primum)**: **머리-등쪽 벽(cranio-dorsal wall)**에서 자라는 얇은 **초승달 모양의 심근 쐐기**로, **심내막 쿠션(endocardial cushions)** 쪽으로 뻗어 완전히 자랍니다.\n   - **일차구멍(foramen = ostium primum)**: **처음의 큰 구멍**\n   - **이차구멍(foramen secundum)**: 일차중격의 **천공들이 합쳐져(coalescence of perforations)** 생김\n2. **이차중격(septum secundum)**: 일차중격의 **바로 오른쪽**에서 자라며, **불완전하게 자라** 타원형 구멍인 **타원구멍(foramen ovale)**을 남깁니다.","why":{"0":"심방 중격의 구멍들입니다.","1":"일차구멍이 먼저 생깁니다.","3":"이차중격에 남는 구멍은 타원구멍입니다.","4":"두 구멍 모두 일차중격과 관련되며, 이차중격이 남기는 것은 타원구멍입니다."},"one":"일차구멍 = 일차중격 아래의 처음 큰 구멍, 이차구멍 = 일차중격 천공의 융합, 타원구멍 = 이차중격의 불완전한 성장.","src":"Cardiovascular System.pdf, slide 16, 17, 18","img":[{"u":"img/w12_cv_dev/p16.webp","cap":"Cardiovascular System.pdf, slide 16"},{"u":"img/w12_cv_dev/p17.webp","cap":"Cardiovascular System.pdf, slide 17"},{"u":"img/w12_cv_dev/p18.webp","cap":"Cardiovascular System.pdf, slide 18"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-14":{"q":"Which septum grows immediately to the right of the septum primum and leaves the foramen ovale because of incomplete growth?","o":["Septum secundum","Membranous ventricular septum","Aorticopulmonary septum","Septum transversum","Muscular interventricular septum"],"a":0,"qk":"일차중격의 바로 오른쪽에서 자라며, 불완전한 성장으로 타원구멍(foramen ovale)을 남기는 중격은?","ok":["이차중격(septum secundum)","막성 심실중격","대동맥폐동맥중격","가로중격","근육성 심실사이중격"],"exp":"**이차중격(septum secundum)**은 **일차중격의 바로 오른쪽(immediate right)**에서 자랍니다. **불완전하게 자라므로(incomplete growth)** 타원형 구멍인 **타원구멍(foramen ovale)**이 남습니다.\n\n태아의 심방이 최종적으로 나뉘어도 이차중격은 완전히 닫히지 않습니다. **배아·태아기 동안 우심방으로 들어온 혈액의 상당 부분이 타원구멍과 이차구멍을 거쳐 좌심방으로** 갑니다.","why":{"1":"막성 심실중격은 심실 중격 형성을 완성합니다.","2":"대동맥폐동맥중격은 유출로를 나눕니다.","3":"가로중격은 횡격막 일부가 됩니다.","4":"근육성 심실사이중격은 심실을 나눕니다."},"one":"이차중격은 일차중격 오른쪽에서 불완전하게 자라 타원구멍을 남기고, 태아기 혈액은 타원구멍과 이차구멍을 통해 RA → LA로 간다.","src":"Cardiovascular System.pdf, slide 16, 17","img":[{"u":"img/w12_cv_dev/p16.webp","cap":"Cardiovascular System.pdf, slide 16"},{"u":"img/w12_cv_dev/p17.webp","cap":"Cardiovascular System.pdf, slide 17"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-15":{"q":"Why does the fetal atrial septal arrangement allow blood to flow only from the right atrium to the left atrium?","o":["The endocardial cushions block left-to-right flow","Pressure is always higher in the left atrium before birth, so flow goes left to right","The ductus arteriosus closes the foramen ovale","The stiff septum secundum collapses against the thin septum primum","The thin septum primum collapses against the stiff septum secundum, blocking backflow to the right atrium"],"a":4,"qk":"태아의 심방 중격 배열이 우심방 → 좌심방 방향으로만 혈액이 흐르게 하는 이유는?","ok":["심내막 쿠션이 좌→우 흐름을 막는다","출생 전 좌심방 압력이 항상 높아 좌→우로 흐른다","동맥관이 타원구멍을 닫는다","단단한 이차중격이 얇은 일차중격에 눌려 붙는다","얇은 일차중격(septum primum)이 단단한 이차중격(septum secundum)에 눌려 붙어 우심방으로의 역류를 막는다"],"exp":"이 배열은 **우심방(RA)에서 좌심방(LA)으로** 혈액이 흐르게 하지만 **반대 방향은 막습니다**.\n\n- **얇은 일차중격(thin septum primum)**이 **단단한 이차중격(stiff septum secundum)**에 **눌려 붙어(collapses against)** 우심방으로의 역류를 효과적으로 막습니다.\n- 즉 일차중격이 타원구멍의 **일방향 판막(flap)**처럼 작동합니다.\n\n애니메이션 색: 파랑 = 일차중격, 초록 = 이차중격, 빨강 = 혈류.","why":{"0":"심내막 쿠션은 방실관을 나누는 구조입니다.","1":"태아에서 흐름은 우→좌입니다.","2":"동맥관은 폐동맥과 대동맥을 잇는 별도의 우회로입니다.","3":"얇은 쪽(일차중격)이 단단한 쪽(이차중격)에 붙습니다."},"one":"얇은 일차중격이 단단한 이차중격에 눌려 붙어 RA → LA 일방향 흐름을 만든다.","src":"Cardiovascular System.pdf, slide 20, 19","img":[{"u":"img/w12_cv_dev/p20.webp","cap":"Cardiovascular System.pdf, slide 20"},{"u":"img/w12_cv_dev/p19.webp","cap":"Cardiovascular System.pdf, slide 19"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-16":{"q":"How is the atrioventricular canal divided?","o":["All four cushions fuse in the midline","It is surrounded by four endocardial cushions; the dorsal and ventral cushions project further into the lumen and fuse to form a septum, while the two lateral cushions never fuse","The truncus arteriosus divides it","Only the lateral cushions fuse","The septum secundum grows down to divide it"],"a":1,"qk":"방실관(atrioventricular canal)은 어떻게 나뉘는가?","ok":["네 쿠션이 모두 정중선에서 융합한다","네 개의 심내막 쿠션으로 둘러싸이며, 등쪽과 배쪽 쿠션이 내강으로 더 튀어나와 융합해 중격을 만들고, 두 개의 옆쪽 쿠션은 결코 융합하지 않는다","동맥줄기가 나눈다","옆쪽 쿠션만 융합한다","이차중격이 아래로 자라 나눈다"],"exp":"**방실관(atrioventricular canal)**은 **네 개의 심내막 쿠션(endocardial cushions)**으로 둘러싸여 있습니다.\n\n1. **등쪽(dorsal)과 배쪽(ventral) 쿠션**이 내강으로 더 튀어나와 **융합 → 중격(septum)**\n   - **두 옆쪽 쿠션(좌·우 심내막 쿠션)은 결코 융합하지 않습니다**.\n2. **방실판막(atrioventricular valves)**은 **심실 쪽에서 \"파내어져(hollowed out)\"** 만들어집니다.\n3. 중격 형성으로 심방에서 원시 심실로 가는 **두 개의 흐름길(two flow tracts)**이 생겨 **두 개의 분리된 흐름**이 확립됩니다.","why":{"0":"등쪽·배쪽 쿠션만 융합합니다.","2":"동맥줄기는 유출로입니다.","3":"옆쪽 쿠션은 융합하지 않습니다.","4":"이차중격은 심방 중격 구조입니다."},"one":"방실관: 네 심내막 쿠션 중 등쪽·배쪽이 융합해 중격을 만들고, 옆쪽 둘은 융합하지 않으며, 방실판막은 심실 쪽에서 파내어진다.","src":"Cardiovascular System.pdf, slide 21","img":[{"u":"img/w12_cv_dev/p21.webp","cap":"Cardiovascular System.pdf, slide 21"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-17":{"q":"From which side are the atrioventricular valves \"hollowed out\"?","o":["From the pericardial side","From the atrial side","From the truncus arteriosus","From the ventricular side","From the sinus venosus"],"a":3,"qk":"방실판막(atrioventricular valves)은 어느 쪽에서 \"파내어지는가(hollowed out)\"?","ok":["심막 쪽","심방 쪽","동맥줄기 쪽","심실 쪽","정맥동 쪽"],"exp":"**방실판막(atrioventricular valves)**은 **심실 쪽(ventricular side)에서 \"파내어져(hollowed out)\"** 만들어집니다.\n\n같은 단계에서 등쪽·배쪽 심내막 쿠션이 융합해 중격을 만들어, 심방에서 원시 심실로 가는 **두 개의 흐름길**이 생깁니다.","why":{"0":"심막 쪽이 아닙니다.","1":"심방 쪽이 아니라 심실 쪽입니다.","2":"동맥줄기는 유출로이며, 방실판막과 무관합니다.","4":"정맥동은 유입부입니다."},"one":"방실판막은 심실 쪽에서 파내어진다.","src":"Cardiovascular System.pdf, slide 21","img":[{"u":"img/w12_cv_dev/p21.webp","cap":"Cardiovascular System.pdf, slide 21"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-18":{"q":"How is ventricular septation initiated?","o":["A protrusion between the presumptive right and left ventricles, the muscular interventricular septum, forms as flow through the two AV tracts expands the lateral ventricular walls","The aorticopulmonary septum grows down to divide the ventricles first","The lateral endocardial cushions fuse in the ventricle","The membranous septum forms first from the septum primum","The septum transversum invaginates into the ventricle"],"a":0,"qk":"심실 중격 형성(ventricular septation)은 어떻게 시작되는가?","ok":["미래의 좌우 심실 사이에 돌출부인 근육성 심실사이중격(muscular interventricular septum)이 생기며, 두 방실 흐름길을 통한 흐름이 양쪽 심실의 옆벽을 넓혀 위로 뻗는 근육성 중격을 만든다","대동맥폐동맥중격이 먼저 아래로 자라 심실을 나눈다","옆쪽 심내막 쿠션이 심실 안에서 융합한다","막성 중격이 일차중격에서 먼저 생긴다","가로중격이 심실로 함입한다"],"exp":"**심실 중격 형성(septation of the ventricles)**은 **심실 유출로(ventricular outflow pathways)** 형성과 통합되어 진행됩니다.\n\n1. **시작(initiation)**: 미래의 좌우 심실 사이의 **돌출부**, 즉 **근육성 심실사이중격(muscular interventricular septum)**\n   - **두 방실 흐름길(two atrio-ventricular tracts)**을 통한 흐름이 **두 심실의 옆벽을 넓혀** 위로 뻗는 **근육성 심실중격**을 만듭니다.\n\n이후 유출로 중격, 마지막으로 막성 중격이 완성합니다.","why":{"1":"대동맥폐동맥중격은 유출로를 나누고 나중에 근육성 중격과 융합합니다.","2":"옆쪽 쿠션은 융합하지 않습니다.","3":"막성 중격은 마지막 완성 단계입니다.","4":"가로중격은 횡격막 일부가 됩니다."},"one":"심실 중격은 두 방실 흐름이 옆벽을 넓히면서 생기는 근육성 심실사이중격으로 시작한다.","src":"Cardiovascular System.pdf, slide 22","img":[{"u":"img/w12_cv_dev/p22.webp","cap":"Cardiovascular System.pdf, slide 22"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-19":{"q":"How is the cardiac outflow tract divided?","o":["The outflow tract is never divided","The ductus arteriosus splits the truncus","Paired endocardial-covered conotruncal swellings (right and left bulbar ridges) grow inward and fuse into a spiral aorticopulmonary septum, which fuses with the muscular ventricular septum","The four AV cushions fuse inside the truncus in a straight line","The septum primum grows into the truncus"],"a":2,"qk":"심장 유출로(cardiac outflow tract)는 어떻게 나뉘는가?","ok":["유출로는 나뉘지 않는다","동맥관이 동맥줄기를 가른다","심내막으로 덮인 한 쌍의 원뿔동맥줄기 팽대(conotruncal swellings, 좌우 심장구 능선 bulbar ridges)가 안쪽으로 자라 융합해 나선형 대동맥폐동맥중격(aorticopulmonary septum)이 되고, 근육성 심실중격과 융합한다","네 방실 쿠션이 동맥줄기 안에서 일직선으로 융합한다","일차중격이 동맥줄기로 자란다"],"exp":"**유출로 중격 형성(septation of outflow tract)**:\n- 심장 유출로는 **심내막으로 덮인 한 쌍의 원뿔동맥줄기 팽대(conotruncal swellings)**로 나뉩니다.\n- 이 팽대는 원뿔동맥줄기 분절을 따라 안쪽으로 자랍니다(\"**수렴하는 흐름이 빚어냄** molded by convergent flow\").\n- 결국 융합해 **좌우 심장구 능선(R/L bulbar ridges)**에서 **대동맥폐동맥중격(aorticopulmonary septum)**을 만듭니다.\n- **나선형 흐름(spiral flow)**이 유출로의 **나선형 중격**을 만들고, 이것이 **근육성 심실중격과 융합**해 두 평행 심장 회로의 분리를 완성합니다(위로 흐르는 두 개의 평행한 정원 호스 비유).\n- 나선형이기 때문에 좌우 심실과 혈관의 해부학적 관계가 \"**바뀝니다(swaps)**\". 애니메이션 색: 초록 = 오른쪽 심장구 능선, 노랑 = 왼쪽 심장구 능선.","why":{"0":"유출로는 대동맥과 폐동맥줄기로 나뉩니다.","1":"동맥관은 6번 대동맥궁에서 오는 혈관입니다.","3":"방실 쿠션은 방실관을 나누며, 유출로 중격은 나선형입니다.","4":"일차중격은 심방을 나눕니다."},"one":"좌우 심장구 능선(원뿔동맥줄기 팽대)이 융합해 나선형 대동맥폐동맥중격을 만들고 근육성 심실중격과 융합한다.","src":"Cardiovascular System.pdf, slide 23, 24","img":[{"u":"img/w12_cv_dev/p23.webp","cap":"Cardiovascular System.pdf, slide 23"},{"u":"img/w12_cv_dev/p24.webp","cap":"Cardiovascular System.pdf, slide 24"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-20":{"q":"What completes ventricular septation, and which is the most common heart malformation?","o":["The muscular septum alone; patent ductus arteriosus (~25%)","The septum transversum; coarctation of the aorta","The septum secundum; atrial septal defects (~75%)","The septum primum; tetralogy of Fallot (~50%)","The membranous ventricular septum, which lets the muscular septum fuse with the conotruncal septum; VSDs (~25%), most often in the membranous septum"],"a":4,"qk":"심실 중격 형성을 완성하는 것은 무엇이며, 가장 흔한 심장 기형은?","ok":["근육성 중격 단독; 동맥관 개존(약 25%)","가로중격; 대동맥 축착","이차중격; 심방중격결손(약 75%)","일차중격; 팔로4징(약 50%)","막성 심실중격(membranous ventricular septum)이 근육성 중격과 원뿔동맥줄기 중격의 융합을 가능하게 한다; 심실중격결손(VSD, 약 25%), 막성 중격에서 가장 흔함"],"exp":"**심실 중격 형성의 완성(completion)**:\n- **막성 심실중격(membranous ventricular septum)**이 발생하면서 심실 분리가 완성됩니다.\n- 막성 중격은 **근육성 심실사이중격이 원뿔동맥줄기 중격(conotruncal septum)과 융합**하도록 해 **완전한 심실사이중격**을 만듭니다.\n\n**심실중격결손(ventricular septal defects, VSDs)**은 **가장 흔한 심장 기형(~25%)**이며, 결손은 **막성 중격(membranous septum)**과 가장 흔히 관련됩니다.","why":{"0":"완성은 막성 중격이 하며, 가장 흔한 기형은 VSD입니다.","1":"가로중격은 횡격막 일부입니다.","2":"이차중격은 심방 구조이며, 가장 흔한 기형은 VSD입니다.","3":"일차중격은 심방 구조이며, 팔로4징은 가장 흔한 청색증 선천 심장 기형입니다."},"one":"막성 심실중격이 심실 중격을 완성하고, VSD(약 25%, 주로 막성 부위)가 가장 흔한 심장 기형이다.","src":"Cardiovascular System.pdf, slide 25","img":[{"u":"img/w12_cv_dev/p25.webp","cap":"Cardiovascular System.pdf, slide 25"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-21":{"q":"When and where do blood vessels form by vasculogenesis, and what are endothelial precursor cells (EPCs)?","o":["In the ectoderm by day 5; EPCs are fibroblasts","In the heart tube only, at birth; EPCs are cardiomyocytes","Throughout the endoderm by day 30; EPCs are erythrocytes","Throughout the intraembryonic mesoderm by day 18; EPCs are the same as angioblasts","Only in the yolk sac at week 8; EPCs are neural crest cells"],"a":3,"qk":"혈관형성(vasculogenesis)으로 혈관은 언제, 어디에서 생기며, 내피 전구세포(EPCs)란 무엇인가?","ok":["5일째까지 외배엽에서; EPC는 섬유모세포이다","출생 시 심장관에서만; EPC는 심근세포이다","30일째까지 내배엽 전체에서; EPC는 적혈구이다","18일째까지 배아내 중배엽 전체에서; EPC는 혈관모세포(angioblasts)와 같다","8주에 난황낭에서만; EPC는 신경능선 세포이다"],"exp":"**혈관 발생(vascular development)**:\n- 혈관은 **혈관형성(vasculogenesis)**이라는 과정으로 생깁니다.\n- **18일째까지(by day 18)** **배아내 중배엽(intraembryonic mesoderm) 전체**에 발생하며\n- 합쳐져(coalesce) 퍼져 있는 혈관망을 만듭니다.\n\n**내피 전구세포(endothelial precursor cells, EPCs)는 혈관모세포(angioblasts)와 같습니다.**","why":{"0":"외배엽이 아니라 중배엽이며, EPC는 섬유모세포가 아닙니다.","1":"심장관만이 아니며, EPC는 심근세포가 아닙니다.","2":"내배엽이 아니라 중배엽이며, EPC는 적혈구가 아닙니다.","4":"배아내 중배엽 전체에서 18일째까지이며, EPC는 혈관모세포입니다."},"one":"혈관형성은 18일째까지 배아내 중배엽 전체에서 일어나며, EPC = 혈관모세포.","src":"Cardiovascular System.pdf, slide 27","img":[{"u":"img/w12_cv_dev/p27.webp","cap":"Cardiovascular System.pdf, slide 27"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-22":{"q":"The vascular network grows and spreads by four main processes. Which is correctly defined?","o":["Angiogenesis is budding and sprouting of new vessels; vascular intussusception is splitting of existing vessels into new vessels","Angiogenesis is splitting of vessels; intussusception is sprouting","Intercalation is the death of EPCs","Vasculogenesis is the closure of the ductus arteriosus","Intussusception is the fusion of endocardial cushions"],"a":0,"qk":"혈관망은 네 가지 주요 과정으로 자라고 퍼진다. 정의가 옳은 것은?","ok":["혈관신생(angiogenesis)은 새 혈관의 출아와 발아, 혈관 중첩(vascular intussusception)은 기존 혈관이 갈라져 새 혈관이 되는 것","혈관신생은 혈관의 분할이고, 중첩은 발아이다","삽입(intercalation)은 EPC의 사멸이다","혈관형성은 동맥관의 폐쇄이다","중첩은 심내막 쿠션의 융합이다"],"exp":"혈관망이 자라고 퍼지는 **네 가지 주요 과정**:\n1. **EPC의 지속적 형성, 이동, 합쳐짐(continued formation, migration, and coalescence of EPCs)**\n2. **혈관신생(angiogenesis)**: 새 혈관의 **출아와 발아(budding and sprouting)**\n3. **혈관 중첩(vascular intussusception)**: **기존 혈관이 갈라져(split)** 새 혈관이 됨\n4. **삽입(intercalation)**: 새 EPC가 **기존 혈관 벽에 끼어 들어감**","why":{"1":"정의가 뒤바뀌었습니다.","2":"삽입은 새 EPC가 기존 혈관 벽에 끼어 들어가는 것입니다.","3":"혈관형성은 중배엽에서 혈관이 생기는 과정입니다.","4":"중첩은 기존 혈관이 갈라지는 것입니다."},"one":"네 과정: EPC 형성·이동·합침, 혈관신생(발아), 혈관 중첩(분할), 삽입(새 EPC가 벽에 끼어듦).","src":"Cardiovascular System.pdf, slide 27","img":[{"u":"img/w12_cv_dev/p27.webp","cap":"Cardiovascular System.pdf, slide 27"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-23":{"q":"What are the fates of the 1st and 2nd aortic arches?","o":["1st → common carotid; 2nd → subclavian","1st → ductus arteriosus; 2nd → maxillary artery","1st → pulmonary arteries; 2nd → aortic arch","Both persist as the internal carotid arteries","Both largely disappear; a small portion of the 1st persists as the maxillary artery, and the 2nd leaves a transient remnant, the stapedial artery"],"a":4,"qk":"1번과 2번 대동맥궁(aortic arches)의 운명은?","ok":["1번 → 온목동맥; 2번 → 빗장밑동맥","1번 → 동맥관; 2번 → 위턱동맥","1번 → 폐동맥; 2번 → 대동맥활","둘 다 속목동맥으로 남는다","둘 다 대부분 사라진다; 1번의 작은 부분은 위턱동맥(maxillary a.)으로 남고, 2번은 일시적 잔재인 등자동맥(stapedial a.)을 남긴다"],"exp":"**동맥계의 발생**은 주로 **한 쌍의 등쪽대동맥(paired dorsal aortae)**에서 유래합니다.\n\n**대동맥궁(aortic arches)**은 **대동맥낭(aortic sac)**에서 나와 **등쪽대동맥**에서 끝나며, **배아의 접힘**으로 생기고, 위가슴과 목의 큰 동맥계로 **재구성**됩니다.\n\n- **1번**: 사라짐 [작은 부분이 남아 **위턱동맥(maxillary a.)**]\n- **2번**: 사라짐 [일시적 잔재 **등자동맥(stapedial a.)** – 등자뼈의 구멍을 만듦]\n- 3번: 온목동맥 & 속목동맥 근위부\n- 4번: 왼쪽 → 대동맥활, 오른쪽 → 빗장밑동맥 근위부\n- 5번: 사실상 없음(조류 발생학에서 발견)\n- 6번: 폐동맥\n\n**다섯 개의 궁이 한꺼번에 존재하는 일은 결코 없습니다!**","why":{"0":"온목동맥은 3번, 빗장밑동맥 근위부는 4번(오른쪽)입니다.","1":"동맥관은 6번에서 옵니다.","2":"폐동맥은 6번, 대동맥활은 4번(왼쪽)입니다.","3":"속목동맥 근위부는 3번에서 옵니다."},"one":"1번 → 위턱동맥(작은 잔재), 2번 → 등자동맥(일시적 잔재), 대동맥궁이 한꺼번에 모두 있지는 않다.","src":"Cardiovascular System.pdf, slide 28","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-24":{"q":"Which aortic arch forms the common carotid arteries and the proximal segment of the internal carotid arteries?","o":["1st","3rd","6th","4th","5th"],"a":1,"qk":"온목동맥(common carotid arteries)과 속목동맥(internal carotid arteries)의 근위부를 만드는 대동맥궁은?","ok":["1번","3번","6번","4번","5번"],"exp":"**3번 대동맥궁(3rd arches)** → **온목동맥(common carotid arteries)**과 **속목동맥의 근위부(proximal segment of internal carotid arteries)**.\n\n비교:\n- 1번 → 위턱동맥(작은 잔재)\n- 4번 → 왼쪽 대동맥활 일부, 오른쪽 빗장밑동맥 근위부\n- 5번 → 사실상 없음\n- 6번 → 폐동맥(왼쪽 원위부는 출생 때까지 동맥관으로 남음)","why":{"0":"1번은 위턱동맥의 작은 잔재입니다.","2":"6번은 폐동맥입니다.","3":"4번은 대동맥활(왼쪽)과 빗장밑동맥 근위부(오른쪽)입니다.","4":"5번은 사실상 없습니다."},"one":"3번 대동맥궁 → 온목동맥 + 속목동맥 근위부.","src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28"},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-25":{"q":"What does the 4th aortic arch form on each side?","o":["It disappears on both sides","Left: the maxillary artery; right: the stapedial artery","Left: the aortic arch segment between the left common carotid and left subclavian arteries; right: the most proximal segment of the right subclavian artery","Both sides: the common carotid arteries","Left: the ductus arteriosus; right: the right pulmonary artery"],"a":2,"qk":"4번 대동맥궁은 각 쪽에서 무엇이 되는가?","ok":["양쪽 모두 사라진다","왼쪽: 위턱동맥; 오른쪽: 등자동맥","왼쪽: 왼온목동맥과 왼빗장밑동맥 사이의 대동맥활 부분; 오른쪽: 오른빗장밑동맥의 가장 근위부","양쪽: 온목동맥","왼쪽: 동맥관; 오른쪽: 오른폐동맥"],"exp":"**4번 대동맥궁(fourth arches)**:\n- **왼쪽(left)**: **왼온목동맥과 왼빗장밑동맥 사이의 대동맥활(aortic arch) 부분**\n- **오른쪽(right)**: **오른빗장밑동맥(right subclavian artery)의 가장 근위부**\n\n**6번(sixth arches)**과 비교:\n- 오른쪽: 근위부 → 오른폐동맥 근위부, 원위부는 일찍 사라짐\n- 왼쪽: 근위부 → 왼폐동맥 근위부, **원위부는 출생 때까지 남음**(동맥관 ductus arteriosus)","why":{"0":"4번은 사라지지 않고 대동맥활과 빗장밑동맥 근위부가 됩니다.","1":"위턱동맥은 1번, 등자동맥은 2번입니다.","3":"온목동맥은 3번입니다.","4":"동맥관과 폐동맥은 6번입니다."},"one":"4번 대동맥궁: 왼쪽 → 대동맥활 일부, 오른쪽 → 오른빗장밑동맥 근위부.","src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28"},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-26":{"q":"What is the fate of the 6th aortic arches?","o":["They disappear completely on both sides","They form the pulmonary arteries; on the left the distal part persists until birth as the ductus arteriosus, while on the right the distal part disappears early","They form the maxillary and stapedial arteries","They form the right subclavian artery","They form the common carotid arteries"],"a":1,"qk":"6번 대동맥궁의 운명은?","ok":["양쪽 모두 완전히 사라진다","폐동맥이 된다; 왼쪽 원위부는 출생 때까지 동맥관(ductus arteriosus)으로 남고, 오른쪽 원위부는 일찍 사라진다","위턱동맥과 등자동맥이 된다","오른빗장밑동맥이 된다","온목동맥이 된다"],"exp":"**6번 대동맥궁(sixth arches)** → **폐동맥(pulmonary arteries)**.\n- **오른쪽**: 근위부 → **오른폐동맥 근위부**, 원위부는 **일찍 사라짐**\n- **왼쪽**: 근위부 → **왼폐동맥 근위부**, 원위부는 **출생 때까지 남음** → **동맥관(ductus arteriosus)**\n\n출생 후 동맥관은 **동맥관인대(ligamentum arteriosum)**가 됩니다.\n\n참고로 **5번은 사실상 없고(조류 발생학에서 발견)**, **다섯 궁이 한꺼번에 존재하지는 않습니다**.","why":{"0":"6번은 폐동맥과 동맥관으로 남습니다.","2":"위턱동맥은 1번, 등자동맥은 2번입니다.","3":"오른빗장밑동맥 근위부는 4번(오른쪽)입니다.","4":"온목동맥은 3번입니다."},"one":"6번 대동맥궁 → 폐동맥, 왼쪽 원위부는 동맥관(출생 후 동맥관인대).","src":"Cardiovascular System.pdf, slide 28, 30","img":[{"u":"img/w12_cv_dev/p28.webp","cap":"Cardiovascular System.pdf, slide 28"},{"u":"img/w12_cv_dev/p30.webp","cap":"Cardiovascular System.pdf, slide 30"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-27":{"q":"Which statement about the pharyngeal arches is correct?","o":["Their largest component is the cartilage","They have only muscle components","They support the walls of the hindgut","They support the lateral walls of the primordial pharynx (from the cranial foregut), and each has nerve, blood vessel and cartilage components, the largest being the artery of the aortic arch","They derive from the caudal midgut"],"a":3,"qk":"인두궁(pharyngeal arches)에 대한 설명으로 옳은 것은?","ok":["가장 큰 성분은 연골이다","근육 성분만 있다","뒤창자 벽을 받친다","앞창자 머리쪽에서 유래한 원시 인두의 옆벽을 받치며, 각 궁은 신경·혈관·연골 성분을 갖고, 가장 큰 성분은 대동맥궁의 동맥이다","중간창자 꼬리쪽에서 유래한다"],"exp":"**미리보기(preview)**:\n- **인두궁(pharyngeal arches)**은 **원시 인두(primordial pharynx)의 옆벽**을 받칩니다. 원시 인두는 **앞창자(foregut)의 머리쪽**에서 유래합니다.\n- **각 궁에는 신경(nerve), 혈관(blood vessel), 연골(cartilage) 성분**이 있으며, **가장 큰 성분은 대동맥궁의 동맥(artery of the aortic arch)**입니다.","why":{"0":"가장 큰 성분은 동맥입니다.","1":"신경·혈관·연골 성분이 있습니다.","2":"뒤창자가 아니라 원시 인두(앞창자 머리쪽)입니다.","4":"앞창자 머리쪽입니다."},"one":"인두궁은 원시 인두 옆벽을 받치며, 신경·혈관·연골 성분 중 가장 큰 것은 대동맥궁 동맥이다.","src":"Cardiovascular System.pdf, slide 29","img":[{"u":"img/w12_cv_dev/p29.webp","cap":"Cardiovascular System.pdf, slide 29"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-28":{"q":"What do the vitelline arteries form?","o":["The coronary arteries","The internal iliac arteries","The celiac (foregut), superior mesenteric (midgut) and inferior mesenteric (hindgut) arteries","The common carotid arteries","The pulmonary arteries"],"a":2,"qk":"난황동맥(vitelline arteries)은 무엇이 되는가?","ok":["관상동맥","속엉덩동맥","복강동맥(앞창자), 위창자간막동맥(중간창자), 아래창자간막동맥(뒤창자)","온목동맥","폐동맥"],"exp":"**난황동맥(vitelline arteries)**은 **난황낭(yolk sac)**에서 생기고 연관되어 있으며, **점차 융합해** 다음이 됩니다.\n- **복강동맥(celiac a.)** → **앞창자(foregut)**\n- **위창자간막동맥(superior mesenteric a.)** → **중간창자(midgut)**\n- **아래창자간막동맥(inferior mesenteric a.)** → **뒤창자(hindgut)**","why":{"0":"관상동맥은 난황동맥의 운명으로 제시되지 않습니다.","1":"속엉덩동맥은 배꼽동맥의 근위부에서 옵니다.","3":"온목동맥은 3번 대동맥궁에서 옵니다.","4":"폐동맥은 6번 대동맥궁에서 옵니다."},"one":"난황동맥 → 복강동맥(앞창자), 위창자간막동맥(중간창자), 아래창자간막동맥(뒤창자).","src":"Cardiovascular System.pdf, slide 31","img":[{"u":"img/w12_cv_dev/p31.webp","cap":"Cardiovascular System.pdf, slide 31"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-29":{"q":"What do the umbilical arteries become?","o":["The celiac trunk and superior mesenteric artery","Fossa ovalis","Ligamentum arteriosum","Ligamentum teres and ligamentum venosum","Proximal portions become the internal iliac arteries (and the superior vesical artery); distal parts become the medial umbilical ligaments"],"a":4,"qk":"배꼽동맥(umbilical arteries)은 무엇이 되는가?","ok":["복강동맥과 위창자간막동맥","타원오목","동맥관인대","간원인대와 정맥관인대","근위부는 속엉덩동맥(과 위방광동맥)이 되고, 원위부는 안쪽배꼽인대(medial umbilical ligament)가 된다"],"exp":"**배꼽동맥(umbilical arteries)**:\n- **근위부(proximal portions)** → **속엉덩동맥(internal iliac aa.)**\n- **원위부(distal parts)** → **안쪽배꼽인대(medial umbilical ligament)**\n\n출생 시 변화에서도: 배꼽동맥 → **안쪽배꼽인대**, 근위부는 **위방광동맥(superior vesical a.)**으로 남습니다.","why":{"0":"복강동맥과 위창자간막동맥은 난황동맥에서 옵니다.","1":"타원오목은 타원구멍의 잔재입니다.","2":"동맥관인대는 동맥관의 잔재입니다.","3":"간원인대와 정맥관인대는 배꼽정맥과 정맥관의 잔재입니다."},"one":"배꼽동맥: 근위부 → 속엉덩동맥(위방광동맥), 원위부 → 안쪽배꼽인대.","src":"Cardiovascular System.pdf, slide 31, 35","img":[{"u":"img/w12_cv_dev/p31.webp","cap":"Cardiovascular System.pdf, slide 31"},{"u":"img/w12_cv_dev/p35.webp","cap":"Cardiovascular System.pdf, slide 35"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-30":{"q":"The venous systems are at first bilaterally symmetrical. Which describes the vitelline and umbilical systems?","o":["Vitelline drains the GI tract and gut derivatives (right vein → portal system and part of IVC; left degenerates); umbilical carries oxygenated blood from the placenta (right disappears; left anastomoses with the ductus venosus)","Both left veins persist and both right veins disappear in each system","Vitelline carries oxygenated blood from the placenta; umbilical drains the gut","Umbilical drains the head and neck","Vitelline drains the body wall"],"a":0,"qk":"정맥계는 처음에 좌우대칭이다. 난황정맥계와 배꼽정맥계에 대한 설명으로 옳은 것은?","ok":["난황정맥계는 위장관과 장 유도체를 배출(오른쪽 → 문맥계와 아래대정맥 일부, 왼쪽은 퇴화); 배꼽정맥계는 태반에서 산소가 풍부한 혈액을 운반(오른쪽은 사라지고, 왼쪽은 정맥관과 문합)","두 계통 모두 왼쪽이 남고 오른쪽이 사라진다","난황정맥계가 태반의 산소화 혈액을 운반하고, 배꼽정맥계가 장을 배출한다","배꼽정맥계가 머리와 목을 배출한다","난황정맥계가 몸벽을 배출한다"],"exp":"**정맥계(venous systems)**는 처음에 **좌우대칭**이며 세 주요 성분으로 이루어집니다.\n\n1. **난황정맥계(vitelline system)**: **위장관과 장 유도체**를 배출\n   - **오른난황정맥**: 머리쪽 부분 → **문맥계(portal system)와 아래대정맥(IVC) 일부**\n   - **왼난황정맥**: **퇴화(degenerates)**\n2. **배꼽정맥계(umbilical system)**: **태반에서 산소가 풍부한 혈액**을 운반\n   - **오른배꼽정맥**: **사라짐**\n   - **왼배꼽정맥**: **정맥관(ductus venosus)과 문합** → **간원인대(ligt. teres)와 정맥관인대(ligt. venosum)**\n3. **주정맥계(cardinal system)**: 머리, 목, 몸벽을 배출","why":{"1":"난황정맥계는 오른쪽이 남고 왼쪽이 퇴화합니다.","2":"역할이 뒤바뀌었습니다.","3":"머리와 목은 앞주정맥이 배출합니다.","4":"몸벽은 주정맥계가 배출합니다."},"one":"난황: 장 배출, 오른쪽 → 문맥·IVC 일부. 배꼽: 태반 산소화 혈액, 왼쪽 + 정맥관 → 간원인대·정맥관인대.","src":"Cardiovascular System.pdf, slide 32","img":[{"u":"img/w12_cv_dev/p32.webp","cap":"Cardiovascular System.pdf, slide 32"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-31":{"q":"What does the cardinal venous system drain?","o":["The placenta","The head, neck and body wall: posterior cardinal veins drain the trunk (intercostal, iliac veins) and anterior cardinal veins drain the head and neck (jugular, subclavian veins)","The yolk sac only","The GI tract only","The lungs"],"a":1,"qk":"주정맥계(cardinal system)는 무엇을 배출하는가?","ok":["태반","머리, 목, 몸벽: 뒤주정맥은 몸통(갈비사이정맥, 엉덩정맥), 앞주정맥은 머리와 목(목정맥, 빗장밑정맥)을 배출","난황낭만","위장관만","폐"],"exp":"**주정맥계(cardinal system)**는 **머리, 목, 몸벽(head, neck, and body wall)**을 배출합니다.\n- **뒤주정맥(posterior cardinal vv.)** → **몸통(trunk)** 배출(갈비사이정맥 intercostal, 엉덩정맥 iliac veins)\n- **앞주정맥(anterior cardinal vv.)** → **머리와 목** 배출(목정맥 jugular, 빗장밑정맥 subclavian veins)","why":{"0":"태반의 혈액은 배꼽정맥계가 운반합니다.","2":"난황낭과 장은 난황정맥계입니다.","3":"위장관은 난황정맥계가 배출합니다.","4":"폐는 주정맥계의 배출 영역으로 제시되지 않습니다."},"one":"주정맥계: 뒤주정맥 → 몸통, 앞주정맥 → 머리·목.","src":"Cardiovascular System.pdf, slide 32","img":[{"u":"img/w12_cv_dev/p32.webp","cap":"Cardiovascular System.pdf, slide 32"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-32":{"q":"As venous inflow shifts to the right, what happens to the left sinus horn?","o":["It becomes the terminal segment of the IVC","It becomes the right atrium","It stops growing and becomes a small venous sac on the posterior wall of the heart, giving rise to the coronary sinus and the oblique vein of the left atrium","It becomes the superior vena cava","It becomes the ductus venosus"],"a":2,"qk":"정맥 유입이 오른쪽으로 이동하면서 왼정맥동뿔(left sinus horn)은 어떻게 되는가?","ok":["아래대정맥의 끝부분이 된다","우심방이 된다","성장을 멈추고 심장 뒤벽의 작은 정맥낭이 되어 관상정맥동(coronary sinus)과 좌심방빗정맥(oblique vein of the left atrium)을 만든다","위대정맥이 된다","정맥관이 된다"],"exp":"**정맥계(venous system)**: 복잡한 재구성을 거쳐 **모든 체정맥 혈액이 새로 생긴 위·아래대정맥을 통해 우심방으로** 들어갑니다.\n\n- **정맥 유입이 오른쪽으로 이동**하면서 **왼정맥동뿔(left sinus horn)은 성장을 멈춥니다**.\n- 심장 **뒤벽의 작은 정맥낭**으로 바뀌고\n- 이것이 **관상정맥동(coronary sinus)**과 **좌심방빗정맥(oblique vein of the left atrium)**을 만듭니다.\n- 또한 **오른난황정맥의 잔재가 아래대정맥(IVC)의 끝부분**이 됩니다.","why":{"0":"IVC 끝부분은 오른난황정맥의 잔재입니다.","1":"우심방은 정맥동(주로 오른쪽으로 이동한 유입)에서 옵니다.","3":"위대정맥은 왼정맥동뿔의 운명이 아닙니다.","4":"정맥관은 왼배꼽정맥과 문합하는 구조이며 정맥관인대가 됩니다."},"one":"왼정맥동뿔 → 관상정맥동 + 좌심방빗정맥; 오른난황정맥 잔재 → IVC 끝부분; 모든 체정맥 혈액은 SVC·IVC로 우심방에 들어간다.","src":"Cardiovascular System.pdf, slide 33","img":[{"u":"img/w12_cv_dev/p33.webp","cap":"Cardiovascular System.pdf, slide 33"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-33":{"q":"Fetal circulation is described as a remarkable example of economy in nature. What does it achieve?","o":["It sends the best-oxygenated blood to the lungs first","It sends all placental blood to the liver for storage","It sends desaturated blood to the brain","It shunts well-oxygenated blood from the placenta to the brain and heart, leaving relatively desaturated blood for less essential structures such as the lungs and liver","It keeps systemic and pulmonary circulations fully separate before birth"],"a":3,"qk":"태아 순환(fetal circulation)은 자연의 놀라운 경제성의 예로 설명된다. 무엇을 이루는가?","ok":["가장 산소가 풍부한 혈액을 먼저 폐로 보낸다","태반 혈액을 모두 간에 저장한다","산소가 적은 혈액을 뇌로 보낸다","태반에서 온 산소가 풍부한 혈액을 뇌와 심장으로 보내고, 상대적으로 산소가 적은 혈액은 폐와 간처럼 덜 필수적인 구조에 남긴다","출생 전에 체순환과 폐순환을 완전히 분리한다"],"exp":"**태아 순환(fetal circulation)**은 **자연의 놀라운 경제성(economy in nature)**의 예입니다.\n\n- **태반에서 온 산소가 풍부한 혈액(well-oxygenated blood)**을 **뇌와 심장(brain and heart)**으로 **우회(shunting)**시키고\n- **상대적으로 산소가 적은 혈액(relatively desaturated blood)**은 **덜 필수적인 구조(예: 폐와 간 lungs and liver)**에 남깁니다.\n\n그림의 우회로: **타원구멍(foramen ovale)**, **동맥관(ductus arteriosus)**, 그리고 **배꼽동맥(umbilical arteries)**으로 태반에 돌아감.","why":{"0":"폐는 덜 필수적인 구조로 분류되어 상대적으로 산소가 적은 혈액을 받습니다.","1":"간도 상대적으로 산소가 적은 혈액을 받는 구조로 제시됩니다.","2":"산소가 풍부한 혈액이 뇌로 갑니다.","4":"태아에서는 타원구멍과 동맥관으로 두 순환이 연결되어 있습니다."},"one":"태아 순환: 산소가 풍부한 태반 혈액은 뇌와 심장으로, 산소가 적은 혈액은 폐와 간으로.","src":"Cardiovascular System.pdf, slide 34","img":[{"u":"img/w12_cv_dev/p34.webp","cap":"Cardiovascular System.pdf, slide 34"}],"ch":"w12_cv_dev","chn":"Development of the Cardiovascular System","week":12},"w12_cv_dev-34":{"q":"What causes the circulatory changes at birth?","o":["Closure of the septum transversum","Fusion of the endocardial cushions","Formation of the aortic arches","Rupture of t
