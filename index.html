ry Infections (handwritten).pdf, slide 81","img":[{"u":"img/w11_resp_inf/p81.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 81"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_resp_inf-30":{"q":"Atypical mycobacteria such as MAC (M. avium complex) are marked as having which set of properties?","o":["They are strictly human pathogens that never exist in the environment.","They are readily transmitted from person to person by respiratory droplets.","They are uniformly susceptible to standard RIPE anti-TB drugs.","They are the source organisms from which the BCG vaccine is made.","They are widespread environmental opportunists, especially in AIDS, that are not readily transmitted and are highly resistant to anti-TB drugs."],"a":4,"qk":"MAC(M. avium complex) 같은 비정형 마이코박테리아에 표시된 특성은 무엇입니까?","ok":["환경에는 전혀 없고 사람에게만 있는 병원체이다.","호흡기 비말로 사람 사이에 쉽게 전파된다.","표준 RIPE 항결핵제에 모두 감수성이다.","BCG 백신을 만드는 원료 균이다.","환경에 널리 있는 기회감염균으로, 특히 AIDS에서 문제를 일으키며, 사람 간 전파가 잘 안 되고 항결핵제에 강한 내성이 있다."],"exp":"비정형 마이코박테리아, 특히 **M. avium-intracellulare(MAC)**에 대해 다음이 동그라미 또는 밑줄로 표시되어 있습니다.\n\n· **환경(공기, 흙, 물 등)에 널리 분포**한다.\n· **기회감염균(opportunists)**이다.\n· **AIDS**와 연관된 결핵 비슷한 병을 일으킨다.\n· **사람 사이에 쉽게 전파되지 않는다(not readily transmitted)**.\n· **항결핵제에 강한 내성(highly resistant to anti-TB drugs)**이 있다.","why":{"0":"이 균들은 환경에 널리 있습니다. 사람만의 절대 병원체가 아닙니다.","1":"사람 간 전파가 잘 안 된다고 밑줄 쳐져 있습니다.","2":"항결핵제에 강한 내성이 있다고 밑줄 쳐져 있습니다. 표준 RIPE에 모두 듣지 않습니다.","3":"BCG의 원료는 M. bovis입니다. MAC이 아닙니다."},"one":"MAC은 환경에 널리 있는 기회감염균으로, AIDS에서 문제를 일으키고, 사람 간 전파가 잘 안 되며 항결핵제에 내성이다.","src":"6b. Respiratory Infections (handwritten).pdf, slide 82","img":[{"u":"img/w11_resp_inf/p82.webp","cap":"6b. Respiratory Infections (handwritten).pdf, slide 82"}],"ch":"w11_resp_inf","chn":"Respiratory Infections","week":11},"w11_pulm_phys-1":{"q":"What accounts for the difference between minute ventilation of alveoli and just ventilation?","o":["Breathing rate.","Anatomic dead space.","Tidal volume.","The FRC.","Forced vital capacity."],"a":1,"qk":"폐포 분당환기량(alveolar minute ventilation)과 그냥 분당환기량(minute ventilation)의 차이를 만드는 것은 무엇입니까?","ok":["호흡수(breathing rate)","해부학적 사강(anatomic dead space)","일회호흡량(tidal volume)","기능적 잔기량(FRC)","노력성 폐활량(forced vital capacity)"],"exp":"**핵심 공식**\n\n· 분당환기량(minute ventilation, VE) = 일회호흡량(tidal volume) × 호흡수(breathing rate)\n\n· 폐포 분당환기량(alveolar minute ventilation, VA) = (일회호흡량 − 사강 dead space) × 호흡수\n\n두 공식을 나란히 놓으면, 차이는 딱 하나 **사강(dead space)**뿐입니다. 숨을 한 번 쉬면 들이마신 공기 중 일부는 코·기관·기관지 같은 전도기도(conducting airways)에 그냥 머물렀다가 다시 나갑니다. 이 공기는 폐포(alveolus)까지 가지 못하므로 가스교환(gas exchange)에 쓰이지 않습니다. 이 부분이 해부학적 사강(anatomic dead space)입니다. 예를 들어 일회호흡량 500 mL, 사강 150 mL, 호흡수 12회라면 VE = 6,000 mL/min이지만 VA = 350 × 12 = 4,200 mL/min입니다. 차이 1,800 mL는 전부 사강 때문입니다.","why":{"0":"호흡수: 두 공식 모두에 똑같이 곱해지므로 \"차이\"를 만들지 않습니다.","2":"일회호흡량: 역시 두 공식 모두에 들어 있습니다. 차이를 만드는 것은 일회호흡량에서 빼는 사강입니다.","3":"FRC: 조용히 숨을 내쉰 뒤 폐에 남은 공기량으로, 환기량 공식과 관계가 없습니다.","4":"노력성 폐활량: 최대로 들이마신 뒤 힘껏 내쉰 양으로, 폐기능검사 지표이지 분당환기량 차이와는 무관합니다."},"one":"분당환기량과 폐포 분당환기량의 차이는 해부학적 사강(anatomic dead space) 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q1) / 8b. Pulmonary Physiology 2026.pdf, slide 10","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-2":{"q":"If CO2 production remains constant and alveolar ventilation is increased three-fold, the alveolar PCO2 after reaching a steady state will be what percentage of its former value?","o":["25","33","50","100","300"],"a":1,"qk":"CO₂ 생성량이 일정하게 유지되고 폐포환기량(alveolar ventilation)이 3배로 증가하면, 정상상태(steady state)에 도달한 후 폐포 PCO₂는 이전 값의 몇 %가 됩니까?","ok":["25","33","50","100","300"],"exp":"**핵심**\n\nCO₂ 생성량(VCO₂)이 일정하면 폐포 PCO₂(PACO₂)는 폐포환기량(VA)에 **반비례(inversely proportional)**합니다. 공식을 정리하면 PACO₂ = k × VCO₂/VA입니다.\n\nVA가 3배가 되면 PACO₂는 1/3, 즉 약 **33%**가 됩니다. 정상 40 mmHg라면 약 13 mmHg까지 떨어집니다. 쉽게 말하면, 몸이 만드는 CO₂ 양은 그대로인데 이를 씻어내는 공기를 3배로 넣어주니 폐포 안 CO₂ 농도가 1/3로 희석되는 것입니다.","why":{"0":"25: 4배로 증가했을 때의 값입니다.","2":"50: 2배로 증가했을 때의 값입니다.","3":"100: 환기량이 PCO₂에 영향을 주지 않는다는 뜻인데, 반비례 관계와 맞지 않습니다.","4":"300: 비례관계로 착각한 값입니다. 환기가 늘면 PCO₂는 오히려 줄어듭니다."},"one":"CO₂ 생성이 일정하면 폐포 PCO₂는 폐포환기량에 반비례하므로, 환기가 3배가 되면 PCO₂는 약 33%가 된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q2) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-3":{"q":"Which of the following is most likely to change during a heavy physical workout in a normal healthy individual?","o":["Anatomic dead space increases.","Alveolar ventilation increases.","Total lung volume decreases.","Tidal volume decreases.","Alveolar dead space ventilation increases."],"a":1,"qk":"정상적인 건강한 사람이 격렬한 운동을 할 때 가장 변할 가능성이 높은 것은 무엇입니까?","ok":["해부학적 사강이 증가한다.","폐포환기량(alveolar ventilation)이 증가한다.","총 폐용적(total lung volume)이 감소한다.","일회호흡량(tidal volume)이 감소한다.","폐포 사강 환기(alveolar dead space ventilation)가 증가한다."],"exp":"**정답 이유**\n\n운동하면 근육이 O₂를 많이 쓰고 CO₂를 많이 만듭니다. 몸은 동맥혈 PO₂와 PCO₂를 정상 범위로 유지하려고 일회호흡량과 호흡수를 조절합니다. 운동 중에는 일회호흡량과 호흡수가 모두 늘어 VA = (일회호흡량 − 사강) × 호흡수가 크게 **증가**합니다.","why":{"0":"해부학적 사강은 기도의 구조적 부피라 운동으로 의미 있게 늘지 않습니다.","2":"총 폐용적(TLC)은 폐의 최대 용량으로, 운동 한 번으로 줄어들지 않습니다.","3":"운동 중 일회호흡량은 오히려 증가합니다.","4":"폐포 사강(환기는 되나 관류가 안 되는 폐포)은 정상인에서 운동 시 늘지 않습니다. 오히려 심박출량이 늘어 폐 윗부분까지 혈류가 더 고르게 퍼지므로 줄어드는 쪽입니다. 폐포 사강 증가는 폐색전 같은 질환 상황입니다."},"one":"격렬한 운동 때는 일회호흡량과 호흡수가 늘어 폐포환기량(alveolar ventilation)이 증가한다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q3) / 8b. Pulmonary Physiology 2026.pdf, slides 10, 75","img":[{"u":"img/w11_pulm_phys/p10.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 10","w":1200,"h":900},{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-4":{"q":"What accounts for the difference in PO2 between dry ambient air and air in the conducting airways?","o":["The diluting effect of CO2.","Water vapor in the ambient air.","Water vapor in the conducting airways.","Turbulence in the larger airways.","Resistance in the small airways."],"a":2,"qk":"건조한 대기(dry ambient air)와 전도기도(conducting airways) 안 공기 사이의 PO₂ 차이를 만드는 것은 무엇입니까?","ok":["CO₂의 희석 효과","대기 중의 수증기","전도기도 안의 수증기","큰 기도의 난류(turbulence)","작은 기도의 저항(resistance)"],"exp":"**핵심 공식**\n\nPIO₂ = (Pₐₜₘ − PH₂O) × 0.21 = (760 − 47) × 0.21 ≈ **150 mmHg** (해수면)\n\n건조한 대기의 PO₂는 760 × 0.21 ≈ 160 mmHg입니다. 그런데 공기가 코와 기도를 지나면서 체온(37℃)으로 데워지고 **수증기(water vapor)로 완전히 포화**됩니다. 37℃에서 수증기압은 47 mmHg로 항상 일정합니다. 전체 압력(760)은 그대로인데 그중 47 mmHg를 수증기가 차지하니, 나머지 기체(O₂, N₂)가 나눠 가질 압력이 713 mmHg로 줄어듭니다. 그래서 O₂ 분압이 약 150 mmHg로 낮아집니다 (돌턴의 법칙 Dalton's law, 공식표).","why":{"0":"CO₂ 희석은 폐포(alveolus)에서 일어나는 일입니다. 폐포 기체 공식 PAO₂ = PIO₂ − PₐCO₂/R에서 150 → 100으로 떨어지는 단계입니다. 전도기도 단계에는 해당하지 않습니다.","1":"문제에서 \"건조한(dry)\" 대기라고 했으므로 대기 중 수증기는 없다고 봅니다.","3":"난류와 저항은 공기 흐름(airflow)에 영향을 줄 뿐 분압을 바꾸지 않습니다.","4":"난류와 저항은 공기 흐름(airflow)에 영향을 줄 뿐 분압을 바꾸지 않습니다."},"one":"건조한 대기와 전도기도 공기 사이 PO₂ 차이는 기도에서 포화되는 수증기(47 mmHg) 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q4) / 8b. Pulmonary Physiology 2026.pdf, slide 12","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-5":{"q":"Which statement best describes pulmonary surfactant?","o":["It is a secretory product of type I alveolar pneumocytes.","It increases the work required to expand the lung.","It decreases the work of breathing.","It increases the surface tension of the alveolar lining liquid.","It increases the movement of fluid from the capillaries into the alveolar spaces."],"a":2,"qk":"폐 표면활성제(pulmonary surfactant)를 가장 잘 설명하는 것은 무엇입니까?","ok":["제1형 폐포세포(type I alveolar pneumocytes)의 분비물이다.","폐를 팽창시키는 데 필요한 일을 증가시킨다.","호흡일(work of breathing)을 감소시킨다.","폐포 내면 액체의 표면장력(surface tension)을 증가시킨다.","모세혈관에서 폐포 공간으로의 액체 이동을 증가시킨다."],"exp":"**정답 이유**\n\n폐포 안쪽은 얇은 물층으로 덮여 있습니다. 물 분자끼리 서로 당기는 힘, 즉 **표면장력(surface tension)** 때문에 폐포는 계속 쪼그라들려고 합니다. 제2형 폐포세포(type II pneumocyte)가 분비하는 표면활성제는 이 표면장력을 **낮춥니다**. 그 결과 폐가 잘 부풀고(순응도 compliance ↑), 숨을 들이쉴 때 필요한 힘, 즉 **호흡일(work of breathing)이 줄어듭니다**. 그 밖에 작은 폐포가 찌그러지는 것을 막고, 폐부종을 막는 기능도 있습니다 (\"numerous important functions\").","why":{"0":"표면활성제는 제1형이 아니라 **제2형** 세포가 만듭니다. 제1형은 폐포 표면의 약 95%를 덮어 가스교환 면을 이룹니다.","1":"정반대입니다. 폐를 팽창시키는 일을 줄여줍니다.","3":"표면장력을 높이는 것이 아니라 낮춥니다.","4":"표면장력은 모세혈관 액체를 폐포 쪽으로 끌어당기는 힘으로도 작용합니다. 표면활성제는 이를 줄여 폐포로 액체가 새는 것(폐부종 pulmonary edema)을 **막는** 쪽입니다."},"one":"폐 표면활성제(surfactant)는 표면장력을 낮춰 호흡일(work of breathing)을 감소시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q5) / 8b. Pulmonary Physiology 2026.pdf, slides 23, 26, 27","img":[{"u":"img/w11_pulm_phys/p23.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 23","w":1200,"h":900},{"u":"img/w11_pulm_phys/p26.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 26","w":1200,"h":900},{"u":"img/w11_pulm_phys/p27.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 27","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-6":{"q":"Air hunger while hiking at high altitude is caused by","o":["inhalation of dry atmospheric air.","a lower fraction of O2 in the inspired mountain air.","increased CO2 content in the inspired mountain air.","increased barometric pressure.","decreased barometric pressure."],"a":4,"qk":"고지대 등산 중 숨이 차는 느낌(air hunger)의 원인은 무엇입니까?","ok":["건조한 대기를 들이마시는 것","산 공기의 흡입 O₂ 분율(fraction)이 더 낮은 것","산 공기의 CO₂ 함량 증가","기압(barometric pressure) 증가","기압(barometric pressure) 감소"],"exp":"**정답 이유 (공식표 PIO₂ = FIO₂ × (PB − PH₂O))**\n\n고지대에서도 공기 중 O₂ **비율(FIO₂)은 21%로 똑같습니다**. 달라지는 것은 전체 **기압(PB)**입니다. 높이 올라갈수록 기압이 낮아지므로, 같은 21%라도 실제 O₂ 분압(PIO₂)이 낮아집니다. 예를 들어 기압이 500 mmHg라면 PIO₂ = (500 − 47) × 0.21 ≈ 95 mmHg로, 해수면의 150보다 훨씬 낮습니다. 그 결과 흡입 PO₂ 감소(↓PIO₂)에 의한 저산소혈증(hypoxemia)이 생깁니다. 말초 화학수용체(peripheral chemoreceptor)가 이를 감지해 호흡을 재촉하면서 숨이 찬 느낌이 듭니다.","why":{"0":"들이마신 공기는 기도에서 어차피 수증기로 포화되므로 건조함 자체가 원인은 아닙니다.","1":"가장 흔한 함정입니다. 고지대에서도 O₂ **분율(%)은 0.21 그대로**입니다.","2":"산 공기의 CO₂ 함량은 거의 0으로 해수면과 같습니다.","3":"고지대에서는 기압이 증가하는 것이 아니라 감소합니다."},"one":"고지대 숨참은 산소 분율이 아니라 기압(barometric pressure) 감소로 흡입 PO₂가 낮아지기 때문이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q6) / 8b. Pulmonary Physiology 2026.pdf, slides 12, 65","img":[{"u":"img/w11_pulm_phys/p12.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 12","w":1200,"h":900},{"u":"img/w11_pulm_phys/p65.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 65","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-7":{"q":"During a forced expiration from total lung capacity, what primarily limits flow rate?","o":["The force of contraction of expiratory muscles.","The contraction of the diaphragm.","Constriction of bronchial smooth muscle","Elasticity of the chest wall","Airway compression"],"a":4,"qk":"총폐용량(TLC)에서 시작하는 노력성 호기(forced expiration) 동안, 유속(flow rate)을 주로 제한하는 것은 무엇입니까?","ok":["호기근의 수축력","횡격막의 수축","기관지 평활근의 수축","흉벽의 탄성","기도 압박(airway compression)"],"exp":"**정답 이유**\n\n힘껏 숨을 내쉬면 흉막내압(intrapleural pressure)이 양압으로 크게 올라갑니다. 기도 안 압력은 폐포에서 입으로 갈수록 점점 떨어집니다. 그러다 어느 지점에서 **흉막내압이 기도 안 압력보다 커지면** 기도 바깥이 안쪽보다 세게 눌려 기도가 **찌그러집니다(compression)**. 그러면 저항이 커져 호기 유속이 줄어듭니다.\n\n중요한 점은, 더 세게 힘을 줄수록 흉막내압도 더 올라가 기도를 더 누른다는 것입니다. 그래서 일정 이상 힘을 주면 유속이 더 늘지 않습니다(노력 비의존적 effort-independent). 그래서 유속을 \"주로 제한하는\" 것은 근육의 힘이 아니라 기도 압박입니다. 폐기종(emphysema)에서는 기도를 잡아주는 탄성 지지가 줄어 이 현상이 특히 심합니다.","why":{"0":"호기근의 힘은 처음에는 유속을 늘리지만, 앞서 설명했듯 일정 수준 이상에서는 기도 압박 때문에 효과가 없습니다.","1":"횡격막은 흡기근입니다. 호기 때는 이완합니다.","2":"기관지 평활근 수축은 천식 같은 질환에서 저항을 높이는 요인입니다. 정상인의 노력성 호기를 제한하는 주 요인은 아닙니다.","3":"흉벽의 탄성은 FRC의 균형을 정하는 요소로, 노력성 호기 유속의 주된 제한 요인이 아닙니다."},"one":"총폐용량에서 시작하는 노력성 호기의 유속을 주로 제한하는 것은 동적 기도 압박(airway compression)이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q7) / 8b. Pulmonary Physiology 2026.pdf, slides 35, 36","img":[{"u":"img/w11_pulm_phys/p35.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 35","w":1200,"h":900},{"u":"img/w11_pulm_phys/p36.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 36","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-8":{"q":"What happens with normal quiet expiration?","o":["Airway resistance increases significantly.","Alveolar pressure exceeds atmospheric pressure.","Intra-pleural pressure gradually falls.","Alveoli collapse.","The diaphragm moves downward."],"a":1,"qk":"정상적인 조용한 호기(quiet expiration) 때 일어나는 일은 무엇입니까?","ok":["기도 저항이 크게 증가한다.","폐포압(alveolar pressure)이 대기압을 초과한다.","흉막내압(intra-pleural pressure)이 점차 떨어진다.","폐포가 허탈(collapse)된다.","횡격막이 아래로 내려간다."],"exp":"**정답 이유**\n\n공기는 압력이 높은 곳에서 낮은 곳으로 흐릅니다. 기류는 폐포압과 대기압의 차이에 비례합니다. 조용한 호기는 **수동적(passive)**입니다. 흡기근(횡격막 diaphragm)이 이완되면 늘어나 있던 폐의 탄성 반동(elastic recoil)이 폐를 안쪽으로 눌러 **폐포압이 대기압보다 약간 높아집니다**(예: +1 cmH₂O). 그래서 공기가 밖으로 나갑니다. 호기가 끝나면 폐포압은 다시 대기압과 같아집니다.","why":{"0":"조용한 호기에서는 기도 저항이 크게 변하지 않습니다. 동적 압박에 의한 저항 증가는 노력성 호기 때 일어납니다 (Q7 참조).","2":"흉막내압은 흡기 때 더 음압이 되고, 호기 때는 **덜 음압이 됩니다(상승)**. \"떨어진다\"는 흡기 때의 변화입니다.","3":"정상 폐는 표면활성제와 흉벽·폐의 균형 덕분에 호기 때 폐포가 허탈되지 않습니다.","4":"횡격막이 아래로 내려가는 것은 흡기 때입니다. 호기 때는 이완하며 위로 올라갑니다."},"one":"정상적인 조용한 호기는 수동적이며, 폐포압이 대기압을 초과해 공기가 나간다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q8) / 8b. Pulmonary Physiology 2026.pdf, slides 16, 18, 32","img":[{"u":"img/w11_pulm_phys/p16.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 16","w":1200,"h":900},{"u":"img/w11_pulm_phys/p18.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 18","w":1200,"h":900},{"u":"img/w11_pulm_phys/p32.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 32","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-9":{"q":"An 18 y/o high school star basketball player has a forced vital capacity of 5 L, a FRC of 3 L, and a RV of 1.2 L. What is his total lung capacity?","o":["9.2 L","8.0 L","7.2 L","6.2 L","5.0 L"],"a":3,"qk":"18세 고교 농구 스타 선수의 노력성 폐활량(FVC)이 5 L, FRC가 3 L, 잔기량(RV)이 1.2 L입니다. 그의 총폐용량(TLC)은 얼마입니까?","ok":["9.2 L","8.0 L","7.2 L","6.2 L","5.0 L"],"exp":"**계산 **\n\n총폐용량(total lung capacity, TLC) = 폐활량(vital capacity, VC) + 잔기량(residual volume, RV)\n\n= 5 + 1.2 = **6.2 L**\n\n폐활량은 최대한 들이마신 뒤 최대한 내쉴 수 있는 양이고, 잔기량은 그래도 폐에 남아 있는 공기입니다. 둘을 합치면 폐가 담을 수 있는 최대량이 됩니다. 정상 폐에서 FVC는 VC와 거의 같으므로 FVC를 VC로 쓰면 됩니다. **FRC(3 L)는 함정 숫자**입니다. FRC = ERV + RV이므로 이미 RV를 포함하고 있어서, VC에 FRC를 더하면 RV를 두 번 세게 됩니다.","why":{"0":"9.2 = 5 + 3 + 1.2 (세 숫자를 모두 더한 오류)","1":"8.0 = 5 + 3 (FVC + FRC, RV 중복)","2":"7.2: 맞는 조합이 없는 값입니다.","4":"5.0 = FVC만 쓴 값으로, RV를 빼먹었습니다."},"one":"총폐용량(TLC) = 노력성 폐활량(FVC) + 잔기량(RV) = 5 + 1.2 = 6.2 L이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q9) / 8b. Pulmonary Physiology 2026.pdf, slide 8","img":[{"u":"img/w11_pulm_phys/p08.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 8","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-10":{"q":"At what lung volume or capacity do the lungs and chest wall normally have opposite and equal recoil tendencies?","o":["FVC","FRC","RV","IRV","ERV"],"a":1,"qk":"폐와 흉벽이 정상적으로 서로 반대 방향이고 크기가 같은 반동(recoil) 경향을 갖는 폐용적 또는 폐용량은 무엇입니까?","ok":["FVC","FRC","RV","IRV","ERV"],"exp":"**정답 이유**\n\n폐는 탄성 때문에 항상 **안쪽으로 오그라들려** 하고, 흉벽은 **바깥으로 벌어지려** 합니다. 조용히 숨을 내쉬고 근육이 모두 쉬고 있을 때, 이 두 힘이 크기는 같고 방향은 반대가 되어 균형을 이룹니다. 이 균형점의 폐 부피가 **기능적 잔기량(functional residual capacity, FRC)**입니다. 두 힘이 서로 반대로 당기기 때문에 흉막강(intrapleural space)에는 대기압보다 낮은 음압이 생기고, 이것이 폐포 허탈을 막는 데 도움을 줍니다.","why":{"0":"FVC는 폐기능 검사에서 측정하는 \"양\"이지, 근육이 쉬고 있는 평형 상태가 아닙니다.","2":"RV(잔기량)에서는 흉벽이 바깥으로 벌어지려는 힘이 훨씬 큽니다. 힘껏 내쉬어 근육으로 눌러야 도달합니다.","3":"IRV(흡기 예비량)는 조용한 흡기 위로 더 들이마실 수 있는 양입니다. 평형점이 아닙니다.","4":"ERV(호기 예비량)는 FRC에서 더 내쉴 수 있는 \"양\"으로, 평형 위치 자체를 뜻하지 않습니다."},"one":"폐의 안쪽 반동과 흉벽의 바깥쪽 반동이 크기는 같고 방향은 반대가 되는 평형점이 기능적 잔기량(FRC)이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q10) / 8b. Pulmonary Physiology 2026.pdf, slide 17","img":[{"u":"img/w11_pulm_phys/p17.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 17","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-11":{"q":"A man with normal lungs and a normal arterial Pco2 takes an overdose of a barbiturate which reduces his alveolar ventilation by ½ but does not change his output of CO2. Which of the following is a consequence of the overdose?","o":["PvO2 > PaO2","PaO2 > PAO2","PACO2 doubles.","PACO2 decreases by 50%.","PaCO2 decreases by 50%."],"a":2,"qk":"정상 폐와 정상 동맥 PCO₂를 가진 남성이 바르비투르산(barbiturate)을 과다복용하여 폐포환기량이 ½로 줄었지만 CO₂ 생성량은 변하지 않았습니다. 다음 중 과다복용의 결과는 무엇입니까?","ok":["PvO₂ > PaO₂ (정맥혈 PO₂가 동맥혈 PO₂보다 높음)","PaO₂ > PAO₂ (동맥혈 PO₂가 폐포 PO₂보다 높음)","PACO₂가 두 배가 된다.","PACO₂가 50% 감소한다.","PaCO₂가 50% 감소한다."],"exp":"**정답 이유**\n\nQ2와 같은 원리입니다. CO₂ 생성이 일정하면 PACO₂ ∝ 1/VA입니다. VA가 ½이 되면 PACO₂는 **2배**(40 → 약 80 mmHg)가 됩니다. 바르비투르산은 뇌간 호흡중추를 억제해 저환기(hypoventilation)를 일으키는 약입니다. 저환기는 CO₂ 정체로 호흡성 산증(respiratory acidosis)을 일으킵니다.","why":{"0":"정맥혈은 조직에 O₂를 내준 뒤의 피라서 항상 동맥혈보다 PO₂가 낮습니다(약 40 vs 95 mmHg).","1":"O₂는 폐포에서 혈액으로 확산되므로 동맥혈 PO₂는 폐포 PO₂보다 높을 수 없습니다. 정상에서도 A-a 차이가 5–15 mmHg 있습니다.","3":"환기가 줄면 PCO₂는 감소가 아니라 증가합니다. 50% 감소는 환기가 2배가 되었을 때의 결과입니다.","4":"환기가 줄면 PCO₂는 감소가 아니라 증가합니다. 50% 감소는 환기가 2배가 되었을 때의 결과입니다."},"one":"CO₂ 생성이 그대로인데 폐포환기량이 ½이 되면 폐포 PCO₂는 두 배가 된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q11) / 8b. Pulmonary Physiology 2026.pdf, slide 11","img":[{"u":"img/w11_pulm_phys/p11.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 11","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-12":{"q":"Which of the following is correct regarding V/Q?","o":["It is independent of age.","Anatomic and physiologic shunting cause mismatch.","It is unrelated to COPD.","It is stable after puberty.","Breathing 100% O2 corrects for V/Q mismatch regardless of the cause."],"a":1,"qk":"V/Q(환기-관류비 ventilation-perfusion ratio)에 대해 옳은 것은 무엇입니까?","ok":["나이와 무관하다.","해부학적·생리학적 단락(shunting)이 불일치(mismatch)를 일으킨다.","COPD와 무관하다.","사춘기 이후에는 안정적이다.","100% O₂ 흡입은 원인에 관계없이 V/Q 불일치를 교정한다."],"exp":"**정답 이유**\n\nV/Q는 폐포에 들어가는 공기(V)와 그 폐포를 지나는 혈액(Q)의 비율입니다. **단락(shunt)**이란 혈액이 환기되는 폐포를 거치지 않고 지나가는 것입니다. 기관지 순환 혈액 일부가 폐정맥으로 바로 들어가는 해부학적 단락이 그 예입니다. 단락 혈액은 V/Q = 0인 셈이므로 V/Q 불일치를 만듭니다. 그래서 정상인도 폐포-동맥 PO₂ 차이(A-a gradient)가 5–15 mmHg 정도 있습니다.","why":{"0":"나이가 들면 V/Q 불균일성이 커집니다. A-a 차이도 나이에 따라 증가하므로 나이와 무관하지도, 사춘기 이후 고정되지도 않습니다.).","3":"나이가 들면 V/Q 불균일성이 커집니다. A-a 차이도 나이에 따라 증가하므로 나이와 무관하지도, 사춘기 이후 고정되지도 않습니다.).","2":"COPD(만성폐쇄성폐질환)는 V/Q 불일치와 저산소혈증의 대표적 원인입니다.","4":"100% O₂ 흡입은 해부학적 우→좌 단락(right-to-left shunt)을 교정하지 **못합니다**. 단락 혈액은 환기되는 폐포를 아예 지나지 않기 때문입니다."},"one":"해부학적·생리학적 단락(shunt)은 V/Q = 0인 혈류를 만들어 V/Q 불일치를 일으킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q12) / 8b. Pulmonary Physiology 2026.pdf, slides 47, 50","img":[{"u":"img/w11_pulm_phys/p47.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 47","w":1200,"h":900},{"u":"img/w11_pulm_phys/p50.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 50","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-13":{"q":"A patient with lung disease who is breathing air has an arterial PO2 and Pco2 of 49 and 48 mm Hg, respectively and a respiratory exchange ratio of 0.8. What does this indicate?","o":["COVID-19 infection.","Restrictive lung disease.","Congestive heart failure.","V/Q mismatch.","Decreased AO2 – aO2."],"a":3,"qk":"공기를 호흡하는 폐질환 환자의 동맥 PO₂와 PCO₂가 각각 49와 48 mmHg이고, 호흡교환율(respiratory exchange ratio)이 0.8입니다. 이것은 무엇을 의미합니까?","ok":["COVID-19 감염","제한성 폐질환(restrictive lung disease)","울혈성 심부전(congestive heart failure)","V/Q 불일치(mismatch)","AO₂ – aO₂(폐포-동맥 PO₂ 차이) 감소"],"exp":"**계산 **\n\nPAO₂ = PIO₂ − PₐCO₂/R = 150 − 48/0.8 = 150 − 60 = **90 mmHg**\n\nA-a 차이 = PAO₂ − PₐO₂ = 90 − 49 = **41 mmHg**\n\n정상 A-a 차이는 5–15 mmHg입니다. **15 mmHg를 넘으면 산소화 이상과 V/Q 불일치**를 뜻합니다. 41 mmHg는 크게 증가한 값이므로 V/Q 불일치가 정답입니다. 만약 저산소혈증이 단순 저환기(hypoventilation) 때문이었다면 A-a 차이는 정상이었을 것입니다. 숫자를 공식에 넣어 확인하는 것이 핵심입니다.","why":{"0":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","1":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","2":"COVID-19, 제한성 폐질환, 심부전은 모두 V/Q 불일치를 **일으킬 수 있는 구체적 질병**입니다. 하지만 혈액가스 수치만으로 특정 질병을 지목할 수는 없습니다. 수치가 직접 \"가리키는\" 것은 V/Q 불일치라는 생리적 이상입니다.","4":"계산 결과 A-a 차이는 감소가 아니라 **증가**했습니다."},"one":"폐포 기체 공식으로 구한 A-a 차이가 41 mmHg로 커져 있으므로 V/Q 불일치를 뜻한다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q13) / 8b. Pulmonary Physiology 2026.pdf, slides 13, 48","img":[{"u":"img/w11_pulm_phys/p13.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 13","w":1200,"h":900},{"u":"img/w11_pulm_phys/p48.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 48","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-14":{"q":"An increase in which of the following will increase the affinity of hemoglobin for bound oxygen?","o":["Body temperature","Pco2","[H+]","2,3 DPG","Inhaled carbon monoxide"],"a":4,"qk":"다음 중 어느 것이 증가하면 헤모글로빈(hemoglobin)의 결합 산소에 대한 친화도(affinity)가 증가합니까?","ok":["체온","PCO₂","[H⁺]","2,3-DPG","흡입한 일산화탄소(carbon monoxide)"],"exp":"**정답 이유**\n\n\"CO also increases the affinity of Hb for bound O₂\", 즉 일산화탄소(CO)는 헤모글로빈이 **이미 결합한 O₂를 더 꽉 붙잡게** 만듭니다. CO가 Hb의 결합 자리 일부를 차지하면 Hb 분자 모양이 O₂를 잘 놓지 않는 형태로 바뀝니다. 그래서 산소해리곡선(oxyhemoglobin dissociation curve)이 **왼쪽으로 이동**합니다. 결과적으로 조직에서 O₂를 잘 내주지 못해 더 위험해집니다.","why":{"0":"체온 ↑: 운동하는 뜨거운 근육에서 O₂를 잘 내놓게 합니다.","1":"PCO₂ ↑: CO₂가 많은 조직에서 O₂를 잘 내놓게 합니다.","2":"[H⁺] ↑(산성): 친화도를 감소시킵니다.","3":"2,3-DPG ↑: 적혈구 대사산물로, 친화도를 감소시킵니다. 외우는 법: \"조직에서 많이 쓰는 상황(뜨겁고, 산성이고, CO₂ 많음)에서는 O₂를 놓아준다(우측이동)\"고 기억하시면 됩니다."},"one":"일산화탄소(CO)는 헤모글로빈이 이미 결합한 O₂에 대한 친화도를 증가시킨다(곡선 좌측 이동).","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q14) / 8b. Pulmonary Physiology 2026.pdf, slides 60, 61","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-15":{"q":"Acute carbon monoxide poisoning will most likely","o":["reduce the arterial PO2.","affect the reading of a pulse oximeter.","reduce the amount of oxygen dissolved in plasma.","reduce the oxygen content of the blood.","decrease the affinity of hemoglobin for oxygen."],"a":3,"qk":"급성 일산화탄소(CO) 중독은 다음 중 어떤 결과를 가져올 가능성이 가장 높습니까?","ok":["동맥 PO₂를 감소시킨다.","맥박산소측정기(pulse oximeter)의 수치에 영향을 준다.","혈장에 녹아 있는 산소량을 감소시킨다.","혈액의 산소 함량(oxygen content)을 감소시킨다.","헤모글로빈의 산소 친화도를 감소시킨다."],"exp":"**정답 이유**\n\nCO는 O₂보다 Hb에 훨씬 강하게 결합해 O₂ 결합 자리를 빼앗습니다. 그래서 Hb 포화도가 떨어지고 **혈액의 산소 함량(oxygen content)이 감소**합니다. 하지만 **동맥 PO₂는 변하지 않습니다**(\"without altering the arterial PO₂\"). 산소 함량 = 용존 O₂ + Hb 결합 O₂이고, 이 중 Hb 결합분이 줄어드는 것입니다.","why":{"0":"PO₂는 혈장에 **녹아 있는** O₂가 만드는 압력입니다. 폐의 환기와 확산이 정상이면 PaO₂도 정상입니다.","2":"용존 O₂ = 0.003 × PO₂이므로 PO₂가 그대로면 용존 O₂도 그대로입니다.","4":"CO는 친화도를 오히려 **증가**시킵니다 (Q14).","1":"실제 임상에서는 일반 맥박산소측정기(pulse oximeter)가 일산화탄소헤모글로빈(carboxyhemoglobin)과 산소헤모글로빈을 구별하지 못해 SpO₂가 정상처럼 높게 나올 수 있습니다. 하지만 이 문제가 묻는 핵심은 동맥 PO₂는 정상이고 혈액의 산소 함량(oxygen content)이 감소한다는 것이므로, 정답은 D입니다."},"one":"급성 CO 중독은 동맥 PO₂는 그대로 두고 혈액의 산소 함량(oxygen content)을 감소시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q15) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 61","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p61.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 61","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-16":{"q":"In what form is most carbon dioxide transported in the venous blood?","o":["Dissolved CO2.","Bicarbonate.","Carbamino compounds.","Carbonic acid.","Carboxyhemoglobin."],"a":1,"qk":"정맥혈에서 대부분의 이산화탄소(CO₂)는 어떤 형태로 운반됩니까?","ok":["용존 CO₂(dissolved CO₂)","중탄산염(bicarbonate)","카바미노 화합물(carbamino compounds)","탄산(carbonic acid)","카복시헤모글로빈(carboxyhemoglobin)"],"exp":"**정답 이유**\n\n혈액은 CO₂를 \"거의 전부 **중탄산염(bicarbonate, HCO₃⁻)**으로\" 운반합니다. 흐름은 다음과 같습니다.\n\n① 조직에서 생긴 CO₂가 적혈구로 들어갑니다.\n\n② 탄산탈수효소(carbonic anhydrase)가 CO₂ + H₂O → H₂CO₃ 반응을 빠르게 진행시킵니다.\n\n③ H₂CO₃ → H⁺ + HCO₃⁻로 해리됩니다.\n\n④ H⁺는 Hb에 붙고, HCO₃⁻는 Cl⁻와 맞바꿔 혈장으로 나갑니다(염소 이동 chloride shift).","why":{"0":"용존 CO₂는 소량(약 5–10%)입니다.","2":"카바미노 화합물(Hb의 아미노기에 CO₂가 붙은 것)도 일부(약 5–10%)만 차지합니다.","3":"탄산은 만들어지자마자 바로 H⁺와 HCO₃⁻로 해리되므로 운반 형태가 아닙니다.","4":"카복시헤모글로빈은 **일산화탄소(CO)**가 Hb에 붙은 것입니다. CO₂와 이름이 비슷해 헷갈리게 만든 함정입니다. (CO₂가 Hb에 붙은 것은 카바미노헤모글로빈 carbaminohemoglobin입니다.)"},"one":"정맥혈 CO₂의 대부분은 중탄산염(bicarbonate, HCO₃⁻) 형태로 운반된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q16) / 8b. Pulmonary Physiology 2026.pdf, slides 66, 67","img":[{"u":"img/w11_pulm_phys/p66.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 66","w":1200,"h":900},{"u":"img/w11_pulm_phys/p67.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 67","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-17":{"q":"Which statement below is inconsistent with normal gas exchange and normal gas transport events?","o":["Hyperventilation reduces the alveolar PCO2.","The difference between alveolar and arterial PO2 increases with V/Q mismatch.","Acidemia increases the affinity of hemoglobin for oxygen.","Most of the transported oxygen is bound to hemoglobin.","An increase in arterial PO2 will increase the oxygen content of blood."],"a":2,"qk":"다음 중 정상적인 가스교환 및 가스운반 현상과 맞지 **않는** 것은 무엇입니까?","ok":["과호흡(hyperventilation)은 폐포 PCO₂를 감소시킨다.","폐포-동맥 PO₂ 차이는 V/Q 불일치에서 증가한다.","산혈증(acidemia)은 헤모글로빈의 산소 친화도를 증가시킨다.","운반되는 산소의 대부분은 헤모글로빈에 결합되어 있다.","동맥 PO₂가 증가하면 혈액의 산소 함량이 증가한다."],"exp":"**정답 이유**\n\n\"맞지 않는 것\"을 고르는 문제입니다. [H⁺] 증가(산혈증 acidemia)는 곡선을 **오른쪽**으로 옮기고(보어 효과 Bohr effect) Hb의 O₂ 친화도를 **감소**시킵니다. 따라서 \"산혈증이 친화도를 증가시킨다\"는 C가 틀린 문장이고, 이것이 정답입니다.","why":{"0":"과호흡하면 CO₂를 많이 내보내 PACO₂가 내려갑니다.","1":"A-a 차이가 15 mmHg를 넘으면 V/Q 불일치를 뜻합니다.","3":"혈액 O₂ 약 20 mL/dL 중 대부분이 Hb에 결합되어 있습니다. 용존 O₂는 0.003 × 95 ≈ 0.3 mL/dL뿐입니다.","4":"PO₂가 오르면 용존 O₂(0.003 × PO₂)가 늘고, 포화도도 같거나 오르므로 산소 함량이 증가합니다."},"one":"산혈증(acidemia)은 보어 효과로 헤모글로빈의 산소 친화도를 감소시키므로, 친화도가 증가한다는 문장은 틀렸다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q17) / 8b. Pulmonary Physiology 2026.pdf, slide 60","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-18":{"q":"A normal healthy 25 y/o male has a hemoglobin content of 14.5 gm/dl blood and a SaO2 of 97%. How much oxygen is his hemoglobin transporting?","o":["20 vol%","20 ml/dl","18.8 ml/dl","14.5 ml/dl","1.34 ml/dl"],"a":2,"qk":"정상적인 건강한 25세 남성의 헤모글로빈이 14.5 g/dL이고 SaO₂가 97%입니다. 그의 헤모글로빈은 얼마의 산소를 운반하고 있습니까?","ok":["20 vol%","20 mL/dL","18.8 mL/dL","14.5 mL/dL","1.34 mL/dL"],"exp":"**계산 (공식표: Hb 결합 O₂ = Hb(g/dL) × 1.34 mL O₂/g Hb × %포화도/100)**\n\n14.5 × 1.34 × 0.97 = 19.43 × 0.97 ≈ **18.8 mL/dL**\n\n1.34는 Hb 1 g이 최대로 붙잡을 수 있는 O₂ 양(mL)입니다. 문제는 \"헤모글로빈이\" 운반하는 산소만 물었으므로 용존 O₂(0.003 × PO₂ ≈ 0.3 mL/dL)는 더하지 않습니다.","why":{"0":"20 vol% = 20 mL/dL은 같은 단위로, 교과서의 \"정상 산소운반 능력(carrying capacity) 약 20 mL/dL\"입니다. 이 사람의 수치로 계산한 값이 아닙니다.","1":"20 vol% = 20 mL/dL은 같은 단위로, 교과서의 \"정상 산소운반 능력(carrying capacity) 약 20 mL/dL\"입니다. 이 사람의 수치로 계산한 값이 아닙니다.","3":"14.5는 Hb 농도(g/dL)를 그대로 옮긴 함정입니다.","4":"1.34는 Hb 1 g당 결합 상수로, 결과값이 아닙니다."},"one":"헤모글로빈 결합 산소 = 14.5 × 1.34 × 0.97 ≈ 18.8 mL/dL이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q18) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 62","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p62.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 62","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-19":{"q":"What best characterizes the central chemoreceptors?","o":["They are located in the pons.","They are unresponsive to changes in either PO2 or PCO2 of the blood.","They are activated by pH changes in surrounding extracellular fluid.","They exist in the carotid and aortic bodies.","They are stimulated by the opening of Ca2+ sensitive potassium channels."],"a":2,"qk":"중추 화학수용체(central chemoreceptors)를 가장 잘 설명하는 것은 무엇입니까?","ok":["뇌교(pons)에 위치한다.","혈액의 PO₂나 PCO₂ 변화 어느 쪽에도 반응하지 않는다.","주변 세포외액(extracellular fluid)의 pH 변화에 의해 활성화된다.","경동맥소체(carotid body)와 대동맥소체(aortic body)에 있다.","Ca²⁺ 민감성 칼륨 채널의 개방에 의해 자극된다."],"exp":"**정답 이유**\n\n중추(연수 medullary) 화학수용체는 **뇌척수액(cerebrospinal fluid)의 pH**에 민감하고, 이 pH는 PCO₂와 연결되어 있습니다. 원리는 이렇습니다. 혈액의 CO₂는 혈뇌장벽(blood-brain barrier, BBB)을 쉽게 통과하지만 H⁺는 잘 통과하지 못합니다. 뇌척수액으로 들어간 CO₂는 H₂O와 반응해 H⁺를 만들고, 수용체 주변 세포외액의 pH를 떨어뜨립니다. 수용체는 이 pH 변화를 감지해 호흡을 늘립니다.","why":{"0":"위치는 뇌교가 아니라 **연수(medulla)**의 복측 표면입니다.","1":"혈액 PCO₂ 변화에는 (pH를 통해 간접적으로) 강하게 반응합니다. PO₂에 반응하지 않는 것은 맞지만, \"둘 다 반응 안 한다\"는 틀렸습니다.","3":"경동맥소체·대동맥소체는 **말초(peripheral)** 화학수용체입니다.","4":"칼륨 채널이 관여하는 것은 말초 화학수용체의 사구세포(glomus cell) 기전입니다. 저산소 시 O₂ 민감성 K⁺ 채널이 닫혀 탈분극됩니다. 중추 화학수용체의 설명이 아닙니다."},"one":"중추 화학수용체는 주변 세포외액(뇌척수액)의 pH 변화에 의해 활성화된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q19) / 8b. Pulmonary Physiology 2026.pdf, slide 80","img":[{"u":"img/w11_pulm_phys/p80.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 80","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-20":{"q":"What best describes respiratory center activity?","o":["The normal rhythmic pattern of breathing originates from neurons in the pons and medulla.","Inspiratory activity originates in the dorsal respiratory group of neurons in the pons.","Impulses from the pneumotaxic center switch on inspiratory activity.","The only output is via the phrenic nerves."],"a":0,"qk":"호흡중추(respiratory center)의 활동을 가장 잘 설명하는 것은 무엇입니까?","ok":["정상적인 리듬성 호흡 패턴은 뇌교(pons)와 연수(medulla)의 뉴런에서 시작된다.","흡기 활동은 뇌교에 있는 배측 호흡군(dorsal respiratory group) 뉴런에서 시작된다.","호흡조절중추(pneumotaxic center)의 자극이 흡기 활동을 켠다(switch on).","유일한 출력은 횡격신경(phrenic nerves)을 통한 것이다."],"exp":"**정답 이유**\n\n기본 호흡 리듬은 뇌간(brainstem)의 중추 조절기(central controller)에서 만들어집니다. 연수의 배측 호흡군(DRG)과 복측 호흡군(VRG)이 리듬을 만들고, 뇌교의 지속흡식중추(apneustic center)와 호흡조절중추(pneumotaxic center)가 이를 **미세조정(fine-tune)**합니다. 그래서 \"뇌교와 연수의 뉴런\"이 정상 리듬 패턴을 함께 만든다는 A가 가장 적절합니다.","why":{"1":"배측 호흡군(DRG)은 뇌교가 아니라 **연수(medulla)**에 있습니다. DRG가 주로 흡기 뉴런을 가진다는 부분은 맞습니다.","2":"호흡조절중추는 흡기를 켜는 것이 아니라 **끄는(switch off)** 쪽입니다. 흡기 시간을 짧게 해 호흡수를 늘립니다. 흡기를 계속 유지시키는 쪽은 지속흡식중추입니다.","3":"횡격신경 외에도 늑간근으로 가는 늑간신경(intercostal nerves), 보조호흡근으로 가는 신경 등 출력이 여럿 있습니다."},"one":"정상적인 리듬성 호흡 패턴은 뇌교(pons)와 연수(medulla)의 뉴런에서 시작된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q20) / 8b. Pulmonary Physiology 2026.pdf, slides 75, 76, 77","img":[{"u":"img/w11_pulm_phys/p75.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 75","w":1200,"h":900},{"u":"img/w11_pulm_phys/p76.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 76","w":1200,"h":900},{"u":"img/w11_pulm_phys/p77.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 77","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-21":{"q":"What best characterizes glomus cells?","o":["They are located in the carotid sinus.","They form the BBB.","They exist in the airways of the lung.","They possess oxygen sensors."],"a":3,"qk":"사구세포(glomus cells)를 가장 잘 설명하는 것은 무엇입니까?","ok":["경동맥동(carotid sinus)에 위치한다.","혈뇌장벽(BBB)을 형성한다.","폐의 기도에 존재한다.","산소 감지기(oxygen sensors)를 가지고 있다."],"exp":"**정답 이유**\n\n사구세포는 말초 화학수용체인 **경동맥소체(carotid body)**의 감각 세포입니다. 동맥혈 O₂ 분압이 떨어지면(저산소혈증 hypoxemia) 사구세포의 산소 감지 기전(O₂ 민감성 K⁺ 채널)이 작동해 세포가 **탈분극(depolarize)**합니다. 그러면 Ca²⁺가 들어오고 신경전달물질이 분비되어, 설인신경(glossopharyngeal nerve)을 통해 뇌간에 신호를 보냅니다. 즉 사구세포는 \"산소 감지기\"를 가진 세포입니다.","why":{"0":"경동맥**동(sinus)**은 혈압을 감지하는 **압수용체(baroreceptor)**가 있는 곳입니다. 사구세포가 있는 경동맥**소체(body)**와 헷갈리게 만든 함정입니다.","1":"혈뇌장벽은 뇌 모세혈관 내피세포의 치밀이음부(tight junction) 등이 만듭니다.","2":"기도에는 사구세포가 없습니다. 경동맥 분기부와 대동맥궁에 있습니다."},"one":"사구세포(glomus cells)는 말초 화학수용체의 산소 감지기(oxygen sensors)를 가진 세포이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q21) / 8b. Pulmonary Physiology 2026.pdf, slides 78, 79","img":[{"u":"img/w11_pulm_phys/p78.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 78","w":1200,"h":900},{"u":"img/w11_pulm_phys/p79.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 79","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-22":{"q":"John is a 62 yr-old male who has been a heavy cigarette smoker for 40+ years. He is hospitalized because of COPD and supplied with 50% oxygen through a nasal cannula. Which of the following will change the most as a result of the oxygenation?","o":["His vital capacity.","His hematocrit.","The viscosity of his blood.","The oxygen content of his blood.","His lung diffusing capacity."],"a":3,"qk":"John은 40년 넘게 담배를 많이 피운 62세 남성입니다. COPD로 입원해 비강 캐뉼라(nasal cannula)로 50% 산소를 공급받고 있습니다. 산소 공급의 결과로 가장 많이 변하는 것은 무엇입니까?","ok":["그의 폐활량(vital capacity)","그의 적혈구용적률(hematocrit)","그의 혈액 점도(viscosity)","그의 혈액 산소 함량(oxygen content)","그의 폐 확산능(lung diffusing capacity)"],"exp":"**정답 이유**\n\nCOPD에서는 V/Q 불일치로 저산소혈증이 생깁니다. 고농도 산소를 주면 흡입 PO₂(PIO₂)가 크게 올라갑니다. 그러면 환기가 나쁜(V/Q가 낮은) 폐포에도 O₂가 더 들어가 PaO₂와 Hb 포화도가 올라가고, 용존 O₂도 증가합니다. 산소 함량 = 용존 O₂ + Hb 결합 O₂이므로 **혈액 산소 함량이 가장 즉각적이고 크게 변합니다**. (단, V/Q 불일치와 달리 진짜 단락은 100% O₂로도 교정되지 않는다는 점은 Q12에서 보신 대로입니다.)","why":{"0":"폐활량은 폐와 흉벽의 기계적 특성으로 정해집니다. 산소를 마신다고 바뀌지 않습니다.","1":"적혈구용적률과 이로 인한 혈액 점도는 만성 저산소에 대한 적혈구 증가(수주 이상)로 변하는 값입니다. 산소 공급 직후에 크게 변하지 않습니다.","2":"적혈구용적률과 이로 인한 혈액 점도는 만성 저산소에 대한 적혈구 증가(수주 이상)로 변하는 값입니다. 산소 공급 직후에 크게 변하지 않습니다.","4":"확산능(DL)은 막의 면적과 두께 등 구조로 정해집니다(Fick의 법칙). 흡입 산소 농도와는 무관합니다."},"one":"COPD 환자에게 산소를 공급하면 가장 즉각적으로 크게 변하는 것은 혈액 산소 함량이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q22) / 8b. Pulmonary Physiology 2026.pdf, slides 55, 82","img":[{"u":"img/w11_pulm_phys/p55.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 55","w":1200,"h":900},{"u":"img/w11_pulm_phys/p82.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 82","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-23":{"q":"Humans inspire about 10,000 L of air daily. This air contains various substances some of which are potentially injurious to respiratory tissues. Mucocillliary transport is a vital mechanism designed to protect against injury. How is this mechanism best described?","o":["It moves inhaled particulates downward where they are destroyed by alveolar macrophages.","Biphasic ciliary activity moves the mucus layer containing inhaled particulates toward the pharynx.","Biphasic ciliary activity moves the fluid layer containing inhaled particulates toward the pharynx.","The mucus layer contains hydrolytic enzymes that digest inhaled particulates.","The fluid layer contains hydrolytic enzymes that digest inhaled particulates."],"a":1,"qk":"사람은 하루 약 10,000 L의 공기를 들이마십니다. 이 공기에는 호흡기 조직을 손상시킬 수 있는 다양한 물질이 들어 있습니다. 점액섬모 수송(mucociliary transport)은 손상을 막기 위한 중요한 기전입니다. 이 기전을 가장 잘 설명한 것은 무엇입니까?","ok":["흡입된 입자를 아래쪽으로 옮겨 폐포 대식세포(alveolar macrophages)가 파괴하게 한다.","이상성(biphasic) 섬모 운동이 흡입 입자가 담긴 점액층(mucus layer)을 인두(pharynx) 쪽으로 이동시킨다.","이상성 섬모 운동이 흡입 입자가 담긴 액체층(fluid layer)을 인두 쪽으로 이동시킨다.","점액층에 흡입 입자를 소화하는 가수분해효소(hydrolytic enzymes)가 있다.","액체층에 흡입 입자를 소화하는 가수분해효소가 있다."],"exp":"**정답 이유**\n\n\"작은 입자는 기도의 섬모 작용(ciliary action)으로 **위로 움직이는 점액층(upward moving mucus layer)**에 의해 제거된다\". 기도 표면은 두 층으로 되어 있습니다.\n\n· 아래층: 묽은 **액체층**(섬모주위액 periciliary fluid). 섬모가 이 안에서 자유롭게 움직입니다.\n\n· 위층: 끈끈한 **점액층(mucus)**. 먼지와 세균이 여기에 달라붙습니다.\n\n섬모는 빠르고 힘찬 앞쪽 박동(effective stroke)과 느린 복귀 박동(recovery stroke)의 **이상성(biphasic)** 운동을 합니다. 앞쪽 박동 때 섬모 끝이 위의 점액층을 밀어 올려, 점액을 인두 쪽으로 운반합니다. 운반된 점액은 삼키거나 뱉어냅니다(점액섬모 에스컬레이터 mucociliary escalator).","why":{"0":"방향이 반대입니다. 점액은 아래가 아니라 위(인두 쪽)로 움직입니다. 폐포까지 들어간 입자를 대식세포가 처리하는 것은 맞지만, 점액섬모 수송과는 별개의 기전입니다.","2":"운반되는 것은 아래의 묽은 액체층이 아니라 그 위의 **점액층**입니다.","3":"점액섬모 수송은 입자를 \"소화\"하는 것이 아니라 \"물리적으로 밖으로 운반\"하는 기전입니다.","4":"점액섬모 수송은 입자를 \"소화\"하는 것이 아니라 \"물리적으로 밖으로 운반\"하는 기전입니다."},"one":"점액섬모 수송은 이상성(biphasic) 섬모 운동이 흡입 입자가 담긴 점액층을 인두 쪽으로 이동시키는 기전이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q23) / 8b. Pulmonary Physiology 2026.pdf, slides 86, 87","img":[{"u":"img/w11_pulm_phys/p86.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 86","w":1200,"h":900},{"u":"img/w11_pulm_phys/p87.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 87","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-24":{"q":"What substrate in the blood is most likely to undergo modification or elimination during passage through the pulmonary vasculature?","o":["Histamine","Vasoactive intestinal peptide (VIP)","Angiotensin I","Angiotensin II","Substance P"],"a":2,"qk":"폐혈관(pulmonary vasculature)을 지나면서 변형되거나 제거될 가능성이 가장 높은 혈액 내 물질은 무엇입니까?","ok":["히스타민(histamine)","혈관활성장펩타이드(vasoactive intestinal peptide, VIP)","안지오텐신 I(angiotensin I)","안지오텐신 II(angiotensin II)","P 물질(substance P)"],"exp":"**정답 이유**)\"을 명시합니다. 폐 모세혈관 내피세포 표면에는 안지오텐신 전환효소(angiotensin-converting enzyme, ACE)가 아주 많습니다. 그래서 혈액이 폐를 한 번 지나는 동안 안지오텐신 I(약한 형태)의 대부분이 강력한 혈관수축물질인 안지오텐신 II로 바뀝니다. 몸 전체 혈액이 폐를 지나므로 폐는 이 전환의 주된 장소입니다.","why":{"3":"안지오텐신 II는 폐에서 **만들어지는 결과물**입니다. 폐를 거의 변화 없이 통과해 전신 혈관에 작용합니다.","0":"히스타민(histamine)은 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 이 문제의 정답 근거는 폐가 안지오텐신 I을 안지오텐신 II로 전환한다는 점입니다.","1":"혈관활성장펩타이드(VIP)는 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 정답은 안지오텐신 I의 전환입니다.","4":"P 물질(substance P)은 폐의 대표적 처리 대상으로 다루어지지 않은 물질입니다. 정답은 안지오텐신 I의 전환입니다."},"one":"폐를 지나며 가장 잘 변형되는 혈액 내 물질은 안지오텐신 I로, ACE에 의해 안지오텐신 II로 전환된다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q24) / 8b. Pulmonary Physiology 2026.pdf, slides 85, 89","img":[{"u":"img/w11_pulm_phys/p85.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 85","w":1200,"h":900},{"u":"img/w11_pulm_phys/p89.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 89","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-25":{"q":"Inflammation of the airways is most likely to result in","o":["increased ventilation of alveoli.","increased airway resistance.","reduced turbulence in airways.","dynamic compression of large airways.","increased FEV1."],"a":1,"qk":"기도의 염증(inflammation of the airways)은 다음 중 어떤 결과를 가져올 가능성이 가장 높습니까?","ok":["폐포 환기 증가","기도 저항(airway resistance) 증가","기도 난류(turbulence) 감소","큰 기도의 동적 압박(dynamic compression)","FEV1 증가"],"exp":"**정답 이유**\n\n기류는 압력차에 비례하고 기도 저항에 반비례합니다. 평활근 긴장도가 변하면 기도 지름이 바뀌어 저항이 달라집니다. 염증이 생기면 기도 벽이 붓고(부종 edema), 점액 분비가 늘고, 평활근이 수축해 **기도 지름이 좁아집니다**. 저항은 반지름의 4제곱에 반비례하므로(푸아죄유 법칙 Poiseuille's law, 일반 생리 원리), 조금만 좁아져도 저항이 크게 **증가**합니다. 천식(asthma)과 기관지염(bronchitis)이 대표적인 예입니다.","why":{"0":"기도가 좁아지면 폐포로 가는 공기가 줄어 폐포 환기는 오히려 감소합니다.","2":"기도가 좁아지면 같은 유량에서 공기 속도가 빨라져 난류가 오히려 **증가**합니다.","3":"동적 압박은 노력성 호기 때 흉막내압이 기도압보다 커져서 생기는 현상입니다. 특히 탄성이 줄어든 폐기종에서 두드러집니다. 염증의 \"가장 직접적인\" 결과는 아닙니다.","4":"저항이 커지면 1초간 내쉴 수 있는 양(FEV1)은 **감소**합니다."},"one":"기도 염증은 기도 지름을 좁혀 기도 저항(airway resistance)을 증가시킨다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Study Q25) / 8b. Pulmonary Physiology 2026.pdf, slides 28, 30","img":[{"u":"img/w11_pulm_phys/p28.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 28","w":1200,"h":900},{"u":"img/w11_pulm_phys/p30.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 30","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-26":{"q":"Which statement correctly distinguishes the Bohr effect from the Haldane effect?","o":["The Bohr effect describes increased CO2 uptake as hemoglobin becomes deoxygenated.","The Haldane effect is a right shift of the oxyhemoglobin curve caused by increased [H+].","The Bohr effect is a rightward shift of the oxyhemoglobin curve (decreased Hb affinity for O2) caused by increased [H+], temperature, or 2,3-DPG.","Both effects describe only the influence of inhaled carbon monoxide on hemoglobin.","The Haldane effect increases hemoglobin’s affinity for oxygen that is already bound."],"a":2,"qk":"보어 효과(Bohr effect)와 할데인 효과(Haldane effect)를 올바르게 구별한 것은 무엇입니까?","ok":["보어 효과는 헤모글로빈이 탈산소화되면서 CO₂ 흡수가 증가하는 현상이다.","할데인 효과는 [H⁺] 증가로 산소헤모글로빈 곡선이 오른쪽으로 이동하는 것이다.","보어 효과는 [H⁺]·체온·2,3-DPG 증가로 산소헤모글로빈 곡선이 오른쪽 이동(Hb의 O₂ 친화도 감소)하는 것이다.","두 효과 모두 흡입 일산화탄소가 헤모글로빈에 미치는 영향만을 설명한다.","할데인 효과는 헤모글로빈이 이미 결합한 산소에 대한 친화도를 증가시킨다."],"exp":"**정답 이유**\n\n보어 효과(Bohr effect)는 혈액의 [H⁺] 증가, 체온 증가, 또는 2,3-디포스포글리세레이트(2,3-DPG) 증가에 반응해 산소헤모글로빈 해리곡선(oxyhemoglobin dissociation curve)이 **오른쪽**으로 이동하는 것입니다. 이것은 헤모글로빈(hemoglobin)의 O₂ 친화도 감소와 같아서, 대사로 뜨겁고 산성인 조직에서 O₂를 잘 내놓게 합니다.\n\n할데인 효과(Haldane effect)는 이와 짝을 이루는 CO₂ 쪽 현상입니다. 동맥혈이 산소를 내주면(탈산소화) CO₂를 **더 잘 받아들입니다**. 그래서 정맥혈은 동맥혈보다 CO₂를 약 4 mL/dL 더 담고 있습니다.\n\n두 효과를 섞지 마십시오. 보어 = O₂ 곡선 우측 이동(친화도 ↓), 할데인 = 탈산소화된 혈액의 CO₂ 운반 증가입니다.","why":{"0":"이것은 할데인 효과의 설명입니다. 보어 효과는 O₂ 친화도와 해리곡선의 이동을 다룹니다.","1":"곡선 우측 이동을 일으키는 것은 보어 효과입니다. 할데인 효과는 탈산소화된 혈액이 CO₂를 더 잘 받는 현상입니다.","3":"일산화탄소(CO)는 이미 결합한 O₂에 대한 친화도를 높이고 포화도를 떨어뜨리지만, 보어·할데인 효과의 정의가 아닙니다.","4":"이미 결합한 O₂ 친화도 증가는 일산화탄소의 작용입니다. 할데인 효과는 CO₂ 운반에 관한 것입니다."},"one":"보어 효과는 [H⁺]·체온·2,3-DPG에 의한 O₂ 곡선 우측 이동이고, 할데인 효과는 탈산소화된 혈액이 CO₂를 더 잘 받아들이는 현상이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Key Points) / 8b. Pulmonary Physiology 2026.pdf, slides 60, 67","img":[{"u":"img/w11_pulm_phys/p60.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 60","w":1200,"h":900},{"u":"img/w11_pulm_phys/p67.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 67","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-27":{"q":"Which enzyme and ion exchange are critical for transporting most CO2 as bicarbonate?","o":["Hexokinase in plasma converts CO2 to carbamino compounds; Na+ enters the red cell.","Carbonic anhydrase in red cells accelerates CO2 + H2O → H2CO3; HCO3− then leaves in exchange for Cl− (chloride shift).","ACE on pulmonary endothelium converts HCO3− to dissolved CO2; K+ is exchanged for H+.","Myeloperoxidase in neutrophils binds CO2 to hemoglobin; Ca2+ leaves the red cell.","Lactate dehydrogenase forms carbonic acid in plasma; HCO3− is exchanged for HPO4 2−."],"a":1,"qk":"대부분의 CO₂를 중탄산염(bicarbonate)으로 운반하는 데 핵심적인 효소와 이온 교환은 무엇입니까?","ok":["혈장의 헥소키나아제가 CO₂를 카바미노 화합물로 바꾸고, Na⁺가 적혈구로 들어간다.","적혈구의 탄산탈수효소가 CO₂ + H₂O → H₂CO₃ 반응을 빠르게 하고, HCO₃⁻는 Cl⁻와 교환되어 나간다(염소 이동).","폐 내피의 ACE가 HCO₃⁻를 용존 CO₂로 바꾸고, K⁺가 H⁺와 교환된다.","호중구의 골수세포형과산화효소가 CO₂를 헤모글로빈에 결합시키고, Ca²⁺가 적혈구에서 나간다.","젖산탈수소효소가 혈장에서 탄산을 만들고, HCO₃⁻는 HPO₄²⁻와 교환된다."],"exp":"**정답 이유**\n\n혈액은 CO₂를 거의 전부 중탄산염(bicarbonate, HCO₃⁻)으로 운반합니다(약 90%). 흐름은 다음과 같습니다.\n\n① 조직에서 생긴 CO₂가 적혈구(rbc)로 들어갑니다.\n② 탄산탈수효소(carbonic anhydrase)가 CO₂ + H₂O → H₂CO₃ 반응을 빠르게 진행시킵니다.\n③ H₂CO₃ → H⁺ + HCO₃⁻로 해리됩니다.\n④ H⁺는 헤모글로빈에 붙고, HCO₃⁻는 Cl⁻와 맞바꿔 혈장으로 나갑니다. 이 교환이 **염소 이동(chloride shift)**입니다.\n\n용존 CO₂와 카바미노 화합물은 각각 약 5%에 불과합니다.","why":{"0":"헥소키나아제는 해당 과정의 효소이며 CO₂ 운반과 무관합니다. 카바미노 화합물은 소량(약 5%)만 차지합니다.","2":"ACE는 안지오텐신 I을 안지오텐신 II로 전환하는 폐의 비호흡 기능입니다. HCO₃⁻를 용존 CO₂로 바꾸는 효소가 아닙니다.","3":"골수세포형과산화효소는 백혈구의 살균 효소입니다. CO₂ 운반 경로가 아닙니다.","4":"젖산탈수소효소는 젖산 대사 효소입니다. 탄산 형성을 가속하는 것은 적혈구 안의 탄산탈수효소입니다."},"one":"적혈구의 탄산탈수효소가 HCO₃⁻를 만들고, HCO₃⁻는 Cl⁻와 교환되어 혈장으로 나가는 염소 이동이 CO₂ 운반의 핵심이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Key Points) / 8b. Pulmonary Physiology 2026.pdf, slide 67","img":[{"u":"img/w11_pulm_phys/p67.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 67","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-28":{"q":"Which pairing about obstructive lung disease is correct?","o":["Asthma is distinguished by a decreased DL; the best spirometric indicator of COPD is an increased FEV1.","Asthma is distinguished by a normal or elevated DL; the best spirometric indicator of COPD is a decreased FEF25-75.","Emphysema is distinguished by an elevated DL; the best spirometric indicator of COPD is an increased FVC.","Asthma and emphysema both lower DL equally; the best COPD indicator is a normal FEV1/FVC ratio.","Restrictive fibrosis raises DL; the best spirometric indicator of COPD is an increased TLC."],"a":1,"qk":"폐쇄성 폐질환에 대한 짝이 올바른 것은 무엇입니까?","ok":["천식은 감소한 폐확산능(DL)으로 구별되고, COPD의 가장 좋은 폐활량 지표는 증가한 FEV1이다.","천식은 정상이거나 증가한 폐확산능(DL)으로 구별되고, COPD의 가장 좋은 폐활량 지표는 감소한 FEF25-75이다.","폐기종은 증가한 폐확산능(DL)으로 구별되고, COPD의 가장 좋은 폐활량 지표는 증가한 FVC이다.","천식과 폐기종은 DL을 똑같이 떨어뜨리고, COPD의 가장 좋은 지표는 정상 FEV1/FVC 비이다.","제한성 섬유증은 DL을 올리고, COPD의 가장 좋은 폐활량 지표는 증가한 TLC이다."],"exp":"**정답 이유**\n\n폐쇄성 폐질환은 환기-관류 불일치와 저산소혈증을 일으킵니다. 폐기종(emphysema)은 잔기량(RV), 기능적 잔기량(FRC), 총폐용량(TLC)이 증가하는 것이 특징입니다.\n\n천식(asthma)을 폐기종·만성 기관지염과 **가장 잘 구별하는** 소견은 폐확산능(lung diffusing capacity, DL)이 **정상이거나 오히려 증가**하는 것입니다. 폐기종에서는 폐포-모세혈관 표면적이 줄어 DL이 감소합니다.\n\nCOPD의 **가장 좋은 폐활량 측정 지표**는 노력성 폐활량의 중간 호기 유속인 **FEF25-75의 감소**입니다.","why":{"0":"천식의 DL은 감소가 아니라 정상 또는 증가입니다. COPD에서 FEV1은 증가가 아니라 감소합니다.","2":"폐기종에서는 확산 면적이 줄어 DL이 감소합니다. FVC 증가가 COPD의 최고 지표가 아닙니다.","3":"두 질환의 DL은 같지 않습니다(천식은 정상·증가, 폐기종은 감소). COPD에서 FEV1/FVC 비는 정상가 아니라 감소합니다.","4":"제한성 섬유증은 막이 두꺼워지고 폐용적이 줄어 DL이 감소하는 쪽입니다. TLC 증가는 폐기종의 소견이지 COPD의 최고 폐활량 지표가 아닙니다."},"one":"천식은 정상 또는 증가한 DL로 폐기종·기관지염과 구별되고, COPD의 가장 좋은 폐활량 지표는 FEF25-75 감소이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Key Points) / 8b. Pulmonary Physiology 2026.pdf, slides 82, 53","img":[{"u":"img/w11_pulm_phys/p82.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 82","w":1200,"h":900},{"u":"img/w11_pulm_phys/p53.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 53","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-29":{"q":"Hypoxic pulmonary vasoconstriction is triggered when alveolar PO2 falls below which value, and what is its physiologic role?","o":["PAO2 < 100 mm Hg; it dilates all pulmonary arteries to raise total pulmonary blood flow.","PAO2 < 95 mm Hg; it increases bronchial circulation to compensate for a right-to-left shunt.","PAO2 < 80 mm Hg; it bronchoconstricts unperfused alveoli and stops surfactant production.","PAO2 < 70 mm Hg; it constricts pulmonary vessels and redirects blood flow toward better-ventilated alveoli.","PAO2 < 40 mm Hg; it raises systemic arterial pressure by increasing total peripheral resistance."],"a":3,"qk":"저산소성 폐혈관 수축(hypoxic pulmonary vasoconstriction)은 폐포 PO₂가 어느 값 아래로 떨어질 때 일어나고, 그 생리적 역할은 무엇입니까?","ok":["PAO₂ < 100 mmHg일 때 일어나며, 모든 폐동맥을 확장해 폐 혈류 전체를 늘린다.","PAO₂ < 95 mmHg일 때 일어나며, 기관지 순환을 늘려 우→좌 단락을 보상한다.","PAO₂ < 80 mmHg일 때 일어나며, 관류되지 않는 폐포를 기관지 수축시키고 표면활성제 생산을 멈춘다.","PAO₂ < 70 mmHg일 때 일어나며, 폐혈관을 수축시켜 혈류를 환기가 더 나은 폐포 쪽으로 돌린다.","PAO₂ < 40 mmHg일 때 일어나며, 총말초저항을 올려 전신 동맥압을 높인다."],"exp":"**정답 이유**\n\n폐에서 혈류 분포를 조절하는 주된 인자는 폐포 산소 분압(PAO₂)입니다. 폐포 저산소(alveolar hypoxia), 즉 **PAO₂ < 70 mmHg**가 되면 저산소성 폐혈관 수축(hypoxic pulmonary vasoconstriction)이 일어납니다.\n\n이 반응은 환기가 나쁜 폐포로 가는 혈액을 줄이고, 혈류를 환기가 더 나은 폐포 쪽으로 **재분배(redirects blood flow)**합니다. 그래서 V/Q 짝을 맞추는 보상 반응이 됩니다. 전신 순환의 저산소성 혈관 확장과 반대 방향이라는 점도 기억하십시오.","why":{"0":"역치가 100 mmHg가 아니며, 이 반응은 확장이 아니라 수축입니다. 목적도 전체 혈류를 늘리는 것이 아니라 혈류를 재분배하는 것입니다.","1":"95 mmHg는 정상적인 동맥 PO₂에 가깝고, 이 반응의 역치가 아닙니다. 기관지 순환을 늘리는 기전도 아닙니다.","2":"환기는 되지만 관류가 없는 폐포(폐포 사강)의 보상은 기관지 수축과 표면활성제 감소입니다. 저산소성 폐혈관 수축의 역치·기전이 아닙니다.","4":"40 mmHg는 혼합정맥혈 PO₂에 가깝습니다. 저산소성 폐혈관 수축은 전신 동맥압을 올리기 위한 반응이 아닙니다."},"one":"폐포 PAO₂가 70 mmHg 미만이면 저산소성 폐혈관 수축이 일어나 혈류를 환기가 더 나은 폐포 쪽으로 돌린다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Key Points) / 8b. Pulmonary Physiology 2026.pdf, slide 43","img":[{"u":"img/w11_pulm_phys/p43.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 43","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_pulm_phys-30":{"q":"Which statement best describes mucosa-associated lymphoid tissue (MALT) in the lung?","o":["MALT is the enzyme on endothelium that converts angiotensin I to angiotensin II.","MALT cells include plasma cells that secrete IgA to help remove airway particulates, along with specialized T cells, NK cells, dendritic cells, and alveolar macrophages.","MALT is the upward-moving mucus layer propelled by biphasic ciliary activity toward the pharynx.","MALT is the surfactant film secreted by type II pneumocytes to lower alveolar surface tension.","MALT is the anatomic dead space air that fills the conducting airways and never reaches the alveoli."],"a":1,"qk":"폐의 점막연관 림프조직(MALT)을 가장 잘 설명하는 것은 무엇입니까?","ok":["MALT는 안지오텐신 I을 안지오텐신 II로 전환하는 내피 효소이다.","MALT 세포에는 기도 입자를 제거하는 IgA를 분비하는 형질세포와, 특수한 T세포·NK세포·수지상세포·폐포 대식세포가 포함된다.","MALT는 이상성 섬모 운동에 의해 인두 쪽으로 올라가는 점액층이다.","MALT는 폐포 표면장력을 낮추려고 제2형 폐포세포가 분비하는 표면활성제 막이다.","MALT는 전도기도에 차서 폐포에 도달하지 못하는 해부학적 사강 공기이다."],"exp":"**정답 이유**\n\n점막연관 림프조직(mucosa-associated lymphoid tissue, MALT)은 폐의 면역 방어입니다. MALT를 이루는 세포는 다음과 같습니다.\n\n· 형질세포(plasma cells)는 IgA를 분비하여 기도의 입자 제거를 돕습니다.\n· 특수한 T 림프구는 면역감시(immuno-surveillance)를 하고 사이토카인을 분비합니다.\n· NK 세포는 사이토카인을 분비하고 표적 세포를 죽입니다.\n· 수지상세포(dendritic cells)는 항원을 보조 T세포와 세포독성 T세포에 제시합니다.\n· 폐포 대식세포(alveolar macrophages)는 폐포까지 도달한 입자를 빠르게 탐식하고, T세포 활성을 억제해 염증을 줄입니다.\n\n큰 입자는 코에서, 작은 입자는 점액섬모 수송으로, 폐포 입자는 대식세포로 제거됩니다. 점액섬모 에스컬레이터 자체는 MALT가 아닙니다.","why":{"0":"안지오텐신 I을 II로 전환하는 것은 폐 내피의 ACE입니다. MALT가 아닙니다.","2":"인두 쪽으로 올라가는 점액층은 점액섬모 수송(mucociliary transport)입니다. MALT는 면역 세포 조직입니다.","3":"표면활성제는 제2형 폐포세포의 분비물로 표면장력을 낮춥니다. 면역 조직이 아닙니다.","4":"해부학적 사강은 전도기도에 머무는 공기로, 림프조직이 아닙니다."},"one":"폐 MALT는 IgA를 분비하는 형질세포와 T세포·NK세포·수지상세포·폐포 대식세포로 이루어진 면역 방어 조직이다.","src":"8a. Pulmonary Physiology Key Points 2026.doc (Key Points) / 8b. Pulmonary Physiology 2026.pdf, slides 88, 85","img":[{"u":"img/w11_pulm_phys/p88.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 88","w":1200,"h":900},{"u":"img/w11_pulm_phys/p85.webp","cap":"8a. Pulmonary Physiology Key Points 2026.doc / 8b. Pulmonary Physiology 2026.pdf, slide 85","w":1200,"h":900}],"ch":"w11_pulm_phys","chn":"Pulmonary Physiology","week":11},"w11_cv_phys-1":{"q":"Which statement best characterizes the normal right heart?","o":["It is a high pressure pump.","It forces blood into the vena cava.","It produces systolic pressures of 120 mm Hg.","It pumps a volume of blood equal to that pumped by the left heart.","It has greater afterload than the left heart."],"a":3,"qk":"정상 우심(right heart)을 가장 잘 설명하는 것은 무엇입니까?","ok":["고압 펌프(high pressure pump)이다.","혈액을 대정맥(vena cava)으로 밀어낸다.","120 mmHg의 수축기압을 만든다.","좌심이 박출하는 혈액량과 같은 양을 박출한다.","좌심보다 후부하(afterload)가 크다."],"exp":"**정답 이유**\n\n\"좌·우 심실의 심박출량은 정상적으로 **양은 같지만 압력은 같지 않습니다**\". 두 심실은 하나의 회로로 이어져 있습니다. 만약 우심이 좌심보다 조금이라도 더 많이 보내면 그 차이만큼 혈액이 폐에 계속 쌓이게 됩니다. 그래서 정상에서는 박출량이 같아야 합니다. 우심은 \"용적 펌프(volume pump)\", 좌심은 \"압력 펌프(pressure pump)\"입니다.","why":{"0":"우심은 저압의 폐순환으로 혈액을 보내는 **저압** 펌프입니다.","1":"우심은 혈액을 대정맥에서 **받아서** 폐동맥(pulmonary artery)으로 내보냅니다.","2":"120 mmHg는 **좌**심실 수축기압입니다. 우심실 수축기압은 약 25 mmHg입니다.","4":"후부하는 우심실의 경우 평균 폐동맥압, 좌심실의 경우 평균 체동맥압입니다. 폐동맥압이 훨씬 낮으므로 우심의 후부하가 더 **작습니다**."},"one":"정상에서 우심과 좌심은 박출하는 혈액량은 같고, 압력은 같지 않다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q1) / 9b. Cardiovascular Physiology 2026.pdf, slides 52, 55","img":[{"u":"img/w11_cv_phys/p52.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 52","w":1200,"h":900},{"u":"img/w11_cv_phys/p55.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 55","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-2":{"q":"Assuming no change in the other forces, what effect will an increase in plasma oncotic pressure have on capillary fluid dynamics?","o":["An increase in capillary filtration.","An increase in net filtration pressure.","A decrease in capillary absorption.","An increase in interstitial hydrostatic pressure.","A decrease in capillary filtration."],"a":4,"qk":"다른 힘들은 변하지 않는다고 할 때, 혈장 교질삼투압(plasma oncotic pressure)이 증가하면 모세혈관 액체 역학에 어떤 영향이 있습니까?","ok":["모세혈관 여과(filtration) 증가","순여과압(net filtration pressure) 증가","모세혈관 재흡수(absorption) 감소","간질 정수압(interstitial hydrostatic pressure) 증가","모세혈관 여과(filtration) 감소"],"exp":"**스탈링 힘 **\n\n순여과 = (CHP + TOP) − (POP + THP)\n\n· CHP 모세혈관 정수압(capillary hydrostatic pressure), TOP 조직 교질삼투압(tissue oncotic pressure): 물을 **밖으로** 미는 힘\n\n· POP 혈장 교질삼투압(plasma oncotic pressure), THP 조직 정수압(tissue hydrostatic pressure): 물을 **안으로** 붙잡는 힘\n\n혈장 교질삼투압은 혈장 단백질(주로 알부민 albumin)이 물을 혈관 안으로 끌어당기는 힘입니다. 이 값이 커지면 위 식의 빼는 쪽이 커지므로 순여과가 줄고, 결국 **여과가 감소**합니다.","why":{"0":"정반대입니다. 여과와 순여과압은 감소합니다.","1":"정반대입니다. 여과와 순여과압은 감소합니다.","2":"물을 혈관 안으로 끌어당기는 힘이 커지므로 재흡수는 오히려 **증가**합니다.","3":"여과가 줄면 간질로 나가는 물이 줄어, 간질 정수압은 증가하지 않습니다."},"one":"혈장 교질삼투압이 증가하면 물을 혈관 안으로 붙잡는 힘이 커져 모세혈관 여과가 감소한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q2) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14","w":1200,"h":900},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-3":{"q":"What is primarily responsible for the increased blood flow to active muscle?","o":["Dilation of small veins and venules.","Dilation of capillaries.","Constriction of arterioles.","Venoconstriction.","Accumulation of vasodilatory metabolites in the muscle."],"a":4,"qk":"활동하는 근육으로의 혈류 증가를 주로 일으키는 것은 무엇입니까?","ok":["작은 정맥과 세정맥(venules)의 확장","모세혈관(capillaries)의 확장","세동맥(arterioles)의 수축","정맥 수축(venoconstriction)","근육 내 혈관확장성 대사산물(vasodilatory metabolites)의 축적"],"exp":"**정답 이유**\n\n미세순환의 혈류는 국소 조직 대사산물(local tissue metabolites)의 영향을 받습니다. 근육이 일하면 CO₂, H⁺, 젖산(lactate), K⁺, 아데노신(adenosine)이 쌓이고 O₂는 줄어듭니다. 이 대사산물들이 그 근육의 **세동맥 평활근을 이완**시킵니다. 세동맥이 넓어지면 저항이 줄어(저항 ∝ 1/r⁴) 혈류가 크게 늘어납니다. 이를 능동 충혈(active hyperemia)이라고 합니다. 일을 많이 하는 조직이 스스로 혈류를 더 끌어오는 셈입니다.","why":{"0":"정맥은 저항 혈관이 아니라 **용량 혈관(capacitance vessel)**입니다. 정맥의 지름 변화는 혈류량 조절보다 혈액 저장과 정맥 환류에 관여합니다.","3":"정맥은 저항 혈관이 아니라 **용량 혈관(capacitance vessel)**입니다. 정맥의 지름 변화는 혈류량 조절보다 혈액 저장과 정맥 환류에 관여합니다.","1":"모세혈관은 평활근이 없어 스스로 확장하지 못합니다. 혈류 변화는 상류의 세동맥이 결정합니다.","2":"세동맥이 **수축**하면 혈류는 오히려 감소합니다."},"one":"활동 근육의 혈류 증가는 주로 혈관확장성 대사산물 축적에 의한 세동맥 이완 때문이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q3) / 9b. Cardiovascular Physiology 2026.pdf, slide 18","img":[{"u":"img/w11_cv_phys/p18.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 18","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-4":{"q":"What best characterizes normal veins?","o":["They are resistance vessels.","They are exchange vessels.","They are more compliant than arteries.","They have thicker walls than arteries.","They contain less blood than arteries."],"a":2,"qk":"정상 정맥(veins)을 가장 잘 설명하는 것은 무엇입니까?","ok":["저항 혈관(resistance vessels)이다.","교환 혈관(exchange vessels)이다.","동맥보다 순응도(compliance)가 크다.","동맥보다 벽이 두껍다.","동맥보다 혈액을 적게 담고 있다."],"exp":"**정답 이유**\n\n순응도(compliance)는 압력이 조금 오를 때 부피가 얼마나 늘어나는지를 나타내는 \"늘어나는 성질(distensibility)\"입니다. 정맥은 벽이 얇고 탄성이 적어 **매우 잘 늘어납니다**(\"veins are highly compliant\"). 그래서 전체 혈액의 약 2/3를 담는 저장소(용량 혈관 capacitance vessel) 역할을 합니다. 필요할 때 이 저장 혈액을 동원하면 정맥 환류와 심박출량이 늘어납니다.","why":{"0":"저항 혈관은 **세동맥(arteriole)**입니다.","1":"교환 혈관은 **모세혈관(capillary)**입니다.","3":"정맥은 동맥보다 벽이 **얇습니다**.","4":"정맥은 동맥보다 혈액을 훨씬 **많이** 담고 있습니다."},"one":"정맥은 동맥보다 순응도(compliance)가 커서 용량 혈관(capacitance vessel)으로 작용한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q4) / 9b. Cardiovascular Physiology 2026.pdf, slide 9","img":[{"u":"img/w11_cv_phys/p09.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 9","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-5":{"q":"Turbulence in the vasculature is most likely to occur","o":["in capillaries.","in venules.","with increased blood viscosity.","when the hematocrit is low.","in vessels arranged in series."],"a":3,"qk":"혈관계에서 난류(turbulence)가 생길 가능성이 가장 높은 경우는 언제입니까?","ok":["모세혈관에서","세정맥에서","혈액 점도(viscosity)가 증가했을 때","적혈구용적률(hematocrit)이 낮을 때","직렬(series)로 배열된 혈관에서"],"exp":"**정답 이유**\n\n난류는 다음 경우에 잘 생깁니다. (a) 혈관 지름이 클 때, (b) **혈액 점도가 낮을 때**, (c) 유속이 빠를 때, (d) 국소적으로 혈관이 좁아졌을 때. 적혈구용적률은 혈액 중 적혈구가 차지하는 비율이고, 혈액 점도를 결정하는 가장 큰 요인입니다. 빈혈처럼 적혈구용적률이 **낮으면** 점도가 낮아져 난류가 잘 생깁니다. 빈혈 환자에서 심잡음(murmur)이 들리는 이유이기도 합니다. (참고: 이는 레이놀즈 수 Reynolds number = 밀도 × 지름 × 속도 / 점도와 같은 원리입니다.)","why":{"0":"모세혈관과 세정맥은 지름이 매우 작고 유속도 느려 난류가 거의 생기지 않습니다.","1":"모세혈관과 세정맥은 지름이 매우 작고 유속도 느려 난류가 거의 생기지 않습니다.","2":"점도가 **증가**하면 난류는 오히려 생기기 어렵습니다.","4":"직렬이냐 병렬이냐 하는 배열은 전체 저항 계산과 관련된 개념입니다. 난류의 조건이 아닙니다."},"one":"적혈구용적률이 낮아 혈액 점도가 떨어지면 혈관계에서 난류가 생기기 쉽다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q5) / 9b. Cardiovascular Physiology 2026.pdf, slides 11, 12","img":[{"u":"img/w11_cv_phys/p11.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 11","w":1200,"h":900},{"u":"img/w11_cv_phys/p12.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 12","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-6":{"q":"What is the most important factor favoring normal filtration across capillaries?","o":["Plasma oncotic pressure.","Tissue oncotic pressure.","Hydrostatic pressure.","Tissue hydrostatic pressure.","Lymph flow."],"a":2,"qk":"정상적인 모세혈관 여과(filtration)를 촉진하는 가장 중요한 요인은 무엇입니까?","ok":["혈장 교질삼투압","조직 교질삼투압","정수압(hydrostatic pressure)","조직 정수압","림프 흐름(lymph flow)"],"exp":"**정답 이유**\n\n여과를 일으키는 힘은 CHP(모세혈관 정수압)와 TOP(조직 교질삼투압)입니다. 이 중 압도적으로 큰 힘은 심장이 만든 혈압이 모세혈관까지 전달된 **모세혈관 정수압**입니다(동맥 쪽 약 30–35 mmHg). 그래서 여과는 주로 정수압이 높은 동맥 쪽에서 일어나고, 정수압이 낮아진 정맥 쪽에서는 재흡수가 일어납니다.","why":{"0":"혈장 교질삼투압은 여과에 **반대**하는(물을 붙잡는) 힘입니다.","1":"조직 교질삼투압은 여과를 돕는 쪽이지만, 정상에서 간질 단백질이 적어 값이 작습니다.","3":"조직 정수압은 여과에 반대하는 힘이고, 값도 작습니다(0 근처).","4":"림프 흐름은 여과된 여분의 액체를 간질에서 제거하는 경로입니다. 여과를 일으키는 힘이 아닙니다."},"one":"정상적인 모세혈관 여과를 촉진하는 가장 중요한 요인은 정수압(hydrostatic pressure)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q6) / 9b. Cardiovascular Physiology 2026.pdf, slides 14, 15","img":[{"u":"img/w11_cv_phys/p14.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 14","w":1200,"h":900},{"u":"img/w11_cv_phys/p15.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 15","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-7":{"q":"What does an increase in the slope of phase 4 of slow response action potentials result in?","o":["Increased heart rate","Decreased heart rate","Decreased firing rate of the SA node","Decreased inward conductance of calcium current","Increased outward conductance of potassium current."],"a":0,"qk":"느린 반응 활동전위(slow response action potential)에서 4기(phase 4)의 기울기가 증가하면 어떤 결과가 생깁니까?","ok":["심박수 증가","심박수 감소","동방결절(SA node) 발화율 감소","칼슘 내향 전도도(inward conductance) 감소","칼륨 외향 전도도(outward conductance) 증가"],"exp":"**정답 이유**\n\n동방결절 같은 박동조율세포(pacemaker cell)는 4기에 스스로 서서히 탈분극합니다(자발적 탈분극 spontaneous depolarization). 이는 funny 전류(If), Ca²⁺ 전류 등 때문입니다. 이 오르막의 **기울기가 가파르면 역치(threshold)에 더 빨리 도달**합니다. 그만큼 활동전위가 자주 발생하므로 동방결절 발화율이 늘고 **심박수가 증가**합니다. 교감신경(β₁)이 바로 이 방식으로 심박수를 올립니다.","why":{"1":"기울기가 **감소**할 때(부교감, ACh)의 결과입니다.","2":"기울기가 **감소**할 때(부교감, ACh)의 결과입니다.","3":"칼슘(과 If) 내향 전류가 **증가**해야 기울기가 가팔라집니다. 감소는 반대 결과를 낳습니다.","4":"칼륨 외향 전류 증가(KACₕ 채널 열림)는 세포를 과분극시켜 기울기를 **완만하게** 만듭니다. 부교감 작용입니다."},"one":"느린 반응 활동전위 4기 기울기가 증가하면 역치에 더 빨리 도달해 심박수가 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q7) / 9b. Cardiovascular Physiology 2026.pdf, slides 25, 26, 56","img":[{"u":"img/w11_cv_phys/p25.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 25","w":1200,"h":900},{"u":"img/w11_cv_phys/p26.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 26","w":1200,"h":900},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-8":{"q":"Which phase of the fast response action potential is maintained by Na/K ATPase?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"qk":"빠른 반응 활동전위(fast response action potential)의 어느 기가 Na/K ATPase에 의해 유지됩니까?","ok":["0기","1기","2기","3기","4기"],"exp":"**정답 이유**\n\n4기는 \"안정막전위(resting membrane potential)가 회복되어 **안정적인**\" 시기입니다. 활동전위 동안 Na⁺는 세포 안으로 들어오고 K⁺는 밖으로 나갑니다. Na⁺/K⁺ ATPase는 ATP를 써서 Na⁺ 3개를 내보내고 K⁺ 2개를 들여와 이온 농도 기울기를 되돌립니다. 이 덕분에 안정막전위(약 −90 mV)가 유지되므로 4기와 가장 직접적으로 연결됩니다.","why":{"0":"0기: 빠른 Na⁺ 채널 개방에 의한 급속 탈분극","1":"1기: 빠른 Na⁺ 채널 불활성화에 의한 초기 재분극","2":"2기: L형 Ca²⁺ 채널 유입과 K⁺ 유출의 균형으로 생기는 고원기(plateau)","3":"3기: Ca²⁺ 채널이 닫히고 K⁺가 유출되는 재분극"},"one":"빠른 반응 활동전위의 4기(안정막전위)는 Na⁺/K⁺ ATPase에 의해 유지된다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q8) / 9b. Cardiovascular Physiology 2026.pdf, slide 23","img":[{"u":"img/w11_cv_phys/p23.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 23","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-9":{"q":"Which phase of the slow response action potential is affected by adrenergic agonists?","o":["Phase 0","Phase 1","Phase 2","Phase 3","Phase 4"],"a":4,"qk":"느린 반응 활동전위의 어느 기가 아드레날린 작동제(adrenergic agonists)의 영향을 받습니까?","ok":["0기","1기","2기","3기","4기"],"exp":"**정답 이유**\n\n\"아드레날린 작동제가 박동조율세포의 β₁ 수용체에 결합하면 If와 Ca²⁺ 전류에 영향을 주어 느린 반응 활동전위 **4기의 기울기를 증가**시킵니다. 그 결과 동방결절 발화율이 증가합니다\". Q7과 짝을 이루는 문제입니다.","why":{"1":"느린 반응 활동전위에는 **1기와 2기가 없습니다**. 0, 3, 4의 세 기만 있습니다. 이 두 보기는 처음부터 해당 사항이 없습니다.","2":"느린 반응 활동전위에는 **1기와 2기가 없습니다**. 0, 3, 4의 세 기만 있습니다. 이 두 보기는 처음부터 해당 사항이 없습니다.","0":"0기(L형 Ca²⁺ 유입에 의한 상승)도 교감 자극으로 약간 영향을 받습니다. 하지만 심박수를 바꾸는 핵심이자","3":"3기는 K⁺ 유출에 의한 재분극으로, 시험에서 요구하는 답이 아닙니다."},"one":"아드레날린 작동제는 느린 반응 활동전위의 4기 기울기를 증가시켜 심박수를 올린다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q9) / 9b. Cardiovascular Physiology 2026.pdf, slide 56","img":[{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-10":{"q":"What change in the EKG comes with a bundle branch block (BBB)?","o":["An increase in the PR interval.","A wider QRS complex.","A decrease in the PR interval.","Atrial fibrillation.","Absence of T waves."],"a":1,"qk":"각차단(bundle branch block, BBB)이 있으면 심전도(EKG)에 어떤 변화가 생깁니까?","ok":["PR 간격 증가","QRS 복합파가 넓어짐","PR 간격 감소","심방세동(atrial fibrillation)","T파 소실"],"exp":"**정답 이유**\n\n흥분은 동방결절 → 방실결절 → 히스속(bundle of His) → **좌·우 각(bundle branches)** → 푸르키네 섬유(Purkinje fibers)로 전달됩니다. QRS 복합파는 심실이 탈분극되는 시간입니다. 한쪽 각이 막히면 그쪽 심실은 빠른 전도로를 쓰지 못합니다. 대신 반대쪽 심실에서 심근세포끼리 천천히 흥분이 퍼져 와야 하므로, 심실 탈분극 시간이 길어져 **QRS가 넓어집니다**(≥ 0.12초).","why":{"0":"PR 간격 증가는 방실결절 전도 지연, 즉 1도 방실차단(first degree AV block)의 소견입니다. 각차단은 방실결절보다 아래 문제입니다.","2":"PR 간격 감소는 우회로(예: WPW 증후군)나 방실결절 전도가 빨라질 때 보입니다.","3":"심방세동은 심방의 재진입(reentry) 부정맥입니다. 각차단과는 별개입니다.","4":"각차단에서도 T파는 있습니다(모양이 변할 수는 있습니다)."},"one":"각차단(bundle branch block)이 있으면 심실 탈분극이 늦어져 QRS 복합파가 넓어진다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q10) / 9b. Cardiovascular Physiology 2026.pdf, slides 27, 32, 33","img":[{"u":"img/w11_cv_phys/p27.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 27","w":1200,"h":900},{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-11":{"q":"What is the most life-threatening cardiac arrhythmia ?","o":["Atrial flutter","Atrial fibrillation","Ventricular tachycardia","Sinus rhythm","Ventricular fibrillation"],"a":4,"qk":"가장 생명을 위협하는 부정맥(cardiac arrhythmia)은 무엇입니까?","ok":["심방조동(atrial flutter)","심방세동(atrial fibrillation)","심실빈맥(ventricular tachycardia)","동성리듬(sinus rhythm)","심실세동(ventricular fibrillation)"],"exp":"**정답 이유**\n\n심실세동은 심실 근육이 재진입 흥분(reentrant excitation)으로 제각각 무질서하게 떨기만 하는 상태입니다. 심실이 한꺼번에 수축하지 못하므로 **혈액을 전혀 박출하지 못합니다**. 맥박과 혈압이 사라지고 몇 분 안에 뇌 손상과 사망에 이릅니다. 즉시 제세동(defibrillation)이 필요합니다.","why":{"0":"심방조동과 심방세동은 심방의 문제입니다. 심방 수축이 사라지더라도 심실은 계속 박출하므로 즉시 치명적이지는 않습니다(장기적으로는 혈전·뇌졸중 위험이 있습니다).","1":"심방조동과 심방세동은 심방의 문제입니다. 심방 수축이 사라지더라도 심실은 계속 박출하므로 즉시 치명적이지는 않습니다(장기적으로는 혈전·뇌졸중 위험이 있습니다).","2":"심실빈맥은 위험하고 심실세동으로 넘어갈 수 있습니다. 하지만 아직 박출이 어느 정도 유지되는 경우가 많아 심실세동보다는 덜 치명적입니다.","3":"동성리듬은 **정상** 리듬입니다."},"one":"가장 생명을 위협하는 부정맥은 심실세동(ventricular fibrillation)이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q11) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-12":{"q":"Which of the following is a cholinergic response to stimulation of M receptors in the SA node of the heart by ACh as observed on an EKG?","o":["Missing P waves.","Decreased PR interval","Longer RR interval","Longer QT interval","Missing T waves"],"a":2,"qk":"ACh가 동방결절의 M 수용체를 자극했을 때 EKG에서 관찰되는 콜린성(cholinergic) 반응은 무엇입니까?","ok":["P파 소실","PR 간격 감소","RR 간격 증가","QT 간격 증가","T파 소실"],"exp":"**정답 이유**\n\nACh가 M₂ 수용체에 결합하면 KACₕ 채널이 열려 4기 기울기가 완만해집니다. 그래서 동방결절 발화가 느려지고, 방실결절의 지연 시간도 길어집니다. **RR 간격**은 한 심박의 R파에서 다음 심박의 R파까지의 시간입니다. 심박수가 느려지면 RR 간격이 **길어집니다**. (심박수 = 60 / RR간격(초))","why":{"0":"P파는 심방 탈분극이므로, 느려지더라도 동방결절 흥분이 있으면 나타납니다.","1":"ACh는 방실결절 전도를 늦추므로 PR 간격이 **증가**하는 쪽입니다.","3":"QT 간격은 심박수가 느리면 약간 길어질 수는 있습니다. 하지만 동방결절 M 수용체 자극의 직접적이고 대표적인 소견은 RR 간격 증가입니다.","4":"T파(심실 재분극)는 소실되지 않습니다."},"one":"ACh가 동방결절 M 수용체를 자극하면 심박수가 느려져 EKG에서 RR 간격이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q12) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 56","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p56.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 56","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-13":{"q":"James is a 58-yr-old with a history of cigarette smoking and two myocardial infarctions. A routine EKG shows that the mean electrical axis of his heart is shifted toward the left of normal. What does this indicate?","o":["A first degree conduction block","Right ventricular hypertrophy","Left ventricular hypertrophy","Ectopic pacemakers","Third degree heart block"],"a":2,"qk":"James는 흡연력과 두 번의 심근경색(myocardial infarction) 병력이 있는 58세 남성입니다. 정기 EKG에서 심장의 평균 전기축(mean electrical axis)이 정상보다 왼쪽으로 치우쳐 있습니다. 이것은 무엇을 의미합니까?","ok":["1도 전도차단(first degree conduction block)","우심실 비대(right ventricular hypertrophy)","좌심실 비대(left ventricular hypertrophy)","이소성 박동조율기(ectopic pacemakers)","3도 방실차단(third degree heart block)"],"exp":"**정답 이유**\n\n평균 전기축은 심실 탈분극 전류가 전체적으로 향하는 방향입니다. 심근이 **두꺼운 쪽으로** 전류가 더 많이 흐르므로 축이 그쪽으로 기웁니다. 좌심실이 비대해지면 축이 **왼쪽으로 치우칩니다(좌축편위 left axis deviation)**. 이 환자는 심근경색과 흡연력(고혈압·관상동맥질환 위험)이 있어, 남은 좌심실 근육이 더 큰 부담을 견디며 두꺼워졌다고 보는 것이 자연스럽습니다.","why":{"0":"1도 차단은 PR 간격 연장으로 나타납니다. 축과는 관계없습니다.","1":"우심실 비대는 축을 **오른쪽**으로 치우치게 합니다.","3":"이소성 박동조율기는 비정상 위치에서 생기는 박동(조기수축 등)으로, 평균축이 지속적으로 왼쪽으로 치우치는 것과는 다릅니다.","4":"3도 차단은 P파와 QRS가 완전히 따로 뛰는 해리 현상입니다. 축 편위가 핵심 소견이 아닙니다."},"one":"평균 전기축의 좌측 편위는 좌심실 비대(left ventricular hypertrophy)를 시사한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q13) / 9b. Cardiovascular Physiology 2026.pdf, slide 33","img":[{"u":"img/w11_cv_phys/p33.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 33","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-14":{"q":"What cardiac arrhythmia is best illustrated by the EKG tracing shown on the right?","o":["Tachycardia.","Atrial fibrillation","Bradycardia.","Ventricular fibrillation","Third degree heart block"],"a":3,"qk":"오른쪽에 제시된 EKG 기록이 가장 잘 보여주는 부정맥은 무엇입니까?","ok":["빈맥(tachycardia)","심방세동(atrial fibrillation)","서맥(bradycardia)","심실세동(ventricular fibrillation)","3도 방실차단(third degree heart block)"],"exp":"**정답 이유**\n\n그림을 보면 **P파, QRS 복합파, T파를 전혀 구별할 수 없습니다**. 크기와 모양, 간격이 제각각인 불규칙한 파형만 계속 이어집니다. 심실 근육이 조율 없이 무질서하게 떨고 있다는 뜻이며, 이것이 심실세동의 전형적인 모습입니다. EKG는 파형의 모양과 간격으로 해석합니다.","why":{"0":"빈맥이라면 모양이 일정한 QRS가 빠르게 반복되어야 합니다.","1":"심방세동에서는 기저선이 잔물결처럼 떨리면서도, 좁은 **QRS 복합파는 뚜렷하게 보입니다**(간격만 불규칙합니다).","2":"서맥은 정상 모양의 파형이 느리게 나타나는 것입니다.","4":"3도 차단에서는 P파와 QRS가 각각 규칙적으로 나타나되 서로 관계가 없습니다. 파형 자체는 알아볼 수 있습니다."},"one":"P파·QRS·T파를 구별할 수 없는 불규칙한 파형은 심실세동의 전형적인 EKG이다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q14) / 9b. Cardiovascular Physiology 2026.pdf, slides 42, 46","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900},{"u":"img/w11_cv_phys/p46.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 46","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-15":{"q":"What physical finding would occur rapidly following initiation of the EKG pattern shown in question 14?","o":["A rapid, weak pulse","A seizure","A stroke","A sharp decline in blood pressure","Tachycardia"],"a":3,"qk":"14번 문제의 EKG 패턴이 시작된 직후 빠르게 나타나는 신체 소견은 무엇입니까?","ok":["빠르고 약한 맥박","발작(seizure)","뇌졸중(stroke)","혈압의 급격한 하강","빈맥(tachycardia)"],"exp":"**정답 이유**\n\n심실세동에서는 심실이 혈액을 박출하지 못합니다. 그래서 심박출량(cardiac output) = 심박수 × 일회박출량이 사실상 0이 되고, **혈압이 급격히 떨어집니다**. 맥박이 잡히지 않고, 수 초 안에 의식을 잃습니다.","why":{"0":"심실세동에서는 박출이 없으므로 맥박 자체가 **없습니다**(Q17 E \"no pulse\"). 빠르고 약한 맥박은 출혈성 쇼크 같은 상황의 소견입니다.","1":"뇌 혈류 중단으로 경련 같은 움직임이 나중에 생길 수는 있습니다. 하지만 가장 먼저, 빠르게 나타나는 핵심 소견은 혈압 하강입니다.","2":"뇌졸중은 주로 혈전 등으로 생기며 심방세동의 장기 합병증에 가깝습니다.","4":"빈맥은 EKG 리듬의 이름이지, 심실세동 후의 신체 소견이 아닙니다. 심실세동은 효과적인 심박 자체가 없습니다."},"one":"심실세동이 시작되면 박출이 없어 혈압이 급격히 하강한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q15) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11,"fig":{"u":"img/w11_cv_phys/fig_ekg.webp","cap":"EKG tracing (9a Study Q14–15)"}},"w11_cv_phys-16":{"q":"Which of the following is true about the cardiac cycle?","o":["High heart rates allow for increased EDV.","QRS complexes follow P waves on the EKG.","Increased cardiac contractility reduces cardiac output.","Stroke volume is independent of ventricular filling time.","Systolic pressure is highest in the right ventricle."],"a":1,"qk":"심장주기(cardiac cycle)에 대해 옳은 것은 무엇입니까?","ok":["빠른 심박수는 EDV(이완기말 용적) 증가를 허용한다.","EKG에서 QRS 복합파는 P파 뒤에 온다.","심장 수축력 증가는 심박출량을 감소시킨다.","일회박출량은 심실 충만 시간과 무관하다.","수축기압은 우심실에서 가장 높다."],"exp":"**정답 이유**\n\n정상 순서는 다음과 같습니다. 동방결절 흥분 → 심방 탈분극(P파) → 방실결절 지연 → 심실 탈분극(QRS) → 심실 재분극(T파). 따라서 **QRS는 항상 P파 다음**에 옵니다. 심방 수축(P파 뒤)이 먼저 혈액을 밀어 넣어 EDV를 채운 뒤, 심실이 수축(QRS 뒤)하는 순서입니다.","why":{"0":"심박수가 빠르면 이완기(충만 시간)가 짧아져 EDV가 **감소**합니다.","2":"수축력이 증가하면 ESV가 줄어 일회박출량과 심박출량이 **증가**합니다.","3":"충만 시간이 길면 EDV가 늘고, 프랭크-스탈링 법칙(Frank-Starling law)에 따라 일회박출량도 늡니다. 따라서 무관하지 않습니다.","4":"수축기압은 **좌심실**에서 가장 높습니다(약 120 vs 25 mmHg)."},"one":"심장주기에서 QRS 복합파는 항상 심방 탈분극인 P파 뒤에 온다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q16) / 9b. Cardiovascular Physiology 2026.pdf, slides 32, 49","img":[{"u":"img/w11_cv_phys/p32.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 32","w":1200,"h":900},{"u":"img/w11_cv_phys/p49.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 49","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-17":{"q":"Which cardiac arrhythmia is correctly matched with its effect on cardiac function?","o":["Atrial flutter: increased preload","Atrial fibrillation: increased afterload","Ventricular tachycardia: cardiac arrest","Mobitz 2 conduction block: increased cardiac output","Ventricular fibrillation: no pulse"],"a":4,"qk":"부정맥과 그것이 심장 기능에 미치는 효과가 올바르게 짝지어진 것은 무엇입니까?","ok":["심방조동: 전부하(preload) 증가","심방세동: 후부하(afterload) 증가","심실빈맥: 심정지(cardiac arrest)","Mobitz 2형 전도차단: 심박출량 증가","심실세동: 맥박 없음(no pulse)"],"exp":"**정답 이유**\n\n심실세동은 심실이 무질서하게 떨 뿐 박출이 없으므로 **맥박이 없습니다**. 짝이 정확합니다 (Q11·14·15와 같은 원리).","why":{"0":"심방조동에서는 효과적인 심방 수축이 없고 빠른 심박으로 충만 시간도 줄어듭니다. 그래서 전부하(EDV)가 오히려 **감소**하는 쪽입니다.","1":"후부하는 동맥압(대동맥압)으로 정해집니다. 심방세동은 후부하를 높이지 않습니다.","2":"심실빈맥은 심정지로 진행할 **수는** 있습니다. 하지만 항상 심정지를 뜻하는 것은 아니어서, E만큼 확정적인 짝이 아닙니다.","3":"Mobitz 2형은 일부 심방 흥분이 심실로 전달되지 않아 심실 박동이 빠지는 차단입니다. 심박출량은 **감소**합니다."},"one":"심실세동은 효과적인 박출이 없으므로 맥박이 없다(no pulse).","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q17) / 9b. Cardiovascular Physiology 2026.pdf, slide 42","img":[{"u":"img/w11_cv_phys/p42.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 42","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-18":{"q":"The normal response of baroreceptors to an abrupt increase in blood pressure is","o":["a decrease in sensitivity.","an increase in sensitivity.","an increase in firing rate.","a decrease in firing rate.","nothing since baroreceptors do not monitor blood pressure."],"a":2,"qk":"혈압이 갑자기 상승할 때 압수용체(baroreceptors)의 정상 반응은 무엇입니까?","ok":["민감도 감소","민감도 증가","발화율(firing rate) 증가","발화율 감소","압수용체는 혈압을 감시하지 않으므로 아무 반응도 없다."],"exp":"**정답 이유**\n\n경동맥동(carotid sinus)과 대동맥궁(aortic arch)의 고압 압수용체는 **신장수용체(stretch receptors)**입니다. 혈압이 오르면 혈관벽이 더 늘어나므로 **발화율이 증가**합니다. 신호는 연수의 고립로핵(nucleus tractus solitarius, NTS)으로 갑니다. 그러면 교감신경 활동은 줄고 부교감신경 활동은 늘어 심박수와 혈관저항이 떨어지고, 혈압이 다시 내려옵니다.","why":{"0":"\"민감도\"는 수용체가 반응하는 기준(설정점) 자체를 뜻합니다. 급격한 혈압 변화에 대한 즉각 반응은 민감도 변화가 아니라 발화율 변화입니다. (만성 고혈압에서는 설정점이 재조정 resetting되지만, 이 문제와는 다릅니다.)","1":"\"민감도\"는 수용체가 반응하는 기준(설정점) 자체를 뜻합니다. 급격한 혈압 변화에 대한 즉각 반응은 민감도 변화가 아니라 발화율 변화입니다. (만성 고혈압에서는 설정점이 재조정 resetting되지만, 이 문제와는 다릅니다.)","3":"발화율 감소는 혈압이 **떨어질** 때의 반응입니다.","4":"압수용체는 바로 혈압(평균 동맥압)을 감지하는 수용체입니다."},"one":"혈압이 갑자기 오르면 압수용체(신장수용체)의 발화율이 증가한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q18) / 9b. Cardiovascular Physiology 2026.pdf, slides 62, 63","img":[{"u":"img/w11_cv_phys/p62.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 62","w":1200,"h":900},{"u":"img/w11_cv_phys/p63.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 63","w":1200,"h":900}],"ch":"w11_cv_phys","chn":"Cardiovascular Physiology","week":11},"w11_cv_phys-19":{"q":"Which of the following contributes to the regulation of mean arterial blood pressure?","o":["Baroreceptor firing rate.","Activation of RAAS.","Effects of aldosterone.","Changes in TPR.","All of the above."],"a":4,"qk":"다음 중 평균 동맥압(mean arterial blood pressure) 조절에 기여하는 것은 무엇입니까?","ok":["압수용체 발화율","RAAS(레닌-안지오텐신-알도스테론계) 활성화","알도스테론(aldosterone)의 효과","총말초저항(TPR)의 변화","위의 모두"],"exp":"**정답 이유**\n\n· A 압수용체 발화율: 초 단위의 **단기** 조절을 담당합니다.\n\n· B RAAS 활성화와 C 알도스테론: 소변으로 나가는 물과 Na⁺를 조절하는 **장기** 조절입니다. 알도스테론은 신장에서 Na⁺ 재흡수를 늘려 혈액량을 늘립니다.\n\n· D TPR: 평균 동맥압 ≈ 심박출량 × 총말초저항이므로 TPR은 동맥압을 직접 결정합니다.\n\n네 가지 모두 평균 동맥압 조절에 기여하므로 정답은 **E (위의 모두)**입니다.","why":{"0":"압수용체 발화율은 초 단위의 단기 조절에 기여하지만, 그것만으로는 불완전합니다. RAAS·알도스테론·TPR도 함께 평균 동맥압을 조절하므로 정답은 E(위의 모두)입니다.","1":"RAAS 활성화는 장기 조절에 기여하지만, 압수용체·알도스테론·TPR도 함께 관여하므로 정답은 E입니다.","2":"알도스테론은 신장에서 Na⁺ 재흡수를 늘려 혈액량을 늘리는 장기 조절 인자이지만, 이것만 고르면 불완전합니다. 정답은 E입니다.","3":"총말초저항(TPR)은 평균 동맥압 ≈ 심박출량 × TPR이므로 직접 기여하지만, 다른 기전도 모두 기여하므로 정답은 E입니다."},"one":"압수용체 발화, RAAS·알도스테론, 총말초저항(TPR) 변화가 모두 평균 동맥압 조절에 기여한다.","src":"9a. Cardiovascular Physiology Key Points 2026.docx (Study Q19) / 9b. Cardiovascular Physiology 2026.pdf, slides 61, 65","img":[{"u":"img/w11_cv_phys/p61.webp","cap":"9a. Cardiovascular Physiology Key Points 2026.docx / 9b. Cardiovascular Physiology 2026.pdf, slide 61","w":1200,"h":900},{"u":"img/w11_cv_phys/p65.webp","cap":"9a. Cardiovascular Physio
